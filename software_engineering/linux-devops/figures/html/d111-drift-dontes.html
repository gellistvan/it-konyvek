<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desired, observed, recorded és a drift-döntés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select id="sc" aria-label="Forgatókönyv"><option value="a">(a) 1. feladat: kernel 6.8.0-52 (labhost02)</option><option value="b">(b) openssh-server csomagdiff (23.1.3.3)</option><option value="c">(c) 3. feladat: sshd_config-hash eltér (labhost03)</option></select></label><script>const ALLSC = {"a": [{"node": "cmp", "line": -1, "msg": "(a) 1. feladat: kernel 6.8.0-52 (labhost02): desired = kernel_series: \"6.8\"; observed = kernel 6.8.0-52-generic; recorded = kernel 6.8.0-50-generic."}, {"node": "d1", "ans": "igen", "line": -1, "msg": "Egyezik az observed a desired-del? → igen"}, {"node": "e_nodrift", "line": -1, "msg": "Végállapot: nincs drift a desired-hez képest; a recorded-tól eltér → auditeltérés (change log hiányzik). Következő parancs: grep -i 'linux-image' /var/log/apt/history.log   # a frissítés dokumentálása, baseline frissítése"}], "b": [{"node": "cmp", "line": -1, "msg": "(b) openssh-server csomagdiff (23.1.3.3): desired = openssh-server 1:9.6p1-3ubuntu13~24.04.1; observed = openssh-server 1:9.6p1-3ubuntu13~24.04.2; recorded = openssh-server …24.04.1."}, {"node": "d1", "ans": "nem", "line": -1, "msg": "Egyezik az observed a desired-del? → nem"}, {"node": "d2", "ans": "nem", "line": -1, "msg": "Van jóváhagyott exception? → nem"}, {"node": "d3", "ans": "igen", "line": -1, "msg": "Van jóváhagyott change? → igen"}, {"node": "e_sot", "line": -1, "msg": "Végállapot: jóváhagyott security frissítés → SoT-commit (package-list frissítése). Következő parancs: git commit -m \"labhost01: package-list frissítés openssh-server 9.6p1-3ubuntu13~24.04.2\""}], "c": [{"node": "cmp", "line": -1, "msg": "(c) 3. feladat: sshd_config-hash eltér (labhost03): desired = sshd_config sha256 = SoT-hash; observed = sshd_config sha256 ≠ SoT-hash (kézi vim); recorded = d060 baseline hash."}, {"node": "d1", "ans": "nem", "line": -1, "msg": "Egyezik az observed a desired-del? → nem"}, {"node": "d2", "ans": "nem", "line": -1, "msg": "Van jóváhagyott exception? → nem"}, {"node": "d3", "ans": "nem", "line": -1, "msg": "Van jóváhagyott change? → nem"}, {"node": "e_restore", "line": -1, "msg": "Végállapot: nincs exception, nincs change → host visszaállítás + change log (incidens). Következő parancs: sudo cp lab-inventory/configs/labhost03/etc/ssh/sshd_config /etc/ssh/sshd_config && sudo sshd -t"}]}; document.getElementById("sc").addEventListener("change", e => { SC = e.target.value; setSteps(ALLSC[SC]); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A desired állapot Gitben, az observed a gyűjtőből, a recorded a baseline-ból; a drift az observed és a desired eltérése, amelyet exception vagy change-rekord dönt el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 23.1 példáiból. Az (a) esetben a 6.8.0-52 megfelel a desired kernel-sorozatnak, ezért nincs drift; a recorded baseline-tól való eltérés audit-, nem drift-kérdés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "cmp", "line": -1, "msg": "(a) 1. feladat: kernel 6.8.0-52 (labhost02): desired = kernel_series: \"6.8\"; observed = kernel 6.8.0-52-generic; recorded = kernel 6.8.0-50-generic."}, {"node": "d1", "ans": "igen", "line": -1, "msg": "Egyezik az observed a desired-del? → igen"}, {"node": "e_nodrift", "line": -1, "msg": "Végállapot: nincs drift a desired-hez képest; a recorded-tól eltér → auditeltérés (change log hiányzik). Következő parancs: grep -i 'linux-image' /var/log/apt/history.log   # a frissítés dokumentálása, baseline frissítése"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SC = "a";
const SCN = {"a": {"name": "(a) 1. feladat: kernel 6.8.0-52 (labhost02)", "desired": "kernel_series: \"6.8\"", "observed": "kernel 6.8.0-52-generic", "recorded": "kernel 6.8.0-50-generic", "match": true, "exc": null, "chg": null, "end": "nincs drift a desired-hez képest; a recorded-tól eltér → auditeltérés (change log hiányzik)", "cmd": "grep -i 'linux-image' /var/log/apt/history.log   # a frissítés dokumentálása, baseline frissítése"}, "b": {"name": "(b) openssh-server csomagdiff (23.1.3.3)", "desired": "openssh-server 1:9.6p1-3ubuntu13~24.04.1", "observed": "openssh-server 1:9.6p1-3ubuntu13~24.04.2", "recorded": "openssh-server …24.04.1", "match": false, "exc": false, "chg": true, "end": "jóváhagyott security frissítés → SoT-commit (package-list frissítése)", "cmd": "git commit -m \"labhost01: package-list frissítés openssh-server 9.6p1-3ubuntu13~24.04.2\""}, "c": {"name": "(c) 3. feladat: sshd_config-hash eltér (labhost03)", "desired": "sshd_config sha256 = SoT-hash", "observed": "sshd_config sha256 ≠ SoT-hash (kézi vim)", "recorded": "d060 baseline hash", "match": false, "exc": false, "chg": false, "end": "nincs exception, nincs change → host visszaállítás + change log (incidens)", "cmd": "sudo cp lab-inventory/configs/labhost03/etc/ssh/sshd_config /etc/ssh/sshd_config && sudo sshd -t"}};
function render(s){
  svg.setAttribute("viewBox", "0 0 640 440");
  svg.innerHTML = "";
  const sc = SCN[SC], seen = {};
  STEPS.slice(0, k + 1).forEach(t => seen[t.node] = t.ans || true);
  function box(x, y, w, h, title, body, dash, sw){
    el("rect", {x:x, y:y, width:w, height:h, rx:8, fill: css("--cell"), stroke: css("--line"), "stroke-width": sw, "stroke-dasharray": dash});
    el("text", {x:x+w/2, y:y+18, "text-anchor":"middle", "font-size":12, "font-weight":"bold"}, title);
    body.forEach((b, i) => el("text", {x:x+w/2, y:y+38+i*15, "text-anchor":"middle", "font-size":10.5}, b));
  }
  box(6, 8, 196, 82, "Desired (Git)", ["hosts/labhost01.yaml", sc.desired.slice(0, 34)], "", 4);
  box(222, 8, 196, 82, "Observed (gyűjtő)", ["collected/labhost01/", sc.observed.slice(0, 34)], "", 1.5);
  box(438, 8, 196, 82, "Recorded (d060)", ["baseline report", sc.recorded.slice(0, 34)], "2 3", 1.5);
  el("text", {x:212, y:108, "text-anchor":"middle", "font-size":11.5, "font-weight":"bold"}, "drift?");
  el("text", {x:428, y:108, "text-anchor":"middle", "font-size":11.5}, "változás?");
  const D = {d1:[180, 150, "egyezik a desired-del?"], d2:[180, 230, "jóváhagyott exception?"], d3:[180, 310, "jóváhagyott change?"]};
  const E = {e_nodrift:[380, 150, "nincs drift (recorded: audit)"], e_exc:[380, 230, "elfogadott átmeneti drift"], e_sot:[380, 310, "SoT-commit (desired frissítése)"], e_restore:[70, 380, "host visszaállítás + change log"]};
  Object.entries(D).forEach(([id, [x, y, t]]) => {
    const on = seen[id] !== undefined, cur = STEPS[k].node === id;
    el("polygon", {points:`${x},${y-28} ${x+120},${y} ${x},${y+28} ${x-120},${y}`, fill: on ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3.5 : 1.3});
    el("text", {x:x, y:y+4, "text-anchor":"middle", "font-size":11.5}, t);
    if (on && seen[id] !== true) el("text", {x:x+130, y:y-8, "font-size":11.5, "font-weight":"bold", fill: css("--hl")}, seen[id]);
  });
  Object.entries(E).forEach(([id, [x, y, t]]) => {
    const on = seen[id] !== undefined;
    el("rect", {x:x, y:y-18, width:240, height:36, rx:6, fill: on ? css("--cellhl") : css("--bg"), stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 3.5 : 1, "stroke-dasharray": id === "e_restore" ? "6 3" : ""});
    el("text", {x:x+120, y:y+5, "text-anchor":"middle", "font-size":11.5, "font-weight": on ? "bold" : "normal"}, t);
  });
  [[300,150,380],[300,230,380],[300,310,380]].forEach(([x0,y,x1]) => el("line", {x1:x0, y1:y, x2:x1, y2:y, stroke: css("--line")}));
  [[150+28,230-28],[230+28,310-28],[310+28,362]].forEach(([y0,y1]) => el("line", {x1:180, y1:y0, x2:180, y2:y1, stroke: css("--line")}));
  if (STEPS[k].node.indexOf("e_") === 0) el("text", {x:6, y:432, "font-size":11, "font-family":"ui-monospace,monospace", fill: css("--hl")}, "$ " + sc.cmd.slice(0, 92));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
