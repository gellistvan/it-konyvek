<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-secret-demo jelszavának adatútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><fieldset style="border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px"><legend class="small">Hibás beállítások (bekapcsolva = a hiba jelen van):</legend><label><input type="checkbox" id="c_env"> Environment=DB_PASSWORD=…</label><label><input type="checkbox" id="c_argv"> jelszó argv-ben átadva</label><label><input type="checkbox" id="c_nocore"> nincs LimitCORE=0</label><label><input type="checkbox" id="c_log"> a log hívás kiírja a jelszót</label></fieldset><script>["env","argv","nocore","log"].forEach(n => document.getElementById("c_" + n).addEventListener("change", e => { CFG[n] = e.target.checked; show(k); }));</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A jelszó a root-only fájlból a systemd credentialon át a processz memóriájába jut; az environ, cmdline, core, napló és backup csatornák a beállítástól függően nyitottak vagy zártak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 21.4 példájából. A javított alapállás: forrásfájl root:root 0600, LimitCORE=0 (a RestrictCore= nem létező direktíva), credential labapp 0400. A parancskimenetek várt értékek, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"kind": "path", "i": 0, "line": -1, "msg": "Adatút 1/5 – /etc/lab-secrets/db_password: plaintext, lemez; root:root 0600; csak root olvas."}, {"kind": "path", "i": 1, "line": -1, "msg": "Adatút 2/5 – PID 1 (systemd)LoadCredential=: plaintext; PID 1 memóriája; UID 0."}, {"kind": "path", "i": 2, "line": -1, "msg": "Adatút 3/5 – $CREDENTIALS_DIRECTORY/db_password: plaintext; ramfs/tmpfs; labapp 0400."}, {"kind": "path", "i": 3, "line": -1, "msg": "Adatút 4/5 – lab-secret-demomemória: plaintext, mlock; UID labapp; LimitCORE=0."}, {"kind": "path", "i": 4, "line": -1, "msg": "Adatút 5/5 – MySQL-kapcsolat(TLS): titkosított; (in transit)."}, {"kind": "leak", "i": 0, "line": -1, "msg": "Csatorna – /proc/<pid>/ environ"}, {"kind": "leak", "i": 1, "line": -1, "msg": "Csatorna – /proc/<pid>/ cmdline"}, {"kind": "leak", "i": 2, "line": -1, "msg": "Csatorna – core dump"}, {"kind": "leak", "i": 3, "line": -1, "msg": "Csatorna – journald"}, {"kind": "leak", "i": 4, "line": -1, "msg": "Csatorna – /var/backups/…/ db_password.age"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PATH = [{"id": "src", "t": "/etc/lab-secrets/\ndb_password", "d": "plaintext, lemez\nroot:root 0600\ncsak root olvas"}, {"id": "pid1", "t": "PID 1 (systemd)\nLoadCredential=", "d": "plaintext\nPID 1 memóriája\nUID 0"}, {"id": "cred", "t": "$CREDENTIALS_\nDIRECTORY/\ndb_password", "d": "plaintext\nramfs/tmpfs\nlabapp 0400"}, {"id": "mem", "t": "lab-secret-demo\nmemória", "d": "plaintext, mlock\nUID labapp\nLimitCORE=0"}, {"id": "tls", "t": "MySQL-kapcsolat\n(TLS)", "d": "titkosított\n(in transit)"}], LEAKS = [{"id": "environ", "t": "/proc/<pid>/\nenviron", "m": "0400 (UID, root)\nnyitja:\nEnvironment=", "opener": "env", "cmd": "sudo grep -c -a -i password /proc/$pid/environ", "closed": "0", "open": "1"}, {"id": "cmdline", "t": "/proc/<pid>/\ncmdline", "m": "0444 (mindenki)\nnyitja: jelszó\naz argv-ben", "opener": "argv", "cmd": "ps -o args= -p $pid | grep -c s3cret", "closed": "0", "open": "1"}, {"id": "core", "t": "core dump", "m": "systemd-coredump\nzárja:\nLimitCORE=0", "opener": "nocore", "cmd": "coredumpctl list lab-secret-demo", "closed": "No coredumps found.", "open": "… SIGSEGV present /usr/local/bin/lab-secret-demo"}, {"id": "journal", "t": "journald", "m": "std::cout / log\nzárja: javított\nlog hívás", "opener": "log", "cmd": "sudo journalctl -u lab-secret-demo | grep -c s3cret", "closed": "0", "open": "1"}, {"id": "backup", "t": "/var/backups/…/\ndb_password.age", "m": "age-titkosított\nrecovery key\noffline", "opener": null, "cmd": "head -c 21 /var/backups/lab-secrets/db_password.age", "closed": "age-encryption.org/v1", "open": "age-encryption.org/v1"}];
const CFG = {env:false, argv:false, nocore:false, log:false};
function isOpen(L){ return !!L.opener && CFG[L.opener]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 400");
  svg.innerHTML = "";
  const W = 118, xs = PATH.map((p, i) => 6 + i * 127);
  PATH.forEach((p, i) => {
    const on = s.kind === "path" && s.i === i, pt = p.d.indexOf("plaintext") === 0;
    el("rect", {x:xs[i], y:20, width:W, height:110, rx:8, fill: pt ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : 1.3});
    p.t.split("\n").forEach((t, j) => el("text", {x:xs[i]+W/2, y:40+j*14, "text-anchor":"middle", "font-size":11, "font-weight":"bold"}, t));
    p.d.split("\n").forEach((t, j) => el("text", {x:xs[i]+W/2, y:88+j*13, "text-anchor":"middle", "font-size":10}, t));
    if (i < 4) { el("line", {x1:xs[i]+W, y1:75, x2:xs[i+1]-6, y2:75, stroke: css("--line"), "stroke-width":2}); el("polygon", {points:`${xs[i+1]},75 ${xs[i+1]-8},71 ${xs[i+1]-8},79`, fill: css("--line")}); }
  });
  LEAKS.forEach((L, i) => {
    const o = isOpen(L), on = s.kind === "leak" && s.i === i, x = xs[i], y = 190;
    const sx = i === 4 ? xs[0] + W/2 : xs[3] + W/2 + (i - 2) * 8;
    el("line", {x1:sx, y1:130, x2:x+W/2, y2:y, stroke: o ? css("--hl2") : css("--muted"), "stroke-width": o ? 3 : 1, "stroke-dasharray": o ? "8 4" : "2 3"});
    el("rect", {x:x, y:y, width:W, height:100, rx:8, fill: o ? css("--cellhl") : css("--bg"), stroke: on ? css("--hl") : (o ? css("--hl2") : css("--line")), "stroke-width": (on || o) ? 3.5 : 1.2, "stroke-dasharray": o ? "8 4" : "3 3"});
    L.t.split("\n").forEach((t, j) => el("text", {x:x+W/2, y:y+18+j*13, "text-anchor":"middle", "font-size":10.5, "font-weight":"bold"}, t));
    L.m.split("\n").forEach((t, j) => el("text", {x:x+W/2, y:y+46+j*12, "text-anchor":"middle", "font-size":9.5}, t));
    const t = el("text", {x:x+W/2, y:y+92, "text-anchor":"middle", "font-size":12, "font-weight":"bold", fill: o ? css("--hl2") : css("--fg")}, o ? "NYITOTT" : "ZÁRT");
    if (!o) el("line", {x1:x+30, y1:y+96, x2:x+W-30, y2:y+82, stroke: css("--line"), "stroke-width":1.5});
  });
  let msg = s.msg;
  if (s.kind === "leak") {
    const L = LEAKS[s.i], o = isOpen(L);
    msg += ": " + (o ? "NYITOTT" : "zárt") + ". Ellenőrzés: " + L.cmd + " → " + (o ? L.open : L.closed);
    el("text", {x:10, y:318, "font-size":12, "font-family":"ui-monospace,monospace"}, "$ " + L.cmd);
    el("text", {x:10, y:338, "font-size":12, "font-family":"ui-monospace,monospace", fill: o ? css("--hl2") : css("--fg")}, (o ? L.open : L.closed));
  } else {
    el("text", {x:10, y:318, "font-size":11.5}, "A credential nem kerül az environmentbe; a program a fájlútvonalat kapja argumentumként, nem a jelszót.");
  }
  status.textContent = msg;
  const n = LEAKS.filter(isOpen).length;
  el("text", {x:10, y:372, "font-size":12, "font-weight":"bold"}, n ? `${n} nyitott szivárgási csatorna` : "Minden szivárgási csatorna zárt (javított alapállás).");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
