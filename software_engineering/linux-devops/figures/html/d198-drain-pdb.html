<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drain és PodDisruptionBudget</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>replicas <input id="rep" type="range" min="2" max="6" value="3" oninput="d198upd()"> <span id="repv">3</span></label><label>PDB <select id="mode" onchange="d198upd()"><option value="min">minAvailable</option><option value="max">maxUnavailable</option></select></label><input id="val" type="number" min="0" max="6" value="2" style="width:4em" onchange="d198upd()"><label>Podok a node-1-en <input id="on1" type="range" min="0" max="6" value="2" oninput="d198upd()"> <span id="on1v">2</span></label><label><input type="checkbox" id="nr" onchange="d198upd()"> új Pod nem lesz Ready</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három node, a lab-web Podjai; kubectl drain lab-node-1 lépésenként, Eviction API elfogadás vagy 429, kubectl get pdb várt sora."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell, nem mérés. allowed = currentHealthy − desiredHealthy; desiredHealthy = minAvailable, illetve replicas − maxUnavailable. A rolling update Pod-törlései nem az Eviction API-n mennek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"label": "S0: kiinduló állapot", "ev": null, "ok": null, "cordon": [], "pods": [{"name": "A", "node": 1, "ready": true, "gone": false}, {"name": "B", "node": 1, "ready": true, "gone": false}, {"name": "C", "node": 2, "ready": true, "gone": false}], "cur": 3, "des": 2, "allowed": 1, "msg": "S0: kiinduló állapot · PDB: current 3, desired 2, allowed 1"}, {"label": "S1: kubectl drain lab-node-1 → cordon (SchedulingDisabled)", "ev": null, "ok": null, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": false}, {"name": "B", "node": 1, "ready": true, "gone": false}, {"name": "C", "node": 2, "ready": true, "gone": false}], "cur": 3, "des": 2, "allowed": 1, "msg": "S1: kubectl drain lab-node-1 → cordon (SchedulingDisabled) · PDB: current 3, desired 2, allowed 1"}, {"label": "S2: evict A → elfogadva (allowed 1→0); a ReplicaSet létrehozza A′-t a lab-node-3-on", "ev": "A", "ok": true, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": false}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": false, "gone": false}], "cur": 2, "des": 2, "allowed": 0, "msg": "S2: evict A → elfogadva (allowed 1→0); a ReplicaSet létrehozza A′-t a lab-node-3-on · PDB: current 2, desired 2, allowed 0"}, {"label": "S3: evict B → 429 Cannot evict pod as it would violate the pod's disruption budget; a drain újrapróbál", "ev": "B", "ok": false, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": false}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": false, "gone": false}], "cur": 2, "des": 2, "allowed": 0, "msg": "S3: evict B → 429 Cannot evict pod as it would violate the pod's disruption budget; a drain újrapróbál · PDB: current 2, desired 2, allowed 0"}, {"label": "S4: A′ Ready → allowed 1", "ev": null, "ok": null, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": false}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": true, "gone": false}], "cur": 3, "des": 2, "allowed": 1, "msg": "S4: A′ Ready → allowed 1 · PDB: current 3, desired 2, allowed 1"}, {"label": "S5: evict B → elfogadva (allowed 1→0); a ReplicaSet létrehozza B′-t a lab-node-2-on", "ev": "B", "ok": true, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": true}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": true, "gone": false}, {"name": "B′", "node": 2, "ready": false, "gone": false}], "cur": 2, "des": 2, "allowed": 0, "msg": "S5: evict B → elfogadva (allowed 1→0); a ReplicaSet létrehozza B′-t a lab-node-2-on · PDB: current 2, desired 2, allowed 0"}, {"label": "S6: B′ Ready → allowed 1", "ev": null, "ok": null, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": true}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": true, "gone": false}, {"name": "B′", "node": 2, "ready": true, "gone": false}], "cur": 3, "des": 2, "allowed": 1, "msg": "S6: B′ Ready → allowed 1 · PDB: current 3, desired 2, allowed 1"}, {"label": "S7: a drain kész – a lab-node-1 üres", "ev": null, "ok": null, "cordon": [1], "pods": [{"name": "A", "node": 1, "ready": true, "gone": true}, {"name": "B", "node": 1, "ready": true, "gone": true}, {"name": "C", "node": 2, "ready": true, "gone": false}, {"name": "A′", "node": 3, "ready": true, "gone": false}, {"name": "B′", "node": 2, "ready": true, "gone": false}], "cur": 3, "des": 2, "allowed": 1, "msg": "S7: a drain kész – a lab-node-1 üres · PDB: current 3, desired 2, allowed 1"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function drain(replicas, mode, val, on1, never_ready, nodes){
  const names = []; for (let i = 0; i < replicas; i++) names.push(String.fromCharCode(65 + i));
  const pods = [];
  names.forEach((n, i) => { const node = i < on1 ? 1 : (nodes > 1 ? 2 + ((i - on1) % (nodes - 1)) : 1); pods.push({name: n, node: node, ready: true, gone: false}); });
  const desired = mode === "min" ? val : replicas - val, cordon = [];
  const health = () => { const cur = pods.filter(p => p.ready && !p.gone).length; return [cur, desired, Math.max(0, cur - desired)]; };
  const snap = (label, ev, ok) => { const [c, d, a] = health(); return {label: label, ev: ev === undefined ? null : ev, ok: ok === undefined ? null : ok, cordon: cordon.slice(), pods: pods.map(p => Object.assign({}, p)), cur: c, des: d, allowed: a}; };
  const steps = [snap("S0: kiinduló állapot")];
  cordon.push(1); steps.push(snap("S1: kubectl drain lab-node-1 → cordon (SchedulingDisabled)"));
  const queue = pods.filter(p => p.node === 1).map(p => p.name);
  let last = "evict", retries = 0, k = 2;
  for (let it = 0; it < 40; it++) {
    const pending = pods.filter(p => !p.ready && !p.gone);
    if (!queue.length && !pending.length) { steps.push(snap(`S${k}: a drain kész – a lab-node-1 üres`)); break; }
    if (queue.length && (["evict-ok", "ready", "evict"].includes(last) || !pending.length || never_ready) && !(last === "429" && pending.length && !never_ready)) {
      const name = queue[0], [c, d, a] = health();
      if (a > 0) { const p = pods.find(x => x.name === name); p.gone = true;
        const counts = {}; for (let n = 1; n <= nodes; n++) if (!cordon.includes(n)) counts[n] = pods.filter(x => x.node === n && !x.gone).length;
        const tgt = Object.keys(counts).map(Number).sort((x, y) => counts[x] - counts[y] || x - y)[0];
        pods.push({name: name + "′", node: tgt, ready: false, gone: false}); queue.shift();
        steps.push(snap(`S${k}: evict ${name} → elfogadva (allowed ${a}→${a - 1}); a ReplicaSet létrehozza ${name}′-t a lab-node-${tgt}-on`, name, true)); last = "evict-ok"; }
      else { steps.push(snap(`S${k}: evict ${name} → 429 Cannot evict pod as it would violate the pod's disruption budget; a drain újrapróbál`, name, false));
        last = "429"; retries += 1;
        if (never_ready && retries >= 2) { steps[steps.length - 1].label += " – az új Pod nem lesz Ready, a drain végtelenül újrapróbál"; break; } }
    } else { pending.forEach(p => p.ready = true); const [c, d, a] = health();
      steps.push(snap(`S${k}: ` + pending.map(p => p.name).join(", ") + ` Ready → allowed ${a}`)); last = "ready"; }
    k += 1;
  }
  return steps;
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  for (let n = 1; n <= 3; n++) { const x = 20 + (n - 1) * 205, cord = s.cordon.includes(n);
    el("rect", {x: x, y: 20, width: 190, height: 200, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": cord ? "6 3" : ""});
    el("text", {x: x + 8, y: 40, "font-size": 13, "font-weight": "bold"}, "lab-node-" + n + (cord ? " (cordon)" : ""));
    s.pods.filter(p => p.node === n).forEach((p, i) => { const cx = x + 30 + (i % 4) * 44, cy = 80 + Math.floor(i / 4) * 48;
      el("circle", {cx: cx, cy: cy, r: 17, fill: p.ready && !p.gone ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": p.gone ? "3 2" : ""});
      el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 13, fill: p.ready && !p.gone ? css("--bg") : css("--fg")}, p.name);
      if (p.gone) el("line", {x1: cx - 18, y1: cy + 18, x2: cx + 18, y2: cy - 18, stroke: css("--fg"), "stroke-width": 2});
      if (s.ev === p.name && s.ok === false && !p.gone) el("text", {x: cx + 18, y: cy - 10, "font-size": 18, "font-weight": "bold", fill: css("--hl2")}, "✗"); }); }
  const row = `lab-web-pdb   MIN AVAILABLE ${s.des}   ALLOWED DISRUPTIONS ${s.allowed}   (currentHealthy ${s.cur})`;
  el("text", {x: 20, y: 250, "font-size": 12, style: "font-family:ui-monospace,monospace"}, "$ kubectl get pdb -n lab-app");
  el("text", {x: 20, y: 270, "font-size": 12, style: "font-family:ui-monospace,monospace"}, row);
}
function d198upd(){
  const R = +document.getElementById("rep").value, mode = document.getElementById("mode").value, val = +document.getElementById("val").value;
  const on1 = Math.min(R, +document.getElementById("on1").value), nr = document.getElementById("nr").checked;
  document.getElementById("repv").textContent = R; document.getElementById("on1v").textContent = on1;
  setSteps(drain(R, mode, val, on1, nr, 3).map(s => Object.assign(s, {msg: s.label + ` · PDB: current ${s.cur}, desired ${s.des}, allowed ${s.allowed}`})));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
