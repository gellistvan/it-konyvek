<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Védelmi rétegek és bizalmi határok – lab-vm01</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szolgáltatás: <select id="mode" aria-label="Szolgáltatás futtatási módja"><option value="svc">lab-svc + drop-in</option><option value="root">root, drop-in nélkül</option></select></label><script>document.getElementById("mode").addEventListener("change", e => { MODE = e.target.value; show(k); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat egymásba ágyazott védelmi réteg; két kérésút (SSH és 8080) négy bizalmi határon át; a sandboxolt szolgáltatás kis blast radiusa a root-szolgáltatás nagyhoz képest."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 21.1 kidolgozott példájából (lab-vm01, 192.0.2.10/24); nem mérés. Az 1–5. lépés az SSH-út (a), a 6–10. a 8080-as alkalmazásút (b).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"layer": 1, "uid": "–", "tb": "TB1", "box": "pa", "msg": "a) 1/5 – kliens 192.0.2.0/24 → 192.0.2.10:22: az 1. réteg (nftables) csak a 192.0.2.0/24 forrást engedi az SSH-portra. TB1: internet → sshd. UID: még nincs.", "path": "a", "line": -1}, {"layer": 2, "uid": "0 (sshd, pre-auth)", "tb": "", "box": "sshd", "msg": "a) 2/5 – sshd: a 2. réteg csak kulcsos belépést enged (PasswordAuthentication no). Réteg: admin felület; a processz UID-je 0 (sshd).", "path": "a", "line": -1}, {"layer": 2, "uid": "lab-admin", "tb": "TB2", "box": "adm", "msg": "a) 3/5 – sikeres kulcsos hitelesítés: lab-admin munkamenet. TB2: SSH-felhasználó. UID: lab-admin.", "path": "a", "line": -1}, {"layer": 2, "uid": "lab-admin → 0", "tb": "TB3", "box": "sudo", "msg": "a) 4/5 – sudo: naplózott jogosultság-emelés (sudo napló). TB3: root shell határa.", "path": "a", "line": -1}, {"layer": 6, "uid": "0 (root)", "tb": "", "box": "root", "msg": "a) 5/5 – root shell: a teljes host elérhető; ezért kell a 2. réteg és a 6. réteg (audit) naplója.", "path": "a", "line": -1}, {"layer": 1, "uid": "–", "tb": "", "box": "pb", "msg": "b) 1/5 – kliens → 192.0.2.10:8080: az 1. réteg a 8080/tcp-t engedi (baseline: allowed_tcp_ports [22, 8080]). UID: még nincs.", "root": "b) 1/5 – kliens → 192.0.2.10:8080: a hálózati réteg ugyanaz; a különbség a hoszton belül jön.", "path": "b", "line": -1}, {"layer": 3, "uid": "lab-svc", "tb": "TB4", "box": "svc", "line": 2, "msg": "b) 2/5 – lab-cpp-svc fogadja a kérést. TB4: service account. 3. réteg: User=lab-svc, NoNewPrivileges, RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX. UID: lab-svc.", "root": "b) 2/5 – lab-cpp-svc root-ként fut (drop-in nélkül): nincs NoNewPrivileges, nincs címcsalád-szűrés. UID: 0.", "path": "b"}, {"layer": 4, "uid": "lab-svc", "tb": "", "box": "data", "line": 7, "msg": "b) 3/5 – 4. réteg: ProtectSystem=strict → minden rendszerkönyvtár csak olvasható; írható csak a ReadWriteDirectories=/var/lib/lab-cpp-svc.", "root": "b) 3/5 – nincs ProtectSystem: a root-processz a teljes fájlrendszert írhatja (/etc, /usr, /var …).", "path": "b"}, {"layer": 5, "uid": "lab-svc", "tb": "", "box": "svc", "msg": "b) 4/5 – 5. réteg: az AppArmor-profil (21.3) a path-alapú hozzáférést tovább szűkíti.", "root": "b) 4/5 – AppArmor-profil nélkül a MAC réteg sem szűkít.", "path": "b", "line": -1}, {"layer": 6, "uid": "lab-svc", "tb": "", "box": "blast", "msg": "b) 5/5 – blast radius kompromittáláskor: csak /var/lib/lab-cpp-svc írható, hálózat AF_INET/AF_INET6/AF_UNIX; a 6. réteg (audit) naplóz.", "root": "b) 5/5 – blast radius root-ként: a TELJES fájlrendszer és minden címcsalád – a kár nem korlátozott.", "path": "b", "line": -1}];
const CODE = ["# /etc/systemd/system/lab-cpp-svc.service.d/10-security.conf", "[Service]", "User=lab-svc", "Group=lab-svc", "NoNewPrivileges=true", "PrivateTmp=true", "ProtectSystem=strict", "ReadWriteDirectories=/var/lib/lab-cpp-svc", "RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX", "SystemCallArchitectures=native"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let MODE = "svc";
const LAYERS = [["1 Hálózat: nftables, SSH forrás-szűrés", []], ["2 Admin felület: sshd kulcs, PasswordAuthentication no, sudo napló", []], ["3 Processz: NoNewPrivileges, RestrictAddressFamilies, SystemCallArchitectures", [4, 8, 9]], ["4 Fájlrendszer: ProtectSystem=strict, ReadWriteDirectories=/var/lib/lab-cpp-svc", [5, 6, 7]], ["5 MAC: AppArmor", []]];
function hlLine(i){ codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on")); const L = document.getElementById("L" + i); if (L) L.classList.add("on"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 470");
  svg.innerHTML = "";
  const root = MODE === "root";
  if (root && s.root) status.textContent = s.root + "  [réteg " + s.layer + ", UID: " + (s.path === "b" ? "0 (root)" : s.uid) + "]";
  else status.textContent = s.msg + "  [réteg " + s.layer + ", UID: " + s.uid + "]";
  const fills = ["#f2f2f2","#e6e6e6","#dadada","#cecece","#c2c2c2"];
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  LAYERS.forEach((L, i) => {
    const x0 = 80 + 16*i, y0 = 18 + 22*i, x1 = 548 - 5*i, y1 = 390 - 10*i;
    const on = s.layer === i + 1;
    const off = root && s.path === "b" && i >= 2;
    const r = el("rect", {x:x0, y:y0, width:x1-x0, height:y1-y0, fill: dark ? css("--cell") : fills[i], stroke: on ? css("--hl") : css("--line"),
      "stroke-width": on ? 3.5 : 1.2, "stroke-dasharray": off ? "4 4" : "", style:"cursor:pointer"});
    r.addEventListener("click", () => { if (L[1].length) hlLine(L[1][0]); status.textContent = L[0] + (L[1].length ? " – drop-in sor kiemelve" : " – nem a drop-in része"); });
    el("text", {x:x0+5, y:y0+14, "font-size":11.5, "font-weight": on ? "bold" : "normal"}, L[0] + (off ? "  (root: nincs)" : ""));
  });
  const a6 = s.layer === 6;
  el("rect", {x:560, y:18, width:72, height:372, fill: css("--cell"), stroke: a6 ? css("--hl") : css("--line"), "stroke-width": a6 ? 3.5 : 1.2});
  const t6 = el("text", {x:600, y:204, "font-size":11.5, "text-anchor":"middle", transform:"rotate(-90 600 204)"}, "6 Audit: journald, sudo napló, drift-riasztás");
  function box(id, x, y, w, h, t1, t2){
    const on = s.box === id;
    el("rect", {x:x, y:y, width:w, height:h, rx:6, fill: on ? css("--cellhl") : css("--bg"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x:x+w/2, y:y+h/2-(t2?2:-4), "text-anchor":"middle", "font-size":12}, t1);
    if (t2) el("text", {x:x+w/2, y:y+h/2+13, "text-anchor":"middle", "font-size":11}, t2);
  }
  el("rect", {x:4, y:180, width:70, height:90, fill: css("--bg"), stroke: css("--line")});
  el("text", {x:39, y:220, "text-anchor":"middle", "font-size":12}, "kliens");
  el("text", {x:39, y:238, "text-anchor":"middle", "font-size":10.5}, "192.0.2.0/24");
  const ya = 160, yb = 290;
  // blast radius
  if (root && s.path === "b") el("rect", {x:84, y:126, width:458, height:254, fill:"url(#hatch)", stroke: css("--hl2"), "stroke-width":2, "stroke-dasharray":"6 3", opacity:0.9});
  else el("rect", {x:176, y:yb-34, width:360, height:68, fill:"url(#dots)", stroke: css("--line"), "stroke-dasharray":"2 3"});
  const defs = el("defs", {});
  defs.innerHTML = '<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="' + css("--muted") + '"/></pattern>' +
    '<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--hl2") + '" stroke-width="2"/></pattern>';
  box("sshd", 190, ya-20, 64, 40, "sshd");
  box("adm", 290, ya-20, 76, 40, "lab-admin", "(kulcs)");
  box("sudo", 392, ya-20, 52, 40, "sudo");
  box("root", 462, ya-20, 74, 40, "root shell", "UID 0");
  box("svc", 186, yb-22, 110, 44, "lab-cpp-svc", root ? "User=root (!)" : "User=lab-svc");
  box("data", 372, yb-22, 160, 44, "/var/lib/lab-cpp-svc", root ? "+ / teljes FS írható" : "egyetlen írható könyvtár");
  function line(x0,y0,x1,y1,dash,on){ el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke: on ? css("--hl") : css("--line"),"stroke-width": on ? 3 : 1.6,"stroke-dasharray":dash}); el("polygon",{points:`${x1},${y1} ${x1-9},${y1-4.5} ${x1-9},${y1+4.5}`, fill: on ? css("--hl") : css("--line"), transform:`rotate(${Math.atan2(y1-y0,x1-x0)*180/Math.PI} ${x1} ${y1})`}); }
  const A = s.path === "a", B = s.path === "b";
  line(74, 200, 190, ya, "", A); line(254, ya, 290, ya, "", A && s.box !== "sshd" && s.box !== "pa"); line(366, ya, 392, ya, "", A && (s.box==="sudo"||s.box==="root")); line(444, ya, 462, ya, "", A && s.box==="root");
  line(74, 250, 186, yb, "7 4", B); line(296, yb, 372, yb, "7 4", B && s.box !== "pb" && s.box !== "svc");
  el("text", {x:4, y:172, "font-size":11}, "→ 192.0.2.10:22");
  el("text", {x:4, y:290, "font-size":11}, "→ 192.0.2.10:8080");
  [["TB1",170,ya],["TB2",272,ya],["TB3",452,ya],["TB4",166,yb]].forEach(([n,x,y]) => {
    const on = s.tb === n;
    el("line", {x1:x, y1:y-34, x2:x, y2:y+34, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 5 : 3, "stroke-dasharray":"8 4"});
    el("text", {x:x, y:y+48, "text-anchor":"middle", "font-size":11.5, "font-weight":"bold"}, n);
  });
  el("text", {x:320, y:412, "text-anchor":"middle", "font-size":12}, root ? "Blast radius (root, drop-in nélkül): a teljes fájlrendszer (ferde csík)" : "Blast radius (lab-svc + drop-in): /var/lib/lab-cpp-svc + AF_INET/AF_INET6/AF_UNIX (pontminta)");
  el("text", {x:320, y:432, "text-anchor":"middle", "font-size":11, fill: css("--muted")}, "Rétegre kattintva a 10-security.conf megfelelő sora kiemelődik.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
