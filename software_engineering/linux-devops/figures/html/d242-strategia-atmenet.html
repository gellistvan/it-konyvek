<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling, blue–green, canary – podszám és forgalom</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<span class="small">Stratégia:</span>
<button data-st="rolling" aria-pressed="true">Rolling</button><button data-st="bg" aria-pressed="false">Blue–green</button><button data-st="canary" aria-pressed="false">Canary</button>
</div><div class="ctl">
<label>N <input id="iN" type="range" min="2" max="10" value="4"><span id="vN">4</span></label>
<label>maxSurge <input id="iS" type="range" min="0" max="3" value="1"><span id="vS">1</span></label>
<label>maxUnavailable <input id="iU" type="range" min="0" max="2" value="0"><span id="vU">0</span></label>
<label>szabad node-kapacitás <select id="iF"><option value="0">0m</option><option value="250">250m</option><option value="500">500m</option><option value="1000" selected>1000m</option><option value="2000">2000m</option><option value="4000">4000m</option></select></label>
</div><div class="ctl" role="group" aria-label="Lépések">
<button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
<input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása"><span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 420" role="img" aria-label="Rolling csúcs 5 pod, blue–green csúcs 8 pod, canary 4+1 pod; N=4, 250m CPU/pod."></svg>

<p class="small">Egyszerűsített modell (nem a Kubernetes-vezérlő pontos ütemezése), nem mérés. 49.2.12.1: N=6, maxSurge=2 → rolling csúcs 8 pod, blue–green 12 pod.</p>
<script>
const DATA = {};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

function hu(v,d){return Number(v).toFixed(d===undefined?1:d).replace(".",",").replace("-","−");}

const CPU=250;
function snap(old,nr,ns,np,msg,tr){const run=old+nr+ns; if(tr===undefined||tr===null) tr=(old+nr===0)?0:Math.round(100*nr/(old+nr));
  return {old:old,nr:nr,ns:ns,np:np,pods:run+np,cpu:run*CPU,ready:old+nr,tr:tr,msg:msg};}
function rolling(N,s,u,free){const cap=N+Math.floor(free/CPU); let old=N,nr=0,ns=0,np=0;
  const out=[snap(old,nr,ns,np,`Kiinduló állapot: ${N} régi (1.0.0) pod, mind Ready.`)];
  let guard=0;
  while(!(old===0&&nr===N) && guard++<100){let progress=false,ch=false;
    const room=cap-(old+nr+ns); if(np>0&&room>0){const k=Math.min(np,room);np-=k;ns+=k;ch=true;}
    const create=Math.min(N+s-(old+nr+ns+np),N-(nr+ns+np));
    if(create>0){const k=Math.min(create,Math.max(0,cap-(old+nr+ns)));ns+=k;np+=create-k;ch=true;}
    if(ch){progress=true;out.push(snap(old,nr,ns,np,"Új pod(ok) indul(nak) (maxSurge)"+(np?", de Pending: nincs szabad CPU":"")+"; még nem Ready."));}
    let did=false; if(ns>0){nr+=ns;ns=0;did=true;}
    const rem=Math.min(old,old+nr-(N-u)); if(rem>0){old-=rem;did=true;}
    if(did){progress=true;out.push(snap(old,nr,ns,np,`Az új pod(ok) Ready; ${Math.max(rem,0)} régi pod leáll (legalább ${N-u} kész pod marad).`));}
    if(!progress){const z=snap(old,nr,ns,np,"A rollout megáll: a surge pod Pending, a régi podok nem állnak le (maxUnavailable).");z.stuck=true;out.push(z);break;}
  }
  return out;}
function bluegreen(N,free){const cap=N+Math.floor(free/CPU), k=Math.max(0,Math.min(N,cap-N));
  const out=[snap(N,0,0,0,`Kiinduló állapot: ${N} blue (1.0.0) pod, a Service selector version=1.0.0.`,0)];
  out.push(snap(N,0,k,N-k,`A green deployment ${N} podja indul (double capacity)`+(k<N?", részben Pending":"")+"; forgalom 100% blue.",0));
  if(k<N){const z=snap(N,k,0,N-k,"A green nem teljes (Pending podok): a cutover nem indítható, a lépés megáll.",0);z.stuck=true;out.push(z);return out;}
  out.push(snap(N,N,0,0,"A green minden podja Ready, validálás; a forgalom még 100% blue.",0));
  out.push(snap(N,N,0,0,"Cutover: a selector version 1.0.0 → 1.1.0; az új kapcsolatok 100%-ban a greenre mennek.",100));
  out.push(snap(0,N,0,0,"Drain és megfigyelési ablak után a blue leáll; a kapacitás visszacsökken.",100));
  return out;}
function canary(N,free){const cap=N+Math.floor(free/CPU);
  const out=[snap(N,0,0,0,`Kiinduló állapot: ${N} stable (1.0.0) pod, weight 100/0.`,0)];
  if(cap<N+1){const z=snap(N,0,0,1,"A canary pod Pending (nincs szabad CPU): a forgalommegosztás nem indul.",0);z.stuck=true;out.push(z);return out;}
  out.push(snap(N,1,0,0,"1 canary (1.1.0) pod Ready; weight stable 95 / canary 5.",5));
  out.push(snap(N,1,0,0,"Gate (10 perces ablak): a canary success rate romlása ≤ 0,5 százalékpont → PASS.",5));
  out.push(snap(N,1,0,0,"A súly növelése: stable 80 / canary 20, további méréssel.",20));
  return out;}
let ST="rolling", SEQ=[], K=0;
const $=id=>document.getElementById(id);
function recompute(){const N=+$("iN").value,s=+$("iS").value,u=+$("iU").value,f=+$("iF").value;
  $("vN").textContent=N;$("vS").textContent=s;$("vU").textContent=u;
  const dis=(ST!=="rolling"); $("iS").disabled=dis; $("iU").disabled=dis;
  if(ST==="rolling"&&s===0&&u===0){SEQ=[Object.assign(snap(N,0,0,0,"maxSurge = maxUnavailable = 0 érvénytelen: a Deployment ezt nem fogadja el."),{stuck:true})];}
  else SEQ = ST==="rolling"?rolling(N,s,u,f):(ST==="bg"?bluegreen(N,f):canary(N,f));
  K=Math.min(K,SEQ.length-1); $("pos").max=SEQ.length-1;}
const LAB={rolling:["régi 1.0.0","új 1.1.0"],bg:["blue 1.0.0","green 1.1.0"],canary:["stable 1.0.0","canary 1.1.0"]};
function draw(){
  const s=SEQ[K]; $("pos").value=K; $("cnt").textContent=`${K+1}/${SEQ.length}`;
  const pk=SEQ.reduce((a,x)=>[Math.max(a[0],x.pods),Math.max(a[1],x.cpu)],[0,0]);
  status.textContent=`${K}. lépés: ${s.msg} Podok: ${s.pods} · CPU-igény: ${s.cpu}m · kész replikák: ${s.ready} · forgalom: új ${s.tr}% · csúcs: ${pk[0]} pod / ${pk[1]}m`;
  svg.innerHTML=""; dg_defs(svg); svg.setAttribute("viewBox","0 0 1000 420");
  const fg=dg_css("--fg"), L=LAB[ST];
  dg_text(svg,20,40,L[0],18,{anchor:"start",bold:true}); dg_text(svg,20,150,L[1],18,{anchor:"start",bold:true});
  const w=64;
  for(let j=0;j<s.old;j++){dg_mk(svg,"rect",{x:170+j*(w+10),y:15,width:w,height:50,fill:dg_css("--cell"),stroke:fg,"stroke-width":2});}
  const cells=[].concat(Array(s.nr).fill("n"),Array(s.ns).fill("s"),Array(s.np).fill("p"));
  cells.forEach((t,j)=>{const x=170+j*(w+10),y=125;
    dg_mk(svg,"rect",{x:x,y:y,width:w,height:50,fill:t==="n"?fg:dg_css("--cell"),stroke:fg,"stroke-width":2,"stroke-dasharray":t==="p"?"6 4":""});
    if(t==="s")dg_mk(svg,"rect",{x:x,y:y,width:w,height:50,fill:"url(#dghatch)",opacity:0.6});
    if(t==="p")dg_text(svg,x+w/2,y+25,"Pending",13,{});});
  // forgalom
  const yb=250, tot=900; dg_text(svg,20,yb-14,"forgalom (Service / route súly):",15,{anchor:"start"});
  const wo=tot*(100-s.tr)/100;
  dg_mk(svg,"rect",{x:50,y:yb,width:wo,height:36,fill:dg_css("--cell"),stroke:fg,"stroke-width":1.5});
  if(s.tr>0)dg_mk(svg,"rect",{x:50+wo,y:yb,width:tot-wo,height:36,fill:dg_css("--fill2"),stroke:fg,"stroke-width":1.5});
  if(100-s.tr>0)dg_text(svg,50+wo/2,yb+18,`${L[0]}: ${100-s.tr}%`,15,{});
  if(s.tr>0)dg_text(svg,50+wo+(tot-wo)/2,yb+18,`${L[1]}: ${s.tr}%`,15,{bold:true});
  dg_text(svg,20,330,`podok: ${s.pods} · CPU-igény: ${s.cpu}m (250m/pod) · kész replikák: ${s.ready}`,17,{anchor:"start"});
  dg_text(svg,20,362,`csúcs ebben a lejátszásban: ${pk[0]} pod / ${pk[1]}m`+(s.stuck?"   ⚠ a lépés megáll":""),17,{anchor:"start",bold:!!s.stuck});
  dg_text(svg,20,400,"□ régi/blue/stable  ■ új, Ready  ▨ új, még nem Ready  ┅ Pending (nincs szabad CPU)",14,{anchor:"start"});
  document.querySelectorAll("button[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===ST?"true":"false"));
}
document.querySelectorAll("button[data-st]").forEach(b=>b.onclick=()=>{ST=b.dataset.st;K=0;recompute();draw();});
["iN","iS","iU","iF"].forEach(id=>$(id).addEventListener("input",()=>{K=0;recompute();draw();}));
$("first").onclick=()=>{K=0;draw();}; $("prev").onclick=()=>{K=Math.max(0,K-1);draw();};
$("next").onclick=()=>{K=Math.min(SEQ.length-1,K+1);draw();}; $("pos").oninput=()=>{K=+$("pos").value;draw();};
recompute();

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
