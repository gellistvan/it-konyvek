<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconcile-lánc és generációk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="d192fin('create')">ConfigMap + finalizer</button><button onclick="d192fin('delete')">kubectl delete configmap lab-final</button><button onclick="d192fin('remove')">finalizer eltávolítása</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Deployment, ReplicaSet és Podok spec/status mezői t0–t3 között; az éppen író vezérlő kiemelve; finalizeres ConfigMap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 2. feladat adatai (lab-cache, 2 → 3 replika, dummy image → ImagePullBackOff). A resourceVersion minden íráskor megváltozik; értékét nem számként mutatjuk.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": "t0", "who": "kubectl", "changed": ["gen", "spec"], "msg": "t0: kubectl apply (replicas=2) → az apiserver eltárolja a spec-et; generation 1, resourceVersion megváltozott.", "line": -1, "gen": 1, "obs": null, "spec": 2, "sreplicas": null, "avail": null, "rs": null, "pods": []}, {"t": "t1", "who": "Deployment controller", "changed": ["rs"], "msg": "t1a: a Deployment controller olvassa a spec-et, létrehozza a ReplicaSetet (ownerReferences → Deployment, controller: true), replicas 2.", "line": 1, "gen": 1, "obs": null, "spec": 2, "sreplicas": null, "avail": null, "rs": 2, "pods": []}, {"t": "t1", "who": "ReplicaSet controller", "changed": ["pods"], "msg": "t1b: a ReplicaSet controller létrehoz 2 Podot (ownerReferences → ReplicaSet).", "line": 2, "gen": 1, "obs": null, "spec": 2, "sreplicas": null, "avail": null, "rs": 2, "pods": ["Pending", "Pending"]}, {"t": "t1", "who": "kubelet", "changed": ["pods"], "msg": "t1c: a kubelet nem tudja lehúzni a dummy image-et: Pod status ImagePullBackOff.", "line": 3, "gen": 1, "obs": null, "spec": 2, "sreplicas": null, "avail": null, "rs": 2, "pods": ["ImagePullBackOff", "ImagePullBackOff"]}, {"t": "t1", "who": "Deployment controller", "changed": ["obs", "sreplicas", "avail"], "msg": "t1d: a Deployment controller frissíti a status-t: observedGeneration 1, replicas 2, availableReplicas 0.", "line": 4, "gen": 1, "obs": 1, "spec": 2, "sreplicas": 2, "avail": 0, "rs": 2, "pods": ["ImagePullBackOff", "ImagePullBackOff"]}, {"t": "t2", "who": "kubectl", "changed": ["gen", "spec"], "msg": "t2: kubectl apply (replicas=3) → generation 2, de observedGeneration még 1: a vezérlő lemaradt.", "line": -1, "gen": 2, "obs": 1, "spec": 3, "sreplicas": 2, "avail": 0, "rs": 2, "pods": ["ImagePullBackOff", "ImagePullBackOff"]}, {"t": "t3", "who": "Deployment controller", "changed": ["rs"], "msg": "t3a: a Deployment controller a ReplicaSet spec.replicas-át 3-ra írja.", "line": 1, "gen": 2, "obs": 1, "spec": 3, "sreplicas": 2, "avail": 0, "rs": 3, "pods": ["ImagePullBackOff", "ImagePullBackOff"]}, {"t": "t3", "who": "ReplicaSet controller", "changed": ["pods"], "msg": "t3b: a ReplicaSet controller létrehozza a 3. Podot.", "line": 2, "gen": 2, "obs": 1, "spec": 3, "sreplicas": 2, "avail": 0, "rs": 3, "pods": ["ImagePullBackOff", "ImagePullBackOff", "Pending"]}, {"t": "t3", "who": "Deployment controller", "changed": ["obs", "sreplicas", "avail"], "msg": "t3c: observedGeneration 2 = generation; spec.replicas 3, status.replicas 3, availableReplicas 0 (dummy image).", "line": 4, "gen": 2, "obs": 2, "spec": 3, "sreplicas": 3, "avail": 0, "rs": 3, "pods": ["ImagePullBackOff", "ImagePullBackOff", "ImagePullBackOff"]}];
const CODE = ["Deployment controller: olvassa Deployment.spec (generation)", "  → létrehozza/frissíti a ReplicaSetet (ownerReferences → Deployment)", "ReplicaSet controller: olvassa RS.spec.replicas → létrehoz/töröl Podokat", "kubelet: olvassa Pod.spec → futtat, írja Pod.status", "Deployment controller: írja Deployment.status (observedGeneration, availableReplicas)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let FIN = "nincs";   // ConfigMap lab-final: nincs / él (finalizer) / törlés alatt / törölve
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330");
  svg.innerHTML = "";
  const box = (x, y, w, title, rows, hl) => { el("rect", {x: x, y: y, width: w, height: 22 + rows.length * 17, fill: css("--cell"), stroke: hl ? css("--hl") : css("--line"), "stroke-width": hl ? 3 : 1.2});
    el("text", {x: x + 6, y: y + 15, "font-size": 12, "font-weight": "bold", style: "font-family:ui-monospace,monospace"}, title);
    rows.forEach(([t, on], i) => { if (on) el("rect", {x: x + 2, y: y + 20 + i * 17, width: w - 4, height: 16, fill: css("--cellhl")});
      el("text", {x: x + 8, y: y + 32 + i * 17, "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, t); }); };
  const c = s.changed, v = x => x === null ? "–" : x;
  box(10, 10, 360, "Deployment lab-cache", [["metadata.generation: " + s.gen, c.includes("gen")], ["spec.replicas: " + v(s.spec), c.includes("spec")],
     ["status.observedGeneration: " + v(s.obs) + (s.obs !== null && s.obs < s.gen ? "  ← lemaradás" : ""), c.includes("obs")],
     ["status.replicas: " + v(s.sreplicas) + ", availableReplicas: " + v(s.avail), c.includes("sreplicas")], ["resourceVersion: megváltozott", c.length > 0]], s.who === "kubectl");
  if (s.rs !== null) box(10, 130, 360, "ReplicaSet lab-cache-<hash>", [["ownerReferences → Deployment (controller: true)", false], ["spec.replicas: " + s.rs, c.includes("rs")]], false);
  s.pods.forEach((p, i) => { el("rect", {x: 10 + i * 112, y: 210, width: 104, height: 44, fill: c.includes("pods") ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    el("text", {x: 62 + i * 112, y: 228, "text-anchor": "middle", "font-size": 11}, "Pod " + (i + 1) + " → RS");
    el("text", {x: 62 + i * 112, y: 245, "text-anchor": "middle", "font-size": 10.5}, p); });
  [["kubectl", 40], ["Deployment controller", 110], ["ReplicaSet controller", 180], ["kubelet", 240]].forEach(([n, y]) => {
    const on = s.who === n; el("circle", {cx: 420, cy: y, r: 16, fill: on ? css("--hl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: 445, y: y + 4, "font-size": 12, "font-weight": on ? "bold" : "normal"}, n + (on ? " ír" : "")); });
  el("text", {x: 400, y: 290, "font-size": 12, "font-weight": "bold"}, "ConfigMap lab-final (3. feladat): " + FIN);
  if (FIN === "törlés alatt") el("text", {x: 400, y: 308, "font-size": 11}, "metadata.deletionTimestamp beállítva, finalizers: [example.invalid/lab-cleanup]");
}
function d192fin(a){
  if (a === "create") FIN = "él, finalizers: [example.invalid/lab-cleanup]";
  if (a === "delete") FIN = FIN.startsWith("él") ? "törlés alatt" : (FIN === "nincs" ? "nincs (NotFound)" : FIN);
  if (a === "remove") FIN = FIN === "törlés alatt" ? "törölve (a finalizer eltávolítása után)" : FIN;
  show(k);
  status.textContent = "ConfigMap lab-final: " + FIN + (FIN === "törlés alatt" ? " – az objektum megmarad, amíg a finalizert el nem távolítjuk (kubectl patch … finalizers: [])." : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
