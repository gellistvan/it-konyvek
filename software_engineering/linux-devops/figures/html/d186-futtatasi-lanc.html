<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futtatási lánc és folyamatfa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="d186restart()">containerd restart</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A docker run vezérlési lánca (CLI, docker.sock, dockerd, containerd, shim, runc, sleep) és a valós folyamatfa lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A vezérlési lánc (bal) és a folyamatfa (jobb) eltér: a dockerd, a containerd és a shim mind a systemd (PID 1) gyermeke; a runc a konténer indítása után kilép. Podmannál ugyanígy a conmon a systemd --user alá kerül (a statikus ábrán).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"act": -1, "procs": ["systemd", "dockerd", "containerd"], "gone": [], "msg": "Kiinduló állapot: a dockerd és a containerd két külön, PID 1 (systemd) alatti szolgáltatás."}, {"act": 0, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "docker run -d … sleep 300: a CLI (labuser) csak API-kérést küld."}, {"act": 1, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A kérés a /var/run/docker.sock (root:docker) socketen megy át – ez a host authority határ: aki írhat ide, root jogot kap."}, {"act": 2, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A dockerd (root) végrehajtja a create/start kérést, és gRPC-n továbbadja a containerd-nek."}, {"act": 3, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A containerd (root) elindítja a konténer shimjét."}, {"act": 4, "procs": ["systemd", "dockerd", "containerd", "docker", "shim"], "gone": [], "msg": "A containerd-shim-runc-v2 leválik (daemonizál): a szülője a systemd (PPID 1), nem a containerd."}, {"act": 5, "procs": ["systemd", "dockerd", "containerd", "docker", "shim", "runc"], "gone": [], "msg": "A shim meghívja a runc create/start-ot: namespace-ek, cgroup, mountok."}, {"act": 6, "procs": ["systemd", "dockerd", "containerd", "docker", "shim", "sleep"], "gone": ["runc"], "msg": "runc kilépett, a sleep szülője a shim (PPID 1 alatti)."}, {"act": 6, "procs": ["systemd", "dockerd", "containerd", "shim", "sleep"], "gone": ["runc", "docker"], "msg": "A docker CLI (-d) visszatér és kilép; a konténer a shim alatt fut tovább."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CHAIN = ["docker CLI (labuser)", "/var/run/docker.sock root:docker", "dockerd (root)", "containerd (root)", "containerd-shim-runc-v2", "runc create", "sleep 300 (konténer PID 1)"];
const ROOTC = [false, true, true, true, true, true, true];
const TN = {systemd: ["systemd (PID 1)", 500, 40, null], dockerd: ["dockerd", 365, 110, "systemd"], containerd: ["containerd", 460, 110, "systemd"],
  shim: ["containerd-shim-runc-v2", 620, 110, "systemd"], sleep: ["sleep 300", 620, 230, "shim"], runc: ["runc", 520, 230, "shim"],
  docker: ["docker CLI", 380, 290, null]};
function render(s){
  svg.setAttribute("viewBox", "0 0 720 330");
  svg.innerHTML = "";
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "Vezérlési lánc (docker run)");
  CHAIN.forEach((l, i) => {
    const y = 28 + i * 42, on = i === s.act, gone = (i === 5 && s.gone.includes("runc")) || (i === 3 && s.gone.includes("containerd"));
    el("rect", {x: 10, y: y, width: 230, height: 30, rx: 5, fill: on ? css("--cellhl") : (ROOTC[i] ? css("--code") : css("--cell")), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : (i === 1 ? 3 : 1), "stroke-dasharray": gone ? "4 3" : ""});
    el("text", {x: 125, y: y + 19, "text-anchor": "middle", "font-size": 11.5, style: "font-family:ui-monospace,monospace", "text-decoration": gone ? "line-through" : ""}, l + (gone ? (i === 5 ? " (kilépett)" : " (leállt)") : ""));
    if (i < CHAIN.length - 1) el("line", {x1: 125, y1: y + 30, x2: 125, y2: y + 42, stroke: css("--line"), "stroke-width": 1.2});
    if (i === 1) el("text", {x: 245, y: y + 19, "font-size": 10.5, "font-weight": "bold"}, "host authority");
  });
  el("text", {x: 330, y: 18, "font-size": 13, "font-weight": "bold"}, "Valós folyamatfa (PPID)");
  const shown = Object.keys(TN).filter(k => s.procs.includes(k) || s.gone.includes(k));
  shown.forEach(k => { const [n, x, y, p] = TN[k]; if (p && shown.includes(p)) { const P = TN[p];
    el("line", {x1: P[1], y1: P[2] + 14, x2: x, y2: y - 14, stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": "2 3"}); } });
  shown.forEach(k => { const [n, x, y] = TN[k], gone = s.gone.includes(k), w = n.length * 7 + 16;
    el("rect", {x: x - w / 2, y: y - 14, width: w, height: 28, rx: 5, fill: gone ? css("--bg") : (k === "docker" ? css("--cell") : css("--code")), stroke: css("--line"), "stroke-dasharray": gone ? "4 3" : ""});
    el("text", {x: x, y: y + 4, "text-anchor": "middle", "font-size": 11, style: "font-family:ui-monospace,monospace", "text-decoration": gone ? "line-through" : ""}, n); });
  el("text", {x: 330, y: 322, "font-size": 10.5, fill: css("--muted")}, "pontozott = szülő–gyermek · szürke = root · áthúzott = kilépett/leállt");
}
function d186restart(){ setSteps(BASESTEPS.concat(RESTARTSTEPS)); show(BASESTEPS.length); }
const BASESTEPS = [{"act": -1, "procs": ["systemd", "dockerd", "containerd"], "gone": [], "msg": "Kiinduló állapot: a dockerd és a containerd két külön, PID 1 (systemd) alatti szolgáltatás."}, {"act": 0, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "docker run -d … sleep 300: a CLI (labuser) csak API-kérést küld."}, {"act": 1, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A kérés a /var/run/docker.sock (root:docker) socketen megy át – ez a host authority határ: aki írhat ide, root jogot kap."}, {"act": 2, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A dockerd (root) végrehajtja a create/start kérést, és gRPC-n továbbadja a containerd-nek."}, {"act": 3, "procs": ["systemd", "dockerd", "containerd", "docker"], "gone": [], "msg": "A containerd (root) elindítja a konténer shimjét."}, {"act": 4, "procs": ["systemd", "dockerd", "containerd", "docker", "shim"], "gone": [], "msg": "A containerd-shim-runc-v2 leválik (daemonizál): a szülője a systemd (PPID 1), nem a containerd."}, {"act": 5, "procs": ["systemd", "dockerd", "containerd", "docker", "shim", "runc"], "gone": [], "msg": "A shim meghívja a runc create/start-ot: namespace-ek, cgroup, mountok."}, {"act": 6, "procs": ["systemd", "dockerd", "containerd", "docker", "shim", "sleep"], "gone": ["runc"], "msg": "runc kilépett, a sleep szülője a shim (PPID 1 alatti)."}, {"act": 6, "procs": ["systemd", "dockerd", "containerd", "shim", "sleep"], "gone": ["runc", "docker"], "msg": "A docker CLI (-d) visszatér és kilép; a konténer a shim alatt fut tovább."}], RESTARTSTEPS = [{"act": 3, "procs": ["systemd", "dockerd", "shim", "sleep"], "gone": ["containerd"], "msg": "sudo systemctl restart containerd: a containerd leáll – a shim és a sleep 300 megmarad (nem a containerd gyermekei)."}, {"act": 3, "procs": ["systemd", "dockerd", "containerd", "shim", "sleep"], "gone": [], "msg": "A containerd újraindult, és a shim socketjén újra felveszi a kapcsolatot a futó konténerrel."}];


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
