<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A két netem-qdisc helye és iránya</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Profil: <select onchange="d7prof(this.value)"><option value="delay">delay</option><option value="base">base</option><option value="loss">loss</option><option value="timeout">timeout</option><option value="asym">asym (2. feladat)</option></select></label> <label>lab-r1 delay <input id="d7d1" type="range" min="0" max="100" value="20" oninput="d7recalc()"> <span id="d7d1v">20 ms</span></label> <label>lab-r0 delay <input id="d7d0" type="range" min="0" max="100" value="20" oninput="d7recalc()"> <span id="d7d0v">20 ms</span></label> <label>lab-r1 loss <input id="d7l" type="range" min="0" max="100" value="0" oninput="d7recalc()"> <span id="d7lv">0%</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A lab-r1 kimenete a kliens→szerver adatot és SYN-t, a lab-r0 kimenete a szerver→kliens ACK-ot késlelteti; két 20 ms-os qdisc 40 ms RTT-növekedést ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított várakozás, nem mérés. A qdisc a kimeneti (egress) oldalon hat: a lab-r1 a szerver felé, a lab-r0 a kliens felé küldött csomagokat késlelteti. A kezdőállapot a delay profil (20 + 20 ms).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"pkt": "SYN", "dir": "r", "drop": false, "msg": "SYN →: a lab-r1 kimeneti netem-je 20 ms-mal késlelteti.", "d1": 20, "d0": 20, "loss": 0}, {"pkt": "SYN-ACK", "dir": "l", "drop": false, "msg": "SYN-ACK ←: a lab-r0 kimeneti netem-je 20 ms-mal késlelteti.", "d1": 20, "d0": 20, "loss": 0}, {"pkt": "adat", "dir": "r", "drop": false, "msg": "Adat →: ismét a lab-r1 kimenete (20 ms).", "d1": 20, "d0": 20, "loss": 0}, {"pkt": "ACK", "dir": "l", "drop": false, "msg": "ACK ←: a lab-r0 kimenete (20 ms).", "d1": 20, "d0": 20, "loss": 0}, {"pkt": "", "dir": "", "drop": false, "msg": "RTT ≈ baseline + 40 ms (20 + 20).", "d1": 20, "d0": 20, "loss": 0}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function d7defs(){
  const c = css("--line"), h = css("--hl"), h2 = css("--hl2");
  svg.innerHTML = '<defs>' +
   '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+c+'"/></marker>' +
   '<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+h+'"/></marker>' +
   '<marker id="ahh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+h2+'"/></marker>' +
   '<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="'+c+'" stroke-width="1.2"/></pattern>' +
   '<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="'+c+'"/></pattern>' +
   '</defs>';
}
function T(x, y, t, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 12, "text-anchor": o.a || "middle"};
  if (o.fill) a.fill = o.fill; if (o.b) a["font-weight"] = "bold"; if (o.mono){ a.style = "white-space:pre;font-family:ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace"; }
  if (o.it) a["font-style"] = "italic"; return el("text", a, t); }
function R(x, y, w, h, o){ o = o || {}; return el("rect", {x: x, y: y, width: w, height: h, rx: o.rx === undefined ? 5 : o.rx,
  fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.w || 1.3, "stroke-dasharray": o.d || ""}); }
function L(x1, y1, x2, y2, o){ o = o || {}; const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.c || css("--line"),
  "stroke-width": o.w || 1.6}; if (o.d) a["stroke-dasharray"] = o.d; if (o.m) a["marker-end"] = "url(#" + o.m + ")"; return el("line", a); }
function X(x, y, s, c){ s = s || 7; c = c || css("--hl2"); L(x - s, y - s, x + s, y + s, {c: c, w: 3}); L(x - s, y + s, x + s, y - s, {c: c, w: 3}); }
function d7fmt(v, d){ return v.toFixed(d === undefined ? 1 : d).replace(".", ",").replace("-", "−"); }

const PROF = {"base": [0, 0, 0], "delay": [20, 20, 0], "loss": [20, 20, 1], "timeout": [20, 20, 100], "asym": [20, 40, 0]};
function d7steps(d1, d0, loss){
  const S = [{pkt: "SYN", dir: "r", drop: loss >= 100, msg: "SYN →: a lab-r1 kimeneti netem-je " + d1 + " ms-mal késlelteti" +
    (loss >= 100 ? ", és (100% loss) eldobja: a lab-s0 capture-ben nem jelenik meg." : (loss ? ", " + loss + "% eséllyel eldobhatja." : "."))}];
  if (loss >= 100){ S.push({pkt: "SYN", dir: "r", drop: true, msg: "SYN-ismétlések is elvesznek → connect timeout (2 s); a kapcsolat nem épül fel."}); }
  else {
    S.push({pkt: "SYN-ACK", dir: "l", drop: false, msg: "SYN-ACK ←: a lab-r0 kimeneti netem-je " + d0 + " ms-mal késlelteti."});
    S.push({pkt: "adat", dir: "r", drop: false, msg: "Adat →: ismét a lab-r1 kimenete (" + d1 + " ms" + (loss ? ", " + loss + "% loss" : "") + ")."});
    S.push({pkt: "ACK", dir: "l", drop: false, msg: "ACK ←: a lab-r0 kimenete (" + d0 + " ms)."});
    S.push({pkt: "", dir: "", drop: false, msg: "RTT ≈ baseline + " + (d1 + d0) + " ms (" + d1 + " + " + d0 + ")" + (loss ? "; drop csak a kliens → szerver irányban (≈ " + loss + "%)" : "") + "."});
  }
  S.forEach(s => { s.d1 = d1; s.d0 = d0; s.loss = loss; });
  return S;
}
function d7par(){ return [+document.getElementById("d7d1").value, +document.getElementById("d7d0").value, +document.getElementById("d7l").value]; }
function d7lbl(){ const p = d7par(); document.getElementById("d7d1v").textContent = p[0] + " ms"; document.getElementById("d7d0v").textContent = p[1] + " ms";
  document.getElementById("d7lv").textContent = p[2] + "%"; return p; }
function d7prof(v){ const p = PROF[v]; document.getElementById("d7d1").value = p[0]; document.getElementById("d7d0").value = p[1]; document.getElementById("d7l").value = p[2]; d7recalc(); }
function d7recalc(){ const p = d7lbl(); setSteps(d7steps(p[0], p[1], p[2])); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300");
  d7defs();
  const yU = 95, yL = 175;
  R(5, 70, 130, 130); T(70, 100, "lab-tcp-c", {b: 1}); T(70, 120, "lab-c0", {fs: 11}); T(70, 138, "10.203.135.1/30", {fs: 11});
  R(250, 50, 260, 170, {fill: css("--cellhl")}); T(380, 212, "lab-tcp-r (forwarding)", {b: 1});
  T(258, 140, "lab-r0 .2", {a: "start", fs: 11}); T(502, 140, "lab-r1 .5", {a: "end", fs: 11});
  R(625, 70, 130, 130); T(690, 100, "lab-tcp-s", {b: 1}); T(690, 120, "lab-s0", {fs: 11}); T(690, 138, ".135.6:5201", {fs: 11});
  // qdisc-ek (kettős keret)
  R(515, 18, 105, 48, {rx: 3}); R(519, 22, 97, 40, {rx: 2});
  T(567, 38, "netem " + s.d1 + " ms", {fs: 11, b: 1}); T(567, 54, "loss " + s.loss + "%", {fs: 11});
  R(140, 205, 105, 40, {rx: 3}); R(144, 209, 97, 32, {rx: 2}); T(192, 230, "netem " + s.d0 + " ms", {fs: 11, b: 1});
  // sávok
  L(135, yU, 625, yU, {w: 1, c: css("--muted")}); L(625, yL, 135, yL, {w: 1, c: css("--muted"), d: "6 4"});
  T(380, yU - 8, "kliens → szerver: SYN, adat (folytonos)", {fs: 11}); T(380, yL + 20, "szerver → kliens: SYN-ACK, ACK (szaggatott)", {fs: 11});
  [[135, 135], [625, 135]].forEach(p => { el("circle", {cx: p[0], cy: p[1], r: 8, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5}); el("circle", {cx: p[0], cy: p[1], r: 3, fill: css("--line")}); });
  T(70, 215, "◉ capture lab-c0", {fs: 10.5}); T(690, 215, "◉ capture lab-s0", {fs: 10.5});
  if (s.dir === "r"){
    const xe = s.drop ? 560 : 622;
    L(138, yU, xe, yU, {c: css("--hl"), w: 3.5, m: "ahh"}); R(300, yU - 30, 60, 20, {rx: 3}); T(330, yU - 15, s.pkt, {fs: 11, b: 1});
    if (s.drop) X(570, yU, 10);
  }
  if (s.dir === "l"){ L(622, yL, 138, yL, {c: css("--hl2"), w: 3.5, d: "8 5", m: "ahh2"}); R(400, yL - 30, 70, 20, {rx: 3}); T(435, yL - 15, s.pkt, {fs: 11, b: 1}); }
  T(380, 280, s.loss >= 100 ? "Várakozás: connect timeout (2 s)" : "Várt RTT-többlet: delay(lab-r1) + delay(lab-r0) = " + (s.d1 + s.d0) + " ms", {fs: 13, b: 1});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
