<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VXLAN-adatút és linkhiba</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<button id="fail" type="button">Link hiba (lab-le2-sp1 down)</button>
<button id="norm" type="button">Normál adatút</button>
<button id="after" type="button">Adatút a hiba után</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="lab-h1 – lab-leaf1 – lab-spine1/lab-spine2 – lab-leaf2 – lab-h2 topológia; egy ping hét lépése a beágyazással és a fejlécekkel, valamint a lab-le2-sp1 hibájának idővonala."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés. Hiba előtt a VXLAN-forgalom egyetlen külső IP-párt használ, így L3-hash mellett egyetlen spine-on megy (itt a spine1; a valóságban a spine2 is lehet). A „Link hiba” gomb az interfész-down utáni eseménysort játssza le: azonnali session-bontás, withdraw, FIB-frissítés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"at": "lab-h1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "msg": "1/7 lab-h1: ICMP echo 192.168.100.1 → 192.168.100.2 (lab-h1-veth, MTU 1450)."}, {"at": "lab-leaf1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-h1", "lab-leaf1"], "msg": "2/7 lab-leaf1 / lab-br0: a bridge a cél-MAC-et (vagy a 00:00:00:00:00:00 flood-bejegyzést) a lab-vxlan0 portra küldi."}, {"at": "lab-leaf1", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "3/7 lab-vxlan0 encap: VXLAN-fejléc (VNI 100), UDP dst 4789, külső IP 10.255.0.1 → 10.255.0.2 (FDB dst)."}, {"at": "lab-leaf1", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "4/7 underlay route: 10.255.0.2/32 via 10.0.0.1 dev lab-le1-sp1 (spine1); a csomag a lab-le1-sp1 uplinken megy ki."}, {"at": "lab-spine1", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf1", "lab-spine1"], "encap": true, "msg": "5/7 lab-spine1 (AS 65000): csak a külső IP-t nézi; 10.255.0.2/32 via 10.0.2.0 dev lab-sp1-le2 (a spine-on ip_forward=1 kell)."}, {"at": "lab-leaf2", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-spine1", "lab-leaf2"], "encap": true, "msg": "6/7 lab-leaf2: UDP 4789 → lab-vxlan0 decap (VNI 100 egyezik), a belső keret a lab-br0-ra kerül."}, {"at": "lab-h2", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf2", "lab-h2"], "msg": "7/7 lab-h2 megkapja az echo requestet (192.168.100.2); a válasz ugyanígy, fordított irányban halad."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}

const NORMAL = [{"at": "lab-h1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "msg": "1/7 lab-h1: ICMP echo 192.168.100.1 → 192.168.100.2 (lab-h1-veth, MTU 1450)."}, {"at": "lab-leaf1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-h1", "lab-leaf1"], "msg": "2/7 lab-leaf1 / lab-br0: a bridge a cél-MAC-et (vagy a 00:00:00:00:00:00 flood-bejegyzést) a lab-vxlan0 portra küldi."}, {"at": "lab-leaf1", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "3/7 lab-vxlan0 encap: VXLAN-fejléc (VNI 100), UDP dst 4789, külső IP 10.255.0.1 → 10.255.0.2 (FDB dst)."}, {"at": "lab-leaf1", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "4/7 underlay route: 10.255.0.2/32 via 10.0.0.1 dev lab-le1-sp1 (spine1); a csomag a lab-le1-sp1 uplinken megy ki."}, {"at": "lab-spine1", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf1", "lab-spine1"], "encap": true, "msg": "5/7 lab-spine1 (AS 65000): csak a külső IP-t nézi; 10.255.0.2/32 via 10.0.2.0 dev lab-sp1-le2 (a spine-on ip_forward=1 kell)."}, {"at": "lab-leaf2", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-spine1", "lab-leaf2"], "encap": true, "msg": "6/7 lab-leaf2: UDP 4789 → lab-vxlan0 decap (VNI 100 egyezik), a belső keret a lab-br0-ra kerül."}, {"at": "lab-h2", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf2", "lab-h2"], "msg": "7/7 lab-h2 megkapja az echo requestet (192.168.100.2); a válasz ugyanígy, fordított irányban halad."}], AFTER = [{"at": "lab-h1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "msg": "1/7 lab-h1: ICMP echo 192.168.100.1 → 192.168.100.2 (lab-h1-veth, MTU 1450)."}, {"at": "lab-leaf1", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-h1", "lab-leaf1"], "msg": "2/7 lab-leaf1 / lab-br0: a bridge a cél-MAC-et (vagy a 00:00:00:00:00:00 flood-bejegyzést) a lab-vxlan0 portra küldi."}, {"at": "lab-leaf1", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "3/7 lab-vxlan0 encap: VXLAN-fejléc (VNI 100), UDP dst 4789, külső IP 10.255.0.1 → 10.255.0.2 (FDB dst)."}, {"at": "lab-leaf1", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": null, "encap": true, "msg": "4/7 underlay route: 10.255.0.2/32 via 10.0.1.1 dev lab-le1-sp2 (spine2); a csomag a lab-le1-sp2 uplinken megy ki."}, {"at": "lab-spine2", "hdr": ["outer 10.255.0.1 → 10.255.0.2, UDP dst 4789, VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf1", "lab-spine2"], "encap": true, "msg": "5/7 lab-spine2 (AS 65000): csak a külső IP-t nézi; 10.255.0.2/32 via 10.0.3.0 dev lab-sp2-le2 (a spine-on ip_forward=1 kell)."}, {"at": "lab-leaf2", "hdr": ["VXLAN VNI 100", "inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-spine2", "lab-leaf2"], "encap": true, "msg": "6/7 lab-leaf2: UDP 4789 → lab-vxlan0 decap (VNI 100 egyezik), a belső keret a lab-br0-ra kerül."}, {"at": "lab-h2", "hdr": ["inner Eth + IP 192.168.100.1 → 192.168.100.2"], "edge": ["lab-leaf2", "lab-h2"], "msg": "7/7 lab-h2 megkapja az echo requestet (192.168.100.2); a válasz ugyanígy, fordított irányban halad."}], TL = [{"t": "t0", "at": "lab-leaf2", "msg": "t0: ip netns exec lab-leaf2 ip link set lab-le2-sp1 down – a leaf2 interfésze admin down, a spine1 oldali lab-sp1-le2 elveszíti a carriert."}, {"t": "t1", "at": "lab-spine1", "msg": "t1: session down – a leaf2 zebrája azonnal látja az interfészeseményt, az FRR (fast-external-failover) a hold timer kivárása nélkül bontja az eBGP-sessiont a leaf2-n és a spine1-en."}, {"t": "t2", "at": "lab-spine1", "msg": "t2: withdraw – a spine1 visszavonja a 10.255.0.2/32 útvonalat a leaf1 felé (a leaf2 loopbackja már csak a spine2-n át érhető el)."}, {"t": "t3", "at": "lab-leaf1", "msg": "t3: a leaf1 bgpd/zebra frissíti a FIB-et: 10.255.0.2/32 via 10.0.1.1 dev lab-le1-sp2 (spine2). Ellenőrzés: ip route get 10.255.0.2 from 10.255.0.1."}, {"t": "t4", "at": "lab-h2", "msg": "t4: első sikeres válasz a spine2-n át. Konvergencia = t4 − t0: a withdraw terjedése és a FIB-frissítés ideje (nem a 3 s-os hold timer)."}];
const P = {"lab-h1":[55,165],"lab-leaf1":[175,165],"lab-spine1":[320,60],"lab-spine2":[320,270],"lab-leaf2":[465,165],"lab-h2":[585,165]};
const LAB = {"lab-h1":["lab-h1","192.168.100.1"],"lab-leaf1":["lab-leaf1","lo 10.255.0.1"],"lab-spine1":["lab-spine1","AS 65000"],
  "lab-spine2":["lab-spine2","AS 65000"],"lab-leaf2":["lab-leaf2","lo 10.255.0.2"],"lab-h2":["lab-h2","192.168.100.2"]};
const UL = [["lab-leaf1","lab-spine1","lab-le1-sp1"],["lab-leaf1","lab-spine2","lab-le1-sp2"],["lab-leaf2","lab-spine1","lab-le2-sp1"],["lab-leaf2","lab-spine2","lab-le2-sp2"]];
document.getElementById("fail").onclick = () => setSteps(TL);
document.getElementById("norm").onclick = () => setSteps(NORMAL);
document.getElementById("after").onclick = () => setSteps(AFTER);
function render(s){
  svg.setAttribute("viewBox", "0 0 640 345"); svg.innerHTML = ""; D();
  const failed = STEPS === TL || STEPS === AFTER;
  const cur = STEPS.indexOf(s), tl = STEPS === TL;
  const broken = failed && (!tl || cur >= 0);
  UL.forEach(([l, sp, nm]) => { const p = P[l], q = P[sp], bad = broken && nm === "lab-le2-sp1";
    A(p[0], p[1], q[0], q[1], {noh: 1, sw: 1.3, dash: bad ? "2 4" : ""});
    const mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
    T(mx + (q[0] > p[0] ? -38 : 38), my + (q[1] < p[1] ? -6 : 14), nm, {fs: 9.5, fill: css("--muted")});
    if (bad) X(mx, my, 8); });
  [["lab-h1","lab-leaf1"],["lab-leaf2","lab-h2"]].forEach(([a, b]) => A(P[a][0], P[a][1], P[b][0], P[b][1], {noh: 1, sw: 1.3}));
  A(P["lab-leaf1"][0] + 50, 132, P["lab-leaf2"][0] - 50, 132, {both: 1, dash: "6 4", stroke: css("--muted"), sw: 1.2});
  T(320, 126, "overlay VXLAN VNI 100", {fs: 10, fill: css("--muted")});
  if (!tl) STEPS.slice(0, cur + 1).forEach(t => { if (!t.edge) return; const p = P[t.edge[0]], q = P[t.edge[1]];
    A(p[0] + (q[0]-p[0])*0.15, p[1] + (q[1]-p[1])*0.15, q[0] - (q[0]-p[0])*0.15, q[1] - (q[1]-p[1])*0.15, {sw: 4, stroke: css("--hl"), m: "ahb"}); });
  if (tl && cur >= 3) { const p = P["lab-leaf1"], q = P["lab-spine2"]; A(p[0]+20, p[1]+12, q[0]-30, q[1]-12, {sw: 4, stroke: css("--hl"), m: "ahb"}); }
  if (tl && cur >= 2) A(P["lab-spine1"][0] - 50, P["lab-spine1"][1] + 30, P["lab-leaf1"][0] + 15, P["lab-leaf1"][1] - 18, {stroke: css("--hl2"), m: "ahh", dash: "5 3", sw: 2});
  Object.entries(P).forEach(([n, p]) => { const on = n === s.at;
    R(p[0]-52, p[1]-20, 104, 40, {fill: on ? css("--cellhl") : css("--cell"), sw: on ? 3 : 1.2});
    T(p[0], p[1]-3, LAB[n][0], {fs: 11.5, bold: on}); T(p[0], p[1]+13, LAB[n][1], {fs: 9.5, fill: css("--muted")}); });
  if (s.hdr) { const hd = s.hdr; R(8, 236, 230, 18*hd.length + 26, {fill: css("--code"), rx: 3});
    T(16, 252, s.encap ? "fejlécek (beágyazva):" : "fejlécek:", {a: "start", fs: 10, bold: 1});
    hd.forEach((h, i) => T(16, 270 + 18*i, h, {a: "start", fs: 9.5, mono: 1})); }
  if (tl) { ["t0","t1","t2","t3","t4"].forEach((t, i) => { const x = 395 + i*48, on = i <= cur;
      el("circle", {cx: x, cy: 322, r: 8, fill: on ? css("--fg") : css("--cell"), stroke: css("--line")});
      T(x, 340, t, {fs: 10}); if (i < 4) A(x + 9, 322, x + 39, 322, {noh: 1, sw: 1}); });
    T(390, 305, "hiba-idővonal (modell, nem mérés)", {a: "start", fs: 10, fill: css("--muted")}); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
