<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizonyítéklétra a packet-path laborban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select id="sc"><option value="alap">alap</option><option value="f2">2. feladat: útvonal törölve</option><option value="f3">3. feladat: 18081-es port</option></select></label><script>const ALLS = {"alap": [{"line": -1, "i": 0, "sc": "alap", "state": "ok", "msg": "1) útvonal (kliensnévtér): $ ip -n lab-path-a route get 10.203.120.2 → 10.203.120.2 dev lab-a0 src 10.203.120.1", "tcp": "(nincs csomag)"}, {"line": -1, "i": 1, "sc": "alap", "state": "ok", "msg": "2) szomszéd (kliensnévtér): $ ip -n lab-path-a neigh show dev lab-a0 → 10.203.120.2 lladdr 02:… REACHABLE/STALE", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 2, "sc": "alap", "state": "ok", "msg": "3) ARP (capture: lab-a0): $ tcpdump -nn -e -i lab-a0 (capture) → Request who-has 10.203.120.2 / Reply is-at", "tcp": "2025-01-15 12:00:00.000001 02:00:00:00:a0:01 > ff:ff:ff:ff:ff:ff, ARP, Request who-has 10.203.120.2 tell 10.203.120.1"}, {"line": -1, "i": 3, "sc": "alap", "state": "ok", "msg": "4) ping (kliensnévtér): $ ip netns exec lab-path-a ping -n -c 1 -W 1 10.203.120.2 → 1 packets transmitted, 1 received", "tcp": "… 10.203.120.1 > 10.203.120.2: ICMP echo request … / ICMP echo reply"}, {"line": -1, "i": 4, "sc": "alap", "state": "ok", "msg": "5) listener (szervernévtér): $ ip netns exec lab-path-b ss -ltnp → LISTEN 10.203.120.2:18080 (python3)", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 5, "sc": "alap", "state": "ok", "msg": "6) TCP-nyitás (capture: lab-a0): $ (capture) → SYN, SYN-ACK, ACK", "tcp": "… 10.203.120.1.45678 > 10.203.120.2.18080: Flags [S] / [S.] / [.]"}, {"line": -1, "i": 6, "sc": "alap", "state": "ok", "msg": "7) HTTP (alkalmazás (curl)): $ curl -sS -w '\\nHTTP %{http_code}\\n' http://10.203.120.2:18080/lab-health.txt → lab packet-path OK / HTTP 200", "tcp": "… Flags [P.] … length …  (a tartalmat a curl igazolja)"}, {"line": -1, "i": 7, "sc": "alap", "state": "ok", "msg": "8) lezárás (capture: lab-a0): $ (capture) → FIN/ACK mindkét irányban", "tcp": "… Flags [F.] / [.]"}], "f2": [{"line": -1, "i": 0, "sc": "f2", "state": "bad", "msg": "1) útvonal (kliensnévtér): $ ip -n lab-path-a route get 10.203.120.2 → RTNETLINK answers: Network is unreachable", "tcp": "(nincs csomag – a capture üres, nincs SYN)"}, {"line": -1, "i": 1, "sc": "f2", "state": "skip", "msg": "2) szomszéd (kliensnévtér): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 2, "sc": "f2", "state": "skip", "msg": "3) ARP (capture: lab-a0): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 3, "sc": "f2", "state": "skip", "msg": "4) ping (kliensnévtér): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 4, "sc": "f2", "state": "skip", "msg": "5) listener (szervernévtér): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 5, "sc": "f2", "state": "skip", "msg": "6) TCP-nyitás (capture: lab-a0): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 6, "sc": "f2", "state": "skip", "msg": "7) HTTP (alkalmazás (curl)): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}, {"line": -1, "i": 7, "sc": "f2", "state": "skip", "msg": "8) lezárás (capture: lab-a0): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}], "f3": [{"line": -1, "i": 0, "sc": "f3", "state": "ok", "msg": "1) útvonal (kliensnévtér): $ ip -n lab-path-a route get 10.203.120.2 → 10.203.120.2 dev lab-a0 src 10.203.120.1", "tcp": "(nincs csomag)"}, {"line": -1, "i": 1, "sc": "f3", "state": "ok", "msg": "2) szomszéd (kliensnévtér): $ ip -n lab-path-a neigh show dev lab-a0 → 10.203.120.2 lladdr 02:… REACHABLE/STALE", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 2, "sc": "f3", "state": "ok", "msg": "3) ARP (capture: lab-a0): $ tcpdump -nn -e -i lab-a0 (capture) → Request who-has 10.203.120.2 / Reply is-at", "tcp": "2025-01-15 12:00:00.000001 02:00:00:00:a0:01 > ff:ff:ff:ff:ff:ff, ARP, Request who-has 10.203.120.2 tell 10.203.120.1"}, {"line": -1, "i": 3, "sc": "f3", "state": "ok", "msg": "4) ping (kliensnévtér): $ ip netns exec lab-path-a ping -n -c 1 -W 1 10.203.120.2 → 1 packets transmitted, 1 received", "tcp": "… 10.203.120.1 > 10.203.120.2: ICMP echo request … / ICMP echo reply"}, {"line": -1, "i": 4, "sc": "f3", "state": "ok", "msg": "5) listener (szervernévtér): $ ip netns exec lab-path-b ss -ltnp → LISTEN 10.203.120.2:18080 – de a kliens a 18081-re kapcsolódik", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 5, "sc": "f3", "state": "bad", "msg": "6) TCP-nyitás (capture: lab-a0): $ (capture) → SYN → RST (a 18081-en nincs listener)", "tcp": "… 10.203.120.1.45678 > 10.203.120.2.18081: Flags [S] / 10.203.120.2.18081 > 10.203.120.1.45678: Flags [R.]"}, {"line": -1, "i": 6, "sc": "f3", "state": "bad", "msg": "7) HTTP (alkalmazás (curl)): $ curl … http://10.203.120.2:18081/lab-health.txt → curl: (7) Failed to connect … Connection refused", "tcp": "… Flags [P.] … length …  (a tartalmat a curl igazolja)"}, {"line": -1, "i": 7, "sc": "f3", "state": "skip", "msg": "8) lezárás (capture: lab-a0): nem fut – egy alacsonyabb szint már elbukott.", "tcp": "(nincs)"}]}; document.getElementById("sc").addEventListener("change", e => { SC = e.target.value; setSteps(ALLS[SC]); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc bizonyítékszint az útvonaltól az alkalmazásválaszig; törölt útvonalnál már az első szint bukik, rossz portnál a TCP-nyitás RST-vel zárul."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Várt kimenet, nem mérés (a 24.5 labor parancsai). A tcpdump-sorok (-nn -e -tttt) MAC-címe és időbélyege illusztratív.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "i": 0, "sc": "alap", "state": "ok", "msg": "1) útvonal (kliensnévtér): $ ip -n lab-path-a route get 10.203.120.2 → 10.203.120.2 dev lab-a0 src 10.203.120.1", "tcp": "(nincs csomag)"}, {"line": -1, "i": 1, "sc": "alap", "state": "ok", "msg": "2) szomszéd (kliensnévtér): $ ip -n lab-path-a neigh show dev lab-a0 → 10.203.120.2 lladdr 02:… REACHABLE/STALE", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 2, "sc": "alap", "state": "ok", "msg": "3) ARP (capture: lab-a0): $ tcpdump -nn -e -i lab-a0 (capture) → Request who-has 10.203.120.2 / Reply is-at", "tcp": "2025-01-15 12:00:00.000001 02:00:00:00:a0:01 > ff:ff:ff:ff:ff:ff, ARP, Request who-has 10.203.120.2 tell 10.203.120.1"}, {"line": -1, "i": 3, "sc": "alap", "state": "ok", "msg": "4) ping (kliensnévtér): $ ip netns exec lab-path-a ping -n -c 1 -W 1 10.203.120.2 → 1 packets transmitted, 1 received", "tcp": "… 10.203.120.1 > 10.203.120.2: ICMP echo request … / ICMP echo reply"}, {"line": -1, "i": 4, "sc": "alap", "state": "ok", "msg": "5) listener (szervernévtér): $ ip netns exec lab-path-b ss -ltnp → LISTEN 10.203.120.2:18080 (python3)", "tcp": "(állapot, nem csomag)"}, {"line": -1, "i": 5, "sc": "alap", "state": "ok", "msg": "6) TCP-nyitás (capture: lab-a0): $ (capture) → SYN, SYN-ACK, ACK", "tcp": "… 10.203.120.1.45678 > 10.203.120.2.18080: Flags [S] / [S.] / [.]"}, {"line": -1, "i": 6, "sc": "alap", "state": "ok", "msg": "7) HTTP (alkalmazás (curl)): $ curl -sS -w '\\nHTTP %{http_code}\\n' http://10.203.120.2:18080/lab-health.txt → lab packet-path OK / HTTP 200", "tcp": "… Flags [P.] … length …  (a tartalmat a curl igazolja)"}, {"line": -1, "i": 7, "sc": "alap", "state": "ok", "msg": "8) lezárás (capture: lab-a0): $ (capture) → FIN/ACK mindkét irányban", "tcp": "… Flags [F.] / [.]"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SC = "alap";
const R = [{"n": 1, "name": "útvonal", "cmd": "ip -n lab-path-a route get 10.203.120.2", "out": "10.203.120.2 dev lab-a0 src 10.203.120.1", "yes": "van helyi továbbítási döntés", "no": "nem bizonyítja, hogy a peer él", "pt": "kliensnévtér", "tcp": "(nincs csomag)"}, {"n": 2, "name": "szomszéd", "cmd": "ip -n lab-path-a neigh show dev lab-a0", "out": "10.203.120.2 lladdr 02:… REACHABLE/STALE", "yes": "a peer linkcíme ismert", "no": "nem alkalmazásállapot", "pt": "kliensnévtér", "tcp": "(állapot, nem csomag)"}, {"n": 3, "name": "ARP", "cmd": "tcpdump -nn -e -i lab-a0 (capture)", "out": "Request who-has 10.203.120.2 / Reply is-at", "yes": "a közvetlen L2-peer válaszol", "no": "nem bizonyít IP-elérést a portig", "pt": "capture: lab-a0", "tcp": "2025-01-15 12:00:00.000001 02:00:00:00:a0:01 > ff:ff:ff:ff:ff:ff, ARP, Request who-has 10.203.120.2 tell 10.203.120.1"}, {"n": 4, "name": "ping", "cmd": "ip netns exec lab-path-a ping -n -c 1 -W 1 10.203.120.2", "out": "1 packets transmitted, 1 received", "yes": "az ICMP oda-vissza működik", "no": "nem bizonyít TCP-portot", "pt": "kliensnévtér", "tcp": "… 10.203.120.1 > 10.203.120.2: ICMP echo request … / ICMP echo reply"}, {"n": 5, "name": "listener", "cmd": "ip netns exec lab-path-b ss -ltnp", "out": "LISTEN 10.203.120.2:18080 (python3)", "yes": "a listener létezik a szervernévtérben", "no": "nem bizonyítja a kliens felőli elérést", "pt": "szervernévtér", "tcp": "(állapot, nem csomag)"}, {"n": 6, "name": "TCP-nyitás", "cmd": "(capture)", "out": "SYN, SYN-ACK, ACK", "yes": "a TCP-kapcsolat felépül", "no": "nem bizonyít HTTP-t", "pt": "capture: lab-a0", "tcp": "… 10.203.120.1.45678 > 10.203.120.2.18080: Flags [S] / [S.] / [.]"}, {"n": 7, "name": "HTTP", "cmd": "curl -sS -w '\\nHTTP %{http_code}\\n' http://10.203.120.2:18080/lab-health.txt", "out": "lab packet-path OK / HTTP 200", "yes": "a vizsgált művelet sikeres", "no": "a capture nem mutatja a tartalmat", "pt": "alkalmazás (curl)", "tcp": "… Flags [P.] … length …  (a tartalmat a curl igazolja)"}, {"n": 8, "name": "lezárás", "cmd": "(capture)", "out": "FIN/ACK mindkét irányban", "yes": "szabályos lezárás", "no": "—", "pt": "capture: lab-a0", "tcp": "… Flags [F.] / [.]"}], SCN = {"alap": {"name": "alap", "st": ["ok", "ok", "ok", "ok", "ok", "ok", "ok", "ok"], "over": {}}, "f2": {"name": "2. feladat: útvonal törölve", "st": ["bad", "skip", "skip", "skip", "skip", "skip", "skip", "skip"], "over": {"1": {"out": "RTNETLINK answers: Network is unreachable", "tcp": "(nincs csomag – a capture üres, nincs SYN)"}}}, "f3": {"name": "3. feladat: 18081-es port", "st": ["ok", "ok", "ok", "ok", "ok", "bad", "bad", "skip"], "over": {"5": {"out": "LISTEN 10.203.120.2:18080 – de a kliens a 18081-re kapcsolódik"}, "6": {"out": "SYN → RST (a 18081-en nincs listener)", "tcp": "… 10.203.120.1.45678 > 10.203.120.2.18081: Flags [S] / 10.203.120.2.18081 > 10.203.120.1.45678: Flags [R.]"}, "7": {"out": "curl: (7) Failed to connect … Connection refused", "cmd": "curl … http://10.203.120.2:18081/lab-health.txt"}}}};
function render(s){
  svg.setAttribute("viewBox", "0 0 640 440");
  svg.innerHTML = "";
  const cols = ["alap", "f2", "f3"], CX = [400, 480, 560];
  cols.forEach((k, j) => el("text", {x:CX[j]+35, y:18, "text-anchor":"middle", "font-size":11, "font-weight": k === SC ? "bold" : "normal", fill: k === SC ? css("--hl") : css("--fg")}, {alap:"alap", f2:"2. feladat", f3:"3. feladat"}[k]));
  R.forEach((r, i) => {
    const y = 380 - i*46, cur = s.i === i;
    el("rect", {x:6, y:y, width:380, height:40, rx:4, fill: cur ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3 : 1});
    el("text", {x:12, y:y+16, "font-size":11.5, "font-weight":"bold"}, r.n + ") " + r.name + " – " + r.pt);
    el("text", {x:12, y:y+33, "font-size":10.5}, "✓ " + r.yes + "   ✗ " + r.no);
    cols.forEach((k, j) => {
      const st = SCN[k].st[i], vis = k !== SC || i <= s.i;
      el("rect", {x:CX[j], y:y+2, width:70, height:36, fill: st === "bad" && vis ? css("--cellhl") : css("--bg"), stroke: st === "bad" && vis ? css("--hl2") : css("--line"), "stroke-width": st === "skip" ? 1 : 2, "stroke-dasharray": st === "skip" ? "2 3" : "", opacity: vis ? 1 : 0.3});
      el("text", {x:CX[j]+35, y:y+25, "text-anchor":"middle", "font-size":12, "font-weight":"bold", opacity: vis ? 1 : 0.3}, st === "ok" ? "✓" : (st === "bad" ? "✗" : "nem fut"));
    });
  });
  const t = s.tcp || "";
  el("text", {x:6, y:432, "font-size":10, "font-family":"ui-monospace,monospace", fill: css("--muted")}, "tcpdump: " + (t.length > 100 ? t.slice(0, 100) + "…" : t));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
