<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tünet → réteg döntési fa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>fixture: <select id="fx"><option>wrong DNS</option><option>TLS chain</option><option>route</option><option>backend</option><option>FD</option><option>OOM</option><option>inode</option></select></label> <button id="wrong">rossz ág magyarázata</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Döntési fa: először névfeloldás, majd TLS, TCP-kapcsolat, HTTP-státusz, végül erőforrás-ellenőrzések, mindegyik ághoz egy parancs és a hozzá tartozó labfixture."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Válassz fixture-t, majd lépj végig a fán: minden lépés a futtatandó parancsot és a fixture-re jellemző (illusztratív) kimenetet mutatja, a levélnél a rollbacket és a postconditiont. A TLS-ágban az s_client-et </dev/null-lal futtasd, különben nyitva marad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1/2 [wrong DNS] getent ahosts lab-svc.example → 192.0.2.99 STREAM lab-svc.example (nem 192.0.2.10)", "node": "q1", "vis": ["q1"], "lab": "nem", "f": "wrong DNS"}, {"msg": "2/2 [wrong DNS] réteg: DNS/NSS – rollback: sudo sed -i '/192.0.2.99 lab-svc.example/d' /etc/hosts; postcondition: getent → 192.0.2.10, HTTP 200", "node": "dns", "vis": ["q1", "dns"], "lab": "", "f": "wrong DNS"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const NODES = {"root": ["start", 20, 117, "curl https://lab-svc.example/health\nhibás (lab-client)"], "q1": ["q", 20, 103, "getent ahosts\nlab-svc.example\n= 192.0.2.10?"], "q2": ["q", 20, 87, "a curl hibája\nTLS? (SSL\ncertificate problem)"], "q2b": ["q", 52, 87, "s_client\n-showcerts:\nhány tanúsítvány?"], "q3": ["q", 20, 59, "TCP connect\ntimeout?"], "q4": ["q", 20, 41, "HTTP\n502/504?"], "q5": ["q", 20, 25, "erőforrás-ág:\nlassú/hibás\nválasz"], "dns": ["leaf", 70, 103, "DNS/NSS:\n/etc/hosts 192.0.2.99\nrollback: sed -i\n'/192.0.2.99/d' /etc/hosts"], "srv": ["leaf", 52, 74, "szerver chain (1 tanúsítvány,\ncode 21); rollback:\nfullchain.pem.bak + reload"], "cli": ["leaf", 86, 87, "kliens trust:\nCA store\n(2 tanúsítvány,\ncode 20)"], "route": ["leaf", 66, 59, "route/firewall:\nip route get, tcpdump,\nss -tn state syn-sent;\nrollback: route törlése"], "q4b": ["q", 58, 41, "lab-lb error.log:\nupstream\ntimed out?"], "backend": ["leaf", 87, 41, "backend/proxy:\nconn. refused;\nsystemctl is-active,\nss -lntp (18080);\nrollback: backend\nindítása"], "fd": ["leaf", 12, 7, "FD-limit:\n/proc/PID/limits\n+ FD-szám\n0.2.0-fdleak →\n0.1.9-good"], "oom": ["leaf", 37, 7, "memória/cgroup:\njournalctl -k\n(oom-kill)\n0.2.1-oom →\ndrop-in törlése"], "io": ["leaf", 62, 7, "IO/throttle:\niostat -xz,\n/proc/pressure/io\nrollback: CPU/IO-\nlimit törlése"], "inode": ["leaf", 87, 7, "inode:\ndf -i /srv\nlab-fill →\nrm -rf lab-fill"]}, EDGES = [["root", "q1", ""], ["q1", "dns", "nem"], ["q1", "q2", "igen"], ["q2", "q2b", "igen"], ["q2", "q3", "nem"], ["q2b", "srv", "1"], ["q2b", "cli", "2 + code 20"], ["q3", "route", "igen"], ["q3", "q4", "nem"], ["q4", "q4b", "igen"], ["q4b", "route", "igen"], ["q4b", "backend", "nem"], ["q4", "q5", "nem"], ["q5", "fd", "FD"], ["q5", "oom", "OOM"], ["q5", "io", "IO"], ["q5", "inode", "inode"]], FIX = {"wrong DNS": [["q1", "getent ahosts lab-svc.example → 192.0.2.99 STREAM lab-svc.example (nem 192.0.2.10)", "nem"], ["dns", "réteg: DNS/NSS – rollback: sudo sed -i '/192.0.2.99 lab-svc.example/d' /etc/hosts; postcondition: getent → 192.0.2.10, HTTP 200", ""]], "TLS chain": [["q1", "getent → 192.0.2.10 (rendben)", "igen"], ["q2", "curl → SSL certificate problem: unable to get local issuer certificate", "igen"], ["q2b", "openssl s_client -connect lab-svc.example:443 -servername lab-svc.example -showcerts </dev/null | grep -c 'BEGIN CERTIFICATE' → 1", "1"], ["srv", "réteg: szerver chain – rollback: lab-fullchain.pem visszamásolása a .bak-ból, nginx -t && reload; postcondition: 2 tanúsítvány, HTTP 200", ""]], "route": [["q1", "getent → 192.0.2.10 (rendben)", "igen"], ["q2", "TLS rendben (a kliens eléri a lab-lb proxyt)", "nem"], ["q3", "a kliens TCP-kapcsolata a proxyhoz létrejön – nincs kliensoldali timeout", "nem"], ["q4", "curl -sS -o /dev/null -w '%{http_code}\\n' https://lab-svc.example/health → lassú válasz vagy 502/504", "igen"], ["q4b", "lab-lb: sudo tail -n 20 /var/log/nginx/error.log → upstream timed out / connect() failed … 198.51.100.20:18080; ip route get 198.51.100.20 → via 192.0.2.99 dev eth0 (a fixture /32 host-route-ja)", "igen"], ["route", "réteg: route (lab-lb → lab-app-a) – rollback: sudo ip route del 198.51.100.20/32 via 192.0.2.99 dev eth0; postcondition: ip route get 198.51.100.20 → dev eth1 src 198.51.100.10, HTTP 200", ""]], "backend": [["q1", "getent → 192.0.2.10 (rendben)", "igen"], ["q2", "TLS rendben", "nem"], ["q3", "TCP-kapcsolat létrejön", "nem"], ["q4", "curl -w '%{http_code}' → 502", "igen"], ["q4b", "lab-lb error.log: connect() failed (111: Connection refused) while connecting to upstream – nem timeout", "nem"], ["backend", "réteg: backend/proxy – systemctl is-active lab-order-svc → inactive; ss -lntp | grep 18080 → üres", ""]], "FD": [["q1", "getent rendben", "igen"], ["q2", "TLS rendben", "nem"], ["q3", "TCP rendben", "nem"], ["q4", "nem 502/504 (500 vagy lassú)", "nem"], ["q5", "journalctl -u lab-order-svc → accept: Too many open files", "FD"], ["fd", "réteg: FD-limit – ls /proc/$PID/fd | wc -l ≈ Max open files; rollback: lab-install-release lab-order-svc 0.1.9-good + restart", ""]], "OOM": [["q1", "getent rendben", "igen"], ["q2", "TLS rendben", "nem"], ["q3", "TCP rendben", "nem"], ["q4", "időszakos 502 a restartok alatt", "nem"], ["q5", "systemctl status → status=9/KILL; journalctl -k → oom-kill", "OOM"], ["oom", "réteg: memória/cgroup – rollback: a 10-oom-fixture.conf drop-in törlése, daemon-reload, 0.1.9-good", ""]], "inode": [["q1", "getent rendben", "igen"], ["q2", "TLS rendben", "nem"], ["q3", "TCP rendben", "nem"], ["q4", "500: írási hiba", "nem"], ["q5", "journalctl → No space left on device; df -h: van hely, df -i /srv: 100%", "inode"], ["inode", "réteg: inode – rollback: sudo rm -rf /srv/lab-order-svc/lab-fill; postcondition: df -i baseline, a könyvtár írható", ""]]}, WRONG = {"wrong DNS": "Rossz ág: a timeout itt nem route-hiba – a getent már rossz IP-t (192.0.2.99) ad, a SYN a nem létező címre megy.", "TLS chain": "Rossz ág: a lokális openssl verify a lab-lb lemezén OK-t ad, mert a láncfájlok hibátlanok – a kiküldött láncot csak az s_client látja.", "route": "Rossz ág: a DNS és a TLS rendben, és a kliens TCP-kapcsolata a proxyhoz is létrejön – a kliensoldali ip route get nem mutat hibát; a rossz host-route a lab-lb → lab-app-a úton van, ezt a lab-lb error.log-ja és ip route get-je mutatja.", "backend": "Rossz ág: a 502 nem DNS-hiba – a kliens elérte a proxyt; a hiba a proxy mögött van.", "FD": "Rossz ág: a memória rendben (nincs OOM-kill); a Too many open files az FD-limitre mutat.", "OOM": "Rossz ág: az FD-szám alacsony; a 9/KILL kilépés és a kernel oom-kill sor a memóriára mutat.", "inode": "Rossz ág: a df -h szabad blokkot mutat, ezért a „tele a lemez” hipotézist a df -i dönti el."};
function build(f){
  const path = FIX[f], visited = [];
  const st = path.map((p, i) => { visited.push(p[0]); return {msg: (i + 1) + "/" + path.length + " [" + f + "] " + p[1], node: p[0], vis: visited.slice(), lab: p[2], f: f}; });
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 600"); svg.innerHTML = ""; defs0();
  const X = x => 10 + x * 6.7, Y = y => 590 - (y + 3) * 4.6;
  EDGES.forEach(e => { const a = NODES[e[0]], b = NODES[e[1]], on = s.vis.includes(e[0]) && s.vis.includes(e[1]);
    A(X(a[1]), Y(a[2]), X(b[1]), Y(b[2]), {stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 3 : 1.2, "marker-end": on ? "url(#arh)" : "url(#ar)"});
    if (e[2]) T((X(a[1]) + X(b[1])) / 2 + 4, (Y(a[2]) + Y(b[2])) / 2 - 3, e[2], {"font-size": 10, "font-style": "italic"}); });
  for (const k in NODES) { const n = NODES[k], on = k === s.node, vis = s.vis.includes(k), lines = n[3].split("\n");
    const w = Math.max(...lines.map(l => l.length)) * 5.6 + 14, h = lines.length * 13 + 8, x = X(n[1]), y = Y(n[2]);
    if (n[0] === "q") el("polygon", {points: [x - w / 2 - 8, y, x, y - h / 2 - 6, x + w / 2 + 8, y, x, y + h / 2 + 6].join(","), fill: vis ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    else R(x - w / 2, y - h / 2, w, h, {fill: vis ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    lines.forEach((l, i) => T(x, y - (lines.length - 1) * 6.5 + i * 13 + 4, l, {"font-size": 10, "text-anchor": "middle"})); }
}
document.getElementById("fx").addEventListener("change", e => setSteps(build(e.target.value)));
document.getElementById("wrong").addEventListener("click", () => { const f = document.getElementById("fx").value;
  setSteps([{msg: WRONG[f], node: "", vis: [], f: f}]); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
