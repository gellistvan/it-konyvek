<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accept-sor és Recv-Q</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--cell:#fff;--cellhl:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--cell:#262626;--cellhl:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;overflow-x:auto;margin:6px 0;white-space:pre}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
#status{min-height:2.9em}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
  <button id="add">Kliens hozzáadása</button>
  <button id="enter">Kiszolgált kliens: Enter</button>
  <button id="probe">127.0.0.2 próba</button>
  <button id="reset">Újra</button>
</div>
<div class="ctl">
  <label>backlog <input id="bl" type="range" min="1" max="16" value="4" aria-label="backlog"> <span id="blv">4</span></label>
  <label><input type="checkbox" id="wild"> bind 0.0.0.0 (127.0.0.1 helyett)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 250" role="img" aria-label="Egy listening socket backlog 4-es accept-sorral; a szerver az első kliensen vár, a további kapcsolatok a sorban gyűlnek, a Recv-Q 4-re nő."></svg>
<pre id="ss"></pre>
<p class="small">Várt viselkedés, nem mérés: Linuxon az accept-sor akkor tele, ha a várakozók száma nagyobb a backlognál (így backlog+1 kapcsolat várhat); a további SYN-eket a kernel eldobja, a kliens újrapróbál – kernelverzió-függő. A szerver a 24.4.6 soros lab-server.py-ja. Az ephemeral portok szemléltetők.</p>
<script>
let S;
function reset(){ S = {backlog: +document.getElementById("bl").value, bind: document.getElementById("wild").checked ? "0.0.0.0" : "127.0.0.1", serving:null, queue:[], retry:[], n:0, done:[]}; say("bind + listen(" + S.backlog + "): a listener kész, Recv-Q 0."); draw(); }
function say(t){ document.getElementById("status").textContent = t; }
function connect(src){
  S.n++; const c = {name:"C" + S.n, port:43000 + S.n - 1};
  if (S.bind === "127.0.0.1" && src !== "127.0.0.1") { S.n--; say("127.0.0.2:18080 → ConnectionRefusedError: a listener csak a 127.0.0.1-re kötött (RST)."); return; }
  if (src !== "127.0.0.1") c.src = src;
  if (!S.serving && !S.queue.length) { S.serving = c; say(c.name + ": kézfogás kész, accept() átveszi → conn FD 4. A soros szerver ennek recv()-jén vár (input() pont)."); }
  else if (S.queue.length > S.backlog) { S.retry.push(c); say(c.name + ": az accept-sor tele (" + S.queue.length + " > backlog " + S.backlog + ") → a SYN eldobva, a kliens újrapróbál (kernelverzió-függő)."); }
  else { S.queue.push(c); say(c.name + ": a kernel befejezte a kézfogást, az accept-sorban vár → listener Recv-Q " + S.queue.length + "."); }
  draw();
}
function finish(){
  if (!S.serving) { say("Nincs kiszolgált kliens."); return; }
  const f = S.serving; S.done.push(f.name);
  S.serving = S.queue.length ? S.queue.shift() : null;
  if (S.retry.length && S.queue.length <= S.backlog) S.queue.push(S.retry.shift());
  say(f.name + " Enter → echo b'lab-ping\\n', lezárás." + (S.serving ? " accept() → " + S.serving.name + "; listener Recv-Q " + S.queue.length + "." : " A sor üres."));
  draw();
}
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, at, tx){ const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (tx !== undefined) e.textContent = tx; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function draw(){
  svg.innerHTML = "";
  const all = []; S.done.forEach(n => all.push([n, "lezárva"])); if (S.serving) all.push([S.serving.name, "kiszolgálva"]); S.queue.forEach(c => all.push([c.name, "accept-sorban"])); S.retry.forEach(c => all.push([c.name, "újrapróbál (SYN)"]));
  all.slice(-9).forEach(([n, st], i) => { const on = st === "kiszolgálva"; el("rect", {x:6, y:8+i*26, width:170, height:22, rx:4, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": st === "lezárva" || st.indexOf("újra") === 0 ? "3 3" : ""}); el("text", {x:12, y:24+i*26, "font-size":11.5}, n + "  " + st); });
  el("rect", {x:200, y:8, width:280, height:230, rx:10, fill: css("--code"), stroke: css("--line"), "stroke-width":1.5});
  el("text", {x:340, y:30, "text-anchor":"middle", "font-size":12.5, "font-weight":"bold"}, "listening " + S.bind + ":18080");
  el("text", {x:340, y:48, "text-anchor":"middle", "font-size":11.5}, "listen(" + S.backlog + ")");
  el("rect", {x:215, y:60, width:250, height:30, fill: css("--bg"), stroke: css("--muted"), "stroke-dasharray":"4 3"});
  el("text", {x:340, y:80, "text-anchor":"middle", "font-size":11.5}, "félkész (SYN_RECV)");
  el("text", {x:340, y:112, "text-anchor":"middle", "font-size":11.5}, "accept-sor (létrejött, nem átvett)");
  const slots = S.backlog + 1, w = Math.min(44, 240/slots);
  for (let j = 0; j < slots; j++) { const c = S.queue[j], x = 340 - slots*w/2 + j*w; el("rect", {x:x, y:122, width:w-3, height:40, fill: c ? css("--cellhl") : css("--bg"), stroke: css("--line"), "stroke-dasharray": j === slots - 1 ? "3 3" : ""}); if (c && w > 20) el("text", {x:x+(w-3)/2, y:147, "text-anchor":"middle", "font-size":11, "font-weight":"bold"}, c.name); }
  el("text", {x:340, y:182, "text-anchor":"middle", "font-size":11}, "Recv-Q = " + S.queue.length + "  (max " + slots + " = backlog+1)");
  el("rect", {x:505, y:60, width:128, height:110, rx:8, fill: css("--cell"), stroke: css("--line")});
  ["lab-server.py", "accept() → conn", "FD 4 = " + (S.serving ? S.serving.name : "–"), S.serving ? "recv() vár" : "accept() vár"].forEach((t, i) => el("text", {x:569, y:86+i*20, "text-anchor":"middle", "font-size":11.5}, t));
  el("line", {x1:480, y1:115, x2:505, y2:115, stroke: css("--line"), "stroke-dasharray":"5 3", "stroke-width":1.5});
  let ss = "$ ss -lnt 'sport = :18080'\nState  Recv-Q Send-Q Local Address:Port  Peer Address:Port\nLISTEN " + String(S.queue.length).padEnd(6) + " " + String(S.backlog).padEnd(6) + " " + (S.bind + ":18080").padEnd(19) + " 0.0.0.0:*";
  ss += "\n$ ss -nt '( sport = :18080 or dport = :18080 )'";
  const est = (S.serving ? [S.serving] : []).concat(S.queue);
  est.forEach(c => { ss += "\nESTAB  0      0      127.0.0.1:18080      127.0.0.1:" + c.port + "\nESTAB  0      0      127.0.0.1:" + c.port + "      127.0.0.1:18080"; });
  document.getElementById("ss").textContent = ss;
}
document.getElementById("add").onclick = () => connect("127.0.0.1");
document.getElementById("enter").onclick = finish;
document.getElementById("probe").onclick = () => connect("127.0.0.2");
document.getElementById("reset").onclick = reset;
document.getElementById("bl").addEventListener("input", () => { document.getElementById("blv").textContent = document.getElementById("bl").value; reset(); });
document.getElementById("wild").addEventListener("change", reset);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
reset();
for (let i = 0; i < 5; i++) connect("127.0.0.1");
say("4. lépés (a statikus ábra felső panelje): C1-et a szerver kiszolgálja (input()-nál vár), C2–C5 az accept-sorban → LISTEN 4 4. Próbáld: Kliens hozzáadása (C6, C7), majd Enter.");
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
