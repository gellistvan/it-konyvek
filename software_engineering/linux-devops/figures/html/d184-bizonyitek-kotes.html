<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizonyítékok kötése az image digesthez</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--s2:#e6e6e6;--s3:#bfbfbf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--s2:#333;--s3:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.mono{font-family:ui-monospace,monospace}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
 g.node{cursor:pointer} g.node:focus{outline:none}</style></head><body>
<div class="ctl"><button id="retag">tag átállítása új digestre</button><button id="reset">visszaállítás</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 650 470" role="img" aria-label="Csillag-gráf: a registry.lab.example:5000/lab/cpp-svc@sha256:9f6c image digest körül a v1.7.0 tag, SBOM, scan report, signature, provenance és exception"></svg>
<pre id="info" aria-label="Parancs és mintarészlet"></pre>
<p class="small">Kattints (vagy Tab + Enter) egy csomópontra: megjelenik a könyvbeli parancs (syft/grype/cosign, 37.4.3) és egy mintarészlet. Vastag folytonos nyíl = aláírt subject-kötés; pontozott = csak egymás mellett tárolt fájl; szaggatott = a mutálható tag. Illusztratív, rövidített digestek.</p>
<script>
const D = {"N": {"dig": {"x": 2.2, "y": 1.75, "w": 2.3, "h": 0.8, "t": "registry.lab.example:5000\n/lab/cpp-svc@sha256:9f6c…\n(manifest digest = subject)", "kind": null}, "tag": {"x": 2.6, "y": 3.55, "w": 1.5, "h": 0.48, "t": "tag v1.7.0\n(mutálható)", "kind": "tag"}, "sig": {"x": 4.8, "y": 2.85, "w": 1.5, "h": 0.72, "t": "signature\ncosign, kulcs /\nidentity", "kind": "signed"}, "prov": {"x": 0.0, "y": 1.55, "w": 1.85, "h": 1.0, "t": "provenance\nattestation\nsubject, builder,\nsource rev b6c49…", "kind": "signed"}, "sbom": {"x": 4.8, "y": 1.65, "w": 1.5, "h": 0.72, "t": "SBOM\nsha256:3ab2…\nSPDX JSON (syft)", "kind": "loose"}, "scan": {"x": 4.8, "y": 0.45, "w": 1.5, "h": 0.72, "t": "scan report\ngrype JSON\n(dátummal)", "kind": "loose"}, "exc": {"x": 2.35, "y": 0.1, "w": 1.95, "h": 0.72, "t": "exception\nCVE-2025-12345\nexpires 2025-12-31", "kind": "loose"}, "inp": {"x": 0.0, "y": 3.2, "w": 1.85, "h": 0.82, "t": "bemenetek:\ngit revision b6c49…\nbase image digest\ndependency tarball digest", "kind": null}}, "E": [{"a": "tag", "b": "dig", "kind": "tag", "p": [[3.35, 3.55], [3.35, 2.55]]}, {"a": "sig", "b": "dig", "kind": "signed", "p": [[4.802830188679245, 2.85], [4.180188679245283, 2.55]]}, {"a": "prov", "b": "dig", "kind": "signed", "p": [[1.85, 2.088144329896907], [2.2, 2.102577319587629]]}, {"a": "sbom", "b": "dig", "kind": "loose", "p": [[4.8, 2.0577272727272726], [4.5, 2.0768181818181817]]}, {"a": "scan", "b": "dig", "kind": "loose", "p": [[4.958955223880597, 1.17], [4.0067164179104475, 1.75]]}, {"a": "exc", "b": "dig", "kind": "loose", "p": [[3.3303254437869825, 0.82], [3.3440828402366867, 1.75]]}, {"a": "inp", "b": "prov", "kind": "input", "p": [[0.925, 3.2], [0.925, 2.55]]}, {"a": "exc", "b": "scan", "kind": "ref", "p": [[4.3, 0.613370786516854], [4.8, 0.6920224719101123]]}], "I": {"dig": ["docker buildx imagetools inspect registry.lab.example:5000/lab/cpp-svc:v1.7.0", "Digest: sha256:9f6c…  (minden bizonyíték erre mutat)"], "tag": ["docker push registry.lab.example:5000/lab/cpp-svc:v1.7.0", "a tag bármikor átírható másik digestre – csak mutató"], "sig": ["cosign sign --key cosign.key registry.lab.example:5000/lab/cpp-svc@sha256:9f6c…\ncosign verify --key cosign.pub registry.lab.example:5000/lab/cpp-svc@sha256:9f6c…", "a digest-referenciára tett aláírás a sha256:9f6c… subjecthez kötődik (a tag nem játszik szerepet)"], "prov": ["cosign verify-attestation …  (SLSA provenance)", "subject: sha256:9f6c…\nbuilder: BuildKit\nsource revision: b6c49…\ninput digests: base image digest, dependency tarball digest"], "sbom": ["syft registry.lab.example:5000/lab/cpp-svc@sha256:9f6c… -o spdx-json > cpp-svc-sbom.spdx.json", "SPDX JSON, sha256:3ab2… – a registryben egymás mellé tett fájl NEM kötés; aláírt attestationként (cosign attest) lenne az"], "scan": ["grype registry.lab.example:5000/lab/cpp-svc@sha256:9f6c… --output json > cpp-svc-scan.json", "a scan eredménye időpontfüggő (adatbázis-verzió + dátum); nem aláírt"], "exc": ["exception.yaml (illusztratív)", "cve: CVE-2025-12345\npackage: libfakelib\nexpires: \"2025-12-31\"\nowner: platform-security"], "inp": ["--label org.opencontainers.image.revision=b6c49…", "a provenance bemenetei: forrásrevision és a bemeneti artifactok digestjei"]}};
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(tag, a, txt, par){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; (par || svg).appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const S = 100, H = 4.45, X = x => x * S + 10, Y = y => (H - y) * S + 10;
let sel = "dig", moved = false;
const STY = {tag: ["7 4", 1.4], signed: ["", 3.2], loose: ["2 3", 1.6], input: ["", 1.1], ref: ["2 3", 1.1]};
function draw(){
  svg.innerHTML = "";
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`;
  const nodes = JSON.parse(JSON.stringify(D.N));
  if (moved) { nodes.tag.x = 4.75; nodes.tag.y = 3.95; nodes.dig2 = {x: 2.2, y: 3.0, w: 2.3, h: 0.5, t: "@sha256:7b21… (új build, v1.7.0)", kind: null}; }
  D.E.forEach(e => {
    let [[x0, y0], [x1, y1]] = e.p;
    if (e.kind === "tag" && moved) { x0 = 4.75 + 0.2; y0 = 3.95; x1 = 4.4; y1 = 3.5; }
    const [da, w] = STY[e.kind];
    el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: css("--line"), "stroke-width": w, "stroke-dasharray": da, "marker-end": "url(#ah)"});
  });
  Object.entries(nodes).forEach(([k, n]) => {
    const g = el("g", {class: "node", tabindex: 0, role: "button", "aria-label": n.t.replace(/\n/g, ", ")});
    el("rect", {x: X(n.x), y: Y(n.y + n.h), width: n.w * S, height: n.h * S, rx: 6, fill: k.startsWith("dig") ? css("--cellhl") : css("--cell"),
      stroke: k === sel ? css("--hl") : css("--line"), "stroke-width": k === sel ? 3.2 : (n.kind === "signed" ? 2.2 : 1.1), "stroke-dasharray": k === "tag" ? "6 4" : ""}, undefined, g);
    const L = n.t.split("\n");
    L.forEach((l, i) => el("text", {x: X(n.x + n.w / 2), y: Y(n.y + n.h / 2) + (i - (L.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": 11.5}, l, g));
    if (k !== "dig2") { g.addEventListener("click", () => { sel = k; draw(); });
      g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sel = k; draw(); } }); }
  });
  const inf = D.I[sel];
  document.getElementById("info").textContent = "$ " + inf[0] + "\n\n" + inf[1];
  document.getElementById("status").textContent = moved ?
    "A v1.7.0 tag most az új sha256:7b21… digestre mutat (illusztratív). Az SBOM, a scan, az aláírás, a provenance és az exception továbbra is a régi sha256:9f6c… digesthez kötött – az új digesthez mindet újra kell gyártani (syft, grype, cosign sign/attest)." :
    "Minden bizonyíték a sha256:9f6c… manifest digestre mint subjectre mutat; aláírt kötés csak a signature és a provenance. Kiválasztva: " + D.N[sel].t.split("\n")[0] + ".";
}
document.getElementById("retag").onclick = () => { moved = true; draw(); };
document.getElementById("reset").onclick = () => { moved = false; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
