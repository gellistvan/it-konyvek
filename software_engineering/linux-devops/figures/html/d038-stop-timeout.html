<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>systemctl stop és TimeoutStopSec</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>drain-idő <input id="dr" type="range" min="0" max="10" step="0.5" value="2" oninput="upd()" aria-label="drain-idő másodpercben"> <span id="drv">2,0 s</span></label> <label>TimeoutStopSec <input id="to" type="range" min="1" max="10" step="1" value="5" oninput="upd()" aria-label="TimeoutStopSec"> <span id="tov">5 s</span></label> <label><input type="checkbox" id="ig" onchange="upd()"> SIGTERM ignorálva</label> <button onclick="document.getElementById('dr').value=8;upd()">B eset: drain 8 s</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal TimeoutStopSec 5 másodperccel: 2 másodperces drain után cleanup done és exit 0; 8 másodperces drain esetén 5 másodpercnél SIGKILL, code=killed, signal=KILL."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés: a lab_graceful a SIGTERM után legfeljebb 200 ms alatt észleli a flaget; a drain a t = 0-tól számított drain-időpontban ér véget. A 137 = 128 + 9 a shell konvenciója (kill -9).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0.0, "msg": "t = 0 s: systemctl stop → SIGTERM (a handler flaget állít)", "done": false, "killed": false, "drain": 2, "to": 5, "handled": true, "line": -1}, {"t": 0.5, "msg": "t = 0,5 s: drain folyamatban; timeout 4,5 s múlva", "done": false, "killed": false, "drain": 2, "to": 5, "handled": true, "line": -1}, {"t": 1.0, "msg": "t = 1,0 s: drain folyamatban; timeout 4,0 s múlva", "done": false, "killed": false, "drain": 2, "to": 5, "handled": true, "line": -1}, {"t": 1.5, "msg": "t = 1,5 s: drain folyamatban; timeout 3,5 s múlva", "done": false, "killed": false, "drain": 2, "to": 5, "handled": true, "line": -1}, {"t": 2.0, "msg": "t = 2,0 s: „cleanup done”, exit 0 → systemctl status: Main PID … (code=exited, status=0/SUCCESS); lab_cleanup.txt: started + cleanup done", "done": true, "killed": false, "drain": 2, "to": 5, "handled": true, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DET=0.2;
function c1(x){return x.toFixed(1).replace(".",",");}
function outc(d,T,h){ if(h && d<=T) return {end:Math.max(d,DET),killed:false,status:"code=exited, status=0/SUCCESS",file:"started\ncleanup done"};
  return {end:T,killed:true,status:"code=killed, signal=KILL",file:"started"}; }
function gen(d,T,h){ const o=outc(d,T,h), S=[]; let t=0;
  while(true){ const tt=Math.min(t,o.end);
    if(tt>=o.end){ S.push({t:tt,done:true,killed:o.killed,drain:d,to:T,handled:h,line:-1,
      msg:"t = "+c1(tt)+" s: "+(o.killed?"SIGKILL (TimeoutStopSec lejárt) → ":"„cleanup done”, exit 0 → ")+"systemctl status: Main PID … ("+o.status+"); lab_cleanup.txt: "+o.file.replace("\n"," + ")+(o.killed?" ; shellből kill -9 esetén $? = 137":"")}); break; }
    let msg;
    if(tt===0) msg="t = 0 s: systemctl stop → SIGTERM"+(h?" (a handler flaget állít)":" (ignorálva!)");
    else if(h && tt<=DET+1e-9) msg="t = "+c1(tt)+" s: a fő ciklus észleli a flaget (≤ 200 ms), nem fogad új kérést";
    else msg=(h?"t = "+c1(tt)+" s: drain folyamatban":"t = "+c1(tt)+" s: a folyamat fut tovább (SIGTERM ignorálva)")+"; timeout "+c1(T-tt)+" s múlva";
    S.push({t:tt,msg:msg,done:false,killed:false,drain:d,to:T,handled:h,line:-1}); t+=0.5; }
  return S; }
function upd(){ const d=+document.getElementById("dr").value, T=+document.getElementById("to").value, h=!document.getElementById("ig").checked;
  document.getElementById("drv").textContent=c1(d)+" s"; document.getElementById("tov").textContent=T+" s";
  setSteps(gen(d,T,h)); }
function render(s){
  svg.setAttribute("viewBox","0 0 620 228"); svg.innerHTML="";
  const X=t=>60+t*52, y=90;
  for(let t=0;t<=10;t++){el("line",{x1:X(t),y1:150,x2:X(t),y2:155,stroke:css("--line")});el("text",{x:X(t),y:170,"text-anchor":"middle","font-size":11},String(t));}
  el("line",{x1:X(0),y1:150,x2:X(10),y2:150,stroke:css("--line")}); el("text",{x:X(5),y:188,"text-anchor":"middle","font-size":11},"idő [s]");
  const end=outc(s.drain,s.to,s.handled).end;
  if(s.handled){ el("rect",{x:X(0),y:y-18,width:X(Math.min(s.drain,end))-X(0),height:36,fill:css("--cellhl"),stroke:css("--line")});
    if(s.drain>end) el("rect",{x:X(end),y:y-18,width:X(s.drain)-X(end),height:36,fill:"none",stroke:css("--muted"),"stroke-dasharray":"3 3"});
    el("text",{x:X(0)+4,y:y+5,"font-size":11},"drain"); }
  else el("text",{x:X(0)+4,y:y+5,"font-size":11},"fut tovább (SIGTERM ignorálva)");
  el("line",{x1:X(s.to),y1:30,x2:X(s.to),y2:150,stroke:css("--hl2"),"stroke-width":2,"stroke-dasharray":"6 4"});
  el("text",{x:X(s.to)+4,y:40,"font-size":11,fill:css("--hl2")},"TimeoutStopSec = "+s.to+" s");
  el("text",{x:X(0),y:40,"font-size":11},"SIGTERM ▼");
  el("line",{x1:X(s.t),y1:50,x2:X(s.t),y2:150,stroke:css("--hl"),"stroke-width":3});
  if(s.done){ if(s.killed){ el("path",{d:`M${X(s.t)},60 l-10,22 h9 l-7,22 l20,-28 h-9 l7,-16 z`,fill:css("--hl2")}); el("text",{x:X(s.t)+14,y:76,"font-size":13,"font-weight":"bold",fill:css("--hl2")},"SIGKILL"); }
    else el("text",{x:X(s.t)+6,y:76,"font-size":13,"font-weight":"bold",fill:css("--hl")},"exit 0"); }
  const f = s.done ? outc(s.drain,s.to,s.handled).file : "started";
  el("text",{x:10,y:210,"font-size":12,"font-family":"monospace"},"lab_cleanup.txt: "+f.replace("\n"," | "));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
