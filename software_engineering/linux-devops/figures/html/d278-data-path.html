<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data path és telemetriapontok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hiba: <select id="fault"><option>nincs hiba</option><option>DNS NXDOMAIN</option><option>nincs endpoint</option><option>NetworkPolicy drop</option><option>pod not Ready</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat réteg: DNS, Gateway, Service, NetworkPolicy, Pod és PVC/DB, mindegyik a mérési pontjával; hibamódban a 503 visszafelé haladó diagnosztikával lokalizálható."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Logikai modell a payment-srv példáján (lab-k8s, namespace lab-app, payment-srv:8080, PVC payment-srv-data), nem mérés. A parancsok a 56.3.2 ellenőrző parancssorából valók; a Gateway-napló helye a használt Gateway-implementációtól függ.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Kliens/DNS (lab-app.example.com): dig +short lab-app.example.com → várt: a Gateway IP-címe", "at": 0, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": ""}, {"msg": "2. Gateway (:443, TLS-termináció): curl -fsS -o /dev/null -w \"%{http_code} %{time_total}s\\n\" https://lab-app.example.com/readyz → várt: 200 0.02s", "at": 1, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": ""}, {"msg": "3. Service (payment-srv ClusterIP:8080): kubectl --context lab-k8s-admin -n lab-app get endpointslices -l kubernetes.io/service-name=payment-srv → várt: ready Pod IP-k :8080", "at": 2, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": ""}, {"msg": "4. NetworkPolicy (allow-from-gateway): kubectl --context lab-k8s-admin -n lab-app get networkpolicy → várt: allow-from-gateway", "at": 3, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": ""}, {"msg": "5. Pod (/readyz): wget -qO- http://payment-srv.lab-app.svc.cluster.local:8080/readyz → várt: ok", "at": 4, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": ""}, {"msg": "6. PVC/DB (payment-srv-data): kubectl --context lab-k8s-admin -n lab-app get pvc payment-srv-data -o wide → várt: Bound | curl → 200", "at": 5, "bad": null, "phase": "fwd", "diag": -1, "fault": "nincs hiba", "code": "200"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const LAY = [["Kliens/DNS", "lab-app.example.com", "lekérdezési idő, válaszkód", "NXDOMAIN, timeout", "dig +short lab-app.example.com", "a Gateway IP-címe", "dst <Gateway IP>:443, TLS"], ["Gateway", ":443, TLS-termináció", "access log: státusz, latency", "502, 503, 504", "curl -fsS -o /dev/null -w \"%{http_code} %{time_total}s\\n\" https://lab-app.example.com/readyz", "200 0.02s", "HTTP GET /readyz → payment-srv:8080"], ["Service", "payment-srv ClusterIP:8080", "endpoint elérhetőség", "nincs endpoint", "kubectl --context lab-k8s-admin -n lab-app get endpointslices -l kubernetes.io/service-name=payment-srv", "ready Pod IP-k :8080", "dst Pod IP:8080 (DNAT)"], ["NetworkPolicy", "allow-from-gateway", "eldobott csomagok (CNI log)", "timeout", "kubectl --context lab-k8s-admin -n lab-app get networkpolicy", "allow-from-gateway", "engedélyezett ingress"], ["Pod", "/readyz", "http_request_duration_seconds", "500, crash", "wget -qO- http://payment-srv.lab-app.svc.cluster.local:8080/readyz", "ok", "HTTP 200 válasz"], ["PVC/DB", "payment-srv-data", "volume-kapacitás, DB latency", "disk full, lock", "kubectl --context lab-k8s-admin -n lab-app get pvc payment-srv-data -o wide", "Bound", "–"]], DIAG = [["Gateway log", "kubectl -n <gateway-ns> logs <gateway-pod> | grep ' 503 '"], ["EndpointSlice", "kubectl --context lab-k8s-admin -n lab-app get endpointslices -l kubernetes.io/service-name=payment-srv"], ["pod Ready", "kubectl --context lab-k8s-admin -n lab-app get pods -l app=payment-srv -o wide (READY 1/1?)"], ["NetworkPolicy", "kubectl --context lab-k8s-admin -n lab-app get networkpolicy"]], FAULTS = {"nincs hiba": [null, "200", null], "DNS NXDOMAIN": [0, "000 (Could not resolve host)", null], "nincs endpoint": [2, "503", 1], "NetworkPolicy drop": [3, "503 / timeout", 3], "pod not Ready": [4, "503", 2]};
function stepsFor(f){
  const fx = FAULTS[f], bad = fx[0], code = fx[1], found = fx[2], out = [];
  for (let i = 0; i < 6; i++) { if (bad !== null && i > bad) break; const L = LAY[i], failed = bad === i;
    let m = (i + 1) + ". " + L[0] + " (" + L[1] + "): " + L[4] + " → " + (failed ? "HIBA: " + L[3] : "várt: " + L[5]);
    if (failed || (bad === null && i === 5)) m += " | curl → " + code;
    out.push({msg: m, at: i, bad: bad, phase: "fwd", diag: -1, fault: f, code: (failed || i === 5) ? code : ""}); }
  if (found !== null) for (let j = 0; j < 4; j++) { const hit = j === found;
    out.push({msg: "vissza " + (j + 1) + ". " + DIAG[j][0] + ": " + DIAG[j][1] + " → " + (hit ? "ITT A HIBA" : (j === 0 ? "503 a naplóban" : "rendben")), at: bad, bad: bad, phase: "back", diag: j, fault: f, code: code});
    if (hit) break; }
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = ""; defs0();
  const W = 110, X = i => 8 + i * 115, hdr = ["HTTPS GET /readyz", "HTTP → payment-srv", "dst ClusterIP:8080", "dst Pod IP:8080", "200 OK", "PVC Bound"];
  for (let i = 0; i < 6; i++) { const L = LAY[i], isBad = s.bad === i && (s.phase === "back" || s.at >= i), on = s.phase === "fwd" && s.at === i;
    R(X(i), 20, W, 160, {rx: 0, fill: i % 2 ? css("--cell") : "url(#dots)", "stroke-width": isBad ? 3.5 : (on ? 3 : 1), "stroke-dasharray": isBad ? "8 4" : "", stroke: isBad ? css("--hl2") : (on ? css("--hl") : css("--line"))});
    R(X(i) + 4, 26, W - 8, 42, {fill: css("--bg"), stroke: "none"});
    T(X(i) + W / 2, 40, L[0], {"font-size": 12, "text-anchor": "middle", "font-weight": "bold"}); T(X(i) + W / 2, 54, L[1].split(" ").slice(0, 2).join("\n"), {"font-size": 9.5, "text-anchor": "middle"});
    R(X(i) + 4, 120, W - 8, 52, {fill: css("--bg"), stroke: "none"});
    T(X(i) + W / 2, 135, L[2].split(", ")[0].slice(0, 22), {"font-size": 9, "text-anchor": "middle", "font-style": "italic"});
    T(X(i) + W / 2, 160, "hiba: " + L[3], {"font-size": 9, "text-anchor": "middle"});
    if (isBad) XM(X(i) + W / 2, 92, 16); }
  if (s.phase === "fwd") { const i = s.at; R(X(i) + 8, 76, W - 16, 30, {fill: css("--cellhl"), stroke: css("--hl"), "stroke-width": 2}); T(X(i) + W / 2, 95, hdr[i], {"font-size": 10, "text-anchor": "middle"}); }
  if (s.phase === "back") { const cols = [1, 2, 4, 3];
    for (let j = 0; j <= s.diag; j++) { const x = X(cols[j]) + W / 2; el("circle", {cx: x, cy: 210, r: 13, fill: j === s.diag ? css("--hl") : css("--cell"), stroke: css("--line")});
      T(x, 215, String(j + 1), {"font-size": 13, "text-anchor": "middle", "font-weight": "bold", fill: j === s.diag ? css("--bg") : css("--fg")});
      if (j > 0) { const xp = X(cols[j - 1]) + W / 2; A(xp + (x > xp ? 14 : -14), 210, x + (x > xp ? -15 : 15), 210); } }
    T(8, 250, "visszafelé: Gateway log → EndpointSlice → pod Ready → NetworkPolicy", {"font-size": 11}); }
  if (s.code) T(8, 290, "curl -w \"%{http_code}\" → " + s.code, {"font-size": 15, "font-weight": "bold", fill: s.code === "200" ? css("--hl") : css("--hl2")});
}
document.getElementById("fault").addEventListener("change", e => setSteps(stepsFor(e.target.value)));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
