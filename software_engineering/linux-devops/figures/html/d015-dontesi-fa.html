<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardverhiba vagy workload: döntési fa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="yes" onclick="answer('igen')">igen</button><button id="no" onclick="answer('nem')">nem</button><button onclick="setSteps(F3S)">F3 forgatókönyv</button><span class="small">A kérdésnél válaszolj igen/nem gombbal, vagy játszd le az F3 útját.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Döntési fa: MCE/EDAC/thermal jel, VM-vendég, OOM/cgroup jel kérdésekkel; kimenetek: hardveres gyanú, host/BMC bizonyíték kérése, workload/limit-probléma, erőforrás-mérés. Az F3 útja kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Read-only parancsok a 3.5 fejezetből; a memory.events (cgroup v2 oom_kill számláló) kiegészítés. A kimenetek illusztratívak, nem futtatott eredmények. A VM-ben üres MCE/EDAC-napló nem bizonyítja a fizikai host hibátlanságát.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "root", "ans": null, "path": ["root"], "cmd": [], "out": "", "msg": "Tünet: éjszakai teszt után OOM-kill a naplóban; reggel 2,4 GiB elérhető (F3). Az első kérdés: van-e hardveres hibajel?", "line": -1}, {"node": "Q1", "ans": null, "path": ["root", "Q1"], "cmd": ["sudo dmesg -T | grep -Ei 'machine check|mce:|edac|thermal'", "grep -s . /sys/devices/system/edac/mc/mc*/ce_count"], "out": "", "msg": "1. kérdés: van-e MCE/EDAC/thermal jel?", "line": -1}, {"node": "Q2", "ans": "nem", "path": ["root", "Q1", "Q2"], "cmd": ["sudo dmesg -T | grep -Ei 'machine check|mce:|edac|thermal'", "grep -s . /sys/devices/system/edac/mc/mc*/ce_count"], "out": "(üres kimenet: a vendég kernel nem látott MCE/EDAC/thermal eseményt)", "msg": "Q1: nem – VM-vendég?", "line": -1}, {"node": "Q2", "ans": null, "path": ["root", "Q1", "Q2"], "cmd": ["lscpu | grep 'Hypervisor vendor'"], "out": "", "msg": "2. kérdés: VM-vendég?", "line": -1}, {"node": "VM", "ans": "igen", "path": ["root", "Q1", "Q2", "VM"], "cmd": ["lscpu | grep 'Hypervisor vendor'"], "out": "Hypervisor vendor:        KVM", "msg": "Q2: igen – Az üres log nem bizonyíték: host/BMC napló kérése, majd tovább", "line": -1}, {"node": "Q3", "ans": null, "path": ["root", "Q1", "Q2", "VM", "Q3"], "cmd": ["journalctl -k --no-pager | grep -i oom", "grep oom_kill /sys/fs/cgroup/<szolgáltatás>/memory.events"], "out": "", "msg": "Mellékág után tovább: 3. kérdés – van-e OOM/cgroup jel?", "line": -1}, {"node": "WL", "ans": "igen", "path": ["root", "Q1", "Q2", "VM", "Q3", "WL"], "cmd": ["journalctl -k --no-pager | grep -i oom", "grep oom_kill /sys/fs/cgroup/<szolgáltatás>/memory.events"], "out": "… Out of memory: Killed process <PID> (<név>) … / oom_kill 1", "msg": "Q3: igen – Workload/limit-probléma: memóriaterhelés és cgroup-limit vizsgálata", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = {"root": {"kind": "root", "text": "Tünet: lassulás / OOM kill / váratlan újraindulás"}, "Q1": {"kind": "q", "text": "Van MCE/EDAC/\nthermal jel?", "yes": "HW", "no": "Q2", "out": {"igen": "[Mon …] mce: [Hardware Error]: … / mc0/ce_count: 17 (nő)", "nem": "(üres kimenet: a vendég kernel nem látott MCE/EDAC/thermal eseményt)"}}, "HW": {"kind": "leaf", "text": "Hardveres gyanú: trend\n(nő a ce_count?)\n+ workload-adat is"}, "Q2": {"kind": "q", "text": "VM-vendég?", "yes": "VM", "no": "Q3", "out": {"igen": "Hypervisor vendor:        KVM", "nem": "(nincs Hypervisor vendor sor: fizikai gép)"}}, "VM": {"kind": "weak", "text": "Az üres log nem bizonyíték:\nhost/BMC napló kérése,\nmajd tovább"}, "Q3": {"kind": "q", "text": "Van OOM/\ncgroup jel?", "yes": "WL", "no": "RES", "out": {"igen": "… Out of memory: Killed process <PID> (<név>) … / oom_kill 1", "nem": "(üres: nincs OOM-kill, a cgroup oom_kill számlálója 0)"}}, "WL": {"kind": "leaf", "text": "Workload/limit-probléma:\nmemóriaterhelés és\ncgroup-limit vizsgálata"}, "RES": {"kind": "leaf", "text": "Erőforrás-mérés\n(CPU/memória, 3.1–3.4)"}};
const POS = {"root": [5.0, 13.5], "Q1": [2.3, 11.6], "HW": [8.0, 11.6], "Q2": [2.3, 8.4], "VM": [8.0, 8.4], "Q3": [2.3, 5.2], "WL": [8.0, 5.2], "RES": [2.3, 1.9]};
const CMD = {"Q1": ["sudo dmesg -T | grep -Ei 'machine check|mce:|edac|thermal'", "grep -s . /sys/devices/system/edac/mc/mc*/ce_count"], "Q2": ["lscpu | grep 'Hypervisor vendor'"], "Q3": ["journalctl -k --no-pager | grep -i oom", "grep oom_kill /sys/fs/cgroup/<szolgáltatás>/memory.events"]};
const F3S = STEPS;
function X(x){ return 20 + x * 52; }
function Y(y){ return 15 + (14.2 - y) * 34; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 560"); svg.innerHTML = "";
  const L = css("--line"), C = css("--cell"), H = css("--hl"), W = css("--hl2"), HL = css("--cellhl"), M = css("--muted");
  const E = [["root","Q1"],["Q1","HW","igen"],["Q1","Q2","nem"],["Q2","VM","igen"],["Q2","Q3","nem"],["VM","Q3"],["Q3","WL","igen"],["Q3","RES","nem"]];
  const onPath = (a, b) => { const p = s.path; for (let i = 1; i < p.length; i++) if (p[i - 1] === a && p[i] === b) return true; return false; };
  E.forEach(([a, b, lab]) => { const on = onPath(a, b), dash = a === "VM";
    el("line", {x1: X(POS[a][0]), y1: Y(POS[a][1]), x2: X(POS[b][0]), y2: Y(POS[b][1]), stroke: on ? H : M, "stroke-width": on ? 4 : 1.2, "stroke-dasharray": dash ? "7 4" : ""});
    if (lab) el("text", {x: (X(POS[a][0]) + X(POS[b][0])) / 2 + 6, y: (Y(POS[a][1]) + Y(POS[b][1])) / 2 - 4, "font-size": 12, "font-style": "italic", fill: on ? H : M}, lab); });
  for (const kk in NODES){
    const n = NODES[kk], [x, y] = [X(POS[kk][0]), Y(POS[kk][1])], cur = kk === s.node, vis = s.path.includes(kk);
    const st = cur ? W : (vis ? H : L), sw = cur ? 3.5 : (vis ? 2.5 : 1.2);
    if (n.kind === "q") el("polygon", {points: `${x - 82},${y} ${x},${y - 30} ${x + 82},${y} ${x},${y + 30}`, fill: vis ? HL : C, stroke: st, "stroke-width": sw});
    else { const w = kk === "root" ? 480 : 190, h = kk === "root" ? 28 : 52;
      el("rect", {x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 12, fill: vis ? HL : C, stroke: st, "stroke-width": sw, "stroke-dasharray": n.kind === "weak" ? "7 4" : ""}); }
    const lines = n.text.split("\n");
    lines.forEach((t, i) => el("text", {x, y: y + 4 + (i - (lines.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11.5, "font-weight": cur ? "bold" : "normal"}, t));
  }
  let yy = 512;
  if (s.cmd.length){ s.cmd.forEach(c => { el("text", {x: 6, y: yy, "font-size": 11.5, "font-family": "ui-monospace,monospace"}, "$ " + c); yy += 16; }); }
  if (s.out) el("text", {x: 6, y: yy, "font-size": 11.5, "font-family": "ui-monospace,monospace", fill: M}, "illusztratív kimenet: " + s.out);
  const q = NODES[s.node] && NODES[s.node].kind === "q";
  document.getElementById("yes").disabled = !q; document.getElementById("no").disabled = !q;
}
function answer(a){
  const s = STEPS[k]; if (!NODES[s.node] || NODES[s.node].kind !== "q") return;
  const n = NODES[s.node], nxt = a === "igen" ? n.yes : n.no, path = s.path.concat([nxt]);
  const add = [{node: nxt, ans: a, path, cmd: CMD[s.node] || [], out: n.out[a], line: -1, msg: s.node + ": " + a + " – " + NODES[nxt].text.replace(/\n/g, " ")}];
  if (nxt === "VM") add.push({node: "Q3", ans: null, path: path.concat(["Q3"]), cmd: CMD.Q3, out: "", line: -1, msg: "Mellékág után tovább: 3. kérdés – van-e OOM/cgroup jel?"});
  else if (nxt[0] === "Q") add.push({node: nxt, ans: null, path, cmd: CMD[nxt], out: "", line: -1, msg: "Következő kérdés: " + NODES[nxt].text.replace(/\n/g, "")});
  const list = STEPS.slice(0, k + 1).concat(add); setSteps(list); show(list.length - (nxt[0] === "Q" || nxt === "VM" ? 2 : 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
