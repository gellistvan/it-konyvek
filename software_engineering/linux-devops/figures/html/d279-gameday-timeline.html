<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canary game day timeline</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>SLO <input type="range" id="slo" min="99" max="99.99" step="0.01" value="99.9" style="width:110px"> <b id="vslo">99,90</b>%</label> <label>5xx-arány <input type="range" id="err" min="0.1" max="10" step="0.1" value="3" style="width:110px"> <b id="verr">3,0</b>%</label> <label>riasztási küszöb <input type="range" id="thr" min="1" max="50" step="0.1" value="14.4" style="width:90px"> <b id="vthr">14,4</b>×</label> <label><input type="checkbox" id="data"> adatintegritás sérült</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal: injektálás, ImagePullBackOff 80 s után, adatgyűjtés, 30-szoros burn rate, rollback-döntés, commit és sync, sikeres rollout, postcondition; a döntési fa három kimenete restore, rollback és diagnosis first."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított/illusztratív, nem mérés: burn rate = 5xx-arány / (1 − SLO); 99,9%-os SLO és 3% mellett 30×. A riasztási küszöb példaérték (14,4×: 1 órás gyors-burn riasztás). Lépésenként a 56.4.6 timeline-mezői (time_utc, actor, target, command, observed_state, hypothesis, decision).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. time_utc: T0 | actor: játékmester | target: payment-srv-canary | command: GitOps commit: canary image → nem létező digest (rc.2) + visszavont lab-deploy token | observed_state: – | hypothesis: – | decision: fault injection", "i": 0, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "2. time_utc: T0+80 s | actor: ügyeletes | target: lab-app namespace | command: kubectl --context lab-k8s-admin -n lab-app get pods | observed_state: canary 0/1 ImagePullBackOff | hypothesis: rossz image tag? | decision: adatgyűjtés", "i": 1, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "3. time_utc: T0+2 perc | actor: ügyeletes | target: canary pod + Secret | command: kubectl describe pod payment-srv-canary-6f4d8c9-xyz7; get secret lab-registry-cred | observed_state: ErrImagePull: NotFound + érvénytelen token | hypothesis: két hiba: nem létező digest és visszavont credential | decision: SLI ellenőrzése", "i": 2, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "4. time_utc: T0+3 perc | burn rate = 3,00% / 0,10% = 30,0× → rollback-ág", "i": 3, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "5. time_utc: T0+4 perc | decision: canary rollback (Git revert / canary weight 0)", "i": 4, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "6. time_utc: T0+5 perc | actor: ügyeletes | target: lab-platform (GitOps) | command: git commit (apps/payment-srv/canary.yaml stabil digest, canary súly 0; token-rotáció ExternalSecrettel); argocd app diff/sync lab-app-platform | observed_state: sync elindult | hypothesis: – | decision: egy változtatás", "i": 5, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "7. time_utc: T0+7 perc | actor: ügyeletes | target: canary Deployment | command: kubectl rollout status deployment/payment-srv-canary | observed_state: successfully rolled out | hypothesis: – | decision: verification", "i": 6, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}, {"msg": "8. time_utc: T0+8 perc | actor: incident lead | target: lab-app | command: kubectl run lab-pull-test … (rotált lab-registry-cred); SLI-ellenőrzés | observed_state: 5xx 0,1%, Secret érvényes | hypothesis: – | decision: postcondition, timeline lezárása", "i": 7, "burn": 29.99999999999997, "dec": "rollback", "slo": 0.999, "err": 0.03, "thr": 14.4, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const EV = [[0, "o", "T0", "játékmester", "payment-srv-canary", "GitOps commit: canary image → nem létező digest (rc.2) + visszavont lab-deploy token", "–", "–", "fault injection"], [80, "o", "T0+80 s", "ügyeletes", "lab-app namespace", "kubectl --context lab-k8s-admin -n lab-app get pods", "canary 0/1 ImagePullBackOff", "rossz image tag?", "adatgyűjtés"], [120, "o", "T0+2 perc", "ügyeletes", "canary pod + Secret", "kubectl describe pod payment-srv-canary-6f4d8c9-xyz7; get secret lab-registry-cred", "ErrImagePull: NotFound + érvénytelen token", "két hiba: nem létező digest és visszavont credential", "SLI ellenőrzése"], [180, "s", "T0+3 perc", "ügyeletes", "SLO", "burn rate = 5xx-arány / (1 − SLO)", "3% / 0,1% = 30×", "gyors budget-fogyás", "döntési fa"], [240, "s", "T0+4 perc", "incident lead", "canary", "döntési fa: adat ép, burn rate > küszöb", "adatintegritás rendben", "a canary okozza az 5xx-et", "canary rollback"], [300, "^", "T0+5 perc", "ügyeletes", "lab-platform (GitOps)", "git commit (apps/payment-srv/canary.yaml stabil digest, canary súly 0; token-rotáció ExternalSecrettel); argocd app diff/sync lab-app-platform", "sync elindult", "–", "egy változtatás"], [420, "o", "T0+7 perc", "ügyeletes", "canary Deployment", "kubectl rollout status deployment/payment-srv-canary", "successfully rolled out", "–", "verification"], [480, "o", "T0+8 perc", "incident lead", "lab-app", "kubectl run lab-pull-test … (rotált lab-registry-cred); SLI-ellenőrzés", "5xx 0,1%, Secret érvényes", "–", "postcondition, timeline lezárása"]], FIELDS = ["time_utc", "actor", "target", "command", "observed_state", "hypothesis", "decision"];
function g(id){ return +document.getElementById(id).value; }
function errAt(t, base, err){ if (t < 60) return base; if (t < 90) return base + (err - base) * (t - 60) / 30; if (t < 330) return err; if (t < 420) return err - (err - base) * (t - 330) / 90; return base; }
function build(){
  const slo = g("slo") / 100, err = g("err") / 100, thr = g("thr"), data = document.getElementById("data").checked;
  document.getElementById("vslo").textContent = hu(slo * 100, 2); document.getElementById("verr").textContent = hu(err * 100, 1); document.getElementById("vthr").textContent = hu(thr, 1);
  const burn = err / (1 - slo), dec = data ? "restore" : (burn > thr ? "rollback" : "diagnosis");
  return EV.map((e, i) => { const row = FIELDS.map((f, j) => f + ": " + e[j + 2]).join(" | ");
    let m = (i + 1) + ". " + row;
    if (i === 3) m = (i + 1) + ". time_utc: " + e[2] + " | burn rate = " + hu(err * 100, 2) + "% / " + hu((1 - slo) * 100, 2) + "% = " + hu(burn, 1) + "× → " + (dec === "rollback" ? "rollback-ág" : dec === "restore" ? "restore-ág (adat sérült)" : "diagnosis first");
    if (i === 4) m = (i + 1) + ". time_utc: " + e[2] + " | decision: " + (dec === "rollback" ? "canary rollback (Git revert / canary weight 0)" : dec === "restore" ? "restore snapshotból (adatintegritás sérült)" : "diagnosis first (a burn rate a küszöb alatt)");
    return {msg: m, i: i, burn: burn, dec: dec, slo: slo, err: err, thr: thr, line: -1}; });
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 300"); svg.innerHTML = ""; defs0();
  const x0 = 40, W = 400, X = t => x0 + t * W / 540, top = Math.max(4, s.err * 100 * 1.2), Y = p => 120 - p / top * 100;
  L(x0, 120, x0 + W, 120); L(x0, 20, x0, 120); T(x0 - 4, 24, hu(top, 1) + "%", {"font-size": 10, "text-anchor": "end"}); T(x0 - 4, 124, "0", {"font-size": 10, "text-anchor": "end"});
  let d = ""; for (let t = 0; t <= 540; t += 5) d += (t ? " L " : "M ") + X(t) + " " + Y(errAt(t, 0.1, s.err * 100));
  el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  const bud = (1 - s.slo) * 100; L(x0, Y(bud), x0 + W, Y(bud), {"stroke-dasharray": "6 4"}); T(x0 + W, Y(bud) - 4, "budget-szint " + hu(bud, 2) + "%", {"font-size": 10, "text-anchor": "end"});
  T(x0 + 4, 16, "burn rate = " + hu(s.burn, 1) + "×", {"font-size": 12, "font-weight": "bold"});
  L(x0, 160, x0 + W, 160);
  EV.forEach((e, i) => { const x = X(e[0]), on = i === s.i, f = on ? css("--hl") : (i < s.i ? css("--fg") : css("--cell"));
    if (e[1] === "o") el("circle", {cx: x, cy: 160, r: 7, fill: f, stroke: css("--line")});
    else if (e[1] === "s") R(x - 7, 153, 14, 14, {rx: 0, fill: f});
    else el("polygon", {points: [x, 151, x + 8, 167, x - 8, 167].join(","), fill: f, stroke: css("--line")});
    T(x, 186, String(i + 1), {"font-size": 11, "text-anchor": "middle"}); L(x, 120, x, 152, {"stroke-dasharray": "2 3", stroke: css("--muted")}); });
  T(x0, 206, "T0 … T0+8 perc", {"font-size": 10, fill: css("--muted")});
  const hi = (k) => s.i >= 4 && s.dec === k;
  const dia = (x, y, t, on) => { el("polygon", {points: [x - 62, y, x, y - 24, x + 62, y, x, y + 24].join(","), fill: css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    T(x, y + 4, t, {"font-size": 10, "text-anchor": "middle"}); };
  const lf = (x, y, t, on) => { R(x - 50, y - 16, 100, 32, {fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : 1});
    T(x, y + 4, t, {"font-size": 11, "text-anchor": "middle", "font-weight": on ? "bold" : "normal"}); };
  dia(540, 40, "adat sérült?", s.i >= 3); lf(645, 40, "restore", hi("restore"));
  dia(540, 130, "burn > " + hu(s.thr, 1) + "×?", s.i >= 3 && s.dec !== "restore"); lf(645, 215, "rollback", hi("rollback")); lf(500, 250, "diagnosis first", hi("diagnosis"));
  A(602, 40, 594, 40); T(598, 32, "igen", {"font-size": 9}); A(540, 64, 540, 106); T(546, 88, "nem", {"font-size": 9});
  A(580, 150, 620, 198); T(606, 168, "igen", {"font-size": 9}); A(520, 152, 505, 233); T(498, 196, "nem", {"font-size": 9});
}
function upd(){ const kk = k; setSteps(build()); show(kk); }
["slo", "err", "thr", "data"].forEach(id => document.getElementById(id).addEventListener("input", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
