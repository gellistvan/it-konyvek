<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoscale-késés alatti sorhossz</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>λ új <input type="range" id="lam" min="500" max="2000" step="50" value="1000" style="width:80px"> <b id="vlam">1000</b></label> <label>minReplicas <input type="range" id="reps" min="1" max="12" value="3" style="width:70px"> <b id="vreps">3</b></label> <label>CPU/kérés <input type="range" id="cpu" min="0.5" max="5" step="0.1" value="1.5" style="width:70px"> <b id="vcpu">1,5</b> ms</label> <span>→ C<sub>current</sub> = <b id="vc0">500</b> RPS</span> <label>D<sub>scale</sub> <input type="range" id="d" min="0" max="300" step="10" value="120" style="width:70px"> <b id="vd">120</b> s</label> <label>C<sub>új</sub> <input type="range" id="c1" min="500" max="3000" step="50" value="1200" style="width:80px"> <b id="vc1">1200</b></label> <label><input type="checkbox" id="shed"> load shedding a timeout-szint felett</label> <button id="six">minReplicas 6</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A forgalom 500-ról 1000 RPS-re ugrik; a kapacitás 120 s-ig 500 RPS marad, a sor 60 000 kérésig nő, majd 1200 RPS kapacitással 300 s alatt kiürül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított fluid modell, nem mérés. Feltevés: C_current = minReplicas · 0,25 mag / CPU-idő kérésenként (a 0,25 mag a pod CPU-kerete a HPA-célon; 3 pod · 1,5 ms → 500 RPS, a 2. feladat kapacitása). Timeout 2 s: L/C > 2 s esetén az érkező kérés hibára fut.</p>

function g(id){ return +document.getElementById(id).value; }
function simulate(lam, c0, d, c1, tEnd, shed){
  let L = 0, fail = 0; const out = [];
  for (let t = 0; t <= tEnd; t++) { const c = t < d ? c0 : c1; out.push([t, lam, c, L, fail]);
    const lim = c * TO; if (L > lim) fail += lam; L = Math.max(0, L + lam - c); if (shed && L > lim) { fail += L - lim; L = lim; } }
  return out;
}
function build(){
  const lam = g("lam"), reps = g("reps"), cpu = g("cpu"), d = g("d"), c1 = g("c1"), shed = document.getElementById("shed").checked;
  const c0 = Math.round(reps * 0.25 / (cpu / 1000));
  document.getElementById("vlam").textContent = lam; document.getElementById("vreps").textContent = reps; document.getElementById("vcpu").textContent = hu(cpu, 1);
  document.getElementById("vd").textContent = d; document.getElementById("vc1").textContent = c1; document.getElementById("vc0").textContent = c0;
  const sim = simulate(lam, c0, d, c1, 600, shed), steps = [];
  for (let t = 0; t <= 600; t += 10) { const x = sim[t], w = x[3] / x[2];
    steps.push({msg: "t = " + t + " s: λ = " + lam + " RPS, C = " + x[2] + " RPS, L = " + Math.round(x[3]).toLocaleString("hu-HU") + " kérés, várakozás L/C = " + hu(w, 1) + " s"
      + (w > TO ? " > timeout (2 s)" : "") + "; hibás kérések (halmozott): " + Math.round(x[4]).toLocaleString("hu-HU") + (c1 <= lam ? " – FIGYELEM: C_új ≤ λ, a sor sosem ürül" : ""), t: t, sim: sim, c0: c0}); }
  return steps;
}

  const cmax = Math.max(1400, ...sim.map(x => Math.max(x[1], x[2]))) * 1.05, Y1 = v => 130 - v / cmax * 110;

let k = 0, timer = null;

function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));

}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
