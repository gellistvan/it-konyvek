<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immutable promotion: azonos digest stagingben és prodban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="tag"> tag-promotion hiba (payment-srv:v0.4.2 a digest helyett)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat lépéses delivery-lánc, minden lépés alatt a keletkező azonosítóval; a staging és prod sáv azonos image-digestet kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illusztratív, dummy digest (sha256:1111…), nem futtatott pipeline. Az evidence-mezők a 56.2.2 release-evidence JSON kulcsai (pontozott kulcs = beágyazott mező). A prod promotion nem épít újra: ugyanaz az image.digest kerül a config/prod/values.yaml-ba, csak a környezeti értékek térnek el.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1 Native build/test: cmake --build build --target payment-srv; sha256sum build/payment-srv-linux-amd64.tar.zst", "i": 0, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id"}, "tagErr": false, "bad": false}, {"msg": "2 Image build+push: docker buildx imagetools inspect ghcr.io/lab-org/payment-srv:v0.4.2 → digest; cosign sign / cosign attest", "i": 1, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance"}, "tagErr": false, "bad": false}, {"msg": "3 Render+policy: helm template payment-srv ./charts/payment-srv --namespace lab-app-staging … > build/payment-srv-staging-rendered.yaml; kubeconform -strict -summary …; conftest test --policy ./policy/rendered …", "i": 2, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance", "rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS"}, "tagErr": false, "bad": false}, {"msg": "4 Git promotion commit: git commit -s -m \"promote payment-srv v0.4.2 digest to staging\"; git push -u origin promote/payment-srv/staging-v0.4.2; gh pr merge --squash", "i": 3, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance", "rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS", "environment": "staging"}, "tagErr": false, "bad": false}, {"msg": "5 Argo CD sync: argocd app sync lab-app-staging --revision \"$main_sha\"   # main_sha = git rev-parse origin/main", "i": 4, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance", "rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS", "environment": "staging"}, "tagErr": false, "bad": false}, {"msg": "6 Rollout/probe: kubectl --context lab-k8s-admin -n lab-app-staging rollout status deployment/payment-srv; get deployment … image", "i": 5, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance", "rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS", "environment": "staging", "rollout_status": "successfully rolled out"}, "tagErr": false, "bad": false}, {"msg": "7 prod promotion: git commit -s -m \"promote payment-srv v0.4.2 digest to prod\" (config/prod/values.yaml: ugyanaz az image.digest)", "i": 6, "ev": {"service": "payment-srv", "git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id", "image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance", "rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS", "environment": "prod", "rollout_status": "successfully rolled out"}, "tagErr": false, "bad": false}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const ST = [["1 Native build/test", "git_revision, build_id,\ntar.zst SHA-256", {"git_revision": "<release-sha>", "binary_artifact.name": "payment-srv-linux-amd64.tar.zst", "binary_artifact.sha256": "sha256:lab-binary-digest", "binary_artifact.build_id": "lab-build-id"}, "cmake --build build --target payment-srv; sha256sum build/payment-srv-linux-amd64.tar.zst", ""], ["2 Image build+push", "ghcr.io/lab-org/payment-srv\n@sha256:1111…", {"image.repository": "ghcr.io/lab-org/payment-srv", "image.digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111", "sbom.digest": "sha256:lab-sbom-digest", "attestation.type": "slsaprovenance"}, "docker buildx imagetools inspect ghcr.io/lab-org/payment-srv:v0.4.2 → digest; cosign sign / cosign attest", "cosign verify"], ["3 Render+policy", "rendered_manifest_digest", {"rendered_manifest_digest": "sha256:lab-rendered-digest", "policy_validation.kubeconform": "valid", "policy_validation.conftest": "PASS"}, "helm template payment-srv ./charts/payment-srv --namespace lab-app-staging … > build/payment-srv-staging-rendered.yaml; kubeconform -strict -summary …; conftest test --policy ./policy/rendered …", "kubeconform, conftest"], ["4 Git promotion commit", "config/staging/values.yaml:\nimage.digest", {"environment": "staging"}, "git commit -s -m \"promote payment-srv v0.4.2 digest to staging\"; git push -u origin promote/payment-srv/staging-v0.4.2; gh pr merge --squash", ""], ["5 Argo CD sync", "Argo revision = main HEAD", {}, "argocd app sync lab-app-staging --revision \"$main_sha\"   # main_sha = git rev-parse origin/main", ""], ["6 Rollout/probe", "rollout_status", {"rollout_status": "successfully rolled out"}, "kubectl --context lab-k8s-admin -n lab-app-staging rollout status deployment/payment-srv; get deployment … image", "imageID == digest"]], PROD = ["7 prod promotion", "git commit -s -m \"promote payment-srv v0.4.2 digest to prod\" (config/prod/values.yaml: ugyanaz az image.digest)"], DIG = "sha256:1111111111111111111111111111111111111111111111111111111111111111", IMG = "ghcr.io/lab-org/payment-srv";
function build(tagErr){
  const ev = {service: "payment-srv"}, out = [];
  ST.forEach((s, i) => { Object.assign(ev, s[2]); let m = s[0] + ": " + s[3];
    let bad = false;
    if (tagErr && i === 3) m = s[0] + " – HIBÁS: a values-ba tag kerül (image: " + IMG + ":v0.4.2) a digest helyett";
    if (tagErr && i === 5) { bad = true; m = s[0] + ": a futó pod imageID-je ≠ release digest (a tagot időközben újratolták) – a release NEM kész"; ev.rollout_status = "successfully rolled out (de imageID ≠ digest!)"; }
    out.push({msg: m, i: i, ev: JSON.parse(JSON.stringify(ev)), tagErr: tagErr, bad: bad}); });
  out.push({msg: PROD[0] + ": " + PROD[1], i: 6, ev: Object.assign(JSON.parse(JSON.stringify(ev)), {environment: "prod"}), tagErr: tagErr, bad: tagErr});
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 380"); svg.innerHTML = ""; defs0();
  const bx = i => 6 + i * 116;
  ST.forEach((st, i) => { const on = i === s.i || (s.i === 6 && i >= 3);
    R(bx(i), 10, 106, 44, {fill: i <= s.i ? css("--cellhl") : css("--cell"), "stroke-width": on ? 3 : 1.2, stroke: on ? css("--hl") : css("--line")});
    T(bx(i) + 53, 28, st[0].split(" ")[0] + " " + st[0].split(" ")[1], {"font-size": 11, "text-anchor": "middle", "font-weight": "bold"});
    T(bx(i) + 53, 44, st[0].split(" ").slice(2).join(" "), {"font-size": 10, "text-anchor": "middle"});
    if (i < 5) A(bx(i) + 106, 32, bx(i + 1) - 2, 32); });
  const lane = (y, env, active) => { R(bx(3) - 4, y, 344, 40, {rx: 0, fill: active ? css("--cell") : "url(#dots)", opacity: active ? 1 : 0.6});
    T(bx(3) + 2, y + 16, env, {"font-size": 11, "font-weight": "bold"});
    const tagBad = s.tagErr && s.i >= 3;
    T(bx(3) + 2, y + 33, "image: " + (tagBad ? IMG + ":v0.4.2" : IMG + "@sha256:1111…"), {"font-size": 10, "font-family": "ui-monospace,monospace", fill: tagBad ? css("--hl2") : css("--fg")});
    R(bx(3) + 250, y + 6, 86, 28, {rx: 0, fill: "none", "stroke-dasharray": "5 3"}); T(bx(3) + 293, y + 24, "replicaCount…", {"font-size": 9, "text-anchor": "middle"}); };
  if (s.i >= 3) lane(66, "staging: config/staging/values.yaml", true);
  if (s.i >= 6) lane(112, "prod: config/prod/values.yaml", true);
  if (s.i >= 1) { L(bx(1) + 53, 56, bx(1) + 53, s.i >= 6 ? 132 : (s.i >= 3 ? 86 : 64), {"stroke-width": 3});
    if (s.i >= 3) A(bx(1) + 53, 86, bx(3) - 6, 86, {"stroke-width": 3}); if (s.i >= 6) A(bx(1) + 53, 132, bx(3) - 6, 132, {"stroke-width": 3}); }
  if (s.bad) { R(bx(5) - 2, 6, 110, 52, {fill: "none", stroke: css("--hl2"), "stroke-width": 4}); T(bx(5) + 53, 70 + 0, "imageID ≠ release digest", {"font-size": 11, "text-anchor": "middle", "font-weight": "bold", fill: css("--hl2")}); }
  T(6, 176, "release evidence (az eddig kitöltött mezők):", {"font-size": 11, "font-weight": "bold"});
  const keys = Object.keys(s.ev); keys.forEach((kk, j) => { const col = j < 9 ? 0 : 1, row = j % 9;
    T(6 + col * 350, 194 + row * 18, '"' + kk + '": "' + String(s.ev[kk]).replace(DIG, "sha256:1111…") + '"', {"font-size": 10, "font-family": "ui-monospace,monospace"}); });
}
document.getElementById("tag").addEventListener("input", e => { const kk = k; setSteps(build(e.target.checked)); show(kk); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
