<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling update</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>replicas <input type="range" id="rep" min="1" max="10" value="3" oninput="d196upd()"> <span id="repv">3</span></label><label>maxSurge <input id="ms" value="25%" size="4" onchange="d196upd()"></label><label>maxUnavailable <input id="mu" value="25%" size="4" onchange="d196upd()"></label><label><input type="checkbox" id="bad" onchange="d196upd()"> v2 image hibás</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két ReplicaSet Podjai lépésenként: Ready, nem Ready és terminating Podok; kubectl get rs várt sorai."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell, nem mérés. A százalékos maxSurge felfelé, a maxUnavailable lefelé kerekít: 3 × 25% = 0,75 → 1 és 0. ● Ready, ○ nem Ready, áthúzott = terminating. A v2 RS hash-e illusztratív.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"v1": 3, "v2r": 0, "v2n": 0, "term": 0, "act": "S0: kiinduló állapot", "stuck": false, "R": 3, "msg": "S0: S0: kiinduló állapot"}, {"v1": 3, "v2r": 0, "v2n": 1, "term": 0, "act": "felskálázás: RS-v2 +1 (összesen 4)", "stuck": false, "R": 3, "msg": "S1: felskálázás: RS-v2 +1 (összesen 4)"}, {"v1": 2, "v2r": 1, "v2n": 0, "term": 1, "act": "1 új Pod Ready; RS-v1 −1", "stuck": false, "R": 3, "msg": "S2: 1 új Pod Ready; RS-v1 −1"}, {"v1": 2, "v2r": 1, "v2n": 1, "term": 0, "act": "felskálázás: RS-v2 +1 (összesen 4)", "stuck": false, "R": 3, "msg": "S3: felskálázás: RS-v2 +1 (összesen 4)"}, {"v1": 1, "v2r": 2, "v2n": 0, "term": 1, "act": "1 új Pod Ready; RS-v1 −1", "stuck": false, "R": 3, "msg": "S4: 1 új Pod Ready; RS-v1 −1"}, {"v1": 1, "v2r": 2, "v2n": 1, "term": 0, "act": "felskálázás: RS-v2 +1 (összesen 4)", "stuck": false, "R": 3, "msg": "S5: felskálázás: RS-v2 +1 (összesen 4)"}, {"v1": 0, "v2r": 3, "v2n": 0, "term": 1, "act": "1 új Pod Ready; RS-v1 −1", "stuck": false, "R": 3, "msg": "S6: 1 új Pod Ready; RS-v1 −1"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function resolveV(v, R, up){ v = String(v).trim(); if (v.endsWith("%")) { const x = R * parseFloat(v) / 100; return up ? Math.ceil(x - 1e-9) : Math.floor(x + 1e-9); } return parseInt(v, 10); }
function roll(R, surge, unavail, bad){
  const s = resolveV(surge, R, true), u = resolveV(unavail, R, false);
  if (!(s >= 0) || !(u >= 0)) return {s: s, u: u, steps: [], err: "érvénytelen érték"};
  if (s === 0 && u === 0) return {s: s, u: u, steps: [], err: "maxSurge és maxUnavailable nem lehet egyszerre 0"};
  let v1r = R, v2r = 0, v2n = 0;
  const steps = [{v1: v1r, v2r: 0, v2n: 0, term: 0, act: "S0: kiinduló állapot", stuck: false}];
  for (let it = 0; it < 4 * R + 10; it++) {
    const total = v1r + v2r + v2n, add = Math.min(R - (v2r + v2n), R + s - total);
    if (add > 0) { v2n += add; steps.push({v1: v1r, v2r: v2r, v2n: v2n, term: 0, act: `felskálázás: RS-v2 +${add} (összesen ${v1r + v2r + v2n})`, stuck: false}); continue; }
    const became = bad ? 0 : v2n; v2r += became; v2n -= became;
    let rm = Math.min(v1r, (v1r + v2r) - (R - u)); rm = Math.max(rm, 0); v1r -= rm;
    if (became === 0 && rm === 0) break;
    steps.push({v1: v1r, v2r: v2r, v2n: v2n, term: rm, act: (became ? `${became} új Pod Ready; ` : "") + (rm ? `RS-v1 −${rm}` : "nincs leskálázás"), stuck: false});
  }
  if (!(v1r === 0 && v2r === R)) steps[steps.length - 1].stuck = true;
  return {s: s, u: u, steps: steps, err: ""};
}

function rsrow(n, d, c, r){ return n.padEnd(34) + String(d).padEnd(9) + String(c).padEnd(9) + r; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  const R = s.R;
  [["RS-v1 (lab-cpp-service-6f9c8d7b4f)", s.v1, 0, s.term, 60], ["RS-v2 (új template)", s.v2r, s.v2n, 0, 330]].forEach(([t, rd, nr, tm, x]) => {
    el("text", {x: x, y: 24, "font-size": 13, "font-weight": "bold"}, t);
    let i = 0; const put = (kind) => { const cx = x + 20 + (i % 10) * 26, cy = 60 + Math.floor(i / 10) * 30; i++;
      el("circle", {cx: cx, cy: cy, r: 10, fill: kind === "r" ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": kind === "t" ? "3 2" : ""});
      if (kind === "t") el("line", {x1: cx - 13, y1: cy + 13, x2: cx + 13, y2: cy - 13, stroke: css("--fg"), "stroke-width": 1.5}); };
    for (let k = 0; k < rd; k++) put("r"); for (let k = 0; k < nr; k++) put("n"); for (let k = 0; k < tm; k++) put("t"); });
  const ready = s.v1 + s.v2r;
  el("text", {x: 60, y: 170, "font-size": 13}, `Ready összesen: ${ready} (min. ${R - CUR.u}), Podok összesen: ${s.v1 + s.v2r + s.v2n} (max. ${R + CUR.s})`);
  el("text", {x: 60, y: 192, "font-size": 12, fill: css("--muted")}, `maxSurge = ${CUR.s}, maxUnavailable = ${CUR.u}` + (s.stuck ? " – a rollout itt megáll" : ""));
  const lines = ["NAME                              DESIRED  CURRENT  READY",
    rsrow("lab-cpp-service-6f9c8d7b4f", s.v1, s.v1, s.v1), rsrow("lab-cpp-service-<v2-hash>", s.v2r + s.v2n, s.v2r + s.v2n, s.v2r)];
  lines.forEach((l, i) => el("text", {x: 60, y: 226 + i * 18, "font-size": 12, style: "font-family:ui-monospace,monospace;white-space:pre"}, l.replace(/ /g, " ")));
}
let CUR = {s: 1, u: 0};
function d196upd(){
  const R = +document.getElementById("rep").value, bad = document.getElementById("bad").checked;
  document.getElementById("repv").textContent = R;
  const res = roll(R, document.getElementById("ms").value, document.getElementById("mu").value, bad);
  if (res.err) { status.textContent = "Hiba: " + res.err; return; }
  CUR = res;
  const st = res.steps.map((x, i) => Object.assign({}, x, {R: R, msg: `S${i}: ${x.act}` + (x.stuck ? (bad ? " – a v2 Pod ImagePullBackOff, a rollout áll; kubectl rollout undo → a v2 RS 0-ra skálázódik." : " – a rollout nem halad tovább.") : "")}));
  if (bad) st.push(Object.assign({}, st[0], {R: R, msg: "kubectl rollout undo deployment/lab-cpp-service: a v2 RS 0-ra skálázódik, a v1 marad."}));
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
