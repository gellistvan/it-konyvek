<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USE-mátrix: baseline és incidens</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="hyp">Hipotézis</button><span class="small">Cellára kattintva: mérőparancs és baseline → incidens.</span><script>document.getElementById("hyp").addEventListener("click", () => { stop(); show(STEPS.length - 1); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Erőforrás × U/S/E rács; a blokk-I/O saturation cellái kiugranak, a CPU változatlan."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illusztratív adatok a 22.1.7 táblázatából, nem mérés. A mai sysstat oszlopnevei: aqu-sz, r_await/w_await.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "j": 0, "line": -1, "msg": "CPU × Utilization: %idle 80 → 78%; (util 20 → 22%) – mérés: mpstat -P ALL 5 60"}, {"i": 0, "j": 1, "line": -1, "msg": "CPU × Saturation: r 0–1 → 0–1; PSI cpu some 2 → 3% – mérés: vmstat -w 5 60; cat /proc/pressure/cpu"}, {"i": 0, "j": 2, "line": -1, "msg": "CPU × Errors: nincs adat a példában – mérés: (pl. dmesg: MCE-hibák)"}, {"i": 1, "j": 0, "line": -1, "msg": "memória × Utilization: nincs adat a példában – mérés: free -m; vmstat (free, buff/cache)"}, {"i": 1, "j": 1, "line": -1, "msg": "memória × Saturation: nincs adat a példában – mérés: vmstat si/so; cat /proc/pressure/memory"}, {"i": 1, "j": 2, "line": -1, "msg": "memória × Errors: nincs adat a példában – mérés: dmesg | grep -i 'out of memory'"}, {"i": 2, "j": 0, "line": -1, "msg": "blokk-I/O (lab_data) × Utilization: %util: nincs adat; (NVMe-n nem elég) – mérés: iostat -y -x -d 5 60 (%util)"}, {"i": 2, "j": 1, "line": -1, "msg": "blokk-I/O (lab_data) × Saturation: aqu-sz 0,2 → 12,0; w_await 5 → 120 ms; PSI io some 5 → 85%; b 0 → 4–5 – mérés: iostat -y -x -d 5 60; cat /proc/pressure/io; vmstat -w 5 60"}, {"i": 2, "j": 2, "line": -1, "msg": "blokk-I/O (lab_data) × Errors: nincs adat a példában – mérés: dmesg | grep -i 'I/O error'; smartctl -a"}, {"i": 3, "j": 0, "line": -1, "msg": "hálózat × Utilization: nincs adat a példában – mérés: sar -n DEV 5 60 (rxkB/s, txkB/s)"}, {"i": 3, "j": 1, "line": -1, "msg": "hálózat × Saturation: Send-Q 0 → 1000 – mérés: ss -ti (Send-Q)"}, {"i": 3, "j": 2, "line": -1, "msg": "hálózat × Errors: nincs adat a példában – mérés: ip -s link; nstat (retransmit)"}, {"i": -1, "j": -1, "line": -1, "msg": "Hipotézis (22.1.7): a lab_web nem CPU-, hanem blokk-I/O-telített; a Send-Q növekedése a lassuló válaszadás következménye. Egyetlen változtatás: a szolgáltatás adatútja gyorsabb labdisk mountra (vagy a rosszul méretezett fsync path javítása), majd ugyanazzal a mérési sorozattal újramérés."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ROWS = ["CPU", "memória", "blokk-I/O (lab_data)", "hálózat"], COLS = ["Utilization", "Saturation", "Errors"], CELLS = {"0,0": {"txt": "%idle 80 → 78%\n(util 20 → 22%)", "st": "same", "cmd": "mpstat -P ALL 5 60"}, "0,1": {"txt": "r 0–1 → 0–1\nPSI cpu some 2 → 3%", "st": "same", "cmd": "vmstat -w 5 60; cat /proc/pressure/cpu"}, "0,2": {"txt": "nincs adat a példában", "st": "na", "cmd": "(pl. dmesg: MCE-hibák)"}, "1,0": {"txt": "nincs adat a példában", "st": "na", "cmd": "free -m; vmstat (free, buff/cache)"}, "1,1": {"txt": "nincs adat a példában", "st": "na", "cmd": "vmstat si/so; cat /proc/pressure/memory"}, "1,2": {"txt": "nincs adat a példában", "st": "na", "cmd": "dmesg | grep -i 'out of memory'"}, "2,0": {"txt": "%util: nincs adat\n(NVMe-n nem elég)", "st": "na", "cmd": "iostat -y -x -d 5 60 (%util)"}, "2,1": {"txt": "aqu-sz 0,2 → 12,0\nw_await 5 → 120 ms\nPSI io some 5 → 85%\nb 0 → 4–5", "st": "out", "cmd": "iostat -y -x -d 5 60; cat /proc/pressure/io; vmstat -w 5 60"}, "2,2": {"txt": "nincs adat a példában", "st": "na", "cmd": "dmesg | grep -i 'I/O error'; smartctl -a"}, "3,0": {"txt": "nincs adat a példában", "st": "na", "cmd": "sar -n DEV 5 60 (rxkB/s, txkB/s)"}, "3,1": {"txt": "Send-Q 0 → 1000", "st": "out", "cmd": "ss -ti (Send-Q)"}, "3,2": {"txt": "nincs adat a példában", "st": "na", "cmd": "ip -s link; nstat (retransmit)"}};
function render(s){
  svg.setAttribute("viewBox", "0 0 640 400");
  svg.innerHTML = "";
  const x0 = 150, y0 = 40, cw = 160, ch = 78;
  COLS.forEach((c, j) => el("text", {x:x0+j*cw+cw/2, y:28, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, c));
  ROWS.forEach((r, i) => {
    el("text", {x:x0-8, y:y0+i*ch+ch/2+4, "text-anchor":"end", "font-size":12, "font-weight":"bold"}, r);
    COLS.forEach((c, j) => {
      const cell = CELLS[i + "," + j], on = s.i === i && s.j === j;
      const out = cell.st === "out", hyp = s.i < 0 && out;
      const r_ = el("rect", {x:x0+j*cw, y:y0+i*ch, width:cw, height:ch, fill: out ? "url(#hh)" : (cell.st === "na" ? "url(#dd)" : css("--cell")), stroke: (on || hyp) ? css("--hl") : css("--line"), "stroke-width": (on || hyp) ? 4 : (out ? 3 : 1), style:"cursor:pointer", tabindex:0, role:"button", "aria-label": c + " – " + r});
      r_.addEventListener("click", () => { stop(); show(STEPS.findIndex(t => t.i === i && t.j === j)); });
      r_.addEventListener("keydown", e => { if (e.key === "Enter") { stop(); show(STEPS.findIndex(t => t.i === i && t.j === j)); } });
      const lines = cell.st === "na" && !(i === 2 && j === 0) ? ["nincs adat"] : cell.txt.split("\n");
      lines.forEach((t, q) => { const tt = el("text", {x:x0+j*cw+cw/2, y:y0+i*ch+ch/2+5+(q-(lines.length-1)/2)*15, "text-anchor":"middle", "font-size":11.5, "pointer-events":"none"}, t); });
    });
  });
  const d = el("defs", {});
  d.innerHTML = '<pattern id="hh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="' + css("--cellhl") + '"/><line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="2"/></pattern>' +
    '<pattern id="dd" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="' + css("--bg") + '"/><circle cx="2" cy="2" r="1" fill="' + css("--muted") + '"/></pattern>';
  if (s.i >= 0) {
    const c = CELLS[s.i + "," + s.j];
    el("text", {x:10, y:370, "font-size":12, "font-family":"ui-monospace,monospace"}, "$ " + c.cmd);
  } else {
    el("text", {x:10, y:370, "font-size":12, "font-weight":"bold", fill: css("--hl")}, "Hipotézis: blokk-I/O-telítettség (a kiugró cellák kiemelve). Egy változtatás → újramérés.");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
