<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAL-idővonal és PITR-tartomány</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>recovery_target_time: <input type="range" id="tgt" min="0" max="60" value="30" style="width:220px"> <b id="vt">14:30</b> UTC</label> <label><input type="checkbox" id="arch" checked> archive a promotált node-on</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal 14:00–15:00 között; a base backup 14:08-kor konzisztens, a WAL 14:45-ig archivált, a 14:30-as célidő ezen belül van; a promóció után új timeline indul."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illusztratív időpontok, nem mérés. A PITR elérhető tartománya [base backup konzisztens pontja, utolsó archivált WAL]; a timeline 2-re csak akkor lehet visszaállni, ha a promotált node is archivál (archive_mode = on).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Base backup: pg_basebackup 14:05-kor indul, 14:08-kor konzisztens (backup_label) – ettől lehet visszaállni. | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 0, "tgt": 30, "arch2": true, "ok": true}, {"msg": "2. Archiválás: az archive_command minden lezárt WAL-szegmenst a /var/lib/postgresql/wal_archive-ba másol (TL1: …03 – …0A). | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 1, "tgt": 30, "arch2": true, "ok": true}, {"msg": "3. Recovery target: recovery_target_time + recovery_target_action = 'pause' – a visszajátszás a célidőnél megáll. | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 2, "tgt": 30, "arch2": true, "ok": true}, {"msg": "4. 14:42 hibás DELETE: a 14:30-as célidő ELŐTTE van, ezért a PITR-rel visszanyerhető az adat. | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 3, "tgt": 30, "arch2": true, "ok": true}, {"msg": "5. 14:45 primary kiesés, promóció: a replica új timeline-t nyit (timeline 2, 00000002.history). | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 4, "tgt": 30, "arch2": true, "ok": true}, {"msg": "6. 14:50 új base backup a promotált primaryről: a régi backup + TL1-archívum a TL2-re csak akkor jó, ha a promotált node is archivál. | OK: a 14:30 célidő a PITR-tartományon belül van [14:08, 15:00]", "step": 5, "tgt": 30, "arch2": true, "ok": true}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const BB0 = 5, BB1 = 8, DEL = 42, FAIL = 45, NEWBB = 50, SEG = 45 / 8, TXT = ["1. Base backup: pg_basebackup 14:05-kor indul, 14:08-kor konzisztens (backup_label) – ettől lehet visszaállni.", "2. Archiválás: az archive_command minden lezárt WAL-szegmenst a /var/lib/postgresql/wal_archive-ba másol (TL1: …03 – …0A).", "3. Recovery target: recovery_target_time + recovery_target_action = 'pause' – a visszajátszás a célidőnél megáll.", "4. 14:42 hibás DELETE: a 14:30-as célidő ELŐTTE van, ezért a PITR-rel visszanyerhető az adat.", "5. 14:45 primary kiesés, promóció: a replica új timeline-t nyit (timeline 2, 00000002.history).", "6. 14:50 új base backup a promotált primaryről: a régi backup + TL1-archívum a TL2-re csak akkor jó, ha a promotált node is archivál."];
function hm(m){ return m < 60 ? "14:" + String(Math.floor(m)).padStart(2, "0") : "15:00"; }
function check(tgt, arch2){
  const last = arch2 ? 60 : FAIL;
  if (tgt < BB1) return [false, "HIBA: target before consistent point – a célidő a base backup konzisztens pontja (14:08) előtt van"];
  if (tgt > last) return [false, "HIBA: recovery ended before configured recovery target was reached – az utolsó archivált WAL " + hm(last) + "-kor ér véget"];
  const extra = tgt >= DEL ? " (figyelem: a 14:42-es hibás DELETE már benne van)" : "";
  const tl = tgt > FAIL ? " – timeline 2-n (00000002.history kell)" : "";
  return [true, "OK: a " + hm(tgt) + " célidő a PITR-tartományon belül van [14:08, " + hm(last) + "]" + tl + extra];
}
function build(tgt, arch2){ const c = check(tgt, arch2);
  return TXT.map((t, i) => ({msg: t + " | " + c[1], step: i, tgt: tgt, arch2: arch2, ok: c[0]})); }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 300"); svg.innerHTML = ""; defs0();
  const X = m => 80 + m * 10, on = i => s.step >= i;
  L(X(0), 230, X(60), 230);
  for (let m = 0; m <= 60; m += 5) { L(X(m), 226, X(m), 234); T(X(m), 248, hm(m), {"font-size": 10, "text-anchor": "middle"}); }
  R(X(BB0), 40, X(BB1) - X(BB0), 18, {rx: 0, fill: css("--muted"), "stroke-width": s.step === 0 ? 3 : 1.2});
  T(X(BB0) - 4, 53, "base backup", {"font-size": 11, "text-anchor": "end"});
  L(X(BB1), 58, X(BB1), 230, {"stroke-width": 1}); T(X(BB1) + 3, 72, "konzisztens pont", {"font-size": 10});
  T(70, 160, "TL1", {"font-size": 11, "text-anchor": "end"}); T(70, 200, "TL2", {"font-size": 11, "text-anchor": "end"});
  for (let i = 0; i < 8; i++) { const a = i * SEG, done = on(1) && (s.step > 1 || i < 8);
    R(X(a), 146, SEG * 10 - 1, 22, {rx: 0, fill: on(1) ? css("--fg") : css("--cell"), "stroke-width": 1}); }
  T(X(SEG / 2), 140, "…03", {"font-size": 10, "text-anchor": "middle"}); T(X(45 - SEG / 2), 140, "…0A", {"font-size": 10, "text-anchor": "middle"});
  if (on(4)) { L(X(FAIL), 168, X(FAIL), 186, {"stroke-dasharray": "2 3"});
    for (let i = 0; i < 3; i++) R(X(FAIL + i * 5), 186, 49, 22, {rx: 0, fill: s.arch2 ? "url(#dots)" : css("--cell"), "stroke-dasharray": "3 2"});
    T(X(FAIL) + 2, 222, s.arch2 ? "timeline 2, archivált" : "timeline 2, NEM archivált", {"font-size": 10}); }
  const last = s.arch2 && on(4) ? 60 : FAIL;
  if (on(2)) { A(X(BB1), 100, X(last), 100, {"marker-start": "url(#ar)"}); T((X(BB1) + X(last)) / 2, 94, "PITR-tartomány [14:08, " + hm(last) + "]", {"font-size": 11, "text-anchor": "middle"}); }
  if (on(2)) { const col = s.ok ? css("--hl") : css("--hl2");
    L(X(s.tgt), 30, X(s.tgt), 236, {stroke: col, "stroke-width": 2.5, "stroke-dasharray": "6 4"});
    T(X(s.tgt), 24, "target " + hm(s.tgt) + (s.ok ? " (pause)" : " – HIBA"), {"font-size": 11, "text-anchor": "middle", fill: col, "font-weight": "bold"}); }
  if (on(3)) { XM(X(DEL), 157, 8); T(X(DEL), 124, "DELETE 14:42", {"font-size": 10, "text-anchor": "middle"}); }
  if (on(4)) T(X(FAIL) + 4, 270, "14:45 kiesés → promóció", {"font-size": 10});
  if (on(5)) { R(X(NEWBB), 274, 20, 12, {rx: 0, fill: css("--muted")}); T(X(NEWBB) + 24, 284, "új base backup 14:50", {"font-size": 10}); }
}
function upd(){ const kk = k; document.getElementById("vt").textContent = hm(+document.getElementById("tgt").value);
  setSteps(build(+document.getElementById("tgt").value, document.getElementById("arch").checked)); show(kk); }
["tgt", "arch"].forEach(id => document.getElementById(id).addEventListener("input", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
