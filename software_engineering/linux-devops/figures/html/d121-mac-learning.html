<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAC-tanulás és flooding a háromportos laborban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button type="button" onclick="d7load('base')">FDB ürítése (vissza a 0. lépésre)</button><button type="button" onclick="d7load('withc');show(5)">C küld A-nak</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy lépés: A kérése elárad B-re és C-re, a bridge megtanulja A-t, majd B válasza után B-t; a második kérés már csak B-hez megy."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell a könyv várt eredménye alapján, nem mérés. A tcpdump-sor rövidített (az ICMP id mező nélkül). Folytonos nyíl: unicast, szaggatott: elárasztás; vastag keret: új FDB-sor.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": 0, "src": null, "dst": null, "out": [], "flood": false, "fdb": [], "new": null, "cap": [], "line": 0, "msg": "0. Kiinduló állapot: a dinamikus FDB üres, csak a portok helyi self/permanent bejegyzései látszanak (szürke). C portján fut a tcpdump."}, {"phase": 1, "src": "A", "dst": "B", "out": [], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": "02:00:00:00:21:0a", "cap": [], "line": 1, "msg": "1. A echo requestje (dst …:0b) a lab-pa-n érkezik; a bridge a FORRÁS-MAC-ből megtanulja: …:0a → lab-pa."}, {"phase": 2, "src": "A", "dst": "B", "out": ["lab-pb", "lab-pc"], "flood": true, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 4, "msg": "2. A cél (…:0b) ismeretlen, ezért elárasztás: másolat a lab-pb-re és a lab-pc-re (nem broadcast, egyedi cél!). A kérés megjelenik C portján is: a tcpdump egy sort ír."}, {"phase": 3, "src": "B", "dst": "A", "out": ["lab-pa"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": "02:00:00:00:21:0b", "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "3. B válaszából (dst …:0a) a bridge megtanulja B-t a lab-pb mögött; A már ismert, a válasz csak a lab-pa felé megy."}, {"phase": 4, "src": "A", "dst": "B", "out": ["lab-pb"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "4. A második kérés (dst …:0b) már ismert célhoz megy: csak a lab-pb-re. C tcpdump-sávja nem bővül."}];
const CODE = ["keret érkezik a bemeneti porton (in)", "tanulás: FDB[forrás-MAC] := in", "p := FDB[cél-MAC] keresése", "ha p ismert és p ≠ in: továbbítás csak p-re (unicast)", "különben (ismeretlen cél): elárasztás minden portra, in kivételével"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function d7defs(){
  const c = css("--line"), h = css("--hl"), h2 = css("--hl2");
  svg.innerHTML = '<defs>' +
   '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+c+'"/></marker>' +
   '<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+h+'"/></marker>' +
   '<marker id="ahh2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+h2+'"/></marker>' +
   '<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="'+c+'" stroke-width="1.2"/></pattern>' +
   '<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="'+c+'"/></pattern>' +
   '</defs>';
}
function T(x, y, t, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 12, "text-anchor": o.a || "middle"};
  if (o.fill) a.fill = o.fill; if (o.b) a["font-weight"] = "bold"; if (o.mono){ a.style = "white-space:pre;font-family:ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace"; }
  if (o.it) a["font-style"] = "italic"; return el("text", a, t); }
function R(x, y, w, h, o){ o = o || {}; return el("rect", {x: x, y: y, width: w, height: h, rx: o.rx === undefined ? 5 : o.rx,
  fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.w || 1.3, "stroke-dasharray": o.d || ""}); }
function L(x1, y1, x2, y2, o){ o = o || {}; const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.c || css("--line"),
  "stroke-width": o.w || 1.6}; if (o.d) a["stroke-dasharray"] = o.d; if (o.m) a["marker-end"] = "url(#" + o.m + ")"; return el("line", a); }
function X(x, y, s, c){ s = s || 7; c = c || css("--hl2"); L(x - s, y - s, x + s, y + s, {c: c, w: 3}); L(x - s, y + s, x + s, y - s, {c: c, w: 3}); }
function d7fmt(v, d){ return v.toFixed(d === undefined ? 1 : d).replace(".", ",").replace("-", "−"); }

const D7 = {base: [{"phase": 0, "src": null, "dst": null, "out": [], "flood": false, "fdb": [], "new": null, "cap": [], "line": 0, "msg": "0. Kiinduló állapot: a dinamikus FDB üres, csak a portok helyi self/permanent bejegyzései látszanak (szürke). C portján fut a tcpdump."}, {"phase": 1, "src": "A", "dst": "B", "out": [], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": "02:00:00:00:21:0a", "cap": [], "line": 1, "msg": "1. A echo requestje (dst …:0b) a lab-pa-n érkezik; a bridge a FORRÁS-MAC-ből megtanulja: …:0a → lab-pa."}, {"phase": 2, "src": "A", "dst": "B", "out": ["lab-pb", "lab-pc"], "flood": true, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 4, "msg": "2. A cél (…:0b) ismeretlen, ezért elárasztás: másolat a lab-pb-re és a lab-pc-re (nem broadcast, egyedi cél!). A kérés megjelenik C portján is: a tcpdump egy sort ír."}, {"phase": 3, "src": "B", "dst": "A", "out": ["lab-pa"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": "02:00:00:00:21:0b", "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "3. B válaszából (dst …:0a) a bridge megtanulja B-t a lab-pb mögött; A már ismert, a válasz csak a lab-pa felé megy."}, {"phase": 4, "src": "A", "dst": "B", "out": ["lab-pb"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "4. A második kérés (dst …:0b) már ismert célhoz megy: csak a lab-pb-re. C tcpdump-sávja nem bővül."}], withc: [{"phase": 0, "src": null, "dst": null, "out": [], "flood": false, "fdb": [], "new": null, "cap": [], "line": 0, "msg": "0. Kiinduló állapot: a dinamikus FDB üres, csak a portok helyi self/permanent bejegyzései látszanak (szürke). C portján fut a tcpdump."}, {"phase": 1, "src": "A", "dst": "B", "out": [], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": "02:00:00:00:21:0a", "cap": [], "line": 1, "msg": "1. A echo requestje (dst …:0b) a lab-pa-n érkezik; a bridge a FORRÁS-MAC-ből megtanulja: …:0a → lab-pa."}, {"phase": 2, "src": "A", "dst": "B", "out": ["lab-pb", "lab-pc"], "flood": true, "fdb": [["02:00:00:00:21:0a", "lab-pa"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 4, "msg": "2. A cél (…:0b) ismeretlen, ezért elárasztás: másolat a lab-pb-re és a lab-pc-re (nem broadcast, egyedi cél!). A kérés megjelenik C portján is: a tcpdump egy sort ír."}, {"phase": 3, "src": "B", "dst": "A", "out": ["lab-pa"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": "02:00:00:00:21:0b", "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "3. B válaszából (dst …:0a) a bridge megtanulja B-t a lab-pb mögött; A már ismert, a válasz csak a lab-pa felé megy."}, {"phase": 4, "src": "A", "dst": "B", "out": ["lab-pb"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"]], "new": null, "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "4. A második kérés (dst …:0b) már ismert célhoz megy: csak a lab-pb-re. C tcpdump-sávja nem bővül."}, {"phase": 5, "src": "C", "dst": "A", "out": ["lab-pa"], "flood": false, "fdb": [["02:00:00:00:21:0a", "lab-pa"], ["02:00:00:00:21:0b", "lab-pb"], ["02:00:00:00:21:0c", "lab-pc"]], "new": "02:00:00:00:21:0c", "cap": ["02:00:00:00:21:0a > 02:00:00:00:21:0b, ethertype IPv4 (0x0800), length 98: 10.121.0.1 > 10.121.0.2: ICMP echo request, seq 1, length 64"], "line": 3, "msg": "5. C → A keret a lab-pc-n: a bridge megtanulja C-t a lab-pc mögött (…:0c → lab-pc), és A ismert, ezért csak a lab-pa felé továbbít (a fejezet harmadik példasora)."}]};
const NODES = {A: [10, 120], B: [420, 52], C: [420, 196]};
const PIX = {"lab-pa": [230, 150], "lab-pb": [330, 82], "lab-pc": [330, 226]};
const PORTOF = {A: "lab-pa", B: "lab-pb", C: "lab-pc"};
const MACS = {A: "02:00:00:00:21:0a", B: "02:00:00:00:21:0b", C: "02:00:00:00:21:0c"};
const IPS = {A: "10.121.0.1", B: "10.121.0.2", C: "10.121.0.3"};
function nodeAnchor(n){ const p = NODES[n]; return n === "A" ? [p[0] + 120, p[1] + 30] : [p[0], p[1] + 30]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400");
  d7defs();
  R(230, 40, 100, 220, {fill: css("--cellhl")});
  T(280, 195, "lab-br0", {b: 1}); T(280, 212, "(lab-l2-sw)", {fs: 11});
  for (const p in PIX){ const q = PIX[p]; R(q[0] - 7, q[1] - 7, 14, 14, {rx: 1});
    T(q[0] + (p === "lab-pa" ? -10 : 10), q[1] - 11, p, {fs: 11, a: p === "lab-pa" ? "end" : "start"}); }
  for (const n in NODES){ const q = NODES[n]; R(q[0], q[1], 120, 60);
    T(q[0] + 60, q[1] + 24, n + "  …:" + MACS[n].slice(-2), {b: 1}); T(q[0] + 60, q[1] + 44, IPS[n], {fs: 11});
    const a = nodeAnchor(n), pp = PIX[PORTOF[n]]; L(a[0], a[1], pp[0], pp[1], {c: css("--muted"), w: 1}); }
  // FDB
  T(565, 40, "FDB (bridge fdb show br lab-br0)", {a: "start", b: 1, fs: 12});
  const rows = [["lab-pa/pb/pc saját MAC", "self/master", "permanent", "perm"]].concat(
     s.fdb.map(r => [r[0], r[1], "dinamikus", r[0] === s.new ? "new" : "dyn"]));
  rows.forEach((r, i) => { const y = 50 + i * 30;
    R(565, y, 190, 28, {rx: 0, fill: r[3] === "perm" ? css("--cellhl") : css("--cell"), w: r[3] === "new" ? 3.5 : 1});
    T(571, y + 13, r[0], {a: "start", fs: 10.5, mono: 1}); T(571, y + 25, r[1] + " · " + r[2], {a: "start", fs: 10}); });
  // forgalom
  if (s.src){ const a0 = nodeAnchor(s.src), pin = PIX[PORTOF[s.src]];
    L(a0[0], a0[1] - 8, pin[0] - 8, pin[1] - 8, {c: css("--hl"), w: 2.5, m: "ahh"});
    T((a0[0] + pin[0]) / 2, (a0[1] + pin[1]) / 2 + 22, "src " + MACS[s.src].slice(-2) + " → dst " + MACS[s.dst].slice(-2), {fs: 11});
    s.out.forEach(p => { const n = Object.keys(PORTOF).find(x => PORTOF[x] === p), b = nodeAnchor(n), q = PIX[p];
      L(pin[0] + 7, pin[1], q[0] - 7, q[1], {c: css("--hl2"), w: 2, d: s.flood ? "7 5" : ""});
      L(q[0] + 8, q[1] - 8, b[0] - 2, b[1] - 8, {c: css("--hl2"), w: 2.5, d: s.flood ? "7 5" : "", m: "ahh2"}); });
    if (s.out.length) T(280, 285, s.flood ? "elárasztás (szaggatott)" : "unicast továbbítás (folytonos)", {fs: 12, b: 1});
  }
  // tcpdump
  R(10, 300, 740, 92, {rx: 2, d: "4 3"});
  T(18, 318, "C (lab-c0): tcpdump -nne 'ether dst 02:00:00:00:21:0b and icmp'", {a: "start", fs: 11.5, b: 1});
  if (!s.cap.length) T(18, 340, "(nincs sor)", {a: "start", fs: 11, it: 1});
  s.cap.forEach((c, i) => { T(18, 340 + i * 18, c, {a: "start", fs: 9.6, mono: 1}); });
}
function d7load(v){ setSteps(D7[v]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
