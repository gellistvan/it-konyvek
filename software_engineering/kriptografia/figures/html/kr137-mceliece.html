<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Játék-McEliece a (7,4) Hamming-kóddal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>:root{--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}@media (prefers-color-scheme:dark){:root{--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}label{white-space:nowrap} input[type=number]{width:4.2em}</style><span>Saját m:</span><label><input type="checkbox" id="mb0" checked onchange="applyInput()"> m1</label><label><input type="checkbox" id="mb1"  onchange="applyInput()"> m2</label><label><input type="checkbox" id="mb2" checked onchange="applyInput()"> m3</label><label><input type="checkbox" id="mb3" checked onchange="applyInput()"> m4</label><label>hibapozíció (e): <select id="epos" onchange="applyInput()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6" selected>6</option><option value="7">7</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bob titkos S, G, P mátrixa, a nyilvános G' = SGP, Alice c = mG' + e titkosítása, majd a visszafejtés: c P inverzzel, szindróma-dekódolás, mS, végül m = (1,0,1,1)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Oktatási játékpélda (t = 1), nem éles paraméter; minden érték számított (mod 2), nem mérés. A Hamming-dekódoló a szindrómát H oszlopaival veti össze.</p>
<script>

// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}

function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}

function render(s){

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",

const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};

  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +

const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}

const GPX = 396, GPY = 116;
let combo = "10116";
function vecDraw(it, v, hl){
  const P = [], C = 24, x = it.x, y = it.y;
  if (it.top) P.push(["text", x, y - 30, it.top, {size: 17, weight: "bold"}]);
  if (it.lab) P.push(["text", x - 10, y + C * 0.72, it.lab, {size: 17, weight: "bold", anchor: "end"}]);
  v.b.forEach((b, j) => {
    P.push(["rect", x + j * C, y, C, C, {fill: hl ? "hlf" : "bg", lw: 0.9, hatch: j === v.h ? "//" : ""}]);
    P.push(["text", x + j * C + C / 2, y + C * 0.72, String(b), {size: 17, anchor: "middle", weight: j === v.h ? "bold" : "normal"}]);
  });
  if (hl) P.push(["rect", x - 2, y - 2, C * v.b.length + 4, C + 4, {fill: "none", lw: 3, stroke: "hl"}]);
  if (v.cap) { if (it.k === "e") P.push(["text", x + C * v.b.length + 8, y + C * 0.72, "w = 1", {size: 17, color: "muted"}]);
               else P.push(["text", x, y + C + 26, v.cap, {size: 17, color: "muted"}]); }
  scDraw(P);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 960 672"); svg.innerHTML = ""; scDefs();
  const cb = COMBOS[combo], st = k;
  for (const [ls, pr] of LAYERS) if (ls <= st) scDraw(pr);
  if (st === 2) for (const r of cb.rows) scDraw([["rect", GPX, GPY + r * 24, 168, 24, {fill: "hlf", lw: 0.9}]]);
  if (st >= 1 && st === 2) { /* a kiemelt sorok fölé újra a számok */ for (const [ls, pr] of LAYERS) if (ls === 1) scDraw(pr.filter(p => p[0] === "text")); }
  for (const r of (s.hl || [])) scDraw([["rect", r[0], r[1], r[2], r[3], {fill: "none", lw: 3, stroke: "hl"}]]);
  BASE.forEach((it, i) => { if (it.st <= st) vecDraw(it, cb.v[i], it.st === st); });
}
function applyInput(){
  const m = [0,1,2,3].map(i => document.getElementById("mb" + i).checked ? "1" : "0").join("");
  const p = document.getElementById("epos").value;
  if (m === "0000") { status.textContent = "Az m = 0000 üzenet triviális; válassz legalább egy 1-es bitet."; return; }
  combo = m + p;
  const keep = k;
  setSteps(COMBOS[combo].msg.map((msg, i) => ({msg: msg, line: i, hl: STEPS[i] ? STEPS[i].hl : []})));
  show(keep);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
