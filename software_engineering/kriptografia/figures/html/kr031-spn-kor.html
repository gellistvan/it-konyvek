<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Játék SPN: egy kör bitszinten és a lavina</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>x = 0x<input id="ix" value="1A2B" size="5" aria-label="Bemenet hexában"></label><label>K = 0x<input id="ik" value="3A7C" size="5" aria-label="Főkulcs hexában"></label><label>megfordított bit: <select id="ib" aria-label="Megfordított bemeneti bit"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label><button onclick="load()">Számolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 16 bites állapot lépésenként: kulcs-XOR, négy S-doboz, bit-permutáció vezetékekkel, kulcs-XOR, három körön; alul az x és x xor e0 különbségbitjei."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított értékek a könyv játék SPN-jén (8.4.7 kódja; bitsorrend balról 15 … 0). P: a kimeneti i. bit a bemeneti P[i]. bitet kapja; a vonalstílus a forrás-nibble szerint eltér. Alapértelmezés: x = 0x1A2B, K = 0x3A7C, e₀ megfordítva.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stg": "init", "r": 0, "v": 6699, "prev": 6699, "key": -1, "vd": 6698, "prevd": 6698, "msg": "Bemenet: x = 0x1A2B, K = 0x3A7C; x′ = x ⊕ e_0 = 0x1A2A; különbségbitek: 1", "line": 1}, {"stg": "K0", "r": 0, "v": 8279, "prev": 6699, "key": 14972, "vd": 8278, "prevd": 6698, "msg": "Kezdő kulcs-XOR: y₀ = x ⊕ K₀ = 0x1A2B ⊕ 0x3A7C = 0x2057; különbségbitek: 1", "line": 2}, {"stg": "S", "r": 1, "v": 27661, "prev": 8279, "key": -1, "vd": 27658, "prevd": 8278, "msg": "1. kör, S-doboz után: 0x6C0D; különbségbitek: 3", "line": 8}, {"stg": "P", "r": 1, "v": 23937, "prev": 27661, "key": -1, "vd": 23696, "prevd": 27658, "msg": "1. kör, P után: 0x5D81; különbségbitek: 3", "line": 9}, {"stg": "K", "r": 1, "v": 4614, "prev": 23937, "key": 20359, "vd": 4887, "prevd": 23696, "msg": "1. kör, kulcs-XOR (K1 = 0x4F87) után: y1 = 0x1206; különbségbitek: 3", "line": 10}, {"stg": "S", "r": 2, "v": 22218, "prev": 4614, "key": -1, "vd": 23389, "prevd": 4887, "msg": "2. kör, S-doboz után: 0x56CA; különbségbitek: 8", "line": 8}, {"stg": "P", "r": 2, "v": 15960, "prev": 22218, "key": -1, "vd": 23375, "prevd": 23389, "msg": "2. kör, P után: 0x3E58; különbségbitek: 8", "line": 9}, {"stg": "K", "r": 2, "v": 57227, "prev": 15960, "key": 57811, "vd": 47772, "prevd": 23375, "msg": "2. kör, kulcs-XOR (K2 = 0xE1D3) után: y2 = 0xDF8B; különbségbitek: 8", "line": 10}, {"stg": "S", "r": 3, "v": 29240, "prev": 57227, "key": -1, "vd": 36836, "prevd": 47772, "msg": "3. kör, S-doboz után: 0x7238; különbségbitek: 12", "line": 8}, {"stg": "P", "r": 3, "v": 6378, "prev": 29240, "key": -1, "vd": 59236, "prevd": 36836, "msg": "3. kör, P után: 0x18EA; különbségbitek: 12", "line": 9}, {"stg": "K", "r": 3, "v": 40869, "prev": 6378, "key": 34639, "vd": 24619, "prevd": 59236, "msg": "3. kör, kulcs-XOR (K3 = 0x874F) után: y3 = 0x9FA5; különbségbitek: 12", "line": 10}, {"stg": "end", "r": 3, "v": 40869, "prev": 40869, "key": 34639, "vd": 24619, "prevd": 24619, "msg": "Kimenet: y = 0x9FA5; y′ = 0x602B; végső különbség 12 bit", "line": 5}];
const CODE = ["def spn_encrypt(x, K):", "    Ks = [K, rotl(K, 5), rotl(K, 11), rotl(K, 13)]", "    y = x ^ Ks[0]", "    for r in range(3):", "        y = spn_round(y, Ks[r + 1])", "    return y", "", "def spn_round(x, k):   # = permute_bits(sub_nibbles(x)) ^ k, lépésekre bontva", "    z = sub_nibbles(x)      # S-doboz", "    w = permute_bits(z)     # P", "    return w ^ k            # kulcs-XOR"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SB = [12, 5, 6, 11, 9, 0, 10, 13, 3, 14, 15, 8, 4, 7, 1, 2], PP = [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15];
function hx(v){return "0x" + v.toString(16).toUpperCase().padStart(4, "0");}
function bitAt(v, j){return (v >> (15 - j)) & 1;}
function cxx(j){return 150 + j * 30 + 8 * Math.floor(j / 4) + 15;}
function rowB(y, v, lab, opts){
  opts = opts || {};
  for (let j = 0; j < 16; j++) {
    const d = opts.diff !== undefined && ((opts.diff >> (15 - j)) & 1);
    el("rect", {x: cxx(j) - 15, y: y, width: 30, height: 26, fill: d ? css("--line") : css("--cell"), stroke: css("--line"), "stroke-width": 0.8});
    if (opts.diff === undefined) el("text", {x: cxx(j), y: y + 18, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, String(bitAt(v, j)));
  }
  el("text", {x: 140, y: y + 18, "text-anchor": "end", "font-size": 13}, lab);
  if (!opts.nohex) el("text", {x: 668, y: y + 18, "font-size": 14, "font-family": "monospace"}, hx(v));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400");
  svg.innerHTML = "";
  const names = {init: "bemenet", K0: "kezdő kulcs-XOR (K₀)", S: s.r + ". kör: S-doboz", P: s.r + ". kör: bit-permutáció P", K: s.r + ". kör: kulcs-XOR (K" + s.r + ")", end: "kimenet y"};
  el("text", {x: 10, y: 20, "font-size": 15, "font-weight": "bold"}, names[s.stg]);
  const yA = 40, yB = 190;
  rowB(yA, s.prev, s.stg === "init" || s.stg === "end" ? "állapot" : "előtte");
  if (s.stg === "S") {
    for (let n = 0; n < 4; n++) {
      const inn = (s.prev >> (12 - 4 * n)) & 15;
      el("rect", {x: cxx(4 * n) - 13, y: yA + 50, width: 116, height: 60, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: cxx(4 * n) + 45, y: yA + 86, "text-anchor": "middle", "font-size": 15}, "S: " + inn.toString(16).toUpperCase() + " → " + SB[inn].toString(16).toUpperCase());
    }
  } else if (s.stg === "P") {
    const dash = ["", "8 4", "2 3", "10 4 2 4"];
    for (let i = 0; i < 16; i++) {
      const js = 15 - PP[i], jd = 15 - i;
      el("line", {x1: cxx(js), y1: yA + 28, x2: cxx(jd), y2: yB - 2, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": dash[Math.floor(js / 4)]});
    }
    el("text", {x: 668, y: yA + 90, "font-size": 12, fill: css("--muted")}, "kimeneti i ←");
    el("text", {x: 668, y: yA + 106, "font-size": 12, fill: css("--muted")}, "bemeneti P[i]");
  } else if (s.key >= 0) {
    rowB(yA + 75, s.key, "⊕ kulcs");
  }
  if (s.stg !== "init" && s.stg !== "end") rowB(yB, s.v, "utána");
  // különbség
  el("text", {x: 10, y: 262, "font-size": 13, fill: css("--muted")}, "x és x′ különbsége (fekete = eltérő bit), előtte / utána:");
  rowB(272, s.prev ^ s.prevd, "előtte", {diff: s.prev ^ s.prevd, nohex: true});
  rowB(306, s.v ^ s.vd, "utána", {diff: s.v ^ s.vd, nohex: true});
  const nd = (s.v ^ s.vd).toString(2).split("").filter(c => c === "1").length;
  el("text", {x: 668, y: 324, "font-size": 14}, nd + " bit eltér");
  for (let n = 0; n < 4; n++) if (((s.v ^ s.vd) >> (12 - 4 * n)) & 15) {
    el("rect", {x: cxx(4 * n) - 15, y: 336, width: 128, height: 8, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 0.6});
  }
  el("text", {x: 150, y: 362, "font-size": 12, fill: css("--muted")}, "szürke sáv = érintett nibble (a következő S-dobozrétegben aktív S-doboz)");
}
function rotlJ(x, n){return ((x << n) | (x >>> (16 - n))) & 0xFFFF;}
function subJ(x){return (SB[(x>>12)&15]<<12)|(SB[(x>>8)&15]<<8)|(SB[(x>>4)&15]<<4)|SB[x&15];}
function permJ(x){let y = 0; for (let d = 0; d < 16; d++) if ((x >> PP[d]) & 1) y |= 1 << d; return y;}
function traceJ(x, k){
  const Ks = [k, rotlJ(k, 5), rotlJ(k, 11), rotlJ(k, 13)];
  const st = [["init", 0, x, -1], ["K0", 0, x ^ Ks[0], Ks[0]]]; let y = x ^ Ks[0];
  for (let r = 1; r <= 3; r++) { const z = subJ(y), w = permJ(z); y = w ^ Ks[r]; st.push(["S", r, z, -1], ["P", r, w, -1], ["K", r, y, Ks[r]]); }
  return st;
}
function pc(v){return v.toString(2).split("").filter(c => c === "1").length;}
function makeSteps(x, k, f){
  const t = traceJ(x, k), td = traceJ(x ^ (1 << f), k), LN = {init: 1, K0: 2, S: 8, P: 9, K: 10, end: 5}, out = [];
  t.forEach((e, i) => {
    const [stg, r, v, key] = e, b = td[i][2], prev = i ? t[i-1][2] : v, prevd = i ? td[i-1][2] : b, d = pc(v ^ b);
    let msg;
    if (stg === "init") msg = "Bemenet: x = " + hx(v) + ", K = " + hx(k) + "; x′ = x ⊕ e_" + f + " = " + hx(b) + "; különbségbitek: " + d;
    else if (stg === "K0") msg = "Kezdő kulcs-XOR: y₀ = x ⊕ K₀ = " + hx(prev) + " ⊕ " + hx(key) + " = " + hx(v) + "; különbségbitek: " + d;
    else if (stg === "S") msg = r + ". kör, S-doboz után: " + hx(v) + "; különbségbitek: " + d;
    else if (stg === "P") msg = r + ". kör, P után: " + hx(v) + "; különbségbitek: " + d;
    else msg = r + ". kör, kulcs-XOR (K" + r + " = " + hx(key) + ") után: y" + r + " = " + hx(v) + "; különbségbitek: " + d;
    out.push({stg, r, v, prev, key, vd: b, prevd, msg, line: LN[stg]});
  });
  const L = out[out.length - 1];
  out.push(Object.assign({}, L, {stg: "end", prev: L.v, prevd: L.vd, line: 5, msg: "Kimenet: y = " + hx(L.v) + "; y′ = " + hx(L.vd) + "; végső különbség " + pc(L.v ^ L.vd) + " bit"}));
  return out;
}
function load(){
  const xs = document.getElementById("ix").value.trim(), ks = document.getElementById("ik").value.trim(), m = document.getElementById("err");
  if (!/^[0-9a-fA-F]{1,4}$/.test(xs) || !/^[0-9a-fA-F]{1,4}$/.test(ks)) { m.textContent = "x és K: 1–4 hexa jegy."; return; }
  m.textContent = "";
  setSteps(makeSteps(parseInt(xs, 16), parseInt(ks, 16), +document.getElementById("ib").value));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
