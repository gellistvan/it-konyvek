<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merkle-rejtvények</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label for="ln">log<sub>2</sub> N:</label><input id="ln" type="range" min="4" max="40" value="20" aria-label="log2 N" style="flex:0 1 140px"><output id="lnv">20</output>
<label for="lsS">log<sub>2</sub> S:</label><input id="lsS" type="range" min="4" max="40" value="20" aria-label="log2 S" style="flex:0 1 140px"><output id="lsv">20</output>
<button id="sim">Mallory-szimuláció (N = 8)</button>
<div id="work" aria-live="polite" style="flex-basis:100%"></div>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Alice négy rejtvényt küld, Bob a harmadikat oldja meg és 0x03-at küld vissza; Mallorynak átlagosan 2,5 rejtvényt kell megoldania; N = S = 2^20 esetén a munka 2^20, 2^20, 2^39."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Elméleti modell: Alice munkája ≈ N, Bob munkája ≈ S, Mallory várható munkája ≈ (N+1)/2 · S (számított, nem mérés). A szimuláció véletlen sorrendű megoldást játszik le N = 8-ra.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés: Alice N = 4 rejtvényt készít és elküld Bobnak (P1..P4); Mallory mindet lehallgatja.", "line": 1, "st": 1}, {"msg": "2. lépés: Bob véletlenül a 3. rejtvényt választja, megoldja (S lépés): R = 0x03, K3.", "line": 2, "st": 2}, {"msg": "3. lépés: Bob visszaküldi R = 0x03-at; Mallory ezt is látja, de nem tudja, melyik rejtvényben volt.", "line": 3, "st": 3}, {"msg": "4. lépés: Alice a 0x03 alapján tudja, hogy K3 a közös kulcs; Mallorynak átlagosan (N+1)/2 = 2,5 rejtvényt kell megoldania.", "line": 4, "st": 4}];
const CODE = ["# Merkle-rejtvények (N rejtvény, egyenként S lépés)", "Alice: for i in 1..N: P_i = rejtvény(R_i, K_i); küld(P_1..P_N)", "Bob:   i = véletlen(1..N); (R_i, K_i) = megold(P_i)      # ~S lépés", "Bob:   küld(R_i)", "Alice: K = K[R_i]                                         # közös kulcs", "Mallory: megold(P_j) sorban, amíg R_j = R_i               # ~(N+1)/2 · S"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let simRes = null;
function mkWork(){ const lN=+document.getElementById("ln").value, lS=+document.getElementById("lsS").value;
  const N=Math.pow(2,lN), S=Math.pow(2,lS), wa=lN, wb=lS, wm=Math.log2((N+1)/2*S), wab=Math.log2(N+S);
  return {lN, lS, wa, wb, wm, wab}; }
function f1(v){return v.toFixed(1).replace(".",",");}
function render(s){
  svg.setAttribute("viewBox","0 0 760 330"); svg.innerHTML="";
  const X={A:70,B:270,M:450}, fg=css("--fg"), hl=css("--hl"), mu=css("--muted");
  [["A","Alice",""],["B","Bob",""],["M","Mallory","6 4"]].forEach(([k2,n,d])=>{
    el("rect",{x:X[k2]-45,y:8,width:90,height:28,fill:css("--cell"),stroke:css("--line"),"stroke-dasharray":d});
    el("text",{x:X[k2],y:27,"text-anchor":"middle","font-size":14},n);
    el("line",{x1:X[k2],x2:X[k2],y1:36,y2:320,stroke:css("--line"),"stroke-dasharray":d});});
  function arr(y,x0,x1,t,on){ const c=on?hl:fg; el("line",{x1:x0,x2:x1,y1:y,y2:y,stroke:c,"stroke-width":on?3:1.5});
    const d=x1>x0?-1:1; el("path",{d:`M${x1},${y} l${8*d},-5 l0,10 z`,fill:c});
    el("text",{x:(x0+x1)/2,y:y-6,"text-anchor":"middle","font-size":13},t); }
  function tap(y,x0){ el("line",{x1:x0,x2:X.M-6,y1:y,y2:y+22,stroke:mu,"stroke-dasharray":"2 3","stroke-width":1.5});
    el("text",{x:X.M+6,y:y+26,"font-size":11,fill:mu},"lehallgat"); }
  function nt(x,y,w,h,lines,on,d){ el("rect",{x:x-w/2,y:y,width:w,height:h,fill:css("--cellhl"),stroke:on?hl:css("--line"),"stroke-width":on?2.5:1,"stroke-dasharray":d||""});
    lines.forEach((t,i)=>el("text",{x:x,y:y+17+i*16,"text-anchor":"middle","font-size":12},t)); }
  if(s.st>=1){ arr(70,X.A,X.B,"1. N = 4 rejtvény: P1..P4",s.st===1); tap(70,X.B); }
  if(s.st>=2){ nt(X.B,110,190,40,["2. P3 megoldása: S lépés","→ R = 0x03, K3"],s.st===2); }
  if(s.st>=3){ arr(180,X.B,X.A,"3. R = 0x03",s.st===3); tap(180,X.B); }
  if(s.st>=4){ nt(X.A,215,120,40,["4. 0x03 → K3","(közös kulcs)"],s.st===4);
               nt(X.M,225,170,56,["lát: P1..P4, 0x03","átlagosan (N+1)/2 = 2,5","rejtvényt kell megoldania"],s.st===4,"6 4"); }
  // munkaigény-oszlopok (csúszkák)
  const w=mkWork(), bx=560, base=300, sc=5.6, maxv=Math.max(46,w.wm+4);
  const scl=250/maxv;
  [["Alice",w.wa,"none"],["Bob",w.wb,"url(#hat1)"],["Mallory",w.wm,"url(#hat2)"]].forEach(([n,v,f],i)=>{
    const x=bx+i*62, h=v*scl;
    el("rect",{x:x,y:base-h,width:44,height:h,fill:i?css("--cellhl"):css("--cell"),stroke:css("--line")});
    if(i){ for(let yy=base-h+6; yy<base; yy+=8) el("line",{x1:x,x2:x+44,y1:yy,y2:i===2?yy-6:yy,stroke:css("--line"),"stroke-width":0.6}); }
    el("text",{x:x+22,y:base-h-5,"text-anchor":"middle","font-size":13,"font-weight":"bold"},f1(v));
    el("text",{x:x+22,y:base+16,"text-anchor":"middle","font-size":12},n); });
  el("text",{x:bx+84,y:24,"text-anchor":"middle","font-size":12},`munka, log₂ (N = 2^${w.lN}, S = 2^${w.lS})`);
  el("text",{x:bx+84,y:40,"text-anchor":"middle","font-size":11,fill:mu},"számított, nem mérés");
  const wk=document.getElementById("work");
  if(wk){ let t=`Alice ≈ 2^${f1(w.wa)}, Bob ≈ 2^${f1(w.wb)}, a felek együtt (N + S) ≈ 2^${f1(w.wab)}; Mallory (N+1)/2·S ≈ 2^${f1(w.wm)}; arány NS/2 : (N + S) ≈ 2^${f1(w.wm-w.wab)}.`;
    if(simRes) t+=" "+simRes; wk.textContent=t; }
}
function rerender(){ document.getElementById("lnv").textContent=document.getElementById("ln").value;
  document.getElementById("lsv").textContent=document.getElementById("lsS").value; render(STEPS[k]); }
document.getElementById("ln").addEventListener("input",rerender);
document.getElementById("lsS").addEventListener("input",rerender);
document.getElementById("sim").addEventListener("click",()=>{
  const n=8, ids=[]; for(let i=1;i<=n;i++) ids.push(i);
  const bobPick=1+Math.floor(Math.random()*n);
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  const order=[]; for(const i of ids){ order.push(i); if(i===bobPick) break; }
  simRes=`Szimuláció (N = 8, Bob a ${bobPick}. rejtvényt oldotta meg): Mallory a(z) ${order.join(", ")} sorrendben ${order.length} rejtvényt oldott meg (várható érték 4,5).`;
  render(STEPS[k]); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
