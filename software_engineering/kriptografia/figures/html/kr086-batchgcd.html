<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch-gcd szorzat- és maradékfája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Modulusok: <input id="bn" value="3233, 2867, 8633, 6557" size="30" aria-label="Modulusok listája"></label><button onclick="loadB()">Betöltés</button><span id="berr" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Batch-gcd négy modulusra: szorzatfa felfelé a P = 524 687 021 961 391 gyökérig, maradékfa lefelé P mod v² értékekkel; a levelekben gcd = 61, 61, 1, 1."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Bernstein-féle batch-gcd (szorzatfa + maradékfa, T-C6-065 szerinti helyes eljárás). Saját modulusoknál BigInt-számolás. Oktatási célra – NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 1, "down": 0, "fin": 0, "line": 0, "msg": "Szorzatfa, levelek: N = 3233, 2867, 8633, 6557"}, {"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 2, "down": 0, "fin": 0, "line": 3, "msg": "Szorzatfa, 1. szint: 9 269 011, 56 606 581"}, {"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 3, "down": 0, "fin": 0, "line": 3, "msg": "Szorzatfa, 2. szint: 524 687 021 961 391"}, {"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 3, "down": 1, "fin": 0, "line": 11, "msg": "Maradékfa lefelé, 1. szint: P mod v² = 9 199 632 452 665, 524 687 021 961 391"}, {"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 3, "down": 2, "fin": 0, "line": 11, "msg": "Maradékfa lefelé, 0. szint: P mod v² = 8 480 159, 349 774, 57 979 228, 40 181 296"}, {"tree": [["3233", "2867", "8633", "6557"], ["9269011", "56606581"], ["524687021961391"]], "rem": [["8480159", "349774", "57979228", "40181296"], ["9199632452665", "524687021961391"], ["524687021961391"]], "z": ["2623", "122", "6716", "6128"], "g": ["61", "61", "1", "1"], "up": 3, "down": 2, "fin": 1, "line": 12, "msg": "Levelek: z_i = (P mod N_i²)/N_i, gcd(z_i, N_i) = 61, 61, 1, 1 → közös prím: N_1, N_2"}];
const CODE = ["def product_tree(X):", "    tree = [X]", "    while len(X) > 1:", "        X = [prod(X[i:i+2]) for i in range(0, len(X), 2)]", "        tree.append(X)", "    return tree", "def batch_gcd(X):", "    tree = product_tree(X)", "    R = tree.pop()                       # [P]", "    while tree:", "        lv = tree.pop()", "        R = [R[i // 2] % lv[i]**2 for i in range(len(lv))]", "    return [gcd(r // n, n) for r, n in zip(R, X)]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const L = s.tree.length, n = s.tree[0].length, dx = 560 / n, pos = [];
  for (let l = 0; l < L; l++) {
    pos.push([]);
    for (let i = 0; i < s.tree[l].length; i++) {
      let x;
      if (l === 0) x = dx * (i + 0.5);
      else { const a = pos[l - 1][2 * i], b = pos[l - 1][2 * i + 1]; x = b === undefined ? a : (a + b) / 2; }
      pos[l].push(x);
    }
  }
  const Y = l => 230 - l * (190 / Math.max(1, L - 1));
  const fs = n > 4 ? 9 : 11;
  for (let l = 1; l < L; l++) for (let i = 0; i < s.tree[l - 1].length; i++) {
    if (l < s.up + 0 && l <= s.up - 1) el("line", {x1: pos[l - 1][i] - 4, y1: Y(l - 1) - 16, x2: pos[l][i >> 1] - 4, y2: Y(l) + 16, stroke: css("--line"), "stroke-width": 1.4});
    if (s.down >= L - l) el("line", {x1: pos[l - 1][i] + 4, y1: Y(l - 1) - 16, x2: pos[l][i >> 1] + 4, y2: Y(l) + 16, stroke: css("--hl2"), "stroke-width": 1.6, "stroke-dasharray": "5 3"});
  }
  for (let l = 0; l < Math.min(s.up, L); l++) for (let i = 0; i < s.tree[l].length; i++) {
    const x = pos[l][i], y = Y(l), showR = l === L - 1 || s.down >= L - 1 - l, w = Math.min(dx * (l ? 1.9 : 0.92), 300);
    el("rect", {x: x - w / 2, y: y - 16, width: w, height: 32, fill: css("--cell"), stroke: css("--line")});
    el("text", {x, y: y - 2, "text-anchor": "middle", "font-size": fs}, (l === L - 1 ? "P = " : "") + grp(s.tree[l][i]));
    if (showR && l < L - 1) el("text", {x, y: y + 12, "text-anchor": "middle", "font-size": fs - 1, fill: css("--hl2")}, "mod v²: " + grp(s.rem[l][i]));
  }
  if (s.fin) for (let i = 0; i < n; i++) {
    const x = pos[0][i], hit = s.g[i] !== "1", w = dx * 0.92;
    el("rect", {x: x - w / 2, y: 262, width: w, height: 40, fill: hit ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": hit ? 3.5 : 1});
    el("text", {x, y: 278, "text-anchor": "middle", "font-size": fs}, "z = " + s.z[i]);
    el("text", {x, y: 295, "text-anchor": "middle", "font-size": fs, "font-weight": hit ? "bold" : "normal"}, "gcd = " + s.g[i]);
  }
  el("text", {x: 4, y: 322, "font-size": 11, fill: css("--muted")}, "folytonos = szorzatfa (fel), szaggatott = maradékfa (le, P mod v²); vastag keret = közös prím");
}
function bigsteps(xs){
  const X = xs.map(BigInt), tree = [X];
  while (tree[tree.length - 1].length > 1) { const lv = tree[tree.length - 1], nx = []; for (let i = 0; i < lv.length; i += 2) nx.push(i + 1 < lv.length ? lv[i] * lv[i + 1] : lv[i]); tree.push(nx); }
  const L = tree.length, rem = new Array(L); rem[L - 1] = [tree[L - 1][0]];
  for (let l = L - 2; l >= 0; l--) rem[l] = tree[l].map((v, i) => rem[l + 1][i >> 1] % (v * v));
  const z = rem[0].map((r, i) => r / X[i]);
  const g = z.map((a, i) => { let x = a, y = X[i]; while (y) { [x, y] = [y, x % y]; } return x; });
  const data = {tree: tree.map(lv => lv.map(String)), rem: rem.map(lv => lv.map(String)), z: z.map(String), g: g.map(String)};
  const st = [];
  for (let l = 0; l < L; l++) st.push(Object.assign({}, data, {up: l + 1, down: 0, fin: 0, line: l ? 3 : 0, msg: l ? ("Szorzatfa, " + l + ". szint: " + tree[l].join(", ")) : ("Szorzatfa, levelek: N = " + xs.join(", "))}));
  for (let k = 0, l = L - 2; l >= 0; k++, l--) st.push(Object.assign({}, data, {up: L, down: k + 1, fin: 0, line: 11, msg: "Maradékfa lefelé, " + l + ". szint: P mod v² = " + rem[l].join(", ")}));
  const hits = data.g.map((v, i) => v !== "1" ? "N_" + (i + 1) : null).filter(Boolean);
  st.push(Object.assign({}, data, {up: L, down: L - 1, fin: 1, line: 12, msg: "Levelek: z_i = (P mod N_i²)/N_i, gcd(z_i, N_i) = " + data.g.join(", ") + (hits.length ? " → közös prím: " + hits.join(", ") : " → nincs közös prím")}));
  return st;
}
function loadB(){
  const xs = document.getElementById("bn").value.split(/[ ,;]+/).filter(x => x).map(Number), err = document.getElementById("berr");
  if (xs.length < 2 || xs.length > 8 || xs.some(v => !Number.isInteger(v) || v < 6 || v > 1e9)) { err.textContent = "2–8 egész modulus kell, 6 és 10⁹ között."; return; }
  err.textContent = ""; setSteps(bigsteps(xs));
}
function grp(t){ return String(t).replace(/\B(?=(\d{3})+(?!\d))/g, "\u202f"); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
