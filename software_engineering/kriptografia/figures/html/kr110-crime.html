const CANDS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789", COOKIE = "Cookie: sessionid=", SZ = 16, CW = 0.61 * SZ;

function lzEst(t){ let bits = 0, i = 0; while (i < t.length) { let best = 0;
    for (let j = 0; j < i; j++) { let n = 0; while (i + n < t.length && t[j + n] === t[i + n] && n < 258) n++; if (n > best) best = n; }

function T(x, y, s, st){ return ["text", x, y, s, st]; }
const XG = 560;
function textLine(x, y, label, guess, s, ref){

function estScene(st, secret){

function custom(){

    const r = estScene(st, secret);

    else m = "Lépés " + (kk + 1) + ": felfedett prefix = " + (pre || "(üres)") + ", legrövidebb: " + best[0] + " (" + fmt(lo) + " bájt, becslés) → új prefix: " + pre + best[0];
