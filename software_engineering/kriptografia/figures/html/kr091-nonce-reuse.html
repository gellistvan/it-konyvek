<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonce-újrahasználat: k és x visszaállítása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>k: <input id="kk" type="number" value="5" min="1" max="10" style="width:4em" aria-label="nonce k"></label><label>x: <input id="xx" type="number" value="3" min="1" max="10" style="width:4em" aria-label="titkos kulcs x"></label><label>m₁: <input id="mm1" type="number" value="10" style="width:5em" aria-label="első üzenet"></label><label>m₂: <input id="mm2" type="number" value="20" style="width:5em" aria-label="második üzenet"></label><button onclick="loadN()">Számol</button><span id="nerr" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két DSA-aláírás azonos r = 1 értékkel; a két kongruencia megoldáshalmaza a 11×11-es (k, x) rácson egyetlen közös pontban, (5, 3)-ban metszi egymást."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játék-DSA: p = 23, q = 11, g = 4, H(m) = m mod 11 (23.4.4). A sign s = 0 esetén új k-t kér. Oktatási célra – NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 0, "line": 1, "msg": "Két aláírás: (r, s₁) = (1, 7), (r, s₂) = (1, 9) – r₁ = r₂ = 1: ugyanaz a nonce!"}, {"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 1, "line": 6, "msg": "1. H(m₁) − H(m₂) = 10 − 9 ≡ 1 (mod 11)"}, {"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 2, "line": 7, "msg": "2. s₁ − s₂ = 7 − 9 ≡ 9 (mod 11)"}, {"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 3, "line": 8, "msg": "3. (s₁ − s₂)⁻¹ = 9⁻¹ mod 11 = 5"}, {"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 4, "line": 9, "msg": "4. k = 1·5 mod 11 = 5"}, {"h1": 10, "h2": 9, "r": 1, "s1": 7, "s2": 9, "k": 5, "x": 3, "y": 18, "m1": 10, "m2": 20, "bad": "", "dh": 1, "ds": 9, "inv": 5, "kr": 5, "xraw": 25, "xr": 3, "l1": [[0, 1], [1, 8], [2, 4], [3, 0], [4, 7], [5, 3], [6, 10], [7, 6], [8, 2], [9, 9], [10, 5]], "l2": [[0, 2], [1, 0], [2, 9], [3, 7], [4, 5], [5, 3], [6, 1], [7, 10], [8, 8], [9, 6], [10, 4]], "st": 5, "line": 10, "msg": "5. x = (7·5 − 10)·1⁻¹ = 25 mod 11 = 3"}];
const CODE = ["def sign(m, k):", "    r = pow(g, k, p) % q", "    s = pow(k, -1, q) * (H(m) + x * r) % q", "    if r == 0 or s == 0: raise ValueError(\"új k kell\")", "    return r, s", "# támadó: (r, s1), (r, s2) azonos r-rel", "dh = (H(m1) - H(m2)) % q", "ds = (s1 - s2) % q", "inv = pow(ds, -1, q)", "k = dh * inv % q", "x = (s1 * k - H(m1)) * pow(r, -1, q) % q"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

const P = 23, Q = 11, G = 4;
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  // kártyák
  [[s.m1, s.h1, s.s1], [s.m2, s.h2, s.s2]].forEach(([m, h, sv], j) => {
    const y = 20 + j * 120;
    el("rect", {x: 10, y, width: 220, height: 100, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 20, y: y + 22, "font-size": 13, "font-weight": "bold"}, (j + 1) + ". aláírás: m = " + m + ", H = " + h);
    el("rect", {x: 22, y: y + 40, width: 90, height: 44, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 4});
    el("text", {x: 67, y: y + 68, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, "r = " + s.r);
    el("rect", {x: 128, y: y + 40, width: 90, height: 44, fill: css("--cell"), stroke: css("--line"), "stroke-width": (s.st === 2 ? 3 : 1)});
    el("text", {x: 173, y: y + 68, "text-anchor": "middle", "font-size": 16}, "s = " + sv);
  });
  if (s.bad) { el("text", {x: 10, y: 270, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, s.bad); return; }
  el("text", {x: 10, y: 268, "font-size": 12}, s.st >= 4 ? "k = " + s.kr : "k = ?");
  el("text", {x: 10, y: 288, "font-size": 12}, s.st >= 5 ? "x = " + s.xr : "x = ?");
  // rács
  const X = k => 290 + k * 24, Y = x => 285 - x * 24;
  for (let i = 0; i < Q; i++) {
    el("line", {x1: X(i), y1: Y(0), x2: X(i), y2: Y(10), stroke: css("--muted"), "stroke-width": 0.4, "stroke-dasharray": "2 3"});
    el("line", {x1: X(0), y1: Y(i), x2: X(10), y2: Y(i), stroke: css("--muted"), "stroke-width": 0.4, "stroke-dasharray": "2 3"});
    el("text", {x: X(i), y: Y(0) + 16, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(i));
    el("text", {x: X(0) - 10, y: Y(i) + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, String(i));
  }
  el("text", {x: X(10) + 4, y: Y(0) + 16, "font-size": 11}, "k");
  el("text", {x: X(0) - 18, y: Y(10) - 6, "font-size": 11}, "x");
  s.l1.forEach(([k, x]) => el("circle", {cx: X(k), cy: Y(x), r: 5.5, fill: css("--bg"), stroke: css("--line"), "stroke-width": 1.6}));
  s.l2.forEach(([k, x]) => el("polygon", {points: `${X(k)},${Y(x) - 6} ${X(k) - 5.5},${Y(x) + 4.5} ${X(k) + 5.5},${Y(x) + 4.5}`, fill: css("--muted"), stroke: css("--line")}));
  if (s.st >= 4) el("rect", {x: X(s.kr) - 11, y: Y(s.xr) - 11, width: 22, height: 22, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  el("text", {x: 290, y: 318, "font-size": 11, fill: css("--muted")}, "○ " + s.s1 + "k ≡ " + s.h1 + " + " + s.r + "x   △ " + s.s2 + "k ≡ " + s.h2 + " + " + s.r + "x (mod 11)");
}
function sgn(m, k, x){ const r = powm(G, k, P) % Q; return [r, md(invm(k, Q) * (md(m, Q) + x * r), Q)]; }
function attackJS(m1, m2, k, x){
  const h1 = md(m1, Q), h2 = md(m2, Q), [r, s1] = sgn(m1, k, x), [r2, s2] = sgn(m2, k, x);
  const d = {h1, h2, r, s1, s2, k, x, y: powm(G, x, P), m1, m2, bad: ""};
  if (r === 0 || s1 === 0 || s2 === 0) { d.bad = "érvénytelen aláírás (r = 0 vagy s = 0), új k kell"; d.l1 = []; d.l2 = []; return d; }
  if (md(s1 - s2, Q) === 0) { d.bad = "s₁ = s₂ (H(m₁) = H(m₂)): az egyenletrendszer nem oldható meg"; d.l1 = []; d.l2 = []; return d; }
  const dh = md(h1 - h2, Q), ds = md(s1 - s2, Q), inv = invm(ds, Q), kr = dh * inv % Q, xraw = s1 * kr - h1, ri = invm(r, Q), xr = md(xraw * ri, Q);
  const l1 = [], l2 = []; for (let kk = 0; kk < Q; kk++) { l1.push([kk, md((s1 * kk - h1) * ri, Q)]); l2.push([kk, md((s2 * kk - h2) * ri, Q)]); }
  return Object.assign(d, {dh, ds, inv, kr, xraw, xr, l1, l2});
}
function stepsJS(d){
  if (d.bad) return [Object.assign({}, d, {st: 0, line: 3, msg: "Figyelem: " + d.bad})];
  const ri = invm(d.r, Q);
  return [
    Object.assign({}, d, {st: 0, line: 1, msg: "Két aláírás: (r, s₁) = (" + d.r + ", " + d.s1 + "), (r, s₂) = (" + d.r + ", " + d.s2 + ") – r₁ = r₂ = " + d.r + ": ugyanaz a nonce!"}),
    Object.assign({}, d, {st: 1, line: 6, msg: "1. H(m₁) − H(m₂) = " + d.h1 + " − " + d.h2 + " ≡ " + d.dh + " (mod 11)"}),
    Object.assign({}, d, {st: 2, line: 7, msg: "2. s₁ − s₂ = " + d.s1 + " − " + d.s2 + " ≡ " + d.ds + " (mod 11)"}),
    Object.assign({}, d, {st: 3, line: 8, msg: "3. (s₁ − s₂)⁻¹ = " + d.ds + "⁻¹ mod 11 = " + d.inv}),
    Object.assign({}, d, {st: 4, line: 9, msg: "4. k = " + d.dh + "·" + d.inv + " mod 11 = " + d.kr}),
    Object.assign({}, d, {st: 5, line: 10, msg: d.r !== 1 ? ("5. x = (" + d.s1 + "·" + d.kr + " − " + d.h1 + ")·" + d.r + "⁻¹ = " + d.xraw + "·" + ri + " mod 11 = " + d.xr) : ("5. x = (" + d.s1 + "·" + d.kr + " − " + d.h1 + ")·1⁻¹ = " + d.xraw + " mod 11 = " + d.xr)}),
  ];
}
function loadN(){
  const v = ["kk", "xx", "mm1", "mm2"].map(id => Number(document.getElementById(id).value)), err = document.getElementById("nerr");
  if (v.some(t => !Number.isInteger(t)) || v[0] < 1 || v[0] > 10 || v[1] < 1 || v[1] > 10 || v[2] < 0 || v[3] < 0) { err.textContent = "1 ≤ k, x ≤ 10 és nemnegatív egész üzenetek kellenek."; return; }
  err.textContent = ""; setSteps(stepsJS(attackJS(v[2], v[3], v[0], v[1])));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
