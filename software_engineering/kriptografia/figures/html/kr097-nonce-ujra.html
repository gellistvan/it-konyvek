<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECDSA nonce-újrahasználat kis görbén</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>z1: <input id="z1in" type="number" min="1" max="12" value="7" style="width:3.5em"></label><label>z2: <input id="z2in" type="number" min="1" max="12" value="4" style="width:3.5em"></label><label>d: <input id="din" type="number" min="1" max="12" value="3" style="width:3.5em"></label><label>k: <input id="kin" type="number" min="1" max="12" value="2" style="width:3.5em"></label><button id="go">Aláír és támad</button><span id="emsg" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két aláírás azonos r értékkel; a levezetés négy lépése: közös k felismerése, k = 2, d = 3, ellenőrzés [3]G = (5, 9) = Q."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">y² = x³ + x + 6 (mod 11), G = (3, 5), a csoport rendje n = 13. A kód a 6. feladat (javított adatokkal futó) megoldása; a mezőkből számolt új aláírásokra a 2. és a 6. sor frissül. Oktatási játékpélda a könyv saját adataival, nem éles támadókód.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "line": -1, "msg": "Két aláírás ugyanazzal a nonce-szal: (r, s1) = (8, 9) a z1 = 7, (r, s2) = (8, 1) a z2 = 4 hash-re. Nyilvános kulcs Q = (5, 9).", "v": {"r": 8, "s1": 9, "s2": 1, "z1": 7, "z2": 4, "R": "(8, 3)", "Q": "(5, 9)", "inv": 5, "k": 2, "rinv": 5, "d": 3, "diff": 8, "dz": 3, "num": 11, "Qd": "(5, 9)"}}, {"ph": 1, "line": 1, "msg": "1. lépés: mindkét aláírásban r = 8 → ugyanaz az R = [k]G = (8, 3), tehát ugyanaz a k.", "v": {"r": 8, "s1": 9, "s2": 1, "z1": 7, "z2": 4, "R": "(8, 3)", "Q": "(5, 9)", "inv": 5, "k": 2, "rinv": 5, "d": 3, "diff": 8, "dz": 3, "num": 11, "Qd": "(5, 9)"}}, {"ph": 2, "line": 3, "msg": "2. lépés: s1 − s2 = 8, (8)⁻¹ ≡ 5 (mod 13), k = (7 − 4)·5 = 3·5 ≡ 2 → k = 2", "v": {"r": 8, "s1": 9, "s2": 1, "z1": 7, "z2": 4, "R": "(8, 3)", "Q": "(5, 9)", "inv": 5, "k": 2, "rinv": 5, "d": 3, "diff": 8, "dz": 3, "num": 11, "Qd": "(5, 9)"}}, {"ph": 3, "line": 4, "msg": "3. lépés: d = (s1·k − z1)·r⁻¹ = (9·2 − 7)·5 = 11·5 ≡ 3 → d = 3", "v": {"r": 8, "s1": 9, "s2": 1, "z1": 7, "z2": 4, "R": "(8, 3)", "Q": "(5, 9)", "inv": 5, "k": 2, "rinv": 5, "d": 3, "diff": 8, "dz": 3, "num": 11, "Qd": "(5, 9)"}}, {"ph": 4, "line": 5, "msg": "4. lépés: ellenőrzés [3]G = (5, 9) = Q ✓ – a titkos kulcs kinyerve.", "v": {"r": 8, "s1": 9, "s2": 1, "z1": 7, "z2": 4, "R": "(8, 3)", "Q": "(5, 9)", "inv": 5, "k": 2, "rinv": 5, "d": 3, "diff": 8, "dz": 3, "num": 11, "Qd": "(5, 9)"}}];
const CODE = ["n = 13", "r, z1, z2, s1, s2 = 8, 7, 4, 9, 1", "", "k = (z1 - z2) * pow(s1 - s2, -1, n) % n", "d = (s1 * k - z1) * pow(r, -1, n) % n", "print(\"k =\", k, \" d =\", d)  # k = 2  d = 3"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(x, m){ return ((x % m) + m) % m; }
function minv(x, m){ x = md(x, m); for (let t = 1; t < m; t++) if ((x * t) % m === 1) return t; return null; }
function ecAdd(P, Q, p, a){
  if (P === null) return Q; if (Q === null) return P;
  const [x1, y1] = P, [x2, y2] = Q;
  if (x1 === x2 && md(y1 + y2, p) === 0) return null;
  let lam;
  if (x1 === x2 && y1 === y2) lam = md((3 * x1 * x1 + a) * minv(2 * y1, p), p);
  else lam = md((y2 - y1) * minv(x2 - x1, p), p);
  const x3 = md(lam * lam - x1 - x2, p);
  return [x3, md(lam * (x1 - x3) - y1, p)];
}
function ecMul(n, P, p, a){ let R = null; for (const b of n.toString(2)) { R = ecAdd(R, R, p, a); if (b === "1") R = ecAdd(R, P, p, a); } return n > 0 ? R : null; }
function fp(P){ return P === null ? "O" : "(" + P[0] + ", " + P[1] + ")"; }

const CP = 11, CA = 1, GG = [3, 5], NN = 13;
function attackJS(z1, z2, d, kk){
  const Q = ecMul(d, GG, CP, CA), R = ecMul(kk, GG, CP, CA);
  if (R === null) return "k-hoz R = O; válassz más k-t.";
  const r = R[0] % NN; if (r === 0) return "r = 0 – az aláíró új k-t választana; válassz más k-t.";
  const ki = minv(kk, NN), s1 = md(ki * (z1 + r * d), NN), s2 = md(ki * (z2 + r * d), NN);
  if (s1 === 0 || s2 === 0) return "s = 0 adódna – válassz más értéket.";
  if (s1 === s2) return "s1 = s2 (z1 ≡ z2) – a két aláírás azonos, nincs mit kivonni.";
  const diff = md(s1 - s2, NN), inv = minv(diff, NN), dz = md(z1 - z2, NN), k2 = md(dz * inv, NN);
  const rinv = minv(r, NN), num = md(s1 * k2 - z1, NN), dd = md(num * rinv, NN), Qd = ecMul(dd, GG, CP, CA);
  const v = {r: r, s1: s1, s2: s2, z1: z1, z2: z2, R: fp(R), Q: fp(Q), inv: inv, k: k2, rinv: rinv, d: dd, diff: diff, dz: dz, num: num, Qd: fp(Qd)};
  const ok = fp(Qd) === fp(Q);
  return [
    {ph: 0, line: -1, v: v, msg: "Két aláírás ugyanazzal a nonce-szal: (r, s1) = (" + r + ", " + s1 + ") a z1 = " + z1 + ", (r, s2) = (" + r + ", " + s2 + ") a z2 = " + z2 + " hash-re. Nyilvános kulcs Q = " + fp(Q) + "."},
    {ph: 1, line: 1, v: v, msg: "1. lépés: mindkét aláírásban r = " + r + " → ugyanaz az R = [k]G = " + fp(R) + ", tehát ugyanaz a k."},
    {ph: 2, line: 3, v: v, msg: "2. lépés: s1 − s2 = " + diff + ", (" + diff + ")⁻¹ ≡ " + inv + " (mod 13), k = (" + z1 + " − " + z2 + ")·" + inv + " = " + dz + "·" + inv + " ≡ " + k2 + " → k = " + k2},
    {ph: 3, line: 4, v: v, msg: "3. lépés: d = (s1·k − z1)·r⁻¹ = (" + s1 + "·" + k2 + " − " + z1 + ")·" + rinv + " = " + num + "·" + rinv + " ≡ " + dd + " → d = " + dd},
    {ph: 4, line: 5, v: v, msg: "4. lépés: ellenőrzés [" + dd + "]G = " + fp(Qd) + " = Q" + (ok ? " ✓ – a titkos kulcs kinyerve." : " ✗")}];
}
document.getElementById("go").onclick = () => {
  const g = id => parseInt(document.getElementById(id).value, 10);
  const z1 = g("z1in"), z2 = g("z2in"), d = g("din"), kk = g("kin"), em = document.getElementById("emsg");
  if ([z1, z2, d, kk].some(x => !(x >= 1 && x <= 12))) { em.textContent = "Minden érték 1 és 12 között legyen."; return; }
  const res = attackJS(z1, z2, d, kk);
  if (typeof res === "string") { em.textContent = res; return; }
  em.textContent = ""; setSteps(res);
};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const v = s.v;
  const L1 = document.getElementById("L1");
  if (L1) L1.textContent = "r, z1, z2, s1, s2 = " + v.r + ", " + v.z1 + ", " + v.z2 + ", " + v.s1 + ", " + v.s2;
  const L5 = document.getElementById("L5");
  if (L5) L5.textContent = 'print("k =", k, " d =", d)  # k = ' + v.k + "  d = " + v.d;
  function card(y, t1, t2, t3){
    el("rect", {x: 10, y: y, width: 200, height: 92, rx: 8, fill: css("--cell"), stroke: css("--line"), "stroke-width": s.ph === 1 ? 2.5 : 1.2});
    el("text", {x: 110, y: y + 26, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, t1);
    el("text", {x: 110, y: y + 50, "text-anchor": "middle", "font-size": 14}, t2);
    el("text", {x: 110, y: y + 74, "text-anchor": "middle", "font-size": 14}, t3);
  }
  card(20, "1. aláírás", "z1 = " + v.z1, "(r, s1) = (" + v.r + ", " + v.s1 + ")");
  card(170, "2. aláírás", "z2 = " + v.z2, "(r, s2) = (" + v.r + ", " + v.s2 + ")");
  if (s.ph >= 1) el("text", {x: 110, y: 145, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, "azonos r = " + v.r + "!");
  const rows = ["r = " + v.r + " mindkettőben → ugyanaz az R = " + v.R + ", ugyanaz a k",
                "s1 − s2 = " + v.diff + ",  " + v.diff + "⁻¹ ≡ " + v.inv + ",  k = " + v.dz + "·" + v.inv + " ≡ " + v.k,
                "d = (" + v.s1 + "·" + v.k + " − " + v.z1 + ")·" + v.r + "⁻¹ = " + v.num + "·" + v.rinv + " ≡ " + v.d,
                "ellenőrzés: [" + v.d + "]G = " + v.Qd + " = Q = " + v.Q];
  rows.forEach((t, i) => {
    const y = 20 + i * 66, on = s.ph === i + 1, vis = s.ph >= i + 1;
    el("rect", {x: 250, y: y, width: 500, height: 50, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": vis ? "none" : "4 3"});
    el("text", {x: 264, y: y + 31, "font-size": 14, "font-weight": "bold"}, (i + 1) + ".");
    el("text", {x: 290, y: y + 31, "font-size": 14, fill: vis ? css("--fg") : css("--muted")}, vis ? t : "…");
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
