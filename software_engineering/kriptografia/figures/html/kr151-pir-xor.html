<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két szerveres XOR-PIR</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>x (8 bit): <input id="xin" value="10101100" size="10" aria-label="adatbázis x, 8 bit"></label> <label>i: <select id="iin" aria-label="lekérdezett index i"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label> <button onclick="applyIn()">Alkalmaz</button> <button onclick="newR()">új r (véletlen maszk)</button> <span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bitrács: az x adatbázis, a két lekérdezés és a bitenkénti ÉS sorai; a két lekérdezés csak az i-edik oszlopban különbözik, a két paritás XOR-ja az i-edik adatbit."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kiindulás: a 38.4.6 3. feladata (x = 10101100, i = 5, r = 01101001; a bitek balról, 1-től indexelve). Kitöltött cella = 1. Az „új r” gomb tetszőleges maszkot sorsol: az eredmény mindig x_i.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stage": 0, "line": 0, "msg": "1. r sorsolása: r = 01101001; a szerverek még semmit sem láttak."}, {"stage": 1, "line": 1, "msg": "2. eᵢ hozzáadása: q₁ = r, q₂ = r ⊕ e5 = 01100001 – csak az 5. bit tér el."}, {"stage": 2, "line": 2, "msg": "3. 1. szerver: q₁ ∧ x paritása → a₁ = 0"}, {"stage": 3, "line": 3, "msg": "4. 2. szerver: q₂ ∧ x paritása → a₂ = 1"}, {"stage": 4, "line": 4, "msg": "5. kliens: a₁ = 0, a₂ = 1, x_5 = a₁ ⊕ a₂ = 1"}];
const CODE = ["r ← véletlen {0,1}^n                 # kliens", "q₁ ← r ;  q₂ ← r ⊕ eᵢ               # kliens: a két lekérdezés", "a₁ ← q₁ · x  (mod 2)                 # 1. szerver", "a₂ ← q₂ · x  (mod 2)                 # 2. szerver", "xᵢ ← a₁ ⊕ a₂                         # kliens"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = {x: [1, 0, 1, 0, 1, 1, 0, 0], i: 5, r: [0, 1, 1, 0, 1, 0, 0, 1]};
function comp(x, i, r){
  const n = x.length, e = x.map((_, j) => j === i - 1 ? 1 : 0);
  const q1 = r.slice(), q2 = r.map((b, j) => b ^ e[j]);
  const p1 = q1.map((b, j) => b & x[j]), p2 = q2.map((b, j) => b & x[j]);
  const a1 = p1.reduce((s, b) => s + b, 0) % 2, a2 = p2.reduce((s, b) => s + b, 0) % 2;
  return {x: x, e: e, q1: q1, q2: q2, p1: p1, p2: p2, a1: a1, a2: a2, res: a1 ^ a2};
}
function mk(){
  const d = comp(CUR.x, CUR.i, CUR.r), i = CUR.i, J = b => b.join("");
  const m = ["1. r sorsolása: r = " + J(d.q1) + "; a szerverek még semmit sem láttak.",
    "2. eᵢ hozzáadása: q₁ = r, q₂ = r ⊕ e" + i + " = " + J(d.q2) + " – csak az " + i + ". bit tér el.",
    "3. 1. szerver: q₁ ∧ x paritása → a₁ = " + d.a1,
    "4. 2. szerver: q₂ ∧ x paritása → a₂ = " + d.a2,
    "5. kliens: a₁ = " + d.a1 + ", a₂ = " + d.a2 + ", x_" + i + " = a₁ ⊕ a₂ = " + d.res];
  return m.map((t, k) => ({stage: k, line: k, msg: t}));
}
function newR(){ CUR.r = CUR.x.map(() => Math.random() < 0.5 ? 1 : 0); setSteps(mk()); show(STEPS.length - 1); }
function applyIn(){
  const s = document.getElementById("xin").value.replace(/[^01]/g, "");
  const msg = document.getElementById("err");
  if (s.length !== 8) { msg.textContent = "x pontosan 8 bit legyen (0/1)."; return; }
  msg.textContent = "";
  CUR.x = s.split("").map(Number); CUR.i = +document.getElementById("iin").value;
  setSteps(mk());
}
function render(s){
  const d = comp(CUR.x, CUR.i, CUR.r), st = s.stage, i = CUR.i;
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 330");
  const w = 40, x0 = 170, rows = [
    ["x (adatbázis)", d.x, 0, ""], ["q₁ = r", d.q1, 0, ""], ["q₁ ∧ x", d.p1, 2, "a₁ = " + d.a1],
    ["q₂ = r ⊕ e" + i, d.q2, 1, ""], ["q₂ ∧ x", d.p2, 3, "a₂ = " + d.a2], ["q₁ ⊕ q₂ = e" + i, d.e, 1, ""]];
  for (let j = 0; j < 8; j++) el("text", {x: x0 + j * w + w / 2, y: 22, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(j + 1));
  el("text", {x: x0 - 8, y: 22, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, "pozíció j:");
  rows.forEach((r, k) => {
    const y = 32 + k * 42, vis = k === 0 || r[2] <= st || (k === 1 && st >= 0);
    el("text", {x: x0 - 8, y: y + 25, "text-anchor": "end", "font-size": 14}, r[0]);
    r[1].forEach((b, j) => {
      el("rect", {x: x0 + j * w + 2, y: y + 2, width: w - 4, height: 34, fill: vis && b ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": vis ? "" : "3 3"});
      if (vis) el("text", {x: x0 + j * w + w / 2, y: y + 25, "text-anchor": "middle", "font-size": 16, "font-weight": b ? "bold" : "normal"}, String(b));
    });
    if (r[3] && vis) el("text", {x: x0 + 8 * w + 12, y: y + 25, "font-size": 15, "font-weight": "bold"}, r[3] + " (paritás)");
  });
  el("rect", {x: x0 + (i - 1) * w, y: 30, width: w, height: 6 * 42, fill: "none", stroke: css("--hl2"), "stroke-width": 3.5});
  // szerverek
  [["1. szerver: csak q₁-et látja", 1, st >= 2], ["2. szerver: csak q₂-t látja", 3, st >= 3]].forEach(([t, k, on]) => {
    const y = 32 + k * 42;
    el("rect", {x: 590, y: y + 2, width: 124, height: 78, rx: 8, fill: css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: 652, y: y + 36, "text-anchor": "middle", "font-size": 12}, t.split(": ")[0]);
    el("text", {x: 652, y: y + 54, "text-anchor": "middle", "font-size": 12}, t.split(": ")[1]);
  });
  if (st >= 4) el("text", {x: 360, y: 318, "text-anchor": "middle", "font-size": 17, "font-weight": "bold"},
    "kliens: a₁ ⊕ a₂ = " + d.a1 + " ⊕ " + d.a2 + " = " + d.res + " = x" + i + (d.res === d.x[i - 1] ? "  ✓" : "  ✗"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
