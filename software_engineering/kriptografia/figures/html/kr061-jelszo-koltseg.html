<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline jelszókeresés ideje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:max-content 1fr max-content;gap:4px 10px;align-items:center;margin-bottom:6px}
input[type=range]{width:100%}
select,button{font:inherit}
#status{margin:6px 0;min-height:4.4em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="len">Jelszóhossz</label><input id="len" type="range" min="4" max="16" value="8"><span id="lenv"></span>
  <label for="abc">Ábécéméret</label>
  <select id="abc"><option value="10">10 (számjegyek)</option><option value="26">26 (kisbetűk)</option><option value="62">62 (betű + szám)</option><option value="95" selected>95 (nyomtatható ASCII)</option></select><span></span>
  <label for="spd">Gyors hash (SHA-256 tömörítés/s)</label><input id="spd" type="range" min="2" max="11" step="0.1" value="10"><span id="spdv"></span>
  <label for="it">PBKDF2-iterációszám c</label><input id="it" type="range" min="0" max="7" step="any" value="5.778151"><span id="itv"></span>
</div>
<div><button id="rst">Alapállapot (a 16.2.4 példája)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Log-skálás oszlopdiagram: a jelszótér és a 10^6-os szótár bejárási ideje gyors és lassú hash mellett, referenciavonalakkal (perc, nap, év, 1000 év)."></svg>
<p class="small">Számított nagyságrendek (idő = jelöltek száma / próba/s), a sebességek hardverfüggők, nem mérés. Modell: nyers SHA-256 = 1 tömörítés/próba; PBKDF2-HMAC-SHA256 = 2c tömörítés/próba (előre számolt ipad/opad állapottal). A fejezet a PBKDF2 sebességét 10⁴ próba/s-ra kerekíti.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const YEAR = 365.25 * 86400;
function cm(x, d){ return x.toFixed(d).replace(".", ","); }
function sci(x){ const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e); return (Math.abs(m - 1) < 0.05 ? "" : cm(m, 1) + "·") + "10^" + String(e).replace("-", "−"); }
function human(t){
  if (t < 1e-2) return sci(t) + " s";
  if (t < 600) return cm(t, t < 10 ? 1 : 0) + " s";
  if (t < 3600) return cm(t / 60, 1) + " perc";
  if (t < 86400) return cm(t / 3600, 1) + " óra";
  if (t < YEAR) return cm(t / 86400, 1) + " nap";
  const y = t / YEAR;
  if (y < 1000) return cm(y, 1) + " év";
  if (y < 1e6) return (Math.round(y / 1000) * 1000).toLocaleString("hu-HU") + " év";
  if (y < 1e12) return cm(y / 1e6, 1) + " millió év";
  return sci(y) + " év";
}
const ids = ["len", "abc", "spd", "it"];
function upd(){
  const L = +document.getElementById("len").value, A = +document.getElementById("abc").value;
  const S = Math.pow(10, +document.getElementById("spd").value), c = Math.max(1, Math.round(Math.pow(10, +document.getElementById("it").value)));
  document.getElementById("lenv").textContent = L;
  document.getElementById("spdv").textContent = sci(S) + "/s";
  document.getElementById("itv").textContent = c.toLocaleString("hu-HU");
  const N = Math.pow(A, L), slow = S / (2 * c);
  const bars = [["jelszótér " + A + "^" + L, N], ["10⁶ elemű szótár", 1e6]];
  svg.innerHTML = "";
  const y0 = 260, y1 = 20, lo = -6, hi = 22, Y = v => y0 - (Math.log10(Math.max(v, 1e-6)) - lo) / (hi - lo) * (y0 - y1);
  [[60, "1 perc"], [86400, "1 nap"], [YEAR, "1 év"], [1000 * YEAR, "1000 év"]].forEach(([v, l]) => {
    el("line", {x1: 60, x2: 470, y1: Y(v), y2: Y(v), stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("text", {x: 474, y: Y(v) + 4, "font-size": 12}, l);
  });
  for (let e = lo; e <= hi; e += 4) { el("text", {x: 54, y: Y(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "10^" + String(e).replace("-", "−")); }
  el("line", {x1: 60, x2: 60, y1: y1, y2: y0, stroke: css("--line")}); el("line", {x1: 60, x2: 470, y1: y0, y2: y0, stroke: css("--line")});
  el("text", {x: 14, y: 150, "font-size": 12, transform: "rotate(-90 14 150)", "text-anchor": "middle"}, "idő [s], log");
  bars.forEach(([lab, n], g) => {
    [[S, "gyors", ""], [slow, "PBKDF2", "x"]].forEach(([r, nm, pat], j) => {
      const t = n / r, x = 90 + g * 200 + j * 75, h = y0 - Y(t);
      el("rect", {x, y: Y(t), width: 60, height: Math.max(h, 0), fill: j ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": j ? "5 3" : ""});
      el("text", {x: x + 30, y: Y(t) - 6, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, human(t));
      el("text", {x: x + 30, y: y0 + 16, "text-anchor": "middle", "font-size": 11}, nm);
    });
    el("text", {x: 90 + g * 200 + 67, y: y0 + 32, "text-anchor": "middle", "font-size": 12}, lab);
  });
  const ts = N / slow, tf = N / S;
  let msg = `${A}^${L} = ${sci(N)} jelölt. Gyors hash: ${sci(N)} / ${sci(S)}/s = ${sci(tf)} s ≈ ${human(tf)}. ` +
            `PBKDF2 (c = ${c.toLocaleString("hu-HU")}): ${sci(S)} / (2c) = ${sci(slow)} próba/s → ${sci(ts)} s ≈ ${human(ts)}; ` +
            `10⁶-os szótár: ${human(1e6 / slow)}.`;
  if (L === 8 && A === 95 && Math.abs(Math.log10(S) - 10) < 1e-9 && c === 600000)
    msg += " A fejezet kerekítésével (10⁴ próba/s): 95^8 / 10^4 = 6,6·10^11 s ≈ 21 000 év, a szótár 100 s.";
  document.getElementById("status").textContent = msg;
}
ids.forEach(i => document.getElementById(i).addEventListener("input", upd));
document.getElementById("rst").onclick = () => { document.getElementById("len").value = 8; document.getElementById("abc").value = 95; document.getElementById("spd").value = 10; document.getElementById("it").value = Math.log10(600000); upd(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
document.getElementById("it").value = Math.log10(600000);
upd();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
