<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElGamal-homomorfia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>m₁ <select id="m1" aria-label="m₁"><option value="1">1 = 2^0</option><option value="2" selected>2 = 2^1</option><option value="4">4 = 2^2</option><option value="8">8 = 2^3</option><option value="16">16 = 2^4</option><option value="9">9 = 2^5</option><option value="18">18 = 2^6</option><option value="13">13 = 2^7</option><option value="3">3 = 2^8</option><option value="6">6 = 2^9</option><option value="12">12 = 2^10</option></select></label><label>y₁ <select id="y1" aria-label="y₁"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><label>m₂ <select id="m2" aria-label="m₂"><option value="1">1 = 2^0</option><option value="2">2 = 2^1</option><option value="4" selected>4 = 2^2</option><option value="8">8 = 2^3</option><option value="16">16 = 2^4</option><option value="9">9 = 2^5</option><option value="18">18 = 2^6</option><option value="13">13 = 2^7</option><option value="3">3 = 2^8</option><option value="6">6 = 2^9</option><option value="12">12 = 2^10</option></select></label><label>y₂ <select id="y2" aria-label="y₂"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label><button onclick="loadE()">Számol</button><button onclick="vote()">Szavazat-átfordítás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 2 által generált 11 elemű részcsoport körön; (8, 12)·(9, 18) = (3, 9), visszafejtve 8 = 2·4."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 23, q = 11, g = 2, x = 3, h = 8. A szorzás a kitevők összeadása mod 11. Oktatási célra – NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 1, "marks": [[1, "o", "m₁"], [9, "^", "h^y₁"], [10, "s", "c₂"]], "arrows": [[1, 10, "+9"]], "tab": [["8", "12", "2"], null, null], "msg": "1. titkosítás: m₁ = 2 = 2^1, y₁ = 3: c₁ = g^y₁ = 8, h^y₁ = 6, c₂ = 2·6 mod 23 = 12 → (8, 12)", "line": 0}, {"st": 2, "marks": [[2, "o", "m₂"], [4, "^", "h^y₂"], [6, "s", "c₂′"]], "arrows": [[2, 6, "+4"]], "tab": [["8", "12", "2"], ["9", "18", "4"], null], "msg": "2. titkosítás: m₂ = 4 = 2^2, y₂ = 5: c₁′ = 9, h^y₂ = 16, c₂′ = 4·16 mod 23 = 18 → (9, 18)", "line": 1}, {"st": 3, "marks": [[10, "s", "c₂"], [6, "s", "c₂′"], [5, "s", "c₂c₂′"]], "arrows": [[10, 5, "+6"]], "tab": [["8", "12", "2"], ["9", "18", "4"], ["3", "9", "?"]], "msg": "3. szorzás komponensenként: (8·9, 12·18) mod 23 = (3, 9); kitevőkben 10 + 6 ≡ 5 (mod 11)", "line": 2}, {"st": 4, "marks": [[5, "s", "c₂c₂′"], [2, "^", "c₁^x"], [3, "o", "m"]], "arrows": [[5, 3, "−2"]], "tab": [["8", "12", "2"], ["9", "18", "4"], ["3", "9", "8"]], "msg": "4. visszafejtés: c₁^x = 3^3 mod 23 = 4, 4^−1 = 6, m = 9·6 mod 23 = 8 = 2·4 mod 23", "line": 3}];
const CODE = ["c1, c2 = pow(g, y1, p), m1 * pow(h, y1, p) % p        # 1. titkosítás", "d1, d2 = pow(g, y2, p), m2 * pow(h, y2, p) % p        # 2. titkosítás", "e1, e2 = c1 * d1 % p, c2 * d2 % p                     # szorzás", "s = pow(e1, x, p); m = e2 * pow(s, -1, p) % p          # visszafejtés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

const P = 23, Q = 11, G = 2, X = 3, H = 8, ELEM = [1, 2, 4, 8, 16, 9, 18, 13, 3, 6, 12];
const LOG = {}; ELEM.forEach((v, k) => LOG[v] = k);
function cp(k, r){ const a = Math.PI / 2 - 2 * Math.PI * k / Q; return [170 + r * Math.cos(a), 160 - r * Math.sin(a)]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 320");
  svg.innerHTML = "";
  el("circle", {cx: 170, cy: 160, r: 110, fill: "none", stroke: css("--muted")});
  ELEM.forEach((v, k) => { const [x, y] = cp(k, 110), [lx, ly] = cp(k, 135);
    el("circle", {cx: x, cy: y, r: 3, fill: css("--line")});
    el("text", {x: lx, y: ly + 4, "text-anchor": "middle", "font-size": 12}, v + " (2^" + k + ")"); });
  s.arrows.forEach(([a, b, lab]) => { const [x0, y0] = cp(a, 100), [x1, y1] = cp(b, 100), [mx, my] = cp((a + b) / 2 + (Math.abs(b - a) > 5.5 ? 5.5 : 0), 40);
    el("path", {d: `M${x0},${y0} Q${mx},${my} ${x1},${y1}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
    el("circle", {cx: x1, cy: y1, r: 5, fill: css("--hl")});
    el("text", {x: mx, y: my, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: css("--hl")}, lab + " (kitevő)"); });
  s.marks.forEach(([k, sh, lab], j) => { const [x, y] = cp(k, 110), [ix, iy] = cp(k, 82 - 12 * (j % 2));
    if (sh === "o") el("circle", {cx: x, cy: y, r: 8, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.6});
    else if (sh === "^") el("polygon", {points: `${x},${y - 9} ${x - 8},${y + 6} ${x + 8},${y + 6}`, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.6});
    else el("rect", {x: x - 7, y: y - 7, width: 14, height: 14, fill: css("--line")});
    el("text", {x: ix, y: iy + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, lab); });
  const hd = ["", "c₁", "c₂", "m"], names = ["1. rejtett", "2. rejtett", "szorzat"];
  hd.forEach((t, j) => el("text", {x: 350 + [0, 90, 135, 180][j], y: 60, "font-size": 12, "font-weight": "bold"}, t));
  s.tab.forEach((r, i) => { if (!r) return; el("text", {x: 350, y: 85 + i * 24, "font-size": 12}, names[i]);
    r.forEach((v, j) => el("text", {x: 440 + j * 45, y: 85 + i * 24, "font-size": 13}, v)); });
  el("text", {x: 350, y: 180, "font-size": 11, fill: css("--muted")}, "○ üzenet  △ maszk  ■ rejtett/eredmény");
  el("text", {x: 350, y: 198, "font-size": 11, fill: css("--muted")}, "szorzás = kitevők összeadása mod 11");
  if (s.vote) el("text", {x: 350, y: 230, "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, s.vote);
}
function enc(m, y){ return [powm(G, y, P), m * powm(H, y, P) % P]; }
function gen(m1, y1, m2, y2){
  const a = enc(m1, y1), b = enc(m2, y2), c = [a[0] * b[0] % P, a[1] * b[1] % P], s = powm(c[0], X, P), si = invm(s, P), m = c[1] * si % P, L = LOG;
  return [
    {st: 1, line: 0, marks: [[L[m1], "o", "m₁"], [L[powm(H, y1, P)], "^", "h^y₁"], [L[a[1]], "s", "c₂"]], arrows: [[L[m1], L[a[1]], "+" + (X * y1 % Q)]], tab: [[String(a[0]), String(a[1]), String(m1)], null, null],
     msg: "1. titkosítás: m₁ = " + m1 + " = 2^" + L[m1] + ", y₁ = " + y1 + ": c₁ = g^y₁ = " + a[0] + ", h^y₁ = " + powm(H, y1, P) + ", c₂ = " + m1 + "·" + powm(H, y1, P) + " mod 23 = " + a[1] + " → (" + a[0] + ", " + a[1] + ")"},
    {st: 2, line: 1, marks: [[L[m2], "o", "m₂"], [L[powm(H, y2, P)], "^", "h^y₂"], [L[b[1]], "s", "c₂′"]], arrows: [[L[m2], L[b[1]], "+" + (X * y2 % Q)]], tab: [[String(a[0]), String(a[1]), String(m1)], [String(b[0]), String(b[1]), String(m2)], null],
     msg: "2. titkosítás: m₂ = " + m2 + " = 2^" + L[m2] + ", y₂ = " + y2 + ": c₁′ = " + b[0] + ", h^y₂ = " + powm(H, y2, P) + ", c₂′ = " + m2 + "·" + powm(H, y2, P) + " mod 23 = " + b[1] + " → (" + b[0] + ", " + b[1] + ")"},
    {st: 3, line: 2, marks: [[L[a[1]], "s", "c₂"], [L[b[1]], "s", "c₂′"], [L[c[1]], "s", "c₂c₂′"]], arrows: [[L[a[1]], L[c[1]], "+" + L[b[1]]]], tab: [[String(a[0]), String(a[1]), String(m1)], [String(b[0]), String(b[1]), String(m2)], [String(c[0]), String(c[1]), "?"]],
     msg: "3. szorzás komponensenként: (" + a[0] + "·" + b[0] + ", " + a[1] + "·" + b[1] + ") mod 23 = (" + c[0] + ", " + c[1] + "); kitevőkben " + L[a[1]] + " + " + L[b[1]] + " ≡ " + L[c[1]] + " (mod 11)"},
    {st: 4, line: 3, marks: [[L[c[1]], "s", "c₂c₂′"], [L[s], "^", "c₁^x"], [L[m], "o", "m"]], arrows: [[L[c[1]], L[m], "−" + L[s]]], tab: [[String(a[0]), String(a[1]), String(m1)], [String(b[0]), String(b[1]), String(m2)], [String(c[0]), String(c[1]), String(m)]],
     msg: "4. visszafejtés: c₁^x = " + c[0] + "^3 mod 23 = " + s + ", " + s + "^−1 = " + si + ", m = " + c[1] + "·" + si + " mod 23 = " + m + " = " + m1 + "·" + m2 + " mod 23"},
  ];
}
function loadE(){
  const v = ["m1", "y1", "m2", "y2"].map(id => Number(document.getElementById(id).value));
  setSteps(gen(v[0], v[1], v[2], v[3]));
}
function vote(){
  const y = Number(document.getElementById("y1").value), a = enc(G, y), gi = invm(G, P), f = [a[0], a[1] * gi % P], s = powm(f[0], X, P), m = f[1] * invm(s, P) % P, L = LOG;
  setSteps([
    {st: 1, line: 0, marks: [[L[G], "o", "„nem” = g"], [L[a[1]], "s", "c₂"]], arrows: [[L[G], L[a[1]], "+" + (X * y % Q)]], tab: [[String(a[0]), String(a[1]), "2 (nem)"], null, null],
     vote: "Szavazat: „nem” = g = 2", msg: "Elfogott szavazat: m = g = 2 („nem”), y = " + y + " → (" + a[0] + ", " + a[1] + ")"},
    {st: 3, line: 2, marks: [[L[a[1]], "s", "c₂"], [L[f[1]], "s", "c₂·g⁻¹"]], arrows: [[L[a[1]], L[f[1]], "−1"]], tab: [[String(a[0]), String(a[1]), "2 (nem)"], null, [String(f[0]), String(f[1]), "?"]],
     vote: "Támadó: c₂ · g⁻¹ = c₂ · " + gi + " (kulcs nélkül!)", msg: "Átfordítás: (c₁, c₂·g⁻¹) = (" + f[0] + ", " + a[1] + "·" + gi + " mod 23) = (" + f[0] + ", " + f[1] + ")"},
    {st: 4, line: 3, marks: [[L[f[1]], "s", "c₂·g⁻¹"], [L[m], "o", "m = 1"]], arrows: [[L[f[1]], L[m], "−" + L[s]]], tab: [[String(a[0]), String(a[1]), "2 (nem)"], null, [String(f[0]), String(f[1]), String(m) + " (igen)"]],
     vote: "Eredmény: „igen” – AEAD nélkül észrevétlen", msg: "Visszafejtés: c₁^x = " + s + ", m = " + f[1] + "·" + invm(s, P) + " mod 23 = " + m + " → „igen” (a malleabilitás miatt)"},
  ]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
