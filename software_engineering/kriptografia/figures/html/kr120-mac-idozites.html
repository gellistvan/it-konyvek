<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bájtonkénti MAC-kitalálás időzítéssel (modell)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--bad:#b00020;--ok:#2e6b30}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}

.small{font-size:12px;color:var(--muted)}
.err{color:var(--bad)}
</style>

function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function matched(g){let n=0;for(let i=0;i<4;i++){if(g[i]!==SECRET[i])break;n++;}return n;}
function resample(){
  const s=+document.getElementById("sg").value, N=NV[+document.getElementById("nn").value];
  const out=[]; let prefix=[];
  for(let pos=0;pos<4;pos++){
    const m=[]; for(let b=0;b<256;b++){const g=prefix.concat([b],[0,0,0,0].slice(0,3-pos)); m.push(100+8*matched(g)+gauss()*s/Math.sqrt(N));}
    let best=0; for(let b=1;b<256;b++) if(m[b]>m[best]) best=b;
    out.push({pos:pos,prefix:prefix.slice(),m:m,best:best}); prefix=prefix.concat([best]);
  }
  STEPS=out; draw();
}
function hx(b){return "0x"+b.toString(16).padStart(2,"0");}
function draw(){
  const st=STEPS[k], m=st.m;
  svg.innerHTML="";
  let lo=Math.min(95,...m), hi=Math.max(...m); const H=230, y0=290;

  for(let b=0;b<256;b++){ const x=40+b*2.3;
    el("rect",{x:x,y:sc(m[b]),width:2.1,height:y0-sc(m[b]),fill:b===st.best?css("--hl"):css("--muted")}); }

  el("rect",{x:xb-3,y:sc(m[st.best]),width:8,height:y0-sc(m[st.best]),fill:"none",stroke:css("--line"),"stroke-width":1.5});

  el("path",{d:`M${xt} ${y0+6} l-5 9 l10 0 z`,fill:css("--fg")});
  el("text",{x:xt,y:y0+30,"text-anchor":"middle","font-size":12},"helyes "+hx(SECRET[st.pos]));
  el("line",{x1:38,y1:y0,x2:632,y2:y0,stroke:css("--line")});
  [lo,hi].forEach(v=>el("text",{x:34,y:sc(v)+4,"text-anchor":"end","font-size":11},v.toFixed(0)));
  el("text",{x:12,y:40,"font-size":11,fill:css("--muted")},"ns");
  // prefix-dobozok
  for(let i=0;i<4;i++){ const known=i<st.pos;
    el("rect",{x:440+i*46,y:8,width:42,height:28,fill:known?css("--cell"):css("--cellhl"),stroke:css("--line"),"stroke-dasharray":known?"":"3 3"});
    el("text",{x:461+i*46,y:27,"text-anchor":"middle","font-size":14,"font-family":"ui-monospace,monospace"},known?st.prefix[i].toString(16).padStart(2,"0"):"??"); }
  el("text",{x:432,y:27,"text-anchor":"end","font-size":13},"ismert prefix:");
  const srt=m.map((v,b)=>[v,b]).sort((a,b)=>b[0]-a[0]);
  const ok=st.best===SECRET[st.pos] && st.prefix.every((v,i)=>v===SECRET[i]);
  document.getElementById("status").textContent=`pozíció ${st.pos+1}: legjobb jelölt ${hx(srt[0][1])}, átlag ${srt[0][0].toFixed(1).replace(".",",")} ns, második ${srt[1][0].toFixed(1).replace(".",",")} ns`+(ok?" – helyes":" – HIBÁS választás")+` (σ = ${document.getElementById("sg").value} ns, N = ${NV[+document.getElementById("nn").value]})`;
  hiCode(k<3?2:4);
}

document.getElementById("next").onclick=()=>{k=Math.min(3,k+1);draw();};
document.getElementById("rs").onclick=resample;
document.getElementById("sg").oninput=()=>{document.getElementById("sgv").textContent=document.getElementById("sg").value+" ns";resample();};
document.getElementById("nn").oninput=()=>{document.getElementById("nnv").textContent=NV[+document.getElementById("nn").value];resample();};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){k=Math.min(3,k+1);draw();}if(e.key==="ArrowLeft"){k=Math.max(0,k-1);draw();}});
