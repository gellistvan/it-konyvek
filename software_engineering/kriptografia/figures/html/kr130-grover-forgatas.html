<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grover-iteráció mint forgatás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n (N = 2ⁿ): <input id="n" type="range" min="2" max="10" value="6" aria-label="n"><span id="nv">6</span></label>
<label>M: <input id="M" type="number" min="1" max="8" value="1"></label>
<script>
function regen(){ const n = +document.getElementById("n").value; let M = Math.max(1, Math.round(+document.getElementById("M").value || 1));
  M = Math.min(M, 2 ** n - 1); document.getElementById("M").value = M; document.getElementById("nv").textContent = n; setSteps(stepsFor(n, M)); }
document.getElementById("n").oninput = regen; document.getElementById("M").onchange = regen;
window.addEventListener("load", () => { document.body.dataset.selftest = JSON.stringify(stepsFor(6, 1).map(x => x.msg)) === JSON.stringify(STEPS.map(x => x.msg)) ? "ok" : "mismatch"; });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egységkörön az állapotvektor 7,2°-ról 2θ lépésekkel közelít a |β⟩ tengelyhez; a görbe a 6. lépésnél csúcsosodik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított érték, nem mérés. Egy iteráció két féllépés: U_f (szaggatott), majd D. Túl sok iteráció után a sikervalószínűség újra csökken.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "t = 0: |s⟩, szög = θ ≈ 7,2°, P(siker) = 0,016 (N = 64, M = 1, optimális T = 6)", "line": 0, "t": 0, "ang": 0.1253278311680654, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 1, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −7,2°", "line": 1, "t": 1, "ang": -0.1253278311680654, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 1: szög = 3θ ≈ 21,5°, P(siker) = 0,135", "line": 2, "t": 1, "ang": 0.3759834935041962, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 2, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −21,5°", "line": 1, "t": 2, "ang": -0.3759834935041962, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 2: szög = 5θ ≈ 35,9°, P(siker) = 0,344", "line": 2, "t": 2, "ang": 0.626639155840327, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 3, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −35,9°", "line": 1, "t": 3, "ang": -0.626639155840327, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 3: szög = 7θ ≈ 50,3°, P(siker) = 0,591", "line": 2, "t": 3, "ang": 0.8772948181764578, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 4, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −50,3°", "line": 1, "t": 4, "ang": -0.8772948181764578, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 4: szög = 9θ ≈ 64,6°, P(siker) = 0,816", "line": 2, "t": 4, "ang": 1.1279504805125886, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 5, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −64,6°", "line": 1, "t": 5, "ang": -1.1279504805125886, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 5: szög = 11θ ≈ 79,0°, P(siker) = 0,964", "line": 2, "t": 5, "ang": 1.3786061428487195, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 6, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −79,0°", "line": 1, "t": 6, "ang": -1.3786061428487195, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 6: szög = 13θ ≈ 93,3°, P(siker) = 0,997 ← optimum", "line": 2, "t": 6, "ang": 1.6292618051848504, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 7, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −93,3°", "line": 1, "t": 7, "ang": -1.6292618051848504, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 7: szög = 15θ ≈ 107,7°, P(siker) = 0,907 (túl sok iteráció, csökken)", "line": 2, "t": 7, "ang": 1.8799174675209813, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 8, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −107,7°", "line": 1, "t": 8, "ang": -1.8799174675209813, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 8: szög = 17θ ≈ 122,1°, P(siker) = 0,718 (túl sok iteráció, csökken)", "line": 2, "t": 8, "ang": 2.1305731298571122, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 9, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −122,1°", "line": 1, "t": 9, "ang": -2.1305731298571122, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 9: szög = 19θ ≈ 136,4°, P(siker) = 0,475 (túl sok iteráció, csökken)", "line": 2, "t": 9, "ang": 2.381228792193243, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 10, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −136,4°", "line": 1, "t": 10, "ang": -2.381228792193243, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 10: szög = 21θ ≈ 150,8°, P(siker) = 0,238 (túl sok iteráció, csökken)", "line": 2, "t": 10, "ang": 2.631884454529374, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 11, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −150,8°", "line": 1, "t": 11, "ang": -2.631884454529374, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 11: szög = 23θ ≈ 165,2°, P(siker) = 0,066 (túl sok iteráció, csökken)", "line": 2, "t": 11, "ang": 2.882540116865505, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 12, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ −165,2°", "line": 1, "t": 12, "ang": -2.882540116865505, "th": 0.1253278311680654, "T": 6, "N": 64}, {"msg": "t = 12: szög = 25θ ≈ 179,5°, P(siker) = 0,000 (túl sok iteráció, csökken)", "line": 2, "t": 12, "ang": 3.133195779201636, "th": 0.1253278311680654, "T": 6, "N": 64}];
const CODE = ["|ψ⟩ ← |s⟩ = H^⊗n|0…0⟩                 (szög: θ, sin θ = √(M/N))", "ismételd T-szer:  |ψ⟩ ← U_f|ψ⟩         (tükrözés az |α⟩ tengelyre)", "                  |ψ⟩ ← D|ψ⟩           (tükrözés |s⟩-re → összesen +2θ)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(x, d){ return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function deg(a){ return a * 180 / Math.PI; }
function stepsFor(n, M){
  const N = 2 ** n, th = Math.asin(Math.sqrt(M / N)), T = Math.floor(Math.PI / 4 * Math.sqrt(N / M)), tmax = Math.max(2 * T, 2);
  const out = [{msg: `t = 0: |s⟩, szög = θ ≈ ${hu(deg(th), 1)}°, P(siker) = ${hu(Math.sin(th) ** 2, 3)} (N = ${N}, M = ${M}, optimális T = ${T})`, line: 0, t: 0, ang: th, th: th, T: T, N: N}];
  let phi = th;
  for (let t = 1; t <= tmax; t++) {
    out.push({msg: `t = ${t}, 1. fél: U_f tükröz az |α⟩ tengelyre → szög ≈ ${hu(-deg(phi), 1)}°`, line: 1, t: t, ang: -phi, th: th, T: T, N: N});
    phi = phi + 2 * th; const k2 = 2 * t + 1, p = Math.sin(phi) ** 2;
    out.push({msg: `t = ${t}: szög = ${k2}θ ≈ ${hu(deg(phi), 1)}°, P(siker) = ${hu(p, 3)}` +
      (t === T ? " ← optimum" : (t > T && p < Math.sin(phi - 2 * th) ** 2 ? " (túl sok iteráció, csökken)" : "")), line: 2, t: t, ang: phi, th: th, T: T, N: N});
  }
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330"); svg.innerHTML = "";
  const cx = 60, cy = 250, R = 190;
  el("path", {d: `M ${cx + R} ${cy} A ${R} ${R} 0 0 0 ${cx} ${cy - R}`, fill: "none", stroke: css("--muted")});
  el("line", {x1: cx - 20, y1: cy, x2: cx + R + 25, y2: cy, stroke: css("--line")});
  el("line", {x1: cx, y1: cy + 60, x2: cx, y2: cy - R - 25, stroke: css("--line")});
  el("text", {x: cx + R + 28, y: cy + 5, "font-size": 14}, "|α⟩"); el("text", {x: cx + 6, y: cy - R - 12, "font-size": 14}, "|β⟩");
  const sx = cx + R * Math.cos(s.th), sy = cy - R * Math.sin(s.th);
  el("line", {x1: cx, y1: cy, x2: sx, y2: sy, stroke: css("--muted"), "stroke-dasharray": "2 3"});
  el("text", {x: sx + 6, y: sy + 4, "font-size": 12, fill: css("--muted")}, "|s⟩");
  const ex = cx + R * Math.cos(s.ang), ey = cy - R * Math.sin(s.ang), half = s.line === 1;
  el("line", {x1: cx, y1: cy, x2: ex, y2: ey, stroke: css("--hl"), "stroke-width": 3, "stroke-dasharray": half ? "8 5" : "none"});
  el("circle", {cx: ex, cy: ey, r: 5, fill: css("--hl")});
  el("text", {x: ex + 8, y: ey - 6, "font-size": 13, "font-weight": "bold"}, half ? "U_f|ψ⟩" : `|ψ${s.t}⟩`);
  // jobb: P(t) görbe
  const px = 330, pw = 310, py = 280, ph = 230, tm = STEPS[STEPS.length - 1].t;
  el("line", {x1: px, y1: py, x2: px + pw, y2: py, stroke: css("--line")}); el("line", {x1: px, y1: py, x2: px, y2: py - ph, stroke: css("--line")});
  el("text", {x: px + pw / 2, y: py + 34, "text-anchor": "middle", "font-size": 12}, "iterációk száma t");
  el("text", {x: px - 6, y: py - ph + 4, "text-anchor": "end", "font-size": 11}, "1"); el("text", {x: px - 6, y: py + 4, "text-anchor": "end", "font-size": 11}, "0");
  let d = "";
  for (let t = 0; t <= tm; t++) { const x = px + t / tm * pw, y = py - Math.sin((2 * t + 1) * s.th) ** 2 * ph; d += (t ? " L " : "M ") + x + " " + y;
    el("circle", {cx: x, cy: y, r: tm > 30 ? 1.5 : 3, fill: t === s.T ? css("--fg") : css("--bg"), stroke: css("--fg")}); }
  el("path", {d: d, fill: "none", stroke: css("--fg")});
  const cxp = px + s.t / tm * pw; el("line", {x1: cxp, y1: py, x2: cxp, y2: py - ph, stroke: css("--hl2"), "stroke-dasharray": "4 3"});
  el("text", {x: cxp, y: py + 16, "text-anchor": "middle", "font-size": 11}, `t = ${s.t}`);
  el("text", {x: px + 4, y: 34, "font-size": 12, fill: css("--muted")}, `N = ${s.N}, optimum T = ${s.T} (telt kör)`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
