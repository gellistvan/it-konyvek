<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétkörös Feistel megkülönböztetése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>f0 (00,01,10,11 →): <input id="t0" value="01 10 11 00" size="11" aria-label="f0 tábla"></label><label>f1: <input id="t1" value="10 00 01 11" size="11" aria-label="f1 tábla"></label><label>1. bemenet L R: <input id="ina" value="00 01" size="5" aria-label="1. bemenet"></label><label>2. bemenet: <input id="inb" value="11 01" size="5" aria-label="2. bemenet"></label><label><input id="r3" type="checkbox"> 3. kör hozzáadása (véletlen f2)</label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két Feistel-adatút 00|01 és 11|01 bemenettel; a kimenetek 10|00 és 01|01; a bal felek XOR-ja mindkét oldalon 11."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a 18.2 tesztvektoraival (n = 2). A 3. kör f2 táblája a böngészőben véletlenül sorsolt (csak szemléltetés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 0, "A": {"L0": 0, "R0": 1, "fa": 2, "R1": 2, "L1": 1, "fb": 1, "R2": 0, "L2": 2}, "B": {"L0": 3, "R0": 1, "fa": 2, "R1": 1, "L1": 1, "fb": 0, "R2": 1, "L2": 1}, "msg": "Bemenetek: (00, 01) és (11, 01); ΔL0 = 11, ΔR0 = 00"}, {"k": 1, "line": 2, "A": {"L0": 0, "R0": 1, "fa": 2, "R1": 2, "L1": 1, "fb": 1, "R2": 0, "L2": 2}, "B": {"L0": 3, "R0": 1, "fa": 2, "R1": 1, "L1": 1, "fb": 0, "R2": 1, "L2": 1}, "msg": "1. kör, f0: f0(01) = 10 és f0(01) = 10 – azonos jobb félre azonos érték"}, {"k": 2, "line": 3, "A": {"L0": 0, "R0": 1, "fa": 2, "R1": 2, "L1": 1, "fb": 1, "R2": 0, "L2": 2}, "B": {"L0": 3, "R0": 1, "fa": 2, "R1": 1, "L1": 1, "fb": 0, "R2": 1, "L2": 1}, "msg": "1. kör, XOR és csere: R1 = 10, R1' = 01 (ΔR1 = 11); L1 = L1' = 01"}, {"k": 3, "line": 5, "A": {"L0": 0, "R0": 1, "fa": 2, "R1": 2, "L1": 1, "fb": 1, "R2": 0, "L2": 2}, "B": {"L0": 3, "R0": 1, "fa": 2, "R1": 1, "L1": 1, "fb": 0, "R2": 1, "L2": 1}, "msg": "2. kör: R2 = 01 ⊕ f1(10) = 00, R2' = 01 ⊕ f1(01) = 01; L2 = 10, L2' = 01"}, {"k": 4, "line": 9, "A": {"L0": 0, "R0": 1, "fa": 2, "R1": 2, "L1": 1, "fb": 1, "R2": 0, "L2": 2}, "B": {"L0": 3, "R0": 1, "fa": 2, "R1": 1, "L1": 1, "fb": 0, "R2": 1, "L2": 1}, "msg": "Reláció: L2 ⊕ L2' = 11 = 11 = L0 ⊕ L0' – teljesül; kimenetek (10, 00) és (01, 01)"}];
const CODE = ["def feistel2(L, R):", "    # 1. kör", "    R1 = L ^ f0(R)", "    L1 = R", "    # 2. kör", "    R2 = L1 ^ f1(R1)", "    L2 = R1", "    return L2, R2", "# (3. kör, ha be van kapcsolva:  R3 = L2 ^ f2(R2);  L3 = R2)", "assert (L2 ^ L2_) == (L0 ^ L0_)    # a megkülönböztető relációja"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function b2(x){ return x.toString(2).padStart(2, "0"); }
function bx(x, y, t, thick, dash){ el("rect", {x: x - 42, y: y - 14, width: 84, height: 28, fill: css("--cell"), stroke: css("--line"), "stroke-width": thick ? 3 : 1.2, "stroke-dasharray": dash ? "5 3" : ""}); el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, t); }
function ln(x1, y1, x2, y2, w){ el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": w || 1.3}); }
function col(xl, p, s, kk, r3){
  const xr = xl + 130, xm = xl + 65;
  bx(xl, 30, "L0" + s + " = " + b2(p.L0), false, true); bx(xr, 30, "R0" + s + " = " + b2(p.R0), true, false);
  const rounds = [[1, 2, "f0", p.fa, p.R0, p.L0, p.R1, p.L1, 44], [3, 3, "f1", p.fb, p.R1, p.L1, p.R2, p.L2, 164]];
  if (r3) rounds.push([5, 6, "f2", p.fc, p.R2, p.L2, p.R3, p.L3, 284]);
  rounds.forEach(([need, outNeed, fn, fv, rin, lin, rout, lout, y0], i) => {
    if (kk < need) return;
    const yf = y0 + 28;
    ln(xl, y0 + 14, xl, yf - 9); ln(xr, y0 + 14, xr, yf + 30); ln(xr, yf, xm + 22, yf); ln(xm - 22, yf, xl + 9, yf);
    el("rect", {x: xm - 22, y: yf - 12, width: 44, height: 24, rx: 4, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: xm, y: yf + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, fn);
    el("text", {x: xm, y: yf - 16, "text-anchor": "middle", "font-size": 11}, fn + "(" + b2(rin) + ") = " + b2(fv));
    el("circle", {cx: xl, cy: yf, r: 9, fill: css("--cell"), stroke: css("--line")}); el("text", {x: xl, y: yf + 5, "text-anchor": "middle", "font-size": 14}, "⊕");
    if (kk >= outNeed) {
      ln(xl, yf + 9, xl, yf + 30); ln(xl, yf + 30, xr, yf + 62); ln(xr, yf + 30, xl, yf + 62, 3);
      bx(xl, yf + 76, "L" + (i + 1) + s + " = " + b2(lout), i === 0, i > 0); bx(xr, yf + 76, "R" + (i + 1) + s + " = " + b2(rout), false, false);
    }
  });
}
function render(s){
  const r3 = !!s.A.R3 || s.A.R3 === 0;
  svg.setAttribute("viewBox", r3 ? "0 0 560 455" : "0 0 560 335");
  svg.innerHTML = "";
  col(55, s.A, "", s.k, r3);
  col(365, s.B, "'", s.k, r3);
  const d = (a, b) => b2(a ^ b);
  el("text", {x: 275, y: 18, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "különbség");
  el("text", {x: 275, y: 35, "text-anchor": "middle", "font-size": 12}, "ΔL0 = " + d(s.A.L0, s.B.L0));
  if (s.k >= 2) el("text", {x: 275, y: 153, "text-anchor": "middle", "font-size": 12}, "ΔR1 = " + d(s.A.R1, s.B.R1));
  if (s.k >= 3) el("text", {x: 275, y: 273, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "ΔL2 = " + d(s.A.L2, s.B.L2));
  if (r3 && s.k >= 6) el("text", {x: 275, y: 393, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "ΔL3 = " + d(s.A.L3, s.B.L3));
  if (s.k === 4 || s.k >= 7) {
    const ok = s.k >= 7 ? s.ok3 : ((s.A.L2 ^ s.B.L2) === (s.A.L0 ^ s.B.L0));
    el("rect", {x: 195, y: r3 ? 414 : 294, width: 160, height: 32, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, rx: 6, "stroke-dasharray": "6 3"});
    el("text", {x: 275, y: r3 ? 435 : 315, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, ok ? "reláció teljesül" : "reláció NEM teljesül");
  }
}
function pathT(t0, t1, t2, L, R){
  const a = t0[R], R1 = L ^ a, L1 = R, bb = t1[R1], R2 = L1 ^ bb, L2 = R1, p = {L0: L, R0: R, fa: a, R1, L1, fb: bb, R2, L2};
  if (t2) { p.fc = t2[R2]; p.R3 = L2 ^ p.fc; p.L3 = R2; }
  return p;
}
function stepsFor(t0, t1, ins, t2){
  const a = pathT(t0, t1, t2, ...ins[0]), b = pathT(t0, t1, t2, ...ins[1]), rel = [a.L2 ^ b.L2, ins[0][0] ^ ins[1][0]];
  const st = [
    {k: 0, line: 0, A: a, B: b, msg: `Bemenetek: (${b2(ins[0][0])}, ${b2(ins[0][1])}) és (${b2(ins[1][0])}, ${b2(ins[1][1])}); ΔL0 = ${b2(rel[1])}, ΔR0 = ${b2(ins[0][1] ^ ins[1][1])}`},
    {k: 1, line: 2, A: a, B: b, msg: `1. kör, f0: f0(${b2(a.R0)}) = ${b2(a.fa)} és f0(${b2(b.R0)}) = ${b2(b.fa)}` + (a.R0 === b.R0 ? " – azonos jobb félre azonos érték" : "")},
    {k: 2, line: 3, A: a, B: b, msg: a.L1 === b.L1 ? `1. kör, XOR és csere: R1 = ${b2(a.R1)}, R1' = ${b2(b.R1)} (ΔR1 = ${b2(a.R1 ^ b.R1)}); L1 = L1' = ${b2(a.L1)}` : `1. kör, XOR és csere: R1 = ${b2(a.R1)}, R1' = ${b2(b.R1)}; L1 = ${b2(a.L1)}, L1' = ${b2(b.L1)}`},
    {k: 3, line: 5, A: a, B: b, msg: `2. kör: R2 = ${b2(a.L1)} ⊕ f1(${b2(a.R1)}) = ${b2(a.R2)}, R2' = ${b2(b.L1)} ⊕ f1(${b2(b.R1)}) = ${b2(b.R2)}; L2 = ${b2(a.L2)}, L2' = ${b2(b.L2)}`},
    {k: 4, line: 9, A: a, B: b, msg: `Reláció: L2 ⊕ L2' = ${b2(rel[0])} ${rel[0] === rel[1] ? "=" : "≠"} ${b2(rel[1])} = L0 ⊕ L0' – ${rel[0] === rel[1] ? "teljesül" : "nem teljesül"}; kimenetek (${b2(a.L2)}, ${b2(a.R2)}) és (${b2(b.L2)}, ${b2(b.R2)})`}];
  if (t2) {
    const ok = (a.L3 ^ b.L3) === rel[1];
    st.push({k: 5, line: 8, A: a, B: b, msg: `3. kör (véletlen f2 = [${t2.map(b2).join(", ")}]): f2(${b2(a.R2)}) = ${b2(a.fc)}, f2(${b2(b.R2)}) = ${b2(b.fc)}`});
    st.push({k: 6, line: 8, A: a, B: b, msg: `3. kör után: (L3, R3) = (${b2(a.L3)}, ${b2(a.R3)}), (L3', R3') = (${b2(b.L3)}, ${b2(b.R3)})`});
    st.push({k: 7, line: 9, A: a, B: b, ok3: ok, msg: `Reláció 3 körrel: L3 ⊕ L3' = ${b2(a.L3 ^ b.L3)} ${ok ? "=" : "≠"} ${b2(rel[1])} = L0 ⊕ L0' – ${ok ? "teljesül (itt véletlenül)" : "nem teljesül"}; L3 ⊕ L3' = R2 ⊕ R2', ami f1-től függ`});
  }
  return st;
}
function parseTab(id){ const v = document.getElementById(id).value.split(/[ ,;]+/).filter(x => x).map(x => parseInt(x, 2)); return v.length === 4 && v.every(x => x >= 0 && x <= 3) ? v : null; }
function load(){
  const t0 = parseTab("t0"), t1 = parseTab("t1"), e = document.getElementById("err");
  const ins = ["a", "b"].map(q => document.getElementById("in" + q).value.split(/[ ,|]+/).filter(x => x).map(x => parseInt(x, 2)));
  if (!t0 || !t1 || ins.some(p => p.length !== 2 || p.some(x => !(x >= 0 && x <= 3)))) { e.textContent = "f-táblák: 4 db kétbites érték (00..11); bemenet: két kétbites érték, pl. 00 01."; return; }
  e.textContent = "";
  let t2 = null;
  if (document.getElementById("r3").checked) { t2 = [0, 1, 2, 3].map(() => Math.floor(Math.random() * 4)); }
  setSteps(stepsFor(t0, t1, ins, t2));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
