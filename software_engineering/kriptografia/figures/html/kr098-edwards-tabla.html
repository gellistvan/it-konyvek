<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edwards-görbe F5 felett: összeadótábla</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><div id="cellinfo" aria-live="polite" class="small" style="min-height:2.9em;width:100%">Cellára kattintás (vagy Tab + Enter): a képletbe helyettesítés.</div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="8×8-as tábla a görbe 8 pontjának összes összegével, és a (2,2) pont 8 többszöröse körön."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">x² + y² = 1 + 2x²y² (mod 5), a = 1, d = 2. Mind a 64 összeget a fejezet teljes képlete adja; a nevező egyik cellában sem 0. Számított, kis játékparaméter.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "[0](2,2) = (0,1), a semleges elem. Kattints a tábla bármely cellájára a behelyettesítéshez.", "kk": 0, "cur": 0, "prev": -1, "line": -1}, {"msg": "[1](2,2) = (0,1) + (2,2) = (2,2); nevezők: 1 + t = 1, 1 − t = 1 (t = d·x1x2y1y2 = 0), mindkettő ≠ 0", "kk": 1, "cur": 4, "prev": 0, "line": 1}, {"msg": "[2](2,2) = (2,2) + (2,2) = (1,0); nevezők: 1 + t = 3, 1 − t = 4 (t = d·x1x2y1y2 = 2), mindkettő ≠ 0", "kk": 2, "cur": 2, "prev": 4, "line": 1}, {"msg": "[3](2,2) = (1,0) + (2,2) = (2,3); nevezők: 1 + t = 1, 1 − t = 1 (t = d·x1x2y1y2 = 0), mindkettő ≠ 0", "kk": 3, "cur": 5, "prev": 2, "line": 1}, {"msg": "[4](2,2) = (2,3) + (2,2) = (0,4); nevezők: 1 + t = 4, 1 − t = 3 (t = d·x1x2y1y2 = 3), mindkettő ≠ 0", "kk": 4, "cur": 1, "prev": 5, "line": 1}, {"msg": "[5](2,2) = (0,4) + (2,2) = (3,3); nevezők: 1 + t = 1, 1 − t = 1 (t = d·x1x2y1y2 = 0), mindkettő ≠ 0", "kk": 5, "cur": 7, "prev": 1, "line": 1}, {"msg": "[6](2,2) = (3,3) + (2,2) = (4,0); nevezők: 1 + t = 3, 1 − t = 4 (t = d·x1x2y1y2 = 2), mindkettő ≠ 0", "kk": 6, "cur": 3, "prev": 7, "line": 1}, {"msg": "[7](2,2) = (4,0) + (2,2) = (3,2); nevezők: 1 + t = 1, 1 − t = 1 (t = d·x1x2y1y2 = 0), mindkettő ≠ 0", "kk": 7, "cur": 6, "prev": 3, "line": 1}, {"msg": "[8](2,2) = (3,2) + (2,2) = (0,1); nevezők: 1 + t = 4, 1 − t = 3 (t = d·x1x2y1y2 = 3), mindkettő ≠ 0. 8 lépés után vissza a (0,1)-be: a (2,2) rendje 8, a csoport ciklikus.", "kk": 8, "cur": 0, "prev": 6, "line": 1}];
const CODE = ["t  = d*x1*x2*y1*y2", "x3 = (x1*y2 + y1*x2) / (1 + t)", "y3 = (y1*y2 - a*x1*x2) / (1 - t)   # mod 5; d = 2 nem négyzetelem → 1 ± t ≠ 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const PTS = [[0, 1], [0, 4], [1, 0], [4, 0], [2, 2], [2, 3], [3, 2], [3, 3]]; const TAB = [[0, 1, 2, 3, 4, 5, 6, 7], [1, 0, 3, 2, 7, 6, 5, 4], [2, 3, 1, 0, 5, 7, 4, 6], [3, 2, 0, 1, 6, 4, 7, 5], [4, 7, 5, 6, 2, 1, 0, 3], [5, 6, 7, 4, 1, 3, 2, 0], [6, 5, 4, 7, 0, 2, 3, 1], [7, 4, 6, 5, 3, 0, 1, 2]]; const DET = [[{"nx": 0, "ny": 1, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 4, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 1, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 4, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}], [{"nx": 0, "ny": 4, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 1, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 4, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 1, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}], [{"nx": 1, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 4, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 4, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 1, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}], [{"nx": 4, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 1, "ny": 0, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 1, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 4, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}], [{"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 0, "ny": 2, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 0, "ny": 3, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 2, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}], [{"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 2, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 2, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 3, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 0, "ny": 3, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}], [{"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 0, "ny": 3, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 3, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 2, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 0, "ny": 2, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}], [{"nx": 3, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 3, "ny": 2, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 3, "dx": 1, "dy": 1, "ix": 1, "iy": 1, "t": 0}, {"nx": 2, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}, {"nx": 0, "ny": 3, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 0, "ny": 2, "dx": 4, "dy": 3, "ix": 4, "iy": 2, "t": 3}, {"nx": 3, "ny": 0, "dx": 3, "dy": 4, "ix": 2, "iy": 4, "t": 2}]]; const ORD = [1, 2, 4, 4, 8, 8, 8, 8]; const MULT = [0, 4, 2, 5, 1, 7, 3, 6, 0];
let SEL = [4, 4];
function sp2(i){ return "(" + PTS[i][0] + "," + PTS[i][1] + ")"; }
function cellInfo(i, j){
  const P = PTS[i], Q = PTS[j], d0 = DET[i][j];
  return "P + Q = " + sp2(i) + " + " + sp2(j) + ": t = 2·" + P[0] + "·" + Q[0] + "·" + P[1] + "·" + Q[1] + " ≡ " + d0.t +
    "; x3 = (" + P[0] + "·" + Q[1] + " + " + P[1] + "·" + Q[0] + ")/(1 + " + d0.t + ") = " + d0.nx + "/" + d0.dx + " = " + d0.nx + "·" + d0.ix +
    "; y3 = (" + P[1] + "·" + Q[1] + " − " + P[0] + "·" + Q[0] + ")/(1 − " + d0.t + ") = " + d0.ny + "/" + d0.dy + " = " + d0.ny + "·" + d0.iy +
    " → " + sp2(TAB[i][j]) + " (mod 5; mindkét nevező ≠ 0)";
}
function pick(i, j){ SEL = [i, j]; document.getElementById("cellinfo").textContent = cellInfo(i, j); show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 420");
  const x0 = 80, y0 = 50, c = 40;
  el("text", {x: 20, y: 36, "font-size": 12}, "P \\ Q");
  for (let j = 0; j < 8; j++) el("text", {x: x0 + j * c + c / 2, y: 40, "text-anchor": "middle", "font-size": 12, "font-weight": j === SEL[1] ? "bold" : "normal"}, sp2(j));
  for (let i = 0; i < 8; i++){
    el("text", {x: x0 - 6, y: y0 + i * c + 25, "text-anchor": "end", "font-size": 12, "font-weight": i === SEL[0] ? "bold" : "normal"}, sp2(i));
    for (let j = 0; j < 8; j++){
      const r = TAB[i][j], g = Math.round(255 - 110 * Math.log2(ORD[r]) / 3);
      const on = (i === SEL[0] && j === SEL[1]) || (s.kk > 0 && i === s.prev && j === 4);
      const rc = el("rect", {x: x0 + j * c, y: y0 + i * c, width: c, height: c, fill: `rgb(${g},${g},${g})`, stroke: on ? css("--hl2") : "#000", "stroke-width": on ? 3.5 : 0.6, tabindex: 0, role: "button", "aria-label": sp2(i) + " + " + sp2(j) + " = " + sp2(r), style: "cursor:pointer"});
      rc.addEventListener("click", () => pick(i, j));
      rc.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(i, j); } });
      const t = el("text", {x: x0 + j * c + c / 2, y: y0 + i * c + 25, "text-anchor": "middle", "font-size": 11, fill: "#000"}, sp2(r));
      t.style.pointerEvents = "none";
    }
  }
  el("rect", {x: x0, y: y0, width: 8 * c, height: c, fill: "none", stroke: css("--line"), "stroke-width": 3});
  el("rect", {x: x0, y: y0, width: c, height: 8 * c, fill: "none", stroke: css("--line"), "stroke-width": 3});
  el("text", {x: 20, y: 400, "font-size": 12, fill: css("--muted")}, "vastag keret: a (0,1) sora/oszlopa; sötétebb cella = nagyobb rendű összeg");
  const cx = 600, cy = 200, R = 105;
  el("text", {x: cx, y: 40, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "[k](2,2), k = " + s.kk);
  for (let q = 0; q < 8; q++){
    const ang = Math.PI / 2 - 2 * Math.PI * q / 8, x = cx + R * Math.cos(ang), y = cy - R * Math.sin(ang);
    const done = q <= s.kk && !(s.kk === 8 && q === 0 && false), on = (s.kk % 8) === q;
    el("circle", {cx: x, cy: y, r: 17, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : (q < s.kk || s.kk === 8 ? 1.6 : 0.8), "stroke-dasharray": (q <= s.kk || s.kk === 8) ? "none" : "3 3"});
    el("text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 13}, String(q));
    el("text", {x: cx + (R + 36) * Math.cos(ang), y: cy - (R + 36) * Math.sin(ang) + 5, "text-anchor": "middle", "font-size": 12}, sp2(MULT[q]));
  }
  for (let q = 0; q < s.kk; q++){
    const a1 = Math.PI / 2 - 2 * Math.PI * q / 8, a2 = Math.PI / 2 - 2 * Math.PI * (q + 1) / 8;
    const p1 = [cx + R * Math.cos(a1 - 0.2), cy - R * Math.sin(a1 - 0.2)], p2 = [cx + R * Math.cos(a2 + 0.2), cy - R * Math.sin(a2 + 0.2)];
    el("line", {x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: q === s.kk - 1 ? css("--hl2") : css("--fg"), "stroke-width": q === s.kk - 1 ? 3 : 1.5});
    el("circle", {cx: p2[0], cy: p2[1], r: 3.5, fill: q === s.kk - 1 ? css("--hl2") : css("--fg")});
  }
  el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 12}, "+(2,2)");
  el("text", {x: cx, y: 380, "text-anchor": "middle", "font-size": 12}, s.kk === 8 ? "8. lépés: vissza (0,1)-be → rend 8" : "aktuális: " + sp2(s.cur));
}
document.getElementById("cellinfo").textContent = cellInfo(4, 4);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
