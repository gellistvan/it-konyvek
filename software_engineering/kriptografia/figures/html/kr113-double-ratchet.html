<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A double ratchet állapota üzenetenként (modell)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="comp" onchange="show(k)"> Bob állapota kompromittálódik a 3. lépés után (passzív támadó, rögzített forgalom)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Alice és Bob racsniállapota négy üzenet után; a DH-racsni irányváltáskor új gyökér- és lánckulcsot ad, a késve érkező üzenet kulcsa a skipped táblából jön."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, rövidített számított értékek (HMAC-SHA256, 4 hexa jegy; DH a Z_23^* csoportban, g = 5), nem a Signal tényleges kódolása. A fejléc PN mezője a küldő előző küldő láncának hossza.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Lépés 1/6: Alice elküldi A1-et – fejléc (dh=a0=20, N=0, PN=0) – skipped: {}", "line": 1, "A": {"RK": "65a6", "CKs": "7d12", "CKr": null, "DHs": "a0=20", "DHr": "SPK_B=8", "Ns": 1, "Nr": 0, "PN": 0, "skipped": []}, "B": {"RK": "0101", "CKs": null, "CKr": null, "DHs": "SPK_B=8", "DHr": null, "Ns": 0, "Nr": 0, "PN": 0, "skipped": []}, "sent": ["A1"], "recv": [], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}, {"msg": "Lépés 2/6: Alice elküldi A2-t – fejléc (dh=a0=20, N=1, PN=0) – skipped: {}", "line": 1, "A": {"RK": "65a6", "CKs": "df88", "CKr": null, "DHs": "a0=20", "DHr": "SPK_B=8", "Ns": 2, "Nr": 0, "PN": 0, "skipped": []}, "B": {"RK": "0101", "CKs": null, "CKr": null, "DHs": "SPK_B=8", "DHr": null, "Ns": 0, "Nr": 0, "PN": 0, "skipped": []}, "sent": ["A1", "A2"], "recv": [], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}, {"msg": "Lépés 3/6: Bob fogadja A1-et és A2-t – az új dh miatt DH-racsni (két KDF_RK-hívás), majd két KDF_CK-lépés – skipped: {}", "line": 10, "A": {"RK": "65a6", "CKs": "df88", "CKr": null, "DHs": "a0=20", "DHr": "SPK_B=8", "Ns": 2, "Nr": 0, "PN": 0, "skipped": []}, "B": {"RK": "744f", "CKs": "5a8b", "CKr": "df88", "DHs": "b1=9", "DHr": "a0=20", "Ns": 0, "Nr": 2, "PN": 0, "skipped": []}, "sent": ["A1", "A2"], "recv": ["A1", "A2"], "ev": ["DH-racsni: KDF_RK(RK, DH(SPK_B, a0)) → CKr; új b1; KDF_RK(RK, DH(b1, a0)) → CKs"], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}, {"msg": "Lépés 4/6: Bob elküldi B1-et – fejléc (dh=b1=9, N=0, PN=0); Alice fogadja: DH-racsni, új küldő lánc – skipped: {}", "line": 5, "A": {"RK": "aa02", "CKs": "c8a2", "CKr": "24d0", "DHs": "a1=19", "DHr": "b1=9", "Ns": 0, "Nr": 1, "PN": 2, "skipped": []}, "B": {"RK": "744f", "CKs": "24d0", "CKr": "df88", "DHs": "b1=9", "DHr": "a0=20", "Ns": 1, "Nr": 2, "PN": 0, "skipped": []}, "sent": ["A1", "A2", "B1"], "recv": ["A1", "A2", "B1"], "ev": ["DH-racsni: KDF_RK(RK, DH(a0, b1)) → CKr; új a1; KDF_RK(RK, DH(a1, b1)) → CKs"], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}, {"msg": "Lépés 5/6: Alice elküldi A3-at és A4-et; az A4 érkezik előbb – fejléc (dh=a1=19, N=1, PN=2) – skipped: {(a1, 0): 30ae}", "line": 13, "A": {"RK": "aa02", "CKs": "000a", "CKr": "24d0", "DHs": "a1=19", "DHr": "b1=9", "Ns": 2, "Nr": 1, "PN": 2, "skipped": []}, "B": {"RK": "1d67", "CKs": "f7b6", "CKr": "000a", "DHs": "b2=21", "DHr": "a1=19", "Ns": 0, "Nr": 2, "PN": 1, "skipped": ["(a1, 0): 30ae"]}, "sent": ["A1", "A2", "B1", "A3", "A4"], "recv": ["A1", "A2", "B1", "A4"], "ev": ["DH-racsni: KDF_RK(RK, DH(b1, a1)) → CKr; új b2; KDF_RK(RK, DH(b2, a1)) → CKs", "skipped += (a1, N=0)"], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}, {"msg": "Lépés 6/6: megérkezik az A3 – fejléc (dh=a1=19, N=0, PN=2) – kulcs a skipped táblából – skipped: {}", "line": 4, "A": {"RK": "aa02", "CKs": "000a", "CKr": "24d0", "DHs": "a1=19", "DHr": "b1=9", "Ns": 2, "Nr": 1, "PN": 2, "skipped": []}, "B": {"RK": "1d67", "CKs": "f7b6", "CKr": "000a", "DHs": "b2=21", "DHr": "a1=19", "Ns": 0, "Nr": 2, "PN": 1, "skipped": []}, "sent": ["A1", "A2", "B1", "A3", "A4"], "recv": ["A1", "A2", "B1", "A4", "A3"], "ev": ["a kulcs a skipped táblából jön, majd törlődik"], "readable": {"A1": false, "A2": false, "B1": true, "A4": true, "A3": true}, "mk": {"A1": "4889", "A2": "b776", "B1": "9143", "A3": "30ae", "A4": "f112"}, "hdr": {"A1": ["a0=20", 0, 0], "A2": ["a0=20", 1, 0], "B1": ["b1=9", 0, 0], "A3": ["a1=19", 0, 2], "A4": ["a1=19", 1, 2]}, "frm": {"A1": "A", "A2": "A", "B1": "B", "A3": "A", "A4": "A"}}];
const CODE = ["RatchetEncrypt(state, pt):", "  state.CKs, mk = KDF_CK(state.CKs)", "  header = (state.DHs.pub, N = state.Ns, PN = state.PN); state.Ns += 1", "RatchetDecrypt(state, header, ct):", "  if (header.dh, header.N) in state.skipped: mk = skipped.pop(...); return", "  if header.dh != state.DHr: SkipMessageKeys(state, header.PN); DHRatchet(state, header)", "  SkipMessageKeys(state, header.N)", "  state.CKr, mk = KDF_CK(state.CKr); state.Nr += 1", "DHRatchet(state, header):", "  state.PN = state.Ns; state.Ns = state.Nr = 0; state.DHr = header.dh", "  state.RK, state.CKr = KDF_RK(state.RK, DH(state.DHs, state.DHr))", "  state.DHs = GENERATE_DH(); state.RK, state.CKs = KDF_RK(state.RK, DH(state.DHs, state.DHr))", "SkipMessageKeys(state, until):", "  while state.Nr < until: state.CKr, mk = KDF_CK(state.CKr); state.skipped[(DHr, Nr)] = mk; Nr += 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 720 430");
  svg.innerHTML="";
  const comp=document.getElementById("comp").checked;
  const keys=["RK","CKs","CKr","DHs","DHr","Ns","Nr","PN"];
  function cardOf(x,who,st,label){
    el("rect",{x:x,y:8,width:300,height:230,fill:css("--cell"),stroke:css("--line"),"stroke-width":1.2,rx:6});
    el("text",{x:x+150,y:30,"text-anchor":"middle","font-size":16,"font-weight":"bold"},label);
    keys.forEach((kk,i)=>{
      el("text",{x:x+14,y:56+i*20,"font-size":13},kk);
      const v=st[kk]===null?"–":String(st[kk]);
      const bad = comp && who==="B" && k===2 && (kk==="RK"||kk==="CKs"||kk==="CKr"||kk==="DHs");
      el("text",{x:x+90,y:56+i*20,"font-size":13,"font-family":"ui-monospace,monospace",fill:bad?"#c0392b":css("--fg")},v+(bad?"  (ellopva)":""));
    });
    el("text",{x:x+14,y:222,"font-size":13},"skipped: "+(st.skipped.length?st.skipped.join(", "):"{}"));
    if(st.skipped.length) el("rect",{x:x+8,y:208,width:284,height:22,fill:"none",stroke:css("--line"),"stroke-dasharray":"5 3"});
  }
  cardOf(10,"A",s.A,"Alice");
  cardOf(410,"B",s.B,"Bob");
  // üzenetnapló
  const order=["A1","A2","B1","A3","A4"];
  el("text",{x:10,y:268,"font-size":14,"font-weight":"bold"},"Üzenetek (fejléc: dh, N, PN; MK)");
  order.forEach((m,i)=>{
    const x=10+i*142, y=280;
    const sent=s.sent.includes(m), got=s.recv.includes(m);
    const r=s.readable[m];
    const fillC = (!sent)?"none":(comp&&r?"#c0392b":css("--cell"));
    el("rect",{x:x,y:y,width:132,height:84,fill:fillC,"fill-opacity":comp&&r&&sent?0.25:1,stroke:css("--line"),"stroke-dasharray":sent?"":"4 3",rx:4});
    if(comp&&r&&sent){ for(let t=0;t<132;t+=12) el("line",{x1:x+t,y1:y+84,x2:Math.min(x+t+20,x+132),y2:y+84-Math.min(20,132-t)*84/20,stroke:"#c0392b","stroke-width":1}); }
    const dir = s.frm[m]==="A"?"Alice → Bob":"Bob → Alice";
    el("text",{x:x+66,y:y+18,"text-anchor":"middle","font-size":14,"font-weight":"bold"},m+(sent?"":" (még nincs)"));
    if(sent){
      el("text",{x:x+66,y:y+36,"text-anchor":"middle","font-size":12},dir);
      el("text",{x:x+66,y:y+53,"text-anchor":"middle","font-size":12,"font-family":"ui-monospace,monospace"},"("+s.hdr[m].join(", ")+")");
      el("text",{x:x+66,y:y+71,"text-anchor":"middle","font-size":12},"MK "+s.mk[m]+(got?" ✓ fogadva":" úton"));
      if(got) el("line",{x1:x+30,y1:y+67,x2:x+70,y2:y+67,stroke:css("--line"),"stroke-width":1.2});
      if(comp) el("text",{x:x+66,y:y+100,"text-anchor":"middle","font-size":12,"font-weight":"bold",fill:r?"#c0392b":css("--ok")},r?"OLVASHATÓ":"védett");
    }
  });
  const ev=(s.ev||[]).join(" | ");
  el("text",{x:10,y:418,"font-size":12,fill:css("--muted")},ev.length>118?ev.slice(0,116)+"…":ev);
  if(comp) status.textContent = s.msg + " — kompromittálás a 3. lépés után: A1, A2 védett (FS); B1, A3, A4 olvasható (a b1 privát kulcs is ellopva); gyógyulás: " + HEAL;
}
const HEAL = "Bob következő üzenetétől (új b2 kulcspár, DH(b2, a1))";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
