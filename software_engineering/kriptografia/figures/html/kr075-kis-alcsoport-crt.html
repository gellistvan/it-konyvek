<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kis alcsoportú támadás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>Alice titkos a (1–29): <input id="ia" type="number" min="1" max="29" value="14" style="width:4.5em"></label>
<label><input id="chk" type="checkbox"> csoporttagság-ellenőrzés</label>
<button id="go">Újraszámolás</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A támadó 3-, 5- és 2-rendű elemet küld; Alice válaszaiból a = 2 mod 3, 4 mod 5, 0 mod 2; a CRT szerint a = 14."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a szöveg játékparamétereivel (p = 31, g = 3, a = 14). Absztrakt, szimulált támadás a könyv saját játékpéldáján. A védekezés elvi: a p = 31 csoport nem biztonságos prímes.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": 14, "chk": false, "st": 1, "line": 5, "msg": "1. kör: y = 25 (rend 3), Alice K = 25^14 mod 31 = 5 = 25^2 → a ≡ 2 (mod 3)."}, {"a": 14, "chk": false, "st": 2, "line": 5, "msg": "2. kör: y' = 16 (rend 5), Alice K = 16^14 mod 31 = 2 = 16^4 → a ≡ 4 (mod 5)."}, {"a": 14, "chk": false, "st": 3, "line": 5, "msg": "3. kör: y'' = 30 (rend 2), Alice K = 30^14 mod 31 = 1 = 30^0 → a ≡ 0 (mod 2)."}, {"a": 14, "chk": false, "st": 4, "line": 6, "msg": "CRT: a ≡ 2 (mod 3), a ≡ 4 (mod 5), a ≡ 0 (mod 2) → a = 14."}, {"a": 14, "chk": false, "st": 5, "line": 1, "msg": "Védekezés: p = 2q + 1 biztonságos prím mellett csak y^q ≡ 1 (mod p) értéket fogadunk el; a kis rendű y már az 1. körben elbukik (elvi; a p = 31 játékcsoport nem ilyen)."}];
const CODE = ["for (y, r) in [(25, 3), (16, 5), (30, 2)]:      # kis rendű elemek: 3^(30/r) mod 31", "    if ellenorzes and not (1 < y < p-1 and pow(y, q, p) == 1):", "        elutasitva(y); break                     # csoporttagság-ellenőrzés", "    K = pow(y, a, p)                             # Alice válasza (statikus a)", "    j = [t for t in range(r) if pow(y, t, p) == K][0]", "    maradek.append((j, r))                       # a ≡ j (mod r)", "a = crt(maradek)                                 # mod 30"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const P31=31, RNDS=[[25,3],[16,5],[30,2]];
function pw(x,e,m){let r=1;x%=m;while(e>0){if(e&1)r=r*x%m;x=x*x%m;e>>=1;}return r;}
function atk(a){ const res=RNDS.map(([y,r])=>{const sub=[];for(let t=0;t<r;t++)sub.push(pw(y,t,P31));const K=pw(y,a,P31);return {y:y,r:r,sub:sub,K:K,j:sub.indexOf(K)};});
  let sol=-1; for(let x=0;x<30;x++) if(res.every(o=>x%o.r===o.j)) sol=x; return {res:res,sol:sol}; }
function mkSteps(a,chk){ const R=atk(a), out=[], nm=["y","y'","y''"], base={a:a,chk:chk};
  R.res.forEach((o,i)=>{ if(chk) out.push(Object.assign({},base,{st:i+1,line:2,msg: i===0?`${i+1}. kör: ${nm[i]} = ${o.y} (rend ${o.r}) – csoporttagság-ellenőrzés: elutasítva, a támadás megszakad.`:`${i+1}. kör: nem jön létre (az 1. körben elutasítva).`}));
    else out.push(Object.assign({},base,{st:i+1,line:5,msg:`${i+1}. kör: ${nm[i]} = ${o.y} (rend ${o.r}), Alice K = ${o.y}^${a} mod 31 = ${o.K} = ${o.y}^${o.j} → a ≡ ${o.j} (mod ${o.r}).`})); });
  if(chk) out.push(Object.assign({},base,{st:4,line:-1,msg:"CRT: nincs maradék, a kulcs nem állítható vissza."}));
  else out.push(Object.assign({},base,{st:4,line:6,msg:`CRT: a ≡ ${R.res[0].j} (mod 3), a ≡ ${R.res[1].j} (mod 5), a ≡ ${R.res[2].j} (mod 2) → a = ${R.sol}.`}));
  out.push(Object.assign({},base,{st:5,line:1,msg:"Védekezés: p = 2q + 1 biztonságos prím mellett csak y^q ≡ 1 (mod p) értéket fogadunk el; a kis rendű y már az 1. körben elbukik (elvi; a p = 31 játékcsoport nem ilyen)."}));
  return out; }
function render(s){
  svg.setAttribute("viewBox","0 0 760 415"); svg.innerHTML="";
  const R=atk(s.a), hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line");
  const nm=["y","y′","y″"];
  R.res.forEach((o,i)=>{ const yy=20+i*62, shown=(s.st>i) && !(s.chk && i>0), act=(s.st===i+1);
    el("text",{x:8,y:yy+26,"font-size":14,"font-weight":act?"bold":"normal",fill:act?hl:css("--fg")},`${i+1}. kör: ${nm[i]} = ${o.y}, rend ${o.r}`);
    if(!shown){ el("text",{x:200,y:yy+26,"font-size":13,fill:mu},s.chk&&i>0&&s.st>i?"(nem jön létre)":"…"); return; }
    if(s.chk && i===0){ el("text",{x:200,y:yy+28,"font-size":30,fill:hl2,"font-weight":"bold"},"✗");
      el("text",{x:236,y:yy+26,"font-size":13},`${o.y}^q ≢ 1 → elutasítva (csoporttagság-ellenőrzés)`); return; }
    o.sub.forEach((v,t)=>{ const x=200+t*46, hit=(t===o.j);
      el("rect",{x:x,y:yy+4,width:40,height:32,fill:hit?css("--cellhl"):css("--cell"),stroke:hit?hl:ln,"stroke-width":hit?3.5:1});
      el("text",{x:x+20,y:yy+26,"text-anchor":"middle","font-size":15,"font-weight":hit?"bold":"normal"},String(v));
      if(!hit) el("line",{x1:x+4,y1:yy+32,x2:x+36,y2:yy+8,stroke:mu,"stroke-width":1.2});
      el("text",{x:x+20,y:yy+50,"text-anchor":"middle","font-size":10,fill:mu},"j="+t); });
    el("text",{x:440,y:yy+26,"font-size":14},`K = ${o.K}`);
    el("text",{x:520,y:yy+26,"font-size":15,"font-weight":"bold",fill:hl},`a ≡ ${o.j} (mod ${o.r})`); });
  // CRT-tábla
  const ty=232;
  el("text",{x:8,y:ty-10,"font-size":14,"font-weight":s.st===4?"bold":"normal",fill:s.st===4?hl:css("--fg")},"4. CRT-tábla (0..29): pont = rossz mod 3, ferde = rossz mod 5, kereszt = rossz mod 2");
  for(let x=0;x<30;x++){ const row=Math.floor(x/15), col=x%15, X=8+col*49, Y=ty+row*46;
    const show=(s.st>=4 && !s.chk), f3=show&&x%3!==R.res[0].j, f5=show&&x%5!==R.res[1].j, f2=show&&x%2!==R.res[2].j, ok=show&&!f3&&!f5&&!f2;
    el("rect",{x:X,y:Y,width:44,height:38,fill:ok?css("--cellhl"):css("--cell"),stroke:ok?hl:ln,"stroke-width":ok?3.5:0.8});
    if(f3){ for(let d=0;d<3;d++) el("circle",{cx:X+8+d*14,cy:Y+6,r:2,fill:mu}); }
    if(f5) el("line",{x1:X+2,y1:Y+36,x2:X+42,y2:Y+2,stroke:mu,"stroke-width":1.2});
    if(f2){ el("line",{x1:X+30,y1:Y+26,x2:X+40,y2:Y+36,stroke:mu,"stroke-width":1.4}); el("line",{x1:X+40,y1:Y+26,x2:X+30,y2:Y+36,stroke:mu,"stroke-width":1.4}); }
    el("text",{x:X+22,y:Y+25,"text-anchor":"middle","font-size":ok?16:13,"font-weight":ok?"bold":"normal"},String(x)); }
  // védekezés
  const vy=345, on=(s.st===5)||s.chk;
  el("rect",{x:8,y:vy,width:744,height:60,fill:css("--cellhl"),stroke:on?hl2:ln,"stroke-width":on?2.5:1,"stroke-dasharray":"6 4"});
  el("text",{x:20,y:vy+24,"font-size":13,"font-weight":"bold"},`Védekezés (csoporttagság-ellenőrzés): ${s.chk?"BE":"KI"}`);
  el("text",{x:20,y:vy+46,"font-size":12},"p = 2q + 1 biztonságos prím, csak 1 < y < p − 1 és y^q ≡ 1 elfogadva → a kis rendű y már az 1. körben elbukik.");
}
document.getElementById("go").addEventListener("click",()=>{ let a=Math.round(+document.getElementById("ia").value);
  if(!(a>=1&&a<=29)){ a=Math.max(1,Math.min(29,a||14)); document.getElementById("ia").value=a; }
  setSteps(mkSteps(a, document.getElementById("chk").checked)); });
document.getElementById("chk").addEventListener("change",()=>document.getElementById("go").click());


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
