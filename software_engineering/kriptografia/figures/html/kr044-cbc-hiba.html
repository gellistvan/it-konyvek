<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBC-láncolás és hibaterjedés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód: <select id="mode" onchange="rebuild(false)" aria-label="Üzemmód"><option value="enc">CBC titkosítás</option><option value="dec">CBC visszafejtés</option><option value="ecb">ECB</option></select></label><label>IV <input id="iiv" value="00" size="2"></label><label>m₁ <input id="im1" value="01" size="2"></label><label>m₂ <input id="im2" value="01" size="2"></label><label>m₃ <input id="im3" value="10" size="2"></label><label>m₄ <input id="im4" value="01" size="2"></label><button onclick="rebuild(false)">Számolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy CBC-blokk titkosítási adatútja lépésenként a 2 bites mini-rejtjellel; visszafejtés módban a rejtett bitek megfordíthatók, és látszik, mely nyílt blokkok sérülnek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 12.1.4 mini-rejtjele: E_k(00) = 01, E_k(01) = 11, E_k(10) = 00, E_k(11) = 10; IV = 00, m = 01‖01‖10‖01. Visszafejtés módban a c₂ alsó bitjére kattintva: m₂′ = 11 (teljesen sérült), m₃′ = 11 (eredeti 10, egy bit), m₄ = 01 ép. A 3. feladat 3 blokkos változatában (c₃ = 11) m₃′ = 00.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [null, null, null, null], "done": 0, "cur": -1, "sub": "", "line": 1, "msg": "CBC-titkosítás: c₀ = IV = 00; m = 01‖01‖10‖01"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, null, null, null], "done": 0, "cur": 0, "sub": "xor", "cc": [0, null, null, null, null], "line": 2, "msg": "m1 ⊕ c0 = 01 ⊕ 00 = 01"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, null, null, null], "done": 0, "cur": 0, "sub": "E", "cc": [0, 3, null, null, null], "line": 3, "msg": "c1 = E_k(01 ⊕ 00) = E_k(01) = 11"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, null, null], "done": 0, "cur": 1, "sub": "xor", "cc": [0, 3, null, null, null], "line": 2, "msg": "m2 ⊕ c1 = 01 ⊕ 11 = 10"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, null, null], "done": 0, "cur": 1, "sub": "E", "cc": [0, 3, 0, null, null], "line": 3, "msg": "c2 = E_k(01 ⊕ 11) = E_k(10) = 00"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, 2, null], "done": 0, "cur": 2, "sub": "xor", "cc": [0, 3, 0, null, null], "line": 2, "msg": "m3 ⊕ c2 = 10 ⊕ 00 = 10"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, 2, null], "done": 0, "cur": 2, "sub": "E", "cc": [0, 3, 0, 0, null], "line": 3, "msg": "c3 = E_k(10 ⊕ 00) = E_k(10) = 00"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, 2, 1], "done": 0, "cur": 3, "sub": "xor", "cc": [0, 3, 0, 0, null], "line": 2, "msg": "m4 ⊕ c3 = 01 ⊕ 00 = 01"}, {"mode": "enc", "iv": 0, "m": [1, 1, 2, 1], "c": [0, 3, 0, 0, 3], "cf": [0, 3, 0, 0, 3], "out": [null, null, null, null], "inter": [1, 2, 2, 1], "done": 0, "cur": 3, "sub": "E", "cc": [0, 3, 0, 0, 3], "line": 3, "msg": "c4 = E_k(01 ⊕ 00) = E_k(01) = 11; c = 00‖11‖00‖00‖11 (az IV az első blokk)"}];
const CODE = ["# CBC-titkosítás", "c[0] = IV", "for i in 1..n:   x = m[i] ^ c[i-1]", "                 c[i] = E(x)", "# CBC-visszafejtés", "for i in 1..n:   y = D(c[i])", "                 m[i] = y ^ c[i-1]", "# ECB", "for i in 1..n:   c[i] = E(m[i])"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EK = [1, 3, 0, 2], DK = [2, 0, 3, 1];
let FLIPS = [0, 0, 0, 0];
function b2(v){return v === null || v === undefined ? "··" : v.toString(2).padStart(2, "0");}
const XC = [70, 220, 370, 520, 670];
function vbox(x, y, txt, o){
  o = o || {};
  el("rect", {x: x - 26, y: y - 16, width: 52, height: 32, fill: o.fill || css("--cell"), stroke: css("--line"), "stroke-width": o.lw || 1.2, "stroke-dasharray": o.dash || ""});
  el("text", {x: x, y: y + 7, "text-anchor": "middle", "font-size": 18, "font-family": "monospace"}, txt);
  if (o.star) el("text", {x: x + 30, y: y - 6, "font-size": 20, "font-weight": "bold"}, "*");
}
function opbox(x, y, t, on){el("rect", {x: x - 28, y: y - 16, width: 56, height: 32, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": on ? 3 : 1}); el("text", {x: x, y: y + 6, "text-anchor": "middle", "font-size": 15}, t);}
function xo(x, y, on){el("circle", {cx: x, cy: y, r: 12, fill: css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2}); el("line", {x1: x - 12, y1: y, x2: x + 12, y2: y, stroke: css("--line")}); el("line", {x1: x, y1: y - 12, x2: x, y2: y + 12, stroke: css("--line")});}
function ln(x1, y1, x2, y2, dash){el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": dash || ""});}
function bitCells(x, y, v, i){
  for (let b = 0; b < 2; b++) {
    const bit = (v >> (1 - b)) & 1, fl = (FLIPS[i] >> (1 - b)) & 1;
    const g = document.createElementNS(NS, "g"); g.setAttribute("style", "cursor:pointer"); g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
    g.setAttribute("aria-label", "c" + (i + 1) + " " + (b === 0 ? "felső" : "alsó") + " bitjének megfordítása");
    const R = document.createElementNS(NS, "rect"); const at = {x: x - 26 + b * 26, y: y - 16, width: 26, height: 32, fill: css("--cell"), stroke: css("--line"), "stroke-width": fl ? 3.5 : 1};
    for (const q in at) R.setAttribute(q, at[q]); g.appendChild(R);
    const T = document.createElementNS(NS, "text"); const tt = {x: x - 13 + b * 26, y: y + 7, "text-anchor": "middle", "font-size": 18, "font-family": "monospace"};
    for (const q in tt) T.setAttribute(q, tt[q]); T.textContent = String(bit); g.appendChild(T);
    const act = () => { FLIPS[i] ^= 1 << (1 - b); rebuild(true); };
    g.addEventListener("click", act); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
    svg.appendChild(g);
  }
  if (FLIPS[i]) el("text", {x: x + 30, y: y - 6, "font-size": 20, "font-weight": "bold"}, "*");
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330");
  svg.innerHTML = "";
  const sub = ["₁","₂","₃","₄"];
  if (s.mode === "ecb") {
    for (let i = 0; i < 4; i++) { const x = XC[i + 1], on = s.cur === i;
      vbox(x, 50, b2(s.m[i])); el("text", {x, y: 26, "text-anchor": "middle", "font-size": 14}, "m" + sub[i]);
      ln(x, 66, x, 134); opbox(x, 150, "E_k", on); ln(x, 166, x, 234);
      vbox(x, 250, b2(s.ce[i]), {lw: on ? 3 : 1.2}); el("text", {x, y: 286, "text-anchor": "middle", "font-size": 14}, "c" + sub[i]); }
    el("text", {x: 20, y: 320, "font-size": 12, fill: css("--muted")}, "ECB: azonos nyílt blokkból azonos rejtett blokk – nincs láncolás.");
    return;
  }
  if (s.mode === "enc") {
    vbox(XC[0], 250, b2(s.iv)); el("text", {x: XC[0], y: 286, "text-anchor": "middle", "font-size": 14}, "IV = c₀");
    for (let i = 0; i < 4; i++) { const x = XC[i + 1], xp = XC[i], on = s.cur === i;
      vbox(x, 40, b2(s.m[i])); el("text", {x: x - 40, y: 46, "text-anchor": "end", "font-size": 14}, "m" + sub[i]);
      ln(x, 56, x, 98); xo(x, 110, on && s.sub === "xor");
      if (s.inter[i] !== null) el("text", {x: x + 18, y: 104, "font-size": 15, "font-family": "monospace"}, "= " + b2(s.inter[i]));
      ln(x, 122, x, 154); opbox(x, 170, "E_k", on && s.sub === "E"); ln(x, 186, x, 234);
      const known = s.cc && s.cc[i + 1] !== null && s.cc[i + 1] !== undefined;
      vbox(x, 250, known ? b2(s.c[i + 1]) : "··", {lw: on && s.sub === "E" ? 3 : 1.2}); el("text", {x, y: 286, "text-anchor": "middle", "font-size": 14}, "c" + sub[i]);
      ln(xp + 26, 250, xp + 50, 250, "6 4"); ln(xp + 50, 250, xp + 50, 110, "6 4"); ln(xp + 50, 110, x - 12, 110, "6 4"); }
    el("text", {x: 20, y: 320, "font-size": 12, fill: css("--muted")}, "Szaggatott: az előző rejtett blokk visszacsatolása (láncolás).");
    return;
  }
  // visszafejtés
  vbox(XC[0], 40, b2(s.cf[0])); el("text", {x: XC[0], y: 18, "text-anchor": "middle", "font-size": 14}, "IV");
  for (let i = 0; i < 4; i++) { const x = XC[i + 1], xp = XC[i], on = s.cur === i;
    bitCells(x, 40, s.cf[i + 1], i); el("text", {x, y: 18, "text-anchor": "middle", "font-size": 14}, "c" + sub[i] + (FLIPS[i] ? "′" : ""));
    ln(x, 56, x, 94); opbox(x, 110, "D_k", on && s.sub === "D");
    if (s.inter[i] !== null) el("text", {x: x + 32, y: 140, "font-size": 15, "font-family": "monospace"}, b2(s.inter[i]));
    ln(x, 126, x, 168); xo(x, 180, on && s.sub === "xor"); ln(x, 192, x, 234);
    const o = s.out[i], bad = o !== null && o !== s.m[i], full = bad && FLIPS[i];
    vbox(x, 250, o === null ? "··" : b2(o), {fill: full ? css("--cellhl") : css("--cell"), dash: bad && !full ? "3 3" : "", lw: bad ? 3 : 1.2});
    el("text", {x, y: 286, "text-anchor": "middle", "font-size": 14}, "m" + sub[i] + (bad ? "′" : "") + " (ered. " + b2(s.m[i]) + ")");
    ln(xp + 26, 40, xp + 50, 40, "6 4"); ln(xp + 50, 40, xp + 50, 180, "6 4"); ln(xp + 50, 180, x - 12, 180, "6 4"); }
  el("text", {x: 20, y: 320, "font-size": 12, fill: css("--muted")}, "Kattints a rejtett blokkok bitjeire! Szürke, vastag: teljesen sérült blokk; szaggatott keret: egy bitben sérült.");
}
function parse2(id){const v = document.getElementById(id).value.trim(); return /^[01]{2}$/.test(v) ? parseInt(v, 2) : null;}
function cbcEnc(iv, m){const c = [iv]; for (const x of m) c.push(EK[x ^ c[c.length - 1]]); return c;}
function makeSteps(mode, iv, m, flips){
  const c = cbcEnc(iv, m), st = [], J = a => a.map(b2).join("‖");
  const base = {mode, iv, m, c, cf: c, out: [null, null, null, null], inter: [null, null, null, null], cur: -1, sub: ""};
  if (mode === "ecb") {
    const ce = m.map(x => EK[x]);
    st.push(Object.assign({}, base, {ce: [null, null, null, null], line: 8, msg: "ECB: minden blokkot külön titkosítunk, láncolás nélkül"}));
    for (let i = 0; i < 4; i++) { const ce2 = st[st.length - 1].ce.slice(); ce2[i] = ce[i];
      st.push(Object.assign({}, base, {ce: ce2, cur: i, sub: "E", line: 8, msg: "c" + (i + 1) + " = E_k(" + b2(m[i]) + ") = " + b2(ce[i])})); }
    st[st.length - 1].msg += "; rejtett szöveg: " + J(ce);
    return st;
  }
  if (mode === "enc") {
    st.push(Object.assign({}, base, {line: 1, msg: "CBC-titkosítás: c₀ = IV = " + b2(iv) + "; m = " + J(m)}));
    let inter = [null, null, null, null], cc = [iv, null, null, null, null];
    for (let i = 0; i < 4; i++) {
      inter = inter.slice(); inter[i] = m[i] ^ c[i];
      st.push(Object.assign({}, base, {inter, cc, cur: i, sub: "xor", line: 2, msg: "m" + (i + 1) + " ⊕ c" + i + " = " + b2(m[i]) + " ⊕ " + b2(c[i]) + " = " + b2(inter[i])}));
      cc = cc.slice(); cc[i + 1] = c[i + 1];
      st.push(Object.assign({}, base, {inter, cc, cur: i, sub: "E", line: 3, msg: "c" + (i + 1) + " = E_k(" + b2(m[i]) + " ⊕ " + b2(c[i]) + ") = E_k(" + b2(inter[i]) + ") = " + b2(c[i + 1])}));
    }
    st[st.length - 1].msg += "; c = " + J(c) + " (az IV az első blokk)";
    return st;
  }
  const cf = [c[0]].concat([0, 1, 2, 3].map(i => c[i + 1] ^ flips[i]));
  const mf = [0, 1, 2, 3].map(i => DK[cf[i + 1]] ^ cf[i]);
  const bd = Object.assign({}, base, {cf, flips});
  const fl = [0, 1, 2, 3].filter(i => flips[i]).map(i => "c" + (i + 1));
  st.push(Object.assign({}, bd, {line: 5, msg: "CBC-visszafejtés: c = " + J(cf) + (fl.length ? "  (megfordított bit: " + fl.join(", ") + ")" : "") + " · a rejtett blokkok bitjeire kattintva megfordíthatók"}));
  let inter = [null, null, null, null], out = [null, null, null, null];
  for (let i = 0; i < 4; i++) {
    inter = inter.slice(); inter[i] = DK[cf[i + 1]];
    st.push(Object.assign({}, bd, {inter, out, cur: i, sub: "D", line: 5, msg: "D_k(c" + (i + 1) + (flips[i] ? "′" : "") + ") = D_k(" + b2(cf[i + 1]) + ") = " + b2(inter[i])}));
    out = out.slice(); out[i] = mf[i];
    const note = mf[i] === m[i] ? "" : (flips[i] ? "  ← teljesen sérült blokk" : "  ← egy bitben sérült (az előző blokk bitfordítása)");
    st.push(Object.assign({}, bd, {inter, out, cur: i, sub: "xor", line: 6, msg: "m" + (i + 1) + (mf[i] !== m[i] ? "′" : "") + " = " + b2(inter[i]) + " ⊕ " + b2(cf[i]) + " = " + b2(mf[i]) + " (eredeti " + b2(m[i]) + ")" + note}));
  }
  return st;
}
function rebuild(toEnd){
  const iv = parse2("iiv"), m = ["im1", "im2", "im3", "im4"].map(parse2), er = document.getElementById("err");
  if (iv === null || m.some(v => v === null)) { er.textContent = "Az IV és a blokkok 2 bites bináris számok (pl. 01)."; return; }
  er.textContent = "";
  const mode = document.getElementById("mode").value;
  if (mode !== "dec") FLIPS = [0, 0, 0, 0];
  setSteps(makeSteps(mode, iv, m, FLIPS));
  if (toEnd) show(STEPS.length - 1);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
