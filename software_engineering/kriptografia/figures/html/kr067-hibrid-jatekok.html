<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRF ⇒ IND-CPA hibridjei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>q: <input id="q" type="range" min="1" max="64" value="5" oninput="calc()" aria-label="Lekérdezések száma q"></label><span id="qv">5</span><label>ℓ: <input id="l" type="range" min="4" max="16" value="4" oninput="calc()" aria-label="Az r bitszáma"></label><span id="lv">4</span><div id="calc" class="small" aria-live="polite" style="flex-basis:100%"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három játék egymás mellett; a nyilakon a PRF-előny és az ütközési tag; az utolsó játékban a nyerési esély 1/2."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Mintaadat: ℓ = 4, q = 5, r = 3, 9, 3, 12, 7. A maszkok szemléltetők (H0: HMAC-alapú játék-PRF, H1/H2: rögzített seedű szimuláció); modell, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 0, "n": 0, "msg": "1. H0: a valódi séma – a kihívó d = F_k(r) ⊕ m-et ad; Pr[H0 = 1] az, amit korlátozni akarunk"}, {"k": 1, "line": 1, "n": 0, "msg": "2. H0 → H1: F_k helyett táblázatos véletlen f; a B redukció O(r)-rel szimulál, így |Pr[H0 = 1] − Pr[H1 = 1]| ≤ Adv_PRF(B)"}, {"k": 2, "line": 2, "n": 1, "msg": "3. H1 → H2: 1. lekérdezés, r = 3: H1 maszk 0x2, H2 maszk 0xD"}, {"k": 2, "line": 2, "n": 2, "msg": "3. H1 → H2: 2. lekérdezés, r = 9: H1 maszk 0x3, H2 maszk 0x8"}, {"k": 2, "line": 2, "n": 3, "msg": "3. H1 → H2: 3. lekérdezés, r = 3: H1 maszk 0x2, H2 maszk 0x6 – r ütközik az 1. lekérdezéssel: H1-ben a maszk ismétlődik, H2-ben új"}, {"k": 2, "line": 2, "n": 4, "msg": "3. H1 → H2: 4. lekérdezés, r = 12: H1 maszk 0xD, H2 maszk 0xF"}, {"k": 2, "line": 2, "n": 5, "msg": "3. H1 → H2: 5. lekérdezés, r = 7: H1 maszk 0xE, H2 maszk 0x8"}, {"k": 3, "line": 3, "n": 5, "msg": "4. Összegzés: Adv ≤ Adv_PRF(B) + q(q − 1)/2^(ℓ+1); ℓ = 4, q = 5: 5·4/32 = 0,625"}];
const CODE = ["Adv^cpa(A) = |Pr[H0 = 1] − 1/2| = |Pr[H0 = 1] − Pr[H2 = 1]|", "          ≤ |Pr[H0 = 1] − Pr[H1 = 1]| + |Pr[H1 = 1] − Pr[H2 = 1]|      (háromszög-egyenlőtlenség)", "          ≤ Adv_PRF(B) + Pr[E]                                          (redukció; E = r-ütközés)", "          ≤ Adv_PRF(B) + q(q − 1) / 2^(ℓ+1)                             (születésnapi korlát)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const RS_ = [3, 9, 3, 12, 7], M0 = [6, 11, 6, 0, 9], M1 = [2, 3, 2, 13, 14], M2 = [13, 8, 6, 15, 8];
function hx(v){ return "0x" + v.toString(16).toUpperCase(); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const cols = [[10, "H0", "d = F_k(r) ⊕ m", M0], [200, "H1", "d = f(r) ⊕ m", M1], [390, "H2", "d = R ⊕ m (friss R)", M2]];
  cols.forEach(([x, nm, fm, mk], i) => {
    const vis = i <= s.k || (i === 2 && s.k >= 2), sw = (i === 1 && s.k === 1) || (i === 2 && s.k === 2);
    el("rect", {x, y: 20, width: 160, height: 62, rx: 8, fill: vis ? css("--cell") : "none", stroke: vis ? css("--line") : css("--muted"), "stroke-width": sw ? 3.5 : 1.3, "stroke-dasharray": vis ? "" : "3 3"});
    el("text", {x: x + 80, y: 44, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, nm + (sw ? " (csere)" : ""));
    el("text", {x: x + 80, y: 68, "text-anchor": "middle", "font-size": 13}, fm);
    if (i >= 1 && s.k >= 2 || i === 0 && s.k >= 2) {
      for (let j = 0; j < s.n; j++) {
        const y = 110 + j * 22, rep = j === 2, same = rep && mk[2] === mk[0];
        el("text", {x: x + 20, y, "font-size": 13, "font-style": rep ? "italic" : "normal"}, "r = " + RS_[j]);
        el("text", {x: x + 75, y, "font-size": 13, "font-weight": rep ? "bold" : "normal", fill: rep ? css("--hl2") : css("--fg")}, hx(mk[j]) + (same ? " = 1. ✱" : (rep ? " új" : "")));
      }
    }
  });
  if (s.k >= 1) { el("text", {x: 185, y: 14, "text-anchor": "middle", "font-size": 12}, "≤ Adv_PRF(B)"); el("line", {x1: 172, y1: 50, x2: 196, y2: 50, stroke: css("--line"), "stroke-width": 2}); }
  if (s.k >= 2) { el("text", {x: 375, y: 14, "text-anchor": "middle", "font-size": 12}, "≤ q(q−1)/2^(ℓ+1)"); el("line", {x1: 362, y1: 50, x2: 386, y2: 50, stroke: css("--line"), "stroke-width": 2}); }
  if (s.k >= 3) {
    el("text", {x: 470, y: 248, "text-anchor": "middle", "font-size": 14}, "Pr[b' = b] = 1/2");
    el("text", {x: 10, y: 285, "font-size": 14, "font-weight": "bold"}, "Adv ≤ Adv_PRF(B) + q(q−1)/2^(ℓ+1) = Adv_PRF(B) + 0,625 (ℓ = 4, q = 5)");
  }
}
// ---- q, l kalkulátor: korlát, pontos születésnapi valószínűség, szimulált gyakoriság (rögzített seed) ----
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function calc(){
  const q = +document.getElementById("q").value, l = +document.getElementById("l").value, N = Math.pow(2, l);
  document.getElementById("qv").textContent = q; document.getElementById("lv").textContent = l;
  const b = q * (q - 1) / Math.pow(2, l + 1);
  let p = 1; for (let i = 0; i < q; i++) p *= Math.max(0, 1 - i / N);
  const rnd = mulberry(67), T = 4000; let hit = 0;
  for (let t = 0; t < T; t++) { const seen = new Set(); let c = false; for (let i = 0; i < q; i++) { const r = Math.floor(rnd() * N); if (seen.has(r)) { c = true; break; } seen.add(r); } if (c) hit++; }
  const f = x => x.toFixed(4).replace(".", ",");
  document.getElementById("calc").textContent = `q = ${q}, ℓ = ${l}: korlát q(q−1)/2^(ℓ+1) = ${f(b)}${b > 1 ? " (> 1, semmitmondó)" : ""}; pontos Pr[E] = ${f(1 - p)}; szimulált ütközési gyakoriság (${T} futás, rögzített seed) = ${f(hit / T)}`;
}

document.addEventListener('DOMContentLoaded', calc);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
