<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Håstad-támadás CRT-vel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját m (2 ≤ m &lt; 115): <input id="mm" type="number" value="100" min="2" max="400" style="width:6em" aria-label="Saját üzenet m"></label><button onclick="loadM()">Számol</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három óra mod 187, 115 és 1189 a 111, 75, 51 maradékkal; a CRT az 1 000 000 = 100 a köbön egészt adja, amely kisebb az M = 25 569 445 szorzatnál."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Érvényes e = 3 kulcsok (3 nem osztja φ(N_i)-t): N = 11·17, 5·23, 29·41. Oktatási játékpélda, NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"m": 100, "ns": [187, 115, 1189], "cs": [111, 75, 51], "M": 25569445, "Mi": [136735, 222343, 21505], "Mimod": [38, 48, 103], "inv": [64, 12, 658], "terms": [971365440, 200108700, 721664790], "x": 1000000, "root": 100, "st": 1, "line": 1, "msg": "1. Rejtett szövegek: c_i = 100³ mod N_i → c = (111, 75, 51)"}, {"m": 100, "ns": [187, 115, 1189], "cs": [111, 75, 51], "M": 25569445, "Mi": [136735, 222343, 21505], "Mimod": [38, 48, 103], "inv": [64, 12, 658], "terms": [971365440, 200108700, 721664790], "x": 1000000, "root": 100, "st": 2, "line": 4, "msg": "2. M = 25 569 445; M_i mod N_i = (38, 48, 103), inverzek: (64, 12, 658)"}, {"m": 100, "ns": [187, 115, 1189], "cs": [111, 75, 51], "M": 25569445, "Mi": [136735, 222343, 21505], "Mimod": [38, 48, 103], "inv": [64, 12, 658], "terms": [971365440, 200108700, 721664790], "x": 1000000, "root": 100, "st": 3, "line": 5, "msg": "3. CRT-összeg: Σ c_i·M_i·(M_i⁻¹ mod N_i) mod M = 1 000 000"}, {"m": 100, "ns": [187, 115, 1189], "cs": [111, 75, 51], "M": 25569445, "Mi": [136735, 222343, 21505], "Mimod": [38, 48, 103], "inv": [64, 12, 658], "terms": [971365440, 200108700, 721664790], "x": 1000000, "root": 100, "st": 4, "line": 6, "msg": "4. x = 1 000 000, ∛x = 100 → az üzenet visszanyerve"}];
const CODE = ["Ns = [187, 115, 1189]            # 11·17, 5·23, 29·41: 3 ∤ φ(N_i)", "cs = [pow(m, 3, n) for n in Ns]   # elfogott rejtett szövegek", "M = Ns[0] * Ns[1] * Ns[2]", "Mi = [M // n for n in Ns]", "inv = [pow(a, -1, n) for a, n in zip(Mi, Ns)]", "x = sum(c * a * b for c, a, b in zip(cs, Mi, inv)) % M", "m = egesz_kobgyok(x)              # pontos köb, mert x < M"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

function render(s){
  svg.setAttribute("viewBox", "0 0 560 332");
  svg.innerHTML = "";
  const dash = ["", "6 4", "2 4"], R = 52, cx = [100, 280, 460];
  s.ns.forEach((n, i) => {
    el("circle", {cx: cx[i], cy: 90, r: R, fill: "none", stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": dash[i]});
    el("text", {x: cx[i], y: 90 - R - 6, "text-anchor": "middle", "font-size": 11}, "0");
    const a = 2 * Math.PI * s.cs[i] / n, x = cx[i] + R * Math.sin(a), y = 90 - R * Math.cos(a);
    el("line", {x1: cx[i], y1: 90, x2: x, y2: y, stroke: css("--line")});
    el("circle", {cx: x, cy: y, r: 6, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: cx[i], y: 165, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "c" + (i + 1) + " = " + s.cs[i]);
    el("text", {x: cx[i], y: 182, "text-anchor": "middle", "font-size": 12}, "mod " + n);
    if (s.st >= 2) el("text", {x: cx[i], y: 200, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "M_i mod N_i = " + s.Mimod[i] + ", inv = " + s.inv[i]);
    if (s.st >= 3) el("text", {x: cx[i], y: 216, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "tag: " + hu(s.terms[i]));
  });
  // logaritmikus számegyenes 10^1 … 10^8
  const X = v => 30 + (Math.log10(v) - 1) / 7 * 500, y0 = 280;
  el("line", {x1: 30, y1: y0, x2: 530, y2: y0, stroke: css("--line"), "stroke-width": 1.5});
  for (let e = 1; e <= 8; e++) { el("line", {x1: X(10 ** e), y1: y0 - 4, x2: X(10 ** e), y2: y0 + 4, stroke: css("--line")}); el("text", {x: X(10 ** e), y: y0 + 18, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "10^" + e); }
  if (s.st >= 2) {
    el("rect", {x: X(s.M), y: y0 - 14, width: 530 - X(s.M), height: 14, fill: css("--cellhl"), opacity: 0.7});
    el("line", {x1: X(s.M), y1: y0 - 22, x2: X(s.M), y2: y0 + 6, stroke: css("--line"), "stroke-width": 3});
    el("text", {x: X(s.M), y: y0 - 26, "text-anchor": "middle", "font-size": 11}, "M = " + hu(s.M));
  }
  if (s.st >= 3) {
    const big = s.m ** 3 >= s.M;
    el("rect", {x: X(Math.max(s.x, 10)) - 6, y: y0 - 6, width: 12, height: 12, fill: css("--line")});
    el("text", {x: X(Math.max(s.x, 10)), y: y0 - 30 - (Math.abs(X(s.x) - X(s.M)) < 90 ? 14 : 0), "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "x = " + hu(s.x));
  }
  if (s.st >= 4) el("text", {x: 280, y: 322, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"},
     s.root !== null ? ("x < M ⇒ x = m³ egészként, ∛x = " + s.root) : "x nem pontos köb: m³ ≥ M, a támadás itt nem működik");
}
function attackJS(m){
  const ns = [187, 115, 1189], cs = ns.map(n => powm(m, 3, n)), M = ns[0] * ns[1] * ns[2];
  const Mi = ns.map(n => M / n), Mimod = Mi.map((a, i) => a % ns[i]), inv = Mi.map((a, i) => invm(a, ns[i]));
  const terms = cs.map((c, i) => c * Mi[i] * inv[i]), x = terms.reduce((a, b) => a + b, 0) % M;
  const r = Math.round(Math.cbrt(x)); let root = null; for (const t of [r - 1, r, r + 1]) if (t ** 3 === x) root = t;
  const b = {m, ns, cs, M, Mi, Mimod, inv, terms, x, root};
  return [
    Object.assign({}, b, {st: 1, line: 1, msg: "1. Rejtett szövegek: c_i = " + m + "³ mod N_i → c = (" + cs.join(", ") + ")"}),
    Object.assign({}, b, {st: 2, line: 4, msg: "2. M = " + hu(M) + "; M_i mod N_i = (" + Mimod.join(", ") + "), inverzek: (" + inv.join(", ") + ")"}),
    Object.assign({}, b, {st: 3, line: 5, msg: "3. CRT-összeg: Σ c_i·M_i·(M_i⁻¹ mod N_i) mod M = " + hu(x)}),
    Object.assign({}, b, {st: 4, line: 6, msg: root !== null ? ("4. x = " + hu(x) + ", ∛x = " + root + " → az üzenet visszanyerve") : ("4. x = " + hu(x) + " nem pontos köb (m³ ≥ M) – a köbgyök hibás")}),
  ];
}
function loadM(){
  const v = Number(document.getElementById("mm").value), err = document.getElementById("err");
  if (!Number.isInteger(v) || v < 2) { err.textContent = "Adjon meg 2-nél nagyobb vagy egyenlő egész m-et."; return; }
  if (v >= 115) { err.textContent = "Hiba: m = " + v + " ≥ min N_i = 115 – az üzenet nem fér el minden modulusban (m < min N_i kell)."; return; }
  err.textContent = v ** 3 >= 25569445 ? "Figyelem: m³ ≥ M, a köbgyök hibás lesz." : "";
  setSteps(attackJS(v));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
