<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-szivacs lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját 8 bites üzenet (hex): <input id="inp" value="1A" size="4" aria-label="Saját üzenet két hexa jeggyel"></label><button onclick="load()">Újraszámolás</button><button onclick="document.getElementById('inp').value='2C';load()">Példa: 0x2C</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolcbites állapot kilenc lépésen át, a felső négy bit a rate, az alsó négy a rejtett capacity; a kimenet E, 7, 5."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játékparaméterek (b = 8, r = 4, c = 4), számított, nem valódi Keccak. Kezdőállapot: a 13.3.3 példája, m = 0x1A.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"S": 0, "kind": "init", "name": "Kezdet", "out": "", "line": 0, "chg": [], "msg": "1. lépés: kezdetben S = 0x00 (rate = 0x0, capacity = 0x0)"}, {"S": 16, "kind": "xor", "name": "Abszorpció 1 (⊕ m0)", "out": "", "line": 2, "chg": [3], "msg": "2. lépés: m0 = 0x1 XOR a rate-be: 0x00 ⊕ 0x10 = 0x10"}, {"S": 133, "kind": "f", "name": "f (permutáció)", "out": "", "line": 3, "chg": [0, 3, 5, 7], "msg": "3. lépés: f(0x10) = rotl1(0x10) ⊕ 0xA5 = 0x20 ⊕ 0xA5 = 0x85"}, {"S": 37, "kind": "xor", "name": "Abszorpció 2 (⊕ m1)", "out": "", "line": 2, "chg": [0, 2], "msg": "4. lépés: m1 = 0xA XOR a rate-be: 0x85 ⊕ 0xA0 = 0x25"}, {"S": 239, "kind": "f", "name": "f (permutáció)", "out": "", "line": 3, "chg": [0, 1, 4, 6], "msg": "5. lépés: f(0x25) = rotl1(0x25) ⊕ 0xA5 = 0x4A ⊕ 0xA5 = 0xEF"}, {"S": 239, "kind": "out", "name": "Kipréselés 1", "out": "E", "line": 6, "chg": [], "msg": "6. lépés: kimeneti blokk = a rate (felső 4 bit) = 0xE; a capacity (0xF) rejtve marad"}, {"S": 122, "kind": "f", "name": "f (permutáció)", "out": "E", "line": 7, "chg": [0, 3, 5, 7], "msg": "7. lépés: f(0xEF) = rotl1(0xEF) ⊕ 0xA5 = 0xDF ⊕ 0xA5 = 0x7A"}, {"S": 122, "kind": "out", "name": "Kipréselés 2", "out": "E 7", "line": 6, "chg": [], "msg": "8. lépés: kimeneti blokk = a rate (felső 4 bit) = 0x7; a capacity (0xA) rejtve marad"}, {"S": 81, "kind": "fout", "name": "f, majd kimenet", "out": "E 7 5", "line": 7, "chg": [2, 4, 6, 7], "msg": "9. lépés: f(0x7A) = rotl1(0x7A) ⊕ 0xA5 = 0xF4 ⊕ 0xA5 = 0x51; a harmadik kimeneti blokk 0x5. Kimenet: E 7 5"}];
const CODE = ["S <- 0x00                       # b = 8, r = 4, c = 4", "for i in 0, 1:                  # abszorpció", "    S <- S XOR (m_i << 4)       # a blokk a rate-be (felső 4 bit)", "    S <- f(S)                   # f(x) = rotl1(x) XOR 0xA5", "kimenet <- []", "repeat 3 times:                 # kipréselés", "    kimenet.append(S >> 4)      # csak a rate-et olvassuk", "    S <- f(S)                   # (az utolsó blokk előtt)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hx(v){return "0x" + v.toString(16).toUpperCase().padStart(2, "0");}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 260");
  svg.innerHTML = "";
  const x0 = 100, y0 = 100, w = 45, h = 52;
  el("text", {x: x0 + 2*w, y: y0 - 42, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "rate r = 4");
  el("text", {x: x0 + 6*w, y: y0 - 42, "text-anchor": "middle", "font-size": 14}, "capacity c = 4 (rejtett)");
  for (let i = 0; i < 8; i++) {
    const b = (s.S >> (7 - i)) & 1, rate = i < 4, on = s.chg.includes(i);
    el("rect", {x: x0 + i*w, y: y0, width: w, height: h, fill: rate ? css("--cell") : css("--cellhl"),
                stroke: css("--line"), "stroke-width": on ? 4 : (rate ? 2 : 1), "stroke-dasharray": rate ? "" : "4 3"});
    if (!rate) for (let t = 0; t < 4; t++) el("line", {x1: x0 + i*w + t*12, y1: y0 + h, x2: x0 + i*w + t*12 + 12, y2: y0 + h - 14, stroke: css("--muted"), "stroke-width": 0.8});
    el("text", {x: x0 + i*w + w/2, y: y0 + h/2 + 7, "text-anchor": "middle", "font-size": 20, "font-weight": on ? "bold" : "normal"}, String(b));
  }
  el("text", {x: x0 + 8*w + 14, y: y0 + h/2 + 6, "font-size": 18, "font-family": "monospace"}, hx(s.S));
  if (s.kind === "xor") {
    el("line", {x1: x0 + 2*w, y1: y0 - 34, x2: x0 + 2*w, y2: y0 - 4, stroke: css("--hl"), "stroke-width": 2.5});
    el("polygon", {points: `${x0+2*w-6},${y0-12} ${x0+2*w+6},${y0-12} ${x0+2*w},${y0-2}`, fill: css("--hl")});
  }
  if (s.kind === "out" || s.kind === "fout") {
    el("line", {x1: x0 + 2*w, y1: y0 + h + 4, x2: x0 + 2*w, y2: y0 + h + 34, stroke: css("--hl2"), "stroke-width": 2.5});
    el("polygon", {points: `${x0+2*w-6},${y0+h+26} ${x0+2*w+6},${y0+h+26} ${x0+2*w},${y0+h+36}`, fill: css("--hl2")});
  }
  if (s.kind === "f" || s.kind === "fout") {
    el("rect", {x: 8, y: y0 + 6, width: 80, height: 40, fill: "none", stroke: css("--line"), "stroke-width": 1.5, rx: 6});
    el("text", {x: 48, y: y0 + 31, "text-anchor": "middle", "font-size": 14}, "f");
  }
  el("text", {x: x0, y: 215, "font-size": 16}, "Kimenet: " + (s.out || "–"));
  el("text", {x: x0, y: 245, "font-size": 12, fill: css("--muted")}, "vastag keret = megváltozott bit · sraffozott = capacity (sosem kerül a kimenetbe)");
}
function rotl(x){return ((x << 1) | (x >> 7)) & 255;}
function ff(x){return rotl(x) ^ 0xA5;}
function trace(m){
  const st = []; let S = 0; const out = [];
  const diff = (a, b) => [0,1,2,3,4,5,6,7].filter(i => ((a ^ b) >> (7 - i)) & 1);
  st.push({S, kind: "init", out: "", line: 0, chg: [], msg: "1. lépés: kezdetben S = 0x00 (rate = 0x0, capacity = 0x0)"});
  const add = (kind, msg, line, chg) => st.push({S, kind, out: out.join(" "), line, chg, msg: (st.length + 1) + ". lépés: " + msg});
  [m >> 4, m & 15].forEach((mb, j) => {
    let o = S; S ^= mb << 4;
    add("xor", `m${j} = 0x${mb.toString(16).toUpperCase()} XOR a rate-be: ${hx(o)} ⊕ 0x${mb.toString(16).toUpperCase()}0 = ${hx(S)}`, 2, diff(o, S));
    o = S; S = ff(S);
    add("f", `f(${hx(o)}) = rotl1(${hx(o)}) ⊕ 0xA5 = ${hx(rotl(o))} ⊕ 0xA5 = ${hx(S)}`, 3, diff(o, S));
  });
  for (let j = 0; j < 3; j++) {
    if (j) { const o = S; S = ff(S); add("f", `f(${hx(o)}) = rotl1(${hx(o)}) ⊕ 0xA5 = ${hx(rotl(o))} ⊕ 0xA5 = ${hx(S)}`, 7, diff(o, S)); }
    out.push((S >> 4).toString(16).toUpperCase());
    if (j < 2) add("out", `kimeneti blokk = a rate (felső 4 bit) = 0x${(S >> 4).toString(16).toUpperCase()}; a capacity (0x${(S & 15).toString(16).toUpperCase()}) rejtve marad`, 6, []);
    else { const L = st[st.length - 1]; L.out = out.join(" "); L.kind = "fout"; L.msg += `; a harmadik kimeneti blokk 0x${(S >> 4).toString(16).toUpperCase()}. Kimenet: ${out.join(" ")}`; }
  }
  return st;
}
function load(){
  const v = document.getElementById("inp").value.trim().replace(/^0x/i, "");
  const e = document.getElementById("err");
  if (!/^[0-9a-fA-F]{2}$/.test(v)) { e.textContent = "Két hexadecimális jegyet adjon meg (pl. 1A)."; return; }
  e.textContent = ""; setSteps(trace(parseInt(v, 16)));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
