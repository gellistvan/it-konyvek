<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regev-visszafejtés a Z_q körön</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--cell:#fff;--cellhl:#d9d9d9;--cell2:#bdbdbd;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--cell:#262626;--cellhl:#4a4a4a;--cell2:#666;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px;flex:1}
input[type=number]{width:5.5em}
label{display:inline-flex;gap:4px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label>q: <select id="q"><option value="17" selected>17</option><option value="101">101</option></select></label>
<span role="radiogroup" aria-label="Titkosított bit"><label><input type="radio" name="mu" value="0"> μ = 0</label>
<label><input type="radio" name="mu" value="1" checked> μ = 1</label></span>
<label>e·r: <input id="er" type="range" min="-8" max="8" value="0" aria-label="hiba e·r"><b id="erv">0</b></label>
<button id="rnd">Véletlen minta</button>
</div><div class="ctl small" id="sample"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 420" role="img" aria-label="Körön a 0 és a 8 körüli két döntési tartomány; a d = 8 pont az 1-es tartományban van."></svg>

<p class="small">Számított, nem mérés. Döntési szabály a fejezet kódja szerint: 0, ha d körkörös távolsága 0-tól kisebb, mint ⌊q/2⌋-től; egyenlő távolságnál 1. A „Véletlen minta” q = 17-re a 34.2.8 kódjának e = (1, 0, −1, 0) hibáját és véletlen r-t, q = 101-re a 4. feladat paramétereit (m = 16, B = 2) használja.</p>
<script>
const DATA = {"st0": "μ = 1, e·r = 0: d = 8, távolság 0-tól: 8, 8-tól: 0 (>) → bit = 1 ✓"};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","\u2212");}

function cd(a, b, q){ const d = ((a - b) % q + q) % q; return Math.min(d, q - d); }
function statusStr(q, mu, er){ const h = Math.floor(q / 2), dd = ((er + h * mu) % q + q) % q, d0 = cd(dd, 0, q), d1 = cd(dd, h, q);
  const bit = d0 < d1 ? 0 : 1, rel = d0 < d1 ? "<" : (d0 === d1 ? "=" : ">");
  return `μ = ${mu}, e·r = ${er}: d = ${dd}, távolság 0-tól: ${d0}, ${h}-tól: ${d1} (${rel}) → bit = ${bit}` + (bit === mu ? " ✓" : " ✗ HIBÁS") + (d0 === d1 ? " (egyenlő távolság, a kód szabálya: 1)" : ""); }
function g(id){ return document.getElementById(id); }
function redraw(){
  const q = +g("q").value, mu = +document.querySelector("input[name=mu]:checked").value, er = +g("er").value, h = Math.floor(q / 2);
  g("erv").textContent = er; svg.innerHTML = "";
  const cx = 230, cy = 210, R = 160, A = v => (-90 + 360 * v / q) * Math.PI / 180;
  const defs = el("defs", {});
  const mk = (id, d) => { const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", 6); p.setAttribute("height", 6); p.setAttribute("patternUnits", "userSpaceOnUse");
    const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", d); pa.setAttribute("stroke", css("--fg")); pa.setAttribute("stroke-width", 1); pa.setAttribute("fill", "none"); p.appendChild(pa); defs.appendChild(p); };
  mk("p0", "M3 3 h0.6"); mk("p1", "M0 6 L6 0");
  for (let v = 0; v < q; v++) { const a1 = A(v - 0.5), a2 = A(v + 0.5), r0 = R - 40, reg0 = cd(v, 0, q) < cd(v, h, q);
    const P = (r, a) => `${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}`;
    el("path", {d: `M ${P(r0, a1)} L ${P(R, a1)} A ${R} ${R} 0 0 1 ${P(R, a2)} L ${P(r0, a2)} A ${r0} ${r0} 0 0 0 ${P(r0, a1)} Z`,
      fill: reg0 ? "url(#p0)" : "url(#p1)", stroke: css("--line"), "stroke-width": 0.5});
    if (q <= 17 || v % 10 === 0 || v === h) el("text", {x: cx + (R + 16) * Math.cos(A(v)), y: cy + (R + 16) * Math.sin(A(v)) + 5, "text-anchor": "middle", "font-size": 13, "font-weight": (v === 0 || v === h) ? "bold" : "normal"}, String(v)); }
  const dd = ((er + h * mu) % q + q) % q, base = h * mu;
  // eltolás íve a hibátlan értéktől d-ig
  if (er !== 0) { const n = 40, ra = R - 60; let p = "";
    for (let t = 0; t <= n; t++) { const a = A(base + er * t / n); p += (t ? " L " : "M ") + (cx + ra * Math.cos(a)) + " " + (cy + ra * Math.sin(a)); }
    el("path", {d: p, fill: "none", stroke: css("--hl2"), "stroke-width": 3}); }
  el("circle", {cx: cx + (R - 20) * Math.cos(A(base)), cy: cy + (R - 20) * Math.sin(A(base)), r: 6, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  el("circle", {cx: cx + (R - 20) * Math.cos(A(dd)), cy: cy + (R - 20) * Math.sin(A(dd)), r: 10, fill: css("--fg")});
  el("text", {x: cx, y: cy - 6, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, `d = ${dd}`);
  el("text", {x: cx, y: cy + 16, "text-anchor": "middle", "font-size": 13}, `⌊q/4⌋ = ${Math.floor(q / 4)}`);
  // jelmagyarázat
  el("rect", {x: 440, y: 60, width: 22, height: 16, fill: "url(#p0)", stroke: css("--line")}); el("text", {x: 470, y: 73, "font-size": 13}, "0-tartomány");
  el("rect", {x: 440, y: 88, width: 22, height: 16, fill: "url(#p1)", stroke: css("--line")}); el("text", {x: 470, y: 101, "font-size": 13}, "1-tartomány");
  el("circle", {cx: 451, cy: 128, r: 6, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2}); el("text", {x: 470, y: 133, "font-size": 13}, `⌊q/2⌋·μ = ${base}`);
  el("circle", {cx: 451, cy: 156, r: 8, fill: css("--fg")}); el("text", {x: 470, y: 161, "font-size": 13}, "d = e·r + ⌊q/2⌋·μ");
  el("line", {x1: 440, y1: 184, x2: 462, y2: 184, stroke: css("--hl2"), "stroke-width": 3}); el("text", {x: 470, y: 189, "font-size": 13}, "hibaeltolás e·r");
  g("status").textContent = statusStr(q, mu, er);
}
g("q").onchange = () => { const q = +g("q").value, h = Math.floor(q / 2); g("er").min = -h; g("er").max = h; g("er").value = 0; g("sample").textContent = ""; redraw(); };
document.querySelectorAll("input[name=mu]").forEach(r => r.onchange = redraw);
g("er").oninput = redraw;
g("rnd").onclick = () => {
  const q = +g("q").value, u = new Uint32Array(32); crypto.getRandomValues(u);
  let e, r;
  if (q === 17) { e = [1, 0, -1, 0]; r = [0, 1, 2, 3].map(i => u[i] & 1); }     // a 34.2.8 kódja: rögzített e, véletlen r
  else { e = Array.from({length: 16}, (_, i) => (u[i] % 5) - 2); r = Array.from({length: 16}, (_, i) => u[16 + i] & 1); }  // 4. feladat: m = 16, B = 2
  const er = e.reduce((s, x, i) => s + x * r[i], 0); g("er").value = er; redraw();
  g("sample").textContent = `e = (${e.join(", ")}), r = (${r.join(", ")}) → e·r = ${er}` + (q === 101 ? " (m = 16, B = 2: |e·r| ≤ 32 > ⌊q/4⌋ = 25, a helyesség nem garantált)" : "");
};
redraw();
window.addEventListener("load", () => { document.body.dataset.selftest = g("status").textContent === DATA.st0 ? "ok" : "mismatch"; });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (typeof redraw === "function") redraw(); });
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
