<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Születésnapi görbe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="n">n =</label> <input id="n" type="range" min="0" max="80" step="1" value="23" aria-label="n, a minta mérete">
  <span id="nv" class="small"></span>
</div>
<div class="ctl">
  <label>N = <select id="N" aria-label="N, a lehetséges értékek száma">
    <option value="365" selected>365</option><option value="65536">2^16</option><option value="4294967296">2^32</option></select></label>
  <label><input id="scale" type="checkbox"> x tengely: n/√N (a görbék egymásra esnek)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Három görbe: pontos és közelítő ütközési valószínűség, valamint célzott találat"></svg>
<p class="small">Pontos: 1 − ∏(1 − i/N) (teli pontok, N = 365-nél minden egész n); közelítés: 1 − e^(−n²/(2N)) (folytonos); célzott találat: 1 − (1 − 1/N)^n (szaggatott). Számított értékek (6.1.8).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v"), st = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const nI = document.getElementById("n"), NI = document.getElementById("N"), sc = document.getElementById("scale");
let N = 365, NMAX = 80, LOGP = null;
function prep(){
  N = +NI.value; NMAX = Math.round(80 / Math.sqrt(365) * Math.sqrt(N));
  LOGP = new Float64Array(NMAX + 2); LOGP[0] = 0; LOGP[1] = 0;
  for (let n = 2; n <= NMAX + 1; n++) LOGP[n] = LOGP[n - 1] + Math.log1p(-(n - 1) / N);
  nI.max = NMAX;
}
const ex = n => 1 - Math.exp(LOGP[Math.min(n, NMAX + 1)]);
const ap = n => -Math.expm1(-n * n / (2 * N));
const tg = n => -Math.expm1(n * Math.log1p(-1 / N));
const f4 = x => x.toFixed(4).replace(".", ",");
function draw(){
  svg.innerHTML = "";
  const L = 52, R = 540, T = 14, B = 276, s = sc.checked, xmax = s ? 80 / Math.sqrt(365) : NMAX;
  const X = u => L + (R - L) * u / xmax, Y = p => B - (B - T) * p;
  const toU = n => s ? n / Math.sqrt(N) : n;
  for (let k = 0; k <= 5; k++) { const p = k / 5; el("line", {x1: L, x2: R, y1: Y(p), y2: Y(p), stroke: css("--cellhl"), "stroke-width": 0.6});
    el("text", {x: L - 6, y: Y(p) + 4, "text-anchor": "end", "font-size": 11}, String(p).replace(".", ",")); }
  for (let k = 0; k <= 4; k++) { const u = xmax * k / 4; el("text", {x: X(u), y: B + 16, "text-anchor": "middle", "font-size": 11},
    s ? u.toFixed(2).replace(".", ",") : String(Math.round(u))); }
  el("line", {x1: L, x2: R, y1: B, y2: B, stroke: css("--line")}); el("line", {x1: L, x2: L, y1: T, y2: B, stroke: css("--line")});
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, s ? "n / √N" : "n");
  el("line", {x1: L, x2: R, y1: Y(0.5), y2: Y(0.5), stroke: css("--line"), "stroke-dasharray": "2 4"});
  const path = f => { let d = ""; for (let i = 0; i <= 300; i++) { const n = NMAX * i / 300; d += (i ? "L" : "M") + X(toU(n)).toFixed(1) + " " + Y(f(n)).toFixed(1); } return d; };
  el("path", {d: path(ap), fill: "none", stroke: css("--muted"), "stroke-width": 2});
  el("path", {d: path(tg), fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  const step = Math.max(1, Math.ceil(NMAX / 80));
  for (let n = 0; n <= NMAX; n += step) el("circle", {cx: X(toU(n)), cy: Y(ex(n)), r: 2.6, fill: css("--fg")});
  const n = +nI.value;
  el("line", {x1: X(toU(n)), x2: X(toU(n)), y1: T, y2: B, stroke: css("--hl2"), "stroke-width": 1.5, "stroke-dasharray": "3 3"});
  [[ex(n), 5, "fill"], [ap(n), 5, "none"], [tg(n), 5, "none"]].forEach(([p, r, f]) => el("circle", {cx: X(toU(n)), cy: Y(p), r, fill: f === "fill" ? css("--hl2") : css("--bg"), stroke: css("--hl2"), "stroke-width": 2}));
  const lg = [["●", "pontos"], ["—", "közelítés"], ["- -", "célzott"]];
  lg.forEach(([m, t], i) => { el("text", {x: R - 110, y: B - 60 + i * 17, "font-size": 12}, m + " " + t); });
  document.getElementById("nv").textContent = "n = " + n + (s ? " (n/√N = " + (n / Math.sqrt(N)).toFixed(3).replace(".", ",") + ")" : "");
  st.textContent = `n = ${n}: pontos ${f4(ex(n))}, közelítés ${f4(ap(n))}, célzott ${f4(tg(n))}`;
}
NI.onchange = () => { const frac = +nI.value / NMAX; prep(); nI.value = Math.round(frac * NMAX); draw(); };
nI.oninput = draw; sc.onchange = draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
prep(); nI.value = 23; draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
