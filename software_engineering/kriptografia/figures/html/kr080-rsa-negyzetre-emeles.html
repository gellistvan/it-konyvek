<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSA ismételt négyzetre emeléssel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>p <input id="ip" type="number" min="3" value="11" style="width:4.8em"></label>
<label>q <input id="iq" type="number" min="3" value="17" style="width:4.8em"></label>
<label>e <input id="ie" type="number" min="3" value="7" style="width:4.8em"></label>
<label>m <input id="im" type="number" min="0" value="42" style="width:5.5em"></label>
<button id="go">Újraszámolás</button>
<span id="warn" role="alert" style="color:var(--hl2)"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Titkosítás: 42^(2^i) mod 187 = 42, 81, 16, e = 111 kettes számrendszerben, 16·81 ≡ 174, 174·42 ≡ 15. Visszafejtés: 15^(2^i) = 15, 38, 135, 86, 103, d = 10111, a kiválasztott hatványok 103, 135, 38, 15, 103·135 ≡ 67, 67·38 ≡ 115, 115·15 ≡ 42."></svg>

</div>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek

function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function isPrime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
function mulmod(a,b,m){return Number(BigInt(a)*BigInt(b)%BigInt(m));}
function invmod(a,m){let [r0,r1]=[a,m],[s0,s1]=[1,0];while(r1){const t=Math.floor(r0/r1);[r0,r1]=[r1,r0-t*r1];[s0,s1]=[s1,s0-t*s1];}return ((s0%m)+m)%m;}
function rowOf(base,k,N){ const nb=k.toString(2).length, pows=[base%N]; for(let i=1;i<nb;i++) pows.push(mulmod(pows[i-1],pows[i-1],N));
  const bits=[]; for(let i=0;i<nb;i++) bits.push(Math.floor(k/Math.pow(2,i))%2);
  const sel=[]; for(let i=nb-1;i>=0;i--) if(bits[i]) sel.push(i);
  const chain=[]; let acc=pows[sel[0]]; for(const i of sel.slice(1)){ const na=mulmod(acc,pows[i],N); chain.push([acc,pows[i],na]); acc=na; }
  return {base:base,k:k,pows:pows,bits:bits,sel:sel,chain:chain,res:acc}; }
function rsaOf(p,q,e,m){ const N=p*q, lam=(p-1)*(q-1)/gcd(p-1,q-1), d=invmod(e,lam), enc=rowOf(m,e,N), dec=rowOf(enc.res,d,N);
  return {p:p,q:q,N:N,lam:lam,e:e,d:d,m:m,enc:enc,dec:dec}; }
function stepsFor(R){ const out=[]; const B=()=>Object.assign({},R);
  out.push(Object.assign(B(),{ph:"key",es:0,em:0,ds:0,dm:0,line:5,msg:`Kulcsgenerálás: N = ${R.p}·${R.q} = ${R.N}, λ(N) = lcm(${R.p-1}, ${R.q-1}) = ${R.lam}, e = ${R.e}, d = e^(−1) mod λ = ${R.d} (${R.e}·${R.d} = ${R.e*R.d} ≡ 1).`}));
  [["enc","Titkosítás","e"],["dec","Visszafejtés","d"]].forEach(([key,lab,vr])=>{ const rw=R[key], sqk=key==="enc"?"es":"ds", mk=key==="enc"?"em":"dm";
    const done= key==="dec" ? {es:R.enc.pows.length, em:R.enc.chain.length} : {}; const bstr=rw.bits.slice().reverse().join("");
    rw.pows.forEach((v,i)=>{ const st=Object.assign(B(),{ph:key,es:0,em:0,ds:0,dm:0,line:key==="enc"?7:9},done); st[sqk]=i+1;
      const bit=rw.bits[i], how= i===0?"":` = ${rw.pows[i-1]}^2 mod ${R.N}`;
      st.msg=`${lab}, i = ${i}: ${rw.base}^${Math.pow(2,i)} ≡ ${v}${how}; ${vr} = ${bstr}₂, bit = ${bit}, `+(bit?"kiválasztjuk.":"kihagyjuk."); out.push(st); });
    rw.chain.forEach(([a,b,c],j)=>{ const st=Object.assign(B(),{ph:key,es:0,em:0,ds:0,dm:0,line:key==="enc"?7:9},done); st[sqk]=rw.pows.length; st[mk]=j+1;
      st.msg=`${lab}, szorzás: ${a}·${b} = ${a*b} ≡ ${c} (mod ${R.N})`+(j===rw.chain.length-1?` → ${key==="enc"?"c":"m"} = ${c}.`:"."); out.push(st); }); });
  return out; }
function render(s){
  const nE=s.enc.pows.length, nD=s.dec.pows.length, n=Math.max(nE,nD), cw=Math.max(44,Math.min(80,560/n)), W=Math.max(760,150+n*(cw+8)+40);
  svg.setAttribute("viewBox",`0 0 ${W} 400`); svg.innerHTML="";
  const hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line");
  el("text",{x:10,y:22,"font-size":14,"font-weight":s.ph==="key"?"bold":"normal",fill:s.ph==="key"?hl:css("--fg")},`p = ${s.p}, q = ${s.q}, N = ${s.N}, λ(N) = ${s.lam}, e = ${s.e}, d = ${s.d}, m = ${s.m}`);
  function rowDraw(rw,y,title,vr,sq,mu2,act){
    el("text",{x:10,y:y,"font-size":14,"font-weight":"bold",fill:act?hl:css("--fg")},title);
    el("text",{x:10,y:y+42,"font-size":12,fill:mu},`${rw.base}^(2^i) mod N`); el("text",{x:10,y:y+72,"font-size":12,fill:mu},`${vr} bitje`);
    rw.pows.forEach((v,i)=>{ const x=150+i*(cw+8), on=rw.bits[i]===1, shown=i<sq, cur=act&&i===sq-1&&mu2===0;
      el("text",{x:x+cw/2,y:y+14,"text-anchor":"middle","font-size":11,fill:mu},"i="+i);
      el("rect",{x:x,y:y+22,width:cw,height:32,fill:shown?(on?css("--cell"):css("--cellhl")):css("--bg"),stroke:cur?hl:ln,"stroke-width":cur?3:1,"stroke-dasharray":shown?"":"3 3"});
      if(shown&&on) el("rect",{x:x+3,y:y+25,width:cw-6,height:26,fill:"none",stroke:ln,"stroke-width":1.2});
      if(shown&&!on) el("line",{x1:x+3,y1:y+51,x2:x+cw-3,y2:y+25,stroke:mu,"stroke-width":1});
      if(shown) el("text",{x:x+cw/2,y:y+44,"text-anchor":"middle","font-size":14,"font-weight":on?"bold":"normal"},String(v));
      el("text",{x:x+cw/2,y:y+74,"text-anchor":"middle","font-size":13},String(rw.bits[i])); });
    const parts=rw.chain.slice(0,mu2).map(([a,b,c])=>`${a}·${b} ≡ ${c}`);
    if(mu2>0) el("text",{x:150,y:y+100,"font-size":13,fill:act?hl:css("--fg")},"szorzás: "+parts.join(";  ")+(mu2===rw.chain.length?`  ⇒  ${rw.res}`:""));
    if(rw.chain.length===0 && sq===rw.pows.length) el("text",{x:150,y:y+100,"font-size":13},`⇒ ${rw.res}`);
  }
  rowDraw(s.enc,60,`Titkosítás: c = ${s.m}^${s.e} mod ${s.N}`,"e",s.es,s.em,s.ph==="enc");
  rowDraw(s.dec,230,`Visszafejtés: m = ${s.enc.res}^${s.d} mod ${s.N}`,"d",s.ds,s.dm,s.ph==="dec");
}
document.getElementById("go").addEventListener("click",()=>{
  const p=+document.getElementById("ip").value, q=+document.getElementById("iq").value, e=+document.getElementById("ie").value, m=+document.getElementById("im").value, w=document.getElementById("warn");
  if(!(isPrime(p)&&isPrime(q)&&p!==q)){ w.textContent="p és q legyen két különböző prím."; return; }
  if(p*q>=1e6){ w.textContent="N = pq legyen 10^6 alatt."; return; }
  const lam=(p-1)*(q-1)/gcd(p-1,q-1);
  if(!(e>1&&gcd(e,lam)===1)){ w.textContent=`gcd(e, λ(N)) = ${gcd(e,lam)} ≠ 1: e nem invertálható modulo λ(N) = ${lam}.`; return; }
  if(!(m>=0&&m<p*q)){ w.textContent="0 ≤ m < N kell."; return; }
  w.textContent=""; setSteps(stepsFor(rsaOf(p,q,e,m))); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
