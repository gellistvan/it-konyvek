<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E(F₁₉) pontjai és összeadás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="enumMode()">Felsorolás</button><button onclick="addMode()">Összeadás mód: (1, 9) + (3, 4), majd két pont kattintással</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az y² = x³ + 2x + 2 görbe F_19 feletti 23 affin pontja egy 19×19-es rácson, táblázattal; a (1, 9) + (3, 4) összeadás λ = 7 feltekert egyenese, harmadik pont (7, 13), összeg (7, 6)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Helyesen #E(F₁₉) = 24: x = 14-re z = 0, így ott egyetlen pont, (14, 0) van. Összeadás módban a pontokra kattintva saját P + Q számolható.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "enum", "upto": -1, "line": -1, "msg": "Üres rács: lépésenként x = 0 … 18"}, {"mode": "enum", "upto": 0, "line": 3, "msg": "x = 0: z = 2, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 0 pont"}, {"mode": "enum", "upto": 1, "line": 5, "msg": "x = 1: z = 5, z^9 = 1 (maradék), y = ±9: (1, 9), (1, 10) – eddig 2 pont"}, {"mode": "enum", "upto": 2, "line": 3, "msg": "x = 2: z = 14, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 2 pont"}, {"mode": "enum", "upto": 3, "line": 5, "msg": "x = 3: z = 16, z^9 = 1 (maradék), y = ±4: (3, 4), (3, 15) – eddig 4 pont"}, {"mode": "enum", "upto": 4, "line": 5, "msg": "x = 4: z = 17, z^9 = 1 (maradék), y = ±6: (4, 6), (4, 13) – eddig 6 pont"}, {"mode": "enum", "upto": 5, "line": 5, "msg": "x = 5: z = 4, z^9 = 1 (maradék), y = ±2: (5, 2), (5, 17) – eddig 8 pont"}, {"mode": "enum", "upto": 6, "line": 3, "msg": "x = 6: z = 2, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 8 pont"}, {"mode": "enum", "upto": 7, "line": 5, "msg": "x = 7: z = 17, z^9 = 1 (maradék), y = ±6: (7, 6), (7, 13) – eddig 10 pont"}, {"mode": "enum", "upto": 8, "line": 5, "msg": "x = 8: z = 17, z^9 = 1 (maradék), y = ±6: (8, 6), (8, 13) – eddig 12 pont"}, {"mode": "enum", "upto": 9, "line": 3, "msg": "x = 9: z = 8, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 12 pont"}, {"mode": "enum", "upto": 10, "line": 3, "msg": "x = 10: z = 15, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 12 pont"}, {"mode": "enum", "upto": 11, "line": 5, "msg": "x = 11: z = 6, z^9 = 1 (maradék), y = ±5: (11, 5), (11, 14) – eddig 14 pont"}, {"mode": "enum", "upto": 12, "line": 5, "msg": "x = 12: z = 6, z^9 = 1 (maradék), y = ±5: (12, 5), (12, 14) – eddig 16 pont"}, {"mode": "enum", "upto": 13, "line": 3, "msg": "x = 13: z = 2, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 16 pont"}, {"mode": "enum", "upto": 14, "line": 2, "msg": "x = 14: z = 0, egy pont: (14, 0) – eddig 17 pont"}, {"mode": "enum", "upto": 15, "line": 5, "msg": "x = 15: z = 6, z^9 = 1 (maradék), y = ±5: (15, 5), (15, 14) – eddig 19 pont"}, {"mode": "enum", "upto": 16, "line": 5, "msg": "x = 16: z = 7, z^9 = 1 (maradék), y = ±8: (16, 8), (16, 11) – eddig 21 pont"}, {"mode": "enum", "upto": 17, "line": 5, "msg": "x = 17: z = 9, z^9 = 1 (maradék), y = ±3: (17, 3), (17, 16) – eddig 23 pont"}, {"mode": "enum", "upto": 18, "line": 3, "msg": "x = 18: z = 18, z^9 = 18 = −1 (nem maradék): nincs pont – eddig 23 pont; összesen 23 affin pont + O = 24"}];
const CODE = ["for x in range(19):", "    z = (x**3 + 2*x + 2) % 19", "    if z == 0: pontok.append((x, 0))                 # egy pont", "    elif pow(z, 9, 19) == 1:                          # Euler-teszt", "        y = pow(z, 5, 19)                             # p ≡ 3 (mod 4)", "        pontok += [(x, y), (x, 19 - y)]", "# összeadás: λ = (y2 − y1)/(x2 − x1), x3 = λ² − x1 − x2, y3 = λ(x1 − x3) − y1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

const P = 19, ROWS = [{"x": 0, "z": 2, "eu": 18, "ys": []}, {"x": 1, "z": 5, "eu": 1, "ys": [9, 10]}, {"x": 2, "z": 14, "eu": 18, "ys": []}, {"x": 3, "z": 16, "eu": 1, "ys": [4, 15]}, {"x": 4, "z": 17, "eu": 1, "ys": [6, 13]}, {"x": 5, "z": 4, "eu": 1, "ys": [2, 17]}, {"x": 6, "z": 2, "eu": 18, "ys": []}, {"x": 7, "z": 17, "eu": 1, "ys": [6, 13]}, {"x": 8, "z": 17, "eu": 1, "ys": [6, 13]}, {"x": 9, "z": 8, "eu": 18, "ys": []}, {"x": 10, "z": 15, "eu": 18, "ys": []}, {"x": 11, "z": 6, "eu": 1, "ys": [5, 14]}, {"x": 12, "z": 6, "eu": 1, "ys": [5, 14]}, {"x": 13, "z": 2, "eu": 18, "ys": []}, {"x": 14, "z": 0, "eu": 0, "ys": [0]}, {"x": 15, "z": 6, "eu": 1, "ys": [5, 14]}, {"x": 16, "z": 7, "eu": 1, "ys": [8, 11]}, {"x": 17, "z": 9, "eu": 1, "ys": [3, 16]}, {"x": 18, "z": 18, "eu": 18, "ys": []}], PTS = [[1, 9], [1, 10], [3, 4], [3, 15], [4, 6], [4, 13], [5, 2], [5, 17], [7, 6], [7, 13], [8, 6], [8, 13], [11, 5], [11, 14], [12, 5], [12, 14], [14, 0], [15, 5], [15, 14], [16, 8], [16, 11], [17, 3], [17, 16]];
let selMode = false, sel = [];
const GX = x => 34 + x * 14 + 7, GY = y => 290 - y * 14 - 7;
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  for (let i = 0; i <= 19; i++) { el("line", {x1: 34 + i * 14, y1: 24, x2: 34 + i * 14, y2: 290, stroke: css("--muted"), "stroke-width": 0.3});
                                  el("line", {x1: 34, y1: 24 + i * 14, x2: 300, y2: 24 + i * 14, stroke: css("--muted"), "stroke-width": 0.3}); }
  for (let i = 0; i < 19; i += 3) { el("text", {x: GX(i), y: 304, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(i));
                                    el("text", {x: 28, y: GY(i) + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, String(i)); }
  el("line", {x1: 34, y1: GY(9.5), x2: 300, y2: GY(9.5), stroke: css("--muted"), "stroke-dasharray": "4 3"});
  const upto = s.mode === "enum" ? s.upto : 18;
  if (s.mode === "enum" && s.upto >= 0) el("rect", {x: 34 + s.upto * 14, y: 24, width: 14, height: 266, fill: css("--cellhl"), opacity: 0.5});
  if (s.mode === "add" && s.ln) {
    for (let x = 0; x < 19; x++) { const y = s.ln[x], y2 = s.ln[x + 1];
      el("circle", {cx: GX(x), cy: GY(y), r: 2.2, fill: css("--hl2")});
      if (x < 18 && y2 - y === s.lam) el("line", {x1: GX(x), y1: GY(y), x2: GX(x + 1), y2: GY(y2), stroke: css("--hl2"), "stroke-dasharray": "4 3"}); }
  }
  PTS.forEach(([x, y]) => { if (x <= upto) {
    const c = el("circle", {cx: GX(x), cy: GY(y), r: 5, fill: css("--line"), cursor: selMode ? "pointer" : "default"});
    c.addEventListener("click", () => pick([x, y])); } });
  if (s.mode === "add") {
    s.sel.forEach(([x, y], j) => { el("circle", {cx: GX(x), cy: GY(y), r: 9, fill: "none", stroke: css("--hl"), "stroke-width": 3});
      el("text", {x: GX(x) + 9, y: GY(y) - 9, "font-size": 12, "font-weight": "bold"}, j ? "Q" : "P"); });
    if (s.st >= 2 && s.third) el("circle", {cx: GX(s.third[0]), cy: GY(s.third[1]), r: 8, fill: css("--bg"), stroke: css("--line"), "stroke-width": 2.5});
    if (s.st >= 3 && s.sum) el("line", {x1: GX(s.third[0]), y1: GY(s.third[1]), x2: GX(s.sum[0]), y2: GY(s.sum[1]), stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "2 3"});
    if (s.st >= 4 && s.sum) el("rect", {x: GX(s.sum[0]) - 7, y: GY(s.sum[1]) - 7, width: 14, height: 14, fill: css("--hl")});
  }
  // táblázat
  el("text", {x: 320, y: 18, "font-size": 11, "font-weight": "bold"}, "x");
  el("text", {x: 350, y: 18, "font-size": 11, "font-weight": "bold"}, "z");
  el("text", {x: 385, y: 18, "font-size": 11, "font-weight": "bold"}, "z⁹ (Euler)");
  el("text", {x: 470, y: 18, "font-size": 11, "font-weight": "bold"}, "y");
  ROWS.forEach((r, i) => { if (i > upto) return; const Y = 34 + i * 15, on = s.mode === "enum" && i === s.upto;
    if (on) el("rect", {x: 314, y: Y - 11, width: 240, height: 14, fill: css("--cellhl")});
    el("text", {x: 320, y: Y, "font-size": 11}, String(r.x)); el("text", {x: 350, y: Y, "font-size": 11}, String(r.z));
    el("text", {x: 385, y: Y, "font-size": 11}, r.z === 0 ? "0" : (r.eu === 1 ? "1" : "−1"));
    el("text", {x: 470, y: Y, "font-size": 11}, r.ys.length ? r.ys.join(", ") : "—"); });
  el("text", {x: 34, y: 322, "font-size": 11, fill: css("--muted")}, selMode ? "Összeadás mód: kattintson két pontra (P, majd Q)" : "szaggatott vízszintes: y = 9,5 szimmetriatengely");
}
function addPts(p1, p2){
  const [x1, y1] = p1, [x2, y2] = p2;
  if (x1 === x2 && md(y1 + y2, P) === 0) return {lam: null};
  const lam = x1 === x2 ? md((3 * x1 * x1 + 2) * invm(2 * y1, P), P) : md((y2 - y1) * invm(x2 - x1, P), P);
  const x3 = md(lam * lam - x1 - x2, P), y3 = md(lam * (x1 - x3) - y1, P);
  const line = []; for (let x = 0; x < 19; x++) line.push(md(y1 + lam * (x - x1), P));
  return {lam, third: [x3, md(-y3, P)], sum: [x3, y3], line};
}
function addSteps(p1, p2){
  const r = addPts(p1, p2), b = {mode: "add", sel: [p1, p2], ln: r.line, line: 6, lam: r.lam, third: r.third, sum: r.sum};
  const ps = p => "(" + p[0] + ", " + p[1] + ")";
  if (r.lam === null) return [Object.assign({}, b, {st: 4, ln: null, msg: ps(p1) + " + " + ps(p2) + " = O (ellentett pontok, függőleges egyenes)"})];
  return [Object.assign({}, b, {st: 1, msg: "λ = " + r.lam + ": az egyenes y ≡ " + p1[1] + " + " + r.lam + "(x − " + p1[0] + ") (mod 19), modulo 19 „feltekerve”"}),
          Object.assign({}, b, {st: 2, msg: "harmadik pont: x₃ = λ² − x₁ − x₂ = " + r.sum[0] + ", (" + r.third[0] + ", " + r.third[1] + ")"}),
          Object.assign({}, b, {st: 3, msg: "tükrözés: (" + r.third[0] + ", " + r.third[1] + ") → (" + r.sum[0] + ", 19 − " + r.third[1] + ")"}),
          Object.assign({}, b, {st: 4, msg: "λ = " + r.lam + ", harmadik pont (" + r.third[0] + ", " + r.third[1] + "), P+Q = (" + r.sum[0] + ", " + r.sum[1] + ")"})];
}
function pick(p){ if (!selMode) return; sel.push(p); if (sel.length === 1) { status.textContent = "P = (" + p[0] + ", " + p[1] + "); válassza ki Q-t"; }
  if (sel.length === 2) { const st = addSteps(sel[0], sel[1]); sel = []; setSteps(st); show(st.length - 1); } }
function addMode(){ selMode = true; sel = []; setSteps(addSteps([1, 9], [3, 4])); show(0); }
function enumMode(){ selMode = false; sel = []; setSteps(ENUM); }
const ENUM = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
