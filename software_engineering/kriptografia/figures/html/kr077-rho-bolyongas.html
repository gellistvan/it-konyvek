<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollard-rho bolyongás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>felosztás <select id="part"><option value="javitott" selected>javított (≤7 / 8..21 / ≥22)</option><option value="eredeti">eredeti (0..9 / 10..19 / 20..30)</option></select></label>
<label>h <input id="ih" type="number" min="1" max="30" value="24" style="width:4.5em"></label>
<button id="go">Újraszámolás</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Pollard-rho bolyongás p = 31-ben: a farok 1, 3, 9, 19, 20, 28, a kör 21, 7; a 21-es csúcsba két nyíl fut (28-ból és 7-ből), kitevői (16,1) és (3,2), ebből x = 13."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, p = 31, g = 3, h = 24 (x = 13). A javított felosztás a T-C6-008 szerinti (S1 = {a ≤ 7}, S2 = {8..21}, S3 = {a ≥ 22}); az eredeti felosztás (0..9 / 10..19 / 20..30) ütközése Δv = 0-t ad. Csúcs alatt: a kitevőpár (u, v) az első látogatáskor.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"h": 24, "part": "javitott", "i": 0, "ta": 0, "tb": 0, "line": 1, "msg": "i = 0: a = b = 1 (0,0) – a teknős (kör) és a nyúl (háromszög) az a_0 = 1-ből indul."}, {"h": 24, "part": "javitott", "i": 1, "ta": 1, "tb": 2, "line": 4, "msg": "i = 1: a = 3 (1,0), b = 9 (2,0)"}, {"h": 24, "part": "javitott", "i": 2, "ta": 2, "tb": 4, "line": 4, "msg": "i = 2: a = 9 (2,0), b = 20 (8,0)"}, {"h": 24, "part": "javitott", "i": 3, "ta": 3, "tb": 6, "line": 4, "msg": "i = 3: a = 19 (4,0), b = 21 (16,1)"}, {"h": 24, "part": "javitott", "i": 4, "ta": 4, "tb": 8, "line": 4, "msg": "i = 4: a = 20 (8,0), b = 21 (3,2)"}, {"h": 24, "part": "javitott", "i": 5, "ta": 5, "tb": 10, "line": 4, "msg": "i = 5: a = 28 (16,0), b = 21 (7,4)"}, {"h": 24, "part": "javitott", "i": 6, "ta": 6, "tb": 12, "line": 5, "msg": "i = 6: a = 21 (16,1), b = 21 (15,8) – találkozás!"}, {"h": 24, "part": "javitott", "i": 6, "ta": 6, "tb": 12, "line": 7, "x": 13, "msg": "x(1 − 8) ≡ 15 − 16 (mod 30), azaz 23x ≡ 29 (mod 30): x = 13"}];
const CODE = ["a, ua, va = 1, 0, 0          # teknős", "b, ub, vb = 1, 0, 0          # nyúl", "while True:", "    a, ua, va = f(a, ua, va)                 # 1 lépés", "    b, ub, vb = f(*f(b, ub, vb))             # 2 lépés", "    if a == b: break", "# g^ua h^va = g^ub h^vb  =>  x (va - vb) ≡ ub - ua (mod q)", "x = megold(ub - ua, va - vb, q)              # d = gcd(Δv, q) jelölt, ellenőrzés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PP=31, GG=3, QQ=30, PARTS={javitott:[7,21], eredeti:[9,19]};
function pw(x,e,m){let r=1;x%=m;while(e>0){if(e&1)r=r*x%m;x=x*x%m;e>>=1;}return r;}
function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function inv(a,m){a%=m;for(let x=1;x<m;x++)if(a*x%m===1)return x;return 0;}
function ff(a,u,v,h,part){const [t1,t2]=PARTS[part]; if(a<=t1) return [a*GG%PP,(u+1)%QQ,v,"g"]; if(a<=t2) return [a*a%PP,2*u%QQ,2*v%QQ,"sq"]; return [a*h%PP,u,(v+1)%QQ,"h"];}
function md(x){return ((x%QQ)+QQ)%QQ;}
function solveX(du,dv,h){ du=md(du); dv=md(dv); if(dv===0) return [null,"Δv = 0: az ütközés nem ad egyenletet (új kezdőpont vagy felosztás kell)."];
  const d=gcd(dv,QQ); if(du%d) return [null,`gcd(Δv, ${QQ}) = ${d} nem osztja Δu-t: nincs megoldás.`];
  const m=QQ/d, x0= m>1 ? (du/d)*inv(dv/d,m)%m : 0, c=[]; for(let k=0;k<d;k++) c.push(x0+k*m);
  const good=c.filter(x=>pw(GG,x,PP)===h); const note = d>1 ? `d = gcd(Δv, ${QQ}) = ${d}, jelöltek: ${c.join(", ")}; ` : "";
  return [good.length?good[0]:null, note+(good.length?`x = ${good[0]}`:"egyik jelölt sem jó")]; }
function floydSteps(h,part){ let a=1,ua=0,va=0,b=1,ub=0,vb=0; const base={h:h,part:part};
  const st=[Object.assign({},base,{i:0,ta:0,tb:0,line:1,msg:"i = 0: a = b = 1 (0,0) – a teknős (kör) és a nyúl (háromszög) az a_0 = 1-ből indul."})]; let i=0;
  while(i<200){ i++; [a,ua,va]=ff(a,ua,va,h,part); [b,ub,vb]=ff(b,ub,vb,h,part); [b,ub,vb]=ff(b,ub,vb,h,part);
    if(a===b){ const [x,note]=solveX(ub-ua,va-vb,h);
      st.push(Object.assign({},base,{i:i,ta:i,tb:2*i,line:5,msg:`i = ${i}: a = ${a} (${ua},${va}), b = ${b} (${ub},${vb}) – találkozás!`}));
      st.push(Object.assign({},base,{i:i,ta:i,tb:2*i,line:7,x:x,msg:`x(${va} − ${vb}) ≡ ${ub} − ${ua} (mod ${QQ}), azaz ${md(va-vb)}x ≡ ${md(ub-ua)} (mod ${QQ}): ${note}`}));
      return st; }
    st.push(Object.assign({},base,{i:i,ta:i,tb:2*i,line:4,msg:`i = ${i}: a = ${a} (${ua},${va}), b = ${b} (${ub},${vb})`})); }
  return st; }
function render(s){
  svg.setAttribute("viewBox","0 0 760 420"); svg.innerHTML="";
  const hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line");
  // sorozat a ciklus lezárásáig
  const seq=[[1,0,0,null]]; let a=1,u=0,v=0; const first=new Map([[1,0]]); let mu0=-1, lam=0;
  for(let k=1;k<=64;k++){ [a,u,v,]=ff(a,u,v,s.h,s.part); const op=ff(seq[k-1][0],seq[k-1][1],seq[k-1][2],s.h,s.part)[3]; seq.push([a,u,v,op]);
    if(first.has(a)){ mu0=first.get(a); lam=k-mu0; break; } first.set(a,k); }
  const n=mu0+lam; // csúcsok: seq[0..n-1]
  const pos={};
  const cx=520, cy=150, R=Math.max(55, Math.min(120, lam*16));
  for(let k=mu0;k<n;k++){ const th=-Math.PI/2 + 2*Math.PI*(k-mu0)/lam; pos[seq[k][0]]=[cx + R*Math.cos(th), cy - R*Math.sin(th)]; }
  // farok: a kör belépési pontjától lefelé-balra
  const [ex,ey]=pos[seq[mu0][0]];
  for(let k=0;k<mu0;k++){ const d=mu0-k; pos[seq[k][0]]=[ex - d*62 + Math.min(d,3)*8, ey + d*34 - Math.max(0,d-4)*12]; }
  { const xs=Object.values(pos).map(q=>q[0]), ys=Object.values(pos).map(q=>q[1]);
    const x0=Math.min(0,Math.min(...xs)-40), y1=Math.max(420,Math.max(...ys)+60);
    svg.setAttribute("viewBox",`${x0} 0 ${760-x0} ${y1}`); }
  const dash={g:"",sq:"8 5",h:"2 4"};
  for(let k=0;k<n;k++){ const a0=seq[k][0], a1=seq[k+1][0], op=seq[k+1][3], [x0,y0]=pos[a0], [x1,y1]=pos[a1];
    const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy)||1, inCyc=(k>=mu0), bend=inCyc?0.25:0;
    const mx=(x0+x1)/2 - dy*bend, my=(y0+y1)/2 + dx*bend;
    const ux=x1-mx, uy=y1-my, ul=Math.hypot(ux,uy)||1, qx=x1-ux/ul*19, qy=y1-uy/ul*19;
    el("path",{d:`M${x0},${y0} Q${mx},${my} ${qx},${qy}`,fill:"none",stroke:ln,"stroke-width":1.6,"stroke-dasharray":dash[op]});
    const an=Math.atan2(qy-my,qx-mx); el("path",{d:`M${qx},${qy} l${-9*Math.cos(an-0.4)},${-9*Math.sin(an-0.4)} l${9*Math.cos(an-0.4)-9*Math.cos(an+0.4)},${9*Math.sin(an-0.4)-9*Math.sin(an+0.4)} z`,fill:ln}); }
  for(let k=0;k<n;k++){ const [aa,uu,vv]=seq[k], [x,y]=pos[aa], ent=(k===mu0);
    el("circle",{cx:x,cy:y,r:16,fill:ent?css("--cellhl"):css("--cell"),stroke:ln,"stroke-width":ent?2.5:1.2});
    el("text",{x:x,y:y+5,"text-anchor":"middle","font-size":13,"font-weight":ent?"bold":"normal"},String(aa));
    el("text",{x:x,y:y+31,"text-anchor":"middle","font-size":10,fill:mu},`(${uu},${vv})`);
    if(ent){ el("text",{x:x,y:y+44,"text-anchor":"middle","font-size":10,fill:mu},`és (${seq[n][1]},${seq[n][2]})`); } }
  // teknős és nyúl
  const idx=t=> t<n ? t : mu0 + ((t-mu0)%lam);
  const [tx,ty]=pos[seq[idx(s.ta)][0]], [hx,hy]=pos[seq[idx(s.tb)][0]];
  el("circle",{cx:tx-20,cy:ty-20,r:8,fill:hl,stroke:ln}); el("text",{x:tx-20,y:ty-32,"text-anchor":"middle","font-size":11,"font-weight":"bold",fill:hl},"a");
  el("path",{d:`M${hx+20},${hy-30} l9,16 l-18,0 z`,fill:hl2,stroke:ln}); el("text",{x:hx+20,y:hy-34,"text-anchor":"middle","font-size":11,"font-weight":"bold",fill:hl2},"b");
  // jelmagyarázat
  const lx=20, ly=24, t1=PARTS[s.part][0], t2=PARTS[s.part][1];
  [["g",`·g (a ≤ ${t1})`],["sq",`négyzet (${t1+1}..${t2})`],["h",`·h (a ≥ ${t2+1})`]].forEach(([op,t],i)=>{
    el("line",{x1:lx,x2:lx+40,y1:ly+i*20,y2:ly+i*20,stroke:ln,"stroke-width":1.6,"stroke-dasharray":dash[op]}); el("text",{x:lx+48,y:ly+i*20+4,"font-size":12},t); });
  el("text",{x:lx,y:ly+66,"font-size":12,fill:mu},`farok μ = ${mu0}, kör λ = ${lam}; p = 31, g = 3, h = ${s.h}`);
  if(s.x!==undefined) el("text",{x:lx,y:ly+96,"font-size":16,"font-weight":"bold",fill:hl}, s.x===null?"nincs használható egyenlet":`x = ${s.x}  (3^${s.x} ≡ ${pw(3,s.x,31)} mod 31)`);
}
document.getElementById("go").addEventListener("click",()=>{ let h=Math.round(+document.getElementById("ih").value); if(!(h>=1&&h<=30)){h=24;document.getElementById("ih").value=24;}
  setSteps(floydSteps(h, document.getElementById("part").value)); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
