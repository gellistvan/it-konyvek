<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FHE-zajnövekedés és bootstrapping</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
input[type=number]{width:4.5em;font:inherit}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre.panel{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.panel span{display:block;padding:0 4px}
pre.panel span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label>kezdő zaj |e₀| = <span id="e0v">8</span> <input type="range" id="e0" min="1" max="64" value="8" style="width:110px"></label>
  <label>q = 2^<span id="qv">16</span> <input type="range" id="qe" min="10" max="32" value="16" style="width:110px"></label>
  <label>bootstrapping: <select id="bf">
    <option value="off">ki</option><option value="auto" selected>szükség esetén</option>
    <option value="1">minden szorzás után</option><option value="2">2 szorzásonként</option>
    <option value="3">3 szorzásonként</option><option value="4">4 szorzásonként</option></select></label>
</div>
<div class="ctl" role="group" aria-label="Műveletek">
  <button id="add">+ összeadás</button><button id="mul">× szorzás</button><button id="bs">bootstrapping</button>
  <button id="rst">újrakezdés</button>
  <span class="small">szorzás: e ← e·e (azonos zajú szöveggel), összeadás: e ← e + e₀, bootstrapping: e ← 100</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 420" role="img" aria-label="A zaj kettes alapú logaritmusa a műveletek számának függvényében, a visszafejtési határral"></svg>

<p class="small">Szemléltető modell, nem mérés: a valódi sémákban a szorzás zaja a paraméterektől függően nő (relinearizálás, modulusváltás); itt e ← e·e. A bootstrapping saját zaja ~100.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",
  hlf:"--sc-hlf", hl2f:"--sc-hl2f", ok:"--sc-ok", err:"--sc-err", okf:"--sc-okf", errf:"--sc-errf"};
const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}


const $ = id => document.getElementById(id);
const status = $("status");
const X0 = 70, X1 = 870, Y0 = 370, Y1 = 30, YMAX = 40;
let ops = [];      // saját műveletsor
function thr(){ return Math.pow(2, +$("qe").value) / 4; }
function e0(){ return +$("e0").value; }
function modelSeries(){
  const e = e0(), T = thr(), n = 6, add = [], mul = [], boot = [];
  for (let i = 0; i <= n; i++) add.push(e * (i + 1));
  let m = e; mul.push(m); for (let i = 0; i < n; i++) { m = m * m; mul.push(m); }
  const bf = $("bf").value; let b = e, since = 0; const bp = [[0, b]];
  for (let k = 1; k <= n; k++) { b = b * b; since++; bp.push([k, b]);
    if (bf !== "off" && ((bf === "auto" && b * b >= T) || (bf !== "auto" && since >= +bf))) { bp.push([k + 0.02, 100]); b = 100; since = 0; } }
  return {add, mul, bp};
}
function runOps(){
  const T = thr(), bf = $("bf").value; let e = e0(), since = 0; const tr = [[0, e]]; let x = 0;
  for (const o of ops) {
    x++;
    if (o === "+") e = e + e0();
    if (o === "*") { e = e * e; since++; }
    if (o === "B") { e = 100; since = 0; }
    tr.push([x, e]);
    if (o === "*" && bf !== "off" && ((bf === "auto" && e * e >= T) || (bf !== "auto" && since >= +bf))) { e = 100; since = 0; tr.push([x + 0.02, e]); }
  }
  return tr;
}
const lg = v => Math.log2(Math.max(1, v));
function draw(){
  $("e0v").textContent = e0(); $("qv").textContent = $("qe").value;
  svg.innerHTML = ""; scDefs();
  const T = thr(), nx = Math.max(6, ops.length);
  const sx = x => X0 + x / nx * (X1 - X0), sy = v => Y0 - Math.min(YMAX + 2, lg(v)) / YMAX * (Y0 - Y1);
  const P = [];
  P.push(["rect", X0, Y1, X1 - X0, sy(T) - Y1, {fill: "g1", stroke: "none", lw: 0}]);
  for (let t = 0; t <= YMAX; t += 5) { P.push(["line", X0, sy(Math.pow(2, t)), X1, sy(Math.pow(2, t)), {lw: 0.5, ls: "dot", color: "g3"}]);
    P.push(["text", X0 - 8, sy(Math.pow(2, t)) + 5, String(t), {size: 14, anchor: "end", color: "muted"}]); }
  for (let i = 0; i <= nx; i++) P.push(["text", sx(i), Y0 + 20, String(i), {size: 14, anchor: "middle", color: "muted"}]);
  P.push(["line", X0, sy(T), X1, sy(T), {lw: 2.2}]);
  P.push(["text", X1 - 4, sy(T) - 6, `visszafejtési határ: log₂(q/4) = ${(lg(T)).toFixed(0)}`, {size: 15, anchor: "end"}]);
  P.push(["text", X0 + 6, Y1 + 18, "hibás visszafejtés", {size: 14, color: "muted"}]);
  P.push(["text", X0 - 50, Y1 - 12, "log₂|e|", {size: 14}]);
  P.push(["text", (X0 + X1) / 2, Y0 + 44, "műveletek száma", {size: 14, anchor: "middle"}]);
  const S = modelSeries();
  const poly = (pts, st) => { for (let i = 1; i < pts.length; i++) if (lg(pts[i - 1][1]) <= YMAX) P.push(["line", sx(pts[i - 1][0]), sy(pts[i - 1][1]), sx(pts[i][0]), sy(pts[i][1]), st]); };
  const faded = ops.length > 0;
  poly(S.add.map((v, i) => [i, v]), {ls: "dash", lw: 1.6, color: faded ? "g3" : "fg"});
  poly(S.mul.map((v, i) => [i, v]), {lw: 1.8, color: faded ? "g3" : "fg"});
  poly(S.bp, {ls: "dot", lw: 2, color: faded ? "g3" : "muted"});
  S.add.forEach((v, i) => P.push(["poly", [[sx(i) - 5, sy(v) + 4], [sx(i) + 5, sy(v) + 4], [sx(i), sy(v) - 5]], {fill: "bg", lw: 1.2}]));
  S.mul.forEach((v, i) => { if (lg(v) <= YMAX) P.push(["circ", sx(i), sy(v), 5, {fill: "fg", lw: 1}]); });
  S.bp.forEach(([x, v]) => P.push(["rect", sx(x) - 4.5, sy(v) - 4.5, 9, 9, {fill: Number.isInteger(x) ? "muted" : "bg", stroke: "muted", lw: 1.2}]));
  if (ops.length) { const tr = runOps(); poly(tr, {lw: 3, color: "hl"}); tr.forEach(([x, v]) => P.push(["circ", sx(x), sy(v), 4, {fill: "hl", stroke: "hl"}])); }
  // jelmagyarázat
  const ly = 64;
  P.push(["line", 560, ly, 600, ly, {ls: "dash", lw: 1.6}], ["text", 608, ly + 5, "csak összeadás", {size: 14}]);
  P.push(["line", 560, ly + 22, 600, ly + 22, {lw: 1.8}], ["text", 608, ly + 27, "szorzási lánc", {size: 14}]);
  P.push(["line", 560, ly + 44, 600, ly + 44, {ls: "dot", lw: 2, color: "muted"}], ["text", 608, ly + 49, "szorzás + bootstrapping", {size: 14}]);
  if (ops.length) P.push(["line", 560, ly + 66, 600, ly + 66, {lw: 3, color: "hl"}], ["text", 608, ly + 71, "saját műveletsor", {size: 14}]);
  scDraw(P);
  let msg;
  if (ops.length) { const tr = runOps(), e = tr[tr.length - 1][1];
    msg = `${ops.length} művelet után |e| = ${e.toLocaleString("hu-HU")} (log₂ ≈ ${lg(e).toFixed(1).replace(".", ",")}), küszöb q/4 = ${T.toLocaleString("hu-HU")} – visszafejtés: ${e < T ? "helyes" : "HIBÁS"}.`; }
  else { const k = S.mul.findIndex(v => v >= T), bmax = Math.max(...S.bp.map(p => p[1]));
    msg = `Modell: |e₀| = ${e0()}, küszöb q/4 = ${T.toLocaleString("hu-HU")}. A szorzási lánc ${k < 0 ? "6 szorzáson belül nem" : "a " + k + ". szorzásnál"} lépi át a határt; ` +
          (($("bf").value === "off") ? "bootstrapping nélkül nincs mentség." : `a bootstrapping-es sorozat ${bmax < T ? "a határ alatt marad" : "így is átlépi a határt (a ~100-as bootstrapping-zaj ehhez a gyakorisághoz túl nagy)"}.`) +
          " Saját műveletsorhoz használd a gombokat."; }
  status.textContent = msg;
}
["e0", "qe"].forEach(id => $(id).addEventListener("input", draw));
$("bf").addEventListener("change", draw);
$("add").addEventListener("click", () => { ops.push("+"); draw(); });
$("mul").addEventListener("click", () => { ops.push("*"); draw(); });
$("bs").addEventListener("click", () => { ops.push("B"); draw(); });
$("rst").addEventListener("click", () => { ops = []; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
