<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schnorr: speciális hangzás és szimulátor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>c: <input id="cc" type="range" min="0" max="10" value="7" oninput="upd()" aria-label="Kihívás c"></label><span id="cv">7</span><label>c′: <input id="cc2" type="range" min="0" max="10" value="2" oninput="upd()" aria-label="Második kihívás c′"></label><span id="cv2">2</span><label>szimulátor s: <input id="ss" type="number" min="0" max="10" value="3" style="width:4em" aria-label="Szimulált válasz s"></label><button onclick="simu()">Szimulátor</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három sáv: valódi Schnorr-futás (R = 16, c = 7, s = 3), visszatekert futás (c′ = 2, s′ = 10, kinyert x = 3), szimulátor (c = 7, s = 3, R = 16)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 23, q = 11, g = 2, x = 3, y = 8, r = 4. A „Szimulátor” gomb a választott c-ből és s-ből számolja R-t. Oktatási célra – NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 0, "line": 0, "msg": "(a) P: R = g^r = 2^4 mod 23 = 16"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 1, "line": 0, "msg": "(a) V: kihívás c = 7"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 2, "line": 2, "msg": "(a) P: s = (4 + 7·3) mod 11 = 3; V: g^s = 8, R·y^c = 8 → elfogad"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 3, "line": 3, "msg": "(b) visszatekerés: ugyanaz az R = 16, új kihívás c′ = 2"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 4, "line": 3, "msg": "(b) P: s′ = (4 + 2·3) mod 11 = 10"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 5, "line": 4, "msg": "(b) kinyerő: x = (3 − 10)·(7 − 2)⁻¹ mod 11 = 3"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 6, "line": 5, "msg": "(c) szimulátor választ: c = 7, s = 3 (x nélkül!)"}, {"c": 7, "c2": 2, "s": 3, "s2": 10, "ok": true, "ok2": true, "xk": 3, "rs": 16, "k": 7, "line": 5, "msg": "(c) R = g^s·y^(−c) mod 23 = 16 → átirat (16, 7, 3) – azonos az (a) átiratával"}];
const CODE = ["R = pow(g, r, p)                              # (a) elkötelezés", "s = (r + c * x) % q                           # (a) válasz", "assert pow(g, s, p) == R * pow(y, c, p) % p    # (a) ellenőrzés", "s2 = (r + c2 * x) % q                         # (b) visszatekerés: ugyanaz az R, más c", "x_ki = (s - s2) * pow(c - c2, -1, q) % q      # (b) speciális hangzás", "R_sim = pow(g, s, p) * pow(y, -c, p) % p      # (c) szimulátor: előbb c, s, aztán R"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

const P = 23, Q = 11, G = 2, X = 3, RR = 4, Y = 8, R0 = 16;
function render(s){
  svg.setAttribute("viewBox", "0 0 560 420");
  svg.innerHTML = "";
  const lanes = [["(a) valódi futás", "", "P"], ["(b) visszatekert futás", "7 4", "P"], ["(c) szimulátor", "2 4", "S"]];
  const XP = 90, XV = 300;
  function arr(y, x0, x1, lab, dash, on){
    el("line", {x1: x0, y1: y, x2: x1, y2: y, stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 2.6 : 1.5, "stroke-dasharray": dash});
    const d = x1 > x0 ? -1 : 1;
    el("polygon", {points: `${x1},${y} ${x1 + 9 * d},${y - 5} ${x1 + 9 * d},${y + 5}`, fill: on ? css("--hl") : css("--line")});
    el("text", {x: (x0 + x1) / 2, y: y - 5, "text-anchor": "middle", "font-size": 12}, lab);
  }
  lanes.forEach(([t, dash, who], i) => {
    const top = 6 + i * 138;
    el("rect", {x: 2, y: top, width: 556, height: 130, fill: "none", stroke: css("--muted")});
    el("text", {x: 8, y: top + 16, "font-size": 12, "font-weight": "bold"}, t);
    el("text", {x: XP, y: top + 34, "text-anchor": "middle", "font-size": 12}, who);
    el("text", {x: XV, y: top + 34, "text-anchor": "middle", "font-size": 12}, "V");
  });
  const k = s.k, on = j => j === k;
  if (k >= 0) arr(58, XP, XV, "R = " + R0, "", on(0));
  if (k >= 1) arr(84, XV, XP, "c = " + s.c, "", on(1));
  if (k >= 2) { arr(110, XP, XV, "s = " + s.s, "", on(2)); el("text", {x: 320, y: 114, "font-size": 12}, "g^s = R·y^c ? " + (s.ok ? "✓" : "✗")); }
  if (k >= 3) { arr(196, XP, XV, "R = " + R0 + " (ugyanaz)", "7 4", false); arr(222, XV, XP, "c′ = " + s.c2, "7 4", on(3)); }
  if (k >= 4) arr(248, XP, XV, "s′ = " + s.s2, "7 4", on(4));
  if (k >= 5) { el("rect", {x: 318, y: 186, width: 236, height: 50, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": on(5) ? 3 : 1});
    el("text", {x: 436, y: 207, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, s.xk === null ? "c = c′: nincs kinyerés" : "x = (s − s′)(c − c′)⁻¹");
    if (s.xk !== null) el("text", {x: 436, y: 226, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "= " + s.xk + " (mod 11)"); }
  if (k >= 6) el("text", {x: 20, y: 330, "font-size": 12}, "S választ: c = " + s.c + ", s = " + s.s);
  if (k >= 7) { el("text", {x: 20, y: 350, "font-size": 12}, "R = g^s·y^(−c) = " + s.rs);
    arr(386, XP + 70, XV, "(" + s.rs + ", " + s.c + ", " + s.s + ")", "2 4", on(7));
    el("text", {x: 320, y: 360, "font-size": 12}, s.rs === R0 ? "= az (a) átirata, x nélkül" : "érvényes átirat, x nélkül"); }
}
function gen(c, c2){
  const s = md(RR + c * X, Q), s2 = md(RR + c2 * X, Q), ok = powm(G, s, P) === R0 * powm(Y, c, P) % P, ok2 = powm(G, s2, P) === R0 * powm(Y, c2, P) % P;
  const xk = c !== c2 ? md((s - s2) * invm(c - c2, Q), Q) : null, rs = powm(G, s, P) * invm(powm(Y, c, P), P) % P;
  const d = {c, c2, s, s2, ok, ok2, xk, rs};
  const xs = xk !== null ? "x = (" + s + " − " + s2 + ")·(" + c + " − " + c2 + ")⁻¹ mod 11 = " + xk : "c = c′: nincs kinyerés (két különböző kihívás kell)";
  const m = [[0, "(a) P: R = g^r = 2^4 mod 23 = " + R0], [0, "(a) V: kihívás c = " + c],
    [2, "(a) P: s = (4 + " + c + "·3) mod 11 = " + s + "; V: g^s = " + powm(G, s, P) + ", R·y^c = " + (R0 * powm(Y, c, P) % P) + " → " + (ok ? "elfogad" : "elutasít")],
    [3, "(b) visszatekerés: ugyanaz az R = " + R0 + ", új kihívás c′ = " + c2], [3, "(b) P: s′ = (4 + " + c2 + "·3) mod 11 = " + s2],
    [4, "(b) kinyerő: " + xs], [5, "(c) szimulátor választ: c = " + c + ", s = " + s + " (x nélkül!)"],
    [5, "(c) R = g^s·y^(−c) mod 23 = " + rs + " → átirat (" + rs + ", " + c + ", " + s + ")" + (rs === R0 ? " – azonos az (a) átiratával" : "")]];
  return m.map(([ln, msg], k) => Object.assign({}, d, {k, line: ln, msg}));
}
function upd(){
  const c = Number(document.getElementById("cc").value), c2 = Number(document.getElementById("cc2").value);
  document.getElementById("cv").textContent = c; document.getElementById("cv2").textContent = c2;
  const cur = k; setSteps(gen(c, c2)); show(cur);
}
function simu(){
  const c = Number(document.getElementById("cc").value), sv = Number(document.getElementById("ss").value), rs = powm(G, sv, P) * invm(powm(Y, c, P), P) % P;
  const d = {c, c2: c, s: sv, s2: sv, ok: true, ok2: true, xk: null, rs};
  setSteps([Object.assign({}, d, {k: 6, line: 5, msg: "(c) szimulátor választ: c = " + c + ", s = " + sv + " (x nélkül!)"}),
            Object.assign({}, d, {k: 7, line: 5, msg: "(c) R = g^s·y^(−c) mod 23 = " + rs + "; ellenőrzés: g^s = " + powm(G, sv, P) + " = R·y^c = " + (rs * powm(Y, c, P) % P) + " ✓ – érvényes átirat x nélkül"})]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
