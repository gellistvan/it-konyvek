<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasszikus és posztkvantum méretek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
input[type=number]{width:4.5em;font:inherit}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre.panel{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.panel span{display:block;padding:0 4px}
pre.panel span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Skála és szűrő">
  <span>Skála:</span>
  <label><input type="radio" name="sc" value="log" checked onchange="draw()"> logaritmikus</label>
  <label><input type="radio" name="sc" value="lin" onchange="draw()"> lineáris</label>
  <span style="margin-left:12px">Mutat:</span>
  <label><input type="checkbox" class="kind" value="kulcs" checked onchange="draw()"> kulcs</label>
  <label><input type="checkbox" class="kind" value="aláírás" checked onchange="draw()"> aláírás</label>
  <label><input type="checkbox" class="kind" value="rejtett szöveg" checked onchange="draw()"> rejtett szöveg</label>
  <label style="margin-left:12px">Viszonyítás: <select id="ref" onchange="draw()"></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 460" role="img" aria-label="Kulcs-, aláírás- és rejtettszöveg-méretek oszlopdiagramja"></svg>

<p class="small">Szabványos bájtméretek (FIPS 203, 204, 205; Classic McEliece specifikáció; RFC 7748); ECDSA: nyers r‖s. Nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",
  hlf:"--sc-hlf", hl2f:"--sc-hl2f", ok:"--sc-ok", err:"--sc-err", okf:"--sc-okf", errf:"--sc-errf"};
const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}

const DATA = [["X25519 pk", 32, "klasszikus", "kulcs"], ["ECDSA P-256 aláírás", 64, "klasszikus", "aláírás"], ["ML-KEM-768 ct", 1088, "rács", "rejtett szöveg"], ["ML-KEM-768 pk", 1184, "rács", "kulcs"], ["ML-DSA-65 pk", 1952, "rács", "kulcs"], ["ML-DSA-65 aláírás", 3309, "rács", "aláírás"], ["SLH-DSA-128s aláírás", 7856, "hash", "aláírás"], ["SLH-DSA-128f aláírás", 17088, "hash", "aláírás"], ["SLH-DSA-256f aláírás", 49856, "hash", "aláírás"], ["McEliece 348864 pk", 261120, "kód", "kulcs"], ["McEliece 8192128 pk", 1357824, "kód", "kulcs"]];

const FILL = {"klasszikus": "bg", "rács": "g2", "hash": "bg", "kód": "g1"};
const HATCH = {"klasszikus": "", "rács": "", "hash": "//", "kód": "xx"};
const sel = document.getElementById("ref");
DATA.forEach((d, i) => { const o = document.createElement("option"); o.value = i; o.textContent = d[0]; sel.appendChild(o); });
function hu(n){ return n.toLocaleString("hu-HU"); }
function draw(){
  const log = document.querySelector('input[name=sc]:checked').value === "log";
  const kinds = [...document.querySelectorAll(".kind:checked")].map(x => x.value);
  const rows = DATA.filter(d => kinds.includes(d[3]));
  const ref = DATA[+sel.value];
  const X0 = 270, X1 = 740, rowH = 34, top = 20;
  const H = top + rows.length * rowH + 50;
  svg.setAttribute("viewBox", `0 0 900 ${H}`); svg.innerHTML = ""; scDefs();
  const lo = 1, hi = 1e7;
  const sx = log ? (v => X0 + (Math.log10(Math.max(v, 10)) - 1) / 7 * (X1 - X0)) : (v => X0 + v / 1400000 * (X1 - X0));
  const ticks = log ? [10, 100, 1e3, 1e4, 1e5, 1e6, 1e7] : [0, 250000, 500000, 750000, 1000000, 1250000];
  const P = [];
  for (const t of ticks) {
    P.push(["line", sx(t), top - 6, sx(t), top + rows.length * rowH, {lw: 0.6, ls: "dot", color: "g3"}]);
    P.push(["text", sx(t), top + rows.length * rowH + 20, log ? ({1:"1",10:"10",100:"100",1000:"1 k",10000:"10 k",100000:"100 k",1000000:"1 M",10000000:"10 M"})[t] : hu(t), {size: 13, anchor: "middle", color: "muted"}]);
  }
  rows.forEach((d, i) => {
    const y = top + i * rowH, w = Math.max(0.5, sx(d[1]) - X0);
    P.push(["text", X0 - 8, y + rowH * 0.62, d[0], {size: 14, anchor: "end"}]);
    P.push(["rect", X0, y + 5, w, rowH - 10, {fill: FILL[d[2]], hatch: HATCH[d[2]], lw: d === ref ? 2.6 : 1, stroke: d === ref ? "hl" : "fg"}]);
    const r = d[1] / ref[1];
    const rs = r >= 10 ? r.toFixed(0) : (r >= 1 ? r.toFixed(1) : r.toFixed(3));
    P.push(["text", X0 + w + 6, y + rowH * 0.62, `${hu(d[1])} B (${rs.replace(".", ",")}×)`, {size: 13}]);
  });
  P.push(["text", X0, top + rows.length * rowH + 42, log ? "méret (bájt, logaritmikus skála)" : "méret (bájt, lineáris skála) – a kis oszlopok szinte láthatatlanok", {size: 14, color: log ? "fg" : "err"}]);
  scDraw(P);
  const vis = rows.filter(d => (sx(d[1]) - X0) < 2).length;
  status.textContent = (log ? "Logaritmikus skála: minden oszlop leolvasható. " : `Lineáris skála: ${vis} oszlop 2 képpontnál keskenyebb. `) +
    `Viszonyítás: ${ref[0]} (${hu(ref[1])} B).`;
}
const status = document.getElementById("status");
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
