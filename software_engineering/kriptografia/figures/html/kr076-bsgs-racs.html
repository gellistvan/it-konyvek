<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby-step giant-step</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>p (&lt; 200) <input id="ip" type="number" min="3" max="199" value="19" style="width:4.5em"></label>
<label>g <input id="ig" type="number" min="2" value="2" style="width:4.5em"></label>
<label>h <input id="ih" type="number" min="1" value="11" style="width:4.5em"></label>
<button id="go">Újraszámolás</button>
<span id="warn" role="alert" style="color:var(--hl2)"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="BSGS p = 19, g = 2, h = 11: a 0–24 kitevők 5×5-ös rácson; a baby-tábla az első sor (1, 2, 4, 8, 16), c = 3, a γ-sorozat 11, 14, 4; a 3. giant lépésben γ = 4 = g^2, így x = 2·5 + 2 = 12."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a fejezet 1. példájával (p = 19, g = 2, h = 11, q = 18, m = ⌈√q⌉ = 5). A kód a fejezet Python-illusztrációja, az m sor ⌈√q⌉-ra javított alakjával.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "baby", "j": 0, "baby": [[1, 0]], "line": 5, "msg": "Baby-lépés j = 0: g^0 mod 19 = 1 → tábla[1] = 0."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "baby", "j": 1, "baby": [[1, 0], [2, 1]], "line": 5, "msg": "Baby-lépés j = 1: g^1 mod 19 = 2 → tábla[2] = 1."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "baby", "j": 2, "baby": [[1, 0], [2, 1], [4, 2]], "line": 5, "msg": "Baby-lépés j = 2: g^2 mod 19 = 4 → tábla[4] = 2."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "baby", "j": 3, "baby": [[1, 0], [2, 1], [4, 2], [8, 3]], "line": 5, "msg": "Baby-lépés j = 3: g^3 mod 19 = 8 → tábla[8] = 3."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "baby", "j": 4, "baby": [[1, 0], [2, 1], [4, 2], [8, 3], [16, 4]], "line": 5, "msg": "Baby-lépés j = 4: g^4 mod 19 = 16 → tábla[16] = 4."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "c", "baby": [[1, 0], [2, 1], [4, 2], [8, 3], [16, 4]], "c": 3, "line": 7, "msg": "g^m = 2^5 mod 19 = 13; c = g^(−m) = 13^(−1) mod 19 = 3 (13·3 ≡ 1)."}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "giant", "baby": [[1, 0], [2, 1], [4, 2], [8, 3], [16, 4]], "c": 3, "gam": [11], "i": 0, "line": 12, "msg": "i = 0: γ = 11, nincs a táblában; γ ← 11·3 mod 19 = 14"}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "giant", "baby": [[1, 0], [2, 1], [4, 2], [8, 3], [16, 4]], "c": 3, "gam": [11, 14], "i": 1, "line": 12, "msg": "i = 1: γ = 14, nincs a táblában; γ ← 14·3 mod 19 = 4"}, {"p": 19, "g": 2, "h": 11, "q": 18, "m": 5, "ph": "hit", "baby": [[1, 0], [2, 1], [4, 2], [8, 3], [16, 4]], "c": 3, "gam": [11, 14, 4], "i": 2, "jj": 2, "x": 12, "line": 11, "msg": "i = 2: γ = 4 a táblában, j = 2 → x = 12"}];
const CODE = ["def baby_step_giant_step(g, p, q, h):", "    m = math.isqrt(q - 1) + 1          # ceil(sqrt(q)), q > 1", "    baby = {}", "    val = 1  # g^0", "    for j in range(m):", "        baby[val] = j", "        val = (val * g) % p", "    c = pow(g, -m, p)                  # c = g^(-m) mod p", "    gamma = h", "    for i in range(m):", "        if gamma in baby:", "            return i * m + baby[gamma]", "        gamma = (gamma * c) % p", "    return None"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function pw(x,e,m){let r=1;x%=m;if(x<0)x+=m;while(e>0){if(e&1)r=r*x%m;x=x*x%m;e>>=1;}return r;}
function ordOf(g,p){let r=1,x=g%p;while(x!==1){x=x*g%p;r++;if(r>p)return -1;}return r;}
function isPrime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
function isqrt(n){let r=Math.floor(Math.sqrt(n));while(r*r>n)r--;while((r+1)*(r+1)<=n)r++;return r;}
function bsgs(p,g,h){ const q=ordOf(g,p), m=isqrt(q-1)+1, base={p:p,g:g,h:h,q:q,m:m}, steps=[], baby=new Map(); let val=1;
  for(let j=0;j<m;j++){ baby.set(val,j); steps.push(Object.assign({},base,{ph:"baby",j:j,baby:[...baby.entries()],line:5,msg:`Baby-lépés j = ${j}: g^${j} mod ${p} = ${val} → tábla[${val}] = ${j}.`})); val=val*g%p; }
  const gm=pw(g,m,p), c=pw(gm,p-2,p);
  steps.push(Object.assign({},base,{ph:"c",baby:[...baby.entries()],c:c,line:7,msg:`g^m = ${g}^${m} mod ${p} = ${gm}; c = g^(−m) = ${gm}^(−1) mod ${p} = ${c} (${gm}·${c} ≡ 1).`}));
  let gamma=h%p; const gam=[];
  for(let i=0;i<m;i++){ gam.push(gamma);
    if(baby.has(gamma)){ const j=baby.get(gamma), x=i*m+j; steps.push(Object.assign({},base,{ph:"hit",baby:[...baby.entries()],c:c,gam:[...gam],i:i,jj:j,x:x,line:11,msg:`i = ${i}: γ = ${gamma} a táblában, j = ${j} → x = ${x}`})); return steps; }
    const nxt=gamma*c%p; steps.push(Object.assign({},base,{ph:"giant",baby:[...baby.entries()],c:c,gam:[...gam],i:i,line:12,msg:`i = ${i}: γ = ${gamma}, nincs a táblában; γ ← ${gamma}·${c} mod ${p} = ${nxt}`})); gamma=nxt; }
  steps.push(Object.assign({},base,{ph:"none",baby:[...baby.entries()],c:c,gam:[...gam],line:13,msg:`Nincs találat: h = ${h} nincs a ⟨${g}⟩ részcsoportban.`}));
  return steps; }
function render(s){
  const m=s.m, q=s.q, cs=Math.min(52, Math.floor(300/m)), W=40+m*cs+440, H=Math.max(50+m*cs+70, 330);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
  const hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line"), fsz=Math.max(9,Math.min(16,cs*0.34));
  const x0=40, y0=50, gam=s.gam||[], babyVals=new Map(s.baby);
  el("text",{x:x0,y:22,"font-size":13},`kitevőrács: x = i·m + j (m = ${m}, q = ${q})`);
  for(let j=0;j<m;j++) el("text",{x:x0+j*cs+cs/2,y:y0-8,"text-anchor":"middle","font-size":11,fill:mu},"j="+j);
  for(let i=0;i<m;i++){ el("text",{x:x0-6,y:y0+i*cs+cs/2+4,"text-anchor":"end","font-size":11,fill:mu},"i="+i);
    for(let j=0;j<m;j++){ const x=i*m+j, X=x0+j*cs, Y=y0+i*cs, over=x>=q;
      const filled = (i===0 && j < s.baby.length);
      const isCur = (s.ph==="giant"||s.ph==="hit"||s.ph==="none") && i===gam.length-1;
      let fill = over ? css("--cellhl") : (filled ? css("--cellhl") : css("--cell"));
      if (isCur && !over) fill = css("--cellhl");
      el("rect",{x:X,y:Y,width:cs,height:cs,fill:fill,stroke:ln,"stroke-width":(i===0)?2:0.8});
      if(over){ el("line",{x1:X+3,y1:Y+cs-3,x2:X+cs-3,y2:Y+3,stroke:mu,"stroke-width":1}); }
      if(s.ph==="hit" && x===s.x){ el("rect",{x:X+4,y:Y+4,width:cs-8,height:cs-8,fill:"none",stroke:hl,"stroke-width":3}); el("rect",{x:X,y:Y,width:cs,height:cs,fill:"none",stroke:hl,"stroke-width":3}); }
      el("text",{x:X+cs/2,y:Y+cs/2+fsz*0.35,"text-anchor":"middle","font-size":fsz,"font-weight":(s.ph==="hit"&&x===s.x)?"bold":"normal",fill:over?mu:css("--fg")},String(x)); }
    if(i<gam.length) el("text",{x:x0+m*cs+8,y:y0+i*cs+cs/2+4,"font-size":12,fill:(i===gam.length-1)?hl2:mu},`γ = ${gam[i]}`); }
  el("text",{x:x0,y:y0+m*cs+18,"font-size":11,fill:mu},`áthúzott: x ≥ q = ${q}, nem kell`);
  // jobb panel
  const bx=x0+m*cs+80;
  el("text",{x:bx,y:22,"font-size":13},"baby-tábla (g^j ↦ j)");
  s.baby.forEach(([v,j],k)=>{ const yy=36+k*22; if(yy>H-10) return; const hit=(s.ph==="hit"&&j===s.jj);
    el("rect",{x:bx,y:yy,width:110,height:19,fill:hit?css("--cellhl"):css("--cell"),stroke:hit?hl:ln,"stroke-width":hit?3:0.8});
    el("text",{x:bx+55,y:yy+14,"text-anchor":"middle","font-size":12,"font-weight":hit?"bold":"normal"},`${v} ↦ ${j}`); });
  const gx=bx+130;
  if(s.c!==undefined){ el("text",{x:gx,y:22,"font-size":13},`c = g^(−m) ≡ ${s.c}`);
    gam.forEach((gv,i)=>{ const yy=50+i*22; if(yy>H-10) return; const hit=(s.ph==="hit"&&i===gam.length-1);
      el("text",{x:gx,y:yy,"font-size":13,"font-weight":hit?"bold":"normal",fill:hit?hl:css("--fg")},`i = ${i}: γ = ${gv} ${hit?"✓ TALÁLAT":(babyVals.has(gv)?"✓":"–")}`); }); }
  if(s.ph==="hit") el("text",{x:x0,y:H-10,"font-size":15,"font-weight":"bold",fill:hl},`x = ${s.i}·${m} + ${s.jj} = ${s.x}; ${s.g}^${s.x} ≡ ${pw(s.g,s.x,s.p)} (mod ${s.p})`);
}
document.getElementById("go").addEventListener("click",()=>{
  const p=+document.getElementById("ip").value, g=+document.getElementById("ig").value, h=+document.getElementById("ih").value, w=document.getElementById("warn");
  if(!(isPrime(p)&&p<200)){ w.textContent="p legyen 200-nál kisebb prím."; return; }
  if(!(g>1&&g<p&&h>=1&&h<p)){ w.textContent="1 < g < p és 1 ≤ h < p kell."; return; }
  const q=ordOf(g,p); w.textContent = q===p-1 ? "" : `Megjegyzés: ord(g) = ${q} < p − 1 (a rács ehhez igazodik).`;
  setSteps(bsgs(p,g,h)); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
