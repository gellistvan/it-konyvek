<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohlig–Hellman-redukció kis görbén</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>x (0–23): <input id="xin" type="number" min="0" max="23" value="13" style="width:4em"></label><button id="go">Újraszámol</button><span id="emsg" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 24 elemű ciklikus csoport körön, kiemelve a 3- és 8-rendű részcsoport; a két kis DLP (x mod 3, x mod 8 bitenként) és a CRT-összerakás."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">y² = x³ + 2x + 2 (mod 19), #E = 24 = 2³·3, ciklikus; G = (3, 4). A próbaszám a kis DLP-k összehasonlításainak száma (számított, nem mérés). Oktatási játékpélda.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "start", "line": -1, "Q": "(7, 13)", "msg": "G = (3, 4) rendje 24 = 2³·3; a nyilvános Q = (7, 13). Keressük x-et, amelyre Q = [x]G.", "xx": 13, "Qi": 13}, {"ph": "proj", "line": 0, "msg": "Projekció: [8]Q = (12, 14) a 3-rendű ⟨[8]G⟩, [3]Q = (5, 2) a 8-rendű ⟨[3]G⟩ részcsoportba esik.", "xx": 13, "Qi": 13}, {"ph": "m3", "line": 1, "x3": 1, "msg": "Kis DLP a 3-rendű részcsoportban: [t]·[8]G = [8]Q próbálgatással t = 0, 1, 2 közül → x mod 3 = 1 (2 próba).", "xx": 13, "Qi": 13}, {"ph": "b0", "line": 5, "x3": 1, "x8": 1, "bi": 0, "chk": "(14, 0)", "bit": 1, "prev": 0, "msg": "x mod 8, 0. bit: [4]([3]Q − [0]·[3]G) = (14, 0) → bit = 1; eddig x mod 8 = 1 (3 próba).", "xx": 13, "Qi": 13}, {"ph": "b1", "line": 5, "x3": 1, "x8": 1, "bi": 1, "chk": "O", "bit": 0, "prev": 1, "msg": "x mod 8, 1. bit: [2]([3]Q − [1]·[3]G) = O → bit = 0; eddig x mod 8 = 1 (4 próba).", "xx": 13, "Qi": 13}, {"ph": "b2", "line": 5, "x3": 1, "x8": 5, "bi": 2, "chk": "(14, 0)", "bit": 1, "prev": 1, "msg": "x mod 8, 2. bit: [1]([3]Q − [1]·[3]G) = (14, 0) → bit = 1; eddig x mod 8 = 5 (5 próba).", "xx": 13, "Qi": 13}, {"ph": "crt", "line": 7, "x3": 1, "x8": 5, "x": 13, "msg": "CRT: x ≡ 1 (mod 3), x ≡ 5 (mod 8) → x = 13. Összesen 5 próba a brute force legfeljebb 24 lépése helyett; ellenőrzés: [13]G = (7, 13) = Q.", "xx": 13, "Qi": 13}];
const CODE = ["Q3, G3 = mul(8, Q), mul(8, G)        # vetítés a 3-rendű részcsoportba", "x3 = next(t for t in range(3) if mul(t, G3) == Q3)", "Q8, G8 = mul(3, Q), mul(3, G)        # vetítés a 8-rendű részcsoportba", "x8 = 0", "for i in range(3):                   # x mod 8 bitenként", "    T = add(Q8, neg(mul(x8, G8)));  x8 += (mul(2**(2-i), T) != O) << i", "", "x = crt([x3, x8], [3, 8])            # 0 <= x < 24"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(x, m){ return ((x % m) + m) % m; }
function minv(x, m){ x = md(x, m); for (let t = 1; t < m; t++) if ((x * t) % m === 1) return t; return null; }
function ecAdd(P, Q, p, a){
  if (P === null) return Q; if (Q === null) return P;
  const [x1, y1] = P, [x2, y2] = Q;
  if (x1 === x2 && md(y1 + y2, p) === 0) return null;
  let lam;
  if (x1 === x2 && y1 === y2) lam = md((3 * x1 * x1 + a) * minv(2 * y1, p), p);
  else lam = md((y2 - y1) * minv(x2 - x1, p), p);
  const x3 = md(lam * lam - x1 - x2, p);
  return [x3, md(lam * (x1 - x3) - y1, p)];
}
function ecMul(n, P, p, a){ let R = null; for (const b of n.toString(2)) { R = ecAdd(R, R, p, a); if (b === "1") R = ecAdd(R, P, p, a); } return n > 0 ? R : null; }
function fp(P){ return P === null ? "O" : "(" + P[0] + ", " + P[1] + ")"; }

const CP = 19, CA = 2, GG = [3, 4];
function mulG(n, P){ n = md(n, 24); return n ? ecMul(n, P, CP, CA) : null; }
function same(A, B){ return (A === null && B === null) || (A !== null && B !== null && A[0] === B[0] && A[1] === B[1]); }
function solveJS(xx){
  const Q = mulG(xx, GG), G3 = mulG(8, GG), Q3 = mulG(8, Q), G8 = mulG(3, GG), Q8 = mulG(3, Q);
  const st = [];
  st.push({ph: "start", line: -1, Q: fp(Q), msg: "G = (3, 4) rendje 24 = 2³·3; a nyilvános Q = " + fp(Q) + ". Keressük x-et, amelyre Q = [x]G."});
  st.push({ph: "proj", line: 0, msg: "Projekció: [8]Q = " + fp(Q3) + " a 3-rendű ⟨[8]G⟩, [3]Q = " + fp(Q8) + " a 8-rendű ⟨[3]G⟩ részcsoportba esik."});
  let tries = 0, x3 = null;
  for (let t = 0; t < 3; t++){ tries++; if (same(mulG(t, G3), Q3)) { x3 = t; break; } }
  st.push({ph: "m3", line: 1, x3: x3, msg: "Kis DLP a 3-rendű részcsoportban: [t]·[8]G = [8]Q próbálgatással t = 0, 1, 2 közül → x mod 3 = " + x3 + " (" + tries + " próba)."});
  let x8 = 0;
  for (let i = 0; i < 3; i++){
    const mx = mulG(x8, G8), T = ecAdd(Q8, mx === null ? null : [mx[0], md(-mx[1], CP)], CP, CA);
    const chk = mulG(1 << (2 - i), T === null ? null : T); tries++;
    const bit = chk === null ? 0 : 1; const prev = x8; x8 += bit << i;
    st.push({ph: "b" + i, line: 5, x3: x3, x8: x8, bi: i, msg: "x mod 8, " + i + ". bit: [" + (1 << (2 - i)) + "]([3]Q − [" + prev + "]·[3]G) = " + fp(chk) + " → bit = " + bit + "; eddig x mod 8 = " + x8 + " (" + tries + " próba)."});
  }
  let xr = 0; while (!(xr % 3 === x3 && xr % 8 === x8)) xr++;
  st.push({ph: "crt", line: 7, x3: x3, x8: x8, x: xr, msg: "CRT: x ≡ " + x3 + " (mod 3), x ≡ " + x8 + " (mod 8) → x = " + xr + ". Összesen " + tries + " próba a brute force legfeljebb 24 lépése helyett; ellenőrzés: [" + xr + "]G = " + fp(mulG(xr, GG)) + " = Q."});
  st.forEach(s => { s.xx = xx; s.Qi = md(xx, 24); });
  return st;
}
document.getElementById("go").onclick = () => {
  const v = parseInt(document.getElementById("xin").value, 10), em = document.getElementById("emsg");
  if (!(v >= 0 && v <= 23)) { em.textContent = "x legyen 0 és 23 között."; return; }
  em.textContent = ""; setSteps(solveJS(v));
};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 340");
  const cx = 170, cy = 170, R = 125, ph = s.ph;
  for (let i = 0; i < 24; i++){
    const ang = Math.PI / 2 - 2 * Math.PI * i / 24, x = cx + R * Math.cos(ang), y = cy - R * Math.sin(ang);
    const in3 = i % 8 === 0, in8 = i % 3 === 0;
    const hl3 = in3 && (ph === "proj" || ph === "m3"), hl8 = in8 && (ph === "proj" || ph.startsWith("b"));
    if (in8) el("circle", {cx: x, cy: y, r: in3 ? 15 : 12, fill: hl8 ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": hl8 ? 2.5 : 1.2});
    if (in3) el("polygon", {points: [x, y - 11, x - 10, y + 7, x + 10, y + 7].join(" "), fill: hl3 ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": hl3 ? 2.5 : 1.2});
    if (!in3 && !in8) el("circle", {cx: x, cy: y, r: 3, fill: css("--fg")});
    el("text", {x: cx + (R + 24) * Math.cos(ang), y: cy - (R + 24) * Math.sin(ang) + 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    if (i === s.Qi) {
      el("circle", {cx: x, cy: y, r: 19, fill: "none", stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "5 3"});
    }
  }
  el("text", {x: cx, y: cy - 6, "text-anchor": "middle", "font-size": 12}, "○ 8-rendű ⟨[3]G⟩");
  el("text", {x: cx, y: cy + 12, "text-anchor": "middle", "font-size": 12}, "△ 3-rendű ⟨[8]G⟩");
  el("text", {x: cx, y: cy + 32, "text-anchor": "middle", "font-size": 12}, "szaggatott kör: Q = [" + s.xx + "]G");
  const rows = [["x mod 3", s.x3 === undefined ? "?" : String(s.x3)],
                ["x mod 8", s.x8 === undefined ? "?" : (s.ph === "crt" ? String(s.x8) : String(s.x8) + " (" + (s.bi + 1) + "/3 bit)")],
                ["x (CRT)", s.x === undefined ? "?" : String(s.x)]];
  el("text", {x: 380, y: 40, "font-size": 14, "font-weight": "bold"}, "Részeredmények");
  rows.forEach((r, j) => {
    const on = (j === 0 && ph === "m3") || (j === 1 && ph.startsWith("b")) || (j === 2 && ph === "crt");
    el("rect", {x: 380, y: 56 + j * 44, width: 340, height: 36, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: 394, y: 80 + j * 44, "font-size": 15}, r[0] + " = " + r[1]);
  });
  el("text", {x: 380, y: 210, "font-size": 13}, "Brute force: legfeljebb 24 próba.");
  el("text", {x: 380, y: 232, "font-size": 13}, "Pohlig–Hellman: 3 + 3 = legfeljebb 6 próba,");
  el("text", {x: 380, y: 254, "font-size": 13}, "a nagy prímtényezős rendnél ez nem segít.");
  el("text", {x: 380, y: 300, "font-size": 12, fill: css("--muted")}, "Számított, kis játékparaméter (p = 19).");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
