<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schnorr: valós futás, szimulátor, rewinding</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
input[type=number]{width:4.5em;font:inherit}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre.panel{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.panel span{display:block;padding:0 4px}
pre.panel span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Saját értékek">
  <label>x = <input type="number" id="ix" min="1" max="10" value="4"></label>
  <label>r = <input type="number" id="ir" min="0" max="10" value="5"></label>
  <label>c₁ = <input type="number" id="ic1" min="0" max="10" value="6"></label>
  <label>c₂ = <input type="number" id="ic2" min="0" max="10" value="2"></label>
  <label>szimulátor s = <input type="number" id="iss" min="0" max="10" value="2"></label>
  <button id="def">Alapértékek</button>
</div>
<div class="ctl" role="group" aria-label="Sávok léptetése">
  <span>Valós:</span><button data-l="0" data-d="-1">◀</button><button data-l="0" data-d="1">▶</button>
  <span style="margin-left:10px">Szimulátor:</span><button data-l="1" data-d="-1">◀</button><button data-l="1" data-d="1">▶</button>
  <span style="margin-left:10px">Rewinding:</span><button data-l="2" data-d="-1">◀</button><button data-l="2" data-d="1">▶</button>
  <button id="rew">↺ visszatekerés</button>
  <button id="all">Mind ▶▶</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 960 572" role="img" aria-label="A Schnorr-protokoll valós futása, HVZK-szimulációja és rewindingja három sávban"></svg>
<pre class="panel" id="form" aria-label="Képletek"></pre>

<p class="small">Játékparaméterek: p = 23, q = 11, g = 2. A szimulátor a c-t maga választja (becsületes ellenőrző); a rewinding két különböző kihívást kényszerít ki ugyanarra az R-re. Számított értékek, nem mérés.</p>
<script>

const md = (a, n) => ((a % n) + n) % n;

  const y = pw(G, x, P_), R = pw(G, r, P_), s1 = md(r + c1 * x, Q), lhs1 = pw(G, s1, P_), yc1 = pw(y, c1, P_), rhs1 = R * yc1 % P_;
