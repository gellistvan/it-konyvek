<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-tábla cache-sor szivárgás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--bad:#b00020;--ok:#2e6b30}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--bad:#ff7a8a;--ok:#8fd18f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6em}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.err{color:var(--bad)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span>
<label>p <input id="pp" type="range" min="0" max="255" value="65" aria-describedby="ppv"></label><span id="ppv">0x41</span>
<label>k (hexa) <input id="kk" type="text" value="23" maxlength="2" style="width:3em"></label>
<button id="add">Megfigyelés hozzáadása</button><button id="clr">Törlés</button>
<span id="err" class="small" aria-live="polite"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 380" role="img" aria-label="Bal oldalt a T-tábla 16 cache-sora, a 6. sor kiemelve; jobb oldalt a 256 kulcsjelöltből a 0x20–0x2F sor maradt meg."></svg>

<p class="small">Számított példa, nem mérés: index = p ⊕ k, cache-sor = index >> 4 (64 bájtos sor, 4 bájtos bejegyzés). Az első kör megfigyelései bármely p mellett csak a kulcsbájt felső 4 bitjét adják: a metszet mindig 16 elemű; az alsó bitekhez a második kör hozzáférései kellenek.</p>
<script>

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag,attrs,text,parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function setCode(lines){const c=document.getElementById("code");if(!c)return;c.innerHTML=lines.map((l,i)=>`<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");}
function hiCode(i){const c=document.getElementById("code");if(!c)return;c.querySelectorAll("span").forEach(x=>x.classList.remove("on"));const L=document.getElementById("L"+i);if(L)L.classList.add("on");}


const PRESETS=[65, 0, 247];
let obs=[PRESETS[0]], step=1;
svg.setAttribute("viewBox","0 0 680 380");
function hx(b){return "0x"+b.toString(16).toUpperCase().padStart(2,"0");}
function key(){const v=parseInt(document.getElementById("kk").value,16); return (isNaN(v)||v<0||v>255)?null:v;}
function draw(){
  const k=key(); const err=document.getElementById("err");
  if(k===null){err.textContent="k: 00–FF hexa";return;} err.textContent="";
  const p=+document.getElementById("pp").value; document.getElementById("ppv").textContent=hx(p);
  document.getElementById("cnt").textContent=`előre beállított: ${Math.min(step,3)}/3`;
  const idx=p^k, row=idx>>4;
  let cand=new Set([...Array(256).keys()]);
  obs.forEach(q=>{const s=(q^k)>>4; cand=new Set([...cand].filter(x=>((q^x)>>4)===s));});
  svg.innerHTML="";
  const cs=18, xL=36, xR=370, y0=40;
  el("text",{x:xL,y:22,"font-size":14,"font-weight":"bold"},"T-tábla: cache-sorok (16 × 16 bejegyzés)");
  el("text",{x:xR,y:22,"font-size":14,"font-weight":"bold"},"kulcsjelöltek (sor = felső 4 bit)");
  for(let r=0;r<16;r++){
    el("text",{x:xL-6,y:y0+r*cs+14,"text-anchor":"end","font-size":11},String(r));
    el("text",{x:xR-6,y:y0+r*cs+14,"text-anchor":"end","font-size":11},r.toString(16).toUpperCase()+"?");
    for(let c=0;c<16;c++){
      const on=r===row;
      el("rect",{x:xL+c*cs,y:y0+r*cs,width:cs,height:cs,fill:on?css("--cellhl"):css("--cell"),stroke:css("--muted"),"stroke-width":0.5});
      const kc=r*16+c, keep=cand.has(kc);
      el("rect",{x:xR+c*cs,y:y0+r*cs,width:cs,height:cs,fill:keep?css("--cellhl"):css("--cell"),stroke:css("--muted"),"stroke-width":0.5});
      if(!keep) el("line",{x1:xR+c*cs+4,y1:y0+r*cs+cs-4,x2:xR+c*cs+cs-4,y2:y0+r*cs+4,stroke:css("--muted"),"stroke-width":0.8});
      if(kc===k) el("circle",{cx:xR+c*cs+cs/2,cy:y0+r*cs+cs/2,r:4,fill:css("--hl")});
    }
  }
  el("rect",{x:xL,y:y0+row*cs,width:16*cs,height:cs,fill:"none",stroke:css("--line"),"stroke-width":3});
  el("circle",{cx:xL+(idx%16)*cs+cs/2,cy:y0+row*cs+cs/2,r:5,fill:css("--fg")});
  el("text",{x:xL,y:y0+16*cs+24,"font-size":13},`index = ${hx(p)} ⊕ ${hx(k)} = ${hx(idx)} = ${idx}, sor = ${row}`);
  el("text",{x:xR,y:y0+16*cs+24,"font-size":13},`megfigyelések: ${obs.map(hx).join(", ")||"–"}`);
  el("text",{x:xR,y:y0+16*cs+44,"font-size":12,fill:css("--muted")},"kék pötty: a valódi k; szürke: megmaradó jelölt");
  const arr=[...cand].sort((a,b)=>a-b);
  const rng=arr.length?(arr.length>1&&arr[arr.length-1]-arr[0]===arr.length-1?`${hx(arr[0])}–${hx(arr[arr.length-1])}`:arr.slice(0,6).map(hx).join(", ")+(arr.length>6?", …":"")):"–";
  document.getElementById("status").textContent=`p = ${hx(p)}, index = ${hx(idx)}, sor = ${row}, jelöltek: ${rng} (${arr.length})`;
}
function preset(n){step=n; obs=PRESETS.slice(0,n); document.getElementById("pp").value=PRESETS[n-1]; draw();}
document.getElementById("prev").onclick=()=>preset(Math.max(1,step-1));
document.getElementById("next").onclick=()=>preset(Math.min(3,step+1));
document.getElementById("pp").oninput=draw;
document.getElementById("kk").oninput=()=>{draw();};
document.getElementById("add").onclick=()=>{const p=+document.getElementById("pp").value; if(!obs.includes(p)) obs.push(p); draw();};
document.getElementById("clr").onclick=()=>{obs=[]; draw();};
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
