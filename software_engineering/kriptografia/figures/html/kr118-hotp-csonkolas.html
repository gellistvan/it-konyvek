<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A HOTP dinamikus csonkolása lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>T (s) <input id="tt" type="number" value="59" min="0" step="1" style="width:9em"></label>
<label>jegyek <select id="dd"><option>6</option><option selected>8</option></select></label>
<button onclick="recalc()">Számol</button>
<span id="err" class="small" aria-live="polite"></span>
<span class="small">kulcs: „12345678901234567890” (RFC 6238 SHA-1 tesztkulcs); próbáld: 1111111109</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Húszbájtos HMAC-SHA1 kimenet; az utolsó bájt alsó négy bitje kijelöli a négy kiválasztott bájtot, amelyekből 31 bites szám és 8 jegyű kód lesz."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A HMAC-SHA1 a lapon belül, JavaScriptben számolódik (RFC 2104, FIPS 180-4); a kezdőállapot értékei Pythonnal ellenőrzöttek, és egyeznek az RFC 6238 tesztvektorával (T = 59 → 94287082).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"T": 59, "C": 1, "d": 8, "mac": [117, 164, 138, 25, 212, 203, 225, 0, 100, 78, 138, 193, 57, 126, 234, 116, 122, 45, 51, 171], "off": 11, "val": 1094287082, "code": "94287082", "s": 1, "line": 0, "msg": "Lépés 1/5: C=1, offset=…, érték=…, kód=…"}, {"T": 59, "C": 1, "d": 8, "mac": [117, 164, 138, 25, 212, 203, 225, 0, 100, 78, 138, 193, 57, 126, 234, 116, 122, 45, 51, 171], "off": 11, "val": 1094287082, "code": "94287082", "s": 2, "line": 1, "msg": "Lépés 2/5: C=1, HMAC=75a48a19d4cbe100644e8ac1397eea747a2d33ab, offset=…, érték=…, kód=…"}, {"T": 59, "C": 1, "d": 8, "mac": [117, 164, 138, 25, 212, 203, 225, 0, 100, 78, 138, 193, 57, 126, 234, 116, 122, 45, 51, 171], "off": 11, "val": 1094287082, "code": "94287082", "s": 3, "line": 2, "msg": "Lépés 3/5: C=1, offset=11, érték=…, kód=…"}, {"T": 59, "C": 1, "d": 8, "mac": [117, 164, 138, 25, 212, 203, 225, 0, 100, 78, 138, 193, 57, 126, 234, 116, 122, 45, 51, 171], "off": 11, "val": 1094287082, "code": "94287082", "s": 4, "line": 3, "msg": "Lépés 4/5: C=1, offset=11, érték=1094287082, kód=…"}, {"T": 59, "C": 1, "d": 8, "mac": [117, 164, 138, 25, 212, 203, 225, 0, 100, 78, 138, 193, 57, 126, 234, 116, 122, 45, 51, 171], "off": 11, "val": 1094287082, "code": "94287082", "s": 5, "line": 4, "msg": "Lépés 5/5: C=1, offset=11, érték=1094287082, kód=94287082"}];
const CODE = ["C = floor((T − T0) / X)                    # T0 = 0, X = 30", "mac = HMAC-SHA1(K, C 8 bájtos big-endian)  # 20 bájt", "offset = mac[19] & 0x0f", "v = (mac[offset..offset+3] big-endian) & 0x7fffffff", "kód = v mod 10^d  (balról nullákkal d jegyre)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

// --- SHA-1 és HMAC-SHA1 tiszta JS-ben (FIPS 180-4, RFC 2104) ---
function sha1(bytes){
  const ml=bytes.length, withOne=ml+1, padLen=((withOne+8+63)>>6)<<6;
  const m=new Uint8Array(padLen); m.set(bytes); m[ml]=0x80;
  const bits=ml*8; for(let i=0;i<8;i++) m[padLen-1-i]=Math.floor(bits/Math.pow(2,8*i))&255;
  let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;
  const w=new Uint32Array(80);
  const rol=(x,n)=>((x<<n)|(x>>>(32-n)))>>>0;
  for(let o=0;o<padLen;o+=64){
    for(let i=0;i<16;i++) w[i]=((m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3])>>>0;
    for(let i=16;i<80;i++) w[i]=rol(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);
    let a=h0,b=h1,c=h2,d=h3,e=h4;
    for(let i=0;i<80;i++){
      let f,kc;
      if(i<20){f=(b&c)|(~b&d);kc=0x5A827999;} else if(i<40){f=b^c^d;kc=0x6ED9EBA1;}
      else if(i<60){f=(b&c)|(b&d)|(c&d);kc=0x8F1BBCDC;} else {f=b^c^d;kc=0xCA62C1D6;}
      const t=(rol(a,5)+(f>>>0)+e+kc+w[i])>>>0; e=d; d=c; c=rol(b,30); b=a; a=t;
    }
    h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;
  }
  const out=new Uint8Array(20);[h0,h1,h2,h3,h4].forEach((h,i)=>{out[4*i]=h>>>24;out[4*i+1]=(h>>>16)&255;out[4*i+2]=(h>>>8)&255;out[4*i+3]=h&255;});
  return out;
}
function hmacSha1(key,msg){
  let kb=key.length>64?sha1(key):key; const kp=new Uint8Array(64); kp.set(kb);
  const ip=new Uint8Array(64+msg.length), op=new Uint8Array(84);
  for(let i=0;i<64;i++){ip[i]=kp[i]^0x36;op[i]=kp[i]^0x5c;}
  ip.set(msg,64); op.set(sha1(ip),64); return sha1(op);
}
const KEYB=new TextEncoder().encode("12345678901234567890");
function hotpSteps(T,d){
  const C=Math.floor(T/30); const cb=new Uint8Array(8); let c=C;
  for(let i=7;i>=0;i--){cb[i]=c%256;c=Math.floor(c/256);}
  const mac=Array.from(hmacSha1(KEYB,cb)); const off=mac[19]&15;
  const val=(((mac[off]&0x7f)*16777216)+(mac[off+1]<<16)+(mac[off+2]<<8)+mac[off+3]);
  const code=String(val%Math.pow(10,d)).padStart(d,"0");
  const hex=mac.map(b=>b.toString(16).padStart(2,"0")).join("");
  const base={T:T,C:C,d:d,mac:mac,off:off,val:val,code:code};
  const ms=[`Lépés 1/5: C=${C}, offset=…, érték=…, kód=…`,`Lépés 2/5: C=${C}, HMAC=${hex}, offset=…, érték=…, kód=…`,
    `Lépés 3/5: C=${C}, offset=${off}, érték=…, kód=…`,`Lépés 4/5: C=${C}, offset=${off}, érték=${val}, kód=…`,
    `Lépés 5/5: C=${C}, offset=${off}, érték=${val}, kód=${code}`];
  return ms.map((m,i)=>Object.assign({},base,{s:i+1,line:i,msg:m}));
}
function recalc(){
  const T=Math.floor(+document.getElementById("tt").value), d=+document.getElementById("dd").value;
  if(!(T>=0&&T<=1e11)){document.getElementById("err").textContent="T: 0 és 10^11 közötti egész";return;}
  document.getElementById("err").textContent=""; setSteps(hotpSteps(T,d)); show(4);
}
function render(s){
  svg.setAttribute("viewBox","0 0 720 300");
  svg.innerHTML="";
  const cw=34, x0=20, y0=110;
  el("text",{x:20,y:28,"font-size":15},`T = ${s.T} s  →  C = ⌊T/30⌋ = ${s.C}`+(s.s>=1?`  (8 bájt: ${s.C.toString(16).padStart(16,"0").replace(/(..)/g,"$1 ").trim()})`:""));
  if(s.s<2){ el("text",{x:20,y:70,"font-size":14,fill:css("--muted")},"következő lépés: HMAC-SHA1(K, C)"); return; }
  el("text",{x:20,y:70,"font-size":14},"HMAC-SHA1(K, C) – 20 bájt:");
  s.mac.forEach((b,i)=>{
    const sel=s.s>=4&&i>=s.off&&i<s.off+4;
    el("rect",{x:x0+i*cw,y:y0,width:cw,height:34,fill:sel?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":1});
    if(i===19&&s.s>=3){ for(let t=0;t<17;t+=5) el("line",{x1:x0+i*cw+17+t,y1:y0+34,x2:x0+i*cw+17+Math.min(17,t+10),y2:y0+34-Math.min(34,(Math.min(17,t+10)-t)*3.4),stroke:css("--hl")}); }
    el("text",{x:x0+i*cw+cw/2,y:y0+23,"text-anchor":"middle","font-size":14,"font-family":"ui-monospace,monospace"},b.toString(16).padStart(2,"0"));
    el("text",{x:x0+i*cw+cw/2,y:y0+50,"text-anchor":"middle","font-size":11,fill:css("--muted")},String(i));
  });
  if(s.s>=3){ el("text",{x:x0+19*cw+cw,y:y0-10,"text-anchor":"end","font-size":13},`offset = 0x${s.mac[19].toString(16).padStart(2,"0")} & 0x0f = ${s.off}`);
    el("rect",{x:x0+s.off*cw,y:y0,width:4*cw,height:34,fill:"none",stroke:css("--hl"),"stroke-width":s.s>=4?4:2,"stroke-dasharray":s.s>=4?"":"5 3"}); }
  if(s.s>=4){ const f=s.mac.slice(s.off,s.off+4).map(b=>b.toString(16).padStart(2,"0"));
    el("text",{x:20,y:200,"font-size":14},`4 bájt: ${f.join(" ")};  0x${f[0]} & 0x7f = 0x${(s.mac[s.off]&0x7f).toString(16).padStart(2,"0")}  →  v = ${s.val.toLocaleString("hu-HU")}`);
    el("text",{x:20,y:222,"font-size":12,fill:css("--muted")},(s.mac[s.off]&0x80)?"a legfelső bit 1 volt: a maszk levágja (előjelkerülés)":"a legfelső bit 0 volt: a maszk nem változtat"); }
  if(s.s>=5){ el("rect",{x:16,y:240,width:420,height:40,fill:css("--cellhl"),stroke:css("--line"),"stroke-width":2});
    el("text",{x:26,y:266,"font-size":16,"font-weight":"bold"},`kód = v mod 10^${s.d} = ${s.code}`); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
