<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biztonsági szint: Z_p^* és EC</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em;padding:4px 6px;background:var(--code)}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label for="b">bithossz b:</label><input id="b" type="range" min="256" max="8192" step="32" value="2048" aria-label="paraméter bithossza"><output id="bv">2048</output></div>
<div class="ctl"><label for="c">c konstans:</label><input id="c" type="range" min="1.5" max="2.5" step="0.001" value="1.923" aria-label="NFS konstans c"><output id="cv"></output></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 360" role="img" aria-label="Két görbe a bithossz függvényében: a Z_p^* számtestszita-modellje 2048 bitnél kb. 117, 3072 bitnél kb. 139 bitet ad (o(1) nélkül), az elliptikus görbe b/2-t, 256 bitnél 128-at."></svg>
<p class="small">Számított modell, o(1) tag nélkül: Z_p^* esetén log₂ L_p(1/3, c) = c·(b·ln 2)^(1/3)·(ln(b·ln 2))^(2/3)/ln 2, elliptikus görbén √q, azaz b/2. A szabványos táblázatok (NIST SP 800-57) konzervatívabbak: 2048 → 112, 3072 → 128 (ellenőrizendő; ×). Nem mérés.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const $=id=>document.getElementById(id);
function nfs(b,c){const l=b*Math.LN2;return c*Math.cbrt(l)*Math.pow(Math.log(l),2/3)/Math.LN2;}
function cross(t,c){let lo=64,hi=65536;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(nfs(m,c)<t)lo=m;else hi=m;}return (lo+hi)/2;}
function hu(v,d){return v.toFixed(d).replace(".",",");}
const X0=60,X1=660,Y0=15,Y1=320,BMAX=8192,SMAX=300;
function X(b){return X0+(X1-X0)*(b-256)/(BMAX-256);} function Y(s){return Y1-(Y1-Y0)*s/SMAX;}
const NIST=[[1024,80],[2048,112],[3072,128],[7680,192]];
function draw(){
  svg.innerHTML=""; const b=+$("b").value, c=+$("c").value; $("bv").textContent=b; $("cv").textContent=hu(c,3);
  for(let s=0;s<=SMAX;s+=50){el("line",{x1:X0,x2:X1,y1:Y(s),y2:Y(s),stroke:css("--grid")});el("text",{x:X0-6,y:Y(s)+4,"text-anchor":"end","font-size":11},String(s));}
  for(const t of [256,1024,2048,3072,4096,6144,8192]){el("line",{x1:X(t),x2:X(t),y1:Y0,y2:Y1,stroke:css("--grid")});el("text",{x:X(t),y:Y1+15,"text-anchor":"middle","font-size":11},String(t));}
  el("text",{x:(X0+X1)/2,y:Y1+32,"text-anchor":"middle","font-size":12},"paraméter bithossza b");
  el("text",{x:14,y:(Y0+Y1)/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 14 ${(Y0+Y1)/2})`},"becsült biztonság (bit)");
  el("line",{x1:X0,x2:X1,y1:Y(128),y2:Y(128),stroke:css("--muted"),"stroke-dasharray":"2 3"}); el("text",{x:X1-4,y:Y(128)-4,"text-anchor":"end","font-size":11,fill:css("--muted")},"128 bites cél");
  let d1="",d2=""; for(let t=256;t<=BMAX;t+=32){d1+=(d1?"L":"M")+X(t).toFixed(1)+","+Y(nfs(t,c)).toFixed(1); const e=t/2; if(e<=SMAX) d2+=(d2?"L":"M")+X(t).toFixed(1)+","+Y(e).toFixed(1);}
  el("path",{d:d1,fill:"none",stroke:css("--hl"),"stroke-width":2.6}); el("path",{d:d2,fill:"none",stroke:css("--hl2"),"stroke-width":2.6,"stroke-dasharray":"8 5"});
  NIST.forEach(([t,s])=>{const x=X(t),y=Y(s);el("path",{d:`M${x-5},${y-5}L${x+5},${y+5}M${x-5},${y+5}L${x+5},${y-5}`,stroke:css("--muted"),"stroke-width":2});});
  const xz=cross(128,c); el("circle",{cx:X(xz),cy:Y(128),r:6,fill:"none",stroke:css("--hl"),"stroke-width":2.5}); el("text",{x:X(xz)+6,y:Y(128)+18,"font-size":11,fill:css("--hl")},`Z_p^*: ${Math.round(xz)} bit`);
  el("path",{d:`M${X(256)},${Y(128)-8} l7,12 l-14,0 z`,fill:"none",stroke:css("--hl2"),"stroke-width":2}); el("text",{x:X(256)+8,y:Y(128)-10,"font-size":11,fill:css("--hl2")},"EC: 256 bit");
  el("line",{x1:X(b),x2:X(b),y1:Y0,y2:Y1,stroke:css("--fg"),"stroke-width":1});
  const sz=nfs(b,c), se=b/2; el("circle",{cx:X(b),cy:Y(sz),r:5,fill:css("--hl")}); if(se<=SMAX) el("path",{d:`M${X(b)},${Y(se)-6} l6,10 l-12,0 z`,fill:css("--hl2")});
  const LX=X1-270, LY=Y1-60;
  el("line",{x1:LX,x2:LX+30,y1:LY,y2:LY,stroke:css("--hl"),"stroke-width":2.6}); el("text",{x:LX+36,y:LY+4,"font-size":12},"Z_p^*: L_p(1/3, c), o(1) nélkül");
  el("line",{x1:LX,x2:LX+30,y1:LY+20,y2:LY+20,stroke:css("--hl2"),"stroke-width":2.6,"stroke-dasharray":"8 5"}); el("text",{x:LX+36,y:LY+24,"font-size":12},"elliptikus görbe: √q = b/2");
  $("status").textContent=`b = ${b} bit: Z_p^* (NFS-modell) ≈ ${hu(sz,1)} bit, elliptikus görbe ≈ ${hu(se,1)} bit. A 128 bites cél: Z_p^* ≈ ${Math.round(xz)} bit (modell; NIST-táblázat: 3072), EC: 256 bit.`;
}
$("b").addEventListener("input",draw); $("c").addEventListener("input",draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
