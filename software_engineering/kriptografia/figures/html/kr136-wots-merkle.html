<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOTS-lánc és Merkle-útvonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>aláíró levél: <select id="leaf"><option value="0">v0 (1. levél)</option><option value="1">v1 (2. levél)</option><option value="2">v2 (3. levél)</option><option value="3">v3 (4. levél)</option><option value="4">v4 (5. levél)</option><option value="5" selected>v5 (6. levél)</option><option value="6">v6 (7. levél)</option><option value="7">v7 (8. levél)</option></select></label>
<script>
document.getElementById("leaf").onchange = e => { const keep = k; setSteps(stepsFor(+e.target.value)); show(keep); };
window.addEventListener("load", () => { document.body.dataset.selftest = JSON.stringify(stepsFor(5)) === JSON.stringify(STEPS) ? "ok" : "mismatch"; });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A lánc négy eleme (x, H(x) = σ, H²(x), H³(x) = pk) és a fa három testvércsúcsa (h₄, h₆₇, h₀₁₂₃) az i = 5 levélhez."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">H = SHA-256 (hex: első bájtok); a titkok és a levelek rögzített címkék hash-ei (szemléltető értékek). A lánc a kulcsgeneráláskor előre hash-el; az ellenőrző a maradék 2^w − 1 − v = 2 lépést teszi meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés: kulcsgenerálás: x = 8b4f543a…, H(x) = 39a6340f…", "line": 0, "ph": 1, "i": 5}, {"msg": "2. lépés: H²(x) = 9a924d91…", "line": 0, "ph": 2, "i": 5}, {"msg": "3. lépés: pk = H³(x) = bfa70bdf…; v = 1 miatt az aláírás σ = H¹(x) = 39a6340f…", "line": 1, "ph": 3, "i": 5}, {"msg": "4. lépés: ellenőrzés: H(σ) = 9a924d91…", "line": 2, "ph": 4, "i": 5}, {"msg": "5. lépés: H²(σ) = bfa70bdf… = pk ✓ (2 hash-lépés)", "line": 2, "ph": 5, "i": 5}, {"msg": "6. lépés: szint 0: h₅ = H(v₅) = 42de46ec…", "line": 3, "ph": 6, "i": 5}, {"msg": "7. lépés: szint 1: H(h₄ ‖ h₅) = h₄₅ = 881beddb…", "line": 4, "ph": 7, "i": 5}, {"msg": "8. lépés: szint 2: H(h₄₅ ‖ h₆₇) = h₄₅₆₇ = 58dc8325…", "line": 4, "ph": 8, "i": 5}, {"msg": "9. lépés: szint 3: H(h₀₁₂₃ ‖ h₄₅₆₇) = gyökér = 916f4487… = nyilvános gyökér ✓", "line": 5, "ph": 9, "i": 5}];
const CODE = ["kulcsgenerálás: pk = H^(2^w − 1)(x)", "aláírás (v = 1): σ = H^v(x)", "ellenőrzés: H^(2^w − 1 − v)(σ) = pk ?", "Merkle: h_i = H(v_i)", "szintenként: csúcs = H(bal ‖ jobb), a testvér az útvonalból", "a kapott gyökér = nyilvános gyökér ?"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const DATA = {"tree": [["53e8a840", "98219bfc", "bc6abd69", "b7449695", "c45c0b7a", "42de46ec", "4781dd4a", "4dd53a34"], ["06e39f20", "5477fbc0", "881beddb", "c0b4e77d"], ["da8ed646", "58dc8325"], ["916f4487"]], "chain": ["8b4f543a", "39a6340f", "9a924d91", "bfa70bdf"]};

const SUBM = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"};
function sb(s){ return String(s).split("").map(c => SUBM[c] || c).join(""); }
function nm(lv, k){ if (lv === 3) return "gyökér"; const sp = 1 << lv; let s = ""; for (let t = k * sp; t < (k + 1) * sp; t++) s += t; return "h" + sb(s); }
function stepsFor(i){
  const T = DATA.tree, C = DATA.chain;
  const out = [
    {msg: `1. lépés: kulcsgenerálás: x = ${C[0]}…, H(x) = ${C[1]}…`, line: 0, ph: 1, i: i},
    {msg: `2. lépés: H²(x) = ${C[2]}…`, line: 0, ph: 2, i: i},
    {msg: `3. lépés: pk = H³(x) = ${C[3]}…; v = 1 miatt az aláírás σ = H¹(x) = ${C[1]}…`, line: 1, ph: 3, i: i},
    {msg: `4. lépés: ellenőrzés: H(σ) = ${C[2]}…`, line: 2, ph: 4, i: i},
    {msg: `5. lépés: H²(σ) = ${C[3]}… = pk ✓ (2 hash-lépés)`, line: 2, ph: 5, i: i},
    {msg: `6. lépés: szint 0: ${nm(0, i)} = H(v${sb(i)}) = ${T[0][i]}…`, line: 3, ph: 6, i: i}];
  for (let lv = 1; lv <= 3; lv++) { const p = i >> (lv - 1), q = p ^ 1, a = Math.min(p, q), b = Math.max(p, q);
    let msg = `${6 + lv}. lépés: szint ${lv}: H(${nm(lv - 1, a)} ‖ ${nm(lv - 1, b)}) = ${nm(lv, i >> lv)} = ${T[lv][i >> lv]}…`;
    if (lv === 3) msg += " = nyilvános gyökér ✓";
    out.push({msg: msg, line: lv < 3 ? 4 : 5, ph: 6 + lv, i: i}); }
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 720 330"); svg.innerHTML = "";
  const C = DATA.chain, T = DATA.tree;
  const nb = (x, y, w, t, b, o) => { el("rect", {x: x - w / 2, y: y - 20, width: w, height: 40, rx: 5, fill: o.fill || css("--cell"),
      stroke: css("--line"), "stroke-width": o.lw || 1, "stroke-dasharray": o.dash || "none"});
    el("text", {x: x, y: y - 3, "text-anchor": "middle", "font-size": 12, "font-weight": o.bold ? "bold" : "normal"}, t);
    el("text", {x: x, y: y + 13, "text-anchor": "middle", "font-size": 10.5, "font-family": "ui-monospace,monospace"}, b); };
  // (A) lánc
  el("text", {x: 70, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "(A) WOTS, w = 2, v = 1");
  const lab = ["x (titkos)", "H(x)", "H²(x)", "H³(x) = pk"];
  for (let j = 0; j < 4; j++) { const y = 50 + j * 70, shown = s.ph >= j || j === 0, sig = j === 1 && s.ph >= 3;
    nb(70, y, 120, shown ? lab[j] + (sig ? " = σ" : "") : "?", shown ? C[j] : "", {lw: sig ? 3.5 : 1, bold: (s.ph === j && s.ph <= 3), fill: sig ? css("--cellhl") : css("--cell")});
    if (j < 3) el("line", {x1: 70, y1: y + 20, x2: 70, y2: y + 50, stroke: css("--line")}); }
  if (s.ph >= 4) { el("path", {d: `M 132 120 C 170 150, 170 180, 132 190`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "6 4"}); }
  if (s.ph >= 5) { el("path", {d: `M 132 190 C 170 220, 170 250, 132 260`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "6 4"});
    el("text", {x: 70, y: 310, "text-anchor": "middle", "font-size": 12}, "H²(σ) = pk ✓"); }
  // (B) fa
  const i = s.i, X = (lv, k) => 200 + ((k + 0.5) * (8 >> 0) / (8 >> lv)) * 64, Y = lv => 290 - lv * 80;
  el("text", {x: 460, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, `(B) Merkle-fa, aláíró levél: v${sb(i)}`);
  for (let lv = 1; lv <= 3; lv++) for (let k = 0; k < (8 >> lv); k++) for (const c of [2 * k, 2 * k + 1])
    el("line", {x1: X(lv, k), y1: Y(lv) + 20, x2: X(lv - 1, c), y2: Y(lv - 1) - 20, stroke: css("--muted")});
  for (let lv = 0; lv <= 3; lv++) for (let k = 0; k < (8 >> lv); k++) {
    const onPath = lv < 3 && k === ((i >> lv) ^ 1), onClimb = k === (i >> lv), done = s.ph >= 6 + lv && onClimb;
    nb(X(lv, k), Y(lv), lv === 0 ? 56 : 84, nm(lv, k), T[lv][k].slice(0, 4),
      {fill: onPath ? "url(#hp)" : (done ? css("--cellhl") : css("--cell")), lw: (onClimb && s.ph === 6 + lv) ? 3.5 : (onPath ? 1.6 : 1), dash: onClimb ? "3 3" : "none", bold: done}); }
  const defs = document.createElementNS(NS, "defs"), p = document.createElementNS(NS, "pattern");
  [["id", "hp"], ["width", 6], ["height", 6], ["patternUnits", "userSpaceOnUse"], ["patternTransform", "rotate(45)"]].forEach(([a, v]) => p.setAttribute(a, v));
  const r = document.createElementNS(NS, "rect"); [["width", 6], ["height", 6], ["fill", css("--cell")]].forEach(([a, v]) => r.setAttribute(a, v)); p.appendChild(r);
  const l = document.createElementNS(NS, "line"); [["x1", 0], ["y1", 0], ["x2", 0], ["y2", 6], ["stroke", css("--muted")], ["stroke-width", 2]].forEach(([a, v]) => l.setAttribute(a, v)); p.appendChild(l);
  defs.appendChild(p); svg.insertBefore(defs, svg.firstChild);
  el("text", {x: 460, y: 325, "text-anchor": "middle", "font-size": 11.5, fill: css("--muted")}, "sraffozott: autentikációs útvonal; pontozott keret: az ellenőrző számolja");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
