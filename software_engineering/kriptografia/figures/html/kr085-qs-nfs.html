<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QS és NFS munkaigénye</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>NFS-konstans c: <input id="cn" type="range" min="1500" max="2500" step="1" value="1923" oninput="upd()" aria-label="NFS-konstans c"></label> <span id="cv">1,923</span><button onclick="document.getElementById('cn').value=1923;upd()">c = (64/9)^(1/3)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kvadratikus szita és a számtestszita becsült log2 munkaigénye a modulus bithosszának függvényében; 2048 bitnél kb. 146 és 117, a NIST-érték 112."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell az o(1) tag elhagyásával, nem mérés; a NIST SP 800-57 értékei ettől eltérő, konzervatív becslések – ellenőrizendő. Lépésenként egy bithossz; a csúszka csak az NFS-konstanst változtatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"b": 512, "line": -1, "msg": "512 bit: QS ≈ 2^65,9, NFS ≈ 2^63,9 (c = 1,923); különbség 1,9 bit"}, {"b": 768, "line": -1, "msg": "768 bit: QS ≈ 2^83,4, NFS ≈ 2^76,5 (c = 1,923); különbség 6,9 bit"}, {"b": 1024, "line": -1, "msg": "1024 bit: QS ≈ 2^98,5, NFS ≈ 2^86,8 (c = 1,923), NIST: 80; különbség 11,7 bit"}, {"b": 1536, "line": -1, "msg": "1536 bit: QS ≈ 2^124,3, NFS ≈ 2^103,4 (c = 1,923); különbség 20,9 bit"}, {"b": 2048, "line": -1, "msg": "2048 bit: QS ≈ 2^146,4, NFS ≈ 2^116,9 (c = 1,923), NIST: 112; különbség 29,6 bit"}, {"b": 3072, "line": -1, "msg": "3072 bit: QS ≈ 2^184,3, NFS ≈ 2^138,7 (c = 1,923), NIST: 128; különbség 45,6 bit"}, {"b": 4096, "line": -1, "msg": "4096 bit: QS ≈ 2^216,8, NFS ≈ 2^156,5 (c = 1,923); különbség 60,3 bit"}, {"b": 7680, "line": -1, "msg": "7680 bit: QS ≈ 2^308,3, NFS ≈ 2^203,0 (c = 1,923), NIST: 192; különbség 105,3 bit"}, {"b": 15360, "line": -1, "msg": "15360 bit: QS ≈ 2^453,3, NFS ≈ 2^269,4 (c = 1,923), NIST: 256; különbség 183,9 bit"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NIST = {"1024": 80, "2048": 112, "3072": 128, "7680": 192, "15360": 256};
function L2(b, a, c){ const ln = b * Math.LN2; return c * Math.pow(ln, a) * Math.pow(Math.log(ln), 1 - a) / Math.LN2; }
function cc(){ return Number(document.getElementById("cn").value) / 1000; }
function f1(v){ return v.toFixed(1).replace(".", ","); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const c = cc(), X = b => 60 + (Math.log2(b) - 9) / (Math.log2(15360) - 9) * 470, Y = v => 290 - (v - 40) / 430 * 270;
  for (const t of [512, 1024, 2048, 3072, 4096, 7680, 15360]) {
    el("line", {x1: X(t), y1: 20, x2: X(t), y2: 290, stroke: css("--muted"), "stroke-dasharray": "2 3", "stroke-width": 0.6});
    el("text", {x: X(t), y: 306, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t));
  }
  for (let v = 50; v <= 450; v += 50) { el("text", {x: 52, y: Y(v) + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, String(v)); }
  el("text", {x: 290, y: 324, "text-anchor": "middle", "font-size": 11}, "modulus bithossza (log skála)");
  el("text", {x: 14, y: 160, "font-size": 11, transform: "rotate(-90 14 160)", "text-anchor": "middle"}, "log₂ munkaigény");
  const path = (a, cst) => { let d = ""; for (let i = 0; i <= 120; i++) { const b = Math.exp(Math.log(512) + i / 120 * (Math.log(15360) - Math.log(512))); d += (i ? "L" : "M") + X(b).toFixed(1) + "," + Y(L2(b, a, cst)).toFixed(1); } return d; };
  el("path", {d: path(0.5, 1), fill: "none", stroke: css("--line"), "stroke-width": 2.2});
  el("path", {d: path(1/3, c), fill: "none", stroke: css("--hl2"), "stroke-width": 2.2, "stroke-dasharray": "7 4"});
  for (const b in NIST) el("circle", {cx: X(+b), cy: Y(NIST[b]), r: 5, fill: css("--bg"), stroke: css("--line"), "stroke-width": 1.6});
  // kiemelt bithossz
  const q = L2(s.b, 0.5, 1), n = L2(s.b, 1/3, c);
  el("line", {x1: X(s.b), y1: Y(q), x2: X(s.b), y2: Y(n), stroke: css("--hl"), "stroke-width": 3});
  el("circle", {cx: X(s.b), cy: Y(q), r: 5, fill: css("--line")});
  el("rect", {x: X(s.b) - 4, y: Y(n) - 4, width: 8, height: 8, fill: css("--hl2")});
  const bx = Math.min(X(s.b) + 10, 400);
  el("rect", {x: bx, y: 30, width: 150, height: NIST[s.b] ? 70 : 54, fill: css("--bg"), stroke: css("--line")});
  el("text", {x: bx + 6, y: 47, "font-size": 11, "font-weight": "bold"}, s.b + " bit");
  el("text", {x: bx + 6, y: 63, "font-size": 11}, "QS: " + f1(q) + "   NFS: " + f1(n));
  el("text", {x: bx + 6, y: 79, "font-size": 11}, "különbség: " + f1(q - n) + " bit");
  if (NIST[s.b]) el("text", {x: bx + 6, y: 95, "font-size": 11}, "NIST: " + NIST[s.b]);
  el("text", {x: 66, y: 32, "font-size": 11}, "— QS, L[1/2; 1]");
  el("text", {x: 66, y: 48, "font-size": 11, fill: css("--hl2")}, "- - NFS, L[1/3; " + c.toFixed(3).replace(".", ",") + "]");
  el("text", {x: 66, y: 64, "font-size": 11}, "○ NIST-egyenérték");
}
function upd(){
  const c = cc(); document.getElementById("cv").textContent = c.toFixed(3).replace(".", ",");
  setSteps(STEPS.map(s => Object.assign({}, s, {msg: s.b + " bit: QS ≈ 2^" + f1(L2(s.b, .5, 1)) + ", NFS ≈ 2^" + f1(L2(s.b, 1/3, c)) + " (c = " + c.toFixed(3).replace(".", ",") + ")" + (NIST[s.b] ? ", NIST: " + NIST[s.b] : "") + "; különbség " + f1(L2(s.b, .5, 1) - L2(s.b, 1/3, c)) + " bit"})));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
