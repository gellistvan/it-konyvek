<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Játék CTR-DRBG lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>K0: <input id="k0" type="number" min="0" max="15" value="6" style="width:4em" aria-label="K0"></label><label>V0: <input id="v0" type="number" min="0" max="15" value="3" style="width:4em" aria-label="V0"></label><button onclick="load()">Újraszámolás</button><button onclick="load(9, 1)">2. feladat: K0 = 9, V0 = 1</button><button onclick="show(STEPS.length - 1)">Kompromittálás</button><label><input id="aes" type="checkbox" onchange="show(k)"> valódi AES</label><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két lépésben a (6,3) állapotból 2, 2 kimenet és (3,0), majd (1,0) állapot keletkezik; a régi állapotok áthúzva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">E_k(x) = x ⊕ k, 4 bit, a számláló mod 16 lép. Játékmodell, nem biztonságos; valódi CTR-DRBG: AES, SP 800-90A. Kezdőállapot: a 16.4.5 példája, (K0, V0) = (6, 3).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "g": 0, "K": 6, "V": 3, "line": -1, "outs": [], "hist": [[6, 3]], "msg": "Kezdőállapot: (K0, V0) = (6, 3) = (0110, 0011)"}, {"ph": 1, "g": 1, "K": 6, "V": 3, "V1": 4, "line": 1, "outs": [], "hist": [[6, 3]], "msg": "1. generálás – számláló léptetése: V1 = V + 1 = 3 + 1 = 4 (0100)"}, {"ph": 2, "g": 1, "K": 6, "V": 3, "V1": 4, "O": 2, "line": 2, "outs": [2], "hist": [[6, 3]], "msg": "Kimenet: O1 = E_6(4) = 4 ⊕ 6 = 2 (0010)"}, {"ph": 3, "g": 1, "K": 6, "V": 3, "V1": 4, "O": 2, "Kn": 3, "Vn": 0, "line": 3, "outs": [2], "hist": [[6, 3], [3, 0]], "msg": "Frissítés: K1 = E_6(5) = 3, V1' = E_6(6) = 0; a régi (6, 3) állapot eldobva → új állapot (3, 0)"}, {"ph": 1, "g": 2, "K": 3, "V": 0, "V1": 1, "line": 1, "outs": [2], "hist": [[6, 3], [3, 0]], "msg": "2. generálás – számláló léptetése: V2 = V + 1 = 0 + 1 = 1 (0001)"}, {"ph": 2, "g": 2, "K": 3, "V": 0, "V1": 1, "O": 2, "line": 2, "outs": [2, 2], "hist": [[6, 3], [3, 0]], "msg": "Kimenet: O2 = E_3(1) = 1 ⊕ 3 = 2 (0010)"}, {"ph": 3, "g": 2, "K": 3, "V": 0, "V1": 1, "O": 2, "Kn": 1, "Vn": 0, "line": 3, "outs": [2, 2], "hist": [[6, 3], [3, 0], [1, 0]], "msg": "Frissítés: K2 = E_3(2) = 1, V2' = E_3(3) = 0; a régi (3, 0) állapot eldobva → új állapot (1, 0)"}, {"ph": 4, "g": 3, "K": 1, "V": 0, "line": -1, "outs": [2, 2], "hist": [[6, 3], [3, 0], [1, 0]], "cand": [[1, 14], [3, 0], [5, 2], [7, 4], [9, 6], [11, 8], [13, 10], [15, 12]], "prevout": [2, 6, 14], "msg": "Kompromittálás: a támadó a (1, 0) állapotot látja. Játék: 256 előző állapotból 8 jelölt marad, előző kimenet ∈ {2, 6, 14}. Valódi AES: 2^256-nál több jelölt, nem számolható vissza."}];
const CODE = ["Generate(K, V):", "    V <- V + 1 (mod 16)", "    O <- E_K(V)                  # kimeneti blokk", "    K, V <- E_K(V + 1), E_K(V + 2)   # állapotfrissítés, a régi (K, V) eldobva", "    return O"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function b4(x){ return x.toString(2).padStart(4, "0"); }
function sbox(x, y, lab, K, V, cur, gone){
  el("rect", {x, y, width: 120, height: 70, rx: 6, fill: gone ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": cur ? 3.5 : 1.2, "stroke-dasharray": gone ? "5 3" : ""});
  el("text", {x: x + 60, y: y + 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, lab);
  el("text", {x: x + 60, y: y + 40, "text-anchor": "middle", "font-size": 13}, `K = ${K} (${b4(K)})`);
  el("text", {x: x + 60, y: y + 58, "text-anchor": "middle", "font-size": 13}, `V = ${V} (${b4(V)})`);
  if (gone) el("line", {x1: x + 4, y1: y + 66, x2: x + 116, y2: y + 4, stroke: css("--line"), "stroke-width": 2});
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const xs = [10, 220, 430], labs = ["(K0, V0)", "(K1, V1')", "(K2, V2')"], n = s.hist.length;
  s.hist.forEach(([K, V], i) => sbox(xs[i], 40, labs[i], K, V, i === n - 1 && s.ph !== 3 || (s.ph === 3 && i === n - 1), i < n - 1));
  if (s.ph >= 1 && s.ph <= 3) {
    const xm = xs[s.g - 1] + 160;
    el("text", {x: xm + 25, y: 140, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, s.g + ". generálás");
    el("text", {x: xm + 25, y: 160, "text-anchor": "middle", "font-size": 12, fill: s.ph === 1 ? css("--hl2") : css("--fg")}, `V${s.g} = ${s.V} + 1 = ${s.V1}`);
    if (s.ph >= 2) el("text", {x: xm + 25, y: 178, "text-anchor": "middle", "font-size": 12, fill: s.ph === 2 ? css("--hl2") : css("--fg")}, `O${s.g} = ${s.V1} ⊕ ${s.K} = ${s.O}`);
    if (s.ph >= 3) el("text", {x: xm + 25, y: 196, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, `K' = ${(s.V1 + 1) % 16} ⊕ ${s.K} = ${s.Kn}, V' = ${(s.V1 + 2) % 16} ⊕ ${s.K} = ${s.Vn}`);
  }
  el("text", {x: 10, y: 250, "font-size": 13}, "Kimeneti szalag:");
  s.outs.forEach((o, i) => { el("rect", {x: 130 + i * 90, y: 230, width: 80, height: 30, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5}); el("text", {x: 170 + i * 90, y: 250, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, `O${i + 1} = ${s.outs[i]}`); });
  if (s.ph === 4) {
    const aes = document.getElementById("aes") && document.getElementById("aes").checked;
    el("rect", {x: 320, y: 128, width: 232, height: 112, fill: "none", stroke: css("--hl2"), "stroke-width": 2, rx: 6});
    el("text", {x: 330, y: 148, "font-size": 12, "font-weight": "bold"}, `A támadó látja: (${s.K}, ${s.V})`);
    if (aes) { el("text", {x: 330, y: 170, "font-size": 12}, "Valódi AES: a jelöltek száma"); el("text", {x: 330, y: 188, "font-size": 12}, "2^256-nál több, nem számolható vissza."); }
    else {
      el("text", {x: 330, y: 170, "font-size": 12}, `Játék: 256-ból ${s.cand.length} előző állapot marad:`);
      el("text", {x: 330, y: 188, "font-size": 11.5}, s.cand.slice(0, 4).map(([a, b]) => `(${a},${b})`).join(" "));
      el("text", {x: 330, y: 206, "font-size": 11.5}, s.cand.slice(4).map(([a, b]) => `(${a},${b})`).join(" "));
      el("text", {x: 330, y: 228, "font-size": 12}, `előző kimenet ∈ {${s.prevout.join(", ")}}`);
    }
  }
}
function generate(K, V){ const V1 = (V + 1) % 16; return [V1, V1 ^ K, ((V1 + 1) % 16) ^ K, ((V1 + 2) % 16) ^ K]; }
function candidates(K, V){ const c = []; for (let k = 0; k < 16; k++) for (let v = 0; v < 16; v++) { const g = generate(k, v); if (g[2] === K && g[3] === V) c.push([k, v]); } const po = [...new Set(c.map(([k, v]) => generate(k, v)[1]))].sort((a, b) => a - b); return [c, po]; }
function trace(K0, V0){
  const st = []; let K = K0, V = V0; const outs = [], hist = [[K, V]];
  st.push({ph: 0, g: 0, K, V, line: -1, outs: [], hist: [[K, V]], msg: `Kezdőállapot: (K0, V0) = (${K}, ${V}) = (${b4(K)}, ${b4(V)})`});
  for (const g of [1, 2]) {
    const [V1, O, Kn, Vn] = generate(K, V);
    st.push({ph: 1, g, K, V, V1, line: 1, outs: [...outs], hist: hist.map(x => [...x]), msg: `${g}. generálás – számláló léptetése: V${g} = V + 1 = ${V} + 1 = ${V1} (${b4(V1)})`});
    outs.push(O);
    st.push({ph: 2, g, K, V, V1, O, line: 2, outs: [...outs], hist: hist.map(x => [...x]), msg: `Kimenet: O${g} = E_${K}(${V1}) = ${V1} ⊕ ${K} = ${O} (${b4(O)})`});
    hist.push([Kn, Vn]);
    st.push({ph: 3, g, K, V, V1, O, Kn, Vn, line: 3, outs: [...outs], hist: hist.map(x => [...x]), msg: `Frissítés: K${g} = E_${K}(${(V1 + 1) % 16}) = ${Kn}, V${g}' = E_${K}(${(V1 + 2) % 16}) = ${Vn}; a régi (${K}, ${V}) állapot eldobva → új állapot (${Kn}, ${Vn})`});
    K = Kn; V = Vn;
  }
  const [c, po] = candidates(K, V);
  st.push({ph: 4, g: 3, K, V, line: -1, outs: [...outs], hist: hist.map(x => [...x]), cand: c, prevout: po, msg: `Kompromittálás: a támadó a (${K}, ${V}) állapotot látja. Játék: 256 előző állapotból ${c.length} jelölt marad, előző kimenet ∈ {${po.join(", ")}}. Valódi AES: 2^256-nál több jelölt, nem számolható vissza.`});
  return st;
}
function load(k0, v0){
  if (k0 !== undefined) { document.getElementById("k0").value = k0; document.getElementById("v0").value = v0; }
  const K = +document.getElementById("k0").value, V = +document.getElementById("v0").value;
  if (!(K >= 0 && K <= 15 && V >= 0 && V <= 15 && Number.isInteger(K) && Number.isInteger(V))) { document.getElementById("err").textContent = "K0 és V0: 0–15 egész."; return; }
  document.getElementById("err").textContent = ""; setSteps(trace(K, V));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
