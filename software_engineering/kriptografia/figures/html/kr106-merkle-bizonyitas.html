<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merkle-tagsági és konzisztencia-bizonyítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Mód:</span><label><input type="radio" name="mm" value="incl" checked onchange="reload()"> tagsági (kattints egy levélre)</label><label><input type="radio" name="mm" value="cons" onchange="reload()"> konzisztencia</label><button onclick="addLeaf()">Hozzáfűzés</button> <button onclick="resetTree()">Újrakezdés (1 levél)</button><span id="nlab">8 levél</span><label for="old">régi → új méret:</label> <select id="old" onchange="pickOld()" disabled></select></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc levelű Merkle-fa; a h5 levél tagsági bizonyításában a h6, a h78 és a h1234 csúcs vastag keretes, a felfelé rekonstruált csúcsok szaggatottak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított érték (Python hashlib, SHA-256), RFC 6962 szerinti 0x00/0x01 előtaggal; levelek: d_i = „tanusitvany_i”, hozzáfűzési sorrendben. A tagsági kód a fejezet javított verify-függvénye.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "incl", "n": 8, "old": 0, "st": {"5-6": "proof", "6-8": "proof", "0-4": "proof", "4-5": "target"}, "tags": {"5-6": "jobb", "6-8": "jobb", "0-4": "bal"}, "cur": "4-5", "msg": "current = H(0x00 ‖ d5) = 7f4a… (a h₅ levél); bizonyítás: h₆ (jobb), h₇₈ (jobb), h₁₂₃₄ (bal)", "line": 3}, {"mode": "incl", "n": 8, "old": 0, "st": {"5-6": "proof", "6-8": "proof", "0-4": "proof", "4-5": "target", "4-6": "rec"}, "tags": {"5-6": "jobb", "6-8": "jobb", "0-4": "bal"}, "cur": "4-6", "msg": "current = H(0x01 ‖ h₅ ‖ h₆) = 57ba… (h₅₆)", "line": 8}, {"mode": "incl", "n": 8, "old": 0, "st": {"5-6": "proof", "6-8": "proof", "0-4": "proof", "4-5": "target", "4-6": "rec", "4-8": "rec"}, "tags": {"5-6": "jobb", "6-8": "jobb", "0-4": "bal"}, "cur": "4-8", "msg": "current = H(0x01 ‖ h₅₆ ‖ h₇₈) = 4a36… (h₅₆₇₈)", "line": 8}, {"mode": "incl", "n": 8, "old": 0, "st": {"5-6": "proof", "6-8": "proof", "0-4": "proof", "4-5": "target", "4-6": "rec", "4-8": "rec", "0-8": "rec"}, "tags": {"5-6": "jobb", "6-8": "jobb", "0-4": "bal"}, "cur": "0-8", "msg": "current = H(0x01 ‖ h₁₂₃₄ ‖ h₅₆₇₈) = 072f… (h₁…₈, ez a gyökér → egyezik, a bizonyítás érvényes)", "line": 6}];
const CODE = ["def H_leaf(d):    return sha256(b'\\x00' + d).digest()", "def H_node(l, r): return sha256(b'\\x01' + l + r).digest()", "def verify(d, proof, root):", "    current = H_leaf(d)", "    for side, sibling in proof:      # side: a TESTVÉR helye", "        if side == 'left':", "            current = H_node(sibling, current)", "        else:", "            current = H_node(current, sibling)", "    return current == root", "def verify_consistency(m, n, old_root, new_root, proof):", "    if m & (m - 1) == 0: proof = [old_root] + proof   # m kettőhatvány", "    fn, sn = m - 1, n - 1", "    while fn & 1: fn, sn = fn >> 1, sn >> 1", "    fr = sr = proof[0]", "    for c in proof[1:]:", "        if fn & 1 or fn == sn:", "            fr, sr = H_node(c, fr), H_node(c, sr)", "            while fn and not fn & 1: fn, sn = fn >> 1, sn >> 1", "        else:", "            sr = H_node(sr, c)", "        fn, sn = fn >> 1, sn >> 1", "    return fr == old_root and sr == new_root and sn == 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC_COL = {fg: "--fg", muted: "--muted", bg: "--bg", g1: "--sc-g1", g2: "--sc-g2", g3: "--sc-g3",
  hl: "--hl", hl2: "--hl2", hlf: "--sc-hlf", hl2f: "--sc-hl2f", ok: "--sc-ok", err: "--sc-err", okf: "--sc-okf", errf: "--sc-errf"};
const SC_DASH = {solid: "", dash: "6 3.5", dot: "1.2 2.2", dashdot: "7 3 1.5 3", longdash: "10 4"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML =
    ["fg", "muted", "hl", "hl2", "g3", "ok", "err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`) +
    pat("h-hz", `<path d="M0,3.5L7,3.5" stroke="${f}" stroke-width="0.9"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//": "h-sl", "///": "h-sl", "////": "h-sl", "\\\\": "h-bs", "\\\\\\\\": "h-bs", "..": "h-dt", "...": "h-dt", "xx": "h-xx", "--": "h-hz"};
function scDraw(prims, ox, oy){
  ox = ox || 0; oy = oy || 0;
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    if (p[0] === "rect") {
      const x = p[1], y = p[2], w = p[3], h = p[4], ec = scCol(st.stroke, "fg"), lw = st.lw === undefined ? 1.2 : st.lw;
      const a = {x: x + ox, y: y + oy, width: w, height: h, fill: scCol(st.fill, "bg"), stroke: ec, "stroke-width": lw};
      if (st.rx) a.rx = st.rx;
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      el("rect", a);
      if (st.hatch && SC_HATCH[st.hatch]) el("rect", {x: x + ox, y: y + oy, width: w, height: h, fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none", rx: st.rx || 0});
      if (st.cross) { el("line", {x1: x + ox, y1: y + oy, x2: x + ox + w, y2: y + oy + h, stroke: ec, "stroke-width": lw * 1.1});
                      el("line", {x1: x + ox, y1: y + oy + h, x2: x + ox + w, y2: y + oy, stroke: ec, "stroke-width": lw * 1.1}); }
    } else if (p[0] === "circ") {
      const a = {cx: p[1] + ox, cy: p[2] + oy, r: p[3], fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": st.lw === undefined ? 1.2 : st.lw};
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      el("circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) el("circle", {cx: p[1] + ox, cy: p[2] + oy, r: p[3], fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"});
    } else if (p[0] === "line" || p[0] === "poly") {
      const pts = p[0] === "line" ? [[p[1], p[2]], [p[3], p[4]]] : p[1];
      const c = scCol(st.color, "fg"), lw = st.lw === undefined ? 1.2 : st.lw;
      const d = pts.map((q, i) => (i ? "L" : "M") + (q[0] + ox).toFixed(1) + "," + (q[1] + oy).toFixed(1)).join(" ") + (st.closed ? " Z" : "");
      if (st.fill && st.fill !== "none") {
        el("path", {d: d + " Z", fill: scCol(st.fill), stroke: "none"});
        if (st.hatch && SC_HATCH[st.hatch]) el("path", {d: d + " Z", fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"});
      }
      const mk = `url(#scah-${["muted", "hl", "hl2", "g3", "ok", "err"].includes(st.color) ? st.color : "fg"})`;
      const a = {d: d, fill: "none", stroke: c, "stroke-width": Math.max(lw, 0.01)};
      if (lw < 0.05) a.stroke = "none";
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      if (st.arrow) a["marker-end"] = mk;
      if (st.arrow0) a["marker-start"] = mk;
      if (lw < 0.05 && st.arrow) { // csak nyílhegy (dupla nyílnál)
        const n = pts.length, q0 = pts[n - 2], q1 = pts[n - 1], ang = Math.atan2(q1[1] - q0[1], q1[0] - q0[0]);
        const x = q1[0] + ox, y = q1[1] + oy, s = 11;
        el("path", {d: `M${x},${y}L${x - s * Math.cos(ang) + s * 0.5 * Math.sin(ang)},${y - s * Math.sin(ang) - s * 0.5 * Math.cos(ang)}L${x - s * Math.cos(ang) - s * 0.5 * Math.sin(ang)},${y - s * Math.sin(ang) + s * 0.5 * Math.cos(ang)}Z`, fill: c});
      } else el("path", a);
    } else if (p[0] === "text") {
      const a = {x: p[1] + ox, y: p[2] + oy, "font-size": st.size || 15, "text-anchor": st.anchor || "start"};
      if (st.color && st.color !== "fg") a.fill = scCol(st.color);
      if (st.weight && st.weight !== "normal") a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,Menlo,Consolas,monospace";
      el("text", a, p[3]);
    }
  }
}

  const s = document.createElement("style");
  s.textContent = ":root{--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}" +

  document.head.appendChild(s);
})();

const X0 = 60, DX = 111, DY = 84, BW = 92, BH = 50, SZ = 16;
const STY = {plain: {fill: "bg", lw: 1.2}, proof: {fill: "hlf", lw: 3.4}, rec: {fill: "bg", lw: 2.0, ls: "dash"},
             target: {fill: "g2", lw: 2.0}, oldroot: {fill: "hlf", lw: 3.4}};
const SUB = "₀₁₂₃₄₅₆₇₈₉";
function kp(n){ let q = 1; while (q * 2 < n) q *= 2; return q; }
function hgt(a, b){ let h = 0; while ((1 << h) < b - a) h++; return h; }
function nm(a, b){ if (b - a > 4) return "h" + SUB[a + 1] + "…" + SUB[b]; let s = "h"; for (let i = a + 1; i <= b; i++) s += SUB[i]; return s; }

             pr.push(["text", X0 - BW / 2, yb + BH / 2 + 22, "régi fa (" + old + " levél)", {size: SZ, italic: true}]); }
  for (const key in P) { const [a, b] = key.split("-").map(Number); if (b - a > 1) { const q = kp(b - a);
      for (const [c, d] of [[a, a + q], [a + q, b]]) pr.push(["line", P[key], ny(a, b) + BH / 2, P[c + "-" + d], ny(c, d) - BH / 2, {lw: 1.2, color: "g3"}]); } }

let N = 8, LEAF = 4, OLD = 4;
function mode(){ return document.querySelector('input[name=mm]:checked').value; }
function reload(keep){
  document.getElementById("nlab").textContent = N + " levél";
  const sel = document.getElementById("old");
  sel.innerHTML = ""; for (let m = 1; m < N; m++) { const o = document.createElement("option"); o.value = m; o.textContent = m + " → " + N; if (m === OLD) o.selected = true; sel.appendChild(o); }

  if (mode() === "cons" && N >= 2) { if (OLD >= N) OLD = N - 1; sel.value = OLD; setSteps(CONS[N][OLD]); }
  else { if (LEAF >= N) LEAF = N - 1; setSteps(INCL[N][LEAF]); }

}
function addLeaf(){ if (N < 8) { N++; reload(); } }
function resetTree(){ N = 1; LEAF = 0; reload(); }
function pickOld(){ OLD = +document.getElementById("old").value; reload(); }
function render(s){
  svg.innerHTML = ""; scDefs();
  const r = treePrims(s, 0), pr = r[0], h = r[1];
  svg.setAttribute("viewBox", "0 0 900 " + Math.ceil(h + 6));
  scDraw(pr.filter(p => p[0] !== "hit"));
  // kódpanel: csak az aktuális módhoz tartozó sorok
  codeEl.querySelectorAll("span").forEach((sp, i) => { sp.style.display = (s.mode === "incl") === (i < 10) || i < 2 ? "block" : "none"; });
  if (s.mode === "incl") for (const p of pr) if (p[0] === "hit") {

    const go = () => { LEAF = p[5]; setSteps(INCL[N][LEAF]); };
    rr.addEventListener("click", go); rr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
