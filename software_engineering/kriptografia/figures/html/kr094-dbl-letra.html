<p class="small">y² = x³ + 2x + 3 (mod 17), a görbének 22 pontja van (O-val). A kód a fejezet Python-illusztrációja; a kiemelt sor a létra aktuális művelete. D = duplázás, A = összeadás; a szaggatott, üres mező a 0-s bitnél kimaradó összeadás. Számított, nem mérés; oktatási játékpélda, nem konstans idejű.</p>
<script>

let STEPS = [{"msg": "k = 13 = 1101₂, P = (5, 6). Kezdetben R = O; a létrán (R0, R1) = (O, P).", "line": -1, "bi": -1, "sub": 1, "R": "O", "m": 0, "R0": "O", "R1": "(5, 6)", "m0": 0, "tD": [], "tL": [], "rowsD": [], "rowsL": [], "bits": "1101"}, {"msg": "1. bit = 1: double-and-add: R ← 2R = [0]P = O; létra: R0 ← R0 + R1 → (R0, R1) = ((5, 6), (5, 6))", "line": 15, "bi": 0, "sub": 0, "R": "O", "m": 0, "R0": "(5, 6)", "R1": "(5, 6)", "m0": 0, "tD": ["D"], "tL": ["A"], "rowsD": [["[0]P = O", null]], "rowsL": [["A: R0=[1]P, R1=[1]P", null]], "bits": "1101"}, {"msg": "1. bit = 1: double-and-add: R ← R + P = [1]P = (5, 6); létra: R1 ← 2·R1 → (R0, R1) = ((5, 6), (15, 12)) = ([1]P, [2]P)", "line": 16, "bi": 0, "sub": 1, "R": "(5, 6)", "m": 1, "R0": "(5, 6)", "R1": "(15, 12)", "m0": 1, "tD": ["D", "A"], "tL": ["A", "D"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"]], "bits": "1101", "pairs": null}, {"msg": "2. bit = 1: double-and-add: R ← 2R = [2]P = (15, 12); létra: R0 ← R0 + R1 → (R0, R1) = ((13, 13), (15, 12))", "line": 15, "bi": 1, "sub": 0, "R": "(15, 12)", "m": 2, "R0": "(13, 13)", "R1": "(15, 12)", "m0": 1, "tD": ["D", "A", "D"], "tL": ["A", "D", "A"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", null]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", null]], "bits": "1101"}, {"msg": "2. bit = 1: double-and-add: R ← R + P = [3]P = (13, 13); létra: R1 ← 2·R1 → (R0, R1) = ((13, 13), (8, 2)) = ([3]P, [4]P)", "line": 16, "bi": 1, "sub": 1, "R": "(13, 13)", "m": 3, "R0": "(13, 13)", "R1": "(8, 2)", "m0": 3, "tD": ["D", "A", "D", "A"], "tL": ["A", "D", "A", "D"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", "[3]P = (13, 13)"]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", "(R0, R1) = ([3]P, [4]P)"]], "bits": "1101", "pairs": null}, {"msg": "3. bit = 0: double-and-add: R ← 2R = [6]P = (12, 2); létra: R1 ← R0 + R1 → (R0, R1) = ((13, 13), (9, 6))", "line": 12, "bi": 2, "sub": 0, "R": "(12, 2)", "m": 6, "R0": "(13, 13)", "R1": "(9, 6)", "m0": 3, "tD": ["D", "A", "D", "A", "D"], "tL": ["A", "D", "A", "D", "A"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", "[3]P = (13, 13)"], ["[6]P = (12, 2)", null]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", "(R0, R1) = ([3]P, [4]P)"], ["A: R0=[3]P, R1=[7]P", null]], "bits": "1101"}, {"msg": "3. bit = 0: double-and-add: bit 0: NINCS összeadás (bitfüggő!); létra: R0 ← 2·R0 → (R0, R1) = ((12, 2), (9, 6)) = ([6]P, [7]P)", "line": 13, "bi": 2, "sub": 1, "R": "(12, 2)", "m": 6, "R0": "(12, 2)", "R1": "(9, 6)", "m0": 6, "tD": ["D", "A", "D", "A", "D", "-"], "tL": ["A", "D", "A", "D", "A", "D"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", "[3]P = (13, 13)"], ["[6]P = (12, 2)", "—"]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", "(R0, R1) = ([3]P, [4]P)"], ["A: R0=[3]P, R1=[7]P", "(R0, R1) = ([6]P, [7]P)"]], "bits": "1101", "pairs": null}, {"msg": "4. bit = 1: double-and-add: R ← 2R = [12]P = (14, 2); létra: R0 ← R0 + R1 → (R0, R1) = ((11, 8), (9, 6))", "line": 15, "bi": 3, "sub": 0, "R": "(14, 2)", "m": 12, "R0": "(11, 8)", "R1": "(9, 6)", "m0": 6, "tD": ["D", "A", "D", "A", "D", "-", "D"], "tL": ["A", "D", "A", "D", "A", "D", "A"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", "[3]P = (13, 13)"], ["[6]P = (12, 2)", "—"], ["[12]P = (14, 2)", null]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", "(R0, R1) = ([3]P, [4]P)"], ["A: R0=[3]P, R1=[7]P", "(R0, R1) = ([6]P, [7]P)"], ["A: R0=[13]P, R1=[7]P", null]], "bits": "1101"}, {"msg": "4. bit = 1: double-and-add: R ← R + P = [13]P = (11, 8); létra: R1 ← 2·R1 → (R0, R1) = ((11, 8), (3, 6)) = ([13]P, [14]P). Eredmény: mindkét algoritmus [13]P = (11, 8).", "line": 16, "bi": 3, "sub": 1, "R": "(11, 8)", "m": 13, "R0": "(11, 8)", "R1": "(3, 6)", "m0": 13, "tD": ["D", "A", "D", "A", "D", "-", "D", "A"], "tL": ["A", "D", "A", "D", "A", "D", "A", "D"], "rowsD": [["[0]P = O", "[1]P = (5, 6)"], ["[2]P = (15, 12)", "[3]P = (13, 13)"], ["[6]P = (12, 2)", "—"], ["[12]P = (14, 2)", "[13]P = (11, 8)"]], "rowsL": [["A: R0=[1]P, R1=[1]P", "(R0, R1) = ([1]P, [2]P)"], ["A: R0=[3]P, R1=[2]P", "(R0, R1) = ([3]P, [4]P)"], ["A: R0=[3]P, R1=[7]P", "(R0, R1) = ([6]P, [7]P)"], ["A: R0=[13]P, R1=[7]P", "(R0, R1) = ([13]P, [14]P)"]], "bits": "1101", "pairs": null}];
const CODE = ["def double_and_add(k, P):", "    R = None", "    for bit in bin(k)[2:]:", "        R = add(R, R)", "        if bit == '1':", "            R = add(R, P)", "    return R", "", "def ladder_affin(k, P):", "    R0, R1 = None, P", "    for bit in bin(k)[2:]:", "        if bit == '0':", "            R1 = add(R0, R1)", "            R0 = add(R0, R0)", "        else:", "            R0 = add(R0, R1)", "            R1 = add(R1, R1)", "    return R0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(x, m){ return ((x % m) + m) % m; }
function minv(x, m){ x = md(x, m); for (let t = 1; t < m; t++) if ((x * t) % m === 1) return t; return null; }
function ecAdd(P, Q, p, a){
  if (P === null) return Q; if (Q === null) return P;
  const [x1, y1] = P, [x2, y2] = Q;
  if (x1 === x2 && md(y1 + y2, p) === 0) return null;
  let lam;
  if (x1 === x2 && y1 === y2) lam = md((3 * x1 * x1 + a) * minv(2 * y1, p), p);
  else lam = md((y2 - y1) * minv(x2 - x1, p), p);
  const x3 = md(lam * lam - x1 - x2, p);
  return [x3, md(lam * (x1 - x3) - y1, p)];
}
function ecMul(n, P, p, a){ let R = null; for (const b of n.toString(2)) { R = ecAdd(R, R, p, a); if (b === "1") R = ecAdd(R, P, p, a); } return n > 0 ? R : null; }
function fp(P){ return P === null ? "O" : "(" + P[0] + ", " + P[1] + ")"; }

const CP = 17, CA = 2;
function traceJS(kk, PP){
  const bits = kk.toString(2); let R = null, m = 0, R0 = null, R1 = PP, m0 = 0;
  const tD = [], tL = [], rowsD = [], rowsL = [];
  const out = [{msg: "k = " + kk + " = " + bits + "₂, P = " + fp(PP) + ". Kezdetben R = O; a létrán (R0, R1) = (O, P).",
    line: -1, bi: -1, sub: 1, R: fp(R), m: 0, R0: fp(R0), R1: fp(R1), m0: 0, tD: [], tL: [], rowsD: [], rowsL: [], bits: bits}];
  const cp = x => JSON.parse(JSON.stringify(x));
  for (let i = 0; i < bits.length; i++){
    const bit = bits[i];
    R = ecAdd(R, R, CP, CA); m *= 2; tD.push("D");
    const rowD = ["[" + m + "]P = " + fp(R), null];
    let line, op, pa;
    if (bit === "0"){ R1 = ecAdd(R0, R1, CP, CA); line = 12; op = "R1 ← R0 + R1"; pa = [m0, 2*m0+1]; }
    else { R0 = ecAdd(R0, R1, CP, CA); line = 15; op = "R0 ← R0 + R1"; pa = [2*m0+1, m0+1]; }
    tL.push("A");
    const rowL = ["A: R0=[" + pa[0] + "]P, R1=[" + pa[1] + "]P", null];
    rowsD.push(rowD); rowsL.push(rowL);
    out.push({msg: (i+1) + ". bit = " + bit + ": double-and-add: R ← 2R = [" + m + "]P = " + fp(R) + "; létra: " + op +
      " → (R0, R1) = (" + fp(R0) + ", " + fp(R1) + ")", line: line, bi: i, sub: 0, R: fp(R), m: m, R0: fp(R0), R1: fp(R1),
      m0: m0, tD: tD.slice(), tL: tL.slice(), rowsD: cp(rowsD), rowsL: cp(rowsL), bits: bits});
    let dmsg;
    if (bit === "1"){ R = ecAdd(R, PP, CP, CA); m += 1; tD.push("A"); rowD[1] = "[" + m + "]P = " + fp(R); dmsg = "R ← R + P = [" + m + "]P = " + fp(R); }
    else { tD.push("-"); rowD[1] = "—"; dmsg = "bit 0: NINCS összeadás (bitfüggő!)"; }
    if (bit === "0"){ R0 = ecAdd(R0, R0, CP, CA); m0 = 2*m0; line = 13; op = "R0 ← 2·R0"; }
    else { R1 = ecAdd(R1, R1, CP, CA); m0 = 2*m0+1; line = 16; op = "R1 ← 2·R1"; }
    tL.push("D"); rowL[1] = "(R0, R1) = ([" + m0 + "]P, [" + (m0+1) + "]P)";
    out.push({msg: (i+1) + ". bit = " + bit + ": double-and-add: " + dmsg + "; létra: " + op + " → (R0, R1) = (" + fp(R0) +
      ", " + fp(R1) + ") = ([" + m0 + "]P, [" + (m0+1) + "]P)", line: line, bi: i, sub: 1, R: fp(R), m: m, R0: fp(R0),
      R1: fp(R1), m0: m0, tD: tD.slice(), tL: tL.slice(), rowsD: cp(rowsD), rowsL: cp(rowsL), bits: bits});
  }
  out[out.length-1].msg += ". Eredmény: mindkét algoritmus [" + kk + "]P = " + fp(R) + ".";
  return out;
}
document.getElementById("go").onclick = () => {
  const kk = parseInt(document.getElementById("kin").value, 10), em = document.getElementById("emsg");
  if (!(kk >= 1 && kk <= 21)) { em.textContent = "k legyen 1 és 21 között."; return; }
  const PP = document.getElementById("pin").value.split(",").map(Number);
  em.textContent = ""; setSteps(traceJS(kk, PP));
};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const nb = s.bits.length, x0 = 130, cw = Math.min(150, (750 - x0) / nb);
  el("text", {x: 6, y: 22, "font-size": 13, "font-weight": "bold"}, "bit:");
  for (let i = 0; i < nb; i++){
    const on = i === s.bi;
    el("rect", {x: x0 + i*cw + 2, y: 6, width: cw - 4, height: 24, fill: on ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": on ? 2.5 : 0.8});
    el("text", {x: x0 + i*cw + cw/2, y: 23, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, (i+1) + ". bit = " + s.bits[i]);
  }
  el("text", {x: 6, y: 62, "font-size": 13}, "double-and-add");
  el("text", {x: 6, y: 152, "font-size": 13}, "Montgomery-létra");
  for (let i = 0; i < nb; i++){
    const x = x0 + i*cw;
    const rd = s.rowsD[i], rl = s.rowsL[i];
    const boxes = [[44, rd ? "D: " + rd[0] : "", false, rd ? false : true],
                   [74, rd && rd[1] ? (rd[1] === "—" ? "nincs A (bit 0)" : "A: " + rd[1]) : "", true, !(rd && rd[1])],
                   [126, rl ? rl[0] : "", true, !rl], [156, rl && rl[1] ? "D: " + rl[1].replace("(R0, R1) = ", "") : "", false, !(rl && rl[1])]];
    boxes.forEach(([y, t, filled, empty]) => {
      const skip = t === "nincs A (bit 0)";
      el("rect", {x: x + 2, y: y, width: cw - 4, height: 26, fill: empty ? "none" : (filled && !skip ? css("--cellhl") : css("--cell")),
        stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": (skip || empty) ? "4 3" : "none"});
      if (t) el("text", {x: x + cw/2, y: y + 17, "text-anchor": "middle", "font-size": 11}, t);
    });
  }
  el("text", {x: 6, y: 210, "font-size": 13}, "R = " + s.R);
  el("text", {x: 260, y: 210, "font-size": 13}, "R0 = " + s.R0 + ",  R1 = " + s.R1);
  el("text", {x: 6, y: 244, "font-size": 13, "font-weight": "bold"}, "műveletszalag");
  function tp(y, seq, lab){
    el("text", {x: 6, y: y + 17, "font-size": 12}, lab);
    seq.forEach((t, j) => {
      const xx = x0 + j * 30;
      el("rect", {x: xx, y: y, width: 26, height: 24, fill: t === "A" ? css("--fg") : "none", stroke: css("--line"), "stroke-dasharray": t === "-" ? "4 3" : "none"});
      if (t !== "-") el("text", {x: xx + 13, y: y + 17, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: t === "A" ? css("--bg") : css("--fg")}, t);
      else el("text", {x: xx + 13, y: y + 17, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "–");
    });
    const nD = seq.filter(t => t === "D").length, nA = seq.filter(t => t === "A").length;
    el("text", {x: x0 + seq.length * 30 + 8, y: y + 17, "font-size": 12}, nD + " D + " + nA + " A");
  }
  tp(254, s.tD, "double-and-add");
  tp(290, s.tL, "létra");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
