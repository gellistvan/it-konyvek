<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSA-visszafejtés CRT-vel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>p <input id="ip" type="number" value="11" style="width:5em" aria-label="p"></label><label>q <input id="iq" type="number" value="13" style="width:5em" aria-label="q"></label><label>e <input id="ie" type="number" value="7" style="width:5em" aria-label="e"></label><label>c <input id="ic" type="number" value="2" style="width:6em" aria-label="c"></label><label><input id="flt" type="checkbox"> hiba injektálása (m_q helyett m_q − 1)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kétágú folyamatábra: d_p = 3, m_p = 8 a mod 11 ágon, d_q = 7, m_q = 11 a mod 13 ágon, majd inverz 6, t = 5, m = 63."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 4.2.9 képletei; kezdőállapot: a 4. feladat számai (p = 11, q = 13, e = 7, c = 2). A hibainjektálás a fejezet játékpéldáján szimulált, nem éles támadás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Bemenet: p = 11, q = 13, N = 143, e = 7, d = 103 (7·103 ≡ 1 mod λ = 60), c = 2", "k": 0, "line": 0}, {"msg": "1. kitevőredukció: d_p = 103 mod 10 = 3, d_q = 103 mod 12 = 7", "k": 1, "line": 1}, {"msg": "2. m_p = 2^3 mod 11 = 8", "k": 2, "line": 2}, {"msg": "3. m_q = 2^7 mod 13 = 11", "k": 3, "line": 3}, {"msg": "4. p^(−1) mod q = 11^(−1) mod 13 = 6", "k": 4, "line": 4}, {"msg": "5. t = (m_q − m_p)·6 mod 13 = (11 − 8)·6 mod 13 = 5", "k": 5, "line": 5}, {"msg": "6. m = m_p + p·t = 8 + 11·5 = 63; ellenőrzés: 63^7 mod 143 = 2", "k": 6, "line": 6}];
const CODE = ["N = p·q;  d = e^(−1) mod lcm(p−1, q−1)", "d_p = d mod (p−1);  d_q = d mod (q−1)", "m_p = c^(d_p) mod p", "m_q = c^(d_q) mod q", "inv = p^(−1) mod q", "t = ((m_q − m_p)·inv) mod q", "m = m_p + p·t"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function mp_(b, e, m){ b = BigInt(b) % BigInt(m); e = BigInt(e); m = BigInt(m); let r = 1n; while (e > 0n) { if (e & 1n) r = r * b % m; b = b * b % m; e >>= 1n; } return Number(r); }
function eg(a, b){ let [r0, r1, s0, s1] = [a, b, 1, 0]; while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return [r0, s0]; }
function inv(a, m){ const [g, s] = eg(((a % m) + m) % m, m); return g === 1 ? ((s % m) + m) % m : null; }
function gcdn(a, b){ while (b) [a, b] = [b, a % b]; return Math.abs(a); }
function isPrime(n){ if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function comp(p, q, e, c, fault, dd){
  const N = p * q, lam = (p - 1) * (q - 1) / gcdn(p - 1, q - 1), d = dd || inv(e, lam);
  const dp = d % (p - 1), dq = d % (q - 1), mp = mp_(c, dp, p), mq0 = mp_(c, dq, q);
  const mq = fault ? (mq0 + q - 1) % q : mq0, iv = inv(p, q), t = (((mq - mp) * iv) % q + q) % q, m = mp + p * t;
  const chk = mp_(m, e, N), g = gcdn(((chk - c) % N + N) % N, N);
  return {p, q, e, c, N, lam, d, dp, dq, mp, mq, mq0, iv, t, m, chk, g, fault};
}
let R = comp(11, 13, 7, 2, false, 103);
function box(x, y, w, h, lines, on, kind){
  const fill = kind === "p" ? "url(#hp)" : kind === "q" ? "url(#hq)" : css("--cell");
  el("rect", {x, y, width: w, height: h, rx: 8, fill: on ? fill : css("--cell"), stroke: css("--line"), "stroke-width": kind === "m" ? 3 : 1.3, opacity: on ? 1 : 0.35});
  lines.forEach((t, i) => el("text", {x: x + w / 2, y: y + h / 2 + 5 + (i - (lines.length - 1) / 2) * 17, "text-anchor": "middle", "font-size": 13, fill: on ? (kind === "p" || kind === "q" ? "#000" : css("--fg")) : css("--muted")}, t));
}
function ar(x1, y1, x2, y2, dash){ el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": dash || "", "marker-end": "url(#ah)"}); }
function render(s){
  const kk = s.k, r = R; svg.setAttribute("viewBox", "0 0 640 400"); svg.innerHTML = "";
  const d = el("defs", {});
  d.innerHTML = '<pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e6e6e6"/><path d="M0 8L8 0" stroke="#999"/></pattern>'
    + '<pattern id="hq" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><circle cx="4" cy="4" r="1" fill="#999"/></pattern>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="' + css("--line") + '"/></marker>';
  box(150, 8, 280, 36, [`c = ${r.c}, N = ${r.N}, d = ${r.d}`], true, "");
  box(20, 70, 240, 46, [`mod p = ${r.p}`, `d_p = ${r.d} mod ${r.p - 1} = ${r.dp}`], kk >= 1, "p");
  box(320, 70, 240, 46, [`mod q = ${r.q}`, `d_q = ${r.d} mod ${r.q - 1} = ${r.dq}`], kk >= 1, "q");
  box(20, 145, 240, 36, [`m_p = ${r.c}^${r.dp} mod ${r.p} = ${r.mp}`], kk >= 2, "p");
  box(320, 145, 240, 36, r.fault ? [`m_q' = ${r.mq} (HIBÁS; helyes: ${r.mq0})`] : [`m_q = ${r.c}^${r.dq} mod ${r.q} = ${r.mq}`], kk >= 3, "q");
  box(140, 210, 300, 36, [`p⁻¹ mod q = ${r.iv}`], kk >= 4, "");
  box(140, 262, 300, 36, [`t = (${r.mq} − ${r.mp})·${r.iv} mod ${r.q} = ${r.t}`], kk >= 5, "");
  box(140, 314, 300, 36, [`m = ${r.mp} + ${r.p}·${r.t} = ${r.m}`], kk >= 6, "m");
  ar(240, 44, 140, 70); ar(340, 44, 440, 70); ar(140, 116, 140, 145); ar(440, 116, 440, 145);
  ar(140, 181, 230, 210); ar(440, 181, 350, 210); ar(290, 246, 290, 262); ar(290, 298, 290, 314);
  el("text", {x: 140, y: 197, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, "≈ (n/2)³");
  el("text", {x: 440, y: 197, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, "≈ (n/2)³");
  el("path", {d: "M430 26 L580 26 L580 332 L446 332", fill: "none", stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": "6 4", "marker-end": "url(#ah)"});
  el("text", {x: 586, y: 170, "font-size": 11}, "közvetlen:"); el("text", {x: 586, y: 185, "font-size": 11}, "c^d mod N"); el("text", {x: 586, y: 200, "font-size": 11}, "≈ n³");
  if (kk >= 6) el("text", {x: 290, y: 380, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"},
     r.fault ? `m'^e mod N = ${r.chk} ≠ c;  gcd(m'^e − c, N) = ${r.g}` : `ellenőrzés: ${r.m}^${r.e} mod ${r.N} = ${r.chk}`);
}
function trace(r){
  const st = [{msg: `Bemenet: p = ${r.p}, q = ${r.q}, N = ${r.N}, e = ${r.e}, d = ${r.d} (${r.e}·${r.d} ≡ 1 mod λ = ${r.lam}), c = ${r.c}`, k: 0, line: 0},
    {msg: `1. kitevőredukció: d_p = ${r.d} mod ${r.p - 1} = ${r.dp}, d_q = ${r.d} mod ${r.q - 1} = ${r.dq}`, k: 1, line: 1},
    {msg: `2. m_p = ${r.c}^${r.dp} mod ${r.p} = ${r.mp}`, k: 2, line: 2},
    {msg: r.fault ? `3. HIBA INJEKTÁLVA: m_q helyett m_q' = ${r.mq} (a helyes ${r.c}^${r.dq} mod ${r.q} = ${r.mq0})` : `3. m_q = ${r.c}^${r.dq} mod ${r.q} = ${r.mq}`, k: 3, line: 3},
    {msg: `4. p^(−1) mod q = ${r.p}^(−1) mod ${r.q} = ${r.iv}`, k: 4, line: 4},
    {msg: `5. t = (m_q − m_p)·${r.iv} mod ${r.q} = (${r.mq} − ${r.mp})·${r.iv} mod ${r.q} = ${r.t}`, k: 5, line: 5},
    {msg: r.fault ? `6. m' = ${r.mp} + ${r.p}·${r.t} = ${r.m}; m'^${r.e} mod ${r.N} = ${r.chk} ≠ ${r.c}; gcd(m'^e − c, N) = ${r.g} – a modulus egyik prímtényezője (Bellcore-támadás, lásd az oldalcsatornás fejezetet)`
                  : `6. m = m_p + p·t = ${r.mp} + ${r.p}·${r.t} = ${r.m}; ellenőrzés: ${r.m}^${r.e} mod ${r.N} = ${r.chk}`, k: 6, line: 6}];
  return st;
}
function load(){
  const g = id => +document.getElementById(id).value, e_ = document.getElementById("err");
  const p = g("ip"), q = g("iq"), e = g("ie"), c = g("ic"), f = document.getElementById("flt").checked;
  if (![p, q, e, c].every(Number.isInteger)) { e_.textContent = "Egész számokat adjon meg."; return; }
  if (!isPrime(p) || !isPrime(q) || p === q || p > 3000 || q > 3000) { e_.textContent = "p és q legyen két különböző prím (≤ 3000)."; return; }
  const lam = (p - 1) * (q - 1) / gcdn(p - 1, q - 1);
  if (e < 2 || gcdn(e, lam) !== 1) { e_.textContent = `gcd(e, λ) = gcd(${e}, ${lam}) ≠ 1: válasszon más e-t.`; return; }
  if (c < 0 || c >= p * q) { e_.textContent = "0 ≤ c < N legyen."; return; }
  e_.textContent = ""; const keep = p === 11 && q === 13 && e === 7; R = comp(p, q, e, c, f, keep ? 103 : 0); setSteps(trace(R));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
