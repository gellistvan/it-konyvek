<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT-RSA és a Bellcore-hiba</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>p <input id="ip" type="number" min="3" value="61" style="width:4.8em"></label>
<label>q <input id="iq" type="number" min="3" value="53" style="width:4.8em"></label>
<label>e <input id="ie" type="number" min="3" value="17" style="width:4.8em"></label>
<label>c <input id="ic" type="number" min="0" value="855" style="width:5.5em"></label>
<button id="go">Újraszámolás</button>
<button id="inj">Hibainjektálás (más m_p')</button>
<span id="warn" role="alert" style="color:var(--hl2)"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="CRT-RSA p = 61, q = 53: helyes ágakkal m_p = 1, m_q = 17, h = 2, m = 123; egy hibás ág (m_p' = 2) után h' = 40, m' = 2137, és gcd(m'^e − c, N) = q = 53."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a fejezet példájával (p = 61, q = 53, e = 17, c = 855; d = e^(−1) mod λ(N) = 413, ahogy a fejezet). A hibás m_p' = 2 szemléltető érték; a hibainjektálás szimulált, NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 1, "line": 0, "msg": "Redukció: c mod p = 855 mod 61 = 1, c mod q = 855 mod 53 = 7; d_P = 53, d_Q = 49, q_inv = 38."}, {"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 2, "line": 1, "msg": "Bal ág: m_p = 1^53 mod 61 = 1."}, {"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 3, "line": 2, "msg": "Jobb ág: m_q = 7^49 mod 53 = 17."}, {"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 4, "line": 4, "msg": "Garner: h = (1 − 17)·38 mod 61 = 2, m = 17 + 53·2 = 123. m_p = 1, m_q = 17, h = 2, m = 123"}, {"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 5, "line": 5, "msg": "Hibainjektálás (szimulált): m_p' = 2 → h' = (2 − 17)·38 mod 61 = 40, m' = 17 + 53·40 = 2137."}, {"p": 61, "q": 53, "N": 3233, "e": 17, "d": 413, "dP": 53, "dQ": 49, "qinv": 38, "c": 855, "cp": 1, "cq": 7, "mp": 1, "mq": 17, "h": 2, "m": 123, "mpf": 2, "hf": 40, "mf": 2137, "mfp": 44, "mfq": 7, "g": 53, "st": 6, "line": 6, "msg": "m'^e mod p = 44 ≠ c mod p = 1, de m'^e mod q = 7 = c mod q; gcd(m'^e − c, N) = 53 = q: N faktorizálva."}];
const CODE = ["def crt_rsa_decrypt(c, p, q, dP, dQ, qInv):", "    mp = pow(c, dP, p)", "    mq = pow(c, dQ, q)", "    h = ((mp - mq) * qInv) % p", "    return mq + q * h", "# hibainjektálás (szimulált): mp helyett mp' -> m'", "g = math.gcd((pow(m_hibas, e, N) - c) % N, N)   # = q"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function isPrime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
function pw(x,e,m){let r=1n,b=BigInt(x)%BigInt(m),E=BigInt(e),M=BigInt(m);while(E>0n){if(E&1n)r=r*b%M;b=b*b%M;E>>=1n;}return Number(r);}
function invmod(a,m){let [r0,r1]=[a,m],[s0,s1]=[1,0];while(r1){const t=Math.floor(r0/r1);[r0,r1]=[r1,r0-t*r1];[s0,s1]=[s1,s0-t*s1];}return ((s0%m)+m)%m;}
function md(a,m){return ((a%m)+m)%m;}
function crtOf(p,q,e,c,fault){ const N=p*q, d=invmod(e,(p-1)*(q-1)/gcd(p-1,q-1)), dP=d%(p-1), dQ=d%(q-1), qinv=invmod(q,p);
  const cp=c%p, cq=c%q, mp=pw(cp,dP,p), mq=pw(cq,dQ,q), h=md((mp-mq)*qinv,p), m=mq+q*h;
  const R={p:p,q:q,N:N,e:e,d:d,dP:dP,dQ:dQ,qinv:qinv,c:c,cp:cp,cq:cq,mp:mp,mq:mq,h:h,m:m};
  if(fault===undefined||fault===null) fault=(mp+1)%p;
  const hf=md((fault-mq)*qinv,p), mf=mq+q*hf, g=gcd(md(pw(mf,e,N)-c,N),N);
  return Object.assign(R,{mpf:fault,hf:hf,mf:mf,mfp:pw(mf,e,p),mfq:pw(mf,e,q),g:g}); }
function stepsFor(R){ const B=()=>Object.assign({},R); return [
  Object.assign(B(),{st:1,line:0,msg:`Redukció: c mod p = ${R.c} mod ${R.p} = ${R.cp}, c mod q = ${R.c} mod ${R.q} = ${R.cq}; d_P = ${R.dP}, d_Q = ${R.dQ}, q_inv = ${R.qinv}.`}),
  Object.assign(B(),{st:2,line:1,msg:`Bal ág: m_p = ${R.cp}^${R.dP} mod ${R.p} = ${R.mp}.`}),
  Object.assign(B(),{st:3,line:2,msg:`Jobb ág: m_q = ${R.cq}^${R.dQ} mod ${R.q} = ${R.mq}.`}),
  Object.assign(B(),{st:4,line:4,msg:`Garner: h = (${R.mp} − ${R.mq})·${R.qinv} mod ${R.p} = ${R.h}, m = ${R.mq} + ${R.q}·${R.h} = ${R.m}. m_p = ${R.mp}, m_q = ${R.mq}, h = ${R.h}, m = ${R.m}`}),
  Object.assign(B(),{st:5,line:5,msg:`Hibainjektálás (szimulált): m_p' = ${R.mpf} → h' = (${R.mpf} − ${R.mq})·${R.qinv} mod ${R.p} = ${R.hf}, m' = ${R.mq} + ${R.q}·${R.hf} = ${R.mf}.`}),
  Object.assign(B(),{st:6,line:6,msg:`m'^e mod p = ${R.mfp} ≠ c mod p = ${R.cp}, de m'^e mod q = ${R.mfq} = c mod q; gcd(m'^e − c, N) = ${R.g}`+(R.g===R.q?" = q: N faktorizálva.":".")}) ]; }
function render(s){
  svg.setAttribute("viewBox","0 0 760 390"); svg.innerHTML="";
  const hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line");
  function bx(x,y,w,h,lines,on,opt){ opt=opt||{}; el("rect",{x:x,y:y,width:w,height:h,rx:8,fill:opt.fill||css("--cell"),stroke:on?hl:(opt.stroke||ln),"stroke-width":on?3:(opt.sw||1.2),"stroke-dasharray":opt.dash||""});
    lines.forEach((t,i)=>el("text",{x:x+w/2,y:y+h/2+5+(i-(lines.length-1)/2)*18,"text-anchor":"middle","font-size":opt.fs||14,"font-weight":opt.bold?"bold":"normal"},t)); }
  function ar(x0,y0,x1,y1,col){ el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:col||ln,"stroke-width":1.4}); const a=Math.atan2(y1-y0,x1-x0); el("path",{d:`M${x1},${y1} l${-9*Math.cos(a-0.4)},${-9*Math.sin(a-0.4)} l${9*Math.cos(a-0.4)-9*Math.cos(a+0.4)},${9*Math.sin(a-0.4)-9*Math.sin(a+0.4)} z`,fill:col||ln}); }
  const F=s.st>=5;
  bx(280,8,200,34,[`c = ${s.c}`],false);
  ar(330,42,170,72); ar(430,42,590,72);
  bx(60,74,220,34,[`mod p: ${s.c} mod ${s.p} = ${s.cp}`],s.st===1);
  bx(480,74,220,34,[`mod q: ${s.c} mod ${s.q} = ${s.cq}`],s.st===1);
  ar(170,108,170,134); ar(590,108,590,134);
  if(s.st>=2){ if(F){ bx(60,136,220,48,[`m_p' = ${s.mpf}  (hibás)`,`helyes: ${s.cp}^${s.dP} = ${s.mp}`],s.st===5,{dash:"7 4",fill:css("--cellhl"),sw:2});
      el("path",{d:"M52,128 l-12,22 l10,0 l-8,22 l20,-28 l-10,0 l10,-16 z",fill:hl2,stroke:ln}); }
    else bx(60,136,220,48,[`m_p = ${s.cp}^${s.dP} mod ${s.p}`,`= ${s.mp}`],s.st===2); }
  if(s.st>=3) bx(480,136,220,48,[`m_q = ${s.cq}^${s.dQ} mod ${s.q}`,`= ${s.mq}`],s.st===3);
  if(s.st>=4){ ar(170,184,330,212); ar(590,184,430,212);
    if(F) bx(200,214,360,50,[`h' = (${s.mpf} − ${s.mq})·${s.qinv} mod ${s.p} = ${s.hf}`,`m' = ${s.mq} + ${s.q}·${s.hf} = ${s.mf}`],s.st===5,{dash:"7 4"});
    else bx(200,214,360,50,[`Garner: h = (${s.mp} − ${s.mq})·${s.qinv} mod ${s.p} = ${s.h}`,`m = ${s.mq} + ${s.q}·${s.h} = ${s.m}`],s.st===4); }
  if(s.st===4){ ar(380,264,380,290); bx(270,292,220,36,[`m = ${s.m}  ✓`],true,{bold:true,fill:css("--cellhl")}); }
  if(s.st>=5){ ar(380,264,380,290);
    if(s.st===6) bx(120,292,520,72,[`m'^e mod p = ${s.mfp} ≠ ${s.cp},  m'^e mod q = ${s.mfq} = ${s.cq}`,`gcd(m'^e − c, N) = ${s.g}${s.g===s.q?" = q":""}`,s.g===s.q?`N = ${s.N} = ${s.q} · ${s.N/s.q}`:""],true,{bold:true,fill:css("--cellhl")});
    else bx(270,292,220,36,[`m' = ${s.mf}  ✗`],false,{bold:true}); }
  el("text",{x:10,y:384,"font-size":11,fill:mu},`p = ${s.p}, q = ${s.q}, N = ${s.N}, e = ${s.e}, d = ${s.d}; a hibainjektálás szimulált (a könyv játékpéldáján)`);
}
let curP=61,curQ=53,curE=17,curC=855,curF=2;
function rebuild(){ setSteps(stepsFor(crtOf(curP,curQ,curE,curC,curF))); }
document.getElementById("go").addEventListener("click",()=>{
  const p=+document.getElementById("ip").value, q=+document.getElementById("iq").value, e=+document.getElementById("ie").value, c=+document.getElementById("ic").value, w=document.getElementById("warn");
  if(!(isPrime(p)&&isPrime(q)&&p!==q)){ w.textContent="p és q legyen két különböző prím."; return; }
  if(p*q>=1e7){ w.textContent="N = pq legyen 10^7 alatt."; return; }
  if(gcd(e,(p-1)*(q-1)/gcd(p-1,q-1))!==1||e<2){ w.textContent="e legyen relatív prím λ(N)-hez."; return; }
  if(!(c>=0&&c<p*q)){ w.textContent="0 ≤ c < N kell."; return; }
  w.textContent=""; curP=p;curQ=q;curE=e;curC=c;curF=null; rebuild(); });
document.getElementById("inj").addEventListener("click",()=>{
  const R=crtOf(curP,curQ,curE,curC,0); let f; do{ f=Math.floor(Math.random()*curP); }while(f===R.mp);
  curF=f; setSteps(stepsFor(crtOf(curP,curQ,curE,curC,curF))); show(STEPS.length-1); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
