<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DH a kis csoportban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>p <input id="ip" type="number" min="5" max="107" value="23" style="width:4.5em"></label>
<label>g <input id="ig" type="number" min="2" value="2" style="width:4.5em"></label>
<label>a <input id="ia" type="number" min="1" value="6" style="width:4.5em"></label>
<label>b <input id="ib" type="number" min="1" value="4" style="width:4.5em"></label>
<button id="go">Újraszámolás</button>
<span id="warn" role="alert" style="color:var(--hl2)"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="11 elemű körön Alice 6, Bob 4 lépést tesz; A = 18, B = 16, a közös titok 4."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a fejezet kidolgozott példájával (p = 23, q = 11, g = 2, a = 6, b = 4). A körön a k-adik csomópont g^k mod p; Alice és Bob második fázisában egy lépés a kitevő b-vel, ill. a-val való növelése (mod ord g). Saját p: biztonságos prím ≤ 107.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 23, "g": 2, "a": 6, "b": 4, "st": 1, "line": 1, "msg": "1. A ⟨2⟩ részcsoport 11 eleme körön (g^k mod 23); a Z_23^* többi 11 eleme nem érhető el."}, {"p": 23, "g": 2, "a": 6, "b": 4, "st": 2, "line": 7, "msg": "2. Alice 6 lépést tesz a körön: A = 2^6 mod 23 = 18."}, {"p": 23, "g": 2, "a": 6, "b": 4, "st": 3, "line": 8, "msg": "3. Bob 4 lépést tesz: B = 2^4 mod 23 = 16."}, {"p": 23, "g": 2, "a": 6, "b": 4, "st": 4, "line": 8, "msg": "4. Csere: Alice elküldi A = 18-t, Bob B = 16-ot; Mallory csak ezeket látja, a kitevőket nem."}, {"p": 23, "g": 2, "a": 6, "b": 4, "st": 5, "line": 11, "msg": "5. Alice: K = B^a = 16^6 mod 23 = 4 (a körön 6-szor 4 lépés)."}, {"p": 23, "g": 2, "a": 6, "b": 4, "st": 6, "line": 12, "msg": "6. Bob: K = A^b = 18^4 mod 23 = 4. A = 18, B = 16, K = 4"}];
const CODE = ["# OKTATÁSI CÉLRA – NEM ÉLES HASZNÁLATRA", "p, q, g = 23, 11, 2", "", "# Titkos kitevők (élesben: secrets.randbelow(q - 1) + 1)", "a, b = 6, 4", "", "# Nyilvános értékek", "A = pow(g, a, p)", "B = pow(g, b, p)", "", "# Közös titok mindkét oldalon", "alice_shared = pow(B, a, p)", "bob_shared = pow(A, b, p)", "", "print(f\"A = {A}, B = {B}\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function pw(x,e,m){let r=1;x%=m;while(e>0){if(e&1)r=r*x%m;x=x*x%m;e>>=1;}return r;}
function isPrime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
function ordOf(g,p){let r=1,x=g%p;while(x!==1){x=x*g%p;r++;if(r>p)return -1;}return r;}
function mkSteps(p,g,a,b){
  const q=(p-1)/2, r=ordOf(g,p), A=pw(g,a,p), B=pw(g,b,p), K1=pw(B,a,p), K2=pw(A,b,p);
  const warn = r===q ? "" : ` FIGYELEM: ord(g) = ${r} ≠ q = ${q}, g nem a q-rendű részcsoport generátora.`;
  const base={p:p,g:g,a:a,b:b};
  return [
    Object.assign({},base,{st:1,line:1,msg:`1. A ⟨${g}⟩ részcsoport ${r} eleme körön (g^k mod ${p}); a Z_${p}^* többi ${p-1-r} eleme nem érhető el.${warn}`}),
    Object.assign({},base,{st:2,line:7,msg:`2. Alice ${a} lépést tesz a körön: A = ${g}^${a} mod ${p} = ${A}.`}),
    Object.assign({},base,{st:3,line:8,msg:`3. Bob ${b} lépést tesz: B = ${g}^${b} mod ${p} = ${B}.`}),
    Object.assign({},base,{st:4,line:8,msg:`4. Csere: Alice elküldi A = ${A}-t, Bob B = ${B}-ot; Mallory csak ezeket látja, a kitevőket nem.`}),
    Object.assign({},base,{st:5,line:11,msg:`5. Alice: K = B^a = ${B}^${a} mod ${p} = ${K1} (a körön ${a}-szor ${b} lépés).`}),
    Object.assign({},base,{st:6,line:12,msg:`6. Bob: K = A^b = ${A}^${b} mod ${p} = ${K2}. A = ${A}, B = ${B}, K = ${K2}`}),
  ];
}
function render(s){
  svg.setAttribute("viewBox","0 0 760 500"); svg.innerHTML="";
  const p=s.p,g=s.g,a=s.a,b=s.b,r=ordOf(g,p),A=pw(g,a,p),B=pw(g,b,p),K=pw(B,a,p);
  const cx=250,cy=245,R=150,Ro=222, hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted");
  const cyc=[]; for(let i=0;i<r;i++) cyc.push(pw(g,i,p));
  const others=[]; for(let v=1;v<p;v++) if(!cyc.includes(v)) others.push(v);
  const P=i=>{const t=(90-360*i/r)*Math.PI/180;return [cx+R*Math.cos(t), cy-R*Math.sin(t)];};
  const nr = r>30?9:(r>16?15:20), fs = r>30?9:(r>16?11:14);
  others.forEach((v,i)=>{const t=(90-360*(i+0.5)/others.length)*Math.PI/180;const x=cx+Ro*Math.cos(t),y=cy-Ro*Math.sin(t);
    el("circle",{cx:x,cy:y,r:3,fill:mu}); if(others.length<=24) el("text",{x:cx+(Ro+14)*Math.cos(t),y:cy-(Ro+14)*Math.sin(t)+4,"text-anchor":"middle","font-size":10,fill:mu},String(v));});
  el("text",{x:cx,y:495,"text-anchor":"middle","font-size":11,fill:mu},`szürke: a Z_${p}^* ${others.length} további eleme – nem érhető el`);
  // óramutató szerinti ugrások körívként; minden teljes kör után a sugár dr-rel változik (spirál)
  function hops(i0, span, n, base, dr, col, dash, w){ let cum=0, cur=i0;
    for(let j=0;j<n;j++){ if(span%r===0) break; const rho=base+dr*Math.floor(cum/r);
      const t0=(90-360*cur/r+2)*Math.PI/180, t1=(90-360*(cur+span)/r-2)*Math.PI/180;
      const sx=cx+rho*Math.cos(t0), sy=cy-rho*Math.sin(t0), ex=cx+rho*Math.cos(t1), ey=cy-rho*Math.sin(t1);
      const large=(span%r)/r>0.5?1:0;
      el("path",{d:`M${sx.toFixed(1)},${sy.toFixed(1)} A${rho},${rho} 0 ${large} 1 ${ex.toFixed(1)},${ey.toFixed(1)}`,fill:"none",stroke:col,"stroke-width":w,"stroke-dasharray":dash});
      const dx=Math.sin(t1), dy=Math.cos(t1), bx=ex-9*dx, by=ey-9*dy;
      el("path",{d:`M${ex.toFixed(1)},${ey.toFixed(1)} L${(bx-4*dy).toFixed(1)},${(by+4*dx).toFixed(1)} L${(bx+4*dy).toFixed(1)},${(by-4*dx).toFixed(1)} z`,fill:col});
      cum+=span%r; cur=(cur+span)%r; } }
  const ia=a%r, ib=b%r, IN=R-nr-12, OUT=R+nr+10;
  if(s.st>=2 && s.st<5) hops(0,1,a,IN,-6, s.st===2?hl:mu, "", s.st===2?2.6:1.3);
  if(s.st>=3 && s.st<5) hops(0,1,b,OUT,6, s.st===3?hl2:mu, "7 4", s.st===3?2.6:1.3);
  if(s.st>=5) hops(0,ib,a,IN,-6, s.st===5?hl:mu, "", s.st===5?2.6:1.3);
  if(s.st>=6) hops(0,ia,b,OUT,6, hl2, "7 4", 2.6);
  for(let i=0;i<r;i++){const [x,y]=P(i), v=cyc[i];
    let st=css("--line"), w=1.2;
    if(s.st>=2&&v===A){st=hl;w=3;} if(s.st>=3&&v===B&&s.st<5){st=hl2;w=3;}
    el("circle",{cx:x,cy:y,r:nr,fill:css("--cell"),stroke:st,"stroke-width":w});
    if(s.st>=5&&v===K) el("circle",{cx:x,cy:y,r:nr+5,fill:"none",stroke:css("--line"),"stroke-width":2});
    el("text",{x:x,y:y+(r<=24?fs*0.15:fs*0.36),"text-anchor":"middle","font-size":fs,"font-weight":(v===A||v===B||(s.st>=5&&v===K))?"bold":"normal"},String(v));
    if(r<=24) el("text",{x:x,y:y+fs*0.15+12,"text-anchor":"middle","font-size":9,fill:mu},"g^"+i); }
  // Mallory-doboz
  const mx=510;
  el("rect",{x:mx,y:30,width:230,height:110,fill:css("--cellhl"),stroke:css("--line"),"stroke-dasharray":"6 4"});
  el("text",{x:mx+12,y:56,"font-size":14,"font-weight":"bold"},"Mallory látja:");
  el("text",{x:mx+12,y:82,"font-size":14},s.st>=4?`A = ${A}, B = ${B}`:"(még semmit)");
  el("text",{x:mx+12,y:106,"font-size":13,fill:mu},"a, b: ismeretlen");
  el("text",{x:mx+12,y:128,"font-size":12,fill:mu},`p = ${p}, g = ${g}`);
  el("line",{x1:mx,x2:mx+40,y1:180,y2:180,stroke:hl,"stroke-width":2.6});
  el("text",{x:mx+48,y:184,"font-size":12},"Alice útja (A, majd B^a)");
  el("line",{x1:mx,x2:mx+40,y1:205,y2:205,stroke:hl2,"stroke-width":2.6,"stroke-dasharray":"7 4"});
  el("text",{x:mx+48,y:209,"font-size":12},"Bob útja (B, majd A^b)");
  el("circle",{cx:mx+20,cy:232,r:8,fill:"none",stroke:css("--line")}); el("circle",{cx:mx+20,cy:232,r:12,fill:"none",stroke:css("--line"),"stroke-width":2});
  el("text",{x:mx+48,y:236,"font-size":12},"közös titok K");
  if(s.st>=6) el("text",{x:mx,y:280,"font-size":15,"font-weight":"bold",fill:hl},`K = ${K} = g^${(a*b)%r}  (ab mod ${r})`);
}
document.getElementById("go").addEventListener("click",()=>{
  const p=+document.getElementById("ip").value, g=+document.getElementById("ig").value,
        a=+document.getElementById("ia").value, b=+document.getElementById("ib").value, w=document.getElementById("warn");
  if(!(p<=107 && isPrime(p) && isPrime((p-1)/2))){ w.textContent="p legyen biztonságos prím (p = 2q + 1, q prím), legfeljebb 107: 5, 7, 11, 23, 47, 59, 83, 107."; return; }
  if(!(g>1 && g<p) || !(a>=1) || !(b>=1)){ w.textContent="1 < g < p és a, b ≥ 1 kell."; return; }
  const r=ordOf(g,p), q=(p-1)/2;
  w.textContent = r===q ? "" : `Figyelem: ord(g) = ${r} ≠ q = ${q}`;
  setSteps(mkSteps(p,g,a,b));
});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
