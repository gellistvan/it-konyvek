<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPRF-alapú PSI kis paraméterekkel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>:root{--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}@media (prefers-color-scheme:dark){:root{--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}label{white-space:nowrap} input[type=number]{width:4.2em}</style><label>r₁ = <input type="number" id="r1" value="3" min="1" max="21"></label><label>r₂ = <input type="number" id="r2" value="5" min="1" max="21"></label><button onclick="applyR()">Számol</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kliens vakított értékeket küld (4 és 20), a szerver k-adik hatványra emeli őket (8 és 21) és elküldi saját elemei OPRF-jét ({2}), a kliens levakít (2 és 17) és összehasonlít: a 3 a metszetben van, az 5 nincs."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 23, k = 7, H(x) = x (játékpélda, nem éles: valódi PSI-ben H a csoportba képző hash, a csoport prímrendű). Számított értékek, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés – vakítás: a kliens elküldi v₁ = 3^3 = 4 és v₂ = 5^5 = 20 értéket; a szerver csak ezt a kettőt látja.", "line": 0, "hl": ["srv"]}, {"msg": "2. lépés – szerver-hatványozás: w₁ = 4⁷ = 8, w₂ = 20⁷ = 21; a szerver nem tudja, melyik elemhez tartoznak.", "line": 1, "hl": ["srv"]}, {"msg": "3. lépés – OPRF-halmaz: a szerver visszaküldi w₁, w₂-t és saját elemei OPRF-jét: {2} (F_k(3) = 3⁷ = 2).", "line": 2, "hl": ["cli"]}, {"msg": "4. lépés – levakítás és összehasonlítás: 8^15 = 2 ∈ {2} ⇒ 3 ∈ X∩Y; 21^9 = 17 ∉ {2} ⇒ 5 ∉ X∩Y.", "line": 3, "hl": ["cli"]}];
const CODE = ["kliens:  vᵢ = H(xᵢ)^rᵢ  (friss rᵢ, gcd(rᵢ, 22) = 1)      → szerver", "szerver: wᵢ = vᵢ^k", "szerver: S = { H(y)^k : y ∈ Y }                      → kliens: (wᵢ), S", "kliens:  F_k(xᵢ) = wᵢ^(rᵢ⁻¹ mod 22);  xᵢ ∈ X∩Y  ⇔  F_k(xᵢ) ∈ S"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",
  hlf:"--sc-hlf", hl2f:"--sc-hl2f", ok:"--sc-ok", err:"--sc-err", okf:"--sc-okf", errf:"--sc-errf"};
const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}

const TPL = [[-1,["rect",70,14,240,44,{"lw":1.6}]],[-1,["text",190.0,42.12,"Kliens",{"size":17,"anchor":"middle","weight":"bold","color":"fg","mono":false}]],[-1,["rect",650,14,240,44,{"lw":1.6}]],[-1,["text",770.0,42.12,"Szerver",{"size":17,"anchor":"middle","weight":"bold","color":"fg","mono":false}]],[-1,["text",70,82.0,"X = {{3, 5}}; titkos: r₁ = {r1}, r₂ = {r2}",{"size":17,"color":"muted"}]],[-1,["text",650,82.0,"Y = {{3}}; titkos: k = 7",{"size":17,"color":"muted"}]],[-1,["line",190,92,190,420,{"ls":"dash","lw":1,"color":"g3"}]],[-1,["line",770,92,770,420,{"ls":"dash","lw":1,"color":"g3"}]],[0,["text",480.0,120.0,"① v₁ = 3^r₁ = 3^{r1} = {v1},   v₂ = 5^r₂ = 5^{r2} = {v2}",{"size":17,"anchor":"middle"}]],[0,["line",194,132,766,132,{"arrow":true,"lw":2}]],[1,["rect",520,150,430,58,{"fill":"g1","lw":1.2}]],[1,["text",735.0,174.495,"② w₁ = v₁ᵏ = {v1}⁷ = {w1},  w₂ = v₂ᵏ = {v2}⁷ = {w2}",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[1,["text",735.0,195.745,"    F_k(3) = 3⁷ = {F}",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[2,["text",480.0,240.0,"③ w₁ = {w1}, w₂ = {w2};   {{F_k(y)}} = {{{F}}}",{"size":17,"anchor":"middle"}]],[2,["line",766,252,194,252,{"arrow":true,"lw":2,"ls":"dash"}]],[3,["rect",70,272,520,84,{"fill":"g1","lw":1.2}]],[3,["text",330.0,298.87,"④ w₁^(r₁⁻¹) = {w1}^{i1} = {u1} {m1} {{{F}}} ⇒ {res1}",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[3,["text",330.0,320.12,"    w₂^(r₂⁻¹) = {w2}^{i2} = {u2} {m2} {{{F}}} ⇒ {res2}",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[3,["text",330.0,341.37,"    (rᵢ⁻¹ mod 22; a levakított érték F_k(xᵢ) = xᵢ⁷)",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[-1,["rect",14,440,450,96,{"lw":1.4,"rx":6,"fill":"none"}]],[-1,["text",239.0,494.12,"",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[-1,["text",26,466.0,"A szerver nézete",{"size":17,"weight":"bold"}]],[-1,["text",26,492.0,"csak a vakított {v1} és {v2} – a 3 és az 5 nem",{"size":17}]],[-1,["text",26,518.0,"(egyenletes csoportelemek)",{"size":17}]],[-1,["rect",496,440,450,96,{"lw":1.4,"rx":6,"fill":"none"}]],[-1,["text",721.0,494.12,"",{"size":17,"anchor":"middle","weight":"normal","color":"fg","mono":false}]],[-1,["text",508,466.0,"A kliens nézete",{"size":17,"weight":"bold"}]],[-1,["text",508,492.0,"w₁ = {w1}, w₂ = {w2} és {{{F}}}; k-t nem,",{"size":17}]],[-1,["text",508,518.0,"a metszeten kívüli y-okat nem",{"size":17}]]], MSG = ["1. lépés – vakítás: a kliens elküldi v₁ = 3^{r1} = {v1} és v₂ = 5^{r2} = {v2} értéket; a szerver csak ezt a kettőt látja.", "2. lépés – szerver-hatványozás: w₁ = {v1}⁷ = {w1}, w₂ = {v2}⁷ = {w2}; a szerver nem tudja, melyik elemhez tartoznak.", "3. lépés – OPRF-halmaz: a szerver visszaküldi w₁, w₂-t és saját elemei OPRF-jét: {{{F}}} (F_k(3) = 3⁷ = 2).", "4. lépés – levakítás és összehasonlítás: {w1}^{i1} = {u1} {m1} {{{F}}} ⇒ {res1}; {w2}^{i2} = {u2} {m2} {{{F}}} ⇒ {res2}."], D0 = {"r1": "3", "r2": "5", "F": "2", "v1": "4", "w1": "8", "i1": "15", "u1": "2", "m1": "∈", "res1": "3 ∈ X∩Y", "v2": "20", "w2": "21", "i2": "9", "u2": "17", "m2": "∉", "res2": "5 ∉ X∩Y"}, VIEW = {"srv": [14, 440, 450, 96], "cli": [496, 440, 450, 96]};
const P = 23, K = 7, X = [3, 5], Y = [3];
function pw(b, e, n){ let r = 1; b %= n; for (let i = 0; i < e; i++) r = r * b % n; return r; }
function inv(a, n){ for (let x = 1; x < n; x++) if (a * x % n === 1) return x; return 0; }
function compute(r1, r2){
  const F = Y.map(y => pw(y, K, P)).sort((a, b) => a - b);
  const d = {r1, r2, F: F.join(", ")};
  [r1, r2].forEach((r, j) => { const i = j + 1, x = X[j], v = pw(x, r, P), w = pw(v, K, P), ri = inv(r, P - 1), u = pw(w, ri, P), hit = F.includes(u);
    Object.assign(d, {["v" + i]: v, ["w" + i]: w, ["i" + i]: ri, ["u" + i]: u, ["m" + i]: hit ? "∈" : "∉", ["res" + i]: hit ? `${x} ∈ X∩Y` : `${x} ∉ X∩Y`}); });
  const o = {}; for (const a in d) o[a] = String(d[a]); return o;
}
let CUR = compute(3, 5);
if (JSON.stringify(CUR) !== JSON.stringify(D0)) document.title += " (HIBA: JS ≠ Python)";
const fmtp = (s, v) => s.replace(/\{\{|\}\}|\{(\w+)\}/g, (m, n) => m === "{{" ? "{" : m === "}}" ? "}" : (v[n] !== undefined ? v[n] : ""));
function render(s){
  svg.setAttribute("viewBox", "0 0 960 560"); svg.innerHTML = ""; scDefs();
  const Q = [];
  for (const nm of (s.hl || [])) { const r = VIEW[nm]; Q.push(["rect", r[0], r[1], r[2], r[3], {fill: "hlf", stroke: "hl", lw: 3, rx: 6}]); }
  scDraw(Q);
  const P2 = [];
  for (const [st, pr] of TPL) { if (st > k) continue; const q = pr.slice(); if (q[0] === "text") q[3] = fmtp(q[3], CUR);
    P2.push(q); }
  scDraw(P2);
}
function applyR(){
  const r1 = Math.round(+document.getElementById("r1").value), r2 = Math.round(+document.getElementById("r2").value);
  const g = (a, b) => b ? g(b, a % b) : a;
  if (!(r1 >= 1 && r1 <= 21 && r2 >= 1 && r2 <= 21) || g(r1, 22) !== 1 || g(r2, 22) !== 1) {
    status.textContent = "Az rᵢ legyen 1 és 21 közötti, 22-höz relatív prím (páratlan, nem 11), különben nem vakítható le."; return; }
  CUR = compute(r1, r2);
  const keep = k;
  setSteps(MSG.map((m, i) => ({msg: fmtp(m, CUR), line: i, hl: STEPS[i].hl})));
  show(keep);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
