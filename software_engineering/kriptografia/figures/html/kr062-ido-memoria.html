<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idő–memória kompromisszum</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:max-content 1fr max-content;gap:4px 10px;align-items:center}
input[type=range]{width:100%}
#status{margin:6px 0;min-height:3em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="r">Memória-arány M'/M</label><input id="r" type="range" min="0.05" max="1" step="0.01" value="0.5"><span id="rv"></span>
  <label for="m">Memória próbánként m (MiB)</label><input id="m" type="range" min="2" max="12" step="1" value="6"><span id="mv"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 270" role="img" aria-label="Bal: a relatív idő a memória-arány függvényében, másodfokú, lineáris és konstans modellel. Jobb: egy 16 GiB-os GPU-n egyszerre futó próbálkozások száma a memóriabeállítás szerint."></svg>
<p class="small">Modell, nem mérés; a valós Argon2/scrypt kompromisszum a támadási algoritmustól függ. A párhuzamos próbaszám = 16 384 MiB / m (csak a memóriakorlát; a 16.3.2 példája: 64 MiB → 256).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function cm(x, d){ return x.toFixed(d).replace(".", ","); }
function upd(){
  const r = +document.getElementById("r").value, m = Math.pow(2, +document.getElementById("m").value), n = Math.floor(16384 / m);
  document.getElementById("rv").textContent = cm(r, 2);
  document.getElementById("mv").textContent = m >= 1024 ? (m / 1024) + " GiB" : m + " MiB";
  svg.innerHTML = "";
  // bal panel: x 50..290, y log 0.8..450
  const X = v => 50 + (v / 1.05) * 240, Y = v => 230 - (Math.log10(v) - Math.log10(0.8)) / (Math.log10(450) - Math.log10(0.8)) * 200;
  el("line", {x1: 50, x2: 290, y1: 230, y2: 230, stroke: css("--line")}); el("line", {x1: 50, x2: 50, y1: 30, y2: 230, stroke: css("--line")});
  [1, 2, 4, 10, 100, 400].forEach(t => el("text", {x: 45, y: Y(t) + 4, "text-anchor": "end", "font-size": 11}, String(t)));
  [0.25, 0.5, 0.75, 1].forEach(t => el("text", {x: X(t), y: 246, "text-anchor": "middle", "font-size": 11}, cm(t, 2)));
  el("text", {x: 170, y: 264, "text-anchor": "middle", "font-size": 12}, "M'/M");
  [[v => 1 / (v * v), "", 2.4], [v => 1 / v, "6 4", 1.8], [v => 1, "2 3", 2]].forEach(([f, d, w]) => {
    let p = ""; for (let i = 0; i <= 100; i++) { const v = 0.05 + 0.95 * i / 100; p += (i ? "L" : "M") + X(v).toFixed(1) + " " + Y(f(v)).toFixed(1); }
    el("path", {d: p, fill: "none", stroke: css("--line"), "stroke-width": w, "stroke-dasharray": d});
  });
  el("line", {x1: X(r), x2: X(r), y1: 30, y2: 230, stroke: css("--hl2"), "stroke-width": 1.5});
  el("circle", {cx: X(r), cy: Y(1 / (r * r)), r: 5, fill: css("--hl2")}); el("circle", {cx: X(r), cy: Y(1 / r), r: 5, fill: css("--hl")});
  el("text", {x: 60, y: 22, "font-size": 12}, "folytonos: (M/M')², szaggatott: M/M', pontozott: 1");
  // jobb panel: oszlopok 16 MiB .. 1 GiB + a kiválasztott
  const mems = [16, 64, 256, 1024], YB = v => 230 - (Math.log10(v) - 0.9) / (Math.log10(5000) - 0.9) * 200;
  el("line", {x1: 330, x2: 550, y1: 230, y2: 230, stroke: css("--line")});
  mems.forEach((mm, i) => {
    const nn = 16384 / mm, x = 345 + i * 52, on = mm === m;
    el("rect", {x, y: YB(nn), width: 38, height: 230 - YB(nn), fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x + 19, y: YB(nn) - 5, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal"}, String(nn));
    el("text", {x: x + 19, y: 246, "text-anchor": "middle", "font-size": 11}, mm >= 1024 ? "1 GiB" : mm + " MiB");
  });
  el("text", {x: 440, y: 22, "text-anchor": "middle", "font-size": 12}, "16 GiB GPU: 16 384 MiB / m");
  el("text", {x: 440, y: 264, "text-anchor": "middle", "font-size": 12}, "kiválasztott m: " + n + " próbálkozás egyszerre");
  document.getElementById("status").textContent = `M'/M = ${cm(r, 2)} → lineáris ${cm(1 / r, 2)}×, másodfokú ${cm(1 / (r * r), 2)}× idő. ` +
    `m = ${m >= 1024 ? (m / 1024) + " GiB" : m + " MiB"} → egy 16 GiB-os GPU-n 16 384 / ${m} = ${n} próbálkozás fér el egyszerre.`;
}
["r", "m"].forEach(i => document.getElementById(i).addEventListener("input", upd));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
upd();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
