<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boneh–Franklin: két út ugyanahhoz az értékhez</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>s: <input id="sin" type="range" min="1" max="6" value="3" style="width:5em"><span id="sinv">3</span></label><label>r: <input id="rin" type="range" min="1" max="6" value="2" style="width:5em"><span id="rinv">2</span></label><label>Q_ID kitevője: <input id="qin" type="range" min="1" max="6" value="2" style="width:5em"><span id="qinv">2</span></label><label><input id="reuse" type="checkbox"> r újrahasználata (3. feladat)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három oszlop: PKG, Alice és Bob; Alice e(Q_ID, P_pub)^r, Bob e(d_ID, U) úton jut ugyanahhoz az e(P,P)^12 értékhez."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A G_T-elemeket e(P,P) kitevőjeként mutatjuk (2. feladat: s = 3, r = 2, Q_ID = [2]P). A H2 itt 8 bites játékfüggvény (73·t + 41 mod 256), nem kriptográfiai – csak a 3. feladat XOR-hatását szemlélteti.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "line": 0, "msg": "Setup (PKG): mesterkulcs s = 3, nyilvános P_pub = [s]P = [3]P", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}, {"ph": 2, "line": 1, "msg": "Extract (PKG): Q_ID = H1(bob@ceg.hu) = [2]P, d_ID = [s]Q_ID = [6]P → titkos csatornán Bobnak", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}, {"ph": 3, "line": 2, "msg": "Encrypt (Alice): g_ID = e(Q_ID, P_pub) = e([2]P, [3]P) = e(P,P)^6", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}, {"ph": 4, "line": 3, "msg": "Encrypt (Alice): r = 2, U = [r]P = [2]P, g_ID^r = e(P,P)^12, V = m ⊕ H2(g_ID^r)", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}, {"ph": 5, "line": 4, "msg": "Decrypt (Bob): e(d_ID, U) = e([6]P, [2]P) = e(P,P)^12 = g_ID^r – ugyanaz az érték, más úton", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}, {"ph": 6, "line": 5, "msg": "Decrypt (Bob): m = V ⊕ H2(e(P,P)^12); Alice és Bob is e(P,P)^12-t használt, a PKG oszlopában d_ID = [6]P", "v": {"s": 3, "r": 2, "q": 2, "ppub": 3, "d": 6, "g": 6, "gr": 12, "U": 2, "bob": 12, "mask": 149, "V1": 221, "V2": 252, "m1": 72, "m2": 105}}];
const CODE = ["s, P_pub = mester(), s * P                      # Setup", "Q_ID = H1('bob@ceg.hu');  d_ID = s * Q_ID       # Extract", "g_ID = e(Q_ID, P_pub)                           # Encrypt", "U = r * P;  V = m ^ H2(g_ID ** r)", "g = e(d_ID, U)                                  # Decrypt: = g_ID ** r", "m = V ^ H2(g)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const M1 = 0x48, M2 = 0x69;
function H2(t){ return (73 * t + 41) % 256; }
function hx(b){ return "0x" + b.toString(16).toUpperCase().padStart(2, "0"); }
function calcJS(s, r, q){ const gr = q * s * r, mask = H2(gr); return {s: s, r: r, q: q, ppub: s, d: s * q, g: q * s, gr: gr, U: r, bob: s * q * r, mask: mask, V1: M1 ^ mask, V2: M2 ^ mask, m1: M1, m2: M2}; }
function traceJS(s, r, q){
  const v = calcJS(s, r, q);
  const st = [
    {ph: 1, line: 0, msg: "Setup (PKG): mesterkulcs s = " + s + ", nyilvános P_pub = [s]P = [" + v.ppub + "]P"},
    {ph: 2, line: 1, msg: "Extract (PKG): Q_ID = H1(bob@ceg.hu) = [" + q + "]P, d_ID = [s]Q_ID = [" + v.d + "]P → titkos csatornán Bobnak"},
    {ph: 3, line: 2, msg: "Encrypt (Alice): g_ID = e(Q_ID, P_pub) = e([" + q + "]P, [" + s + "]P) = e(P,P)^" + v.g},
    {ph: 4, line: 3, msg: "Encrypt (Alice): r = " + r + ", U = [r]P = [" + v.U + "]P, g_ID^r = e(P,P)^" + v.gr + ", V = m ⊕ H2(g_ID^r)"},
    {ph: 5, line: 4, msg: "Decrypt (Bob): e(d_ID, U) = e([" + v.d + "]P, [" + v.U + "]P) = e(P,P)^" + v.bob + " = g_ID^r – ugyanaz az érték, más úton"},
    {ph: 6, line: 5, msg: "Decrypt (Bob): m = V ⊕ H2(e(P,P)^" + v.bob + "); Alice és Bob is e(P,P)^" + v.gr + "-t használt, a PKG oszlopában d_ID = [" + v.d + "]P"}];
  st.forEach(x => { x.v = v; });
  return st;
}
function upd(){
  ["sin", "rin", "qin"].forEach(i => { document.getElementById(i + "v").textContent = document.getElementById(i).value; });
  const g = id => parseInt(document.getElementById(id).value, 10);
  const cur = k; setSteps(traceJS(g("sin"), g("rin"), g("qin"))); show(cur);
}
["sin", "rin", "qin"].forEach(i => document.getElementById(i).addEventListener("input", upd));
document.getElementById("reuse").addEventListener("change", () => show(k));
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 360");
  const v = s.v, ph = s.ph, w = 230;
  const cols = [[10, "PKG"], [265, "Alice (küldő)"], [520, "Bob (címzett)"]];
  cols.forEach(([x0, t], i) => {
    const act = (i === 0 && ph <= 2) || (i === 1 && (ph === 3 || ph === 4)) || (i === 2 && ph >= 5);
    el("rect", {x: x0, y: 8, width: w, height: 30, rx: 6, fill: act ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": act ? 2.5 : 1.2});
    el("text", {x: x0 + w / 2, y: 28, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, t);
  });
  function cell(col, row, txt, secret, minPh, strong){
    const x0 = cols[col][0], y = 50 + row * 50, vis = ph >= minPh, on = ph === minPh;
    el("rect", {x: x0, y: y, width: w, height: 40, rx: 5, fill: on ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": on || strong ? 2.5 : 1, "stroke-dasharray": secret ? "6 4" : "none", opacity: vis ? 1 : 0.35});
    const t = el("text", {x: x0 + w / 2, y: y + 25, "text-anchor": "middle", "font-size": 13, fill: vis ? css("--fg") : css("--muted")}, vis ? txt : "…");
    if (secret && vis) t.setAttribute("text-decoration", "underline");
  }
  cell(0, 0, "titok: s = " + v.s, true, 1); cell(0, 1, "P_pub = [" + v.ppub + "]P", false, 1);
  cell(0, 2, "Q_ID = [" + v.q + "]P", false, 2); cell(0, 3, "d_ID = [" + v.d + "]P", true, 2);
  cell(1, 0, "ismeri: P_pub, Q_ID = [" + v.q + "]P", false, 3); cell(1, 1, "g_ID = e(P,P)^" + v.g, false, 3);
  cell(1, 2, "titok: r = " + v.r + ", U = [" + v.U + "]P", true, 4); cell(1, 3, "g_ID^r = e(P,P)^" + v.gr, false, 4, true);
  cell(2, 0, "ismeri: d_ID = [" + v.d + "]P", true, 5); cell(2, 1, "kapja: U = [" + v.U + "]P, V", false, 5);
  cell(2, 2, "e(d_ID, U) = e([" + v.d + "]P, [" + v.U + "]P)", false, 5); cell(2, 3, "= e(P,P)^" + v.bob, false, 5, true);
  const fin = ph >= 5;
  el("rect", {x: 265, y: 262, width: 485, height: 34, rx: 6, fill: ph === 6 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": fin ? 3 : 1, "stroke-dasharray": fin ? "none" : "4 3"});
  el("text", {x: 507, y: 284, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, fin ? "közös: g_ID^r = e(d_ID, U) = e(P,P)^" + v.gr : "közös érték: …");
  el("text", {x: 10, y: 284, "font-size": 12, fill: css("--muted")}, "aláhúzott, szaggatott: titok");
  if (document.getElementById("reuse").checked && ph >= 4) {
    el("text", {x: 10, y: 320, "font-size": 13}, "r újrahasználata: H2(e(P,P)^" + v.gr + ") = " + hx(v.mask) + " (játék-H2), m1 = " + hx(v.m1) + ", m2 = " + hx(v.m2));
    el("text", {x: 10, y: 342, "font-size": 13, "font-weight": "bold"}, "V1 = " + hx(v.V1) + ", V2 = " + hx(v.V2) + " → V1 ⊕ V2 = " + hx(v.V1 ^ v.V2) + " = m1 ⊕ m2 (a maszk kiesik)");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
