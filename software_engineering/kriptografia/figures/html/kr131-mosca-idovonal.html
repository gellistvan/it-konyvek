<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosca-idővonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--cell:#fff;--cellhl:#d9d9d9;--cell2:#bdbdbd;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--cell:#262626;--cellhl:#4a4a4a;--cell2:#666;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px;flex:1}
input[type=number]{width:5.5em}
label{display:inline-flex;gap:4px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label>x (titkossági igény): <input id="x" type="range" min="0" max="40" value="15"><b id="xv">15</b></label>
<label>y (migráció): <input id="y" type="range" min="0" max="40" value="3"><b id="yv">3</b></label>
</div><div class="ctl">
<label>z (CRQC): <input id="z" type="range" min="0" max="40" value="10"><b id="zv">10</b></label>
<label>migráció kezdete k: <input id="k" type="range" min="0" max="20" value="0"><b id="kv">0</b></label>
</div><div class="ctl">
<span class="small">33.4.11 feladatai (x/y/z):</span>
<button data-p="15,3,10">kidolgozott: 15/3/10</button><button data-p="15,3,25">15/3/25</button>
<button data-p="8,4,15">1. f.: 8/4/15</button><button data-p="12,2,10">4. f.: 12/2/10</button><button data-p="3,2,10">4. f.: 3/2/10</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 300" role="img" aria-label="Idővonal: a migráció 3 évig tart, az adat 18. évig érzékeny, a kvantumgép a 10. évben jelenik meg, a 10–18. év között az adat kitett."></svg>

<p class="small">Szemléltető modell, a z becslés bizonytalan. A kitettségi ablak a CRQC megjelenésétől (z) addig tart, amíg a migráció előtt utoljára klasszikusan titkosított adatnak titkosnak kell maradnia (k + y + x).</p>
<script>
const DATA = {};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","\u2212");}

const ids = ["x", "y", "z", "k"];
function v(id){ return +document.getElementById(id).value; }
function redraw(){
  const x = v("x"), y = v("y"), z = v("z"), k = v("k");
  ids.forEach(id => document.getElementById(id + "v").textContent = v(id));
  const end = k + y + x, L = Math.max(0, end - z), T = Math.max(40, end + 2, z + 2);
  svg.innerHTML = "";
  const X = t => 30 + t / T * 600;
  const defs = el("defs", {});
  const pat = (id, d) => { const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", 8); p.setAttribute("height", 8);
    p.setAttribute("patternUnits", "userSpaceOnUse"); const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); q.setAttribute("stroke", css("--fg")); q.setAttribute("stroke-width", 1.2); q.setAttribute("fill", "none"); p.appendChild(q); defs.appendChild(p); };
  pat("h1", "M0 8 L8 0"); pat("h2", "M0 8 L8 0 M0 0 L8 8"); pat("h3", "M2 2 h0.1 M6 6 h0.1");
  // tengely
  el("line", {x1: X(0), y1: 250, x2: X(T), y2: 250, stroke: css("--line")});
  for (let t = 0; t <= T; t += 5) { el("line", {x1: X(t), y1: 250, x2: X(t), y2: 256, stroke: css("--line")}); el("text", {x: X(t), y: 272, "text-anchor": "middle", "font-size": 12}, String(t)); }
  el("text", {x: X(T / 2), y: 292, "text-anchor": "middle", "font-size": 12}, "idő (év, most = 0)");
  el("line", {x1: X(z), y1: 30, x2: X(z), y2: 250, stroke: css("--fg"), "stroke-width": 4});
  // sávok
  if (y > 0) el("rect", {x: X(k), y: 90, width: X(k + y) - X(k), height: 40, fill: "url(#h1)", stroke: css("--line")});
  el("text", {x: X(k + y) + 6, y: 115, "font-size": 13}, `migráció: ${k} → ${k + y}. év`);
  if (x > 0) el("rect", {x: X(k + y), y: 160, width: X(end) - X(k + y), height: 40, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": "2 3", "stroke-width": 1.6});
  el("text", {x: X(k + y), y: 222, "font-size": 13}, `utolsó klasszikus adat titkos: ${k + y} → ${end}. év`);
  if (L > 0) {
    const a = Math.max(z, k + y);
    el("rect", {x: X(z), y: 160, width: X(end) - X(z), height: 40, fill: "url(#h2)", stroke: css("--line"), "stroke-width": 2});
    el("line", {x1: X(z), y1: 60, x2: X(end), y2: 60, stroke: css("--hl2"), "stroke-width": 2});
    el("text", {x: X(end) + 6, y: 65, "font-size": 13, "font-weight": "bold"}, `${L} év kitettség (${z}–${end}. év)`);
  }
  el("text", {x: X(z) + 6, y: 30, "font-size": 13, "font-weight": "bold"}, `CRQC: z = ${z}`);
  svg.querySelectorAll("text").forEach(t => { const b = t.getBBox(); const r = document.createElementNS(NS, "rect");
    [["x", b.x - 2], ["y", b.y], ["width", b.width + 4], ["height", b.height], ["fill", css("--bg")], ["opacity", 0.85]].forEach(([a, w]) => r.setAttribute(a, w)); svg.insertBefore(r, t); });
  const st = document.getElementById("status");
  st.textContent = (k ? `k + ` : "") + `x + y = ${k ? k + " + " : ""}${x} + ${y} = ${end} ` + (L > 0 ? `> z = ${z} → kitettség ${L} év` : `≤ z = ${z} → nincs kitettség`);
}
ids.forEach(id => document.getElementById(id).addEventListener("input", redraw));
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { const [x, y, z] = b.dataset.p.split(",");
  document.getElementById("x").value = x; document.getElementById("y").value = y; document.getElementById("z").value = z; document.getElementById("k").value = 0; redraw(); });
redraw();

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (typeof redraw === "function") redraw(); });
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
