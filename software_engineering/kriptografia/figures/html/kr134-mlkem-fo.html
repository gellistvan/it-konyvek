<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML-KEM: Encaps, Decaps és implicit elutasítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="flip" aria-pressed="false">Bit átbillentése c-ben</button>
<script>
document.getElementById("flip").onclick = e => { const on = e.target.getAttribute("aria-pressed") !== "true";
  e.target.setAttribute("aria-pressed", on ? "true" : "false"); e.target.textContent = on ? "Érvényes c visszaállítása" : "Bit átbillentése c-ben";
  setSteps(on ? DATA.bad : DATA.ok); };
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Alice és Bob adatútja; manipulált rejtett szövegnél Bob a J(z||c) álkulcsot adja vissza hibaüzenet nélkül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat FIPS 203 hash-szerepekkel (H = SHA3-256, G = SHA3-512, J = SHAKE256); a K-PKE helyén nem éles játék-PKE, a belső lépések rejtve. Hex: első 4 bájt. A „Bit átbillentése” gomb a c 160. bitjét (Mallory) billenti át.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Encaps 1. lépés: m ← véletlen 32 bájt — m = 1992151f…", "line": 1, "side": 0, "i": 0, "flip": false}, {"msg": "Encaps 2. lépés: (K, r) = G(m ‖ H(ek)) — K = ac09ea64…, r = 57e625d6…", "line": 2, "side": 0, "i": 1, "flip": false}, {"msg": "Encaps 3. lépés: c = Encrypt(ek, m; r) — c = 447c429b…", "line": 3, "side": 0, "i": 2, "flip": false}, {"msg": "Encaps 4. lépés: kimenet (K, c); c → Bob — K = ac09ea64…", "line": 4, "side": 0, "i": 3, "flip": false}, {"msg": "Decaps 1. lépés: m′ = Decrypt(dk, c) — m′ = 1992151f… (= m)", "line": 6, "side": 1, "i": 0, "flip": false}, {"msg": "Decaps 2. lépés: (K′, r′) = G(m′ ‖ H(ek)) — K′ = ac09ea64…", "line": 7, "side": 1, "i": 1, "flip": false}, {"msg": "Decaps 3. lépés: K̄ = J(z ‖ c) — K̄ = 619d7a15…", "line": 8, "side": 1, "i": 2, "flip": false}, {"msg": "Decaps 4. lépés: c′ = Encrypt(ek, m′; r′) — c′ = 447c429b… c′ = c ✓", "line": 9, "side": 1, "i": 3, "flip": false}, {"msg": "Decaps 5. lépés: c′ = c ? K′ : K̄ — K′ = ac09ea64… (= K, közös kulcs); Alice és Bob kulcsa azonos", "line": 10, "side": 1, "i": 4, "flip": false}];
const CODE = ["ML-KEM.Encaps(ek):", "  m ← B^32                              # 32 véletlen bájt", "  (K, r) ← G(m ‖ H(ek))", "  c ← K-PKE.Encrypt(ek, m, r)", "  return (K, c)", "ML-KEM.Decaps(dk, c):                   # dk = (dk_PKE ‖ ek ‖ H(ek) ‖ z)", "  m' ← K-PKE.Decrypt(dk_PKE, c)", "  (K', r') ← G(m' ‖ H(ek))", "  K̄ ← J(z ‖ c)", "  c' ← K-PKE.Encrypt(ek, m', r')", "  if c ≠ c': K' ← K̄                     # implicit elutasítás", "  return K'"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const DATA = {"A": [["1. m ← véletlen 32 bájt", "m = 1992151f…"], ["2. (K, r) = G(m ‖ H(ek))", "K = ac09ea64…\nr = 57e625d6…"], ["3. c = Encrypt(ek, m; r)", "c = 447c429b…"], ["4. kimenet (K, c); c → Bob", "K = ac09ea64…"]], "Bok": [["1. m′ = Decrypt(dk, c)", "m′ = 1992151f… (= m)"], ["2. (K′, r′) = G(m′ ‖ H(ek))", "K′ = ac09ea64…"], ["3. K̄ = J(z ‖ c)", "K̄ = 619d7a15…"], ["4. c′ = Encrypt(ek, m′; r′)", "c′ = 447c429b…\nc′ = c ✓"], ["5. c′ = c ? K′ : K̄", "K′ = ac09ea64…\n(= K, közös kulcs)"]], "Bbad": [["1. m′ = Decrypt(dk, c̃)", "m′ = b5018d21… (≠ m)"], ["2. (K′, r′) = G(m′ ‖ H(ek))", "K′ = cc806c38…"], ["3. K̄ = J(z ‖ c̃)", "K̄ = 8845c9bc…"], ["4. c′ = Encrypt(ek, m′; r′)", "c′ = fc845d5e…\nc′ ≠ c̃ ✗"], ["5. c′ = c̃ ? K′ : K̄", "K̄ = 8845c9bc…\n(álkulcs, nincs hiba)"]], "ok": [{"msg": "Encaps 1. lépés: m ← véletlen 32 bájt — m = 1992151f…", "line": 1, "side": 0, "i": 0, "flip": false}, {"msg": "Encaps 2. lépés: (K, r) = G(m ‖ H(ek)) — K = ac09ea64…, r = 57e625d6…", "line": 2, "side": 0, "i": 1, "flip": false}, {"msg": "Encaps 3. lépés: c = Encrypt(ek, m; r) — c = 447c429b…", "line": 3, "side": 0, "i": 2, "flip": false}, {"msg": "Encaps 4. lépés: kimenet (K, c); c → Bob — K = ac09ea64…", "line": 4, "side": 0, "i": 3, "flip": false}, {"msg": "Decaps 1. lépés: m′ = Decrypt(dk, c) — m′ = 1992151f… (= m)", "line": 6, "side": 1, "i": 0, "flip": false}, {"msg": "Decaps 2. lépés: (K′, r′) = G(m′ ‖ H(ek)) — K′ = ac09ea64…", "line": 7, "side": 1, "i": 1, "flip": false}, {"msg": "Decaps 3. lépés: K̄ = J(z ‖ c) — K̄ = 619d7a15…", "line": 8, "side": 1, "i": 2, "flip": false}, {"msg": "Decaps 4. lépés: c′ = Encrypt(ek, m′; r′) — c′ = 447c429b… c′ = c ✓", "line": 9, "side": 1, "i": 3, "flip": false}, {"msg": "Decaps 5. lépés: c′ = c ? K′ : K̄ — K′ = ac09ea64… (= K, közös kulcs); Alice és Bob kulcsa azonos", "line": 10, "side": 1, "i": 4, "flip": false}], "bad": [{"msg": "Encaps 1. lépés: m ← véletlen 32 bájt — m = 1992151f…", "line": 1, "side": 0, "i": 0, "flip": true}, {"msg": "Encaps 2. lépés: (K, r) = G(m ‖ H(ek)) — K = ac09ea64…, r = 57e625d6…", "line": 2, "side": 0, "i": 1, "flip": true}, {"msg": "Encaps 3. lépés: c = Encrypt(ek, m; r) — c = 447c429b…", "line": 3, "side": 0, "i": 2, "flip": true}, {"msg": "Encaps 4. lépés: kimenet (K, c); c → Bob — K = ac09ea64…; Mallory átbillent egy bitet: c̃ = 457c429b…", "line": 4, "side": 0, "i": 3, "flip": true}, {"msg": "Decaps 1. lépés: m′ = Decrypt(dk, c̃) — m′ = b5018d21… (≠ m)", "line": 6, "side": 1, "i": 0, "flip": true}, {"msg": "Decaps 2. lépés: (K′, r′) = G(m′ ‖ H(ek)) — K′ = cc806c38…", "line": 7, "side": 1, "i": 1, "flip": true}, {"msg": "Decaps 3. lépés: K̄ = J(z ‖ c̃) — K̄ = 8845c9bc…", "line": 8, "side": 1, "i": 2, "flip": true}, {"msg": "Decaps 4. lépés: c′ = Encrypt(ek, m′; r′) — c′ = fc845d5e… c′ ≠ c̃ ✗", "line": 9, "side": 1, "i": 3, "flip": true}, {"msg": "Decaps 5. lépés: c′ = c̃ ? K′ : K̄ — K̄ = 8845c9bc… (álkulcs, nincs hiba) (nincs hibaüzenet)", "line": 10, "side": 1, "i": 4, "flip": true}]};

const SC = {ok: STEPS, bad: null};
function render(s){
  svg.setAttribute("viewBox", "0 0 700 380"); svg.innerHTML = "";
  const A = DATA.A, B = s.flip ? DATA.Bbad : DATA.Bok;
  el("text", {x: 160, y: 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Alice: Encaps(ek)");
  el("text", {x: 530, y: 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, s.flip ? "Bob: Decaps(dk, c̃) – manipulált" : "Bob: Decaps(dk, c) – érvényes");
  const box = (x, y, t, b, on, shown, bad) => {
    el("rect", {x: x, y: y, width: 320, height: 54, rx: 6, fill: shown ? (bad ? css("--cellhl") : css("--cell")) : css("--bg"),
      stroke: shown ? css("--line") : css("--muted"), "stroke-width": on ? 3.2 : 1.1, "stroke-dasharray": bad ? "6 4" : "none"});
    if (shown) { el("text", {x: x + 8, y: y + 21, "font-size": 13}, t); el("text", {x: x + 8, y: y + 43, "font-size": 12.5, "font-family": "ui-monospace,monospace"}, b); } };
  const cur = s.side * 4 + s.i;
  A.forEach((r, i) => box(4, 36 + i * 66, r[0], r[1], s.side === 0 && s.i === i, s.side === 1 || i <= s.i, false));
  B.forEach((r, i) => box(372, 36 + i * 66, r[0], r[1], s.side === 1 && s.i === i, s.side === 1 && i <= s.i, s.flip && [0, 3, 4].includes(i)));
  if (s.side === 1 || s.i === 3) { el("line", {x1: 324, y1: 260, x2: 368, y2: 63, stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": s.flip ? "6 4" : "none"});
    el("text", {x: 346, y: 170, "text-anchor": "middle", "font-size": s.flip ? 22 : 13, "font-weight": "bold", fill: s.flip ? css("--hl2") : css("--fg")}, s.flip ? "×" : "c"); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
