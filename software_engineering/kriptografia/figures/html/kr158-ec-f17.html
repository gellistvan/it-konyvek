<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC-pontösszeadás mod p</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="cv" onchange="swapSet()"> B1 görbe: y² = x³ + x + 6 (mod 11), P = (2, 4), Q = (5, 2)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A görbe összes pontja rácson; kiemelve P, [2]P és [3]P; az érintő és a húr mod p pontjai szaggatott körökkel, a harmadik metszéspont tükrözése szaggatott vonallal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított értékek (Python, a 40.3.5.2 A1 és B1 megoldásának képleteivel). A „húr” mod p az y = λx + ν egyenes pontjainak halmaza; pontosan három görbepontot tartalmaz (multiplicitással).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"set": "A1", "line": 0, "show": {"pts": {"P": [3, 6]}}, "msg": "E: y² = x³ + 2x + 3 (mod 17): 21 affin pont + ∞; P = (3, 6)"}, {"set": "A1", "line": 1, "show": {"pts": {"P": [3, 6]}, "ln": [[0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 8], [6, 9], [7, 10], [8, 11], [9, 12], [10, 13], [11, 14], [12, 15], [13, 16], [14, 0], [15, 1], [16, 2]], "lam": 1}, "msg": "[2]P: érintő P-ben, λ = (3x₁² + 2)/(2y₁) = 29/12 ≡ 12/12 ≡ 1 (mod 17); egyenes: y = x + 3"}, {"set": "A1", "line": 2, "show": {"pts": {"P": [3, 6]}, "ln": [[0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 8], [6, 9], [7, 10], [8, 11], [9, 12], [10, 13], [11, 14], [12, 15], [13, 16], [14, 0], [15, 1], [16, 2]], "neg": [12, 15], "lam": 1}, "msg": "x₃ = λ² − x₁ − x₂ = 1 − 3 − 3 ≡ 12; harmadik metszéspont −[2]P = (12, 15)"}, {"set": "A1", "line": 3, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "neg": [12, 15], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 2: tükrözés után [2]P = (12, 2)"}, {"set": "A1", "line": 1, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "ln": [[0, 13], [1, 5], [2, 14], [3, 6], [4, 15], [5, 7], [6, 16], [7, 8], [8, 0], [9, 9], [10, 1], [11, 10], [12, 2], [13, 11], [14, 3], [15, 12], [16, 4]], "lam": 9}, "msg": "[3]P: húr, λ = (6 − 2)/(3 − 12) = 4/(−9) ≡ 9 (mod 17); egyenes: y = 9x + 13"}, {"set": "A1", "line": 2, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "ln": [[0, 13], [1, 5], [2, 14], [3, 6], [4, 15], [5, 7], [6, 16], [7, 8], [8, 0], [9, 9], [10, 1], [11, 10], [12, 2], [13, 11], [14, 3], [15, 12], [16, 4]], "neg": [15, 12], "lam": 9}, "msg": "x₃ = λ² − x₁ − x₂ = 81 − 12 − 3 ≡ 15; harmadik metszéspont −[3]P = (15, 12)"}, {"set": "A1", "line": 3, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2], "[3]P": [15, 5]}, "neg": [15, 12], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 5: tükrözés után [3]P = (15, 5)"}];
const CODE = ["kiinduló pontok a görbén", "λ = (3x₁² + a)/(2y₁)  ha P = Q (érintő);  λ = (y₂ − y₁)/(x₂ − x₁)  egyébként (húr)   [mod p]", "x₃ = λ² − x₁ − x₂;  a mod p „egyenes” harmadik metszéspontja: (x₃, −y₃)", "y₃ = λ(x₁ − x₃) − y₁:  R = (x₃, y₃) – tükrözés az x tengelyre (y ↦ −y mod p)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = {A1: {p: 17, pts: [[2, 7], [2, 10], [3, 6], [3, 11], [5, 6], [5, 11], [8, 2], [8, 15], [9, 6], [9, 11], [11, 8], [11, 9], [12, 2], [12, 15], [13, 4], [13, 13], [14, 2], [14, 15], [15, 5], [15, 12], [16, 0]], steps: [{"set": "A1", "line": 0, "show": {"pts": {"P": [3, 6]}}, "msg": "E: y² = x³ + 2x + 3 (mod 17): 21 affin pont + ∞; P = (3, 6)"}, {"set": "A1", "line": 1, "show": {"pts": {"P": [3, 6]}, "ln": [[0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 8], [6, 9], [7, 10], [8, 11], [9, 12], [10, 13], [11, 14], [12, 15], [13, 16], [14, 0], [15, 1], [16, 2]], "lam": 1}, "msg": "[2]P: érintő P-ben, λ = (3x₁² + 2)/(2y₁) = 29/12 ≡ 12/12 ≡ 1 (mod 17); egyenes: y = x + 3"}, {"set": "A1", "line": 2, "show": {"pts": {"P": [3, 6]}, "ln": [[0, 3], [1, 4], [2, 5], [3, 6], [4, 7], [5, 8], [6, 9], [7, 10], [8, 11], [9, 12], [10, 13], [11, 14], [12, 15], [13, 16], [14, 0], [15, 1], [16, 2]], "neg": [12, 15], "lam": 1}, "msg": "x₃ = λ² − x₁ − x₂ = 1 − 3 − 3 ≡ 12; harmadik metszéspont −[2]P = (12, 15)"}, {"set": "A1", "line": 3, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "neg": [12, 15], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 2: tükrözés után [2]P = (12, 2)"}, {"set": "A1", "line": 1, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "ln": [[0, 13], [1, 5], [2, 14], [3, 6], [4, 15], [5, 7], [6, 16], [7, 8], [8, 0], [9, 9], [10, 1], [11, 10], [12, 2], [13, 11], [14, 3], [15, 12], [16, 4]], "lam": 9}, "msg": "[3]P: húr, λ = (6 − 2)/(3 − 12) = 4/(−9) ≡ 9 (mod 17); egyenes: y = 9x + 13"}, {"set": "A1", "line": 2, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2]}, "ln": [[0, 13], [1, 5], [2, 14], [3, 6], [4, 15], [5, 7], [6, 16], [7, 8], [8, 0], [9, 9], [10, 1], [11, 10], [12, 2], [13, 11], [14, 3], [15, 12], [16, 4]], "neg": [15, 12], "lam": 9}, "msg": "x₃ = λ² − x₁ − x₂ = 81 − 12 − 3 ≡ 15; harmadik metszéspont −[3]P = (15, 12)"}, {"set": "A1", "line": 3, "show": {"pts": {"P": [3, 6], "[2]P": [12, 2], "[3]P": [15, 5]}, "neg": [15, 12], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 5: tükrözés után [3]P = (15, 5)"}]}, B1: {p: 11, pts: [[2, 4], [2, 7], [3, 5], [3, 6], [5, 2], [5, 9], [7, 2], [7, 9], [8, 3], [8, 8], [10, 2], [10, 9]], steps: [{"set": "B1", "line": 0, "show": {"pts": {"P": [2, 4], "Q": [5, 2]}}, "msg": "E: y² = x³ + 1x + 6 (mod 11): 12 affin pont + ∞; P = (2, 4), Q = (5, 2)"}, {"set": "B1", "line": 1, "show": {"pts": {"P": [2, 4], "Q": [5, 2]}, "ln": [[0, 9], [1, 1], [2, 4], [3, 7], [4, 10], [5, 2], [6, 5], [7, 8], [8, 0], [9, 3], [10, 6]], "lam": 3}, "msg": "P + Q: húr, λ = (2 − 4)/(5 − 2) = −2/3 ≡ 3 (mod 11); egyenes: y = 3x + 9"}, {"set": "B1", "line": 2, "show": {"pts": {"P": [2, 4], "Q": [5, 2]}, "ln": [[0, 9], [1, 1], [2, 4], [3, 7], [4, 10], [5, 2], [6, 5], [7, 8], [8, 0], [9, 3], [10, 6]], "neg": [2, 4], "lam": 3}, "msg": "x₃ = λ² − x₁ − x₂ = 9 − 2 − 5 ≡ 2; harmadik metszéspont −(P + Q) = (2, 4)"}, {"set": "B1", "line": 3, "show": {"pts": {"P": [2, 4], "Q": [5, 2], "P + Q": [2, 7]}, "neg": [2, 4], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 7: tükrözés után P + Q = (2, 7)"}, {"set": "B1", "line": 1, "show": {"pts": {"P": [2, 4], "Q": [5, 2], "P + Q": [2, 7]}, "ln": [[0, 9], [1, 1], [2, 4], [3, 7], [4, 10], [5, 2], [6, 5], [7, 8], [8, 0], [9, 3], [10, 6]], "lam": 3}, "msg": "[2]P: érintő P-ben, λ = (3x₁² + 1)/(2y₁) = 13/8 ≡ 2/8 ≡ 3 (mod 11); egyenes: y = 3x + 9"}, {"set": "B1", "line": 2, "show": {"pts": {"P": [2, 4], "Q": [5, 2], "P + Q": [2, 7]}, "ln": [[0, 9], [1, 1], [2, 4], [3, 7], [4, 10], [5, 2], [6, 5], [7, 8], [8, 0], [9, 3], [10, 6]], "neg": [5, 2], "lam": 3}, "msg": "x₃ = λ² − x₁ − x₂ = 9 − 2 − 2 ≡ 5; harmadik metszéspont −[2]P = (5, 2)"}, {"set": "B1", "line": 3, "show": {"pts": {"P": [2, 4], "Q": [5, 2], "P + Q": [2, 7], "[2]P": [5, 9]}, "neg": [5, 2], "refl": true}, "msg": "y₃ = λ(x₁ − x₃) − y₁ ≡ 9: tükrözés után [2]P = (5, 9)"}]}};
let CUR = "A1";
function swapSet(){ CUR = document.getElementById("cv").checked ? "B1" : "A1"; setSteps(SETS[CUR].steps); }
const MK = {"P": "circle", "Q": "diamond", "[2]P": "square", "[3]P": "tri", "P + Q": "tri"};
function shape(kind, x, y, r, fill){
  if (kind === "square") return el("rect", {x: x - r, y: y - r, width: 2 * r, height: 2 * r, fill: fill, stroke: css("--fg"), "stroke-width": 2});
  if (kind === "tri") return el("polygon", {points: `${x},${y - r * 1.2} ${x - r * 1.1},${y + r * 0.8} ${x + r * 1.1},${y + r * 0.8}`, fill: fill, stroke: css("--fg"), "stroke-width": 2});
  if (kind === "diamond") return el("polygon", {points: `${x},${y - r * 1.3} ${x - r * 1.1},${y} ${x},${y + r * 1.3} ${x + r * 1.1},${y}`, fill: fill, stroke: css("--fg"), "stroke-width": 2});
  return el("circle", {cx: x, cy: y, r: r, fill: fill, stroke: css("--fg"), "stroke-width": 2});
}
function render(s){
  const D = SETS[s.set], p = D.p, sh = s.show;
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 430");
  const S = 380 / (p - 1), X = x => 50 + x * S, Y = y => 400 - y * S;
  for (let t = 0; t < p; t++) {
    el("line", {x1: X(t), y1: Y(0), x2: X(t), y2: Y(p - 1), stroke: css("--muted"), "stroke-width": 0.3});
    el("line", {x1: X(0), y1: Y(t), x2: X(p - 1), y2: Y(t), stroke: css("--muted"), "stroke-width": 0.3});
    if (t % 2 === 0 || p < 12) { el("text", {x: X(t), y: 418, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t)); el("text", {x: 38, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(t)); }
  }
  if (sh.ln) sh.ln.forEach(q => el("circle", {cx: X(q[0]), cy: Y(q[1]), r: 7, fill: "none", stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "2 2"}));
  D.pts.forEach(q => el("circle", {cx: X(q[0]), cy: Y(q[1]), r: 3.2, fill: css("--fg")}));
  if (sh.neg) {
    shape("tri", X(sh.neg[0]), Y(sh.neg[1]), 8, css("--bg")).setAttribute("stroke-dasharray", "3 2");
    el("text", {x: X(sh.neg[0]) + 12, y: Y(sh.neg[1]) - 8, "font-size": 12}, "−R");
  }
  Object.entries(sh.pts).forEach(([n, q], i) => {
    const last = i === Object.keys(sh.pts).length - 1 && sh.refl;
    shape(MK[n] || "circle", X(q[0]), Y(q[1]), 8, last ? css("--hl2") : css("--bg"));
    el("text", {x: X(q[0]) + 12, y: Y(q[1]) + 16, "font-size": 13, "font-weight": "bold"}, n);
  });
  if (sh.refl && sh.neg) {
    const last = Object.values(sh.pts).slice(-1)[0];
    el("line", {x1: X(sh.neg[0]) - 14, y1: Y(sh.neg[1]), x2: X(last[0]) - 14, y2: Y(last[1]), stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": "5 3"});
    el("text", {x: X(last[0]) - 20, y: (Y(sh.neg[1]) + Y(last[1])) / 2, "text-anchor": "end", "font-size": 11}, "y ↦ −y");
  }
  el("text", {x: 440, y: 30, "font-size": 12}, "● görbepont");
  el("text", {x: 440, y: 48, "font-size": 12, fill: css("--hl")}, "◌ egyenes mod " + p);
  el("text", {x: 440, y: 66, "font-size": 12}, D.pts.length + " affin pont + ∞");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
