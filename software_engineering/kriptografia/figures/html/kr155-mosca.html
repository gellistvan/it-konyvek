<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosca-elemzés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#5a5a5a;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#9a9a9a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label>z (kvantumgép, év): <input id="z" type="range" min="5" max="25" step="1" value="10" aria-label="z, a kvantumgép megjelenéséig hátralévő évek"> <b id="zv">10</b></label>
  <label>y (migráció, év): <input id="y" type="range" min="1" max="5" step="1" value="2" aria-label="y, a migráció időtartama években"> <b id="yv">2</b></label>
  <button id="p10">Alapeset (z = 10, y = 2)</button>
  <button id="p20">3. feladat (z = 20)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 420" role="img" aria-label="Rendszerenként egy sáv: sraffozott migrációs szakasz és tömör titkossági idő; függőleges szaggatott vonal a z határnál; a határon túllógó sávok vastag kerettel és kockázat címkével."></svg>
<p class="small">A 39.4.4.1 kriptoleltár x értékei. Becsült értékek, nem mérés. A Lementések kulcscsere nélküli at-rest adat (pontozott keret): a „harvest now, decrypt later” forgalomrögzítés rá nem értelmezhető ugyanígy.</p>
<script>
const SYS = [["Ügyfélportál", 10, true], ["Adatbázisok", 8, true], ["Lementések", 8, false], ["Külső API", 5, true], ["Felhő tároló", 5, true], ["Kód aláírás", 5, true], ["SSH", 3, true], ["E-mail", 3, true], ["Dokumentumkezelő", 3, true], ["VPN", 2, true]];
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(tag, a, t){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function draw(){
  const z = +document.getElementById("z").value, y = +document.getElementById("y").value;
  document.getElementById("zv").textContent = z; document.getElementById("yv").textContent = y;
  svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.3"/></pattern>`;
  svg.appendChild(defs);
  const X0 = 150, XM = 30, S = (720 - X0) / XM, X = v => X0 + v * S;
  for (let t = 0; t <= XM; t += 5) { el("line", {x1: X(t), y1: 30, x2: X(t), y2: 385, stroke: css("--muted"), "stroke-width": 0.4}); el("text", {x: X(t), y: 402, "text-anchor": "middle", "font-size": 12}, String(t)); }
  el("text", {x: X(XM / 2), y: 418, "text-anchor": "middle", "font-size": 12}, "év (most = 0)");
  const risk = [], edge = [];
  SYS.forEach((s, i) => {
    const yy = 40 + i * 34, x = s[1], tot = x + y, st = tot > z ? "risk" : (tot === z ? "edge" : "ok");
    if (st === "risk") risk.push(s[0]); if (st === "edge") edge.push(s[0]);
    const lw = st === "risk" ? 3 : 1, da = s[2] ? "" : "3 3";
    el("text", {x: X0 - 8, y: yy + 17, "text-anchor": "end", "font-size": 13}, s[0]);
    el("rect", {x: X(0), y: yy, width: y * S, height: 24, fill: "url(#hb)", stroke: st === "risk" ? css("--hl2") : css("--line"), "stroke-width": lw, "stroke-dasharray": da});
    el("rect", {x: X(y), y: yy, width: x * S, height: 24, fill: css("--cellhl"), stroke: st === "risk" ? css("--hl2") : css("--line"), "stroke-width": lw, "stroke-dasharray": da});
    el("text", {x: X(tot) + 6, y: yy + 17, "font-size": 12, "font-weight": st === "risk" ? "bold" : "normal", fill: st === "risk" ? css("--hl2") : css("--fg")},
       y + "+" + x + " = " + tot + (st === "risk" ? "  kockázat" : st === "edge" ? "  határeset" : "") + (s[2] ? "" : " (kulcscsere nélkül)"));
  });
  el("line", {x1: X(z), y1: 26, x2: X(z), y2: 385, stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: X(z), y: 18, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "z = " + z + " év");
  document.getElementById("status").textContent = "z = " + z + ", y = " + y + ": x + y > z teljesül: " + (risk.length ? risk.join(", ") : "egyik rendszernél sem") +
    (edge.length ? "; határeset (x + y = z): " + edge.join(", ") : "") + ".";
}
function preset(z, y){ document.getElementById("z").value = z; document.getElementById("y").value = y; draw(); }
document.getElementById("z").oninput = draw; document.getElementById("y").oninput = draw;
document.getElementById("p10").onclick = () => preset(10, 2);
document.getElementById("p20").onclick = () => preset(20, 2);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
