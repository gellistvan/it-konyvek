<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCM nonce-újrahasználat</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját P2 (16 ASCII karakter): <input id="p2" value="POST /login HTTP" maxlength="16" size="18" aria-label="Saját második nyílt szöveg"></label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két AES-GCM titkosítás egymás alatt ugyanazzal a nonce-szal; a kulcsfolyam- és maszkdobozok egyeznek, a rejtett szövegek XOR-ja a nyílt szövegek XOR-ja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Rögzített tesztkulccsal (AES-128, K = 00 01 … 0f, nonce cafebabe facedbad decaf888) számított, nem éles adat. A H, S és E_K(J0) értéke a Python-szkriptben AESGCM-mel ellenőrzött konstans; a saját P2-höz a lap a GHASH-t (GF(2¹²⁸)) számolja újra. A rövidebb szöveget szóközzel 16 bájtra egészíti ki.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 0, "line": 2, "msg": "1. Közös H: H = E_K(0^128) csak a kulcstól függ – mindkét üzenet GHASH-e ugyanazt a H-t használja"}, {"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 1, "line": 4, "msg": "2. Közös J0 = N ‖ 0³¹1: azonos nonce → azonos J0, így a címkemaszk E_K(J0) is azonos"}, {"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 2, "line": 5, "msg": "3. Közös kulcsfolyam S = E_K(J0+1): C1 = P1 ⊕ S és C2 = P2 ⊕ S"}, {"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 3, "line": 6, "msg": "4. C1 ⊕ C2 = P1 ⊕ P2 bájtonként – a kulcsfolyam kiesett"}, {"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 4, "line": 8, "msg": "5. Ismert P1-ből: S = C1 ⊕ P1, majd P2 = C2 ⊕ S – a második nyílt szöveg visszanyerve – egyezik a beírt szöveggel: igen"}, {"P1": "GET / HTTP/1.1\\r\\n", "P2": "POST /login HTTP", "C1": "ce3c9396 aad7c955 fe40e6b9 73cbaded", "C2": "d93694e2 a5d8ed6e cd79a7a8 15aef4b7", "T1": "d50a4125 f4f85187 1b92b30a b33d50a6", "T2": "fa1f9ecd fd81665a 4a4dcf43 0ded894c", "S": "8979c7b6 85f78101 aa10c988 5dfaa0e7", "H": "c6a13b37 878f5b82 6f4f8162 a1c8d879", "EJ0": "a945054a ec8b8f4e 4bdfe17f 0557f09a", "X": "170a0774 0f0f243b 33394111 6665595a", "PX": "170a0774 0f0f243b 33394111 6665595a", "REC": "POST /login HTTP", "DT": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "GX": "2f15dfe8 097937dd 51df7c49 bed0d9ea", "k": 5, "line": 9, "msg": "6. T1 ⊕ T2 = GHASH_H(A1, C1) ⊕ GHASH_H(A2, C2): a közös E_K(J0) maszk kiesik, H egy polinom gyöke"}];
const CODE = ["key = bytes(range(16))                       # rögzített TESZTKULCS (AES-128)", "nonce = bytes.fromhex('cafebabefacedbaddecaf888')", "aes = AESGCM(key)                            # belül: H = E_K(0^128)", "ct1 = aes.encrypt(nonce, P1, None)           # C1 || T1", "ct2 = aes.encrypt(nonce, P2, None)           # UGYANAZ a nonce: J0 is ugyanaz", "C1, T1, C2, T2 = ct1[:16], ct1[16:], ct2[:16], ct2[16:]", "x = bytes(a ^ b for a, b in zip(C1, C2))     # = P1 XOR P2", "S = bytes(a ^ b for a, b in zip(C1, P1))     # kulcsfolyam ismert P1-ből", "P2_rec = bytes(a ^ b for a, b in zip(C2, S))", "dT = bytes(a ^ b for a, b in zip(T1, T2))    # E_K(J0) kiesik: GHASH(C1) XOR GHASH(C2)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const KS_ = {S: "8979c7b6 85f78101 aa10c988 5dfaa0e7", H: "c6a13b37 878f5b82 6f4f8162 a1c8d879", EJ0: "a945054a ec8b8f4e 4bdfe17f 0557f09a", C1: "ce3c9396 aad7c955 fe40e6b9 73cbaded", T1: "d50a4125 f4f85187 1b92b30a b33d50a6", P1hex: "474554202f20485454502f312e310d0a"};
function T_(x, y, s, o){ return el("text", Object.assign({x, y, "font-size": 13}, o || {}), s); }
function M_(x, y, s, on){ return el("text", {x, y, "font-size": 11.5, "font-family": "ui-monospace,monospace", "font-weight": on ? "bold" : "normal", fill: on ? css("--hl2") : css("--fg")}, s); }
function hb(x, y, w, lab, on){
  el("rect", {x, y: y - 15, width: w, height: 22, rx: 5, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": on ? "" : "3 2"});
  T_(x + w / 2, y + 1, lab, {"text-anchor": "middle", "font-size": 12});
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const k_ = s.k;
  T_(8, 18, "H = E_K(0¹²⁸) = " + s.H, {"font-size": 12, "font-weight": k_ === 0 ? "bold" : "normal", fill: k_ === 0 ? css("--hl2") : css("--fg")});
  T_(8, 46, "CTR-rész", {"font-weight": "bold"});
  [["1.", s.P1, s.C1], ["2.", s.P2, s.C2]].forEach(([n, p, c], i) => {
    const y = 72 + i * 34;
    T_(8, y, n + " üz.");
    hb(48, y, 104, "S = E_K(J0+1)", k_ === 2);
    T_(158, y, "⊕ \"" + p + "\"", {"font-size": 12});
    M_(318, y, "= " + c, false);
  });
  T_(100, 93, "=", {"text-anchor": "middle", "font-size": 13, "font-weight": "bold"});
  T_(8, 140, "Címke", {"font-weight": "bold"});
  [["1.", "C1", s.T1], ["2.", "C2", s.T2]].forEach(([n, c, t], i) => {
    const y = 166 + i * 34;
    T_(8, y, n + " üz.");
    hb(48, y, 104, "E_K(J0) maszk", k_ === 1 || k_ === 5);
    T_(158, y, "⊕ GHASH_H(A, " + c + ")", {"font-size": 12});
    M_(318, y, "= " + t, false);
  });
  T_(100, 187, "=", {"text-anchor": "middle", "font-size": 13, "font-weight": "bold"});
  if (k_ >= 3) { T_(8, 240, "C1 ⊕ C2"); M_(110, 240, "= " + s.X, k_ === 3); T_(8, 260, "P1 ⊕ P2"); M_(110, 260, "= " + s.PX, k_ === 3); }
  if (k_ >= 4) { T_(8, 288, "P2 = C2 ⊕ (C1 ⊕ P1) = \"" + s.REC + "\"", {"font-weight": k_ === 4 ? "bold" : "normal", fill: k_ === 4 ? css("--hl2") : css("--fg")}); }
  if (k_ >= 5) { T_(8, 316, "T1 ⊕ T2"); M_(110, 316, "= " + s.DT, true); T_(390, 316, "= GHASH(C1) ⊕ GHASH(C2)", {"font-size": 12}); }
}
// ---- GF(2^128) és GHASH (A = üres, egy 16 bájtos C-blokk) a saját P2-höz ----
const RR = 0xE1n << 120n;
function hexToBig(h){ return BigInt("0x" + h.replace(/ /g, "")); }
function bigToHex(b){ const s = b.toString(16).padStart(32, "0"); return [0, 8, 16, 24].map(i => s.slice(i, i + 8)).join(" "); }
function gmul(x, y){ let z = 0n, v = y; for (let i = 127n; i >= 0n; i--) { if ((x >> i) & 1n) z ^= v; v = (v & 1n) ? ((v >> 1n) ^ RR) : (v >> 1n); } return z; }
function ghash(h, c){ let y = gmul(c, h); return gmul(y ^ 128n, h); }
function shw(str){ return str.replace(/\r/g, "\\r").replace(/\n/g, "\\n"); }
function load(){
  let p = document.getElementById("p2").value, e = document.getElementById("err");
  if (!/^[\x20-\x7e]*$/.test(p)) { e.textContent = "Csak ASCII karakter adható meg."; return; }
  p = p.padEnd(16, " ").slice(0, 16); e.textContent = "";
  let p2 = 0n; for (const ch of p) p2 = (p2 << 8n) | BigInt(ch.charCodeAt(0));
  const S = hexToBig(KS_.S), H = hexToBig(KS_.H), EJ = hexToBig(KS_.EJ0), C1 = hexToBig(KS_.C1), T1 = hexToBig(KS_.T1), P1 = hexToBig(KS_.P1hex);
  const C2 = p2 ^ S, T2 = ghash(H, C2) ^ EJ;
  const rec = (C2 ^ (C1 ^ P1)); let rs = ""; for (let i = 15n; i >= 0n; i--) rs += String.fromCharCode(Number((rec >> (8n * i)) & 255n));
  const base = {P1: shw("GET / HTTP/1.1\r\n"), P2: shw(p), C1: bigToHex(C1), C2: bigToHex(C2), T1: bigToHex(T1), T2: bigToHex(T2), S: bigToHex(S), H: bigToHex(H), EJ0: bigToHex(EJ), X: bigToHex(C1 ^ C2), PX: bigToHex(P1 ^ p2), REC: shw(rs), DT: bigToHex(T1 ^ T2), GX: bigToHex(ghash(H, C1) ^ ghash(H, C2))};
  setSteps(MSGS_.map(([ln, m], i) => Object.assign({}, base, {k: i, line: ln, msg: m + (i === 4 ? " – egyezik a beírt szöveggel: " + (rs === p ? "igen" : "NEM") : "")})));
}
const MSGS_ = [[2, "1. Közös H: H = E_K(0^128) csak a kulcstól függ – mindkét üzenet GHASH-e ugyanazt a H-t használja"], [4, "2. Közös J0 = N ‖ 0³¹1: azonos nonce → azonos J0, így a címkemaszk E_K(J0) is azonos"], [5, "3. Közös kulcsfolyam S = E_K(J0+1): C1 = P1 ⊕ S és C2 = P2 ⊕ S"], [6, "4. C1 ⊕ C2 = P1 ⊕ P2 bájtonként – a kulcsfolyam kiesett"], [8, "5. Ismert P1-ből: S = C1 ⊕ P1, majd P2 = C2 ⊕ S – a második nyílt szöveg visszanyerve"], [9, "6. T1 ⊕ T2 = GHASH_H(A1, C1) ⊕ GHASH_H(A2, C2): a közös E_K(J0) maszk kiesik, H egy polinom gyöke"]];


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
