<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vakított DH-OPRF kis csoportban (játék)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>H(p) <input id="hp" type="number" value="9" min="1" max="22"></label>
<label>k <input id="kk" type="number" value="3" min="1" max="10"></label>
<label>r <input id="rr" type="number" value="7" min="1" max="10"></label>
<button onclick="apply(false)">Számol</button>
<button onclick="apply(true)">Új r</button>
<span id="err" class="small" aria-live="polite"></span>
<span class="small">(helyes jelszó: 9, rossz jelszó: 13)</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvencia kliens és szerver között; M = H(p)^r, Z = M^k, a kliens r inverzével N = H(p)^k-t kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játék-csoport (Z_23^* 11 rendű részcsoportja, generátor 4) és játék-hash („kék24!” → 9, „kek24!” → 13); számított értékek, nem biztonságos. Az „Új r” más M-et ad, az N változatlan.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Lépés 1/3: M=4, Z=…, N=… – a szerver által látott: M=4", "line": 0, "h": 9, "k": 3, "r": 7, "M": 4, "Z": 18, "rinv": 8, "N": 16, "s": 1}, {"msg": "Lépés 2/3: M=4, Z=18, N=… – a szerver által látott: M=4, Z=18", "line": 1, "h": 9, "k": 3, "r": 7, "M": 4, "Z": 18, "rinv": 8, "N": 16, "s": 2}, {"msg": "Lépés 3/3: M=4, Z=18, N=16 – a szerver által látott: M=4, Z=18 (N = H(p)^k = 9^3 mod 23)", "line": 2, "h": 9, "k": 3, "r": 7, "M": 4, "Z": 18, "rinv": 8, "N": 16, "s": 3}];
const CODE = ["Kliens:  M = H(p)^r mod 23                (r véletlen, 1 ≤ r ≤ 10)", "Szerver: Z = M^k mod 23                   (a szerver csak M-et látja)", "Kliens:  N = Z^(r⁻¹ mod 11) mod 23 = H(p)^k"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SUB = [1, 2, 3, 4, 6, 8, 9, 12, 13, 16, 18];
function pw(a,b,m){let x=1;a%=m;while(b>0){if(b&1)x=x*a%m;a=a*a%m;b>>=1;}return x;}
function inv(a,m){for(let x=1;x<m;x++) if(a*x%m===1) return x; return null;}
function mk(h,kx,r){
  const M=pw(h,r,23), Z=pw(M,kx,23), ri=inv(r,11), N=pw(Z,ri,23);
  const base={h:h,k:kx,r:r,M:M,Z:Z,rinv:ri,N:N};
  return [Object.assign({},base,{s:1,line:0,msg:`Lépés 1/3: M=${M}, Z=…, N=… – a szerver által látott: M=${M}`}),
          Object.assign({},base,{s:2,line:1,msg:`Lépés 2/3: M=${M}, Z=${Z}, N=… – a szerver által látott: M=${M}, Z=${Z}`}),
          Object.assign({},base,{s:3,line:2,msg:`Lépés 3/3: M=${M}, Z=${Z}, N=${N} – a szerver által látott: M=${M}, Z=${Z} (N = H(p)^k = ${h}^${kx} mod 23)`})];
}
function apply(newR){
  const h=+document.getElementById("hp").value, kk=+document.getElementById("kk").value;
  let r=+document.getElementById("rr").value;
  const err=document.getElementById("err");
  if(!SUB.includes(h)){err.textContent="H(p) a részcsoport eleme legyen: "+SUB.join(", ");return;}
  if(!(kk>=1&&kk<=10)||!(r>=1&&r<=10)){err.textContent="k és r egész, 1 és 10 között";return;}
  if(newR){ let r2=r; while(r2===r) r2=1+Math.floor(Math.random()*10); r=r2; document.getElementById("rr").value=r; }
  err.textContent="";
  setSteps(mk(h,kk,r)); show(2);
}
function render(s){
  svg.setAttribute("viewBox","0 0 720 300");
  svg.innerHTML="";
  el("text",{x:110,y:24,"text-anchor":"middle","font-size":16,"font-weight":"bold"},"Kliens");
  el("text",{x:610,y:24,"text-anchor":"middle","font-size":16,"font-weight":"bold"},"Szerver");
  el("rect",{x:10,y:40,width:200,height:96,fill:css("--cell"),stroke:css("--line"),"stroke-width":1});
  el("rect",{x:15,y:45,width:190,height:86,fill:"none",stroke:css("--line"),"stroke-width":1});
  el("text",{x:24,y:66,"font-size":13,"font-weight":"bold"},"csak kliens");
  el("text",{x:24,y:88,"font-size":14},"H(p) = "+s.h);
  el("text",{x:24,y:110,"font-size":14},"r = "+s.r+"   (r⁻¹ mod 11 = "+s.rinv+")");
  el("rect",{x:510,y:40,width:200,height:52,fill:css("--cell"),stroke:css("--line")});
  el("text",{x:524,y:72,"font-size":14},"k = "+s.k);
  const A=(y,dir,txt,on)=>{ const x0=dir>0?215:505, x1=dir>0?505:215;
    el("line",{x1:x0,y1:y,x2:x1-dir*10,y2:y,stroke:on?css("--hl"):css("--line"),"stroke-width":on?2.6:1.4});
    el("path",{d:`M${x1} ${y} l${-dir*12} -6 l0 12 z`,fill:on?css("--hl"):css("--line")});
    el("text",{x:360,y:y-8,"text-anchor":"middle","font-size":14,"font-weight":on?"bold":"normal"},txt); };
  A(80,1,`① M = ${s.h}^${s.r} mod 23 = ${s.M}`,s.s===1);
  if(s.s>=2) A(150,-1,`② Z = ${s.M}^${s.k} mod 23 = ${s.Z}`,s.s===2);
  el("rect",{x:510,y:110,width:200,height:70,fill:"none",stroke:css("--line"),"stroke-dasharray":"6 4"});
  el("text",{x:524,y:132,"font-size":13,"font-weight":"bold"},"szerver látja");
  el("text",{x:524,y:154,"font-size":14},"M = "+s.M+(s.s>=2?",  Z = "+s.Z:""));
  if(s.s>=3){
    el("rect",{x:10,y:200,width:470,height:70,fill:css("--cellhl"),stroke:css("--line"),"stroke-width":2});
    el("text",{x:24,y:226,"font-size":14,"font-weight":"bold"},`③ N = ${s.Z}^${s.rinv} mod 23 = ${s.N}`);
    el("text",{x:24,y:252,"font-size":14},`ellenőrzés: H(p)^k = ${s.h}^${s.k} mod 23 = ${pw(s.h,s.k,23)} ✓  (független r-től)`);
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
