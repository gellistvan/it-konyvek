<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shamir-megosztás véges test felett</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
input[type=number]{width:4.5em;font:inherit}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre.panel{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.panel span{display:block;padding:0 4px}
pre.panel span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="(A) panel">
  <b>(A)</b>
  <label>p = <input type="number" id="pA" min="5" max="31" value="17"></label>
  <label>s = <input type="number" id="sA" min="0" max="30" value="9"></label>
  <label>a₁ = <input type="number" id="a1A" min="0" max="30" value="7"></label>
  <label>a₂ = <input type="number" id="a2A" min="0" max="30" value="3"></label>
  <label>részvények: <span id="kv">3</span> <input type="range" id="k" min="1" max="5" value="3" style="width:110px" aria-label="kiválasztott részvények száma"></label>
  <button id="term" title="A Lagrange-összeg következő szorzata">Szorzat ▶</button>
</div>
<div class="ctl" role="group" aria-label="(B) panel">
  <b>(B)</b>
  <label>p = <input type="number" id="pB" min="5" max="31" value="13"></label>
  <label>s = <input type="number" id="sB" min="0" max="30" value="5"></label>
  <label>a₁ = <input type="number" id="a1B" min="0" max="30" value="4"></label>
  <label>s' = <span id="spv">5</span> <input type="range" id="sp" min="0" max="12" value="5" style="width:140px" aria-label="jelölt titok s'"></label>
  <button id="def">Alapértékek</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 470" role="img" aria-label="Shamir-megosztás két panelen: F17 felett a polinom pontjai és a részvények, F13 felett egy részvényhez illeszkedő összes egyenes"></svg>
<pre class="panel" id="der" aria-label="Lagrange-levezetés"></pre>

<p class="small">Számított értékek, nem mérés. (B): a szakaszok a (0, s') jelölt titkot kötik össze a megfigyelt részvénnyel; a kiemelt pontok az s' + a₁'x mod p „egyenes” pontjai.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",
  hlf:"--sc-hlf", hl2f:"--sc-hl2f", ok:"--sc-ok", err:"--sc-err", okf:"--sc-okf", errf:"--sc-errf"};
const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}

const DATA = {"A": {"p": 17, "co": [9, 7, 3], "shares": [[1, 2], [2, 1], [3, 6], [4, 0], [5, 0]], "lam": [3, 14, 1], "raw": 26, "s": 9}, "B": {"p": 13, "co": [5, 4], "y": 9}};

const $ = id => document.getElementById(id);
const md = (a, p) => ((a % p) + p) % p;
function inv(a, p){ a = md(a, p); for (let x = 1; x < p; x++) if (a * x % p === 1) return x; return null; }
function ev(co, x, p){ let s = 0, xp = 1; for (const c of co) { s += c * xp; xp *= x; } return md(s, p); }
function isPrime(n){ if (n < 2) return false; for (let d = 2; d * d <= n; d++) if (n % d === 0) return false; return true; }
function lagr(pts, p){
  const lam = pts.map(([xi], i) => { let num = 1, den = 1; pts.forEach(([xj], j) => { if (i !== j) { num = md(num * -xj, p); den = md(den * (xi - xj), p); } }); return md(num * inv(den, p), p); });
  const raw = lam.reduce((a, l, i) => a + l * pts[i][1], 0);
  return {lam, raw, s: md(raw, p)};
}
// önellenőrzés: a JS-számítás egyezik a Python-adattal
(function(){ const A = DATA.A, r = lagr(A.shares.slice(0, 3), A.p);
  if (r.lam.join() !== A.lam.join() || r.s !== A.s || ev(DATA.B.co, 1, DATA.B.p) !== DATA.B.y) document.title += " (HIBA)"; })();
let term = -1;
function panel(ox, p, W){ return {sx: x => ox + 40 + x * (W - 60) / (p - 1), sy: y => 430 - y * (W - 60) / (p - 1) * 0.92}; }
function axes(P, ox, p, W, ttl, lab){
  const {sx, sy} = panel(ox, p, W);
  for (let i = 0; i < p; i++) {
    P.push(["line", sx(i), sy(0), sx(i), sy(p - 1), {lw: 0.4, ls: "dot", color: "g3"}]);
    P.push(["line", sx(0), sy(i), sx(p - 1), sy(i), {lw: 0.4, ls: "dot", color: "g3"}]);
    if (i % 2 === 0) { P.push(["text", sx(i), sy(0) + 18, String(i), {size: 12, anchor: "middle", color: "muted"}]);
                       P.push(["text", sx(0) - 14, sy(i) + 4, String(i), {size: 12, anchor: "end", color: "muted"}]); }
  }
  P.push(["text", ox + 40, 24, ttl, {size: 15, weight: "bold"}]);
  P.push(["text", ox + 40, 44, lab, {size: 13, color: "muted"}]);
  return {sx, sy};
}
function draw(){
  const pA = +$("pA").value, pB = +$("pB").value, sA = +$("sA").value, sB = +$("sB").value;
  const coA = [sA, +$("a1A").value, +$("a2A").value].map(v => md(v, pA)), coB = [sB, +$("a1B").value].map(v => md(v, pB));
  const k = +$("k").value; $("kv").textContent = k;
  $("sp").max = pB - 1; if (+$("sp").value > pB - 1) $("sp").value = pB - 1;
  const sp = +$("sp").value; $("spv").textContent = sp;
  if (!isPrime(pA) || !isPrime(pB) || pA > 31 || pB > 31 || pA < 7 || pB < 3) { status.textContent = "p legyen prím, 7 ≤ p ≤ 31 (A) és p ≤ 31 (B)."; return; }
  svg.innerHTML = ""; scDefs();
  const P = [];
  // (A)
  const shares = [1, 2, 3, 4, 5].map(x => [x, ev(coA, x, pA)]);
  const sel = shares.slice(0, k);
  let A = axes(P, 0, pA, 450, `(A) F${pA}: f(x) = ${coA[0]} + ${coA[1]}x + ${coA[2]}x²`, `${k} részvény kiválasztva (t = 3)`);
  for (let x = 0; x < pA; x++) P.push(["circ", A.sx(x), A.sy(ev(coA, x, pA)), 5, {fill: "bg", stroke: "g3", lw: 1}]);
  shares.forEach(([x, y], i) => P.push(["rect", A.sx(x) - 6, A.sy(y) - 6, 12, 12, {fill: i < k ? "fg" : "bg", stroke: "fg", lw: 1.2}]));
  const der = [];
  let msgA;
  if (k >= 3) {
    const r = lagr(sel.slice(0, 3), pA);
    P.push(["text", A.sx(0) + 2, A.sy(r.s) + 6, "★", {size: 22, anchor: "middle"}]);
    der.push(`(A) részvények: ${sel.slice(0, 3).map(([x, y]) => `(${x},${y})`).join(", ")}  →  λ = (${r.lam.join(", ")})`);
    der.push(`    s = ` + sel.slice(0, 3).map(([x, y], i) => `${y}·${r.lam[i]}`).join(" + ") + ` = ${r.raw} ≡ ${r.s} (mod ${pA})`);
    sel.slice(0, 3).forEach(([x, y], i) => der.push(`    ${i + 1}. szorzat: y${i + 1}·λ${i + 1} = ${y}·${r.lam[i]} = ${y * r.lam[i]}`));
    msgA = `(A) ${k} részvény ≥ t = 3: a polinom egyértelmű, s = ${r.s}` + (r.s === coA[0] ? " (egyezik)." : " (HIBA)");
  } else {
    for (let s2 = 0; s2 < pA; s2++) P.push(["circ", A.sx(0), A.sy(s2), 6, {fill: "bg", stroke: "fg", lw: 1.2, ls: "dash"}]);
    der.push(`(A) ${k} részvény < t = 3: minden s' ∈ {0..${pA - 1}}-hez pontosan egy másodfokú polinom illeszkedik.`);
    msgA = `(A) ${k} részvény: mind a ${pA} jelölt titok lehetséges (szaggatott körök x = 0-nál).`;
  }
  // (B)
  const yB = ev(coB, 1, pB);
  let B = axes(P, 450, pB, 450, `(B) F${pB}: f(x) = ${coB[0]} + ${coB[1]}x, megfigyelt (1, ${yB})`, `minden s'-hez egy a₁' = ${yB} − s' (mod ${pB}) meredekség`);
  for (let s2 = 0; s2 < pB; s2++) {
    const on = s2 === sp;
    P.push(["line", B.sx(0), B.sy(s2), B.sx(1), B.sy(yB), {lw: on ? 3 : 0.8, ls: on ? "solid" : ["solid", "dash", "dot"][s2 % 3], color: on ? "hl" : "g3"}]);
    P.push(["circ", B.sx(0), B.sy(s2), 5, {fill: s2 === coB[0] ? "fg" : "bg", stroke: "fg", lw: 1}]);
  }
  const a1p = md(yB - sp, pB);
  for (let x = 0; x < pB; x++) P.push(["circ", B.sx(x), B.sy(md(sp + a1p * x, pB)), 4.5, {fill: "hl", stroke: "hl", lw: 1}]);
  P.push(["rect", B.sx(1) - 7, B.sy(yB) - 7, 14, 14, {fill: "fg", stroke: "fg"}]);
  scDraw(P);
  der.push(`(B) s' = ${sp} ⇒ a₁' = ${yB} − ${sp} ≡ ${a1p} (mod ${pB}); kiemelve az f'(x) = ${sp} + ${a1p}x pontjai` + (sp === coB[0] ? " (ez a valódi polinom)" : ""));
  $("der").innerHTML = der.map((l, i) => `<span class="${term >= 0 && i - 2 === term && k >= 3 ? "on" : ""}">${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("");
  status.textContent = msgA + ` (B) s' = ${sp} ⇒ a₁' = ${a1p}.`;
}
const status = $("status");
["pA", "sA", "a1A", "a2A", "pB", "sB", "a1B"].forEach(id => $(id).addEventListener("change", () => { term = -1; draw(); }));
$("k").addEventListener("input", () => { term = -1; draw(); });
$("sp").addEventListener("input", draw);
$("term").addEventListener("click", () => { term = (term + 1) % 3; draw(); });
$("def").addEventListener("click", () => { [["pA",17],["sA",9],["a1A",7],["a2A",3],["k",3],["pB",13],["sB",5],["a1B",4],["sp",5]].forEach(([i, v]) => $(i).value = v); term = -1; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
