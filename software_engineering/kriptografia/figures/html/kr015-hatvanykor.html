<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 2 hatványai modulo 11</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>p = <input id="ip" type="number" value="11" style="width:4.5em" aria-label="p"></label><label>g = <input id="ig" type="number" value="2" style="width:4.5em" aria-label="g"></label><label>DLP keresése, h = <input id="ih" type="number" value="7" style="width:4.5em" aria-label="h"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('ig').value=4;load()">g = 4</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tíz csúcs körben: 1, 2, 4, 8, 5, 10, 9, 7, 3, 6; a páros kitevőjű csúcsok (kvadratikus maradékok) szürkék, a 7 vastag kerettel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 4.4.4 példája: p = 11, g = 2, h = 7. A kvadratikus maradékot az Euler-kritérium dönti el; primitív gyök esetén ezek pontosan a páros kitevőjű csúcsok.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "p = 11, g = 2: a hatványozás 1-ről indul (x = 0)", "k": 1, "line": 0}, {"msg": "x = 1: 2^1 mod 11 = 1·2 mod 11 = 2", "k": 2, "line": 3}, {"msg": "x = 2: 2^2 mod 11 = 2·2 mod 11 = 4", "k": 3, "line": 3}, {"msg": "x = 3: 2^3 mod 11 = 4·2 mod 11 = 8", "k": 4, "line": 3}, {"msg": "x = 4: 2^4 mod 11 = 8·2 mod 11 = 5", "k": 5, "line": 3}, {"msg": "x = 5: 2^5 mod 11 = 5·2 mod 11 = 10", "k": 6, "line": 3}, {"msg": "x = 6: 2^6 mod 11 = 10·2 mod 11 = 9", "k": 7, "line": 3}, {"msg": "x = 7: 2^7 mod 11 = 9·2 mod 11 = 7  → ez a keresett h = 7: x = 7", "k": 8, "line": 2}, {"msg": "x = 8: 2^8 mod 11 = 7·2 mod 11 = 3", "k": 9, "line": 3}, {"msg": "x = 9: 2^9 mod 11 = 3·2 mod 11 = 6", "k": 10, "line": 3}, {"msg": "x = 7: 2^7 ≡ 7 (mod 11), rend: 10, primitív gyök: igen", "k": 10, "line": 5, "done": 1}];
const CODE = ["x ← 0; y ← 1                 # y = g^x mod p", "ismételd:", "    ha y = h: a DLP megoldása x", "    y ← y·g mod p;  x ← x + 1", "amíg y ≠ 1                   # ekkor x = ord(g)", "primitív gyök ⇔ ord(g) = p − 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let P0 = 11, G0 = 2, H0 = 7;
function cyc(g, p){ const o = []; let x = 1; do { o.push(x); x = x * g % p; } while (x !== 1); return o; }
function pw(b, e, m){ let r = 1; b %= m; while (e > 0) { if (e & 1) r = r * b % m; b = b * b % m; e >>= 1; } return r; }
function isPrime(n){ if (n < 3) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 352"); svg.innerHTML = "";
  const C = cyc(G0, P0), n = C.length, cx = 280, cy = 165, R = n > 24 ? 140 : 125, rr = n > 24 ? 10 : (n > 14 ? 14 : 18);
  const pt = j => [cx + R * Math.cos(Math.PI / 2 - 2 * Math.PI * j / n), cy - R * Math.sin(Math.PI / 2 - 2 * Math.PI * j / n)];
  const d = el("defs", {}); d.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="' + css("--line") + '"/></marker>';
  for (let j = 0; j < Math.min(s.k, n) - (s.done ? 0 : 1); j++) {
    const [x1, y1] = pt(j), [x2, y2] = pt((j + 1) % n), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    el("line", {x1: x1 + ux * (rr + 2), y1: y1 + uy * (rr + 2), x2: x2 - ux * (rr + 3), y2: y2 - uy * (rr + 3), stroke: css("--line"), "stroke-width": 1.3, "marker-end": "url(#ah)"});
  }
  for (let j = 0; j < n; j++) {
    const [x, y] = pt(j), v = C[j], on = j < s.k, qr = pw(v, (P0 - 1) / 2, P0) === 1, hit = v === H0 && on;
    el("circle", {cx: x, cy: y, r: rr, fill: on ? (qr ? "#b0b0b0" : css("--cell")) : css("--cell"), stroke: css("--line"), "stroke-width": hit ? 4 : 1.3, opacity: on ? 1 : 0.25, "stroke-dasharray": on ? "" : "3 3"});
    if (on) el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": rr > 12 ? 14 : 10, "font-weight": qr ? "bold" : "normal", fill: qr ? "#000" : css("--fg")}, String(v));
    if (on && n <= 24) el("text", {x: cx + (R + 34) * Math.cos(Math.PI / 2 - 2 * Math.PI * j / n), y: cy - (R + 34) * Math.sin(Math.PI / 2 - 2 * Math.PI * j / n) + 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "x=" + j);
  }
  el("text", {x: cx, y: cy - 4, "text-anchor": "middle", "font-size": 16}, "·" + G0);
  el("text", {x: cx, y: cy + 16, "text-anchor": "middle", "font-size": 12}, s.done ? "rend: " + n : "");
  el("text", {x: 8, y: 346, "font-size": 11, fill: css("--muted")}, "szürke = kvadratikus maradék · üres = nem-maradék · vastag = h");
}
function trace(p, g, h){
  const C = cyc(g, p), n = C.length, st = [{msg: `p = ${p}, g = ${g}: a hatványozás 1-ről indul (x = 0)`, k: 1, line: 0}];
  for (let k = 1; k < n; k++) { let m = `x = ${k}: ${g}^${k} mod ${p} = ${C[k - 1]}·${g} mod ${p} = ${C[k]}`; if (C[k] === h) m += `  → ez a keresett h = ${h}: x = ${k}`; st.push({msg: m, k: k + 1, line: C[k] === h ? 2 : 3}); }
  const x = C.indexOf(h), tail = x >= 0 ? `x = ${x}: ${g}^${x} ≡ ${h} (mod ${p})` : `h = ${h} nincs a ⟨${g}⟩ részcsoportban`;
  st.push({msg: `${tail}, rend: ${n}, primitív gyök: ${n === p - 1 ? "igen" : "nem"}`, k: n, line: 5, done: 1});
  return st;
}
function load(){
  const p = +document.getElementById("ip").value, g = +document.getElementById("ig").value, h = +document.getElementById("ih").value, e = document.getElementById("err");
  if (!Number.isInteger(p) || !isPrime(p) || p > 61) { e.textContent = "p legyen páratlan prím, legfeljebb 61."; return; }
  if (!Number.isInteger(g) || g < 2 || g >= p) { e.textContent = "2 ≤ g < p legyen."; return; }
  if (!Number.isInteger(h) || h < 1 || h >= p) { e.textContent = "1 ≤ h < p legyen."; return; }
  e.textContent = ""; P0 = p; G0 = g; H0 = h; setSteps(trace(p, g, h));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
