<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pollard-rho Floyd-ciklusdetektálással</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N: <input id="rn" type="number" value="91" style="width:7em" aria-label="N"></label><label>c: <input id="rc" type="number" value="1" style="width:4em" aria-label="c együttható"></label><button onclick="loadR()">Betöltés</button><span id="rerr" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Pollard-rho N = 91-re: a sorozat 1, 2, 5, 26, 40, 54, 5; mod 7 már x_2-től 5, ezért a második Floyd-lépésben gcd(35, 91) = 7."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 22.1.6 pollard_rho függvénye, x₀ = 1. A helyes sorozat: x₄ = 26² + 1 mod 91 = 40. Oktatási célra – NEM ÉLES HASZNÁLATRA.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 91, "seq": [1, 2, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26], "i": 0, "x": 1, "y": 1, "d": null, "line": 3, "msg": "Kezdés: x = y = x₀ = 1, f(x) = x² + 1 mod 91"}, {"n": 91, "seq": [1, 2, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26], "i": 1, "x": 2, "y": 5, "d": 1, "line": 7, "msg": "1. Floyd-lépés: x = x_1 = 2, y = x_2 = 5, gcd(|2 − 5|, 91) = gcd(3, 91) = 1 → még nincs osztó"}, {"n": 91, "seq": [1, 2, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26, 40, 54, 5, 26], "i": 2, "x": 5, "y": 40, "d": 7, "line": 11, "msg": "2. Floyd-lépés: x = x_2 = 5, y = x_4 = 40, gcd(|5 − 40|, 91) = gcd(35, 91) = 7 → valódi osztó: 7, 91 = 7 · 13"}];
const CODE = ["def pollard_rho(n, c=1, x0=1, max_iter=10000):", "    def f(x):", "        return (x * x + c) % n", "    x = y = x0", "    for _ in range(max_iter):", "        x = f(x)            # teknős: egy lépés", "        y = f(f(y))         # nyúl: két lépés", "        d = math.gcd(abs(x - y), n)", "        if d == n:", "            return None", "        if d > 1:", "            return d", "    return None"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(a, n){ return ((a % n) + n) % n; }
function gcdi(a, b){ a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function invm(a, n){ let t = 0, nt = 1, r = n, nr = md(a, n); while (nr) { const q = Math.floor(r / nr); [t, nt] = [nt, t - q * nt]; [r, nr] = [nr, r - q * nr]; } return r === 1 ? md(t, n) : null; }
function powm(b, e, n){ let r = 1; b = md(b, n); while (e > 0) { if (e & 1) r = (r * b) % n; b = (b * b) % n; e >>= 1; } return r; }
function hu(n){ const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "−" : "") + s; }

function render(s){
  svg.setAttribute("viewBox", "0 0 560 250");
  svg.innerHTML = "";
  const seq = s.seq.slice(0, 11), w = 40, x0 = 20;
  el("text", {x: x0, y: 22, "font-size": 12, fill: css("--muted")}, "i:");
  el("text", {x: x0, y: 60, "font-size": 12}, "x_i mod " + s.n);
  seq.forEach((v, i) => {
    const X = 110 + i * w, slow = (i === s.i), fast = (i === 2 * s.i);
    el("text", {x: X + w/2, y: 22, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    el("rect", {x: X, y: 32, width: w - 2, height: 40, fill: (slow || fast) && s.i > 0 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": (slow || fast) && s.i > 0 ? 3 : 1});
    el("text", {x: X + w/2 - 1, y: 57, "text-anchor": "middle", "font-size": 13}, String(v));
    if (slow) el("text", {x: X + w/2, y: 92, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "▲x");
    if (fast) el("text", {x: X + w/2, y: slow ? 114 : 92, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "▲y");
  });
  el("text", {x: 20, y: 150, "font-size": 13}, "teknős x = x_" + s.i + " = " + s.x + ",   nyúl y = x_" + (2 * s.i) + " = " + s.y);
  const p = s.d && s.d > 1 && s.d < s.n ? s.d : null;
  if (p) {
    el("text", {x: 20, y: 176, "font-size": 13}, "mod " + p + ": x ≡ " + md(s.x, p) + ", y ≡ " + md(s.y, p) + " → ütközés mod p, de mod " + s.n + " nem (" + s.x + " ≠ " + s.y + ")");
    const q = s.n / p;
    el("text", {x: 20, y: 194, "font-size": 12, fill: css("--muted")}, "mod " + q + ": x ≡ " + md(s.x, q) + ", y ≡ " + md(s.y, q) + (md(s.x, q) === md(s.y, q) ? " → itt is ütközés" : " → itt nincs ütközés"));
  }
  if (s.d !== null) el("text", {x: 20, y: 222, "font-size": 15, "font-weight": "bold"}, "gcd(|x − y|, N) = gcd(" + Math.abs(s.x - s.y) + ", " + s.n + ") = " + s.d);
  el("text", {x: 20, y: 240, "font-size": 11, fill: css("--muted")}, "▲x = teknős (lassú, x_i), ▲y = nyúl (gyors, x_2i); a sorozat első 11 eleme látszik");
}
function rsteps(n, c, x0){
  const f = v => (v * v + c) % n, seq = [x0];
  for (let i = 0; i < 40; i++) seq.push(f(seq[seq.length - 1]));
  const st = [{n, seq: seq.slice(0, 16), i: 0, x: x0, y: x0, d: null, line: 3, msg: "Kezdés: x = y = x₀ = " + x0 + ", f(x) = x² + " + c + " mod " + n}];
  let x = x0, y = x0;
  for (let i = 1; i <= 60; i++) {
    x = f(x); y = f(f(y)); const d = gcdi(x - y, n);
    const res = (d > 1 && d < n) ? ("→ valódi osztó: " + d + ", " + n + " = " + d + " · " + (n / d)) : (d === n ? "→ d = N: kudarc, más c kell" : "→ még nincs osztó");
    st.push({n, seq: seq.slice(0, 16), i, x, y, d, line: (d > 1 && d < n) ? 11 : (d === n ? 9 : 7),
             msg: i + ". Floyd-lépés: x = x_" + i + " = " + x + ", y = x_" + (2 * i) + " = " + y + ", gcd(|" + x + " − " + y + "|, " + n + ") = gcd(" + Math.abs(x - y) + ", " + n + ") = " + d + " " + res});
    if (d > 1) break;
  }
  return st;
}
function loadR(){
  const n = Number(document.getElementById("rn").value), c = Number(document.getElementById("rc").value), err = document.getElementById("rerr");
  if (!Number.isInteger(n) || n < 6 || n > 1e7 || !Number.isInteger(c) || c < 1 || c > 50) { err.textContent = "6 ≤ N ≤ 10⁷ és 1 ≤ c ≤ 50 egész kell."; return; }
  err.textContent = ""; setSteps(rsteps(n, c, 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
