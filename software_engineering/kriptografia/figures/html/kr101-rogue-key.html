<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue-key támadás és PoP</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>sk_A: <input id="ain" type="range" min="1" max="10" value="3" style="width:6em"><span id="av">3</span></label><label>sk_M: <input id="min" type="range" min="1" max="10" value="9" style="width:6em"><span id="mv">9</span></label><label>becsületes résztvevők: <input id="hin" type="range" min="1" max="3" value="1" style="width:4em"><span id="hv">1</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kör a Z_11 elemeivel: Alice +3, Mallory bejelentett +6, az összeg 9 = Mallory valódi kulcsa; a PoP-kapu elutasítja a bejelentett kulcsot."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">q = 11, a 26.2.9 adatai; a kulcsokat a P₂ szorzóiként (kitevőként) követjük. További becsületes résztvevők: Bob sk = 7, Carol sk = 5 (a 4. feladat általánosítása). Számított, kis játékpélda.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "line": 0, "msg": "1. Becsületes kulcs(ok): pk_A = [3]P₂", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}, {"ph": 2, "line": 1, "msg": "2. Mallory valódi kulcsa: sk_M = 9, pk_M = [9]P₂", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}, {"ph": 3, "line": 2, "msg": "3. Bejelentett kulcs: pk_M' = [6]P₂ = pk_M − ([3]P₂) = [9 − 3]P₂", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}, {"ph": 4, "line": 3, "msg": "4. Összegzés: pk_agg = [3]P₂ + [6]P₂ = [9]P₂ = pk_M", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}, {"ph": 5, "line": 4, "msg": "5. PoP nélkül: Mallory egyedül aláír sk_M = 9-cel, σ = [9]H(m); e(σ, P₂) = e(H(m), pk_agg) teljesül → hamis „közös” aláírás elfogadva.", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}, {"ph": 6, "line": 5, "msg": "6. PoP-ellenőrzés: a [6]P₂ kulcshoz π' = [6]H(pk_M') kellene; a 6 = 9 − 3 csak a becsületes titkok ismeretében számolható → PoP hiányzik → kulcs elutasítva.", "honest": [3], "names": ["Alice"], "skm": 9, "ann": 6, "agg": 9, "hsum": 3}];
const CODE = ["pk_becs = sum(pk_i)                     # a becsületes kulcsok összege", "pk_M = sk_M * P2                        # Mallory valódi kulcsa", "pk_M_ = pk_M - pk_becs                  # bejelentett (rogue) kulcs", "pk_agg = pk_becs + pk_M_                # == pk_M", "sigma = sk_M * H(m)                     # Mallory egyedül aláír → PoP nélkül elfogadva", "pop_ok = verify_pop(pk_M_, pi_)         # π' a log(pk_M_)-hez kellene → False"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EXH = [7, 5], NM = ["Alice", "Bob", "Carol"];
function traceJS(ska, skm, nh){
  const honest = [ska].concat(EXH.slice(0, nh - 1)), names = NM.slice(0, nh);
  const hsum = honest.reduce((x, y) => x + y, 0) % 11, ann = ((skm - hsum) % 11 + 11) % 11, agg = (hsum + ann) % 11;
  const hs = honest.map(h => "[" + h + "]P₂").join(" + ");
  const st = [
    {ph: 1, line: 0, msg: "1. Becsületes kulcs(ok): " + names.map((n, i) => "pk_" + n[0] + " = [" + honest[i] + "]P₂").join(", ") + (nh > 1 ? " (összeg [" + hsum + "]P₂)" : "")},
    {ph: 2, line: 1, msg: "2. Mallory valódi kulcsa: sk_M = " + skm + ", pk_M = [" + skm + "]P₂"},
    {ph: 3, line: 2, msg: "3. Bejelentett kulcs: pk_M' = [" + ann + "]P₂ = pk_M − (" + hs + ") = [" + skm + " − " + hsum + "]P₂" + (ann === 0 ? " (= O, a semleges elem)" : "")},
    {ph: 4, line: 3, msg: "4. Összegzés: pk_agg = " + hs + " + [" + ann + "]P₂ = [" + agg + "]P₂ = pk_M"},
    {ph: 5, line: 4, msg: "5. PoP nélkül: Mallory egyedül aláír sk_M = " + skm + "-cel, σ = [" + skm + "]H(m); e(σ, P₂) = e(H(m), pk_agg) teljesül → hamis „közös” aláírás elfogadva."},
    {ph: 6, line: 5, msg: "6. PoP-ellenőrzés: a [" + ann + "]P₂ kulcshoz π' = [" + ann + "]H(pk_M') kellene; a " + ann + " = " + skm + " − " + hsum + " csak a becsületes titkok ismeretében számolható → PoP hiányzik → kulcs elutasítva."}];
  st.forEach(x => { x.honest = honest; x.names = names; x.skm = skm; x.ann = ann; x.agg = agg; x.hsum = hsum; });
  return st;
}
["a", "m", "h"].forEach(n => document.getElementById(n + "in").addEventListener("input", () => {
  document.getElementById(n + "v").textContent = document.getElementById(n + "in").value;
  const g = id => parseInt(document.getElementById(id + "in").value, 10);
  setSteps(traceJS(g("a"), g("m"), g("h")));
}));
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const cx = 170, cy = 170, R = 115;
  const pt = (i, r) => { const ang = Math.PI / 2 - 2 * Math.PI * i / 11; return [cx + r * Math.cos(ang), cy - r * Math.sin(ang)]; };
  el("circle", {cx: cx, cy: cy, r: R, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 4"});
  function hop(i, j, dash, col, lab){
    const [x1, y1] = pt(i, R), [x2, y2] = pt(j, R), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const qx = cx + (mx - cx) * 0.45, qy = cy + (my - cy) * 0.45;
    el("path", {d: `M${x1},${y1} Q${qx},${qy} ${x2},${y2}`, fill: "none", stroke: col, "stroke-width": 2.5, "stroke-dasharray": dash});
    el("circle", {cx: x2, cy: y2, r: 5, fill: col});
    if (lab) el("text", {x: cx + (mx - cx) * 0.62, y: cy + (my - cy) * 0.62 + 4, "text-anchor": "middle", "font-size": 12, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 5}, lab);
  }
  let cur = 0;
  if (s.ph >= 1) s.honest.forEach((h, i) => { const nx = (cur + h) % 11; hop(cur, nx, "none", css("--fg"), s.honest.length === 1 ? s.names[i] + " +" + h : ""); cur = nx; });
  if (s.ph >= 3) hop(cur, (cur + s.ann) % 11, "7 4", s.ph === 3 ? css("--hl2") : css("--fg"), s.honest.length === 1 ? "bejelentett +" + s.ann : "");
  if (s.honest.length > 1) el("text", {x: 6, y: 16, "font-size": 12}, "folytonos: " + s.names.map((n, i) => n + " +" + s.honest[i]).join(", ") + (s.ph >= 3 ? "; szaggatott: bejelentett +" + s.ann : ""));
  for (let i = 0; i < 11; i++){
    const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 22);
    if (i === s.skm && s.ph >= 2) el("circle", {cx: x, cy: y, r: 15, fill: "none", stroke: css("--fg"), "stroke-width": 2});
    el("circle", {cx: x, cy: y, r: 10, fill: (i === s.hsum && s.ph >= 1) || (i === s.skm && s.ph >= 2) ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    el("text", {x: lx, y: ly + 4, "text-anchor": "middle", "font-size": 12}, String(i));
  }
  el("text", {x: cx, y: 318, "text-anchor": "middle", "font-size": 12}, "dupla kör: Mallory valódi kulcsa (" + s.skm + ")");
  const bx = 360;
  const rows = [["Becsületes összeg", "[" + s.hsum + "]P₂", 1], ["Mallory valódi kulcsa", "[" + s.skm + "]P₂", 2],
                ["Bejelentett pk_M'", "[" + s.ann + "]P₂", 3], ["pk_agg", "[" + s.agg + "]P₂ = pk_M", 4]];
  rows.forEach(([a1, b1, p1], j) => {
    const on = s.ph === p1, vis = s.ph >= p1;
    el("rect", {x: bx, y: 14 + j * 40, width: 390, height: 32, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": vis ? "none" : "3 3"});
    el("text", {x: bx + 10, y: 35 + j * 40, "font-size": 13}, a1 + ": " + (vis ? b1 : "…"));
  });
  const g1 = s.ph >= 5, g2 = s.ph >= 6;
  el("rect", {x: bx, y: 190, width: 390, height: 52, fill: s.ph === 5 ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": s.ph === 5 ? 2.5 : 1, "stroke-dasharray": "7 4"});
  el("text", {x: bx + 10, y: 211, "font-size": 13}, "PoP nélkül: Mallory egyedül aláír");
  el("text", {x: bx + 10, y: 231, "font-size": 13, "font-weight": "bold"}, g1 ? "→ ELFOGADVA (hamis közös aláírás)" : "…");
  el("rect", {x: bx, y: 252, width: 390, height: 52, fill: s.ph === 6 ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": s.ph === 6 ? 3.5 : 1.5});
  el("text", {x: bx + 10, y: 273, "font-size": 13}, "PoP-kapu: π' a [" + s.ann + "]P₂-höz kellene");
  el("text", {x: bx + 10, y: 293, "font-size": 13, "font-weight": "bold"}, g2 ? "→ PoP hiányzik → ELUTASÍTVA" : "…");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
