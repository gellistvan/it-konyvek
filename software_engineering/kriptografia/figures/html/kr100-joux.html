<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joux háromszereplős kulcscsere játékcsoportban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a: <input id="ain" type="range" min="1" max="4" value="2" style="width:6em"><span id="av">2</span></label><label>b: <input id="bin" type="range" min="1" max="4" value="3" style="width:6em"><span id="bv">3</span></label><label>c: <input id="cin" type="range" min="1" max="4" value="4" style="width:6em"><span id="cv">4</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három oszlop: Alice, Bob és Carol a kapott két nyilvános értékből párosítással és saját titkával hatványozva ugyanahhoz a 3 értékhez jut."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játékmodell: q = 5, G_T = ⟨4⟩ ⊆ F₁₁*, e([x]P, [y]P) = 4^(xy mod 5) mod 11 – számított, játékparaméter, nem valódi párosítás. A csúszkák azonnal újraszámolják a lépéssort.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": -1, "who": -1, "msg": "Titkok: a = 2, b = 3, c = 4. Nyilvános: [a]P = [2]P, [b]P = [3]P, [c]P = [4]P (q = 5).", "line": -1, "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 0, "who": 0, "line": 0, "msg": "Alice megkapja [b]P = [3]P és [c]P = [4]P értéket; saját titka a = 2.", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 1, "who": 0, "line": 1, "msg": "Alice: e([3]P, [4]P) = 4^(3·4 mod 5) = 4^2 = 5 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 2, "who": 0, "line": 2, "msg": "Alice: 5^2 mod 11 = 3; abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 0, "who": 1, "line": 0, "msg": "Bob megkapja [c]P = [4]P és [a]P = [2]P értéket; saját titka b = 3.", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 1, "who": 1, "line": 1, "msg": "Bob: e([4]P, [2]P) = 4^(4·2 mod 5) = 4^3 = 9 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 2, "who": 1, "line": 2, "msg": "Bob: 9^3 mod 11 = 3; abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 0, "who": 2, "line": 0, "msg": "Carol megkapja [a]P = [2]P és [b]P = [3]P értéket; saját titka c = 4.", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 1, "who": 2, "line": 1, "msg": "Carol: e([2]P, [3]P) = 4^(2·3 mod 5) = 4^1 = 4 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}, {"ph": 2, "who": 2, "line": 2, "msg": "Carol: 4^4 mod 11 = 3; abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)", "pt": [{"name": "Alice", "sec": 2, "u": 3, "v": 4, "nu": "b", "nv": "c", "pexp": 2, "pv": 5, "res": 3}, {"name": "Bob", "sec": 3, "u": 4, "v": 2, "nu": "c", "nv": "a", "pexp": 3, "pv": 9, "res": 3}, {"name": "Carol", "sec": 4, "u": 2, "v": 3, "nu": "a", "nv": "b", "pexp": 1, "pv": 4, "res": 3}], "a": 2, "b": 3, "c": 4, "tail": "abc = 24 ≡ 4 (mod 5), 4^4 ≡ 3 (mod 11)"}];
const CODE = ["kapott = (u, v)                      # a másik két fél nyilvános [u]P, [v]P értéke", "g = e(u, v) = 4 ** (u * v % 5) % 11   # párosítás a játékcsoportban", "K = g ** titok % 11                   # = 4^(abc mod 5) mindhárom félnél"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SECN = ["a", "b", "c"], NAMES = ["Alice", "Bob", "Carol"];
function pw(b0, e0, m){ let r = 1; for (let i = 0; i < e0; i++) r = (r * b0) % m; return r; }
function traceJS(a, b, c){
  const sec = [a, b, c], pairs = [[b, c, "b", "c"], [c, a, "c", "a"], [a, b, "a", "b"]];
  const pt = pairs.map(([u, v, nu, nv], i) => { const pexp = (u * v) % 5, pv = pw(4, pexp, 11); return {name: NAMES[i], sec: sec[i], u: u, v: v, nu: nu, nv: nv, pexp: pexp, pv: pv, res: pw(pv, sec[i], 11)}; });
  const abc = a * b * c, tail = "abc = " + abc + " ≡ " + (abc % 5) + " (mod 5), 4^" + (abc % 5) + " ≡ " + pw(4, abc % 5, 11) + " (mod 11)";
  const st = [{ph: -1, who: -1, line: -1, msg: "Titkok: a = " + a + ", b = " + b + ", c = " + c + ". Nyilvános: [a]P = [" + a + "]P, [b]P = [" + b + "]P, [c]P = [" + c + "]P (q = 5)."}];
  pt.forEach((x, i) => {
    st.push({ph: 0, who: i, line: 0, msg: x.name + " megkapja [" + x.nu + "]P = [" + x.u + "]P és [" + x.nv + "]P = [" + x.v + "]P értéket; saját titka " + SECN[i] + " = " + x.sec + "."});
    st.push({ph: 1, who: i, line: 1, msg: x.name + ": e([" + x.u + "]P, [" + x.v + "]P) = 4^(" + x.u + "·" + x.v + " mod 5) = 4^" + x.pexp + " = " + x.pv + " (mod 11)"});
    st.push({ph: 2, who: i, line: 2, msg: x.name + ": " + x.pv + "^" + x.sec + " mod 11 = " + x.res + "; " + tail});
  });
  st.forEach(x => { x.pt = pt; x.a = a; x.b = b; x.c = c; x.tail = tail; });
  return st;
}
["a", "b", "c"].forEach(n => document.getElementById(n + "in").addEventListener("input", () => {
  document.getElementById(n + "v").textContent = document.getElementById(n + "in").value;
  const g = id => parseInt(document.getElementById(id + "in").value, 10);
  setSteps(traceJS(g("a"), g("b"), g("c")));
}));
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const dash = ["none", "8 4", "2 4"];
  s.pt.forEach((x, i) => {
    const x0 = 10 + i * 250, w = 230;
    const seen = s.who > i || (s.who === i), lvl = s.who > i ? 2 : (s.who === i ? s.ph : -1);
    el("rect", {x: x0, y: 10, width: w, height: 36, rx: 6, fill: s.who === i ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": dash[i]});
    el("text", {x: x0 + w / 2, y: 33, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, x.name + " (titok " + SECN[i] + " = " + x.sec + ")");
    const rows = ["kapja: [" + x.nu + "]P = [" + x.u + "]P, [" + x.nv + "]P = [" + x.v + "]P",
                  "e([" + x.u + "]P, [" + x.v + "]P) = 4^" + x.pexp + " = " + x.pv,
                  x.pv + "^" + x.sec + " mod 11 = " + x.res];
    rows.forEach((t, j) => {
      const vis = lvl >= j, on = s.who === i && s.ph === j;
      el("rect", {x: x0, y: 60 + j * 62, width: w, height: 46, rx: 6, fill: on ? css("--cellhl") : "none", stroke: css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": vis ? dash[i] : "3 3", opacity: vis ? 1 : 0.5});
      el("text", {x: x0 + w / 2, y: 88 + j * 62, "text-anchor": "middle", "font-size": 13, fill: vis ? css("--fg") : css("--muted")}, vis ? t : "…");
    });
    if (lvl >= 2) el("line", {x1: x0 + w / 2, y1: 230, x2: 380, y2: 262, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": dash[i]});
  });
  const all = s.who === 2 && s.ph === 2;
  el("rect", {x: 250, y: 262, width: 260, height: 40, rx: 8, fill: all ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": all ? 3 : 1.5});
  const K = s.pt[0].res;
  el("text", {x: 380, y: 288, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "közös: e(P,P)^abc = " + (all ? K : "?"));
  el("text", {x: 380, y: 322, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, s.tail);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
