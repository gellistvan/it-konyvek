<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift-and-add szorzás GF(2^8)-ban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = 0x<input id="ia" value="57" size="3" aria-label="a hexában"></label><label>b = 0x<input id="ib" value="83" size="3" aria-label="b hexában"></label><button onclick="load()">Betöltés</button><button onclick="load('53', 'CA')">0x53 · 0xCA</button><button onclick="load('57', '83')">0x57 · 0x83</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A b = 0x83 bitjei jobbról balra; az x^i·a regiszter xtime-mal lép, i = 2 és 4 után XOR 0x1B redukció; res = 0x57, 0xF9, végül 0xC1."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet xtime/gf_mul kódja (5.3.6), 8 bitlépés + kezdőállapot. Kezdőállapot: 0x57 · 0x83 (FIPS 197 példája).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a = 0x57, b = 0x83, res = 0x00", "i": -1, "xa": 87, "res": 0, "bi": 0, "ovf": false, "a": 87, "b": 131, "line": 7}, {"msg": "i = 0, b_0 = 1, x^0·a = 0x57, res = 0x00 ⊕ 0x57 = 0x57", "i": 0, "xa": 87, "res": 87, "old": 0, "bi": 1, "ovf": false, "a": 87, "b": 131, "line": 10}, {"msg": "i = 1, b_1 = 1, x^1·a = 0xAE, res = 0x57 ⊕ 0xAE = 0xF9", "i": 1, "xa": 174, "res": 249, "old": 87, "bi": 1, "ovf": false, "a": 87, "b": 131, "line": 10}, {"msg": "i = 2, b_2 = 0, x^2·a = 0x47 (túlcsordulás: XOR 0x1B), nem adjuk hozzá, res = 0xF9", "i": 2, "xa": 71, "res": 249, "old": 249, "bi": 0, "ovf": true, "a": 87, "b": 131, "line": 3}, {"msg": "i = 3, b_3 = 0, x^3·a = 0x8E, nem adjuk hozzá, res = 0xF9", "i": 3, "xa": 142, "res": 249, "old": 249, "bi": 0, "ovf": false, "a": 87, "b": 131, "line": 9}, {"msg": "i = 4, b_4 = 0, x^4·a = 0x07 (túlcsordulás: XOR 0x1B), nem adjuk hozzá, res = 0xF9", "i": 4, "xa": 7, "res": 249, "old": 249, "bi": 0, "ovf": true, "a": 87, "b": 131, "line": 3}, {"msg": "i = 5, b_5 = 0, x^5·a = 0x0E, nem adjuk hozzá, res = 0xF9", "i": 5, "xa": 14, "res": 249, "old": 249, "bi": 0, "ovf": false, "a": 87, "b": 131, "line": 9}, {"msg": "i = 6, b_6 = 0, x^6·a = 0x1C, nem adjuk hozzá, res = 0xF9", "i": 6, "xa": 28, "res": 249, "old": 249, "bi": 0, "ovf": false, "a": 87, "b": 131, "line": 9}, {"msg": "i = 7, b_7 = 1, x^7·a = 0x38, res = 0xF9 ⊕ 0x38 = 0xC1", "i": 7, "xa": 56, "res": 193, "old": 249, "bi": 1, "ovf": false, "a": 87, "b": 131, "line": 10}];
const CODE = ["def xtime(a):", "    a <<= 1", "    if a & 0x100:", "        a ^= 0x11B", "    return a & 0xFF", "", "def gf_mul(a, b):", "    res = 0", "    while b:", "        if b & 1:", "            res ^= a", "        a = xtime(a)", "        b >>= 1", "    return res"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hx(x){ return "0x" + x.toString(16).toUpperCase().padStart(2, "0"); }
function xt(a){ a <<= 1; if (a & 0x100) a ^= 0x11B; return a & 0xFF; }
function bits(x0, y, v, label, hl, w){
  el("text", {x: x0 - 44, y: y + 22, "text-anchor": "end", "font-size": 14}, label);
  for (let k = 0; k < 8; k++) {
    const bit = (v >> (7 - k)) & 1, on = hl === 7 - k;
    el("rect", {x: x0 + k * 34, y, width: 30, height: 30, fill: bit ? css("--fg") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 4 : 1.2});
    el("text", {x: x0 + k * 34 + 15, y: y + 46, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "b" + (7 - k));
  }
  el("text", {x: x0 + 8 * 34 + 10, y: y + 21, "font-size": 15, "font-family": "monospace"}, hx(v));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = "";
  const x0 = 120;
  bits(x0, 10, s.b, "b", s.i >= 0 ? s.i : -1);
  el("text", {x: x0 + 8 * 34 + 70, y: 31, "font-size": 12, fill: css("--muted")}, s.i >= 0 ? "b_" + s.i + " = " + s.bi : "");
  if (s.ovf) {
    el("rect", {x: x0 - 34, y: 78, width: 30, height: 30, fill: css("--cellhl"), stroke: css("--line"), "stroke-dasharray": "4 3", "stroke-width": 1.5});
    el("text", {x: x0 - 19, y: 98, "text-anchor": "middle", "font-size": 13}, "1");
    el("text", {x: x0 + 8 * 34 + 70, y: 99, "font-size": 12, fill: css("--hl2")}, "XOR 0x1B");
  }
  bits(x0, 78, s.xa, s.i >= 0 ? "x^" + s.i + "·a" : "a", -1);
  const add = s.bi === 1 && s.i >= 0;
  if (add) el("rect", {x: x0 - 4, y: 74, width: 8 * 34 + 6, height: 38, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  bits(x0, 150, s.res, "res", -1);
  el("text", {x: x0 + 8 * 34 + 70, y: 171, "font-size": 12, fill: css("--muted")}, add ? "res ⊕= x^" + s.i + "·a" : (s.i >= 0 ? "nincs XOR" : ""));
  el("text", {x: 280, y: 236, "text-anchor": "middle", "font-size": 14}, `a = ${hx(s.a)}, b = ${hx(s.b)}` + (s.i === 7 ? `  →  ${hx(s.a)} · ${hx(s.b)} = ${hx(s.res)}` : ""));
  el("text", {x: 280, y: 262, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "fekete = 1, üres = 0 · narancs keret = b aktuális bitje · kék keret = ezt XOR-oljuk az eredményhez");
}
function trace(a, b){
  const st = [{msg: `Kezdet: a = ${hx(a)}, b = ${hx(b)}, res = 0x00`, i: -1, xa: a, res: 0, bi: 0, ovf: false, a, b, line: 7}];
  let cur = a, res = 0;
  for (let i = 0; i < 8; i++) {
    let ovf = false; if (i) { ovf = !!(cur & 0x80); cur = xt(cur); }
    const bi = (b >> i) & 1, old = res; if (bi) res ^= cur;
    let m = `i = ${i}, b_${i} = ${bi}, x^${i}·a = ${hx(cur)}` + (ovf ? " (túlcsordulás: XOR 0x1B)" : "");
    m += bi ? `, res = ${hx(old)} ⊕ ${hx(cur)} = ${hx(res)}` : `, nem adjuk hozzá, res = ${hx(res)}`;
    st.push({msg: m, i, xa: cur, res, old, bi, ovf, a, b, line: ovf && !bi ? 3 : (bi ? 10 : 9)});
  }
  return st;
}
function load(a, b){
  if (a !== undefined) { document.getElementById("ia").value = a; document.getElementById("ib").value = b; }
  const A = parseInt(document.getElementById("ia").value, 16), B = parseInt(document.getElementById("ib").value, 16), e = document.getElementById("err");
  if (!/^[0-9a-fA-F]{1,2}$/.test(document.getElementById("ia").value) || !/^[0-9a-fA-F]{1,2}$/.test(document.getElementById("ib").value)) { e.textContent = "Két hexadecimális bájtot adjon meg (00–FF)."; return; }
  e.textContent = ""; setSteps(trace(A, B));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
