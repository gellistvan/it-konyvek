<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az euklideszi algoritmus mint téglalap-felosztás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = <input id="ia" type="number" value="252" min="1" style="width:6em" aria-label="a"></label><label>b = <input id="ib" type="number" value="198" min="1" style="width:6em" aria-label="b"></label><button onclick="load()">Betöltés</button><button onclick="load(21, 13)">Fibonacci-pár: 21, 13</button><button onclick="load(252, 198)">Alap: 252, 198</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 252 × 198 téglalap lépésenkénti felosztása négyzetekre: 1 db 198, 3 db 54, 1 db 36, 2 db 18 oldalú; gcd = 18."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 3.1.5 algoritmusa. Szaggatott keret = az aktuális maradék-téglalap; vastag keret = az utoljára levágott négyzetek. Kezdőállapot: a könyv 252/198 példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "(a, b) = (252, 198); kezdetben a teljes 252 × 198 téglalap", "n": 0, "line": 0}, {"msg": "1. lépés: 252 = 198·1 + 54; 1 db 198 oldalú négyzet; (a, b) = (198, 54)", "n": 1, "line": 2}, {"msg": "2. lépés: 198 = 54·3 + 36; 3 db 54 oldalú négyzet; (a, b) = (54, 36)", "n": 2, "line": 2}, {"msg": "3. lépés: 54 = 36·1 + 18; 1 db 36 oldalú négyzet; (a, b) = (36, 18)", "n": 3, "line": 2}, {"msg": "4. lépés: 36 = 18·2 + 0; nincs maradék, (a, b) = (18, 0) → gcd = 18", "n": 4, "line": 1}];
const CODE = ["Bemenet: a ≥ b > 0", "1. ha b = 0: az eredmény a", "2. r ← a mod b   (a = b·q + r)", "3. (a, b) ← (b, r); vissza az 1. lépésre"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function euclid(a, b){ const o = []; while (b) { const q = Math.floor(a / b), r = a % b; o.push([a, b, q, r]); a = b; b = r; } return o; }
function tiles(a, b){
  let x = 0, y = 0, w = a, h = b; const res = [];
  euclid(a, b).forEach(([aa, bb, q, r]) => {
    const sq = [];
    if (w >= h) { for (let j = 0; j < q; j++) sq.push([x + j * h, y, h]); x += q * h; w -= q * h; }
    else { for (let j = 0; j < q; j++) sq.push([x, y + h - (j + 1) * w, w]); h -= q * w; }
    res.push({a: aa, b: bb, q, r, sq, rest: [x, y, w, h]});
  });
  return res;
}
let A0 = 252, B0 = 198, TL = tiles(A0, B0);
const PAT = ["#9e9e9e", "#d0d0d0", "#ececec", "#bdbdbd", "#e0e0e0", "#cfcfcf"];
function render(s){
  svg.innerHTML = "";
  const W = 290, H = 250, sc = Math.min(W / A0, H / B0), ox = 44, oy = 20 + (H - B0 * sc);
  const X = v => ox + v * sc, Y = v => oy + (B0 - v) * sc;
  const dfs = el("defs", {});
  for (let i = 0; i < PAT.length; i++) {
    const p = document.createElementNS(NS, "pattern");
    p.setAttribute("id", "p" + i); p.setAttribute("width", 8); p.setAttribute("height", 8); p.setAttribute("patternUnits", "userSpaceOnUse");
    const r = document.createElementNS(NS, "rect"); r.setAttribute("width", 8); r.setAttribute("height", 8); r.setAttribute("fill", PAT[i]); p.appendChild(r);
    if (i % 2 === 1) { const l = document.createElementNS(NS, "path"); l.setAttribute("d", i % 4 === 1 ? "M0 8 L8 0" : "M0 4 L8 4"); l.setAttribute("stroke", "#555"); l.setAttribute("stroke-width", 1); p.appendChild(l); }
    dfs.appendChild(p);
  }
  // maradék téglalap (sraffozott)
  const cur = s.n ? TL[s.n - 1].rest : [0, 0, A0, B0];
  if (cur[2] > 0 && cur[3] > 0) el("rect", {x: X(cur[0]), y: Y(cur[1] + cur[3]), width: cur[2] * sc, height: cur[3] * sc, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "6 3"});
  for (let k = 0; k < s.n; k++) {
    TL[k].sq.forEach(([x, y, d], j) => {
      el("rect", {x: X(x), y: Y(y + d), width: d * sc, height: d * sc, fill: "url(#p" + (k % PAT.length) + ")", stroke: "#000", "stroke-width": k === s.n - 1 ? 2.5 : 1});
      if (j === 0 && d * sc >= 26) {
        el("text", {x: X(x + d / 2), y: Y(y + d / 2) - 2, "text-anchor": "middle", "font-size": 13, fill: "#000", "font-weight": "bold"}, String(d));
        el("text", {x: X(x + d / 2), y: Y(y + d / 2) + 13, "text-anchor": "middle", "font-size": 11, fill: "#000"}, "q=" + TL[k].q);
      }
    });
  }
  el("rect", {x: X(0), y: Y(B0), width: A0 * sc, height: B0 * sc, fill: "none", stroke: css("--line"), "stroke-width": 2});
  el("text", {x: X(A0 / 2), y: Y(0) + 16, "text-anchor": "middle", "font-size": 12}, String(A0));
  el("text", {x: X(0) - 4, y: Y(B0 / 2), "text-anchor": "end", "font-size": 12}, String(B0));
  // a = b·q + r táblázat
  const tx = 350, rows = Math.min(TL.length, 12);
  el("text", {x: tx, y: 30, "font-size": 13, "font-weight": "bold"}, "a = b·q + r");
  for (let i = 0; i < rows; i++) {
    const t = TL[i], y = 54 + i * 20, on = i === s.n - 1;
    if (on) el("rect", {x: tx - 6, y: y - 15, width: 210, height: 20, fill: css("--cellhl")});
    el("text", {x: tx, y, "font-size": 13, "font-weight": on ? "bold" : "normal", opacity: i < s.n ? 1 : 0.35},
       `${t.a} = ${t.b}·${t.q} + ${t.r}`);
  }
  if (TL.length > rows) el("text", {x: tx, y: 54 + rows * 20, "font-size": 12, fill: css("--muted")}, "…");
  if (s.n === TL.length) el("text", {x: tx, y: 290, "font-size": 15, "font-weight": "bold"}, "gcd = " + TL[TL.length - 1].b);
}
function trace(a, b){
  const T = tiles(a, b), st = [{msg: `(a, b) = (${a}, ${b}); kezdetben a teljes ${a} × ${b} téglalap`, n: 0, line: 0}];
  T.forEach((t, i) => st.push(t.r ? {msg: `${i + 1}. lépés: ${t.a} = ${t.b}·${t.q} + ${t.r}; ${t.q} db ${t.b} oldalú négyzet; (a, b) = (${t.b}, ${t.r})`, n: i + 1, line: 2}
                                  : {msg: `${i + 1}. lépés: ${t.a} = ${t.b}·${t.q} + 0; nincs maradék, (a, b) = (${t.b}, 0) → gcd = ${t.b}`, n: i + 1, line: 1}));
  return st;
}
function load(a, b){
  const m = document.getElementById("err");
  a = a === undefined ? +document.getElementById("ia").value : a; b = b === undefined ? +document.getElementById("ib").value : b;
  if (!Number.isInteger(a) || !Number.isInteger(b) || a < 1 || b < 1 || a > 100000 || b > 100000) { m.textContent = "Adjon meg két pozitív egészt (legfeljebb 100 000)."; return; }
  if (a < b) { const t = a; a = b; b = t; }
  document.getElementById("ia").value = a; document.getElementById("ib").value = b;
  const T = tiles(a, b);
  if (T.reduce((s, t) => s + t.q, 0) > 400) { m.textContent = "Túl sok négyzet a rajzhoz; válasszon kisebb hányadosú párt."; return; }
  m.textContent = ""; A0 = a; B0 = b; TL = T; setSteps(trace(a, b));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
