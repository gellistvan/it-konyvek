<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellcore-típusú hibatámadás CRT-vel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="radiogroup" aria-label="Hiba helye">
<label><input type="radio" name="side" value="p" checked> hiba a p-oldalon</label>
<label><input type="radio" name="side" value="q"> hiba a q-oldalon</label></span>
<label>hibás érték: <input id="fv" type="number" min="0" max="12" value="5"></label>
<button id="go">Újraszámolás</button>
<script>
document.getElementById("go").onclick = () => {
  const side = document.querySelector('input[name=side]:checked').value;
  let fv = Math.round(+document.getElementById("fv").value || 0);
  const mod = side === "p" ? 11 : 13; fv = ((fv % mod) + mod) % mod;
  const good = side === "p" ? 3 : 9;
  if (fv === good) { fv = (good + 2) % mod; }
  document.getElementById("fv").value = fv;
  setSteps(compute(side, fv)); show(5);
};
document.querySelectorAll('input[name=side]').forEach(r => r.onchange = () => document.getElementById("go").onclick());
window.addEventListener("load", () => { document.body.dataset.selftest = JSON.stringify(compute("p", 5)) === JSON.stringify(STEPS) ? "ok" : "mismatch"; });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két sáv: a mod 13 sávban minden érték helyes és z ≡ 0, a mod 11 sávban a hibás 5 miatt z ≢ 0; gcd(104, 143) = 13."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 11, q = 13, N = 143, e = 7, d = 43, m = 9 (a fejezet 1–2. feladata). Szaggatott keret = hibás komponens. Ha a hibás érték éppen a helyessel egyezne, a lap egy másik hibás értéket választ.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés: a p-oldali komponens hibás (5), a másik helyes.", "line": 0, "k": 0, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}, {"msg": "2. lépés: Garner: h′ = (5 − 9)·6 mod 11 = 9.", "line": 1, "k": 1, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}, {"msg": "3. lépés: σ′ = 126; σ′ mod 11 = 5 (hibás), σ′ mod 13 = 9 (helyes)", "line": 2, "k": 2, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}, {"msg": "4. lépés: σ′^7 mod 143 = 113; mod 11: 3 vs. m: 9; mod 13: 9 vs. m: 9.", "line": 3, "k": 3, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}, {"msg": "5. lépés: z = 113 − 9 = 104; z mod 11 = 5, z mod 13 = 0.", "line": 4, "k": 4, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}, {"msg": "6. lépés: gcd(104, 143) = 13 → N = 13·11 faktorizálva.", "line": 5, "k": 5, "rows": [["1. komponensek", "5 ⚡ (helyes: 3)", "9⁷ mod 13 = 9", "d_p=3, d_q=7, q_inv=6", true, false], ["2. Garner", "h′ = (5−9)·6 mod 11 = 9", "—", "h′ = 9", false, false], ["3. σ′", "σ′ ≡ 5", "σ′ ≡ 9", "σ′ = 9+13·9 = 126", true, false], ["4. σ′ᵉ vs. m", "σ′⁷ ≡ 3 ≠ m ≡ 9", "σ′⁷ ≡ 9 = m ≡ 9", "126⁷ mod 143 = 113", true, false], ["5. z = σ′ᵉ − m", "z ≡ 5 ≠ 0", "z ≡ 0", "z = 113 − 9 = 104", true, false], ["6. gcd(z, N)", "11 ∤ z", "13 | z", "gcd(104, 143) = 13", true, false]]}];
const CODE = ["1. s_p = m^d_p mod p,  s_q = m^d_q mod q   (az egyik hibás)", "2. h' = (s_p − s_q)·q_inv mod p             (Garner)", "3. σ' = s_q + q·h'", "4. σ'^e mod N  vs.  m", "5. z = σ'^e − m", "6. gcd(z, N)  → q (p-oldali hiba) vagy p (q-oldali hiba)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SUPM = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function sup(n){return String(n).split("").map(c => SUPM[c] || c).join("");}
function md(a, n){return ((a % n) + n) % n;}
function pw(b, e, n){let r = 1; b = md(b, n); for (let i = 0; i < e; i++) r = (r * b) % n; return r;}
function gcdN(a, b){a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a;}
function compute(side, fv){
  const P = 11, Q = 13, E = 7, D = 43, M = 9, N = 143;
  const dp = D % (P - 1), dq = D % (Q - 1); let qinv = 1; while ((Q * qinv) % P !== 1) qinv++;
  const sp = pw(M, dp, P), sq = pw(M, dq, Q);
  const sp2 = side === "p" ? fv : sp, sq2 = side === "p" ? sq : fv;
  const h = md((sp2 - sq2) * qinv, P), sig = sq2 + Q * h, se = pw(sig, E, N), z = se - M, g = gcdN(z, N);
  const bp = side === "p", bq = side === "q";
  const L = ["1. komponensek", "2. Garner", "3. σ′", "4. σ′ᵉ vs. m", "5. z = σ′ᵉ − m", "6. gcd(z, N)"];
  const c1p = bp ? `${sp2} ⚡ (helyes: ${sp})` : `${M}${sup(dp)} mod ${P} = ${sp}`;
  const c1q = bq ? `${sq2} ⚡ (helyes: ${sq})` : `${M}${sup(dq)} mod ${Q} = ${sq}`;
  const rows = [
    [L[0], c1p, c1q, `d_p=${dp}, d_q=${dq}, q_inv=${qinv}`, bp, bq],
    [L[1], `h′ = (${sp2}−${sq2})·${qinv} mod ${P} = ${h}`, "—", `h′ = ${h}`, false, false],
    [L[2], `σ′ ≡ ${md(sig, P)}`, `σ′ ≡ ${md(sig, Q)}`, `σ′ = ${sq2}+${Q}·${h} = ${sig}`, bp, bq],
    [L[3], `σ′${sup(E)} ≡ ${md(se, P)}` + (md(se, P) !== md(M, P) ? " ≠" : " =") + ` m ≡ ${md(M, P)}`,
           `σ′${sup(E)} ≡ ${md(se, Q)}` + (md(se, Q) !== md(M, Q) ? " ≠" : " =") + ` m ≡ ${md(M, Q)}`,
           `${sig}${sup(E)} mod ${N} = ${se}`, bp, bq],
    [L[4], `z ≡ ${md(z, P)}` + (md(z, P) ? " ≠ 0" : ""), `z ≡ ${md(z, Q)}` + (md(z, Q) ? " ≠ 0" : ""),
           `z = ${se} − ${M} = ${z}`, bp, bq],
    [L[5], md(z, P) ? `${P} ∤ z` : `${P} | z`, md(z, Q) ? `${Q} ∤ z` : `${Q} | z`, `gcd(${z}, ${N}) = ${g}`, bp, bq],
  ];
  const msgs = [
    `1. lépés: a ${bp ? "p" : "q"}-oldali komponens hibás (${fv}), a másik helyes.`,
    `2. lépés: Garner: h′ = (${sp2} − ${sq2})·${qinv} mod ${P} = ${h}.`,
    `3. lépés: σ′ = ${sig}; σ′ mod ${P} = ${md(sig, P)} (${bp ? "hibás" : "helyes"}), σ′ mod ${Q} = ${md(sig, Q)} (${bq ? "hibás" : "helyes"})`,
    `4. lépés: σ′^${E} mod ${N} = ${se}; mod ${P}: ${md(se, P)} vs. m: ${md(M, P)}; mod ${Q}: ${md(se, Q)} vs. m: ${md(M, Q)}.`,
    `5. lépés: z = ${se} − ${M} = ${z}; z mod ${P} = ${md(z, P)}, z mod ${Q} = ${md(z, Q)}.`,
    `6. lépés: gcd(${z}, ${N}) = ${g}` + (g > 1 && g < N ? ` → N = ${g}·${N / g} faktorizálva.` : " → nincs faktor."),
  ];
  return msgs.map((m, i) => ({msg: m, line: i, k: i, rows: rows}));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 470");
  svg.innerHTML = "";
  const cx = [[0, 150], [158, 205], [370, 205], [582, 178]];
  const heads = ["lépés", "„mod 11” sáv (p)", "„mod 13” sáv (q)", "egész (mod 143)"];
  cx.forEach(([x, w], j) => el("text", {x: x + w / 2, y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, heads[j]));
  s.rows.forEach((row, i) => {
    const y = 38 + i * 70, on = i === s.k, shown = i <= s.k;
    el("text", {x: 2, y: y + 32, "font-size": 12.5, "font-weight": on ? "bold" : "normal", fill: shown ? css("--fg") : css("--muted")}, row[0]);
    for (let j = 1; j < 4; j++) {
      const [x, w] = cx[j];
      const bad = (j === 1 && row[4]) || (j === 2 && row[5]);
      el("rect", {x: x, y: y, width: w, height: 54, rx: 5, fill: shown ? (bad ? css("--cellhl") : css("--cell")) : css("--bg"),
        stroke: shown ? css("--line") : css("--muted"), "stroke-width": on ? 3 : (bad ? 1.8 : 1.1), "stroke-dasharray": bad ? "6 4" : "none"});
      if (shown) el("text", {x: x + w / 2, y: y + 32, "text-anchor": "middle", "font-size": 12}, row[j]);
    }
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
