<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padding oracle lépésenként (4 bájtos példa)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="jumpHit()" title="Ugrás a következő találatra">Ugrás a találatra ⏭</button><button onclick="fastPlay()" title="Gyors lejátszás a következő találatig / megállítás">Gyors lejátszás ⏩</button><label>sebesség: <input id="spd" type="range" min="2" max="60" value="20" aria-label="Lépés másodpercenként"></label><label>I(i): <input id="ii" value="DE AD BE EF" size="12" aria-label="Közbülső érték, 4 bájt hexában"></label><label>C(i−1): <input id="ic" value="10 20 30 40" size="12" aria-label="Előző rejtett blokk, 4 bájt hexában"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A módosított előző blokk, a rejtett közbülső érték és a visszafejtett blokk soronként; egy lépés egy orákulum-kérés, a közbülső érték bájtról bájtra előáll."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 12.3.6 számai: I(i) = DE AD BE EF, C(i−1) = 10 20 30 40; sikeres g: EE, BC, AE, DA; összesen 823 orákulum-kérés (az i = 1 kétértelműség-ellenőrzéssel). A kód a 12.3.8 attack_block függvénye (BLOCK = 4). Szimulált játékpélda: a D_K kimenetét rögzítjük, nincs valódi rejtjel és nincs éles célpont.</p>

      const tried = rw[2] === "cp" && j >= 1 && j <= 4 && b === 4 - j;
      const fixed = rw[2] === "cp" && j >= 1 && j <= 4 && b > 4 - j;
      const rec = rw[2] === "i" && s.known[b] !== null;
      const pad = rw[2] === "p" && s.ok === 1 && j >= 1 && j <= 4 && b >= 4 - j && !s.amb;
      el("rect", {x: X0 + b * CWp, y: y, width: CWp - 6, height: 40, fill: rec ? css("--fg") : (pad ? css("--cellhl") : css("--cell")), stroke: css("--line"), "stroke-width": tried ? 4 : 1});
      if (fixed) el("rect", {x: X0 + b * CWp, y: y, width: CWp - 6, height: 40, fill: "url(#hatch)", stroke: "none"});
      const txt = rw[2] === "i" ? (rec ? hx(rw[1][b]) : "??") : hx(rw[1][b]);
      el("text", {x: X0 + b * CWp + (CWp - 6) / 2, y: y + 27, "text-anchor": "middle", "font-size": 19, "font-family": "monospace", "font-weight": "bold", fill: rec ? css("--bg") : css("--fg")}, txt);
    }
  });
  const ox = X0 + 4 * CWp + 24;
  if (s.ok >= 0) {
    el("rect", {x: ox, y: 84, width: 150, height: 56, rx: 10, fill: s.ok ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": s.ok ? 3 : 1});
    el("text", {x: ox + 75, y: 108, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "orákulum: " + s.ok);
    el("text", {x: ox + 75, y: 128, "text-anchor": "middle", "font-size": 12}, s.ok ? "érvényes kitöltés" : "kitöltési hiba");
  }
  el("text", {x: ox, y: 30, "font-size": 13}, "kérések: " + s.q);
  if (j >= 1 && j <= 4) el("text", {x: ox, y: 50, "font-size": 13}, "fázis j = " + j + ", cél: " + Array(j).fill(hx(j)).join(" "));
  el("text", {x: 20, y: 240, "font-size": 12, fill: css("--muted")}, "Vastag keret: a próbált bájt (g) · sraffozott: már ismert bájt, j-re állítva · sötét: visszanyert I(i)-bájt · szürke: érvényes kitöltés bájtjai");
  el("text", {x: 20, y: 262, "font-size": 12, fill: css("--muted")}, "Valódi C(i−1) = " + hs(CVAL) + " · szimulált játékpélda (rögzített D_K kimenet), nem éles támadás");
}
function stopFast(){ if (FAST) { clearInterval(FAST); FAST = null; } }
function jumpHit(){ stopFast(); let t = k + 1; while (t < STEPS.length - 1 && !STEPS[t].hit) t++; show(t); }
function fastPlay(){
  if (FAST) { stopFast(); return; }
  const d = 1000 / (+document.getElementById("spd").value);
  FAST = setInterval(() => { if (k >= STEPS.length - 1 || STEPS[k + 1].hit) { show(k + 1); stopFast(); } else show(k + 1); }, d);
}
function parse4(id){const v = document.getElementById(id).value.trim().split(/\s+/); if (v.length !== 4 || v.some(x => !/^[0-9a-fA-F]{1,2}$/.test(x))) return null; return v.map(x => parseInt(x, 16));}
function load(){
  stopFast();
  const a = parse4("ii"), b = parse4("ic"), m = document.getElementById("err");
  if (!a || !b) { m.textContent = "4 bájt hexában, szóközzel elválasztva (pl. DE AD BE EF)."; return; }
  const st = attackJ(a, b);
  if (!st) { m.textContent = "Nincs érvényes g (nem fordulhat elő)."; return; }
  m.textContent = ""; IVAL = a; CVAL = b; setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
