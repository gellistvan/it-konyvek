<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Születésnapi korlát</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
input[type=range]{flex:1;min-width:140px}
input[type=number],input[type=text],select{font:inherit;width:8em}
button{font:inherit;padding:2px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;padding:4px 6px;background:var(--code)}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="ls">log<sub>2</sub> σ:</label>
  <input id="ls" type="range" min="0" max="70" step="0.1" value="32" aria-label="log2 sigma">
  <output id="lsv">32</output>
</div>
<div class="ctl">
  <label for="nsel">n (bit):</label>
  <select id="nsel"><option>32</option><option selected>64</option><option>96</option><option>128</option><option value="x">saját</option></select>
  <input id="nown" type="number" min="8" max="256" value="80" aria-label="saját n" disabled>
  <label for="bs">blokkméret:</label>
  <select id="bs"><option value="8" selected>8 bájt</option><option value="16">16 bájt</option></select>
  <label for="gib">adat (GiB):</label>
  <input id="gib" type="number" min="0" step="any" value="32" aria-label="adatmennyiség GiB-ban">
</div>
<div class="ctl">
  <label for="eps">ε<sub>max</sub> = 2^</label>
  <input id="eps" type="number" step="any" value="-32" aria-label="epszilon maximum kettes kitevője">
  <button id="inv">σ kiszámítása ε<sub>max</sub>-ból</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Három görbe: 64 bitnél 2^32 blokknál kb. 39%, 96 bitnél ugyanott kb. 10^-10, 128 bitnél 2^48,5 blokknál kb. 2^-32."></svg>
<p class="small">Számított (születésnapi közelítés p = 1 − e^(−σ²/2^(n+1))), nem mérés. A 96 bites (GCM véletlen nonce) esetben σ az üzenetek száma. Függőleges vonalak: NIST GCM 2^32 üzenet, TLS 1.3 2^34,5 blokk (ellenőrizendő). A szürke görbék a 64/96/128 bites esetek, a kiemelt görbe a választott n.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const $=id=>document.getElementById(id);
function pcol(l,n){const x=Math.pow(2,2*l-(n+1));return -Math.expm1(-x);}
function hu(v,d){return v.toFixed(d).replace(".",",").replace("-","−");}
function sci(v){ if(v===0)return "0"; if(v>=0.01&&v<1e4)return hu(v,v<1?2:1); const e=Math.floor(Math.log10(v)); const m=v/Math.pow(10,e); return hu(m,2)+"·10^"+String(e).replace("-","−");}
function g3(v){return String(+v.toPrecision(3)).replace(".",",");}
function bytesStr(b){const u=[["EiB",2**60],["PiB",2**50],["TiB",2**40],["GiB",2**30],["MiB",2**20],["KiB",2**10]];for(const [n,s] of u){if(b>=s)return g3(b/s)+" "+n;}return g3(b)+" B";}
function nVal(){return $("nsel").value==="x"?Math.max(8,Math.min(256,+$("nown").value||64)):+$("nsel").value;}
const X0=60,X1=620,Y0=20,Y1=290;
function X(l){return X0+(X1-X0)*l/70;} function Y(lp){return Y0+(Y1-Y0)*(-lp)/40;}
function draw(extra){
  svg.innerHTML="";
  const n=nVal(), l=+$("ls").value;
  for(let t=0;t<=40;t+=10){el("line",{x1:X0,x2:X1,y1:Y(-t),y2:Y(-t),stroke:css("--grid")});el("text",{x:X0-6,y:Y(-t)+4,"text-anchor":"end","font-size":11},t?"−"+t:"0");}
  for(let t=0;t<=70;t+=10){el("line",{x1:X(t),x2:X(t),y1:Y0,y2:Y1,stroke:css("--grid")});el("text",{x:X(t),y:Y1+15,"text-anchor":"middle","font-size":11},String(t));}
  el("text",{x:(X0+X1)/2,y:Y1+32,"text-anchor":"middle","font-size":12},"log₂ σ");
  el("text",{x:14,y:(Y0+Y1)/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 14 ${(Y0+Y1)/2})`},"log₁₀ p");
  [[32,"NIST GCM 2^32"],[34.5,"TLS 1.3 2^34,5"]].forEach(([x,t],i)=>{el("line",{x1:X(x),x2:X(x),y1:Y0,y2:Y1,stroke:css("--muted"),"stroke-dasharray":"6 3 1 3"});el("text",{x:X(x)+(i?4:-4),y:Y1-6-(i?0:14),"text-anchor":i?"start":"end","font-size":10,fill:css("--muted")},t);});
  const dash={64:"",96:"7 4",128:"2 3"};
  const curves=[64,96,128]; if(!curves.includes(n)) curves.push(n);
  curves.forEach(m=>{let d="";for(let i=0;i<=700;i++){const x=i/10;let lp=Math.log10(Math.max(pcol(x,m),1e-300));if(lp<-40)continue;d+=(d?"L":"M")+X(x).toFixed(1)+","+Y(lp).toFixed(1);}
    const on=(m===n);el("path",{d:d,fill:"none",stroke:on?css("--hl"):css("--muted"),"stroke-width":on?3:1.3,"stroke-dasharray":(m in dash)?dash[m]:"3 2 8 2"});
    const lx=Math.min(68,(m+1)/2+4); el("text",{x:X(Math.min(69,lx))-2,y:Y0+12,"text-anchor":"end","font-size":11,fill:on?css("--hl"):css("--muted")},"n="+m);});
  const p=pcol(l,n), lp=Math.log10(Math.max(p,1e-300));
  if(lp>=-40){el("circle",{cx:X(l),cy:Y(lp),r:6,fill:"none",stroke:css("--hl2"),"stroke-width":2.5});}
  el("line",{x1:X(l),x2:X(l),y1:Y0,y2:Y1,stroke:css("--hl2"),"stroke-width":1});
  const bs=+$("bs").value, bytes=Math.pow(2,l)*bs;
  let msg=`n = ${n}, σ = 2^${hu(l,1)} ≈ ${sci(Math.pow(2,l))} ${n===96?"üzenet":"blokk"}: p ≈ ${sci(p)} (= 2^${hu(Math.log2(Math.max(p,1e-300)),1)}), ${bytesStr(bytes)} (${bs} bájtos blokk).`;
  if(extra) msg+=" "+extra;
  $("status").textContent=msg;
}
function syncFromSlider(){ $("lsv").textContent=hu(+$("ls").value,1); const g=Math.pow(2,+$("ls").value)*(+$("bs").value)/2**30; $("gib").value=+g.toPrecision(6); draw(); }
$("ls").addEventListener("input",syncFromSlider);
$("bs").addEventListener("change",syncFromSlider);
$("nsel").addEventListener("change",()=>{$("nown").disabled=$("nsel").value!=="x";if($("nsel").value==="64"||$("nsel").value==="32")$("bs").value="8";if($("nsel").value==="128")$("bs").value="16";syncFromSlider();});
$("nown").addEventListener("input",draw);
$("gib").addEventListener("change",()=>{const g=+$("gib").value;if(!(g>0))return;let l=Math.log2(g*2**30/(+$("bs").value));l=Math.max(0,Math.min(70,l));$("ls").value=l.toFixed(1);$("lsv").textContent=hu(l,1);draw();});
$("inv").addEventListener("click",()=>{const k=+$("eps").value;const e=Math.pow(2,k);if(!(e>0&&e<1)){draw("ε_max legyen 0 és 1 közé eső (2^k, k < 0).");return;}
  const n=nVal(), s=Math.sqrt(-Math.log1p(-e)*Math.pow(2,n+1)), bs=+$("bs").value; let l=Math.log2(s); $("ls").value=Math.max(0,Math.min(70,l)).toFixed(1);$("lsv").textContent=hu(+$("ls").value,1);
  $("gib").value=+(s*bs/2**30).toPrecision(6);
  draw(`Fordított számítás: ε_max = 2^${hu(k,1)} → σ ≈ ${sci(s)} ${n===96?"üzenet":"blokk"} ≈ ${bytesStr(s*bs)}.`);});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
