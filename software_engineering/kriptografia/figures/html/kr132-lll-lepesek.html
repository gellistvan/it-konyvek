<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLL lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>δ: <input id="delta" type="range" min="0.26" max="0.99" step="0.01" value="0.75"><b id="dv">0,75</b></label>
<label>a: <input id="av" type="text" value="34,51,58,11,39" size="16"></label>
<label>c: <input id="cv" type="number" value="103" style="width:5em"></label>
<button id="go">Újraszámolás</button>
<script>
function regen(){ const d = +document.getElementById("delta").value; document.getElementById("dv").textContent = d.toFixed(2).replace(".", ",");
  let a = document.getElementById("av").value.split(/[ ,;]+/).map(Number).filter(x => Number.isFinite(x) && x !== 0).slice(0, 8);
  if (a.length < 2) a = [34, 51, 58, 11, 39]; const c = Math.round(+document.getElementById("cv").value) || 103;
  const n = a.length, B = a.map((ai, i) => Array.from({length: n}, (_, j) => j === i ? 1 : 0).concat([Math.round(ai)]));
  B.push(new Array(n).fill(0).concat([-c])); setSteps(lllSteps(B, d)); }
document.getElementById("delta").oninput = regen; document.getElementById("go").onclick = regen;
window.addEventListener("load", () => { const B = [34, 51, 58, 11, 39].map((ai, i) => [0,1,2,3,4].map(j => j === i ? 1 : 0).concat([ai])); B.push([0,0,0,0,0,-103]);
  document.body.dataset.selftest = JSON.stringify(lllSteps(B, 0.75).map(x => x.msg)) === JSON.stringify(STEPS.map(x => x.msg)) ? "ok" : "mismatch"; });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A Gram–Schmidt-hosszak profilja a kezdeti meredekből kiegyenlítetté válik; a végső bázisban megjelenik az üzenetvektor (1,0,1,1,0,0)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított futás, nem mérés. A beépített futás egzakt racionális aritmetikával készült (Python), a saját bemenet a böngészőben lebegőpontos számolással fut (kis példákra elég). δ = 3/4 mellett az üzenetvektor b₂-ként jelenik meg, δ = 0,99 mellett b₁-ként.</p>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;

    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });

const SUBM = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","-":"₋"};
function sb(i){ return String(i).split("").map(c => SUBM[c] || c).join(""); }
function hu(x, d){ return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function gsF(B){ const n = B.length, m = B[0].length, Bs = [], nb = [], mu = B.map(() => new Array(n).fill(0));
  for (let i = 0; i < n; i++) { let v = B[i].slice();
    for (let j = 0; j < i; j++) { let d = 0; for (let t = 0; t < m; t++) d += B[i][t] * Bs[j][t]; mu[i][j] = d / nb[j]; v = v.map((x, t) => x - mu[i][j] * Bs[j][t]); }
    Bs.push(v); nb.push(v.reduce((s, x) => s + x * x, 0)); }
  return [mu, nb]; }
function snapF(B, delta, msg, line, row){ const [mu, nb] = gsF(B), bad = [];
  for (let i = 0; i < B.length - 1; i++) if (delta * nb[i] > nb[i + 1] + mu[i + 1][i] ** 2 * nb[i] + 1e-9) bad.push(i);
  return {msg: msg, line: line, B: B.map(r => r.slice()), lg: nb.map(x => Math.round(Math.log2(x) * 1000) / 1000),
    mu: mu.map((r, i) => r.map((x, j) => j < i ? Math.round(Math.abs(x) * 1000) / 1000 : 0)), row: row, bad: bad}; }
function lllSteps(B0, delta){
  let B = B0.map(r => r.slice()); const n = B.length; let k = 1; const st = [snapF(B, delta, "Kezdet: Gram–Schmidt-vektorok és μ együtthatók kiszámítása.", 0, -1)];
  let guard = 0;
  while (k < n && guard++ < 5000) {
    for (let j = k - 1; j >= 0; j--) { const [mu] = gsF(B);
      if (Math.abs(mu[k][j]) > 0.5 + 1e-12) { const c = Math.floor(mu[k][j] + 0.5); B[k] = B[k].map((x, t) => x - c * B[j][t]);
        st.push(snapF(B, delta, `k = ${k + 1}: méretredukálás b${sb(k + 1)} ← b${sb(k + 1)} − (${hu(c, 0)})·b${sb(j + 1)} (μ = ${hu(mu[k][j], 2)})`, 1, k)); } }
    const [mu, nb] = gsF(B), lhs = delta * nb[k - 1], rhs = nb[k] + mu[k][k - 1] ** 2 * nb[k - 1];
    if (lhs <= rhs + 1e-9) k++;
    else { [B[k], B[k - 1]] = [B[k - 1], B[k]];
      st.push(snapF(B, delta, `k = ${k + 1}: Lovász-feltétel sérül (δ‖b*${sb(k)}‖² = ${hu(lhs, 1)} > ‖b*${sb(k + 1)} + μ b*${sb(k)}‖² = ${hu(rhs, 1)}) → csere`, 2, k - 1));
      k = Math.max(k - 1, 1); }
  }
  st.push(snapF(B, delta, `Vége: minden Lovász-feltétel teljesül, |μ| ≤ 1/2; b₁ = (${B[0].map(x => hu(x, 0)).join(", ")}).`, 3, -1));
  return st; }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = "";
  const n = s.B.length, m = s.B[0].length, cw = Math.min(34, 260 / m), ch = Math.min(34, 250 / n);
  el("text", {x: 30, y: 20, "font-size": 13, "font-weight": "bold"}, "(a) bázis (soronként)");
  s.B.forEach((row, i) => { const y = 32 + i * ch, on = i === s.row;
    el("text", {x: 26, y: y + ch / 2 + 5, "text-anchor": "end", "font-size": 12}, "b" + sb(i + 1));
    el("rect", {x: 30, y: y, width: cw * m, height: ch, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 0.6});
    row.forEach((v, j) => el("text", {x: 30 + j * cw + cw / 2, y: y + ch / 2 + 5, "text-anchor": "middle", "font-size": 12}, hu(v, 0))); });
  // (b) profil
  const bx = 330, by = 290, bw = 170, bh = 240, mx = Math.max(1, ...s.lg), mn = Math.min(0, ...s.lg);
  el("text", {x: bx, y: 20, "font-size": 13, "font-weight": "bold"}, "(b) log₂‖b*ᵢ‖²");
  const Y = v => by - (v - mn) / (mx - mn) * bh;
  el("line", {x1: bx, y1: Y(0), x2: bx + bw, y2: Y(0), stroke: css("--line")});
  s.lg.forEach((v, i) => { const x = bx + 4 + i * bw / n, bad = s.bad.includes(i) || s.bad.includes(i - 1);
    el("rect", {x: x, y: Math.min(Y(v), Y(0)), width: bw / n - 6, height: Math.abs(Y(v) - Y(0)), fill: bad ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": bad ? 2.5 : 1, "stroke-dasharray": bad ? "4 2" : "none"});
    el("text", {x: x + (bw / n - 6) / 2, y: by + 16, "text-anchor": "middle", "font-size": 11}, String(i + 1));
    el("text", {x: x + (bw / n - 6) / 2, y: Math.min(Y(v), Y(0)) - 4, "text-anchor": "middle", "font-size": 10}, hu(v, 1)); });
  // (c) |μ|
  const hx = 530, hy = 40, hc = Math.min(30, 160 / (n - 1));
  el("text", {x: hx, y: 20, "font-size": 13, "font-weight": "bold"}, "(c) |μᵢⱼ|");
  for (let i = 1; i < n; i++) for (let j = 0; j < i; j++) { const v = s.mu[i][j], g = Math.round(255 * (1 - 0.7 * Math.min(1, v / 2)));
    el("rect", {x: hx + j * hc, y: hy + (i - 1) * hc, width: hc, height: hc, fill: `rgb(${g},${g},${g})`, stroke: css("--line"), "stroke-width": v > 0.5 ? 2.5 : 0.5});
    if (v > 0.5) el("text", {x: hx + j * hc + hc / 2, y: hy + (i - 1) * hc + hc / 2 + 4, "text-anchor": "middle", "font-size": 10, fill: "#000"}, "×"); }
  el("text", {x: hx, y: hy + (n - 1) * hc + 18, "font-size": 11, fill: css("--muted")}, "× és vastag keret: |μ| > 1/2");
  el("text", {x: hx, y: hy + (n - 1) * hc + 34, "font-size": 11, fill: css("--muted")}, "sor: i = 2.., oszlop: j = 1..");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
