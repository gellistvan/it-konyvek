<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBC-MAC hamisítás két láncon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>m1: <input id="m1" type="range" min="0" max="15" value="5" oninput="load()" aria-label="m1 (0–15)"></label><span id="m1v">5</span><label>m2: <input id="m2" type="range" min="0" max="15" value="9" oninput="load()" aria-label="m2 (0–15)"></label><span id="m2v">9</span><button onclick="document.getElementById('m1').value=10;document.getElementById('m2').value=7;load()">2. feladat: m1 = 10, m2 = 7</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három CBC-MAC-lánc; a hamis kétblokkos üzenet második lépése ugyanazt az 1-es bemenetet kapja, mint az x = 1 lekérdezés, ezért a címke 4."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">E(x) = (x + 3) mod 16: számított játékpélda, nem valódi blokkrejtjel. Kezdőállapot: a 14.3.9 példája (m1 = 5, m2 = 9).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 0, "line": 5, "msg": "1. lépés: (A) lekérdezés [m1 = 5]: 0 ⊕ 5 = 5, E(5) = (5 + 3) mod 16 = 8 = t1"}, {"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 1, "line": 6, "msg": "2. lépés: (B) előkészítés: x = t1 XOR m2 = 8 XOR 9 = 1"}, {"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 2, "line": 7, "msg": "3. lépés: (B) lekérdezés [x = 1]: 0 ⊕ 1 = 1, E(1) = 4 = t2"}, {"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 3, "line": 8, "msg": "4. lépés: (C) hamis üzenet [5, 9], 1. blokk: 0 ⊕ 5 = 5, E(5) = 8 (= t1, a támadó ismeri)"}, {"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 4, "line": 8, "msg": "5. lépés: (C) 2. blokk: 8 ⊕ 9 = 1 – ugyanaz az E-bemenet, mint (B)-ben; E(1) = 4"}, {"m1": 5, "m2": 9, "t1": 8, "x": 1, "t2": 4, "c1": 8, "in2": 1, "real": 4, "k": 5, "line": 9, "msg": "6. lépés: Összevetés: a [5, 9] címkéje 4 = t2 = 4 – a hamisítás sikeres, pedig ezt az üzenetet sosem kérdezte le a támadó"}];
const CODE = ["def toy_encrypt(x, k=0): return (x + 3) % 16", "def cbc_mac_4bit(blocks):", "    c = 0", "    for m in blocks: c = toy_encrypt(m ^ c)", "    return c", "t1 = cbc_mac_4bit([m1])               # (A) lekérdezés", "x = t1 ^ m2                           # (B) előkészítés", "t2 = cbc_mac_4bit([x])                # (B) lekérdezés", "real_mac = cbc_mac_4bit([m1, m2])     # (C) a hamis üzenet ellenőrzése", "assert real_mac == t2                 # a hamisított címke érvényes"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function T(x, y, s, o){ const a = Object.assign({x, y, "font-size": 14}, o || {}); return el("text", a, s); }
function arr(x1, y1, x2, y2, dash){
  el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": dash ? "5 4" : ""});
  const a = Math.atan2(y2 - y1, x2 - x1), L = 8;
  el("polygon", {points: `${x2},${y2} ${x2 - L*Math.cos(a - 0.4)},${y2 - L*Math.sin(a - 0.4)} ${x2 - L*Math.cos(a + 0.4)},${y2 - L*Math.sin(a + 0.4)}`, fill: css("--line")});
}
function stage(X, y, cin, mlab, inner, out, show, dbl, cinShow){
  if (!show) { el("rect", {x: X - 40, y: y - 22, width: 230, height: 44, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 4"}); T(X + 60, y + 5, "?", {"text-anchor": "middle", fill: css("--muted")}); return; }
  if (cinShow) { T(X - 50, y + 5, String(cin), {"text-anchor": "middle"}); arr(X - 40, y, X - 14, y); }
  el("circle", {cx: X, cy: y, r: 12, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
  T(X, y + 6, "⊕", {"text-anchor": "middle", "font-size": 18});
  T(X, y - 30, mlab, {"text-anchor": "middle", "font-size": 13});
  arr(X, y - 26, X, y - 13);
  arr(X + 12, y, X + 60, y);
  if (dbl) { el("rect", {x: X + 22, y: y - 26, width: 26, height: 22, fill: "none", stroke: css("--hl2"), "stroke-width": 2}); el("rect", {x: X + 19, y: y - 29, width: 32, height: 28, fill: "none", stroke: css("--hl2"), "stroke-width": 1.5}); }
  T(X + 35, y - 9, String(inner), {"text-anchor": "middle", "font-weight": dbl ? "bold" : "normal"});
  el("rect", {x: X + 62, y: y - 16, width: 44, height: 32, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
  T(X + 84, y + 5, "E", {"text-anchor": "middle"});
  arr(X + 106, y, X + 140, y);
  T(X + 146, y + 5, out);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 345");
  svg.innerHTML = "";
  const C1 = 70, C2 = 310, yA = 82, yB = 194, yC = 306;
  [[yA, "(A) lekérdezés [" + s.m1 + "]", ""], [yB, "(B) lekérdezés [x = " + s.x + "]", ""], [yC, "(C) hamis üzenet [" + s.m1 + ", " + s.m2 + "] – nem kérdezték le", "6 4"]].forEach(([y, lab, d]) => {
    el("rect", {x: 4, y: y - 74, width: 552, height: 102, fill: "none", stroke: css("--muted"), "stroke-dasharray": d});
    T(10, y - 55, lab, {"font-size": 13, "font-weight": "bold"});
  });
  stage(C1, yA, 0, "m1 = " + s.m1, s.m1, s.t1 + " = t1", s.k >= 0, false, true);
  if (s.k >= 1) T(C2 - 60, yB - 55, "x = t1 ⊕ m2 = " + s.t1 + " ⊕ " + s.m2 + " = " + s.x, {"font-size": 13, fill: css("--hl")});
  stage(C2, yB, 0, "x = " + s.x, s.x, s.t2 + " = t2", s.k >= 2, s.k >= 4, true);
  stage(C1, yC, 0, "m1 = " + s.m1, s.m1, String(s.c1), s.k >= 3, false, true);
  if (s.k >= 3) { arr(C1 + 160, yC, C2 - 14, yC); arr(C1 + 150, yA + 14, C1 + 150, yC - 18, true); T(C1 + 142, yB + 5, "t1: a támadó ismeri", {"font-size": 12, "text-anchor": "end", fill: css("--muted")}); }
  stage(C2, yC, s.c1, "m2 = " + s.m2, s.in2, s.real + " = címke", s.k >= 4, s.k >= 4, false);
  if (s.k >= 5) T(C2 + 150, yC + 24, (s.real === s.t2 ? "= t2 ✓" : "≠ t2"), {"font-size": 15, "font-weight": "bold", fill: css("--hl2")});
}
function forge(m1, m2){
  const E = x => (x + 3) % 16, t1 = E(m1), x = t1 ^ m2, t2 = E(x), c1 = E(m1), in2 = m2 ^ c1, real = E(in2);
  return {m1, m2, t1, x, t2, c1, in2, real};
}
function stepsFor(m1, m2){
  const v = forge(m1, m2), L = [
    [5, `(A) lekérdezés [m1 = ${m1}]: 0 ⊕ ${m1} = ${m1}, E(${m1}) = (${m1} + 3) mod 16 = ${v.t1} = t1`],
    [6, `(B) előkészítés: x = t1 XOR m2 = ${v.t1} XOR ${m2} = ${v.x}`],
    [7, `(B) lekérdezés [x = ${v.x}]: 0 ⊕ ${v.x} = ${v.x}, E(${v.x}) = ${v.t2} = t2`],
    [8, `(C) hamis üzenet [${m1}, ${m2}], 1. blokk: 0 ⊕ ${m1} = ${m1}, E(${m1}) = ${v.c1} (= t1, a támadó ismeri)`],
    [8, `(C) 2. blokk: ${v.c1} ⊕ ${m2} = ${v.in2} – ugyanaz az E-bemenet, mint (B)-ben; E(${v.in2}) = ${v.real}`],
    [9, `Összevetés: a [${m1}, ${m2}] címkéje ${v.real} = t2 = ${v.t2} – a hamisítás sikeres, pedig ezt az üzenetet sosem kérdezte le a támadó`]];
  return L.map(([ln, m], i) => Object.assign({}, v, {k: i, line: ln, msg: `${i + 1}. lépés: ${m}`}));
}
function load(){
  const a = +document.getElementById("m1").value, b = +document.getElementById("m2").value;
  document.getElementById("m1v").textContent = a; document.getElementById("m2v").textContent = b;
  setSteps(stepsFor(a, b));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
