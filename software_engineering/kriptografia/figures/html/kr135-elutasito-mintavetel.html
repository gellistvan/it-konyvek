<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elutasító mintavétel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--cell:#fff;--cellhl:#d9d9d9;--cell2:#bdbdbd;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--cell:#262626;--cellhl:#4a4a4a;--cell2:#666;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px;flex:1}
input[type=number]{width:5.5em}
label{display:inline-flex;gap:4px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label>titok s: <input id="s" type="range" min="-3" max="3" value="3"><b id="sv">3</b></label>
<label>B: <input id="B" type="number" min="2" max="20" value="8"></label>
<label>β: <input id="beta" type="number" min="0" max="10" value="3"></label>
<label>minták: <select id="n"><option>100</option><option>1000</option><option selected>5000</option></select></label>
</div><div class="ctl" role="radiogroup" aria-label="Elfogadási szabály">
<label><input type="radio" name="rule" value="nincs"> elutasítás nélkül</label>
<label><input type="radio" name="rule" value="naiv"> naiv: z ∈ [−B, B]</label>
<label><input type="radio" name="rule" value="helyes" checked> helyes: |z| ≤ B − β</label>
<button id="go">Mintavétel</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 295" role="img" aria-label="Hisztogram: a helyes szabállyal s = −3 és s = 3 mellett is ugyanaz az egyenletes eloszlás látszik a −5..5 tartományon."></svg>
<pre id="code" aria-label="Javított kód"></pre>
<p class="small">Szimulált minták (a böngészőben crypto.getRandomValues), nem mérés. A kezdőállapot a statikus ábra rögzített seedű mintája (helyes szabály, s = 3, 5000 minta). A kód a javított rejection_sample: a feltételsor (abs(z) <= B − beta) a helyes szabálynál kiemelve.</p>
<script>
const DATA = {"init": [0, 0, 0, 0, 0, 0, 462, 416, 491, 439, 472, 439, 457, 461, 471, 425, 467, 0, 0, 0, 0, 0, 0], "tries": 7723, "code": ["# OKTATÁSI CÉLRA – NEM ÉLES HASZNÁLATRA", "import secrets", "def rejection_sample(secret, B=8, beta=3, trials=1000):", "    accepted, attempts = [], 0", "    for _ in range(trials):", "        while True:", "            y = secrets.randbelow(2 * B + 1) - B", "            z = y + secret", "            attempts += 1", "            if abs(z) <= B - beta:      # helyes, s-től független tartomány", "                accepted.append(z)", "                break", "    return accepted, trials / attempts"]};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","\u2212");}

function g(id){ return document.getElementById(id); }
const codeEl = g("code");
codeEl.innerHTML = DATA.code.map((l, i) => `<span${i === 9 ? ' class="on"' : ""}>${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("");
let CUR = {cnt: DATA.init, lo: -11, tries: DATA.tries, n: 5000, rule: "helyes", s: 3, B: 8, beta: 3};
function acc(rule, z, B, beta){ return rule === "nincs" ? true : (rule === "naiv" ? (z >= -B && z <= B) : Math.abs(z) <= B - beta); }
function rnd(m){ const u = new Uint32Array(1); const lim = Math.floor(4294967296 / m) * m; do { crypto.getRandomValues(u); } while (u[0] >= lim); return u[0] % m; }
function run(){
  const s = +g("s").value, B = Math.max(2, Math.round(+g("B").value || 8)), beta = Math.max(0, Math.min(B - 1, Math.round(+g("beta").value || 0))),
        n = +g("n").value, rule = document.querySelector("input[name=rule]:checked").value;
  g("B").value = B; g("beta").value = beta;
  const lo = -B - 3, hi = B + 3, cnt = new Array(hi - lo + 1).fill(0); let tries = 0, got = 0;
  while (got < n) { const z = rnd(2 * B + 1) - B + s; tries++; if (acc(rule, z, B, beta)) { cnt[z - lo]++; got++; } }
  CUR = {cnt: cnt, lo: lo, tries: tries, n: n, rule: rule, s: s, B: B, beta: beta}; redraw();
}
function redraw(){
  g("sv").textContent = g("s").value; svg.innerHTML = "";
  const c = CUR, W = 600, x0 = 30, y0 = 250, m = c.cnt.length, bw = W / m, mx = Math.max(...c.cnt, 1);
  el("line", {x1: x0, y1: y0, x2: x0 + W, y2: y0, stroke: css("--line")});
  c.cnt.forEach((v, i) => { const z = c.lo + i, h = v / mx * 210, x = x0 + i * bw;
    el("rect", {x: x + 1, y: y0 - h, width: bw - 2, height: h, fill: css("--cellhl"), stroke: css("--line")});
    if (m <= 30 || z % 5 === 0) el("text", {x: x + bw / 2, y: y0 + 16, "text-anchor": "middle", "font-size": 11}, fmt(z)); });
  [-(c.B - c.beta) - 0.5, (c.B - c.beta) + 0.5].forEach(t => { const x = x0 + (t - c.lo + 0.5) * bw;
    el("line", {x1: x, y1: 30, x2: x, y2: y0, stroke: css("--fg"), "stroke-dasharray": "5 4"}); });
  el("text", {x: x0 + W / 2, y: 22, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, `szaggatott: ±(B − β) = ±${c.B - c.beta}`);
  el("text", {x: x0 + W / 2, y: 284, "text-anchor": "middle", "font-size": 12}, "z");
  let zmin = null, zmax = null; c.cnt.forEach((v, i) => { if (v) { if (zmin === null) zmin = c.lo + i; zmax = c.lo + i; } });
  let ok = 0; for (let y = -c.B; y <= c.B; y++) if (acc(c.rule, y + c.s, c.B, c.beta)) ok++;
  const name = {nincs: "elutasítás nélkül", naiv: "naiv", helyes: "helyes"}[c.rule];
  g("status").textContent = `szabály: ${name}, s = ${fmt(c.s)}, elfogadási arány ${ok}/${2 * c.B + 1} ≈ ${fmt(ok / (2 * c.B + 1), 3)} (mért: ${fmt(c.n / c.tries, 3)}), min z = ${fmt(zmin)}, max z = ${fmt(zmax)}`;
  codeEl.querySelectorAll("span").forEach((sp, i) => sp.classList.toggle("on", i === 9 && c.rule === "helyes"));
}
g("go").onclick = run;
redraw();

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (typeof redraw === "function") redraw(); });
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
