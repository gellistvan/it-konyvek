<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyakoriságelemzéses törés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A rejtett szöveg alatt lépésenként egyre több visszafejtett betű jelenik meg; jobbra a hozzárendelési tábla, alul a gyakorisági oszlopdiagram."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játékpermutáció a 7.2.9 kódjából; a rejtett szöveg ebből számolva (TFUSOLI, EGDDGF). Vastag keret = az adott lépésben kitalált betű; a szürke oszlop a már ismert betű. Egy rejtett szóra kattintva (vagy Enterrel) kiemelődnek az előfordulásai.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: a támadó csak a rejtett szöveget és az angol statisztikát ismeri · ismert 0/18 rejtett betű", "known": {}, "new": []}, {"msg": "1. Ismétlődő hárombetűs szó: ZIT négyszer, önálló szóként → THE; új: Z→T, I→H, T→E · ismert 3/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E"}, "new": ["Z", "I", "T"]}, {"msg": "2. Dupla betűk: STZZTK = ?ETTE? → LETTER; új: S→L, K→R · ismert 5/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R"}, "new": ["S", "K"]}, {"msg": "3. Egybetűs szó: a rejtett T önálló → E (megerősíti a THE-t) · ismert 5/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R"}, "new": []}, {"msg": "4. Kétbetűs szó: OL ZIT ≈ IS THE; új: O→I, L→S · ismert 7/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S"}, "new": ["O", "L"]}, {"msg": "5. A TFUSOLI szó: E??LISH → ENGLISH; új: F→N, U→G · ismert 9/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G"}, "new": ["F", "U"]}, {"msg": "6. A QFR szó: E ?N? THE → E AND THE; új: Q→A, R→D · ismert 11/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G", "Q": "A", "R": "D"}, "new": ["Q", "R"]}, {"msg": "7. A DGLZ szó: ??ST, THE MOST … → MOST; új: D→M, G→O · ismert 13/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G", "Q": "A", "R": "D", "D": "M", "G": "O"}, "new": ["D", "G"]}, {"msg": "8. Az EGDDGF szó: ?OMMON → COMMON; új: E→C · ismert 14/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G", "Q": "A", "R": "D", "D": "M", "G": "O", "E": "C"}, "new": ["E"]}, {"msg": "9. A VGKR szó: ?ORD → WORD; új: V→W · ismert 15/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G", "Q": "A", "R": "D", "D": "M", "G": "O", "E": "C", "V": "W"}, "new": ["V"]}, {"msg": "10. A YKTJXTFZ szó: ?RE??ENT → FREQUENT; új: Y→F, J→Q, X→U · ismert 18/18 rejtett betű", "known": {"Z": "T", "I": "H", "T": "E", "S": "L", "K": "R", "O": "I", "L": "S", "F": "N", "U": "G", "Q": "A", "R": "D", "D": "M", "G": "O", "E": "C", "V": "W", "Y": "F", "J": "Q", "X": "U"}, "new": ["Y", "J", "X"]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LINES = ["ZIT DGLZ YKTJXTFZ STZZTK OF TFUSOLI OL", "ZIT STZZTK T QFR ZIT DGLZ EGDDGF VGKR OL ZIT"], FREQ = [["T", 12], ["Z", 11], ["F", 5], ["G", 5], ["I", 5], ["L", 5], ["D", 4], ["K", 4], ["O", 4], ["S", 3], ["R", 2], ["E", 1], ["J", 1], ["Q", 1], ["U", 1], ["V", 1], ["X", 1], ["Y", 1]], ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let SEL = null;
function render(s){
  svg.setAttribute("viewBox", "0 0 760 430");
  svg.innerHTML = "";
  const cw = 16.5;
  LINES.forEach((line, r) => {
    const y = 18 + r * 62;
    let wordStart = 0;
    const words = line.split(" ");
    let x = 10;
    words.forEach(w => {
      const g = document.createElementNS(NS, "g"); g.setAttribute("style", "cursor:pointer");
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", "Szó: " + w);
      const hit = SEL === w;
      for (let i = 0; i < w.length; i++) {
        const c = w[i], nw = s.new.includes(c), p = s.known[c];
        const rx = x + i * cw;
        const t1 = document.createElementNS(NS, "text"); t1.setAttribute("x", rx + cw/2); t1.setAttribute("y", y + 12);
        t1.setAttribute("text-anchor", "middle"); t1.setAttribute("font-size", 13); t1.setAttribute("fill", css("--muted")); t1.setAttribute("font-family", "monospace"); t1.textContent = c; g.appendChild(t1);
        const rc = document.createElementNS(NS, "rect"); rc.setAttribute("x", rx + 1); rc.setAttribute("y", y + 17); rc.setAttribute("width", cw - 2); rc.setAttribute("height", 24);
        rc.setAttribute("fill", hit ? css("--cellhl") : css("--cell")); rc.setAttribute("stroke", css("--line")); rc.setAttribute("stroke-width", nw ? 3 : 0.8); g.appendChild(rc);
        const t2 = document.createElementNS(NS, "text"); t2.setAttribute("x", rx + cw/2); t2.setAttribute("y", y + 34);
        t2.setAttribute("text-anchor", "middle"); t2.setAttribute("font-size", 14); t2.setAttribute("font-family", "monospace");
        if (nw) t2.setAttribute("font-weight", "bold"); t2.textContent = p || "·"; g.appendChild(t2);
      }
      g.addEventListener("click", () => { SEL = (SEL === w ? null : w); render(s); });
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); SEL = (SEL === w ? null : w); render(s); } });
      svg.appendChild(g);
      x += (w.length + 1) * cw;
    });
  });
  // hozzárendelési tábla
  const ty = 150, tw = 27.5;
  el("text", {x: 10, y: ty - 6, "font-size": 12, fill: css("--muted")}, "Hozzárendelés: rejtett → nyílt (szürke cella = nem fordul elő a szövegben)");
  for (let j = 0; j < 26; j++) {
    const c = ABC[j], x = 12 + j * tw, nw = s.new.includes(c), used = FREQ.some(f => f[0] === c);
    el("text", {x: x + tw/2, y: ty + 14, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, c);
    el("rect", {x: x + 2, y: ty + 19, width: tw - 4, height: 24, fill: used ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": nw ? 3 : 0.8});
    const t = el("text", {x: x + tw/2, y: ty + 36, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, s.known[c] || (used ? "·" : ""));
    if (nw) t.setAttribute("font-weight", "bold");
  }
  // gyakorisági oszlopdiagram
  const by = 410, bh = 12, bw = 40;
  el("text", {x: 10, y: 232, "font-size": 12, fill: css("--muted")}, "Rejtett betűk gyakorisága (darab)" + (SEL ? " · kijelölt szó: " + SEL : " · kattints egy rejtett szóra"));
  FREQ.forEach((f, j) => {
    const x = 14 + j * bw, h = f[1] * bh, known = s.known[f[0]] !== undefined;
    el("rect", {x: x, y: by - h, width: bw - 8, height: h, fill: known ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": s.new.includes(f[0]) ? 3 : 1});
    el("text", {x: x + (bw-8)/2, y: by - h - 4, "text-anchor": "middle", "font-size": 12}, String(f[1]));
    el("text", {x: x + (bw-8)/2, y: by + 16, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, f[0] + (known ? "→" + s.known[f[0]] : ""));
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
