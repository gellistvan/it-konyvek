<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohlig–Hellman</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>p (&lt; 1000) <input id="ip" type="number" min="3" max="997" value="31" style="width:4.8em"></label>
<label>g <input id="ig" type="number" min="2" value="3" style="width:4.5em"></label>
<label>h <input id="ih" type="number" min="1" value="18" style="width:4.5em"></label>
<button id="go">Újraszámolás</button>
<button id="ex2">2. példa (37, 2, 6)</button>
<span id="warn" role="alert" style="color:var(--hl2)"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Pohlig–Hellman: 3^x ≡ 18 (mod 31) három kis DLP-re bomlik (x ≡ 0 mod 2, 2 mod 3, 1 mod 5), a CRT szerint x = 26; a második példában 2^x ≡ 6 (mod 37) számjegyenként x ≡ 3 (mod 4), x ≡ 0 (mod 9), így 27."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított, a fejezet két kidolgozott példájával. A kód a fejezet Python-illusztrációja (rövidítve); saját g-nél a rend n = ord(g), nem feltétlenül p − 1.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 31, "g": 3, "h": 18, "n": 30, "top": "3^x ≡ 18 (mod 31), n = ord(g) = 30 = 2 · 3 · 5", "br": [{"q": 2, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}, {"q": 3, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}, {"q": 5, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}], "cur": -1, "crt": null, "line": 2, "msg": "A rend faktorizálása: n = 30 = 2 · 3 · 5; 3 kis DLP-re bomlik."}, {"p": 31, "g": 3, "h": 18, "n": 30, "top": "3^x ≡ 18 (mod 31), n = ord(g) = 30 = 2 · 3 · 5", "br": [{"q": 2, "e": 1, "gq": 30, "lines": ["g₂ = 30, h₂ = 18^15 = 1", "30^0 = 1"], "res": "x ≡ 0 (mod 2)", "hs": [1], "xs": [0], "ex": [15], "tmp": [0]}, {"q": 3, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}, {"q": 5, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}], "cur": 0, "crt": null, "line": 8, "msg": "q = 2: g₂ = 3^15 mod 31 = 30; h₂ = 18^15 mod 31 = 1, 30^0 = 1 → x ≡ 0 (mod 2)"}, {"p": 31, "g": 3, "h": 18, "n": 30, "top": "3^x ≡ 18 (mod 31), n = ord(g) = 30 = 2 · 3 · 5", "br": [{"q": 2, "e": 1, "gq": 30, "lines": ["g₂ = 30, h₂ = 18^15 = 1", "30^0 = 1"], "res": "x ≡ 0 (mod 2)", "hs": [1], "xs": [0], "ex": [15], "tmp": [0]}, {"q": 3, "e": 1, "gq": 25, "lines": ["g₃ = 25, h₃ = 18^10 = 5", "25^2 = 5"], "res": "x ≡ 2 (mod 3)", "hs": [5], "xs": [2], "ex": [10], "tmp": [0]}, {"q": 5, "e": 1, "gq": null, "lines": [], "res": null, "hs": [], "xs": [], "ex": [], "tmp": []}], "cur": 1, "crt": null, "line": 8, "msg": "q = 3: g₃ = 3^10 mod 31 = 25; h₃ = 18^10 mod 31 = 5, 25^2 = 5 → x ≡ 2 (mod 3)"}, {"p": 31, "g": 3, "h": 18, "n": 30, "top": "3^x ≡ 18 (mod 31), n = ord(g) = 30 = 2 · 3 · 5", "br": [{"q": 2, "e": 1, "gq": 30, "lines": ["g₂ = 30, h₂ = 18^15 = 1", "30^0 = 1"], "res": "x ≡ 0 (mod 2)", "hs": [1], "xs": [0], "ex": [15], "tmp": [0]}, {"q": 3, "e": 1, "gq": 25, "lines": ["g₃ = 25, h₃ = 18^10 = 5", "25^2 = 5"], "res": "x ≡ 2 (mod 3)", "hs": [5], "xs": [2], "ex": [10], "tmp": [0]}, {"q": 5, "e": 1, "gq": 16, "lines": ["g₅ = 16, h₅ = 18^6 = 16", "16^1 = 16"], "res": "x ≡ 1 (mod 5)", "hs": [16], "xs": [1], "ex": [6], "tmp": [0]}], "cur": 2, "crt": null, "line": 8, "msg": "q = 5: g₅ = 3^6 mod 31 = 16; h₅ = 18^6 mod 31 = 16, 16^1 = 16 → x ≡ 1 (mod 5)"}, {"p": 31, "g": 3, "h": 18, "n": 30, "top": "3^x ≡ 18 (mod 31), n = ord(g) = 30 = 2 · 3 · 5", "br": [{"q": 2, "e": 1, "gq": 30, "lines": ["g₂ = 30, h₂ = 18^15 = 1", "30^0 = 1"], "res": "x ≡ 0 (mod 2)", "hs": [1], "xs": [0], "ex": [15], "tmp": [0]}, {"q": 3, "e": 1, "gq": 25, "lines": ["g₃ = 25, h₃ = 18^10 = 5", "25^2 = 5"], "res": "x ≡ 2 (mod 3)", "hs": [5], "xs": [2], "ex": [10], "tmp": [0]}, {"q": 5, "e": 1, "gq": 16, "lines": ["g₅ = 16, h₅ = 18^6 = 16", "16^1 = 16"], "res": "x ≡ 1 (mod 5)", "hs": [16], "xs": [1], "ex": [6], "tmp": [0]}], "cur": -1, "crt": "CRT → x = 26", "line": 12, "msg": "CRT: x ≡ 0 (mod 2), x ≡ 2 (mod 3), x ≡ 1 (mod 5) → x = 26; ellenőrzés: 3^26 mod 31 = 18."}];
const CODE = ["def pohlig_hellman(g, h, p):", "    n = p - 1  # feltesszük, hogy g primitív gyök", "    for q, e in factor(n):", "        temp = 0", "        gamma = pow(g, n // q, p)  # rendje q", "        for j in range(e):", "            exponent = n // (q ** (j + 1))", "            h_j = pow((h * pow(g, -temp, p)) % p, exponent, p)", "            xj = dlog_bruteforce(gamma, h_j, p, q)", "            temp += xj * (q ** j)", "        residues.append(temp % qe); moduli.append(qe)", "    # CRT", "    for ai, mi in zip(residues, moduli): x = (x + ai * Mi * inv) % M", "    return x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SUBS="₀₁₂₃₄₅₆₇₈₉"; function sb(k){return String(k).split("").map(c=>SUBS[+c]).join("");}
function pw(x,e,m){let r=1;x%=m;if(x<0)x+=m;while(e>0){if(e&1)r=r*x%m;x=x*x%m;e=Math.floor(e/2);}return r;}
function ordOf(g,p){let r=1,x=g%p;while(x!==1){x=x*g%p;r++;if(r>p)return -1;}return r;}
function isPrime(n){if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;}
function inv(a,m){a%=m;for(let x=1;x<m;x++)if(a*x%m===1)return x;return 0;}
function factorN(n){const out=[];let d=2;while(d*d<=n){if(n%d===0){let e=0;while(n%d===0){n/=d;e++;}out.push([d,e]);}d+= d===2?1:2;}if(n>1)out.push([n,1]);return out;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function phSteps(p,g,h){ const n=ordOf(g,p), fac=factorN(n);
  const fs=fac.map(([q,e])=>e>1?`${q}^${e}`:String(q)).join(" · "), top=`${g}^x ≡ ${h} (mod ${p}), n = ord(g) = ${n} = ${fs}`;
  const br=fac.map(([q,e])=>({q:q,e:e,gq:null,lines:[],res:null,hs:[],xs:[],ex:[],tmp:[]})), base={p:p,g:g,h:h,n:n,top:top};
  const steps=[Object.assign({},base,{br:clone(br),cur:-1,crt:null,line:2,msg:`A rend faktorizálása: n = ${n} = ${fs}; ${fac.length} kis DLP-re bomlik.`})];
  const res=[],mods=[];
  fac.forEach(([q,e],bi)=>{ const gq=pw(g,n/q,p); br[bi].gq=gq; let temp=0;
    for(let j=0;j<e;j++){ const expo=n/Math.pow(q,j+1), ginv=pw(inv(g,p),temp,p), hj=pw(h*ginv%p,expo,p);
      let xj=0; while(pw(gq,xj,p)!==hj) xj++; let msg; br[bi].hs.push(hj); br[bi].xs.push(xj); br[bi].ex.push(expo); br[bi].tmp.push(temp);
      if(e===1){ br[bi].lines.push(`g${sb(q)} = ${gq}, h${sb(q)} = ${h}^${expo} = ${hj}`); br[bi].lines.push(`${gq}^${xj} = ${hj}`);
        msg=`q = ${q}: g${sb(q)} = ${g}^${n/q} mod ${p} = ${gq}; h${sb(q)} = ${h}^${expo} mod ${p} = ${hj}, ${gq}^${xj} = ${hj} → x ≡ ${xj} (mod ${q})`; }
      else { const hb= temp===0?`${h}`:`(${h}·${g}^−${temp})`; br[bi].lines.push(`h⁽${j}⁾ = ${hb}^${expo} = ${hj} → x${sb(j)} = ${xj}`);
        msg=`q = ${q}, ${j+1}. számjegy: g${sb(q)} = ${gq}; h⁽${j}⁾ = ${hb}^${expo} mod ${p} = ${hj}, ${gq}^${xj} = ${hj} → x${sb(j)} = ${xj}`; }
      temp+=xj*Math.pow(q,j); if(e===1) br[bi].res=`x ≡ ${temp} (mod ${q})`;
      steps.push(Object.assign({},base,{br:clone(br),cur:bi,crt:null,line:8,msg:msg})); }
    const qe=Math.pow(q,e);
    if(e>1){ br[bi].res=`x ≡ ${temp} (mod ${qe})`; steps.push(Object.assign({},base,{br:clone(br),cur:bi,crt:null,line:10,msg:`q = ${q}: a számjegyekből x ≡ ${temp} (mod ${qe}).`})); }
    res.push(temp%qe); mods.push(qe); });
  let M=1; mods.forEach(m=>M*=m); let x=0; res.forEach((a,i)=>{const Mi=M/mods[i]; x=(x+a*Mi%M*inv(Mi%mods[i],mods[i]))%M;});
  const sysm=res.map((a,i)=>`x ≡ ${a} (mod ${mods[i]})`).join(", ");
  steps.push(Object.assign({},base,{br:clone(br),cur:-1,crt:`CRT → x = ${x}`,line:12,msg:`CRT: ${sysm} → x = ${x}; ellenőrzés: ${g}^${x} mod ${p} = ${pw(g,x,p)}.`}));
  return steps; }
function render(s){
  const nb=s.br.length, bw=Math.max(170, Math.min(250, 740/nb-10)), W=Math.max(760, nb*(bw+12)+20);
  const maxL=Math.max(...s.br.map(b=>b.lines.length+2)), bh=30+maxL*19, H=150+bh+80;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
  const hl=css("--hl"), hl2=css("--hl2"), mu=css("--muted"), ln=css("--line");
  el("rect",{x:W/2-260,y:10,width:520,height:36,rx:8,fill:css("--cell"),stroke:ln});
  el("text",{x:W/2,y:33,"text-anchor":"middle","font-size":15},s.top);
  const y0=110;
  s.br.forEach((b,i)=>{ const cx=10+(i+0.5)*(W-20)/nb, x=cx-bw/2, on=(i===s.cur), done=b.res!==null;
    el("line",{x1:W/2,y1:46,x2:cx,y2:y0-4,stroke:ln,"stroke-width":1.3});
    el("path",{d:`M${cx},${y0-2} l-5,-10 l10,0 z`,fill:ln});
    el("rect",{x:x,y:y0,width:bw,height:bh,rx:8,fill:on?css("--cellhl"):css("--cell"),stroke:on?hl:ln,"stroke-width":on?3:1.2});
    el("text",{x:cx,y:y0+20,"text-anchor":"middle","font-size":14,"font-weight":"bold"},b.e>1?`q^e = ${b.q}^${b.e}`:`q = ${b.q}`);
    b.lines.forEach((t,k)=>el("text",{x:cx,y:y0+42+k*19,"text-anchor":"middle","font-size":12.5},t));
    if(done){ el("text",{x:cx,y:y0+42+b.lines.length*19+4,"text-anchor":"middle","font-size":14,"font-weight":"bold",fill:hl},b.res);
      if(s.crt){ el("line",{x1:cx,y1:y0+bh,x2:W/2,y2:y0+bh+44,stroke:ln,"stroke-width":5}); el("line",{x1:cx,y1:y0+bh,x2:W/2,y2:y0+bh+44,stroke:css("--bg")||"#fff","stroke-width":2}); } } });
  if(s.crt){ el("rect",{x:W/2-140,y:y0+bh+44,width:280,height:38,rx:8,fill:css("--cellhl"),stroke:hl,"stroke-width":3});
    el("text",{x:W/2,y:y0+bh+69,"text-anchor":"middle","font-size":17,"font-weight":"bold"},s.crt); }
}
function go(p,g,h){ const w=document.getElementById("warn");
  if(!(isPrime(p)&&p<1000)){ w.textContent="p legyen 1000-nél kisebb prím."; return; }
  if(!(g>1&&g<p&&h>=1&&h<p)){ w.textContent="1 < g < p és 1 ≤ h < p kell."; return; }
  const n=ordOf(g,p); let ok=false; for(let k=0;k<n;k++) if(pw(g,k,p)===h){ok=true;break;}
  if(!ok){ w.textContent=`h = ${h} nincs a ⟨${g}⟩ részcsoportban (ord g = ${n}).`; return; }
  w.textContent = n===p-1 ? "" : `Megjegyzés: ord(g) = ${n} < p − 1; a felbontás az n = ord(g) rendre történik.`;
  setSteps(phSteps(p,g,h)); }
document.getElementById("go").addEventListener("click",()=>go(+document.getElementById("ip").value,+document.getElementById("ig").value,+document.getElementById("ih").value));
document.getElementById("ex2").addEventListener("click",()=>{ document.getElementById("ip").value=37; document.getElementById("ig").value=2; document.getElementById("ih").value=6; go(37,2,6); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
