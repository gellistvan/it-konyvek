<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCG-állapotvisszafejtés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>m <input id="im" type="number" value="256" style="width:6em" aria-label="m"></label><label>a <input id="ia" type="number" value="45" style="width:5em" aria-label="a"></label><label>c <input id="ic" type="number" value="17" style="width:5em" aria-label="c"></label><label>X0 <input id="ix" type="number" value="100" style="width:5em" aria-label="X0"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három LCG-kimenet: 165, 18, 59; különbségek 109 és 41; 109 inverze 101; a = 45, c = 17; a negyedik kimenet 112-ként megjósolható."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 6.4.7 támadó kódrésze; a fejezet saját játék-LCG-jén (m = 256, a = 45, c = 17, X0 = 100). Számított példa, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 0, "msg": "1. Ismert kimenetek: X1 = 165, X2 = 18, X3 = 59 (m = 256); X4 = ?", "d": {"m": 256, "x": [165, 18, 59, 112], "d0": 109, "d1": 41, "inv": 101, "a": 45, "c": 17, "pred": 112, "ok": true}}, {"k": 1, "line": 2, "msg": "2. Különbségek: d0 = 18 − 165 ≡ 109, d1 = 59 − 18 ≡ 41 (mod 256); d1 ≡ a·d0", "d": {"m": 256, "x": [165, 18, 59, 112], "d0": 109, "d1": 41, "inv": 101, "a": 45, "c": 17, "pred": 112, "ok": true}}, {"k": 2, "line": 4, "msg": "3. Inverz: d0^(−1) = 109^(−1) mod 256 = 101", "d": {"m": 256, "x": [165, 18, 59, 112], "d0": 109, "d1": 41, "inv": 101, "a": 45, "c": 17, "pred": 112, "ok": true}}, {"k": 3, "line": 8, "msg": "4. a = 41·101 mod 256 = 45, c = 18 − 45·165 mod 256 = 17", "d": {"m": 256, "x": [165, 18, 59, 112], "d0": 109, "d1": 41, "inv": 101, "a": 45, "c": 17, "pred": 112, "ok": true}}, {"k": 4, "line": 11, "msg": "5. Megjósolt: 112, valós: 112", "d": {"m": 256, "x": [165, 18, 59, 112], "d0": 109, "d1": 41, "inv": 101, "a": 45, "c": 17, "pred": 112, "ok": true}}];
const CODE = ["x0, x1, x2 = kimenetek[0], kimenetek[1], kimenetek[2]", "diff0 = (x1 - x0) % m", "diff1 = (x2 - x1) % m", "try:", "    a_talalat = (diff1 * pow(diff0, -1, m)) % m", "except ValueError:", "    print(\"diff0 nem invertálható, próbálj más kimenetet\")", "else:", "    c_talalat = (x1 - a_talalat * x0) % m", "    print(\"Visszaállított a:\", a_talalat, \"c:\", c_talalat)", "    x3_valos = (a * x2 + c) % m", "    x3_josolt = (a_talalat * x2 + c_talalat) % m"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = "";
  const D = s.d, kk = s.k;
  function bx(x, y, w, h, t, sty, on){ el("rect", {x, y, width: w, height: h, rx: 6, fill: css("--cell"), stroke: css("--line"),
      "stroke-width": sty === "bold" ? 3.5 : 1.4, "stroke-dasharray": sty === "dash" ? "6 4" : "", opacity: on ? 1 : 0.25});
    el("text", {x: x + w / 2, y: y + h / 2 + 5, "text-anchor": "middle", "font-size": 15, opacity: on ? 1 : 0.25}, t); }
  const xs = [30, 160, 290, 420];
  for (let i = 0; i < 4; i++) bx(xs[i], 20, 110, 40, i < 3 ? `X${i + 1} = ${D.x[i]}` : (kk >= 4 && D.ok ? `X4 = ${D.pred}` : "X4 = ?"), i < 3 ? "solid" : "bold", true);
  bx(95, 100, 110, 40, `d0 = ${D.d0}`, "dash", kk >= 1); bx(225, 100, 110, 40, `d1 = ${D.d1}`, "dash", kk >= 1);
  if (kk >= 1) { el("text", {x: 350, y: 116, "font-size": 13}, "d1 ≡ a · d0 (mod " + D.m + ")"); el("text", {x: 350, y: 134, "font-size": 12, fill: css("--muted")}, "a különbségek mértani sorozata"); }
  bx(30, 175, 160, 40, D.inv === null ? "d0⁻¹ nem létezik" : `d0⁻¹ = ${D.inv}`, "dash", kk >= 2);
  bx(205, 175, 160, 40, D.ok ? `a = ${D.a}, c = ${D.c}` : "a, c = ?", "dash", kk >= 3);
  bx(380, 175, 150, 40, D.ok ? `jóslat: ${D.pred}` : "jóslat: –", "bold", kk >= 4);
  if (kk >= 4 && D.ok) el("text", {x: 455, y: 232, "text-anchor": "middle", "font-size": 12}, `valós: ${D.x[3]}` + (D.x[3] === D.pred ? " ✓" : ""));
  el("text", {x: 280, y: 280, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "folytonos = ismert · szaggatott = számított · vastag = jóslat · m = " + D.m);
}
function egInv(x, m){ let [r0, r1, s0, s1] = [((x % m) + m) % m, m, 1, 0]; while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return r0 === 1 ? ((s0 % m) + m) % m : null; }
function load(){
  const g = id => +document.getElementById(id).value, e = document.getElementById("err");
  const m = g("im"), a = g("ia"), c = g("ic"), x0 = g("ix");
  if (![m, a, c, x0].every(Number.isInteger) || m < 2 || m > 1000000 || a < 0 || c < 0 || x0 < 0) { e.textContent = "Adjon meg egészeket: 2 ≤ m ≤ 10^6, a, c, X0 ≥ 0."; return; }
  e.textContent = "";
  const x = []; let X = x0; for (let i = 0; i < 4; i++) { X = (a * X + c) % m; x.push(X); }
  const d0 = ((x[1] - x[0]) % m + m) % m, d1 = ((x[2] - x[1]) % m + m) % m, inv = egInv(d0, m);
  const D = {m, x, d0, d1, inv, ok: inv !== null};
  if (D.ok) { D.a = d1 * inv % m; D.c = (((x[1] - D.a * x[0]) % m) + m) % m; D.pred = (D.a * x[2] + D.c) % m; }
  const st = [{k: 0, line: 0, d: D, msg: `1. Ismert kimenetek: X1 = ${x[0]}, X2 = ${x[1]}, X3 = ${x[2]} (m = ${m}); X4 = ?`},
              {k: 1, line: 2, d: D, msg: `2. Különbségek: d0 = ${x[1]} − ${x[0]} ≡ ${d0}, d1 = ${x[2]} − ${x[1]} ≡ ${d1} (mod ${m}); d1 ≡ a·d0`}];
  if (!D.ok) st.push({k: 2, line: 6, d: D, msg: `3. d0 = ${d0} nem invertálható mod ${m}, válassz más kimenetet`});
  else st.push({k: 2, line: 4, d: D, msg: `3. Inverz: d0^(−1) = ${d0}^(−1) mod ${m} = ${inv}`},
               {k: 3, line: 8, d: D, msg: `4. a = ${d1}·${inv} mod ${m} = ${D.a}, c = ${x[1]} − ${D.a}·${x[0]} mod ${m} = ${D.c}`},
               {k: 4, line: 11, d: D, msg: `5. Megjósolt: ${D.pred}, valós: ${x[3]}`});
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
