<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rho ütközéskeresés Floyd-mutatókkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját x0 (0–65535): <input id="x0" type="number" min="0" max="65535" value="1" style="width:7em" aria-label="Saját kezdőérték"></label><button onclick="load()">Újraszámolás</button><button onclick="document.getElementById('x0').value=1;load()">Alap: x0 = 1</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Görög rho betű alakú gráf: egyenes farok, amely egy körbe torkollik; a torkolat két bejövő éle ütközést jelöl."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

}

// ---- szinkron SHA-256 (FIPS 180-4), hogy file:// és iframe alatt is működjön ----
const KS = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

const SUF = [124,114,104,111,124];   // b'|rho|'

let SEQ = [1, 54133, 25215, 56379, 3780, 47653, 10955, 30039, 18467, 36713, 5155, 22123, 17738, 55891, 44779, 49068, 60444, 52660, 51210, 49586, 47227, 24110, 49623, 35563, 59381, 45578, 10319, 40978, 23996, 58808, 35605, 35581, 29875, 53385, 28988, 64723, 41073, 12592, 54406, 49343, 3101, 29742, 30044, 3770, 22702, 10798, 7702, 61152, 17802, 60556, 1071, 50715, 32259, 37196, 17774, 12506, 36120, 63803, 59486, 7720, 50596, 34991, 8726, 31840, 30362, 30469, 25556, 57940, 18874, 1256, 22507, 53265, 13819, 54600, 54491, 36516, 53055, 8119, 40523, 23480, 33237, 62956, 24035, 5806, 61415, 30947, 42825, 48515, 22263, 48591, 21288, 44224, 2659, 50738, 9047, 11939, 36197, 16110, 36460, 28527, 53874, 54241, 45330, 53826, 36500, 17302, 6818, 8244, 64305, 45908, 55192, 5398, 47667, 21295, 57229, 42457, 32418], MU = 14, LAM = 103;

  const st = [{ph: 0, t: 0, h: 0, line: 1, msg: `Kezdet: T = Hr = x0 = ${x0} (${h4(x0)})`}];
  let t = 0, h = 0, i = 0;

    t = adv(t, 1); h = adv(h, 2); i++;

function pt(i){
  const cx = 360, cy = 135, R = 105;
  if (i >= MU) { const a = 2 * Math.PI * (i - MU) / LAM; return [cx + R * Math.sin(a), cy + R * Math.cos(a)]; }

  return [ex - 0.9 * L * s, ey + 0.15 * L * s];
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const N = MU + LAM;
  for (let i = 0; i < N; i++) {
    const [x1, y1] = pt(i), [x2, y2] = pt(i + 1 < N ? i + 1 : MU);
    el("line", {x1, y1, x2, y2, stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": i >= MU ? "4 3" : ""});
  }
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i);
    el("circle", {cx: x, cy: y, r: i === MU ? 6 : 2.6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1});
    if (i === MU) el("circle", {cx: x, cy: y, r: 9, fill: "none", stroke: css("--line"), "stroke-width": s.ent ? 2.5 : 1});
  }
  if (s.tp && MU > 0) { const [x, y] = pt(MU - 1); el("polygon", {points: `${x},${y-9} ${x-8},${y+6} ${x+8},${y+6}`, fill: css("--hl2"), stroke: css("--line")}); el("text", {x: x - 10, y: y - 12, "text-anchor": "end", "font-size": 12}, "farokbeli előd " + SEQ[MU - 1]); }

  el("text", {x: tx, y: ty - 11, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "T");
  el("polygon", {points: `${hx_},${hy-9} ${hx_+9},${hy} ${hx_},${hy+9} ${hx_-9},${hy}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});

  const [x0p, y0p] = pt(0);
  el("text", {x: x0p - 12, y: y0p + 4, "text-anchor": "end", "font-size": 12}, "x0 = " + SEQ[0]);
  el("text", {x: 12, y: 22, "font-size": 13}, `μ = ${MU} (farok), λ = ${LAM} (ciklus)`);
  el("text", {x: 12, y: 42, "font-size": 11, fill: css("--muted")}, "T = teknős (kitöltött kör), Hr = nyúl (rombusz)");

}
function load(){
  const v = Number(document.getElementById("x0").value), e = document.getElementById("err");
  if (!Number.isInteger(v) || v < 0 || v > 65535) { e.textContent = "0 és 65535 közötti egész x0 adható meg."; return; }
  e.textContent = "";
  const r = trace(v); SEQ = r[0]; MU = r[1]; LAM = r[2]; setSteps(r[3]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
