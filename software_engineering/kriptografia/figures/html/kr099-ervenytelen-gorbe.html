<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Érvénytelen görbés támadás: maradékgyűjtés és CRT</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>titkos s (1–6): <input id="sin" type="number" min="1" max="6" value="5" style="width:4em"></label><button id="go">Újraszámol</button><span id="emsg" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két érvénytelen görbe pontjai mod 23, kiemelve a 6- és 5-rendű pontok ciklusát; a próbálgatás s mod 6 = 5 és s mod 5 = 0 maradékot ad, a CRT s = 5-öt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 23, a = 1, a megbeszélt görbe b = 1 (#E = 28). A „szerver” szimulált: a könyv saját játékparamétereivel, b ellenőrzése nélkül számol [s]P'-t. Számított, kis játékparaméter.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ci": 0, "ph": "send", "tk": -1, "res": [], "line": 1, "msg": "1. érvénytelen görbe (b' = 2): a támadó a P'1 = (0, 5) pontot küldi; rendje 6. A szerver nem ellenőrzi a görbe-egyenletet."}, {"ci": 0, "ph": "resp", "tk": -1, "res": [], "R": "(0, 18)", "line": 1, "msg": "A szerver válasza R = [s]P'1 = (0, 18) (a játékmodellben a protokoll viselkedéséből azonosítható)."}, {"ci": 0, "ph": "try", "tk": 0, "hit": false, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 0: [0]P'1 = O ≠ R"}, {"ci": 0, "ph": "try", "tk": 1, "hit": false, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 1: [1]P'1 = (0, 5) ≠ R"}, {"ci": 0, "ph": "try", "tk": 2, "hit": false, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 2: [2]P'1 = (3, 20) ≠ R"}, {"ci": 0, "ph": "try", "tk": 3, "hit": false, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 3: [3]P'1 = (22, 0) ≠ R"}, {"ci": 0, "ph": "try", "tk": 4, "hit": false, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 4: [4]P'1 = (3, 3) ≠ R"}, {"ci": 0, "ph": "try", "tk": 5, "hit": true, "res": [], "R": "(0, 18)", "line": 3, "msg": "Próba k = 5: [5]P'1 = (0, 18) = R ✓"}, {"ci": 0, "ph": "res", "tk": 5, "hit": true, "res": [[5, 6]], "R": "(0, 18)", "line": 4, "msg": "s mod 6 = 5"}, {"ci": 1, "ph": "send", "tk": -1, "res": [[5, 6]], "line": 1, "msg": "2. érvénytelen görbe (b' = 9): a támadó a P'2 = (3, 4) pontot küldi; rendje 5. A szerver nem ellenőrzi a görbe-egyenletet."}, {"ci": 1, "ph": "resp", "tk": -1, "res": [[5, 6]], "R": "O", "line": 1, "msg": "A szerver válasza R = [s]P'2 = O (a játékmodellben a protokoll viselkedéséből azonosítható)."}, {"ci": 1, "ph": "try", "tk": 0, "hit": true, "res": [[5, 6]], "R": "O", "line": 3, "msg": "Próba k = 0: [0]P'2 = O = R ✓"}, {"ci": 1, "ph": "res", "tk": 0, "hit": true, "res": [[5, 6], [0, 5]], "R": "O", "line": 5, "msg": "s mod 5 = 0"}, {"ci": -1, "ph": "crt", "tk": -1, "res": [[5, 6], [0, 5]], "line": 6, "x": 5, "msg": "CRT: s ≡ 5 (mod 30) → s = 5 (mivel 30 > 7 = az alcsoport rendje, s egyértelmű)"}];
const CODE = ["def maradek(P_kis, d, b2):", "    R = szerver(P_kis)                   # [s]P' – a szerver nem ellenőrzi a görbét", "    for k in range(d):", "        if mul(k, P_kis, b2) == R: return k", "r1 = maradek((0, 5), 6, b2=2)            # s mod 6", "r2 = maradek((3, 4), 5, b2=9)            # s mod 5", "s  = crt([r1, r2], [6, 5])               # 6·5 = 30 > 7"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function md(x, m){ return ((x % m) + m) % m; }
function minv(x, m){ x = md(x, m); for (let t = 1; t < m; t++) if ((x * t) % m === 1) return t; return null; }
function ecAdd(P, Q, p, a){
  if (P === null) return Q; if (Q === null) return P;
  const [x1, y1] = P, [x2, y2] = Q;
  if (x1 === x2 && md(y1 + y2, p) === 0) return null;
  let lam;
  if (x1 === x2 && y1 === y2) lam = md((3 * x1 * x1 + a) * minv(2 * y1, p), p);
  else lam = md((y2 - y1) * minv(x2 - x1, p), p);
  const x3 = md(lam * lam - x1 - x2, p);
  return [x3, md(lam * (x1 - x3) - y1, p)];
}
function ecMul(n, P, p, a){ let R = null; for (const b of n.toString(2)) { R = ecAdd(R, R, p, a); if (b === "1") R = ecAdd(R, P, p, a); } return n > 0 ? R : null; }
function fp(P){ return P === null ? "O" : "(" + P[0] + ", " + P[1] + ")"; }
const CURV = [{"b": 2, "P": [0, 5], "d": 6, "pts": [[0, 5], [0, 18], [1, 2], [1, 21], [2, 9], [2, 14], [3, 3], [3, 20], [4, 1], [4, 22], [8, 4], [8, 19], [9, 2], [9, 21], [10, 0], [13, 2], [13, 21], [14, 0], [19, 7], [19, 16], [20, 8], [20, 15], [22, 0]]}, {"b": 9, "P": [3, 4], "d": 5, "pts": [[0, 3], [0, 20], [3, 4], [3, 19], [4, 10], [4, 13], [5, 1], [5, 22], [6, 1], [6, 22], [8, 0], [12, 1], [12, 22], [15, 8], [15, 15], [16, 2], [16, 21], [20, 5], [20, 18]]}];
const CP = 23, CA = 1;
function attackJS(s){
  const st = [], res = [];
  CURV.forEach((c, ci) => {
    const cyc = []; for (let j = 0; j < c.d; j++) cyc.push(j ? ecMul(j, c.P, CP, CA) : null);
    const R = ecMul(s, c.P, CP, CA);
    st.push({ci: ci, ph: "send", tk: -1, res: res.slice(), line: 1, msg: (ci + 1) + ". érvénytelen görbe (b' = " + c.b + "): a támadó a P'" + (ci + 1) + " = " + fp(c.P) + " pontot küldi; rendje " + c.d + ". A szerver nem ellenőrzi a görbe-egyenletet."});
    st.push({ci: ci, ph: "resp", tk: -1, res: res.slice(), R: fp(R), line: 1, msg: "A szerver válasza R = [s]P'" + (ci + 1) + " = " + fp(R) + " (a játékmodellben a protokoll viselkedéséből azonosítható)."});
    let found = null;
    for (let t = 0; t < c.d; t++){
      const hit = fp(cyc[t]) === fp(R);
      st.push({ci: ci, ph: "try", tk: t, hit: hit, res: res.slice(), R: fp(R), line: 3, msg: "Próba k = " + t + ": [" + t + "]P'" + (ci + 1) + " = " + fp(cyc[t]) + (hit ? " = R ✓" : " ≠ R")});
      if (hit) { found = t; break; }
    }
    res.push([found, c.d]);
    st.push({ci: ci, ph: "res", tk: found, hit: true, res: res.slice(), R: fp(R), line: 4 + ci, msg: "s mod " + c.d + " = " + found});
  });
  let x = 0; while (!res.every(([r, d]) => x % d === r)) x++;
  st.push({ci: -1, ph: "crt", tk: -1, res: res.slice(), line: 6, x: x, msg: "CRT: s ≡ " + x + " (mod 30) → s = " + x + (x < 7 ? " (mivel 30 > 7 = az alcsoport rendje, s egyértelmű)" : "")});
  return st;
}
document.getElementById("go").onclick = () => {
  const v = parseInt(document.getElementById("sin").value, 10), em = document.getElementById("emsg");
  if (!(v >= 1 && v <= 6)) { em.textContent = "s legyen 1 és 6 között."; return; }
  em.textContent = ""; setSteps(attackJS(v));
};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 360");
  const x0 = 40, y0 = 330, u = 13;
  const X = x => x0 + x * u, Y = y => y0 - y * u;
  el("rect", {x: X(-0.5), y: Y(22.5), width: 23 * u, height: 23 * u, fill: "none", stroke: css("--muted"), "stroke-width": 0.6});
  [0, 5, 10, 15, 20].forEach(t => { el("text", {x: X(t), y: y0 + 18, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t)); el("text", {x: x0 - 14, y: Y(t) + 4, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t)); });
  CURV.forEach((c, ci) => {
    const act = s.ci === ci;
    const cyc = []; for (let j = 1; j < c.d; j++) cyc.push(ecMul(j, c.P, CP, CA));
    const inCyc = q => cyc.some(z => z !== null && z[0] === q[0] && z[1] === q[1]);
    c.pts.forEach(q => {
      const big = inCyc(q), r = big ? 6 : 3, op = act || s.ci === -1 ? 1 : 0.35;
      if (ci === 0) el("circle", {cx: X(q[0]), cy: Y(q[1]), r: r, fill: big ? css("--cell") : "none", stroke: css("--line"), "stroke-width": big ? 1.6 : 0.6, opacity: op});
      else el("polygon", {points: [X(q[0]), Y(q[1]) - r - 1, X(q[0]) - r, Y(q[1]) + r - 1, X(q[0]) + r, Y(q[1]) + r - 1].join(" "), fill: big ? css("--fg") : "none", stroke: css("--line"), "stroke-width": big ? 1.2 : 0.6, opacity: op});
    });
    if (act && s.tk > 0) { const q = ecMul(s.tk, c.P, CP, CA); if (q) el("circle", {cx: X(q[0]), cy: Y(q[1]), r: 11, fill: "none", stroke: css("--hl2"), "stroke-width": 3}); }
    if (act && s.R && s.R !== "O") { const q = s.R.slice(1, -1).split(", ").map(Number); el("rect", {x: X(q[0]) - 10, y: Y(q[1]) - 10, width: 20, height: 20, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "3 2"}); }
  });
  el("text", {x: 40, y: 14, "font-size": 12}, "○ b' = 2 (rend 6)   △ b' = 9 (rend 5); nagy jel: ⟨P'⟩");
  const tx = 370;
  el("text", {x: tx, y: 34, "font-size": 14, "font-weight": "bold"}, "Maradékgyűjtés");
  CURV.forEach((c, ci) => {
    const y = 56 + ci * 112, act = s.ci === ci;
    el("rect", {x: tx, y: y, width: 380, height: 98, fill: act ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": act ? 2.5 : 1});
    el("text", {x: tx + 10, y: y + 20, "font-size": 13, "font-weight": "bold"}, (ci + 1) + ". görbe: b' = " + c.b + ", P'" + (ci + 1) + " = " + fp(c.P) + ", rend " + c.d);
    for (let t = 0; t < c.d; t++){
      const done = s.ci > ci || s.ci === -1 || (act && t <= s.tk && s.ph !== "send" && s.ph !== "resp");
      const r = s.res[ci] || (act && s.ph === "res" ? [s.tk] : null);
      const hit = (r && r[0] === t) || (act && s.ph === "try" && s.hit && t === s.tk);
      el("rect", {x: tx + 10 + t * 40, y: y + 32, width: 34, height: 26, fill: hit ? css("--fg") : "none", stroke: css("--line"), "stroke-dasharray": done ? "none" : "3 3"});
      el("text", {x: tx + 27 + t * 40, y: y + 50, "text-anchor": "middle", "font-size": 13, fill: hit ? css("--bg") : css("--fg")}, "k=" + t);
    }
    const rr = s.res[ci];
    el("text", {x: tx + 10, y: y + 84, "font-size": 13}, rr ? "s mod " + c.d + " = " + rr[0] : (act && s.R ? "R = " + s.R : "…"));
  });
  el("text", {x: tx, y: 300, "font-size": 14, "font-weight": s.ph === "crt" ? "bold" : "normal"}, s.ph === "crt" ? "CRT: s ≡ " + s.x + " (mod 30) → s = " + s.x : "CRT: …");
  el("text", {x: tx, y: 324, "font-size": 12, fill: css("--muted")}, "szaggatott keret: a szerver válasza; narancs kör: aktuális próba");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
