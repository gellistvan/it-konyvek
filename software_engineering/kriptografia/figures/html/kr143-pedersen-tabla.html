<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedersen-elkötelezés: nyitások táblája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#8a8a8a;--sc-hlf:#23384f;--sc-hl2f:#4d3020;--sc-ok:#7fd08f;--sc-err:#ff7b7b;--sc-okf:#1f3b24;--sc-errf:#4a2222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
input[type=number]{width:4.5em;font:inherit}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre.panel{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.panel span{display:block;padding:0 4px}
pre.panel span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Választás">
  <label>Kiválasztott C: <select id="csel"></select></label>
  <button id="clr">Kijelölés törlése</button>
  <span class="small">Kattints (vagy Tab + Enter) két azonos C-jű cellára: a két nyitásból α kiszámolható.</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 560" role="img" aria-label="11×11-es tábla: sorok m, oszlopok r, cellában C = 2 a m-ediken szor 3 az r-ediken mod 23"></svg>
<pre class="panel" id="der" aria-label="α kiszámítása"></pre>

<p class="small">Játékcsoport: p = 23, q = 11, g = 2, h = 3; itt α = log₂3 = 8 ismert, ezért a kötés is törhető – valódi csoportban α-t senki sem ismerheti. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const SC_COL = {fg:"--fg", muted:"--muted", bg:"--bg", g1:"--sc-g1", g2:"--sc-g2", g3:"--sc-g3", hl:"--hl", hl2:"--hl2",
  hlf:"--sc-hlf", hl2f:"--sc-hl2f", ok:"--sc-ok", err:"--sc-err", okf:"--sc-okf", errf:"--sc-errf"};
const SC_DASH = {solid:"", dash:"6 4", dot:"1.5 3"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML = ["fg","muted","hl","hl2","g3","ok","err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//":"h-sl", "\\\\":"h-bs", "..":"h-dt", "xx":"h-xx"};
function scDraw(prims){
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    const lw = st.lw === undefined ? 1.2 : st.lw, dash = SC_DASH[st.ls || "solid"];
    if (p[0] === "rect" || p[0] === "circ") {
      const a = p[0] === "rect" ? {x:p[1], y:p[2], width:p[3], height:p[4]} : {cx:p[1], cy:p[2], r:p[3]};
      Object.assign(a, {fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw});
      if (st.rx) a.rx = st.rx;
      if (dash) a["stroke-dasharray"] = dash;
      el(p[0] === "rect" ? "rect" : "circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) { const b = Object.assign({}, a, {fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"}); el(p[0] === "rect" ? "rect" : "circle", b); }
    } else if (p[0] === "poly") {
      const a = {points: p[1].map(q => q.join(",")).join(" "), fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      el("polygon", a);
    } else if (p[0] === "line") {
      const c = st.color || "fg";
      const a = {x1:p[1], y1:p[2], x2:p[3], y2:p[4], stroke: scCol(c), "stroke-width": lw};
      if (dash) a["stroke-dasharray"] = dash;
      if (st.arrow) a["marker-end"] = `url(#scah-${SC_COL[c] ? c : "fg"})`;
      el("line", a);
    } else if (p[0] === "text") {
      const a = {x:p[1], y:p[2], "font-size": st.size || 16, "text-anchor": st.anchor || "start", fill: scCol(st.color, "fg")};
      if (st.weight) a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,monospace";
      el("text", a, p[3]);
    }
  }
}

const DATA = {"T": [[1, 3, 9, 4, 12, 13, 16, 2, 6, 18, 8], [2, 6, 18, 8, 1, 3, 9, 4, 12, 13, 16], [4, 12, 13, 16, 2, 6, 18, 8, 1, 3, 9], [8, 1, 3, 9, 4, 12, 13, 16, 2, 6, 18], [16, 2, 6, 18, 8, 1, 3, 9, 4, 12, 13], [9, 4, 12, 13, 16, 2, 6, 18, 8, 1, 3], [18, 8, 1, 3, 9, 4, 12, 13, 16, 2, 6], [13, 16, 2, 6, 18, 8, 1, 3, 9, 4, 12], [3, 9, 4, 12, 13, 16, 2, 6, 18, 8, 1], [6, 18, 8, 1, 3, 9, 4, 12, 13, 16, 2], [12, 13, 16, 2, 6, 18, 8, 1, 3, 9, 4]], "SUB": [1, 2, 3, 4, 6, 8, 9, 12, 13, 16, 18]};

const $ = id => document.getElementById(id);
const T = DATA.T, q = 11, P_ = 23;
const md = (a, n) => ((a % n) + n) % n;
function inv(a, n){ a = md(a, n); for (let x = 1; x < n; x++) if (a * x % n === 1) return x; return null; }
function pw(b, e, n){ let r = 1; for (let i = 0; i < e; i++) r = r * b % n; return r; }
DATA.SUB.forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; if (c === 18) o.selected = true; $("csel").appendChild(o); });
let picked = [[5, 7], [7, 4]];
const X0 = 50, Y0 = 50, S = 44;
function draw(){
  const C = +$("csel").value;
  svg.innerHTML = ""; scDefs();
  const P = [];
  for (let r = 0; r < q; r++) P.push(["text", X0 + r * S + S / 2, Y0 - 10, String(r), {size: 15, anchor: "middle", color: "muted"}]);
  for (let m = 0; m < q; m++) P.push(["text", X0 - 10, Y0 + m * S + S * 0.62, String(m), {size: 15, anchor: "end", color: "muted"}]);
  P.push(["text", X0 + q * S / 2, 18, "r (maszk) →", {size: 15, anchor: "middle"}]);
  P.push(["text", 14, Y0 + q * S / 2, "m ↓", {size: 15, anchor: "middle"}]);
  scDraw(P);
  for (let m = 0; m < q; m++) for (let r = 0; r < q; r++) {
    const on = T[m][r] === C, pk = picked.some(([a, b]) => a === m && b === r);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
    g.setAttribute("aria-label", `m = ${m}, r = ${r}, C = ${T[m][r]}`);
    const rc = document.createElementNS(NS, "rect");
    const a = {x: X0 + r * S, y: Y0 + m * S, width: S, height: S, fill: on ? css("--sc-g2") : css("--bg"), stroke: css("--fg"), "stroke-width": on ? 3 : 0.6};
    for (const k2 in a) rc.setAttribute(k2, a[k2]);
    g.appendChild(rc);
    if (pk) { const r2 = document.createElementNS(NS, "rect"); const b = {x: X0 + r * S + 4, y: Y0 + m * S + 4, width: S - 8, height: S - 8, fill: "none", stroke: css("--hl"), "stroke-width": 2.5, "stroke-dasharray": "5 3"}; for (const k2 in b) r2.setAttribute(k2, b[k2]); g.appendChild(r2); }
    const t = document.createElementNS(NS, "text");
    const ta = {x: X0 + r * S + S / 2, y: Y0 + m * S + S * 0.64, "text-anchor": "middle", "font-size": 16};
    if (on) ta["font-weight"] = "bold";
    for (const k2 in ta) t.setAttribute(k2, ta[k2]);
    t.textContent = T[m][r]; g.appendChild(t);
    const act = () => pick(m, r);
    g.addEventListener("click", act);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
    svg.appendChild(g);
  }
  const n = T.flat().filter(v => v === C).length;
  const lines = [`C = ${C}: ${n} cella (minden m-hez pontosan egy r) – rejtés: C semmit sem árul el m-ről.`];
  let msg = `C = ${C}: ${n} cella világít.`;
  if (picked.length === 2) {
    const [[m, r], [m2, r2]] = picked;
    const c1 = T[m][r], c2 = T[m2][r2];
    if (c1 !== c2) { lines.push(`(${m},${r}) → C = ${c1}, (${m2},${r2}) → C = ${c2}: nem ugyanannak a C-nek a nyitásai.`); msg += " A két cella C-je különbözik."; }
    else if (m === m2) { lines.push("Azonos m: nem két különböző nyitás."); }
    else {
      const dm = m - m2, dr = r2 - r, al = md(md(dm, q) * inv(dr, q), q);
      lines.push(`két nyitás: (m, r) = (${m}, ${r}) és (m', r') = (${m2}, ${r2}), mindkettő C = ${c1}`);
      lines.push(`α = (m − m')·(r' − r)⁻¹ = (${dm})·(${dr})⁻¹ ≡ ${md(dm, q)}·${inv(dr, q)} ≡ ${al} (mod 11)`);
      lines.push(`ellenőrzés: 2^${al} mod 23 = ${pw(2, al, P_)} = h`);
      msg = `(${m},${r}) és (${m2},${r2}) ⇒ α = (${dm < 0 ? "−" + (-dm) : dm})·(${dr < 0 ? "−" + (-dr) : dr})⁻¹ ≡ ${al}. ` + msg;
    }
  } else lines.push(picked.length ? `kijelölve: (${picked[0].join(",")}); válassz még egy cellát.` : "Jelölj ki két cellát.");
  $("der").textContent = lines.join("\n");
  status.textContent = msg;
}
function pick(m, r){ if (picked.length >= 2) picked = []; picked.push([m, r]); draw(); }
const status = $("status");
$("csel").addEventListener("change", draw);
$("clr").addEventListener("click", () => { picked = []; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
