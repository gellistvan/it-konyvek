<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell-állapot: amplitúdók kapunként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kiinduló állapot: <select id="start">
<option value="0" selected>|00⟩</option><option value="1">|01⟩</option><option value="2">|10⟩</option><option value="3">|11⟩</option></select></label>
<button id="meas">Mérés (1000×)</button>
<script>
document.getElementById("start").onchange = e => { HIST = null; setSteps(stepsFor(+e.target.value)); };
document.getElementById("meas").onclick = () => {
  const s = STEPS[k], p = s.v.map(a => a * a), c = [0, 0, 0, 0];
  const buf = new Uint32Array(1000); crypto.getRandomValues(buf);
  buf.forEach(u => { let x = u / 4294967296, i = 0; while (i < 3 && x >= p[i]) { x -= p[i]; i++; } c[i]++; });
  HIST = {k: k, start: s.start, c: c}; show(k);
  status.textContent = s.msg + ` — mérés: ${B.map((b, i) => b + ": " + c[i]).join(", ")}`;
};
window.addEventListener("load", () => { document.body.dataset.selftest = JSON.stringify(stepsFor(0)) === JSON.stringify(STEPS) ? "ok" : "mismatch"; });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három oszlopdiagram: kezdetben csak |00⟩ amplitúdója 1; a H után |00⟩ és |10⟩ 0,707; a CNOT után |00⟩ és |11⟩ 0,707."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított állapotvektor, nem mérés; a mérési hisztogram a böngészőben szimulált (crypto.getRandomValues). Bázissorrend: |00⟩, |01⟩, |10⟩, |11⟩, az első qubit a bal oldali.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. lépés (kezdőállapot): |ψ⟩ = 1,000|00⟩", "line": 0, "k": 0, "v": [1.0, 0.0, 0.0, 0.0], "start": 0}, {"msg": "1. lépés (H ⊗ I után): |ψ⟩ = 0,707|00⟩ + 0,707|10⟩", "line": 1, "k": 1, "v": [0.707, 0.0, 0.707, 0.0], "start": 0}, {"msg": "2. lépés (CNOT után): |ψ⟩ = 0,707|00⟩ + 0,707|11⟩", "line": 2, "k": 2, "v": [0.707, 0.0, 0.0, 0.707], "start": 0}];
const CODE = ["|ψ₀⟩ = kiinduló bázisállapot", "|ψ₁⟩ = (H ⊗ I)|ψ₀⟩        # H az első qubiten", "|ψ₂⟩ = CNOT|ψ₁⟩           # vezérlő: 1. qubit, cél: 2. qubit"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const B = ["|00⟩", "|01⟩", "|10⟩", "|11⟩"];
let HIST = null;
function elp(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);parent.appendChild(e);return e;}
function r3(x){return Math.round(x * 1000) / 1000;}
function hu3(x){return x.toFixed(3).replace(".", ",").replace("-", "−");}
function ketStr(v){const p = []; v.forEach((a, i) => { if (Math.abs(a) < 1e-9) return;
  p.push((a < 0 ? "− " : (p.length ? "+ " : "")) + Math.abs(a).toFixed(3).replace(".", ",") + B[i]); }); return p.join(" ");}
function stepsFor(start){
  const h = Math.SQRT1_2; let v = [0, 0, 0, 0]; v[start] = 1; const out = [v.map(r3)];
  v = [h * (v[0] + v[2]), h * (v[1] + v[3]), h * (v[0] - v[2]), h * (v[1] - v[3])]; out.push(v.map(r3));
  v = [v[0], v[1], v[3], v[2]]; out.push(v.map(r3));
  const names = ["kezdőállapot", "H ⊗ I után", "CNOT után"];
  return out.map((s, k) => ({msg: `${k}. lépés (${names[k]}): |ψ⟩ = ` + ketStr(s), line: k, k: k, v: s, start: start}));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 350"); svg.innerHTML = "";
  const fg = css("--fg");
  // áramkör
  [[40, "q₁"], [90, "q₂"]].forEach(([y, l], i) => { el("line", {x1: 70, y1: y, x2: 330, y2: y, stroke: css("--line")});
    el("text", {x: 62, y: y + 5, "text-anchor": "end", "font-size": 14}, `${l}: |${["00","01","10","11"][s.start][i]}⟩`); });
  el("rect", {x: 130, y: 22, width: 36, height: 36, fill: s.k >= 1 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": s.k === 1 ? 3 : 1.2});
  el("text", {x: 148, y: 46, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, "H");
  el("line", {x1: 250, y1: 40, x2: 250, y2: 90, stroke: css("--line"), "stroke-width": s.k === 2 ? 3 : 1.2});
  el("circle", {cx: 250, cy: 40, r: 5, fill: css("--line")});
  el("circle", {cx: 250, cy: 90, r: 13, fill: s.k >= 2 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": s.k === 2 ? 3 : 1.2});
  el("line", {x1: 237, y1: 90, x2: 263, y2: 90, stroke: css("--line")}); el("line", {x1: 250, y1: 77, x2: 250, y2: 103, stroke: css("--line")});
  // amplitúdók
  const y0 = 230, sc = 100;
  el("line", {x1: 40, y1: y0, x2: 330, y2: y0, stroke: css("--line")});
  s.v.forEach((a, i) => { const x = 55 + i * 70, h = a * sc;
    el("rect", {x: x, y: a >= 0 ? y0 - h : y0, width: 46, height: Math.abs(h), fill: a >= 0 ? "url(#hp)" : "url(#hn)", stroke: css("--line")});
    el("text", {x: x + 23, y: a >= 0 ? y0 - h - 6 : y0 - h + 16, "text-anchor": "middle", "font-size": 13}, hu3(a));
    el("text", {x: x + 23, y: 340, "text-anchor": "middle", "font-size": 13}, B[i]); });
  el("text", {x: 40, y: 120, "font-size": 12, fill: css("--muted")}, "amplitúdó (sraffozott: +, pontozott: −)");
  const defs = el("defs", {});
  const p1 = elp("pattern", {id: "hp", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, defs);
  elp("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--fg"), "stroke-width": 1.5}, p1);
  const p2 = elp("pattern", {id: "hn", width: 5, height: 5, patternUnits: "userSpaceOnUse"}, defs);
  elp("circle", {cx: 2.5, cy: 2.5, r: 1.1, fill: css("--fg")}, p2);
  // mérési hisztogram
  el("text", {x: 380, y: 30, "font-size": 13, "font-weight": "bold"}, "Szimulált mérés (1000×)");
  el("line", {x1: 380, y1: y0, x2: 630, y2: y0, stroke: css("--line")});
  if (HIST && HIST.k === s.k && HIST.start === s.start) {
    HIST.c.forEach((c, i) => { const x = 392 + i * 60, h = c / 1000 * 220;
      el("rect", {x: x, y: y0 - h, width: 40, height: h, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: x + 20, y: y0 - h - 6, "text-anchor": "middle", "font-size": 13}, String(c));
      el("text", {x: x + 20, y: 340, "text-anchor": "middle", "font-size": 13}, B[i]); });
  } else el("text", {x: 380, y: 140, "font-size": 12, fill: css("--muted")}, "Nyomd meg a „Mérés” gombot.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
