<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECDH a 13 elemű ciklikus csoportban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a (1–12): <input id="ain" type="number" min="1" max="12" value="6" style="width:4em"></label><label>b (1–12): <input id="bin" type="number" min="1" max="12" value="4" style="width:4em"></label><button id="go">Újraszámol</button><span id="emsg" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 13 elemű ciklikus csoport körön; Alice B-ugrásai és Bob A-ugrásai ugyanabba a pontba, a [11]G = (5, 9) pontba vezetnek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">y² = x³ + x + 6 (mod 11), G = (2, 7), rend 13 (a fejezet pontlistája). Egy ugrás egy pontösszeadás; a valódi implementáció double-and-add-del számol. Oktatási játékpélda.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"who": "", "path": [], "msg": "Nyilvános: A = [6]G = (7, 9) (Alice), B = [4]G = (10, 2) (Bob). Alice titka a = 6, Bobé b = 4.", "line": -1, "a": 6, "b": 4, "pa": [], "pb": []}, {"who": "A", "pa": [0, 4], "pb": [], "line": 0, "msg": "Alice 1. ugrás (+B = +4): [1]B = [1·4 mod 13]G = [4]G = (10, 2)", "a": 6, "b": 4}, {"who": "A", "pa": [0, 4, 8], "pb": [], "line": 0, "msg": "Alice 2. ugrás (+B = +4): [2]B = [2·4 mod 13]G = [8]G = (3, 5)", "a": 6, "b": 4}, {"who": "A", "pa": [0, 4, 8, 12], "pb": [], "line": 0, "msg": "Alice 3. ugrás (+B = +4): [3]B = [3·4 mod 13]G = [12]G = (2, 4)", "a": 6, "b": 4}, {"who": "A", "pa": [0, 4, 8, 12, 3], "pb": [], "line": 0, "msg": "Alice 4. ugrás (+B = +4): [4]B = [4·4 mod 13]G = [3]G = (8, 3)", "a": 6, "b": 4}, {"who": "A", "pa": [0, 4, 8, 12, 3, 7], "pb": [], "line": 0, "msg": "Alice 5. ugrás (+B = +4): [5]B = [5·4 mod 13]G = [7]G = (7, 2)", "a": 6, "b": 4}, {"who": "A", "pa": [0, 4, 8, 12, 3, 7, 11], "pb": [], "line": 0, "msg": "Alice 6. ugrás (+B = +4): [6]B = [6·4 mod 13]G = [11]G = (5, 9)", "a": 6, "b": 4}, {"who": "B", "pa": [0, 4, 8, 12, 3, 7, 11], "pb": [0, 6], "line": 1, "msg": "Bob 1. ugrás (+A = +6): [1]A = [1·6 mod 13]G = [6]G = (7, 9)", "a": 6, "b": 4}, {"who": "B", "pa": [0, 4, 8, 12, 3, 7, 11], "pb": [0, 6, 12], "line": 1, "msg": "Bob 2. ugrás (+A = +6): [2]A = [2·6 mod 13]G = [12]G = (2, 4)", "a": 6, "b": 4}, {"who": "B", "pa": [0, 4, 8, 12, 3, 7, 11], "pb": [0, 6, 12, 5], "line": 1, "msg": "Bob 3. ugrás (+A = +6): [3]A = [3·6 mod 13]G = [5]G = (3, 6)", "a": 6, "b": 4}, {"who": "B", "pa": [0, 4, 8, 12, 3, 7, 11], "pb": [0, 6, 12, 5, 11], "line": 1, "msg": "Bob 4. ugrás (+A = +6): [4]A = [4·6 mod 13]G = [11]G = (5, 9). Közös pont: [6]B = [4]A = [24]G, 24 ≡ 11 (mod 13) → S = (5, 9).", "a": 6, "b": 4}];
const CODE = ["S_A = mul(a, B)      # Alice: a-szor adja össze B-t", "S_B = mul(b, A)      # Bob: b-szer adja össze A-t", "assert S_A == S_B == mul(a * b % 13, G)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const PTS = ["O", "(2, 7)", "(5, 2)", "(8, 3)", "(10, 2)", "(3, 6)", "(7, 9)", "(7, 2)", "(3, 5)", "(10, 9)", "(8, 8)", "(5, 9)", "(2, 4)"];
function fpi(i){ return i === 0 ? "O" : PTS[i]; }
function traceJS(aa, bb){
  const st = [{who: "", pa: [], pb: [], line: -1, a: aa, b: bb, msg: "Nyilvános: A = [" + aa + "]G = " + fpi(aa) + " (Alice), B = [" + bb + "]G = " + fpi(bb) + " (Bob). Alice titka a = " + aa + ", Bobé b = " + bb + "."}];
  let cur = 0, path = [0];
  for (let j = 1; j <= aa; j++){ cur = (cur + bb) % 13; path.push(cur);
    st.push({who: "A", pa: path.slice(), pb: [], line: 0, a: aa, b: bb, msg: "Alice " + j + ". ugrás (+B = +" + bb + "): [" + j + "]B = [" + j + "·" + bb + " mod 13]G = [" + cur + "]G = " + fpi(cur)}); }
  const pa = path.slice(); cur = 0; path = [0];
  for (let j = 1; j <= bb; j++){ cur = (cur + aa) % 13; path.push(cur);
    st.push({who: "B", pa: pa, pb: path.slice(), line: 1, a: aa, b: bb, msg: "Bob " + j + ". ugrás (+A = +" + aa + "): [" + j + "]A = [" + j + "·" + aa + " mod 13]G = [" + cur + "]G = " + fpi(cur)}); }
  const s = aa * bb % 13;
  st[st.length - 1].msg += ". Közös pont: [" + aa + "]B = [" + bb + "]A = [" + (aa * bb) + "]G, " + (aa * bb) + " ≡ " + s + " (mod 13) → S = " + fpi(s) + ".";
  return st;
}
document.getElementById("go").onclick = () => {
  const aa = parseInt(document.getElementById("ain").value, 10), bb = parseInt(document.getElementById("bin").value, 10);
  const em = document.getElementById("emsg");
  if (!(aa >= 1 && aa <= 12 && bb >= 1 && bb <= 12)) { em.textContent = "a és b legyen 1 és 12 között."; return; }
  em.textContent = ""; setSteps(traceJS(aa, bb));
};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 400");
  const cx = 250, cy = 200, R = 140;
  const pt = (i, r) => { const ang = Math.PI / 2 - 2 * Math.PI * i / 13; return [cx + r * Math.cos(ang), cy - r * Math.sin(ang)]; };
  el("circle", {cx: cx, cy: cy, r: R, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 4"});
  const defs = el("defs", {});
  const mk = document.createElementNS(NS, "marker");
  [["id", "ah"], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "7"], ["markerHeight", "7"], ["orient", "auto"]].forEach(([k2, v]) => mk.setAttribute(k2, v));
  const pth = document.createElementNS(NS, "path"); pth.setAttribute("d", "M0,0 L10,5 L0,10 z"); pth.setAttribute("fill", css("--fg")); mk.appendChild(pth); defs.appendChild(mk);
  function arc(i, j, dash, bend, last){
    const [x1, y1] = pt(i, R), [x2, y2] = pt(j, R);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
    const qx = mx - bend * dy, qy = my + bend * dx;
    const L = Math.hypot(dx, dy) || 1, sh = 12 / L;
    const sx = x1 + (qx - x1) * sh * 1.0, sy = y1 + (qy - y1) * sh, ex = x2 + (qx - x2) * sh, ey = y2 + (qy - y2) * sh;
    el("path", {d: `M${sx},${sy} Q${qx},${qy} ${ex},${ey}`, fill: "none", stroke: last ? css("--hl2") : css("--fg"), "stroke-width": last ? 3 : 1.6, "stroke-dasharray": dash ? "7 4" : "none", "marker-end": "url(#ah)"});
  }
  s.pa.forEach((v, j) => { if (j) arc(s.pa[j - 1], v, false, 0.12, s.who === "A" && j === s.pa.length - 1); });
  s.pb.forEach((v, j) => { if (j) arc(s.pb[j - 1], v, true, -0.12, s.who === "B" && j === s.pb.length - 1); });
  const S = s.a * s.b % 13;
  for (let i = 0; i < 13; i++){
    const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 36);
    if (i === S && s.msg.indexOf("Közös") >= 0) el("circle", {cx: x, cy: y, r: 15, fill: "none", stroke: css("--fg"), "stroke-width": 2});
    el("circle", {cx: x, cy: y, r: 10, fill: (i === s.a || i === s.b) ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: lx, y: ly - 2, "text-anchor": "middle", "font-size": 12, "font-weight": (i === s.a || i === s.b) ? "bold" : "normal"}, i === 0 ? "O" : "[" + i + "]G");
    if (i) el("text", {x: lx, y: ly + 12, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, PTS[i]);
  }
  const ya = 60;
  el("text", {x: 470, y: ya, "font-size": 14, "font-weight": "bold"}, "Alice (a = " + s.a + ")");
  el("line", {x1: 470, y1: ya + 14, x2: 510, y2: ya + 14, stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: 518, y: ya + 18, "font-size": 12}, "[a]B: ugrás +" + s.b);
  el("text", {x: 470, y: ya + 40, "font-size": 12}, "út: " + s.pa.map(fpiIdx).join(" → "));
  el("text", {x: 470, y: ya + 90, "font-size": 14, "font-weight": "bold"}, "Bob (b = " + s.b + ")");
  el("line", {x1: 470, y1: ya + 104, x2: 510, y2: ya + 104, stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: 518, y: ya + 108, "font-size": 12}, "[b]A: ugrás +" + s.a);
  el("text", {x: 470, y: ya + 130, "font-size": 12}, "út: " + s.pb.map(fpiIdx).join(" → "));
  el("text", {x: 470, y: ya + 190, "font-size": 12}, "szürke kör: A = [" + s.a + "]G, B = [" + s.b + "]G");
  el("text", {x: 470, y: ya + 210, "font-size": 12}, "dupla kör: S = [ab mod 13]G");
}
function fpiIdx(i){ return i === 0 ? "O" : String(i); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
